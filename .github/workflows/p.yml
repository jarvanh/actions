name: p

on:
  schedule:
    # - cron: "0 2,8,14,20 * * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:
  watch:
    # types: started

jobs:
  build:
    concurrency: p-singleton
    runs-on: ubuntu-latest
    steps:
      # - name: Check Workflow Status
      #   run: |
      #     workflow_runs=$(curl -s -X GET \
      #       -H "Accept: application/vnd.github.v3+json" \
      #       -H "Authorization: Bearer ${{ secrets.PAT }}" \
      #       "https://api.github.com/repos/${{ github.repository }}/actions/runs")
          
      #     isRunning=$(echo "$workflow_runs" | jq '.workflow_runs[] | select(.name == "p" and .status == "in_progress")')
          
      #     if [[ -n $isRunning ]]; then
      #       echo "Another workflow is already running. Aborting current workflow."
      #       exit 0
      #     else
      #       echo "No running workflows found. Continuing with the workflow execution."
      #     fi
      - uses: actions/checkout@v7
      - name: rclone-install
        run: |
          set -e
          # 安装 rclone：GitHub Releases 直下 .deb，失败回退 rclone.org 安装脚本
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          # 写配置 + 持久化：secret 起步 → 掩码 → Dropbox 恢复优先 → 有效性检查 → 同步回 Dropbox
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config
      - name: rclone-run
        run: |
          # 本工作流不使用挂载：/dropbox 只是普通本地目录。
          # vaultwarden 的 SQLite 数据（dropbox:self-hosted/vaultwarden）在启动前
          # 整体拉取到 /dropbox/self-hosted/vaultwarden（见下方"数据拉取"步骤），
          # 停止后 sync 回 Dropbox——SQLite 不能跑在 rclone FUSE 上，必须本地化。
          echo "==========onedrive==========="
          rclone lsf onedrive:
          echo "==========dropbox==========="
          rclone lsf dropbox:
      - name: Check if the tunnel is running
        env:
          TUNNEL_NAME: "p" # 替换为你的隧道名称
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          sudo mkdir -p ~/.cloudflared/
          sudo chown -R runner:runner ~/.cloudflared
          # rclone 以 runner 身份运行（与挂载步骤同）：root 运行会在 token 刷新时回写 rclone.conf 属主
          rclone copy dropbox:self-hosted/.cloudflared ~/.cloudflared -vv

          # 获取隧道列表
          OUTPUT=$(cloudflared tunnel list)
          
          # 查找目标隧道的行
          TUNNEL_LINE=$(echo "$OUTPUT" | grep -w "$TUNNEL_NAME")
          if [ -z "$TUNNEL_LINE" ]; then
            echo "The tunnel '$TUNNEL_NAME' does not exist. Proceeding."
            exit 31
          fi
  
          # 提取 CONNECTIONS 列并检查是否为空
          CONNECTIONS=$(echo "$TUNNEL_LINE" | awk '{if (NF>=4) print $4; else print "-"}')
          if [ "$CONNECTIONS" == "-" ]; then
            echo "The tunnel '$TUNNEL_NAME' exists but has no active connections. Proceeding."
          else
            echo "The tunnel '$TUNNEL_NAME' is running with connections: $CONNECTIONS. Stopping actions."
            exit 0
          fi
      # ===== 数据拉取（容器启动前）=====
      # 把 Dropbox 上的 vaultwarden 数据拉到本地真实目录（路径与旧 FUSE 挂载一致，
      # VAULTWARDEN secret 里的 -v /dropbox/self-hosted/vaultwarden:/data 无需修改）。
      # 找不到 db.sqlite3 说明远端路径不对或数据为空：直接报错终止——宁可不开服务，
      # 也绝不启动空库（老账号全部失效），更不会在后续步骤回传空数据覆盖远端。
      - name: Restore vaultwarden data from Dropbox
        run: |
          set -euo pipefail
          VW_DATA=/dropbox/self-hosted/vaultwarden
          sudo mkdir -p "$VW_DATA"
          sudo chown -R runner:runner /dropbox
          rclone copy "dropbox:self-hosted/vaultwarden" "$VW_DATA" -P --retries 5 --retries-sleep 10s --low-level-retries 20
          if [ ! -s "$VW_DATA/db.sqlite3" ]; then
            echo "::error::远端 dropbox:self-hosted/vaultwarden 未找到 db.sqlite3，数据拉取异常，终止运行（不启动空库、不回传）"
            exit 1
          fi
          touch /tmp/VW_DATA_PULLED
          db_md5=$(md5sum "$VW_DATA/db.sqlite3" | awk '{print $1}')
          echo "数据拉取完成，db.sqlite3 拉取时指纹: $db_md5"
          echo "VW_DB_MD5_PULL=$db_md5" >> "$GITHUB_ENV"
          ls -la "$VW_DATA"
      - name: Run vaultwarden container
        run: ${{ secrets.VAULTWARDEN }}
      - name: Verify container is running
        run: docker ps    
      - name: run cloudflared
        run: |
          cloudflared tunnel route dns p p.'${{ secrets.VD }}'.eu.org
          nohup cloudflared tunnel run --url http://127.0.0.1:5600 p &
      - name: sleep
        run: |
          sleep 350m          
      - name: Stop
        run: |
          docker stop vaultwarden
          sleep 1m 
          echo "Stopping GitHub Actions"
      # ===== 数据回传（失败/取消也执行）=====
      # docker stop（SIGTERM）让 vaultwarden 优雅停机，SQLite 干净关闭、-wal/-shm 合并。
      # 仅在"数据拉取完成"时回传：拉取失败/未执行时绝不 sync，防止空目录覆盖远端。
      - name: "Persist: vaultwarden 数据回传"
        if: ${{ always() }}
        run: |
          set -uo pipefail
          VW_DATA=/dropbox/self-hosted/vaultwarden
          if [ ! -f /tmp/VW_DATA_PULLED ]; then
            echo "::warning::数据拉取未完成（/tmp/VW_DATA_PULLED 不存在），跳过回传以保全远端"
            exit 0
          fi
          # 幂等停容器：前面步骤失败时容器可能仍在运行，先停掉再回传
          docker stop -t 60 vaultwarden 2>/dev/null || true
          sleep 10
          # vaultwarden 容器以 root 写数据，回传前放开读权限给 runner 身份的 rclone
          sudo chmod -R a+rX "$VW_DATA" 2>/dev/null || true
          echo "回传前 db 指纹: $(md5sum "$VW_DATA/db.sqlite3" 2>/dev/null | awk '{print $1}' || echo none)（拉取时 ${VW_DB_MD5_PULL:-none}）"
          rclone sync "$VW_DATA" "dropbox:self-hosted/vaultwarden" -P --retries 3
          echo "vaultwarden 数据已回传 dropbox:self-hosted/vaultwarden"
