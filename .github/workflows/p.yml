name: p

on:
  schedule:
    # - cron: "0 2,8,14,20 * * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:
  watch:
    # types: started

jobs:
  build:
    concurrency: p-singleton
    runs-on: ubuntu-latest
    steps:
      # - name: Check Workflow Status
      #   run: |
      #     workflow_runs=$(curl -s -X GET \
      #       -H "Accept: application/vnd.github.v3+json" \
      #       -H "Authorization: Bearer ${{ secrets.PAT }}" \
      #       "https://api.github.com/repos/${{ github.repository }}/actions/runs")
          
      #     isRunning=$(echo "$workflow_runs" | jq '.workflow_runs[] | select(.name == "p" and .status == "in_progress")')
          
      #     if [[ -n $isRunning ]]; then
      #       echo "Another workflow is already running. Aborting current workflow."
      #       exit 0
      #     else
      #       echo "No running workflows found. Continuing with the workflow execution."
      #     fi
      - uses: actions/checkout@v7
      - name: rclone-install
        run: |
          set -e
          # 安装 rclone：GitHub Releases 直下 .deb，失败回退 rclone.org 安装脚本
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          # 写配置 + 持久化：secret 起步 → 掩码 → Dropbox 恢复优先 → 有效性检查 → 同步回 Dropbox
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config
      - name: rclone-run
        run: |
          # 本工作流不使用挂载：/dropbox 只是普通本地目录。
          # Dropbox 上的 self-hosted/bitwarden/ 整个目录（bitwarden-data 主数据 +
          # 其他配置/目录）在启动前拉取到 /dropbox/self-hosted/bitwarden/（见下方
          # "数据拉取"步骤），停止后 sync 回 Dropbox——SQLite 不能跑在 FUSE 上，必须本地化。
          echo "==========onedrive==========="
          rclone lsf onedrive:
          echo "==========dropbox==========="
          rclone lsf dropbox:
      - name: Check if the tunnel is running
        env:
          TUNNEL_NAME: "p" # 替换为你的隧道名称
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          sudo mkdir -p ~/.cloudflared/
          sudo chown -R runner:runner ~/.cloudflared
          # rclone 以 runner 身份运行（与挂载步骤同）：root 运行会在 token 刷新时回写 rclone.conf 属主
          rclone copy dropbox:self-hosted/.cloudflared ~/.cloudflared -vv

          # 获取隧道列表
          OUTPUT=$(cloudflared tunnel list)
          
          # 查找目标隧道的行
          TUNNEL_LINE=$(echo "$OUTPUT" | grep -w "$TUNNEL_NAME")
          if [ -z "$TUNNEL_LINE" ]; then
            echo "The tunnel '$TUNNEL_NAME' does not exist. Proceeding."
            exit 31
          fi
  
          # 提取 CONNECTIONS 列并检查是否为空
          CONNECTIONS=$(echo "$TUNNEL_LINE" | awk '{if (NF>=4) print $4; else print "-"}')
          if [ "$CONNECTIONS" == "-" ]; then
            echo "The tunnel '$TUNNEL_NAME' exists but has no active connections. Proceeding."
          else
            echo "The tunnel '$TUNNEL_NAME' is running with connections: $CONNECTIONS. Stopping actions."
            exit 0
          fi
      # ===== 数据拉取（容器启动前）=====
      # 把 Dropbox 上的 self-hosted/bitwarden/ 整个目录拉到本地真实目录（路径与旧
      # FUSE 挂载一致，VAULTWARDEN secret 里的 -v /dropbox/self-hosted/bitwarden/
      # bitwarden-data:/data 无需修改；目录下其他配置/文件一并拉取、一并回传）。
      # bitwarden-data/ 下找不到 db.sqlite3 说明远端数据异常：直接报错终止——宁可不开
      # 服务，也绝不启动空库（老账号全部失效），更不会在后续步骤回传空数据覆盖远端。
      - name: Restore bitwarden data from Dropbox
        run: |
          set -euo pipefail
          VW_DIR=/dropbox/self-hosted/bitwarden
          sudo mkdir -p "$VW_DIR"
          sudo chown -R runner:runner /dropbox
          rclone copy "dropbox:self-hosted/bitwarden" "$VW_DIR" -P --retries 5 --retries-sleep 10s --low-level-retries 20
          if [ ! -s "$VW_DIR/bitwarden-data/db.sqlite3" ]; then
            echo "::error::远端 dropbox:self-hosted/bitwarden/bitwarden-data 未找到 db.sqlite3，数据拉取异常，终止运行（不启动空库、不回传）"
            exit 1
          fi
          touch /tmp/VW_DATA_PULLED
          db_md5=$(md5sum "$VW_DIR/bitwarden-data/db.sqlite3" | awk '{print $1}')
          echo "数据拉取完成，db.sqlite3 拉取时指纹: $db_md5"
          echo "VW_DB_MD5_PULL=$db_md5" >> "$GITHUB_ENV"
          ls -la "$VW_DIR" "$VW_DIR/bitwarden-data"
      - name: Run vaultwarden container
        run: ${{ secrets.VAULTWARDEN }}
      - name: Verify container is running
        run: docker ps    
      - name: run cloudflared
        run: |
          cloudflared tunnel route dns p p.'${{ secrets.VD }}'.eu.org
          nohup cloudflared tunnel run --url http://127.0.0.1:5600 p &
      - name: sleep
        run: |
          sleep 350m          
      - name: Stop
        run: |
          docker stop vaultwarden
          sleep 1m 
          echo "Stopping GitHub Actions"
      # ===== 数据回传（失败/取消也执行）=====
      # docker stop（SIGTERM）让 vaultwarden 优雅停机，SQLite 干净关闭、-wal/-shm 合并。
      # 仅在"数据拉取完成"时回传：拉取失败/未执行时绝不 sync，防止空目录覆盖远端。
      - name: "Persist: vaultwarden 数据回传"
        if: ${{ always() }}
        run: |
          set -uo pipefail
          VW_DIR=/dropbox/self-hosted/bitwarden
          if [ ! -f /tmp/VW_DATA_PULLED ]; then
            echo "::warning::数据拉取未完成（/tmp/VW_DATA_PULLED 不存在），跳过回传以保全远端"
            exit 0
          fi
          # 幂等停容器：前面步骤失败时容器可能仍在运行，先停掉再回传
          docker stop -t 60 vaultwarden 2>/dev/null || true
          sleep 10
          # vaultwarden 容器以 root 写数据，回传前放开读权限给 runner 身份的 rclone
          sudo chmod -R a+rX "$VW_DIR" 2>/dev/null || true
          echo "回传前 db 指纹: $(md5sum "$VW_DIR/bitwarden-data/db.sqlite3" 2>/dev/null | awk '{print $1}' || echo none)（拉取时 ${VW_DB_MD5_PULL:-none}）"
          rclone sync "$VW_DIR" "dropbox:self-hosted/bitwarden" -P --retries 3
          echo "bitwarden 整个目录已回传 dropbox:self-hosted/bitwarden"
          # ===== 压缩备份到 OneDrive =====
          # 风格与 self-hosted_backup.yml 一致：固定文件名直接覆盖 onedrive:backup/ 下旧包
          ARCHIVE="/tmp/bitwarden_latest.tar.gz"
          rm -f "$ARCHIVE"
          tar -czf "$ARCHIVE" -C / "dropbox/self-hosted/bitwarden"
          archive_bytes=$(stat -c%s "$ARCHIVE")
          if [ -z "$archive_bytes" ] || [ "$archive_bytes" -le 0 ]; then
            echo "::error::压缩包异常（空文件），跳过上传 OneDrive"
            exit 0
          fi
          tar -tzf "$ARCHIVE" >/dev/null
          archive_human=$(numfmt --to=iec-i --suffix=B "$archive_bytes" 2>/dev/null || echo "${archive_bytes}B")
          echo "压缩包校验通过: bitwarden_latest.tar.gz (${archive_human})"
          rclone copy "$ARCHIVE" "onedrive:backup/" -P --retries 3
          rm -f "$ARCHIVE"
          echo "已上传 onedrive:backup/bitwarden_latest.tar.gz"
