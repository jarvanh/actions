name: openclaw-handoff-test
# ── 交接协议实测（2026-11-10，Phase 1 验收用）──────────────────────────────
# 只做两件事：workflow_dispatch 起「旧轮」，由它用真 tick.sh 再触发「继任者」，
# 两台真 runner 上走完整协议（真 tailscale 互联、真 rsync daemon、真 Dropbox
# 标记、真 sqlite 校验），全程约 12-15 分钟。
#
# 与生产（openclaw.yml）的隔离：一个字节都不共享 ——
#   · 并发组 openclaw-handoff-test-*（生产是 openclaw-serve / openclaw-handoff-*）
#   · 标记根 dropbox:self-hosted/handoff-test/（生产是 self-hosted/handoff/）
#   · tailnet 节点名 handofftest-old/new-<run_id>（生产是 openclaw / openclaw-next）
#   · 只写本 VM 的 ~/.openclaw / ~/.zcode（一次性 runner，随 job 回收）
# 因此**不会**触发生产的 guard（它只查 openclaw.yml 的 run）、不会抢主机名、
# 不会覆盖生产的任何云包。
#
# 触发方式（手动）：
#   gh workflow run openclaw-handoff-test.yml --repo jarvanh/actions --ref main
# 看结果：旧轮日志里的「✅ 交接成功 + 停机→serving Xs」，继任者日志里的「验收」段。
on:
  workflow_dispatch:
    inputs:
      # 继任者标记：由旧轮的 tick.sh 传入（= 旧轮 run id）。手动触发时留空。
      handoff_of:
        description: "继任轮标记（tick.sh 自动填，手动留空）"
        type: string
        required: false
        default: ""
      # 占位：tick.sh 会无条件传 -f ai_backend=<解析值>，这里必须声明否则被拒
      ai_backend:
        description: "占位（测试不消费）"
        type: string
        required: false
        default: "auto"

permissions:
  contents: read
  actions: write

jobs:
  handoff-test:
    # 与生产同构的动态组：旧轮占 serve 键、继任者用 <run_id> 专属键，两者合法并存
    concurrency:
      group: ${{ inputs.handoff_of != '' && format('openclaw-handoff-test-{0}', github.run_id) || 'openclaw-handoff-test-serve' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      HANDOFF_OF: ${{ inputs.handoff_of || '' }}
      # 测试隔离三件套（默认值在生产脚本里，这里只覆盖）
      HANDOFF_REMOTE_DIR: dropbox:self-hosted/handoff-test
      HANDOFF_WORKFLOW: openclaw-handoff-test.yml
      # 名字回收守护的目标恒为 openclaw —— 测试绝不能跑它（会与生产在服务中的节点抢名）
      HANDOFF_SKIP_RECLAIM: "1"
      # 压缩窗口：T-8min 触发继任者、T-4min 就绪看门狗（生产是 T-12/T-4）
      HANDOFF_TRIGGER_BEFORE_MIN: "8"
      HANDOFF_READY_DEADLINE_MIN: "4"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: rclone (install + config)
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config

      - name: Tailscale (真 tailnet，独立节点名)
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4（同生产）
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          hostname: handofftest-${{ inputs.handoff_of != '' && 'new' || 'old' }}-${{ github.run_id }}

      - name: 连通性自检（tailscale IP + 节点名）
        run: |
          set -u
          IP="$( { tailscale ip -4 2>/dev/null || sudo -n tailscale ip -4 2>/dev/null; } | head -n1 )"
          echo "tailscale IP: ${IP:-<none>}"
          [ -n "${IP:-}" ] || { echo "::error::tailscale 未就绪"; exit 1; }
          tailscale status 2>/dev/null | head -5 || true

      - name: 旧轮（serving → 交出）
        if: ${{ inputs.handoff_of == '' }}
        run: bash -eo pipefail "$GITHUB_WORKSPACE/.github/scripts/handoff/test/old-mode.sh"

      - name: 继任者（恢复基座 → 接管 → 验收）
        if: ${{ inputs.handoff_of != '' }}
        run: bash -eo pipefail "$GITHUB_WORKSPACE/.github/scripts/handoff/test/new-mode.sh"

      - name: 汇总（失败时也打印，便于定位）
        if: ${{ always() }}
        run: |
          echo "mode=$([ -n "${HANDOFF_OF}" ] && echo 继任者 || echo 旧轮)"
          echo "---- old.json ----"; rclone cat "${HANDOFF_REMOTE_DIR}/old.json" 2>/dev/null || echo "(无)"
          echo "---- new.json ----"; rclone cat "${HANDOFF_REMOTE_DIR}/new.json" 2>/dev/null || echo "(无)"
          echo "---- 本机状态目录 ----"; ls -la /tmp/openclaw-handoff/ 2>/dev/null || true
