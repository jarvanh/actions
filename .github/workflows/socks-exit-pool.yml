name: socks-exit-pool

# 为什么要有它（2026-10-28）：
#   主人要把免费订阅（234.qzz.io）的 SOCKS5 当 edgetunnel 出口用，让 YouTube 稳定判区。
#   实测结论定了设计：这批节点 1 小时换血 93%，手钉进 KV 必死；而 edgetunnel 支持
#   path 级出口（/socks5://host:port 全局形），所以改成「定时测活 → 重新生成节点」，
#   客户端每次拉订阅拿到的都是当下能用的。产物写独立私有 Gist 文件 socks-exit.yaml，
#   与 subs-check 每 5 分钟同步的 all.yaml 分开，避免两边互相覆盖。
#
# 为什么是 10 分钟：源节点按小时漂，10 分钟足够跟上；再密没有收益，且 Actions 定时本身有延迟。

on:
  schedule:
    # 源节点按小时漂移，15 分钟足够跟上；仓库约定不用 */5（会被限流，见 docs/self-retrigger.md）
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency: socks-exit-pool

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装依赖
        run: |
          # ubuntu-24.04 镜像自带 PyYAML；缺失时才装（PEP 668 需 --break-system-packages）
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyyaml

      - name: 抓源测活并生成节点
        env:
          # 基座 = subs-check 的 all.yaml（节点名带测速/IP风险/解锁标签）；出口固定取 qzz 源 socks5
          SUBS_CHECK_GIST_ID: ${{ secrets.SUBS_CHECK_GIST_ID }}
        run: python3 .github/scripts/socks-exit/build_socks_exit.py --out out

      - name: 更新 Gist
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          GIST_ID: ${{ secrets.SOCKS_EXIT_GIST_ID }}
        # 发布经 gist_publish.py：v3 产物 675KB，jq --arg 传参会撞 ARG_MAX
        # （run 40636213832 实证），改走文件/内存流
        run: python3 .github/scripts/socks-exit/gist_publish.py out/socks-exit.yaml
