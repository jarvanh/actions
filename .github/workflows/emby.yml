name: emby

# 架构：两种播放链路，⚠️ 命名反直觉，别按字面理解：
#   - 302（默认）：cloudflared → ge2o:8095 → Emby:8096，ge2o 把 /onedrive/% 媒体路径换成
#     OpenList 签出的 OneDrive 直链并返回 302/307，播放器最终直接向 OneDrive 拉流，
#     视频流不经过 runner（本地挂载仅承载扫描/探测流量）。
#     路径换算约束（2026-09-01 修过一次静默回源的坑）：rclone 挂载根 = OpenList 存储根 =
#     网盘根，Emby 路径 /onedrive/3/... 与 OpenList /onedrive/3/... 原样一致，ge2o 靠
#     emby2openlist 的 /onedrive:/onedrive 原样映射，绝不能给 ge2o 配 mount-path（会剥前缀
#     导致映射永不命中，兜底重试又丢二级目录，只能回源中转）。启动探活/watchdog 里有
#     "Emby 库目录同路径 fs/get"映射探针，换算断了会告警并回退 direct。
#   - direct：cloudflared → Emby:8096，视频流经 runner 中转到网盘，行为与旧版一致。
#     "direct" 指的是"直连 Emby"，不是"直连网盘"，流量反而全走服务器。
# OpenList / OpenList 存储 / ge2o 任一环节不健康时，启动探活与运行中 watchdog 都会自动回退 direct。
# 模式来源：手动触发看 playback_mode 开关；定时/watch 触发看仓库变量 EMBY_PLAYBACK_MODE（缺省 302）。

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"
    # - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      playback_mode:
        description: >-
          302 直链播放开关：
          302 ，播放器直接向 OneDrive 拉流，链路不健康时自动回退 direct；
          direct ，直连 Emby ，视频流经 runner 中转。
          本开关只在手动触发时生效；定时/watch 触发读仓库变量 EMBY_PLAYBACK_MODE（默认 302）。
        type: choice
        default: "302"
        options:
          - "302"
          - "direct"
  watch:
    # types: started

env:
  # 手动触发：playback_mode 开关（有默认值，恒非空）；定时/watch 触发：仓库变量 EMBY_PLAYBACK_MODE，缺省 302
  PLAYBACK_MODE_INPUT: ${{ github.event.inputs.playback_mode || vars.EMBY_PLAYBACK_MODE || '302' }}

jobs:
  build:
    concurrency: emby-singleton
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        # 检出仓库，使 .github/scripts/emby302/ 下的脚本可用（与 openlist.yml 同做法）
        uses: actions/checkout@v4
      - name: rclone-install
        run: |
          sudo apt-get update && sudo apt-get install -y zstd
          # 安装 rclone
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-*-amd64.zip
          cd rclone-*-linux-amd64
          sudo mv rclone /usr/bin
          sudo chmod +x /usr/bin/rclone
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          # 写配置文件
          mkdir -p ~/.config/rclone/
          cat << IN_EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG
          IN_EOF
          chmod 600 ~/.config/rclone/rclone.conf
      - name: rclone-run
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3

          if rclone lsf dropbox:self-hosted/emby/config/ --files-only | grep -q "system.xml"; then
            if ! rclone delete dropbox:self-hosted/emby/config/system.xml -vv; then
              echo "[WARNING] Failed to delete system.xml, skipping" >&2
            fi
          fi
          sudo rclone copy dropbox:self-hosted/emby/system.xml dropbox:self-hosted/emby/config/ --ignore-errors -vv

          # 只挂载媒体库所在的 onedrive（/dropbox /gd 挂载无引用，已移除）
          # writes 模式：302 直链播放不经过挂载，本地仅承载扫描/探测/回退流量，磁盘占用≈0
          sudo mkdir -p /onedrive /opt/logs
          sudo chown -R runner:runner /opt/logs
          # 挂载改用 runner 用户：conf 读写全程 runner 身份（root 挂载刷新 token 会把 conf 属主改成 root，是之前 EACCES 的根因）
          grep -q '^user_allow_other' /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf >/dev/null
          sudo mkdir -p /onedrive /mnt/vfs/onedrive
          sudo chown runner:runner /onedrive /mnt/vfs/onedrive
          rclone mount onedrive: /onedrive \
            --config /home/runner/.config/rclone/rclone.conf \
            --cache-dir /mnt/vfs/onedrive \
            --allow-other --umask 000 --attr-timeout 10m \
            --dir-cache-time 72h --poll-interval 0 \
            --vfs-cache-mode full \
            --vfs-cache-max-size 8G --vfs-cache-max-age 24h \
            --buffer-size 32M --vfs-read-ahead 512M \
            --vfs-read-chunk-size 128M --vfs-read-chunk-size-limit 512M \
            --vfs-handle-caching 1m \
            --max-read-ahead 32M \
            --daemon --daemon-wait 60s --log-file /tmp/rclone-onedrive.log
      - name: install cloudflared
        run: |
          sudo mkdir ~/.cloudflared/
          sudo rclone copy dropbox:self-hosted/.cloudflared ~/.cloudflared -vv
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
      - name: Check if the tunnel is running
        env:
          TUNNEL_NAME: "e"
        run: |
          OUTPUT=$(cloudflared tunnel list)
          TUNNEL_LINE=$(echo "$OUTPUT" | grep -w "$TUNNEL_NAME")
          if [ -z "$TUNNEL_LINE" ]; then
            echo "The tunnel '$TUNNEL_NAME' does not exist. Proceeding."
            exit 31
          fi
          CONNECTIONS=$(echo "$TUNNEL_LINE" | awk '{if (NF>=4) print $4; else print "-"}')
          if [ "$CONNECTIONS" == "-" ]; then
            echo "The tunnel '$TUNNEL_NAME' exists but has no active connections. Proceeding."
          else
            echo "The tunnel '$TUNNEL_NAME' is running with connections: $CONNECTIONS. Stopping actions."
            exit 0
          fi
      - name: install openlist
        if: env.PLAYBACK_MODE_INPUT != 'direct'
        env:
          # secret 必须经环境变量注入——直接文本注入 run: 脚本时，密码里含
          # $xxx 片段会被 bash 当未定义变量展开成空（如 @$TM3@ 变 @$TM3@ 骨架）。
          OPENLIST_ADMIN_PASSWORD: ${{ secrets.OPENLIST_ADMIN_PASSWORD }}
        run: |
          main() {
            sudo mkdir -p /opt/openlist
            sudo chown -R runner:runner /opt/openlist /opt/logs

            # 下载 OpenList（失败不致命，健康检查会回退 direct）；认证调用避免 runner 共享出口 IP 匿名配额耗尽
            ASSET_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/OpenListTeam/OpenList/releases/latest \
              | grep -o '"browser_download_url": *"[^"]*openlist-linux-amd64.tar.gz"' | head -1 | cut -d'"' -f4 || true)
            if [ -n "$ASSET_URL" ] && curl -fsSL -o /tmp/openlist.tar.gz "$ASSET_URL"; then
              mkdir -p /tmp/openlist-pkg && tar -xzf /tmp/openlist.tar.gz -C /tmp/openlist-pkg
              find /tmp/openlist-pkg -type f -name openlist -exec sudo install -m 0755 {} /usr/local/bin/openlist \;
            fi
            if ! command -v openlist >/dev/null 2>&1; then
              echo "::warning::OpenList binary unavailable, 302 链路将回退 direct"
              return 0
            fi

            # 恢复：优先 openlist-emby 目录（config.json+data.db，无日志）；旧 tarball 仅作迁移兜底
            RESTORED=false
            if rclone lsf dropbox:self-hosted/openlist-emby/ 2>/dev/null | grep -q "config.json"; then
              rclone copy dropbox:self-hosted/openlist-emby/ /opt/openlist/ 2>/dev/null \
                && RESTORED=true \
                || echo "::warning::openlist-emby 恢复失败"
            fi
            if [ "$RESTORED" = "true" ]; then
              echo "OpenList data restored from Dropbox"
              # 归一化 config.json 的绝对路径（数据可能来自其他机器/系统）
              OLCONF=/opt/openlist/config.json
              if [ -f "$OLCONF" ]; then
                jq '.database.db_file = "/opt/openlist/data.db" | .temp_dir = "/opt/openlist/temp" | .log.name = "/opt/openlist/log/log.log" | .bleve_dir = "/opt/openlist/bleve"' \
                  "$OLCONF" > /tmp/ol-conf.new 2>/dev/null \
                  && mv /tmp/ol-conf.new "$OLCONF" \
                  && echo "OpenList config.json paths normalized"
              fi
            fi

            nohup openlist server --data /opt/openlist > /opt/logs/openlist.log 2>&1 &
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:5244/ping >/dev/null 2>&1 && break
              sleep 1
            done
            if ! curl -fsS http://127.0.0.1:5244/ping >/dev/null 2>&1; then
              # 兼容不同版本的参数位置
              pkill -f "openlist server" 2>/dev/null || true
              sleep 1
              nohup openlist --data /opt/openlist server > /opt/logs/openlist.log 2>&1 &
              for i in $(seq 1 30); do
                curl -fsS http://127.0.0.1:5244/ping >/dev/null 2>&1 && break
                sleep 1
              done
            fi
            if ! curl -fsS http://127.0.0.1:5244/ping >/dev/null 2>&1; then
              echo "::warning::OpenList failed to start, 302 链路将回退 direct"
              echo "--- openlist.log tail (secrets redacted) ---"
              tail -30 /opt/logs/openlist.log 2>/dev/null | sed -E 's/(password|token|secret)("?:?)[ =:]*[^ ,}]*/\1 [redacted]/Ig' || true
              return 0
            fi
            # OpenList 专有隧道（维护入口，密码 = OPENLIST_ADMIN_PASSWORD）
            cloudflared tunnel create oe >/dev/null 2>&1 || true
            cloudflared tunnel route dns oe oe.'${{ secrets.VD }}'.eu.org >/dev/null 2>&1 || true
            OE_TOKEN=$(cloudflared tunnel token oe 2>/dev/null) || true
            if [ -n "$OE_TOKEN" ]; then
              nohup cloudflared tunnel run --url http://127.0.0.1:5244 --token "$OE_TOKEN" > /opt/logs/cloudflared-oe.log 2>&1 &
              echo "OpenList 维护隧道已启动 (oe)"
            fi

            # 管理密码 = OPENLIST_ADMIN_PASSWORD（oe 维护入口与 ge2o 同一密码）。
            # secret 经 step env 注入进程环境，这里只做变量拷贝，bash 不会二次
            # 解析其内容（$、`、" 等字符原样保留）。剔除粘贴可能带入的首尾空白/换行。
            OPENLIST_PW="$OPENLIST_ADMIN_PASSWORD"
            PW_RAW_LEN=${#OPENLIST_PW}
            OPENLIST_PW=$(printf '%s' "$OPENLIST_PW" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
            rm -f /tmp/openlist-pw-note
            if [ -z "$OPENLIST_PW" ]; then
              # secret 为空 → 本轮随机密码：不通知用户就永远登不上 oe 后台。
              # 密码写入 /tmp 标记文件，由收尾步骤经 TG 私信告知（不落公开日志）。
              OPENLIST_PW=$(openssl rand -hex 16)
              printf '%s' "random:$OPENLIST_PW" > /tmp/openlist-pw-note
              echo "OPENLIST_ADMIN_PASSWORD 未配置，本轮已随机生成管理员密码（TG 私信告知，不落公开日志）"
            fi
            [ "$PW_RAW_LEN" -ne "${#OPENLIST_PW}" ] && echo "OPENLIST_ADMIN_PASSWORD 含首尾空白（原长=$PW_RAW_LEN），已剔除——oe 人工登录失败多半是这个原因"

            # 密码真相源 = OPENLIST_ADMIN_PASSWORD secret：先试 secret 登录——
            # 成功 = 库内已对齐（绝不动密码）；失败 = 库内漂移（Dropbox 历史恢复 /
            # oe 后台人工改动 / 临时轮换遗留），无条件纠正回 secret 并 TG 私信告知。
            # 由此保证：用户随时用 admin + secret 登录 oe 必成，TG 里的临时密码仅本轮有效。
            # 请求体用 jq 构造：密码含 " 或 \ 时手拼 JSON 会注入/破损。
            LOGIN_BODY=$(jq -cn --arg pw "$OPENLIST_PW" '{"username":"admin","password":$pw}')
            TOKEN=$(curl -s -X POST http://127.0.0.1:5244/api/auth/login \
              -H 'Content-Type: application/json' \
              -d "$LOGIN_BODY" | jq -r '.data.token // .data // empty' || true)
            if [ -z "$TOKEN" ]; then
              # 登录失败才重置：全新库（admin 随机密码）或库内密码与 secret 不一致时自愈
              openlist admin set --data /opt/openlist "$OPENLIST_PW" >/dev/null 2>&1 \
                || openlist admin set "$OPENLIST_PW" --data /opt/openlist >/dev/null 2>&1 \
                || true
              # 重置了就该让用户知道：否则 oe 后台手输旧密码必然 Invalid
              printf '%s' "reset:$OPENLIST_PW" > /tmp/openlist-pw-note
              echo "OpenList 库内密码与 secret 不一致，已重置为 secret 值（TG 私信告知，不落公开日志）"
              TOKEN=$(curl -s -X POST http://127.0.0.1:5244/api/auth/login \
                -H 'Content-Type: application/json' \
                -d "$LOGIN_BODY" | jq -r '.data.token // .data // empty' || true)
            fi
            if [ -z "$TOKEN" ]; then
              echo "::warning::OpenList login failed, 302 链路将回退 direct"
              return 0
            fi
            printf '%s' "$TOKEN" > /tmp/openlist-token
            chmod 600 /tmp/openlist-token
            # 凭据语义（三套互不相干）：
            #   1. Graph access_token（微软侧）：rclone.conf 的 refresh_token 自动换取，
            #      odlink 直链解析用——与 OpenList 无关
            #   2. OpenList 会话 token：上面机器自动登录所得（/tmp/openlist-token），
            #      探活/直链转发用——无需人工登录
            #   3. admin 密码：仅 oe 后台人工登录用（admin + OPENLIST_ADMIN_PASSWORD），
            #      只有机器用 secret 登录失败时才自愈重置并 TG 私信告知
            echo "机器已用 OPENLIST_ADMIN_PASSWORD secret 直接登录 OpenList 成功"
            echo "  → oe 后台同凭据可登录：admin + 该 secret；若后续无'密码重置/轮换'TG 通知，本轮密码未变"
            echo "  → OpenList 会话 token 已由机器自动获取（/tmp/openlist-token），与 oe 人工登录互不影响"

            # OpenList 凭据通知：仅在【真正执行过改密动作】时发送（reset / random 兜底）。
            # 直接用 OPENLIST_ADMIN_PASSWORD 登录成功 = 密码本就对齐，按约定静默不打扰。
            # 密码明文只进 TG 私信，绝不写公开日志。
            # 注意：--data-urlencode 会把文本按字面编码，消息内必须用真实换行符（printf \n），
            # 不能拼 %0A（会被二次编码成字面 "%0A" 发出去）。
            send_pw_tg() {
              # $1=场景描述  $2=密码明文  $3=附注规则（可空）
              local msg
              msg="$(printf '🔐 OpenList 凭据\n%s\n用户名: admin\n密码: %s\n入口: https://oe.%s.eu.org\n%s\n（本条不会出现在公开日志）' "$1" "$2" "${{ secrets.VD }}" "$3")"
              curl -s -m 15 -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d chat_id=${{ secrets.TG_CHAT_ID }} \
                --data-urlencode "text=${msg}" >/dev/null \
                && echo "已通过 TG 私信发送 OpenList 凭据（不落公开日志）" \
                || echo "::warning::OpenList 凭据 TG 通知发送失败（不影响链路）"
            }
            if [ -s /tmp/openlist-pw-note ]; then
              PW_KIND=$(cut -d: -f1 /tmp/openlist-pw-note)
              PW_VAL=$(cut -d: -f2- /tmp/openlist-pw-note)
              case "$PW_KIND" in
                random) PW_DESC="OPENLIST_ADMIN_PASSWORD 未配置（异常兜底），本轮已随机生成";;
                reset)  PW_DESC="库内密码与 secret 不一致，已纠正回 secret 值";;
                *)      PW_DESC="已变更";;
              esac
              # secret 是唯一长期真相源：本条密码仅本轮有效（oe 后台人工改密在 token
              # 吊销后无法回传持久化，随 run 结束消失）
              send_pw_tg "⚠️ $PW_DESC——本条仅本轮有效" "$PW_VAL" \
                "长期有效密码 = OPENLIST_ADMIN_PASSWORD（下轮自动恢复为它）"
              shred -u /tmp/openlist-pw-note 2>/dev/null || rm -f /tmp/openlist-pw-note
            else
              # 直接用 OPENLIST_ADMIN_PASSWORD 登录成功 = 库内密码本就对齐，
              # 未发生任何改密动作 → 按约定不打扰，不发送通知。
              echo "已用 OPENLIST_ADMIN_PASSWORD 直接登录成功，密码未变更，本轮不发送凭据通知"
            fi

            # 全新初始化：用 rclone 凭据注册 OneDrive 存储（非致命，失败则回退）
            STORAGE_COUNT=$(curl -s http://127.0.0.1:5244/api/admin/storage/list \
              -H "Authorization: $TOKEN" | jq -r '.data.content // [] | length' 2>/dev/null || echo 0)
            if [ "${STORAGE_COUNT:-0}" = "0" ]; then
              CONF="$HOME/.config/rclone/rclone.conf"
              sudo ls -la "$(dirname "$CONF")" || true
              SECTION=$(awk '/^\[onedrive\]/{f=1;next} /^\[/{f=0} f' "$CONF" 2>/dev/null || true)
              if [ -z "$SECTION" ]; then
                SECTION=$(sudo awk '/^\[onedrive\]/{f=1;next} /^\[/{f=0} f' "$CONF" 2>/dev/null || true)
                sudo chown runner:runner "$CONF" 2>/dev/null || true
              fi
              RID=$(printf '%s\n' "$SECTION" | grep -o '^[[:space:]]*client_id[[:space:]]*=.*' | head -1 | sed 's/^[[:space:]]*client_id[[:space:]]*=[[:space:]]*//' || true)
              RSEC=$(printf '%s\n' "$SECTION" | grep -o '^[[:space:]]*client_secret[[:space:]]*=.*' | head -1 | sed 's/^[[:space:]]*client_secret[[:space:]]*=[[:space:]]*//' || true)
              RTOK=$(printf '%s\n' "$SECTION" | grep -o '^[[:space:]]*token[[:space:]]*=.*' | head -1 | sed 's/^[[:space:]]*token[[:space:]]*=[[:space:]]*//' | jq -r '.refresh_token // empty' 2>/dev/null || true)
              if [ -n "$RID" ] && [ -n "$RTOK" ]; then
                ADDITION=$(jq -nc --arg rt "$RTOK" --arg cid "$RID" --arg csec "$RSEC" \
                  '{region:"global",is_sharepoint:false,use_online_api:true,api_url_address:"https://api.oplist.org/onedrive/renewapi",client_id:$cid,client_secret:$csec,redirect_uri:"https://api.oplist.org/onedrive/callback",refresh_token:$rt,site_id:"",chunk_size:5}')
                BODY=$(jq -nc --arg add "$ADDITION" \
                  '{mount_path:"/onedrive",driver:"Onedrive",cache_expiration:30,status:"work",order:0,addition:$add}')
                if curl -s -X POST http://127.0.0.1:5244/api/admin/storage/create \
                     -H "Authorization: $TOKEN" -H 'Content-Type: application/json' -d "$BODY" >/dev/null \
                   && curl -s -X POST http://127.0.0.1:5244/api/fs/list \
                        -H "Authorization: $TOKEN" -H 'Content-Type: application/json' \
                        -d '{"path":"/onedrive","page":1,"per_page":10}' | jq -e '.code == 200' >/dev/null; then
                  echo "OpenList OneDrive storage provisioned"
                  tar -I 'zstd -3 -T0' -cf /tmp/openlist-data.tar.zst -C /opt/openlist . \
                    && rclone copyto /tmp/openlist-data.tar.zst dropbox:self-hosted/openlist-data.tar.zst -vv \
                    && rm -f /tmp/openlist-data.tar.zst \
                    || echo "::warning::provision persist failed"
                else
                  echo "::warning::OpenList storage provisioning failed, 302 链路将回退 direct"
                fi
              else
                echo "::warning::rclone.conf 缺少 onedrive client_id/refresh_token，跳过自动初始化"
              fi
            fi
          }
          main || echo "::warning::install openlist failed, 302 链路将回退 direct"
      - name: probe onedrive shortcuts
        continue-on-error: true
        run: |
          # 只读探测：确认快捷方式(remoteItem)能否被 Graph 跟随、能否取到预授权直链
          # 不改变任何链路行为，探测失败也不影响本次运行
          bash "$GITHUB_WORKSPACE/.github/scripts/emby302/od_probe.sh" || echo "::warning::OneDrive 快捷方式探测失败（不影响播放）"
      - name: start odlink
        if: env.PLAYBACK_MODE_INPUT != 'direct'
        run: |
          main() {
            # odlink：OpenList 协议兼容的 OneDrive 直链服务。
            # 网盘根目录下 0-5/backup 全是快捷方式(remoteItem)，OpenList 官方驱动不跟随，
            # /onedrive/3/... 必然 object not found → 302 直链从不生效、播放静默回源中转。
            # odlink 对外伪装 OpenList 的 /api/fs/*，对内用 Graph 复刻 rclone 的快捷方式
            # 跟随（逐段下钻，遇 remoteItem 切到 /drives/{driveId}/items/{itemId}），
            # 把 @microsoft.graph.downloadUrl 作为 raw_url 交回 ge2o。
            # 非快捷方式路径与解析失败一律原样转发本机 OpenList，保证零回归。
            #
            # 直链源契约写入 /tmp/link-host + /tmp/link-token，供 ge2o 与各处探活统一读取：
            # odlink 就绪走 :5245，否则退回 OpenList :5244（行为与今天完全一致）。
            OD_TOKEN=$(openssl rand -hex 16)
            printf '%s' "$OD_TOKEN" > /tmp/odlink-token
            chmod 600 /tmp/odlink-token
            mkdir -p /opt/logs
            ODLINK_TOKEN="$OD_TOKEN" \
            ODLINK_PORT=5245 \
            ODLINK_LOG=/opt/logs/odlink.log \
            ODLINK_UPSTREAM=http://127.0.0.1:5244 \
            ODLINK_UPSTREAM_TOKEN=/tmp/openlist-token \
            ODLINK_ROOT=/onedrive \
            nohup python3 "$GITHUB_WORKSPACE/.github/scripts/emby302/odlink.py" \
              > /opt/logs/odlink.out 2>&1 &
            sleep 3
            if curl -fsS -m 5 http://127.0.0.1:5245/ping >/dev/null 2>&1; then
              printf '%s' "http://127.0.0.1:5245" > /tmp/link-host
              printf '%s' "$OD_TOKEN" > /tmp/link-token
              echo "odlink 已在 :5245 就绪（快捷方式跟随生效，302 直链源=odlink）"
            else
              printf '%s' "http://127.0.0.1:5244" > /tmp/link-host
              cp /tmp/openlist-token /tmp/link-token 2>/dev/null || printf '' > /tmp/link-token
              echo "::warning::odlink 未响应，302 直链源退回 OpenList(:5244)"
            fi
            chmod 600 /tmp/link-token 2>/dev/null || true
            tail -5 /opt/logs/odlink.log 2>/dev/null || true
          }
          main || {
            printf '%s' "http://127.0.0.1:5244" > /tmp/link-host
            cp /tmp/openlist-token /tmp/link-token 2>/dev/null || printf '' > /tmp/link-token
            echo "::warning::start odlink failed, 302 直链源退回 OpenList"
          }
      - name: install emby
        run: |
          set -euo pipefail
          cleanup_archive_workdir() {
            sudo rm -f /tmp/emby-backup.tar.zst "$HOME/emby-backup.tar.zst" 2>/dev/null || true
          }
          free_kb() { df -Pk "${1:-/tmp}" | awk 'NR==2 {print $4}'; }
          require_free_kb() {
            local path="$1" min_kb="$2" label="$3"
            local avail
            avail=$(free_kb "$path")
            if [ "${avail:-0}" -lt "$min_kb" ]; then
              echo "❌ ${label}: insufficient free space at ${path}. available=${avail}KB required=${min_kb}KB" >&2
              exit 1
            fi
            echo "✅ ${label}: free space ok at ${path}. available=${avail}KB required=${min_kb}KB"
          }
          require_free_kb /tmp $((2 * 1024 * 1024)) "emby restore preflight"
          # 认证调用 GitHub API：runner 共享出口 IP 的匿名配额（60 次/h）极易耗尽，
          # 限流响应里没有 browser_download_url，替换结果为空 → curl 报 "no URL specified" 直接失败
          EMBY_DEB_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/MediaBrowser/Emby.Releases/releases/latest \
            | grep -oP '"browser_download_url": "\K(.*emby-server-deb.*amd64.deb)(?=")')
          [ -n "$EMBY_DEB_URL" ] || { echo "::error::未获取到 Emby 最新版下载地址（GitHub API 异常/限流）"; exit 1; }
          curl -fL --retry 3 -o emby-server.deb "$EMBY_DEB_URL"
          sudo dpkg -i emby-server.deb
          
          # dpkg -i 会自动启动 emby-server，需要先把它停掉，否则 /var/lib/emby 会被锁定无法删除
          sudo systemctl stop emby-server || true

          validate_emby_data() {
            local root="$1"
            sudo test -f "$root/data/users.db"
            sudo test -f "$root/data/library.db"
            sudo python3 - "$root" <<'PY_GUARD'
          import json
          import sqlite3
          import sys
          from pathlib import Path
          
          root = Path(sys.argv[1])
          users_db = root / "data/users.db"
          library_db = root / "data/library.db"
          
          users = sqlite3.connect(f"file:{users_db}?mode=ro", uri=True)
          users.row_factory = sqlite3.Row
          names = []
          for row in users.execute("select data from LocalUsersv2"):
              raw = row["data"]
              if isinstance(raw, bytes):
                  raw = raw.decode("utf-8", "ignore")
              names.append(json.loads(raw).get("Name"))
          users.close()
          
          library = sqlite3.connect(f"file:{library_db}?mode=ro", uri=True)
          media_items = library.execute("select count(*) from MediaItems").fetchone()[0]
          root_rows = {
              row[0]: (row[1], row[2])
              for row in library.execute("select Id, Name, type from MediaItems where Id in (1, 2)")
          }
          library_folders = [
              row[0]
              for row in library.execute(
                  "select Name from MediaItems where ParentId = 1 and type = 4 order by Name"
              )
          ]
          media_paths = [
              row[0]
              for row in library.execute(
                  """
                  select Path
                  from MediaItems
                  where ParentId = 2
                    and type = 3
                    and Path is not null
                    and Path like '/onedrive/%'
                  order by Path
                  """
              )
          ]
          library.close()
          
          # 隐私：只输出计数，不输出用户名/媒体路径明细
          print(
              "Emby guard: "
              f"users={len(names)} media_items={media_items} "
              f"folders={len(library_folders)} media_paths={len(media_paths)}"
          )
          if "Derrick" not in names:
              raise SystemExit("❌ Emby guard failed: Derrick user is missing")
          if root_rows.get(1) != ("Media Folders", 2) or root_rows.get(2) != ("root", 1):
              raise SystemExit(f"❌ Emby guard failed: invalid root structure: {root_rows}")
          if not library_folders:
              raise SystemExit("❌ Emby guard failed: no media library folders under Media Folders")
          if not media_paths:
              raise SystemExit("❌ Emby guard failed: no real /onedrive media paths under root")
          PY_GUARD
          }

          # 尝试从备份恢复。恢复必须通过 Derrick + 媒体库结构 + 真实媒体路径校验，否则直接失败，禁止启动空库。
          sudo rm -rf /var/lib/emby
          sudo mkdir -p /var/lib/emby
          sudo chown -R emby:emby /var/lib/emby
          # 图片缓存软链到 /mnt（根分区 ~14GB 放不下 ~30GB 缓存；/mnt 独立分区 ~65GB）
          sudo mkdir -p /mnt/emby-cache
          sudo chown emby:emby /mnt/emby-cache
          sudo ln -sfn /mnt/emby-cache /var/lib/emby/cache
          BACKUP_NAME="emby-backup.tar.zst"
          IS_LOCAL_MODE=true

          echo "🔍 正在检查 OneDrive 上的压缩备份（含图片缓存，流式解压不落本地盘）..."
          cleanup_archive_workdir
          RESTORED_FROM=
          if rclone lsf onedrive:backup/emby/$BACKUP_NAME 2>/dev/null | grep -q "$BACKUP_NAME"; then
              BK_BYTES=$(rclone lsl onedrive:backup/emby/$BACKUP_NAME 2>/dev/null | awk '{print $1}')
              require_free_kb /mnt $((BK_BYTES / 1024 + 2 * 1024 * 1024)) "emby cache extract preflight (/mnt)"
              require_free_kb /var/lib/emby $((4 * 1024 * 1024)) "emby data extract preflight (root)"
              echo "✅ 发现 OneDrive 备份，流式解压..."
              if rclone cat onedrive:backup/emby/$BACKUP_NAME | sudo tar -I zstd -xf - -C /var/lib/emby/ && sudo chown -R emby:emby /var/lib/emby && validate_emby_data /var/lib/emby; then
                  echo "🎉 OneDrive 备份流式恢复并校验成功"
                  RESTORED_FROM=onedrive
              else
                  echo "::warning::OneDrive 流式恢复失败，尝试 Dropbox 兜底..."
                  sudo rm -rf /var/lib/emby/* 2>/dev/null || true
              fi
          fi
          if [ -z "$RESTORED_FROM" ] && rclone copy dropbox:self-hosted/$BACKUP_NAME /tmp/ -vv; then
              backup_kb=$(du -sk "/tmp/$BACKUP_NAME" | awk '{print $1}')
              if [ -z "${backup_kb:-}" ] || [ "$backup_kb" -le 0 ]; then
                  echo "❌ emby extract preflight: unable to calculate archive size" >&2
                  exit 1
              fi
              echo "$BACKUP_NAME 大小: ${backup_kb}KB"
              require_free_kb /var/lib/emby $((backup_kb * 3 + 1024 * 1024)) "emby extract preflight"
              echo "✅ 发现备份压缩包，正在解压..."
              sudo tar -I zstd -xf /tmp/$BACKUP_NAME -C /var/lib/emby/
              sudo chown -R emby:emby /var/lib/emby
              validate_emby_data /var/lib/emby
              echo "🎉 压缩备份恢复并校验成功"
              RESTORED_FROM=dropbox
              cleanup_archive_workdir
          fi
          if [ -z "$RESTORED_FROM" ]; then
              cleanup_archive_workdir
              echo "⚠️ 未发现压缩备份，尝试从 Dropbox 目录备份恢复..."
              RESTORE_DIR=/tmp/emby-dir-restore
              rm -rf "$RESTORE_DIR"
              mkdir -p "$RESTORE_DIR"
              rclone copy dropbox:self-hosted/emby "$RESTORE_DIR" -vv
              sudo rm -rf /var/lib/emby/*
              sudo cp -a "$RESTORE_DIR"/. /var/lib/emby/
              sudo chown -R emby:emby /var/lib/emby
              rm -rf "$RESTORE_DIR"
              validate_emby_data /var/lib/emby
              echo "🎉 Dropbox 目录备份恢复并校验成功"
          fi
          
          echo "==========/var/lib/emby==========="
          sudo ls -la /var/lib/emby
      - name: run emby
        run: |
          sudo nohup /opt/emby-server/bin/emby-server > /opt/logs/emby-console.log 2>&1 &
          # 只有 install emby 阶段完成了数据完整性校验，才允许后续备份步骤执行。
          touch /tmp/EMBY_READY_FOR_BACKUP
      - name: install ge2o
        if: env.PLAYBACK_MODE_INPUT != 'direct'
        run: |
          main() {
            mkdir -p /opt/ge2o
            ASSET_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/AmbitiousJun/go-emby2openlist/releases/latest \
              | grep -o '"browser_download_url": *"[^"]*ge2o-linux_amd64"' | head -1 | cut -d'"' -f4 || true)
            if [ -n "$ASSET_URL" ] && curl -fsSL -o /opt/ge2o/ge2o "$ASSET_URL"; then
              chmod +x /opt/ge2o/ge2o
            fi
            if [ ! -x /opt/ge2o/ge2o ]; then
              echo "::warning::ge2o binary unavailable, 302 链路将回退 direct"
              return 0
            fi

            # 直链源统一读 start odlink 写入的契约：odlink(:5245) 优先，否则 OpenList(:5244)
            OPENLIST_HOST=$(cat /tmp/link-host 2>/dev/null || echo "http://127.0.0.1:5244")
            OPENLIST_TOKEN=$(cat /tmp/link-token 2>/dev/null || echo "")
            echo "ge2o 直链源: $OPENLIST_HOST"
            APISECRET=$(openssl rand -hex 16)
          cat > /opt/ge2o/config.yml <<GE2O_EOF
          emby:
            host: http://127.0.0.1:8096
            # ⚠️ 不要配 mount-path：它会先剥掉 Emby 路径的 /onedrive 前缀，
            # 导致 emby2openlist 映射（/onedrive:/onedrive）永不命中——
            # 首选路径变成 /3/...（storage not found），兜底重试又丢掉网盘里的
            # 二级目录 /3，/onedrive/... 必然 object not found，只能回源中转。
            # rclone 挂载根与 OpenList 存储根都指向网盘根，两侧路径原样一致，
            # 保持 /onedrive 前缀不剥、靠映射原样替换才是正确换算。
            episodes-unplay-prior: false
            resort-random-items: false
            proxy-error-strategy: origin
            images-quality: 100
            download-strategy: 403
          openlist:
            host: $OPENLIST_HOST
            token: $OPENLIST_TOKEN
          video-preview:
            enable: false
          path:
            emby2openlist:
              - /onedrive:/onedrive
          cache:
            enable: true
            expired: 1d
          ssl:
            enable: false
          log:
            disable-color: true
          ge2o:
            api-secret: $APISECRET
            web:
              disable: true
          GE2O_EOF

            cd /opt/ge2o
            GIN_MODE=release nohup ./ge2o > /opt/logs/ge2o.log 2>&1 &
            sleep 3
            if curl -fsS -m 5 http://127.0.0.1:8095/emby/System/Info/Public >/dev/null 2>&1; then
              echo "ge2o is up on :8095"
            else
              echo "::warning::ge2o not responding yet, 健康检查会决定最终模式"
            fi
          }
          main || echo "::warning::install ge2o failed, 302 链路将回退 direct"
      - name: run cloudflared
        run: |
          # 取值统一去空白转小写，仓库变量写成 "Direct" / "DIRECT" 也能识别
          MODE=$(printf '%s' "${PLAYBACK_MODE_INPUT:-302}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          case "$MODE" in
            302|direct) ;;
            *) echo "::warning::未知的播放模式 '$MODE'（EMBY_PLAYBACK_MODE），按 302 处理"; MODE="302";;
          esac
          # 公开日志脱敏：URL、密钥、媒体路径 → 占位符（探针诊断用）
          redact_pub() {
            sed -E 's/api_key=[^& "]*/api_key=[redacted]/g; s#https?://[^ ",}]*#<url>#g; s#/onedrive/[^,"}]*#<path>#g'
          }
          if [ "$MODE" = "302" ]; then
            # 直链映射探针：取一个媒体库根目录（/onedrive/...），用同路径直查 OpenList fs/get。
            # ge2o 路径换算断了会静默回源（播放一直显示"中转"），这里在启动时就暴露。
            MEDIA_DIR=$(curl -s -m 8 "http://127.0.0.1:8096/emby/Library/VirtualFolders?api_key=${{ secrets.EMBY_API_TOKEN }}" \
              | jq -r '[.[].Locations[]?] | map(select(startswith("/onedrive"))) | .[0] // empty' 2>/dev/null || true)
            echo "直链映射探针: ${MEDIA_DIR:+已取到媒体库目录}"
            OK=0
            for i in 1 2 3; do
              # 直链源=odlink(:5245) 优先、否则 OpenList(:5244)：探活必须打 ge2o 实际在用的那个
              TOK=$(cat /tmp/link-token 2>/dev/null || true)
              LINK_HOST=$(cat /tmp/link-host 2>/dev/null || echo "http://127.0.0.1:5244")
              MAP_OK=1
              if [ -n "$TOK" ] && [ -n "$MEDIA_DIR" ]; then
                RESP=$(curl -s -m 10 -X POST ${LINK_HOST}/api/fs/get \
                  -H "Authorization: $TOK" -H 'Content-Type: application/json' \
                  -d "$(jq -nc --arg p "$MEDIA_DIR" '{path:$p}')")
                GC=$(printf '%s' "$RESP" | jq -r '.code // 0' 2>/dev/null || echo 0)
                [ "$GC" = "200" ] || { MAP_OK=0; echo "直链映射自检失败: fs/get code=$GC msg=$(printf '%s' "$RESP" | jq -r '.message // empty' 2>/dev/null | redact_pub | head -c 200)"; }
              fi
              if curl -fsS -m 5 http://127.0.0.1:8095/emby/System/Info/Public >/dev/null 2>&1 \
                 && [ -n "$TOK" ] \
                 && [ "$MAP_OK" = "1" ] \
                 && curl -s -m 5 -X POST ${LINK_HOST}/api/fs/list \
                      -H "Authorization: $TOK" -H 'Content-Type: application/json' \
                      -d "$(jq -nc --arg p "${MEDIA_DIR:-/onedrive}" '{path:$p,page:1,per_page:1}')" \
                    | jq -e '.code == 200' >/dev/null 2>&1; then
                OK=1
                break
              fi
              sleep 10
            done
            if [ "$OK" != "1" ]; then
              echo "::warning::302 chain unhealthy, falling back to direct mode"
              echo "--- OpenList fs/list 诊断 ---"
              curl -s -X POST ${LINK_HOST}/api/fs/list \
                -H "Authorization: $TOK" -H 'Content-Type: application/json' \
                -d '{"path":"/onedrive","page":1,"per_page":3}' 2>/dev/null \
                | jq -c '{code: .code, msg: .message, total: (.data.total // 0)}' 2>/dev/null || true
              # 映射诊断：fs/get 报错原因 + 同目录 fs/list 对照（区分"get 语义问题"和"子树整体不可达"）
              if [ -n "$MEDIA_DIR" ]; then
                echo "--- 直链映射诊断（脱敏）---"
                curl -s -m 10 -X POST ${LINK_HOST}/api/fs/get \
                  -H "Authorization: $TOK" -H 'Content-Type: application/json' \
                  -d "$(jq -nc --arg p "$MEDIA_DIR" '{path:$p}')" 2>/dev/null \
                  | jq -c '{code: .code, msg: .message}' 2>/dev/null | redact_pub || true
                curl -s -m 10 -X POST ${LINK_HOST}/api/fs/list \
                  -H "Authorization: $TOK" -H 'Content-Type: application/json' \
                  -d "$(jq -nc --arg p "$MEDIA_DIR" '{path:$p,page:1,per_page:1}')" 2>/dev/null \
                  | jq -c '{code: .code, msg: .message, total: (.data.total // 0)}' 2>/dev/null | redact_pub || true
              fi
              MODE="direct"
            fi
          fi
          echo "$MODE" > /tmp/PLAYBACK_MODE
          echo "PLAYBACK_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Playback mode: $MODE"
          # 实时通知：模式决策后立刻推送 Telegram（不等运行结束）
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="📺 Emby 启动%0A模式: ${MODE}%0A时间: $(date '+%H:%M')" >/dev/null 2>&1 || true

          if [ "$MODE" = "302" ]; then
            nohup cloudflared tunnel run --url http://127.0.0.1:8095 e > /opt/logs/cloudflared.log 2>&1 &
          else
            nohup cloudflared tunnel run --url http://127.0.0.1:8096 e > /opt/logs/cloudflared.log 2>&1 &
          fi

          # 运行中 watchdog：302 模式下每分钟探活，连续 3 次失败自动回退 direct
          cat > /opt/watchdog.sh <<'WD_EOF'
          #!/bin/bash
          FAIL=0
          while true; do
            sleep 60
            MODE=$(cat /tmp/PLAYBACK_MODE 2>/dev/null || echo direct)
            [ "$MODE" = "direct" ] && continue
            TOK=$(cat /tmp/link-token 2>/dev/null || true)
            LINK_HOST=$(cat /tmp/link-host 2>/dev/null || echo "http://127.0.0.1:5244")
            MAP_OK=1
            if [ -n "$TOK" ] && [ -n "$MEDIA_DIR" ]; then
              GC=$(curl -s -m 10 -X POST ${LINK_HOST}/api/fs/get \
                     -H "Authorization: $TOK" -H 'Content-Type: application/json' \
                     -d "$(jq -nc --arg p "$MEDIA_DIR" '{path:$p}')" \
                   | jq -r '.code // 0' 2>/dev/null || echo 0)
              [ "$GC" = "200" ] || MAP_OK=0
            fi
            if curl -fsS -m 5 http://127.0.0.1:8095/emby/System/Info/Public >/dev/null 2>&1 \
               && [ -n "$TOK" ] \
               && [ "$MAP_OK" = "1" ] \
               && curl -s -m 5 -X POST ${LINK_HOST}/api/fs/list \
                    -H "Authorization: $TOK" -H 'Content-Type: application/json' \
                    -d "$(jq -nc --arg p "${MEDIA_DIR:-/onedrive}" '{path:$p,page:1,per_page:1}')" \
                  | jq -e '.code == 200' >/dev/null 2>&1; then
              FAIL=0
            else
              FAIL=$((FAIL+1))
              echo "$(date '+%F %T') 302 health fail #$FAIL map_ok=$MAP_OK"
            fi
            if [ "$FAIL" -ge 3 ]; then
              echo "302 unhealthy -> switching to direct"
              pkill -f "cloudflared tunnel run" 2>/dev/null
              sleep 3
              nohup cloudflared tunnel run --url http://127.0.0.1:8096 e > /opt/logs/cloudflared-direct.log 2>&1 &
              echo direct > /tmp/PLAYBACK_MODE
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TG_CHAT_ID}" \
                -d text="📺 Emby 302 链路连续 3 次探活失败，已自动回退 direct 模式" >/dev/null 2>&1
              exit 0
            fi
          done
          WD_EOF
          MEDIA_DIR="$MEDIA_DIR" TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" TG_CHAT_ID="${{ secrets.TG_CHAT_ID }}" \
            nohup bash /opt/watchdog.sh > /opt/logs/watchdog.log 2>&1 &
          # 播放事件监听：
          #   302 模式主源    = ge2o 访问日志（3xx → [302直链]，2xx → [中转]）
          #   direct 模式兜底 = Emby Sessions 轮询（ge2o 被旁路，ge2o.log 里不会有播放记录）
          #   两个数据源共享去重状态，同一个 item 180s 内只推一次
          cat > /opt/playlog.sh <<'PL_EOF'
          #!/bin/bash
          # 播放事件监听：ge2o 访问日志（302 模式主源）+ Emby Sessions 轮询（兜底）
          # 输出全部进 /opt/logs/playlog.log；workflow 日志是公开的，URL 与密钥一律脱敏
          LOG=/opt/logs/ge2o.log
          EMBY=http://127.0.0.1:8096
          STATE=/tmp/playlog-state
          LOCK=/tmp/playlog.lock
          touch "$LOG" "$STATE"
          DIAG=0
          SFAIL=0
          CTX=0
          # 脱敏：密钥、直链 URL；并整行丢弃 ge2o 的 cacheKey 调试日志（内含完整请求头与 cf_clearance Cookie）
          redact() {
            grep -v "headers to encode cacheKey" \
              | sed -E 's/api_key=[^& ]*/api_key=[redacted]/g; s/X-Emby-Token=[^& ]*/X-Emby-Token=[redacted]/g; s#https?://[^ "]*#<url>#g'
          }

          # Emby API 请求：优先用自检选出的认证方式，失败自动回退另一种，返回 http 码
          emby_get() { # $1=路径(含前导 /) $2=输出文件
            local path=$1 out=$2 code
            if [ "$AUTH_MODE" = "query" ]; then
              case "$path" in
                *\?*) code=$(curl -s -m 8 -o "$out" -w '%{http_code}' "$EMBY$path&api_key=$EMBY_API_KEY");;
                *)    code=$(curl -s -m 8 -o "$out" -w '%{http_code}' "$EMBY$path?api_key=$EMBY_API_KEY");;
              esac
              if [ "$code" = "200" ]; then printf '%s' "$code"; return 0; fi
              code=$(curl -s -m 8 -o "$out" -w '%{http_code}' -H "X-Emby-Token: $EMBY_API_KEY" "$EMBY$path")
            else
              code=$(curl -s -m 8 -o "$out" -w '%{http_code}' \
                       -H "X-Emby-Token: $EMBY_API_KEY" "$EMBY$path")
              if [ "$code" = "200" ]; then printf '%s' "$code"; return 0; fi
              case "$path" in
                *\?*) code=$(curl -s -m 8 -o "$out" -w '%{http_code}' "$EMBY$path&api_key=$EMBY_API_KEY");;
                *)    code=$(curl -s -m 8 -o "$out" -w '%{http_code}' "$EMBY$path?api_key=$EMBY_API_KEY");;
              esac
            fi
            printf '%s' "$code"
          }

          echo "=== playlog 启动 $(date '+%F %T') ==="
          echo "PLAYBACK_MODE=$(cat /tmp/PLAYBACK_MODE 2>/dev/null || echo unknown)"
          echo "EMBY_API_KEY 长度=${#EMBY_API_KEY}（0 或异常值说明密钥没传进来）"
          echo "ge2o.log 行数: $(wc -l < "$LOG" 2>/dev/null || echo 0)"
          echo "--- ge2o.log 末尾 8 行（脱敏，用于确认访问日志格式）---"
          tail -n 8 "$LOG" 2>/dev/null | redact

          # Emby 认证矩阵自检：优雅停机用同一密钥的 X-Emby-Token 头是成功的，
          # 这里逐个验证认证方式与端点，定位 playlog 里 401 的真正原因（公开日志只输出 http 码）
          SC_SYS=$(curl -s -m 8 -o /dev/null -w '%{http_code}' -H "X-Emby-Token: $EMBY_API_KEY" "$EMBY/emby/System/Info")
          SC1=$(curl -s -m 8 -o /tmp/pl-sessions.json -w '%{http_code}' -H "X-Emby-Token: $EMBY_API_KEY" "$EMBY/emby/Sessions")
          SC2=$(curl -s -m 8 -o /dev/null -w '%{http_code}' "$EMBY/emby/Sessions?api_key=$EMBY_API_KEY")
          SC3=$(curl -s -m 8 -o /dev/null -w '%{http_code}' -H "X-MediaBrowser-Token: $EMBY_API_KEY" "$EMBY/emby/Sessions")
          SC4=$(curl -s -m 8 -o /dev/null -w '%{http_code}' -H "Authorization: MediaBrowser Token=\"$EMBY_API_KEY\"" "$EMBY/emby/Sessions")
          echo "Emby 认证矩阵: System/Info(头)=$SC_SYS | Sessions 头X-Emby-Token=$SC1 查询api_key=$SC2 头X-MediaBrowser-Token=$SC3 头Authorization=$SC4"
          if [ "$SC1" = "200" ]; then
            AUTH_MODE=header
          elif [ "$SC2" = "200" ]; then
            AUTH_MODE=query
          else
            AUTH_MODE=query
            echo "401 响应体片段: $(head -c 150 /tmp/pl-sessions.json 2>/dev/null)"
          fi

          # Emby 连通性自检（用选出的认证方式；只报数量，不输出用户名/媒体路径）
          SC=$(emby_get /emby/Sessions /tmp/pl-sessions.json)
          SN=$(jq 'if type=="array" then length else ((.Items // []) | length) end' /tmp/pl-sessions.json 2>/dev/null || echo jq失败)
          echo "Emby Sessions 自检: http=$SC 会话数=$SN 认证方式=$AUTH_MODE"
          # TG 通道自检：启动即应在 TG 收到这一条，用来区分"推送链路断了"还是"播放事件没识别到"
          TC=$(curl -s -m 10 -o /tmp/pl-tg.json -w '%{http_code}' \
                 -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                 --data-urlencode "chat_id=$TG_CHAT_ID" \
                 --data-urlencode "text=🎬 playlog 已就绪（自检）")
          echo "TG 通道自检: http=$TC resp=$(head -c 200 /tmp/pl-tg.json 2>/dev/null)"

          # 去重（滑动窗口）：同一 item 的持续播放只推一次。
          # 每次命中都刷新"最后请求时间"，间隔超过 300s 才视为新的一次播放；
          # 两个数据源共享 STATE（flock 串行化）
          claim() {
            local iid=$1 now ts
            now=$(date +%s)
            (
              flock 9 2>/dev/null || :
              ts=$(grep -m1 "^$iid " "$STATE" 2>/dev/null | cut -d' ' -f2)
              grep -v "^$iid " "$STATE" > "$STATE.tmp" 2>/dev/null
              echo "$iid $now" >> "$STATE.tmp"
              mv "$STATE.tmp" "$STATE"
              [ -n "$ts" ] && [ $((now - ts)) -lt 300 ] && exit 1
              exit 0
            ) 9>"$LOCK"
          }

          # 片名反查：Items 接口 → 失败再从 Sessions 里按 Id 反查（emby_get 已含双认证回退）
          item_name() { # $1=IID
            local iid=$1 code name
            code=$(emby_get "/emby/Items?Ids=$iid&Fields=Name" /tmp/pl-item.json)
            name=$(jq -r '.Items[0].Name // empty' /tmp/pl-item.json 2>/dev/null)
            if [ -z "$name" ]; then
              echo "[WARN] 片名查询失败 item=$iid http=$code" >&2
              code=$(emby_get /emby/Sessions /tmp/pl-sessions-name.json)
              name=$(jq -r --arg id "$iid" 'if type=="array" then . else (.Items // []) end
                     | .[] | select((.NowPlayingItem.Id // "") == $id) | .NowPlayingItem.Name' \
                     /tmp/pl-sessions-name.json 2>/dev/null | head -1)
              [ -n "$name" ] || echo "[WARN] Sessions 反查片名失败 item=$iid http=$code" >&2
            fi
            printf '%s' "${name:-未知}"
          }

          notify() { # $1=KIND $2=IID [$3=NAME]
            local kind=$1 iid=$2 name=$3 code
            claim "$iid" || return 0
            if [ -z "$name" ]; then
              name=$(item_name "$iid")
            fi
            echo "🎬 播放 [$kind] $name (item $iid)"
            code=$(curl -s -m 10 -o /tmp/pl-tg.json -w '%{http_code}' \
                     -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                     --data-urlencode "chat_id=$TG_CHAT_ID" \
                     --data-urlencode "text=🎬 播放 [$kind] $name")
            [ "$code" = "200" ] || echo "[WARNING] TG 推送失败 http=$code resp=$(head -c 200 /tmp/pl-tg.json 2>/dev/null)"
          }

          # 数据源 A：ge2o 访问日志（302 模式主源）
          #   真实格式（v2.8.2）：
          #   [ge2o:v2.8.2] 2026-09-01 08:49:01 | 206 | 4.16s | 141.11.43.124 | 8095 <路由> | GET /emby/videos/554849/stream?...
          #   3xx = 直链重定向；200/206 = 经 ge2o/Emby 中转；304 = 客户端缓存校验，不计为播放
          (
            tail -n0 -F "$LOG" 2>/dev/null | while read -r line; do
              case "$line" in
                *'/videos/'*) ;;
                *) continue;;
              esac
              # 只认访问日志行（带 " | 方法 /path"），[ERROR] 等业务日志一律跳过
              case "$line" in
                *' | GET '*|*' | POST '*|*' | HEAD '*) ;;
                *)
                  if [ "$DIAG" -lt 12 ]; then
                    DIAG=$((DIAG+1))
                    echo "[SKIP] 非访问日志行: $(printf '%s' "$line" | redact | head -c 160)"
                  fi
                  continue;;
              esac
              case "$line" in
                *stream*|*original*|*master.m3u8*|*universal*) ;;
                *)
                  if [ "$DIAG" -lt 12 ]; then
                    DIAG=$((DIAG+1))
                    echo "[SKIP] 非播放请求: $(printf '%s' "$line" | redact | head -c 160)"
                  fi
                  continue;;
              esac
              ST=$(printf '%s\n' "$line" | grep -oE '\| [0-9]{3} \|' | head -1 | tr -d '| ')
              case "$ST" in
                302|307) KIND=302直链;;
                200|206) KIND=中转;;
                *)
                  if [ "$DIAG" -lt 12 ] && [ "$ST" != "304" ]; then
                    DIAG=$((DIAG+1))
                    echo "[SKIP] 状态码 $ST 不计为播放: $(printf '%s' "$line" | redact | head -c 160)"
                  fi
                  continue;;
              esac
              IID=$(printf '%s\n' "$line" | sed -E 's|.*emby/[Vv]ideos/([0-9]+).*|\1|')
              case "$IID" in
                ''|*[!0-9]*) continue;;
              esac
              # 首个中转事件时归档 ge2o 播放时刻上下文（脱敏），用于定位"为何没走 302 直链"
              if [ "$KIND" = "中转" ] && [ "$CTX" -lt 1 ]; then
                CTX=1
                echo "--- 中转事件上下文: ge2o.log 末尾 30 行（脱敏）---"
                tail -n 30 "$LOG" 2>/dev/null | redact
              fi
              notify "$KIND" "$IID"
            done
          ) &

          # 数据源 B：Emby Sessions 轮询（ge2o 覆盖不到的播放：direct 模式 / 日志格式变化）
          (
            while true; do
              sleep 10
              MODE=$(cat /tmp/PLAYBACK_MODE 2>/dev/null || echo 302)
              SC=$(emby_get /emby/Sessions /tmp/pl-sessions.json)
              if [ "$SC" != "200" ]; then
                SFAIL=$((SFAIL+1))
                [ $((SFAIL % 10)) -eq 1 ] && echo "[WARN] Sessions 查询失败 http=$SC（第 $SFAIL 次）"
                continue
              fi
              jq -c 'if type=="array" then . else (.Items // []) end
                     | .[]
                     | select(.NowPlayingItem != null)
                     | {id: (.NowPlayingItem.Id // ""), name: (.NowPlayingItem.Name // ""), method: (.PlayState.PlayMethod // "")}' \
                /tmp/pl-sessions.json 2>/dev/null | while read -r s; do
                  IID=$(printf '%s' "$s" | jq -r '.id' 2>/dev/null)
                  NAME=$(printf '%s' "$s" | jq -r '.name' 2>/dev/null)
                  METHOD=$(printf '%s' "$s" | jq -r '.method' 2>/dev/null)
                  case "$IID" in
                    ''|*[!0-9]*) continue;;
                  esac
                  case "$METHOD" in
                    Transcode) KIND=中转;;
                    *) if [ "$MODE" = "direct" ]; then KIND=中转; else KIND=302直链; fi;;
                  esac
                  notify "$KIND" "$IID" "$NAME"
                done
            done
          ) &

          wait
          PL_EOF
          TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" TG_CHAT_ID="${{ secrets.TG_CHAT_ID }}" \
            EMBY_API_KEY="${{ secrets.EMBY_API_TOKEN }}" \
            nohup bash /opt/playlog.sh >> /opt/logs/playlog.log 2>&1 &
      - name: warmup images
        run: |
          # 海报墙预热：请求首页最新条目的海报（真实 tag），让 Emby 现场缩放 + ge2o 内存缓存就绪
          cat > /opt/warmup.sh <<'WU_EOF'
          #!/bin/bash
          KEY="$EMBY_API_KEY"
          EMBY=http://127.0.0.1:8096
          GE2O=http://127.0.0.1:8095
          UID=$(curl -s "$EMBY/emby/Users?api_key=$KEY" | jq -r '.[] | select(.Name=="Derrick") | .Id' | head -1)
          [ -n "$UID" ] || { echo "warmup: 未找到 Derrick 用户，跳过"; exit 0; }
          curl -s "$EMBY/emby/Users/$UID/Items/Latest?Limit=40&Fields=ImageTags&api_key=$KEY" > /tmp/wu-items.json
          N=0
          for ID in $(jq -r '.[].Id' /tmp/wu-items.json | head -40); do
            jq -r --arg id "$ID" '.[] | select(.Id==$id) | .ImageTags.Primary // empty' /tmp/wu-items.json > /tmp/wu-tag.txt 2>/dev/null
            read -r TAG < /tmp/wu-tag.txt 2>/dev/null || TAG=
            [ -n "$TAG" ] || continue
            curl -s -o /dev/null "$GE2O/emby/Items/$ID/Images/Primary?maxWidth=400&maxHeight=400&tag=$TAG"
            curl -s -o /dev/null "$GE2O/emby/Items/$ID/Images/Primary?maxWidth=600&maxHeight=600&tag=$TAG"
            N=$((N + 1))
          done
          echo "海报墙预热完成: ${N} 个条目 $(date '+%T')"
          WU_EOF
          EMBY_API_KEY="${{ secrets.EMBY_API_TOKEN }}" nohup bash /opt/warmup.sh > /opt/logs/warmup.log 2>&1 &

      - name: sleep
        run: |
          sudo sleep 340m
      - name: backup emby data
        if: always()
        run: |
          set -euo pipefail
          cleanup_archive_workdir() {
            sudo rm -f "$HOME/emby-backup.tar.zst" /tmp/emby-backup.tar.zst 2>/dev/null || true
          }
          free_kb() { df -Pk "${1:-$HOME}" | awk 'NR==2 {print $4}'; }
          require_free_kb() {
            local path="$1" min_kb="$2" label="$3"
            local avail
            avail=$(free_kb "$path")
            if [ "${avail:-0}" -lt "$min_kb" ]; then
              echo "❌ ${label}: insufficient free space at ${path}. available=${avail}KB required=${min_kb}KB" >&2
              exit 1
            fi
            echo "✅ ${label}: free space ok at ${path}. available=${avail}KB required=${min_kb}KB"
          }

          # 同步 OpenList 数据目录：仅当实例真正配置了存储（fs/list 实测通过）才回传，防止空数据覆盖远端
          if [ -x /usr/local/bin/openlist ] && curl -s http://127.0.0.1:5244/ping >/dev/null 2>&1; then
            OTOKEN=$(cat /tmp/openlist-token 2>/dev/null || true)
            if [ -n "$OTOKEN" ] && curl -s -X POST http://127.0.0.1:5244/api/fs/list \
                 -H "Authorization: $OTOKEN" -H 'Content-Type: application/json' \
                 -d '{"path":"/onedrive","page":1,"per_page":1}' | jq -e '.code == 200' >/dev/null 2>&1; then
              rm -rf /tmp/ol-persist && mkdir -p /tmp/ol-persist
              cp /opt/openlist/config.json /tmp/ol-persist/ 2>/dev/null || true
              cp /opt/openlist/data.db /tmp/ol-persist/ 2>/dev/null || true
              rclone sync /tmp/ol-persist dropbox:self-hosted/openlist-emby/ -vv 2>/dev/null \
                && echo "OpenList 数据已同步到 openlist-emby（config.json+data.db，无日志）" \
                || echo "[WARNING] OpenList data persist failed"
              rm -rf /tmp/ol-persist
            else
              echo "[WARNING] OpenList has no working storage; skip persist to protect remote data"
            fi
          fi

          if [ ! -f /tmp/EMBY_READY_FOR_BACKUP ]; then
              echo "⚠️ Emby 未能成功启动，跳过备份以防空数据覆盖云端。"
              exit 0
          fi

          # 优雅停机
          SHUTDOWN_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "X-Emby-Token: ${{ secrets.EMBY_API_TOKEN }}" http://127.0.0.1:8096/System/Shutdown || echo 000)
          echo "优雅停机: http=$SHUTDOWN_CODE（401 说明该密钥已失效，Emby 只能被 runner 强杀）"
          sleep 15

          validate_emby_data() {
            local root="$1"
            sudo test -f "$root/data/users.db"
            sudo test -f "$root/data/library.db"
            sudo python3 - "$root" <<'PY_GUARD'
          import json
          import sqlite3
          import sys
          from pathlib import Path
          
          root = Path(sys.argv[1])
          users_db = root / "data/users.db"
          library_db = root / "data/library.db"
          
          users = sqlite3.connect(f"file:{users_db}?mode=ro", uri=True)
          users.row_factory = sqlite3.Row
          names = []
          for row in users.execute("select data from LocalUsersv2"):
              raw = row["data"]
              if isinstance(raw, bytes):
                  raw = raw.decode("utf-8", "ignore")
              names.append(json.loads(raw).get("Name"))
          users.close()
          
          library = sqlite3.connect(f"file:{library_db}?mode=ro", uri=True)
          media_items = library.execute("select count(*) from MediaItems").fetchone()[0]
          root_rows = {
              row[0]: (row[1], row[2])
              for row in library.execute("select Id, Name, type from MediaItems where Id in (1, 2)")
          }
          library_folders = [
              row[0]
              for row in library.execute(
                  "select Name from MediaItems where ParentId = 1 and type = 4 order by Name"
              )
          ]
          media_paths = [
              row[0]
              for row in library.execute(
                  """
                  select Path
                  from MediaItems
                  where ParentId = 2
                    and type = 3
                    and Path is not null
                    and Path like '/onedrive/%'
                  order by Path
                  """
              )
          ]
          library.close()
          
          # 隐私：只输出计数，不输出用户名/媒体路径明细
          print(
              "Emby guard: "
              f"users={len(names)} media_items={media_items} "
              f"folders={len(library_folders)} media_paths={len(media_paths)}"
          )
          if "Derrick" not in names:
              raise SystemExit("❌ Emby guard failed: Derrick user is missing")
          if root_rows.get(1) != ("Media Folders", 2) or root_rows.get(2) != ("root", 1):
              raise SystemExit(f"❌ Emby guard failed: invalid root structure: {root_rows}")
          if not library_folders:
              raise SystemExit("❌ Emby guard failed: no media library folders under Media Folders")
          if not media_paths:
              raise SystemExit("❌ Emby guard failed: no real /onedrive media paths under root")
          PY_GUARD
          }

          # 只有在本地模式下才打包回传（避免覆盖云端的软链接源文件）
          if [ ! -L /var/lib/emby ]; then
              validate_emby_data /var/lib/emby
              echo "🚀 本地模式运行结束，正在打包数据回传 Dropbox..."
              src_kb=$(sudo du -skL /var/lib/emby | awk '{print $1}')
              if [ -z "${src_kb:-}" ] || [ "$src_kb" -le 0 ]; then
                echo "❌ emby archive preflight: unable to calculate source size" >&2
                exit 1
              fi
              echo "待压缩目录大小: ${src_kb}KB"
              require_free_kb /var/lib/emby $((4 * 1024 * 1024)) "emby archive preflight (root)"
              # 流式：tar 直接管道进 rcat 上传 OneDrive（含图片缓存），30GB 级 tarball 不落本地盘
              sudo tar -I 'zstd -3 -T0' -chf - \
                --exclude='logs' \
                --exclude='transcoding-temp' \
                -C /var/lib/emby . \
                | rclone rcat onedrive:backup/emby/emby-backup.tar.zst -v
              echo "📤 备份已流式上传 OneDrive:emby-backup/"
              cleanup_archive_workdir
              cleanup_archive_workdir
          else
              echo "😴 当前为软链接模式，跳过本地打包备份。"
          fi

      - name: send telegram notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          MODE=$(cat /tmp/PLAYBACK_MODE 2>/dev/null || echo unknown)
          case "$STATUS" in
            success) STATUS_EMOJI="✅";;
            failure) STATUS_EMOJI="❌";;
            cancelled) STATUS_EMOJI="⏹";;
            *) STATUS_EMOJI="❓";;
          esac
          MESSAGE="📺 Emby%0A状态: ${STATUS_EMOJI} ${STATUS}%0A模式: ${MODE}%0A时间: $(date '+%Y-%m-%d %H:%M:%S')"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="${MESSAGE}"
          # 播放事件日志归档：便于排查"播了但没通知"
          echo "--- playlog.log (tail 80) ---"
          tail -n 80 /opt/logs/playlog.log 2>/dev/null || echo "(无 playlog.log)"
          # ge2o 自身日志归档（脱敏）：定位播放走中转而非 302 直链的原因
          echo "--- ge2o.log (tail 60, 脱敏) ---"
          # 整行丢弃 ge2o 的 cacheKey 调试日志：内含完整请求头与 cf_clearance Cookie
          tail -n 60 /opt/logs/ge2o.log 2>/dev/null \
            | grep -v "headers to encode cacheKey" \
            | sed -E 's/api_key=[^& ]*/api_key=[redacted]/g; s/X-Emby-Token=[^& ]*/X-Emby-Token=[redacted]/g; s#https?://[^ "]*#<url>#g' || echo "(无 ge2o.log)"
          # odlink 日志归档（脱敏）：直链服务的解析结果——段数/是否跨盘/Graph 码/是否取到直链。
          # 日志本身已脱敏（不落 token、不落完整链接），这里再拦一道 URL 兜底。
          echo "--- odlink.log (tail 60, 脱敏) ---"
          tail -n 60 /opt/logs/odlink.log 2>/dev/null \
            | sed -E 's#https?://[^ "]*#<url>#g' || echo "(无 odlink.log)"
