name: emby

# 架构：两种播放链路，⚠️ 命名反直觉，别按字面理解：
#   - 302（默认）：cloudflared → ge2o:8095 → Emby:8096，ge2o 把 /onedrive/% 媒体路径换成
#     OpenList 签出的 OneDrive 直链并返回 302/307，播放器最终直接向 OneDrive 拉流，
#     视频流不经过 runner（本地挂载仅承载扫描/探测流量）。
#     路径换算约束（2026-09-01 修过一次静默回源的坑）：rclone 挂载根 = OpenList 存储根 =
#     网盘根，Emby 路径 /onedrive/3/... 与 OpenList /onedrive/3/... 原样一致，ge2o 靠
#     emby2openlist 的 /onedrive:/onedrive 原样映射，绝不能给 ge2o 配 mount-path（会剥前缀
#     导致映射永不命中，兜底重试又丢二级目录，只能回源中转）。启动探活/watchdog 里有
#     "Emby 库目录同路径 fs/get"映射探针，换算断了会告警并回退 direct。
#   - direct：cloudflared → Emby:8096，视频流经 runner 中转到网盘，行为与旧版一致。
#     "direct" 指的是"直连 Emby"，不是"直连网盘"，流量反而全走服务器。
# OpenList / OpenList 存储 / ge2o 任一环节不健康时，启动探活与运行中 watchdog 都会自动回退 direct。
# 模式来源：手动触发看 playback_mode 开关；定时/watch 触发看仓库变量 EMBY_PLAYBACK_MODE（缺省 302）。

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"
    # - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      playback_mode:
        description: >-
          302 直链播放开关：
          302 ，播放器直接向 OneDrive 拉流，链路不健康时自动回退 direct；
          direct ，直连 Emby ，视频流经 runner 中转。
          本开关只在手动触发时生效；定时/watch 触发读仓库变量 EMBY_PLAYBACK_MODE（默认 302）。
        type: choice
        default: "302"
        options:
          - "302"
          - "direct"
      clear_emby_cache:
        description: >-
          清空图片缓存（/mnt/emby-cache）。缓存随备份跨 run 持久化，清空后所有海报
          首次浏览重新冷读、本轮收尾的备份也会同步变小。仅在手动触发时生效。
        type: boolean
        default: false
      clear_warm_state:
        description: >-
          清空预热统计（warm-state.json）。档位从头统计：首屏/海报墙预热跳过，
          等 wallwarmer 重新记录客户端档位。仅在手动触发时生效。
        type: boolean
        default: false
  watch:
    # types: started

env:
  # 手动触发：playback_mode 开关（有默认值，恒非空）；定时/watch 触发：仓库变量 EMBY_PLAYBACK_MODE，缺省 302
  PLAYBACK_MODE_INPUT: ${{ github.event.inputs.playback_mode || vars.EMBY_PLAYBACK_MODE || '302' }}
  # runner 默认 UTC，TG 通知与日志时间戳统一为北京时间，避免与本地观感差 8 小时
  TZ: Asia/Shanghai
  # 302 链路脚本目录。checkout 之后可用；各步骤 source 其下的 lib.sh 复用公共函数，
  # 避免同一段逻辑在多个步骤里各写一份（历史上校验/预检代码重复过两套，容易改走样）
  EMBY302_DIR: ${{ github.workspace }}/.github/scripts/emby302
  # 期望存在的 Emby 用户名。仓库公开，用户名绝不写死在代码里；走 secret 还有个好处：
  # GitHub 会自动把 secret 值从日志中打码，即使哪天误打印了也泄漏不出去。
  EMBY_USER: ${{ secrets.EMBY_USER }}

jobs:
  build:
    concurrency: emby-singleton
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        # 检出仓库，使 .github/scripts/emby302/ 下的脚本可用（与 openlist.yml 同做法）
        uses: actions/checkout@v7
      - name: rclone-install
        run: |
          set -e
          # 安装 rclone：GitHub Releases 直下 .deb，失败回退 rclone.org 安装脚本
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          # 写配置 + 持久化：secret 起步 → 掩码 → Dropbox 恢复优先 → 有效性检查 → 同步回 Dropbox
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config
      - name: rclone-run
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3

          # if rclone lsf dropbox:self-hosted/emby/config/ --files-only | grep -q "system.xml"; then
          #   if ! rclone delete dropbox:self-hosted/emby/config/system.xml -vv; then
          #     echo "[WARNING] Failed to delete system.xml, skipping" >&2
          #   fi
          # fi
          # sudo rclone copy dropbox:self-hosted/emby/system.xml dropbox:self-hosted/emby/config/ --ignore-errors -vv

          source "$EMBY302_DIR/lib.sh"
          # 只挂载媒体库所在的 onedrive（/dropbox /gd 挂载无引用，已移除）
          # 参数取向：seek 优先（拖进度/快进快退），不是顺序播放吞吐——
          # 顺序播放走 302 直链、根本不过挂载；挂载真正承载的是"转码"与"direct 回退"，
          # 这两类流量以随机读为主，所以要小 chunk + 并发、小预读、大缓存。
          sudo mkdir -p /onedrive /opt/logs
          sudo chown -R runner:runner /opt/logs
          # 挂载改用 runner 用户：conf 读写全程 runner 身份（root 挂载刷新 token 会把 conf 属主改成 root，是之前 EACCES 的根因）
          grep -q '^user_allow_other' /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf >/dev/null
          sudo mkdir -p /onedrive /mnt/vfs/onedrive
          sudo chown runner:runner /onedrive /mnt/vfs/onedrive

          # VFS 缓存上限按 /mnt 实时剩余空间动态分配：预留 MNT_RESERVE_KB 给 emby 图片缓存
          # 的增长与安全垫，其余基本全给 VFS（缓存越大，来回拖进度越容易命中已下载区间）。
          # 运行期由 --vfs-cache-min-free-space 兜底：真被 emby 缓存挤到时 VFS 主动逐出让位。
          VFS_MAX_G=$(( $(alloc_vfs_cache_kb) / 1024 / 1024 ))
          RESERVE_G=$(( MNT_RESERVE_KB / 1024 / 1024 ))
          echo "VFS 预算: 上限 ${VFS_MAX_G}G / /mnt 剩余 $(( $(mnt_free_kb) / 1024 / 1024 ))G / 预留 ${RESERVE_G}G"

          rclone mount onedrive: /onedrive \
            --config /home/runner/.config/rclone/rclone.conf \
            --cache-dir /mnt/vfs/onedrive \
            --allow-other --umask 000 --attr-timeout 10m \
            --dir-cache-time 72h --poll-interval 0 \
            --vfs-cache-mode full \
            --vfs-cache-max-size ${VFS_MAX_G}G --vfs-cache-max-age 24h \
            --vfs-cache-min-free-space ${RESERVE_G}G \
            --vfs-cache-poll-interval 15s \
            --buffer-size 16M --vfs-read-ahead 64M --max-read-ahead 64M \
            --vfs-read-chunk-size 32M --vfs-read-chunk-streams 4 \
            --vfs-handle-caching 5m \
            --daemon --daemon-wait 60s \
            --log-file /opt/logs/rclone-mount.log --log-level INFO
      - name: install cloudflared
        run: |
          sudo mkdir -p ~/.cloudflared/
          sudo chown -R runner:runner ~/.cloudflared
          # rclone 以 runner 身份运行（与挂载步骤同）：root 运行会在 token 刷新时把
          # rclone.conf 回写成 root:600，之后非 root 的 rclone 读取即 EACCES
          rclone copy dropbox:self-hosted/.cloudflared ~/.cloudflared -vv
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
      - name: Check if the tunnel is running
        env:
          TUNNEL_NAME: "e"
        run: |
          OUTPUT=$(cloudflared tunnel list)
          TUNNEL_LINE=$(echo "$OUTPUT" | grep -w "$TUNNEL_NAME")
          if [ -z "$TUNNEL_LINE" ]; then
            echo "The tunnel '$TUNNEL_NAME' does not exist. Proceeding."
            exit 31
          fi
          CONNECTIONS=$(echo "$TUNNEL_LINE" | awk '{if (NF>=4) print $4; else print "-"}')
          if [ "$CONNECTIONS" == "-" ]; then
            echo "The tunnel '$TUNNEL_NAME' exists but has no active connections. Proceeding."
          else
            echo "The tunnel '$TUNNEL_NAME' is running with connections: $CONNECTIONS. Stopping actions."
            exit 0
          fi
      - name: install openlist
        if: env.PLAYBACK_MODE_INPUT != 'direct'
        env:
          # secret 必须经环境变量注入——直接文本注入 run: 脚本时，密码里含
          # $xxx 片段会被 bash 当未定义变量展开成空（如 @$TM3@ 变 @$TM3@ 骨架）。
          OPENLIST_ADMIN_PASSWORD: ${{ secrets.OPENLIST_ADMIN_PASSWORD }}
        run: |
          main() {
            sudo mkdir -p /opt/openlist
            sudo chown -R runner:runner /opt/openlist /opt/logs

            # 下载 OpenList（失败不致命，健康检查会回退 direct）；认证调用避免 runner 共享出口 IP 匿名配额耗尽
            ASSET_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/OpenListTeam/OpenList/releases/latest \
              | grep -o '"browser_download_url": *"[^"]*openlist-linux-amd64.tar.gz"' | head -1 | cut -d'"' -f4 || true)
            if [ -n "$ASSET_URL" ] && curl -fsSL -o /tmp/openlist.tar.gz "$ASSET_URL"; then
              mkdir -p /tmp/openlist-pkg && tar -xzf /tmp/openlist.tar.gz -C /tmp/openlist-pkg
              find /tmp/openlist-pkg -type f -name openlist -exec sudo install -m 0755 {} /usr/local/bin/openlist \;
            fi
            if ! command -v openlist >/dev/null 2>&1; then
              echo "::warning::OpenList binary unavailable, 302 链路将回退 direct"
              return 0
            fi

            # 恢复：优先 openlist-emby 目录（config.json+data.db，无日志）；旧 tarball 仅作迁移兜底
            RESTORED=false
            if rclone lsf dropbox:self-hosted/openlist-emby/data/ 2>/dev/null | grep -q "config.json"; then
              rclone copy dropbox:self-hosted/openlist-emby/data/ /opt/openlist/ 2>/dev/null \
                && RESTORED=true \
                || echo "::warning::openlist-emby 恢复失败"
            fi
            if [ "$RESTORED" = "true" ]; then
              echo "OpenList data restored from Dropbox"
              # 归一化 config.json 的绝对路径（数据可能来自其他机器/系统）
              OLCONF=/opt/openlist/config.json
              if [ -f "$OLCONF" ]; then
                jq '.database.db_file = "/opt/openlist/data.db" | .temp_dir = "/opt/openlist/temp" | .log.name = "/opt/openlist/log/log.log" | .bleve_dir = "/opt/openlist/bleve"' \
                  "$OLCONF" > /tmp/ol-conf.new 2>/dev/null \
                  && mv /tmp/ol-conf.new "$OLCONF" \
                  && echo "OpenList config.json paths normalized"
              fi
            fi

            nohup openlist server --data /opt/openlist > /opt/logs/openlist.log 2>&1 &
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:5244/ping >/dev/null 2>&1 && break
              sleep 1
            done
            if ! curl -fsS http://127.0.0.1:5244/ping >/dev/null 2>&1; then
              # 兼容不同版本的参数位置
              pkill -f "openlist server" 2>/dev/null || true
              sleep 1
              nohup openlist --data /opt/openlist server > /opt/logs/openlist.log 2>&1 &
              for i in $(seq 1 30); do
                curl -fsS http://127.0.0.1:5244/ping >/dev/null 2>&1 && break
                sleep 1
              done
            fi
            if ! curl -fsS http://127.0.0.1:5244/ping >/dev/null 2>&1; then
              echo "::warning::OpenList failed to start, 302 链路将回退 direct"
              echo "--- openlist.log tail (secrets redacted) ---"
              tail -30 /opt/logs/openlist.log 2>/dev/null | sed -E 's/(password|token|secret)("?:?)[ =:]*[^ ,}]*/\1 [redacted]/Ig' || true
              return 0
            fi
            # OpenList 专有隧道（维护入口，密码 = OPENLIST_ADMIN_PASSWORD）
            cloudflared tunnel create oe >/dev/null 2>&1 || true
            cloudflared tunnel route dns oe oe.'${{ secrets.VD }}'.eu.org >/dev/null 2>&1 || true
            OE_TOKEN=$(cloudflared tunnel token oe 2>/dev/null) || true
            if [ -n "$OE_TOKEN" ]; then
              nohup cloudflared tunnel run --url http://127.0.0.1:5244 --token "$OE_TOKEN" > /opt/logs/cloudflared-oe.log 2>&1 &
              echo "OpenList 维护隧道已启动 (oe)"
            fi

            # 管理密码 = OPENLIST_ADMIN_PASSWORD（oe 维护入口与 ge2o 同一密码）。
            # secret 经 step env 注入进程环境，这里只做变量拷贝，bash 不会二次
            # 解析其内容（$、`、" 等字符原样保留）。剔除粘贴可能带入的首尾空白/换行。
            OPENLIST_PW="$OPENLIST_ADMIN_PASSWORD"
            PW_RAW_LEN=${#OPENLIST_PW}
            OPENLIST_PW=$(printf '%s' "$OPENLIST_PW" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
            rm -f /tmp/openlist-pw-note
            if [ -z "$OPENLIST_PW" ]; then
              # secret 为空 → 本轮随机密码：不通知用户就永远登不上 oe 后台。
              # 密码写入 /tmp 标记文件，由收尾步骤经 TG 私信告知（不落公开日志）。
              OPENLIST_PW=$(openssl rand -hex 16)
              printf '%s' "random:$OPENLIST_PW" > /tmp/openlist-pw-note
              echo "OPENLIST_ADMIN_PASSWORD 未配置，本轮已随机生成管理员密码（TG 私信告知，不落公开日志）"
            fi
            [ "$PW_RAW_LEN" -ne "${#OPENLIST_PW}" ] && echo "OPENLIST_ADMIN_PASSWORD 含首尾空白（原长=$PW_RAW_LEN），已剔除——oe 人工登录失败多半是这个原因"

            # 密码真相源 = OPENLIST_ADMIN_PASSWORD secret：先试 secret 登录——
            # 成功 = 库内已对齐（绝不动密码）；失败 = 库内漂移（Dropbox 历史恢复 /
            # oe 后台人工改动 / 临时轮换遗留），无条件纠正回 secret 并 TG 私信告知。
            # 由此保证：用户随时用 admin + secret 登录 oe 必成，TG 里的临时密码仅本轮有效。
            # 请求体用 jq 构造：密码含 " 或 \ 时手拼 JSON 会注入/破损。
            LOGIN_BODY=$(jq -cn --arg pw "$OPENLIST_PW" '{"username":"admin","password":$pw}')
            TOKEN=$(curl -s -X POST http://127.0.0.1:5244/api/auth/login \
              -H 'Content-Type: application/json' \
              -d "$LOGIN_BODY" | jq -r '.data.token // .data // empty' || true)
            if [ -z "$TOKEN" ]; then
              # 登录失败才重置：全新库（admin 随机密码）或库内密码与 secret 不一致时自愈
              openlist admin set --data /opt/openlist "$OPENLIST_PW" >/dev/null 2>&1 \
                || openlist admin set "$OPENLIST_PW" --data /opt/openlist >/dev/null 2>&1 \
                || true
              # 重置了就该让用户知道：否则 oe 后台手输旧密码必然 Invalid
              printf '%s' "reset:$OPENLIST_PW" > /tmp/openlist-pw-note
              echo "OpenList 库内密码与 secret 不一致，已重置为 secret 值（TG 私信告知，不落公开日志）"
              TOKEN=$(curl -s -X POST http://127.0.0.1:5244/api/auth/login \
                -H 'Content-Type: application/json' \
                -d "$LOGIN_BODY" | jq -r '.data.token // .data // empty' || true)
            fi
            if [ -z "$TOKEN" ]; then
              echo "::warning::OpenList login failed, 302 链路将回退 direct"
              return 0
            fi
            printf '%s' "$TOKEN" > /tmp/openlist-token
            chmod 600 /tmp/openlist-token
            # 凭据语义（三套互不相干）：
            #   1. Graph access_token（微软侧）：rclone.conf 的 refresh_token 自动换取，
            #      odlink 直链解析用——与 OpenList 无关
            #   2. OpenList 会话 token：上面机器自动登录所得（/tmp/openlist-token），
            #      探活/直链转发用——无需人工登录
            #   3. admin 密码：仅 oe 后台人工登录用（admin + OPENLIST_ADMIN_PASSWORD），
            #      只有机器用 secret 登录失败时才自愈重置并 TG 私信告知
            echo "机器已用 OPENLIST_ADMIN_PASSWORD secret 直接登录 OpenList 成功"
            echo "  → oe 后台同凭据可登录：admin + 该 secret；若后续无'密码重置/轮换'TG 通知，本轮密码未变"
            echo "  → OpenList 会话 token 已由机器自动获取（/tmp/openlist-token），与 oe 人工登录互不影响"

            # OpenList 凭据通知：仅在【真正执行过改密动作】时发送（reset / random 兜底）。
            # 直接用 OPENLIST_ADMIN_PASSWORD 登录成功 = 密码本就对齐，按约定静默不打扰。
            # 密码明文只进 TG 私信，绝不写公开日志。
            # 注意：--data-urlencode 会把文本按字面编码，消息内必须用真实换行符（printf \n），
            # 不能拼 %0A（会被二次编码成字面 "%0A" 发出去）。
            send_pw_tg() {
              # $1=场景描述  $2=密码明文  $3=附注规则（可空）
              # 统一 HTML 版式；密码经实体转义后 <code> 等宽展示（本条只进 TG 私信，不落日志）
              local pw_esc
              pw_esc="$(printf '%s' "$2" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"
              local msg
              msg="$(printf '🔐 <b>OpenList 凭据</b>\n━━━━━━━━━━━━━━━━━━\n场景：%s\n用户名：<code>admin</code>\n密码：<code>%s</code>\n入口：<code>https://oe.%s.eu.org</code>\n\n<i>%s\n（本条不会出现在公开日志）</i>' "$1" "$pw_esc" "${{ secrets.VD }}" "$3")"
              curl -s -m 15 -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d chat_id=${{ secrets.TG_CHAT_ID }} \
                --data-urlencode "text=${msg}" \
                -d parse_mode=HTML >/dev/null \
                && echo "已通过 TG 私信发送 OpenList 凭据（不落公开日志）" \
                || echo "::warning::OpenList 凭据 TG 通知发送失败（不影响链路）"
            }
            if [ -s /tmp/openlist-pw-note ]; then
              PW_KIND=$(cut -d: -f1 /tmp/openlist-pw-note)
              PW_VAL=$(cut -d: -f2- /tmp/openlist-pw-note)
              case "$PW_KIND" in
                random) PW_DESC="OPENLIST_ADMIN_PASSWORD 未配置（异常兜底），本轮已随机生成";;
                reset)  PW_DESC="库内密码与 secret 不一致，已纠正回 secret 值";;
                *)      PW_DESC="已变更";;
              esac
              # secret 是唯一长期真相源：本条密码仅本轮有效（oe 后台人工改密在 token
              # 吊销后无法回传持久化，随 run 结束消失）
              send_pw_tg "⚠️ $PW_DESC——本条仅本轮有效" "$PW_VAL" \
                "长期有效密码 = OPENLIST_ADMIN_PASSWORD（下轮自动恢复为它）"
              shred -u /tmp/openlist-pw-note 2>/dev/null || rm -f /tmp/openlist-pw-note
            else
              # 直接用 OPENLIST_ADMIN_PASSWORD 登录成功 = 库内密码本就对齐，
              # 未发生任何改密动作 → 按约定不打扰，不发送通知。
              echo "已用 OPENLIST_ADMIN_PASSWORD 直接登录成功，密码未变更，本轮不发送凭据通知"
            fi

            # 全新初始化：用 rclone 凭据注册 OneDrive 存储（非致命，失败则回退）
            STORAGE_COUNT=$(curl -s http://127.0.0.1:5244/api/admin/storage/list \
              -H "Authorization: $TOKEN" | jq -r '.data.content // [] | length' 2>/dev/null || echo 0)
            if [ "${STORAGE_COUNT:-0}" = "0" ]; then
              CONF="$HOME/.config/rclone/rclone.conf"
              sudo ls -la "$(dirname "$CONF")" || true
              SECTION=$(awk '/^\[onedrive\]/{f=1;next} /^\[/{f=0} f' "$CONF" 2>/dev/null || true)
              if [ -z "$SECTION" ]; then
                SECTION=$(sudo awk '/^\[onedrive\]/{f=1;next} /^\[/{f=0} f' "$CONF" 2>/dev/null || true)
                sudo chown runner:runner "$CONF" 2>/dev/null || true
              fi
              RID=$(printf '%s\n' "$SECTION" | grep -o '^[[:space:]]*client_id[[:space:]]*=.*' | head -1 | sed 's/^[[:space:]]*client_id[[:space:]]*=[[:space:]]*//' || true)
              RSEC=$(printf '%s\n' "$SECTION" | grep -o '^[[:space:]]*client_secret[[:space:]]*=.*' | head -1 | sed 's/^[[:space:]]*client_secret[[:space:]]*=[[:space:]]*//' || true)
              RTOK=$(printf '%s\n' "$SECTION" | grep -o '^[[:space:]]*token[[:space:]]*=.*' | head -1 | sed 's/^[[:space:]]*token[[:space:]]*=[[:space:]]*//' | jq -r '.refresh_token // empty' 2>/dev/null || true)
              if [ -n "$RID" ] && [ -n "$RTOK" ]; then
                ADDITION=$(jq -nc --arg rt "$RTOK" --arg cid "$RID" --arg csec "$RSEC" \
                  '{region:"global",is_sharepoint:false,use_online_api:true,api_url_address:"https://api.oplist.org/onedrive/renewapi",client_id:$cid,client_secret:$csec,redirect_uri:"https://api.oplist.org/onedrive/callback",refresh_token:$rt,site_id:"",chunk_size:5}')
                BODY=$(jq -nc --arg add "$ADDITION" \
                  '{mount_path:"/onedrive",driver:"Onedrive",cache_expiration:30,status:"work",order:0,addition:$add}')
                if curl -s -X POST http://127.0.0.1:5244/api/admin/storage/create \
                     -H "Authorization: $TOKEN" -H 'Content-Type: application/json' -d "$BODY" >/dev/null \
                   && curl -s -X POST http://127.0.0.1:5244/api/fs/list \
                        -H "Authorization: $TOKEN" -H 'Content-Type: application/json' \
                        -d '{"path":"/onedrive","page":1,"per_page":10}' | jq -e '.code == 200' >/dev/null; then
                  echo "OpenList OneDrive storage provisioned"
                  tar -I 'zstd -3 -T0' -cf /tmp/openlist-data.tar.zst -C /opt/openlist . \
                    && rclone copyto /tmp/openlist-data.tar.zst dropbox:self-hosted/openlist-data.tar.zst -vv \
                    && rm -f /tmp/openlist-data.tar.zst \
                    || echo "::warning::provision persist failed"
                else
                  echo "::warning::OpenList storage provisioning failed, 302 链路将回退 direct"
                fi
              else
                echo "::warning::rclone.conf 缺少 onedrive client_id/refresh_token，跳过自动初始化"
              fi
            fi
          }
          main || echo "::warning::install openlist failed, 302 链路将回退 direct"
      - name: probe onedrive shortcuts
        continue-on-error: true
        run: |
          # 只读探测：确认快捷方式(remoteItem)能否被 Graph 跟随、能否取到预授权直链
          # 不改变任何链路行为，探测失败也不影响本次运行
          bash "$GITHUB_WORKSPACE/.github/scripts/emby302/od_probe.sh" || echo "::warning::OneDrive 快捷方式探测失败（不影响播放）"
      - name: start odlink
        if: env.PLAYBACK_MODE_INPUT != 'direct'
        run: |
          main() {
            # odlink：OpenList 协议兼容的 OneDrive 直链服务。
            # 网盘根目录下 0-5/backup 全是快捷方式(remoteItem)，OpenList 官方驱动不跟随，
            # /onedrive/3/... 必然 object not found → 302 直链从不生效、播放静默回源中转。
            # odlink 对外伪装 OpenList 的 /api/fs/*，对内用 Graph 复刻 rclone 的快捷方式
            # 跟随（逐段下钻，遇 remoteItem 切到 /drives/{driveId}/items/{itemId}），
            # 把 @microsoft.graph.downloadUrl 作为 raw_url 交回 ge2o。
            # 非快捷方式路径与解析失败一律原样转发本机 OpenList，保证零回归。
            #
            # 直链源契约写入 /tmp/link-host + /tmp/link-token，供 ge2o 与各处探活统一读取：
            # odlink 就绪走 :5245，否则退回 OpenList :5244（行为与今天完全一致）。
            OD_TOKEN=$(openssl rand -hex 16)
            printf '%s' "$OD_TOKEN" > /tmp/odlink-token
            chmod 600 /tmp/odlink-token
            mkdir -p /opt/logs
            ODLINK_TOKEN="$OD_TOKEN" \
            ODLINK_PORT=5245 \
            ODLINK_LOG=/opt/logs/odlink.log \
            ODLINK_UPSTREAM=http://127.0.0.1:5244 \
            ODLINK_UPSTREAM_TOKEN=/tmp/openlist-token \
            ODLINK_ROOT=/onedrive \
            nohup python3 "$GITHUB_WORKSPACE/.github/scripts/emby302/odlink.py" \
              > /opt/logs/odlink.out 2>&1 &
            sleep 3
            if curl -fsS -m 5 http://127.0.0.1:5245/ping >/dev/null 2>&1; then
              printf '%s' "http://127.0.0.1:5245" > /tmp/link-host
              printf '%s' "$OD_TOKEN" > /tmp/link-token
              echo "odlink 已在 :5245 就绪（快捷方式跟随生效，302 直链源=odlink）"
            else
              printf '%s' "http://127.0.0.1:5244" > /tmp/link-host
              cp /tmp/openlist-token /tmp/link-token 2>/dev/null || printf '' > /tmp/link-token
              echo "::warning::odlink 未响应，302 直链源退回 OpenList(:5244)"
            fi
            chmod 600 /tmp/link-token 2>/dev/null || true
            tail -5 /opt/logs/odlink.log 2>/dev/null || true
          }
          main || {
            printf '%s' "http://127.0.0.1:5244" > /tmp/link-host
            cp /tmp/openlist-token /tmp/link-token 2>/dev/null || printf '' > /tmp/link-token
            echo "::warning::start odlink failed, 302 直链源退回 OpenList"
          }
      - name: install emby
        run: |
          set -euo pipefail
          # zstd 用于后续 30GB 级备份包的流式解压
          sudo apt-get update && sudo apt-get install -y zstd
          # 公共函数（磁盘预检 / 归档清理 / Emby 数据校验 / 日志脱敏）统一在 lib.sh
          source "$EMBY302_DIR/lib.sh"
          # 30GB 级 tarball 解压前先确认空间：解压到一半失败会留下半恢复的残库，
          # 而残库会被 Emby 当成空库重建，比本轮直接失败更糟
          # 恢复全链路已改为流式（不落地 tarball），/tmp 只需容下 apt/dpkg 的产物
          require_free_kb /tmp $((1024 * 1024)) "emby restore preflight"
          # 认证调用 GitHub API：runner 共享出口 IP 的匿名配额（60 次/h）极易耗尽，
          # 限流响应里没有 browser_download_url，替换结果为空 → curl 报 "no URL specified" 直接失败
          EMBY_DEB_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/MediaBrowser/Emby.Releases/releases/latest \
            | grep -oP '"browser_download_url": "\K(.*emby-server-deb.*amd64.deb)(?=")')
          [ -n "$EMBY_DEB_URL" ] || { echo "::error::未获取到 Emby 最新版下载地址（GitHub API 异常/限流）"; exit 1; }
          curl -fL --retry 3 -o emby-server.deb "$EMBY_DEB_URL"
          sudo dpkg -i emby-server.deb
          
          # dpkg -i 会自动启动 emby-server，需要先把它停掉，否则 /var/lib/emby 会被锁定无法删除
          sudo systemctl stop emby-server || true

          # 尝试从备份恢复。恢复必须通过"指定用户 + 媒体库结构 + 真实媒体路径"校验，
          # 否则直接失败，禁止启动空库。用户名来自 EMBY_USER secret，不写死在仓库里。
          sudo rm -rf /var/lib/emby
          sudo mkdir -p /var/lib/emby
          sudo chown -R emby:emby /var/lib/emby
          # 图片缓存软链到 /mnt（根分区 ~14GB 放不下 ~30GB 缓存；/mnt 独立分区 ~65GB）
          sudo mkdir -p /mnt/emby-cache
          sudo chown emby:emby /mnt/emby-cache
          sudo ln -sfn /mnt/emby-cache /var/lib/emby/cache
          BACKUP_NAME="emby-backup.tar.zst"

          echo "🔍 正在检查 OneDrive 上的压缩备份（含图片缓存，流式解压不落本地盘）..."
          cleanup_archive_workdir
          RESTORED_FROM=
          if rclone lsf onedrive:backup/emby/$BACKUP_NAME 2>/dev/null | grep -q "$BACKUP_NAME"; then
              BK_BYTES=$(rclone lsl onedrive:backup/emby/$BACKUP_NAME 2>/dev/null | awk '{print $1}')
              # 图片缓存实际多大只有解压后才知道，所以按"包体 + 预留"动态判定，不写死经验值；
              # 根分区只承接元数据（缓存已软链到 /mnt），2GB 足够。
              echo "/mnt 状态: 剩余 $(( $(mnt_free_kb) / 1048576 ))G / VFS 已用 $(( $(dir_used_kb /mnt/vfs/onedrive) / 1048576 ))G"
              require_free_kb /mnt $(( BK_BYTES / 1024 + MNT_RESERVE_KB )) "emby cache extract preflight (/mnt)"
              require_free_kb /var/lib/emby $((2 * 1024 * 1024)) "emby data extract preflight (root)"
              echo "✅ 发现 OneDrive 备份，流式解压..."
              if rclone cat onedrive:backup/emby/$BACKUP_NAME | sudo tar -I zstd -xf - -C /var/lib/emby/ && sudo chown -R emby:emby /var/lib/emby && validate_emby_data /var/lib/emby; then
                  echo "🎉 OneDrive 备份流式恢复并校验成功"
                  RESTORED_FROM=onedrive
              else
                  echo "::warning::OneDrive 流式恢复失败，尝试 Dropbox 兜底..."
                  sudo rm -rf /var/lib/emby/* 2>/dev/null || true
              fi
          fi
          # Dropbox 兜底同样走流式：30GB 级 tarball 一旦落到 /tmp（根分区 ≈14GB）必然撑爆，
          # 所以与 OneDrive 一级保持同一形态——rclone cat 直接管道进 tar，全程不落本地盘。
          if [ -z "$RESTORED_FROM" ] && rclone lsf dropbox:self-hosted/$BACKUP_NAME 2>/dev/null | grep -q "$BACKUP_NAME"; then
              BK_BYTES=$(rclone lsl dropbox:self-hosted/$BACKUP_NAME 2>/dev/null | awk '{print $1}')
              if [ -z "${BK_BYTES:-}" ] || [ "$BK_BYTES" -le 0 ]; then
                  echo "❌ emby extract preflight: unable to calculate archive size" >&2
                  exit 1
              fi
              echo "Dropbox 备份大小: $(( BK_BYTES / 1048576 ))MB"
              echo "/mnt 状态: 剩余 $(( $(mnt_free_kb) / 1048576 ))G / VFS 已用 $(( $(dir_used_kb /mnt/vfs/onedrive) / 1048576 ))G"
              require_free_kb /mnt $(( BK_BYTES / 1024 + MNT_RESERVE_KB )) "emby cache extract preflight (/mnt)"
              require_free_kb /var/lib/emby $((2 * 1024 * 1024)) "emby data extract preflight (root)"
              echo "✅ 发现 Dropbox 备份，流式解压..."
              if rclone cat dropbox:self-hosted/$BACKUP_NAME | sudo tar -I zstd -xf - -C /var/lib/emby/ \
                 && sudo chown -R emby:emby /var/lib/emby && validate_emby_data /var/lib/emby; then
                  echo "🎉 Dropbox 压缩备份流式恢复并校验成功"
                  RESTORED_FROM=dropbox
              else
                  echo "::warning::Dropbox 流式恢复失败，继续尝试目录级恢复..."
                  sudo rm -rf /var/lib/emby/* 2>/dev/null || true
              fi
              cleanup_archive_workdir
          fi
          if [ -z "$RESTORED_FROM" ]; then
              cleanup_archive_workdir
              echo "⚠️ 未发现压缩备份，尝试从 Dropbox 目录备份恢复..."
              # 目录级恢复无法流式（必须先落到本地目录），所以按远端体量预检 /tmp：
              # 根分区 ≈14GB 容不下 30GB 级缓存，宁可明确失败，也不要等磁盘撑爆后再炸。
              DIR_BYTES=$(rclone size dropbox:self-hosted/emby --json 2>/dev/null | jq -r '.bytes // 0' || echo 0)
              if [ -z "${DIR_BYTES:-}" ] || [ "$DIR_BYTES" -le 0 ]; then
                  echo "❌ emby dir-restore preflight: unable to calculate remote size" >&2
                  exit 1
              fi
              require_free_kb /tmp $(( DIR_BYTES / 1024 + 1024 * 1024 )) "emby dir-restore preflight (/tmp)"
              RESTORE_DIR=/tmp/emby-dir-restore
              rm -rf "$RESTORE_DIR"
              mkdir -p "$RESTORE_DIR"
              rclone copy dropbox:self-hosted/emby "$RESTORE_DIR" -vv
              sudo rm -rf /var/lib/emby/*
              sudo cp -a "$RESTORE_DIR"/. /var/lib/emby/
              # 上面的 rm -rf 会把 cache 软链本身也删掉；不重建，Emby 就会把缓存写进根分区
              sudo rm -rf /var/lib/emby/cache
              sudo ln -sfn /mnt/emby-cache /var/lib/emby/cache
              sudo chown -R emby:emby /var/lib/emby
              rm -rf "$RESTORE_DIR"
              validate_emby_data /var/lib/emby
              echo "🎉 Dropbox 目录备份恢复并校验成功"
          fi
          
          echo "==========/var/lib/emby==========="
          ls -la /var/lib/emby
      - name: clear cache/state (可选)
        # 手动触发的清理开关（clear_emby_cache / clear_warm_state），定时/watch 触发时
        # inputs 为空、条件不成立、整步跳过。时机在 restore 之后、Emby 启动之前：
        # restore 会把备份里的缓存与统计铺回来，所以必须在其后清，否则等于没清。
        if: inputs.clear_emby_cache == true || inputs.clear_warm_state == true
        run: |
          if [ "${{ inputs.clear_emby_cache }}" = "true" ]; then
            # 连目录一起删再重建，确保子目录一个不剩；属主保持 emby:emby
            sudo rm -rf /mnt/emby-cache
            sudo mkdir -p /mnt/emby-cache
            sudo chown emby:emby /mnt/emby-cache
            echo "🧹 /mnt/emby-cache 已清空（图片缓存从零开始，本轮收尾备份会同步变小）"
          fi
          if [ "${{ inputs.clear_warm_state }}" = "true" ]; then
            sudo rm -f /var/lib/emby/warm-state.json
            echo "🧹 预热统计 warm-state.json 已清空（档位从头统计；本轮 wallwarmer 会重新记录）"
          fi
      - name: run emby
        run: |
          main() {
            # API 密钥自愈：恢复出的库里若没有 secret 密钥对应的登录态（历史教训：
            # Tokens_2 里的记录被登出/迁移后置 IsActive=0，playlog 反查/预热/优雅停机
            # 会全程 401，播放通知片名显示"未知"），启动 Emby 前把它写回 Tokens_2 并
            # 激活——以一台专属设备的登录态存在，幂等可重跑。失败不阻塞启动。
            KEY="${{ secrets.EMBY_API_TOKEN }}"
            DB=/var/lib/emby/data/authentication.db
            if [ -n "$KEY" ] && [ -f "$DB" ]; then
              which sqlite3 >/dev/null 2>&1 || sudo apt-get install -y -qq sqlite3 >/dev/null 2>&1 || true
              ESC=${KEY//\'/\'\'}
              if sudo sqlite3 "$DB" "PRAGMA foreign_keys=ON; BEGIN;
                INSERT INTO Devices2 (ReportedDeviceId, ReportedName, CustomName)
                  SELECT 'emby302-workflow', 'emby302 workflow', 'workflow'
                  WHERE NOT EXISTS (SELECT 1 FROM Devices2 WHERE ReportedDeviceId='emby302-workflow');
                INSERT INTO Tokens_2 (AccessToken, DeviceId, AppName, AppVersion, UserId, IsActive, DateCreatedInt, DateLastActivityInt)
                  SELECT '$ESC',
                         (SELECT Id FROM Devices2 WHERE ReportedDeviceId='emby302-workflow'),
                         'emby302 workflow', '1.0',
                         COALESCE((SELECT UserId FROM Tokens_2 WHERE IsActive=1 AND UserId IS NOT NULL
                                   ORDER BY DateLastActivityInt DESC LIMIT 1), 1),
                         1, strftime('%s','now'), strftime('%s','now')
                  WHERE NOT EXISTS (SELECT 1 FROM Tokens_2 WHERE AccessToken='$ESC');
                UPDATE Tokens_2 SET IsActive=1 WHERE AccessToken='$ESC';
                COMMIT;" 2>/dev/null; then
                echo "🔑 Emby API 密钥已对齐（Tokens_2 专属登录态，幂等；密钥内容不打印）"
              else
                echo "::warning::Emby API 密钥自愈失败（schema 不符？），反查/预热/停机可能 401"
              fi
            fi

            sudo nohup /opt/emby-server/bin/emby-server > /opt/logs/emby-console.log 2>&1 &
            # 只有 install emby 阶段完成了数据完整性校验，才允许后续备份步骤执行。
            touch /tmp/EMBY_READY_FOR_BACKUP
          }
          main
      - name: install ge2o
        if: env.PLAYBACK_MODE_INPUT != 'direct'
        run: |
          main() {
            mkdir -p /opt/ge2o
            ASSET_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/AmbitiousJun/go-emby2openlist/releases/latest \
              | grep -o '"browser_download_url": *"[^"]*ge2o-linux_amd64"' | head -1 | cut -d'"' -f4 || true)
            if [ -n "$ASSET_URL" ] && curl -fsSL -o /opt/ge2o/ge2o "$ASSET_URL"; then
              chmod +x /opt/ge2o/ge2o
            fi
            if [ ! -x /opt/ge2o/ge2o ]; then
              echo "::warning::ge2o binary unavailable, 302 链路将回退 direct"
              return 0
            fi

            # 直链源统一读 start odlink 写入的契约：odlink(:5245) 优先，否则 OpenList(:5244)
            OPENLIST_HOST=$(cat /tmp/link-host 2>/dev/null || echo "http://127.0.0.1:5244")
            OPENLIST_TOKEN=$(cat /tmp/link-token 2>/dev/null || echo "")
            echo "ge2o 直链源: $OPENLIST_HOST"
            APISECRET=$(openssl rand -hex 16)
          cat > /opt/ge2o/config.yml <<GE2O_EOF
          emby:
            host: http://127.0.0.1:8096
            # ⚠️ 不要配 mount-path：它会先剥掉 Emby 路径的 /onedrive 前缀，
            # 导致 emby2openlist 映射（/onedrive:/onedrive）永不命中——
            # 首选路径变成 /3/...（storage not found），兜底重试又丢掉网盘里的
            # 二级目录 /3，/onedrive/... 必然 object not found，只能回源中转。
            # rclone 挂载根与 OpenList 存储根都指向网盘根，两侧路径原样一致，
            # 保持 /onedrive 前缀不剥、靠映射原样替换才是正确换算。
            episodes-unplay-prior: false
            resort-random-items: false
            proxy-error-strategy: origin
            images-quality: 100
            download-strategy: 403
          openlist:
            host: $OPENLIST_HOST
            token: $OPENLIST_TOKEN
          video-preview:
            enable: false
          path:
            emby2openlist:
              - /onedrive:/onedrive
          cache:
            enable: true
            expired: 1d
          ssl:
            enable: false
          log:
            disable-color: true
          ge2o:
            api-secret: $APISECRET
            web:
              disable: true
          GE2O_EOF

            cd /opt/ge2o
            GIN_MODE=release nohup ./ge2o > /opt/logs/ge2o.log 2>&1 &
            sleep 3
            if curl -fsS -m 5 http://127.0.0.1:8095/emby/System/Info/Public >/dev/null 2>&1; then
              echo "ge2o is up on :8095"
            else
              echo "::warning::ge2o not responding yet, 健康检查会决定最终模式"
            fi
          }
          main || echo "::warning::install ge2o failed, 302 链路将回退 direct"
      - name: run cloudflared
        # ⚠️ 这个 run 块已接近 GitHub 的 21000 字符表达式上限：块内只要含 ${{ }}，
        # 整块文本都会按"表达式模板"整体校验，超限直接判 workflow 非法。
        # secrets 一律经 step 级 env 注入、块内只引用 $VAR，让 run 块保持纯字面量。
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          EMBY_API_KEY: ${{ secrets.EMBY_API_TOKEN }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          source "$EMBY302_DIR/lib.sh"
          # 取值统一去空白转小写，仓库变量写成 "Direct" / "DIRECT" 也能识别
          MODE=$(printf '%s' "${PLAYBACK_MODE_INPUT:-302}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          case "$MODE" in
            302|direct) ;;
            *) echo "::warning::未知的播放模式 '$MODE'（EMBY_PLAYBACK_MODE），按 302 处理"; MODE="302";;
          esac
          # 探针诊断专用脱敏：比 lib.sh 的归档脱敏更严格，媒体路径也一并脱敏——
          # 探针输出里会带真实的 /onedrive/... 库路径，不能进公开日志
          redact_pub() {
            sed -E 's/api_key=[^& "]*/api_key=[redacted]/g; s#https?://[^ ",}]*#<url>#g; s#/onedrive/[^,"}]*#<path>#g'
          }
          if [ "$MODE" = "302" ]; then
            # 直链映射探针：取一个媒体库根目录（/onedrive/...），用同路径直查 OpenList fs/get。
            # ge2o 路径换算断了会静默回源（播放一直显示"中转"），这里在启动时就暴露。
            MEDIA_DIR=$(curl -s -m 8 "http://127.0.0.1:8096/emby/Library/VirtualFolders?api_key=$EMBY_API_KEY" \
              | jq -r '[.[].Locations[]?] | map(select(startswith("/onedrive"))) | .[0] // empty' 2>/dev/null || true)
            echo "直链映射探针: ${MEDIA_DIR:+已取到媒体库目录}"
            OK=0
            for i in 1 2 3; do
              # 探活必须打 ge2o 实际在用的那个源（odlink:5245 优先，否则 OpenList:5244），
              # 否则会出现"探活通过、但 ge2o 仍在绕 OpenList"的假健康
              TOK=$(link_token)
              LINK_HOST=$(link_host)
              MAP_OK=1
              if [ -n "$TOK" ] && [ -n "$MEDIA_DIR" ]; then
                RESP=$(curl -s -m 10 -X POST ${LINK_HOST}/api/fs/get \
                  -H "Authorization: $TOK" -H 'Content-Type: application/json' \
                  -d "$(jq -nc --arg p "$MEDIA_DIR" '{path:$p}')")
                GC=$(printf '%s' "$RESP" | jq -r '.code // 0' 2>/dev/null || echo 0)
                [ "$GC" = "200" ] || { MAP_OK=0; echo "直链映射自检失败: fs/get code=$GC msg=$(printf '%s' "$RESP" | jq -r '.message // empty' 2>/dev/null | redact_pub | head -c 200)"; }
              fi
              if curl -fsS -m 5 http://127.0.0.1:8095/emby/System/Info/Public >/dev/null 2>&1 \
                 && [ -n "$TOK" ] \
                 && [ "$MAP_OK" = "1" ] \
                 && curl -s -m 5 -X POST ${LINK_HOST}/api/fs/list \
                      -H "Authorization: $TOK" -H 'Content-Type: application/json' \
                      -d "$(jq -nc --arg p "${MEDIA_DIR:-/onedrive}" '{path:$p,page:1,per_page:1}')" \
                    | jq -e '.code == 200' >/dev/null 2>&1; then
                OK=1
                break
              fi
              sleep 10
            done
            if [ "$OK" != "1" ]; then
              echo "::warning::302 chain unhealthy, falling back to direct mode"
              echo "--- OpenList fs/list 诊断 ---"
              curl -s -X POST ${LINK_HOST}/api/fs/list \
                -H "Authorization: $TOK" -H 'Content-Type: application/json' \
                -d '{"path":"/onedrive","page":1,"per_page":3}' 2>/dev/null \
                | jq -c '{code: .code, msg: .message, total: (.data.total // 0)}' 2>/dev/null || true
              # 映射诊断：fs/get 报错原因 + 同目录 fs/list 对照（区分"get 语义问题"和"子树整体不可达"）
              if [ -n "$MEDIA_DIR" ]; then
                echo "--- 直链映射诊断（脱敏）---"
                curl -s -m 10 -X POST ${LINK_HOST}/api/fs/get \
                  -H "Authorization: $TOK" -H 'Content-Type: application/json' \
                  -d "$(jq -nc --arg p "$MEDIA_DIR" '{path:$p}')" 2>/dev/null \
                  | jq -c '{code: .code, msg: .message}' 2>/dev/null | redact_pub || true
                curl -s -m 10 -X POST ${LINK_HOST}/api/fs/list \
                  -H "Authorization: $TOK" -H 'Content-Type: application/json' \
                  -d "$(jq -nc --arg p "$MEDIA_DIR" '{path:$p,page:1,per_page:1}')" 2>/dev/null \
                  | jq -c '{code: .code, msg: .message, total: (.data.total // 0)}' 2>/dev/null | redact_pub || true
              fi
              MODE="direct"
            fi
          fi
          echo "$MODE" > /tmp/PLAYBACK_MODE
          echo "PLAYBACK_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Playback mode: $MODE"
          # 实时通知：模式决策后立刻推送 Telegram（不等运行结束）。
          # 汇总 302 链路的关键信息：直链源、快捷方式解析、探活结果——
          # 一条消息即可判断本轮直链是否真的可用。
          LINK_SRC=$(cat /tmp/link-host 2>/dev/null || echo "-")
          case "$LINK_SRC" in
            *5245) SRC_NAME="odlink:5245（Graph 跟随快捷方式）";;
            *5244) SRC_NAME="OpenList:5244（回退源）";;
            *)     SRC_NAME="${LINK_SRC:-未启用}";;
          esac
          OD_STATS=$(curl -s -m 5 http://127.0.0.1:5245/stats 2>/dev/null || true)
          OD_READY=$(printf '%s' "$OD_STATS" | jq -r '.ready // empty' 2>/dev/null || true)
          OD_SC=$(printf '%s' "$OD_STATS" | jq -r '.shortcuts // 0' 2>/dev/null || echo 0)
          if [ "$OD_READY" = "true" ]; then
            OD_LINE="快捷方式: ${OD_SC} 个已解析（Graph 就绪）"
          else
            OD_LINE="快捷方式: odlink 未就绪"
          fi
          # 统一 HTML 通知 + 统一收尾区（tg_notify.sh，checkout 后可用）
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"
          START_MSG=""
          tg_add_title START_MSG "📺 Emby 服务启动"
          tg_add_kv START_MSG "模式" "$MODE"
          tg_add_kv START_MSG "直链源" "$SRC_NAME"
          tg_add_kv START_MSG "快捷方式" "${OD_LINE#快捷方式: }"
          tg_add_kv START_MSG "探活" "${MAP_OK:-?}"
          tg_add_kv START_MSG "时间" "$(date '+%Y-%m-%d %H:%M:%S %Z')"
          tg_add_footer START_MSG
          echo "TG(启动): 已构建统一版式消息"
          send_tg "$START_MSG" || true

          if [ "$MODE" = "302" ]; then
            nohup cloudflared tunnel run --url http://127.0.0.1:8095 e > /opt/logs/cloudflared.log 2>&1 &
          else
            nohup cloudflared tunnel run --url http://127.0.0.1:8096 e > /opt/logs/cloudflared.log 2>&1 &
          fi

          # 运行中 watchdog：302 模式下每分钟探活，连续 3 次失败自动回退 direct
          cat > /opt/watchdog.sh <<'WD_EOF'
          #!/bin/bash
          # 统一通知发送层（回退通知用；TG_RUN_* 经 step env 透传）
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"
          FAIL=0
          while true; do
            sleep 60
            MODE=$(cat /tmp/PLAYBACK_MODE 2>/dev/null || echo direct)
            [ "$MODE" = "direct" ] && continue
            TOK=$(cat /tmp/link-token 2>/dev/null || true)
            LINK_HOST=$(cat /tmp/link-host 2>/dev/null || echo "http://127.0.0.1:5244")
            MAP_OK=1
            if [ -n "$TOK" ] && [ -n "$MEDIA_DIR" ]; then
              GC=$(curl -s -m 10 -X POST ${LINK_HOST}/api/fs/get \
                     -H "Authorization: $TOK" -H 'Content-Type: application/json' \
                     -d "$(jq -nc --arg p "$MEDIA_DIR" '{path:$p}')" \
                   | jq -r '.code // 0' 2>/dev/null || echo 0)
              [ "$GC" = "200" ] || MAP_OK=0
            fi
            if curl -fsS -m 5 http://127.0.0.1:8095/emby/System/Info/Public >/dev/null 2>&1 \
               && [ -n "$TOK" ] \
               && [ "$MAP_OK" = "1" ] \
               && curl -s -m 5 -X POST ${LINK_HOST}/api/fs/list \
                    -H "Authorization: $TOK" -H 'Content-Type: application/json' \
                    -d "$(jq -nc --arg p "${MEDIA_DIR:-/onedrive}" '{path:$p,page:1,per_page:1}')" \
                  | jq -e '.code == 200' >/dev/null 2>&1; then
              FAIL=0
            else
              FAIL=$((FAIL+1))
              echo "$(date '+%F %T') 302 health fail #$FAIL map_ok=$MAP_OK"
            fi
            if [ "$FAIL" -ge 3 ]; then
              echo "302 unhealthy -> switching to direct"
              pkill -f "cloudflared tunnel run" 2>/dev/null
              sleep 3
              nohup cloudflared tunnel run --url http://127.0.0.1:8096 e > /opt/logs/cloudflared-direct.log 2>&1 &
              echo direct > /tmp/PLAYBACK_MODE
              # 统一 HTML 通知 + 统一收尾区（TG_RUN_* 由 step env 透传）
              WD_MSG=""
              tg_add_title WD_MSG "⚠️ Emby 302 链路回退"
              tg_add_kv WD_MSG "事件" "连续 3 次探活失败"
              tg_add_kv WD_MSG "动作" "已自动回退 direct 模式"
              tg_add_footer WD_MSG
              send_tg "$WD_MSG" >/dev/null 2>&1 || true
              exit 0
            fi
          done
          WD_EOF
          MEDIA_DIR="$MEDIA_DIR" TELEGRAM_BOT_TOKEN="$TG_BOT_TOKEN" TG_CHAT_ID="$TG_CHAT_ID" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" TG_RUN_URL="$TG_RUN_URL" TG_RUN_STARTED_AT="$TG_RUN_STARTED_AT" \
            nohup bash /opt/watchdog.sh > /opt/logs/watchdog.log 2>&1 &
      - name: start playlog
        # 从 "run cloudflared" 拆出：该 step 的 run 块必须远离 GitHub 的 21000 字符
        # 表达式上限（块内含 ${{ }} 时整块按表达式模板校验，超限直接判 workflow 非法）。
        # secrets 经 step 级 env 注入，块内只引用 $VAR，保持 run 块为纯字面量。
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          EMBY_API_KEY: ${{ secrets.EMBY_API_TOKEN }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          # 播放事件监听：
          #   302 模式主源    = ge2o 访问日志（3xx → [302直链]，2xx → [中转]）
          #   direct 模式兜底 = Emby Sessions 轮询（ge2o 被旁路，ge2o.log 里不会有播放记录）
          #   两个数据源共享去重状态，同一个 item 180s 内只推一次
          cat > /opt/playlog.sh <<'PL_EOF'
          #!/bin/bash
          # 播放事件监听：ge2o 访问日志（302 模式主源）+ Emby Sessions 轮询（兜底）
          # 输出全部进 /opt/logs/playlog.log；workflow 日志是公开的，URL 与密钥一律脱敏
          LOG=/opt/logs/ge2o.log
          EMBY=http://127.0.0.1:8096
          STATE=/tmp/playlog-state
          LOCK=/tmp/playlog.lock
          touch "$LOG" "$STATE"
          DIAG=0
          SFAIL=0
          CTX=0
          # 脱敏：密钥、直链 URL；并整行丢弃 ge2o 的 cacheKey 调试日志（内含完整请求头与 cf_clearance Cookie）
          redact() {
            grep -v "headers to encode cacheKey" \
              | sed -E 's/api_key=[^& ]*/api_key=[redacted]/g; s/X-Emby-Token=[^& ]*/X-Emby-Token=[redacted]/g; s#https?://[^ "]*#<url>#g'
          }

          # Emby API 请求：优先用自检选出的认证方式，失败自动回退另一种，返回 http 码
          emby_get() { # $1=路径(含前导 /) $2=输出文件
            local path=$1 out=$2 code
            if [ "$AUTH_MODE" = "query" ]; then
              case "$path" in
                *\?*) code=$(curl -s -m 8 -o "$out" -w '%{http_code}' "$EMBY$path&api_key=$EMBY_API_KEY");;
                *)    code=$(curl -s -m 8 -o "$out" -w '%{http_code}' "$EMBY$path?api_key=$EMBY_API_KEY");;
              esac
              if [ "$code" = "200" ]; then printf '%s' "$code"; return 0; fi
              code=$(curl -s -m 8 -o "$out" -w '%{http_code}' -H "X-Emby-Token: $EMBY_API_KEY" "$EMBY$path")
            else
              code=$(curl -s -m 8 -o "$out" -w '%{http_code}' \
                       -H "X-Emby-Token: $EMBY_API_KEY" "$EMBY$path")
              if [ "$code" = "200" ]; then printf '%s' "$code"; return 0; fi
              case "$path" in
                *\?*) code=$(curl -s -m 8 -o "$out" -w '%{http_code}' "$EMBY$path&api_key=$EMBY_API_KEY");;
                *)    code=$(curl -s -m 8 -o "$out" -w '%{http_code}' "$EMBY$path?api_key=$EMBY_API_KEY");;
              esac
            fi
            printf '%s' "$code"
          }

          echo "=== playlog 启动 $(date '+%F %T') ==="
          echo "PLAYBACK_MODE=$(cat /tmp/PLAYBACK_MODE 2>/dev/null || echo unknown)"
          echo "EMBY_API_KEY 长度=${#EMBY_API_KEY}（0 或异常值说明密钥没传进来）"
          echo "ge2o.log 行数: $(wc -l < "$LOG" 2>/dev/null || echo 0)"
          echo "--- ge2o.log 末尾 8 行（脱敏，用于确认访问日志格式）---"
          tail -n 8 "$LOG" 2>/dev/null | redact

          # Emby 认证矩阵自检：优雅停机用同一密钥的 X-Emby-Token 头是成功的，
          # 这里逐个验证认证方式与端点，定位 playlog 里 401 的真正原因（公开日志只输出 http 码）
          SC_SYS=$(curl -s -m 8 -o /dev/null -w '%{http_code}' -H "X-Emby-Token: $EMBY_API_KEY" "$EMBY/emby/System/Info")
          SC1=$(curl -s -m 8 -o /tmp/pl-sessions.json -w '%{http_code}' -H "X-Emby-Token: $EMBY_API_KEY" "$EMBY/emby/Sessions")
          SC2=$(curl -s -m 8 -o /dev/null -w '%{http_code}' "$EMBY/emby/Sessions?api_key=$EMBY_API_KEY")
          SC3=$(curl -s -m 8 -o /dev/null -w '%{http_code}' -H "X-MediaBrowser-Token: $EMBY_API_KEY" "$EMBY/emby/Sessions")
          SC4=$(curl -s -m 8 -o /dev/null -w '%{http_code}' -H "Authorization: MediaBrowser Token=\"$EMBY_API_KEY\"" "$EMBY/emby/Sessions")
          echo "Emby 认证矩阵: System/Info(头)=$SC_SYS | Sessions 头X-Emby-Token=$SC1 查询api_key=$SC2 头X-MediaBrowser-Token=$SC3 头Authorization=$SC4"
          if [ "$SC1" = "200" ]; then
            AUTH_MODE=header
          elif [ "$SC2" = "200" ]; then
            AUTH_MODE=query
          else
            AUTH_MODE=query
            echo "401 响应体片段: $(head -c 150 /tmp/pl-sessions.json 2>/dev/null)"
          fi

          # Emby 连通性自检（用选出的认证方式；只报数量，不输出用户名/媒体路径）
          SC=$(emby_get /emby/Sessions /tmp/pl-sessions.json)
          SN=$(jq 'if type=="array" then length else ((.Items // []) | length) end' /tmp/pl-sessions.json 2>/dev/null || echo jq失败)
          echo "Emby Sessions 自检: http=$SC 会话数=$SN 认证方式=$AUTH_MODE"
          # 去重（滑动窗口）：同一 item 的持续播放只推一次。
          # 每次命中都刷新"最后请求时间"，间隔超过 300s 才视为新的一次播放；
          # 两个数据源共享 STATE（flock 串行化）
          claim() {
            local iid=$1 now ts
            now=$(date +%s)
            (
              flock 9 2>/dev/null || :
              ts=$(grep -m1 "^$iid " "$STATE" 2>/dev/null | cut -d' ' -f2)
              grep -v "^$iid " "$STATE" > "$STATE.tmp" 2>/dev/null
              echo "$iid $now" >> "$STATE.tmp"
              mv "$STATE.tmp" "$STATE"
              [ -n "$ts" ] && [ $((now - ts)) -lt 300 ] && exit 1
              exit 0
            ) 9>"$LOCK"
          }

          # 片名与元数据反查：Items 接口 → 失败再从 Sessions 里按 Id 反查（emby_get 已含双认证回退）
          # 一次请求把通知需要的信息全取回来（年份/类型/季集/时长/分辨率/编码），不再逐项查。
          # 输出 TSV：name | year | type | series | season | episode | 时长(分) | 高度(px) | 编码
          # 临时文件带 $BASHPID：数据源 A/B 是两个并发子 shell，同名的会互相踩。
          item_meta() { # $1=IID
            local iid=$1 code meta sn pid=$BASHPID
            # ⚠️ 必须先把 $BASHPID 固化到普通变量：jq 在 $( ) 里跑，展开时 $BASHPID
            # 已是子 shell 的 pid，读到的会是另一个（不存在的）临时文件——静默全空
            code=$(emby_get "/emby/Items?Ids=$iid&Fields=Name,ProductionYear,Type,SeriesName,ParentIndexNumber,IndexNumber,RunTimeTicks,MediaStreams" "/tmp/pl-item-$pid.json")
            meta=$(jq -r '.Items[0] // empty
                   | [
                       (.Name // ""),
                       (if .ProductionYear then (.ProductionYear|tostring) else "" end),
                       (.Type // ""),
                       (.SeriesName // ""),
                       (if .ParentIndexNumber then (.ParentIndexNumber|tostring) else "" end),
                       (if .IndexNumber then (.IndexNumber|tostring) else "" end),
                       ((((.RunTimeTicks // 0) / 600000000) | floor) | tostring),
                       (([.MediaStreams[]? | select(.Type=="Video") | (.Height // 0)] | max // 0) | tostring),
                       ([.MediaStreams[]? | select(.Type=="Video") | (.Codec // "")][0] // "")
                     ] | join("\u001f")' "/tmp/pl-item-$pid.json" 2>/dev/null)
            if [ -z "$meta" ]; then
              echo "[WARN] 元数据查询失败 item=$iid http=$code" >&2
              code=$(emby_get /emby/Sessions "/tmp/pl-sessions-name-$pid.json")
              sn=$(jq -r --arg id "$iid" 'if type=="array" then . else (.Items // []) end
                     | .[] | select((.NowPlayingItem.Id // "") == $id) | .NowPlayingItem.Name' \
                     "/tmp/pl-sessions-name-$pid.json" 2>/dev/null | head -1)
              [ -n "$sn" ] || echo "[WARN] Sessions 反查片名失败 item=$iid http=$code" >&2
              meta="${sn:-未知}"$'\037\037\037\037\037\037\037\037'
            fi
            printf '%s\n' "$meta"
          }

          # 客户端信息（Sessions 按 item 反查）：Client | DeviceName
          client_meta() { # $1=IID
            local pid=$BASHPID   # 同 item_meta：jq 在管道子 shell 里，PID 需先固化
            emby_get /emby/Sessions "/tmp/pl-sessions-meta-$pid.json" >/dev/null
            jq -r --arg id "$1" 'if type=="array" then . else (.Items // []) end
                   | .[] | select((.NowPlayingItem.Id // "") == $id)
                   | [(.Client // ""), (.DeviceName // "")] | join("\u001f")' \
                   "/tmp/pl-sessions-meta-$pid.json" 2>/dev/null | head -1
          }

          # HTML 转义：片名里的 & < > 会破坏 parse_mode=HTML 的解析（解析失败 = 整条通知丢失）
          esc_html() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          # 统一收尾区（TG_SEP/tg_add_footer 来自共享发送层；仅取助手，发送仍走本块的 curl）
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"

          # 以下都是格式化助手：任何一项取不到就返回空，由 join_parts 跳过，不产生 "null · · 0" 这类噪声
          two_digit() { case "$1" in ''|*[!0-9]*) return 1;; esac; printf '%02d' "$1"; }
          fmt_dur() { # $1=分钟 → 1h38m / 38m
            local m=${1:-0}
            case "$m" in ''|*[!0-9]*) return 0;; esac
            [ "$m" -lt 1 ] && return 0
            if [ "$m" -ge 60 ]; then printf '%dh%02dm' "$((m / 60))" "$((m % 60))"; else printf '%dm' "$m"; fi
          }
          fmt_res() { # $1=视频高度(px) → 2160p/1080p/720p/480p/SD
            local h=${1:-0}
            case "$h" in ''|*[!0-9]*) return 0;; esac
            [ "$h" -ge 2000 ] && { printf '2160p'; return 0; }
            [ "$h" -ge 1000 ] && { printf '1080p'; return 0; }
            [ "$h" -ge 700 ] && { printf '720p'; return 0; }
            [ "$h" -ge 400 ] && { printf '480p'; return 0; }
            [ "$h" -gt 0 ] && printf 'SD'
          }
          fmt_type() { # $1=Emby Type → 中文
            case "$1" in
              Movie) printf '电影';;
              Episode|Series) printf '剧集';;
              Audio) printf '音乐';;
              Video|MusicVideo) printf '视频';;
              *) [ -n "$1" ] && printf '%s' "$1";;
            esac
          }
          fmt_size() { # $1=字节 → 1.7 GB / 240 MB
            local b=${1:-0}
            case "$b" in ''|*[!0-9]*) return 0;; esac
            [ "$b" -le 0 ] && return 0
            awk -v b="$b" 'BEGIN{ gb=b/1073741824; if (gb>=1) printf "%.1f GB", gb; else printf "%.0f MB", b/1048576 }'
          }
          join_parts() { local out= p; for p in "$@"; do [ -n "$p" ] && out="${out:+${out} · }${p}"; done; printf '%s' "$out"; }

          notify() { # $1=KIND $2=IID [$3=NAME] [$4=起播耗时] [$5=客户端IP]
            local kind=$1 iid=$2 name=$3 dur=$4 cip=$5
            local code link text plain n year type series season episode mins hgt codec
            local cname dev size_b remain_s se title meta client l3 lt
            claim "$iid" || return 0
            # 分隔符用 \037（单元分隔符）而非 tab：tab 是 IFS 空白字符，read 会折叠连续的
            # 分隔符，中间的空字段（如电影没有 series/季集）会被吃掉、后面的字段整体前移
            IFS=$'\037' read -r n year type series season episode mins hgt codec <<<"$(item_meta "$iid")"
            [ -n "$name" ] && n="$name"   # 数据源 B 自带片名，优先用它（少一次不可靠依赖）

            # 直链信息：url | size(bytes) | 剩余有效秒数
            # 2400 = odlink.py 的 LINK_TTL（40 分钟）；改直链缓存时长时这里要同步
            if [ "$kind" = "302直链" ] && [ -f /opt/odlink-last.json ]; then
              lt=$(jq -r 'select((now - .ts) < 180)
                     | [(.url // ""), ((.size // 0)|tostring), ((2400 - (now - .ts)) | floor | tostring)]
                     | @tsv' /opt/odlink-last.json 2>/dev/null || true)
              IFS=$'\t' read -r link size_b remain_s <<<"$lt"
            fi

            # 第 1 行：标题。剧集优先显示"剧名 SxxExx"，集名下移到元数据行，避免一行塞不下
            se=""
            if [ -n "$season" ]; then se="S$(two_digit "$season" || printf '?')"; fi
            if [ -n "$episode" ]; then se="${se}E$(two_digit "$episode" || printf '?')"; fi
            if [ "$type" = "Episode" ] && [ -n "$series" ]; then
              title="<b>$(esc_html "$series")</b>"
              [ -n "$se" ] && title="${title} <i>${se}</i>"
            else
              title="<b>$(esc_html "${n:-未知}")</b>"
              [ -n "$year" ] && title="${title} <i>(${year})</i>"
            fi

            # 第 2 行：元数据（集名 / 类型 / 时长 / 分辨率 / 编码 / 体积）
            # 季集号已出现在标题行，这里不再重复
            meta=$(join_parts \
              "$( [ "$type" = "Episode" ] && [ -n "$n" ] && esc_html "$n" )" \
              "$(fmt_type "$type")" \
              "$(fmt_dur "$mins")" \
              "$(fmt_res "$hgt")" \
              "$codec" \
              "$(fmt_size "$size_b")")

            # 第 3 行：链路。302 时把直链剩余有效期说清楚——链接不是永久的
            if [ "$kind" = "302直链" ]; then
              l3="⚡ 302直链 · 播放器直连 OneDrive"
              case "$remain_s" in
                ''|*[!0-9]*) ;;
                *) [ "$remain_s" -gt 0 ] && l3="${l3} · 直链剩余 $(( (remain_s + 59) / 60 )) 分钟";;
              esac
            else
              l3="🔁 中转 · 视频流经 runner 中转到网盘"
            fi

            # 第 4 行：客户端。IP 来自 ge2o 访问日志（谁在播），起播耗时用于"点播慢"定位
            IFS=$'\037' read -r cname dev <<<"$(client_meta "$iid")"
            client=$(join_parts "$(esc_html "$cname")" "$(esc_html "$dev")" "$cip" "${dur:+起播 ${dur}}")

            # 日志侧只记片名（公开仓库，绝不落直链）；TG 私密消息里才附带直链
            echo "🎬 播放 [$kind] ${n:-未知} (item $iid)"
            text="🎬 ${title}"$'\n'"${TG_SEP}"
            [ -n "$meta" ] && text="${text}"$'\n'"${meta}"
            text="${text}"$'\n'"${l3}"
            [ -n "$client" ] && text="${text}"$'\n'"📱 ${client}"
            # 长链接折叠成 <a> 超链接，避免整条通知被几百字符的 URL 淹没
            [ -n "$link" ] && text="${text}"$'\n'"<a href=\"$(esc_html "$link")\">▶ 打开直链</a>"
            # 统一收尾区（自带与正文间的空行；TG_RUN_* 缺席时自动降级跳过）
            pl_footer=""
            tg_add_footer pl_footer
            text="${text}${pl_footer}"
            code=$(curl -s -m 10 -o /tmp/pl-tg.json -w '%{http_code}' \
                     -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                     --data-urlencode "chat_id=$TG_CHAT_ID" \
                     --data-urlencode "parse_mode=HTML" \
                     --data-urlencode "text=${text}")
            # HTML 解析失败（转义漏网字符）时不重试解析，直接退化为纯文本原样重发：
            # 宁可链接变长，也不能让播放通知消失
            if [ "$code" != "200" ]; then
              # 退化版用同一份信息，只是去掉 HTML 标签（超链接变成裸 URL）
              plain="🎬 播放 [$kind] ${n:-未知}"
              [ -n "$meta" ] && plain="${plain}"$'\n'"${meta}"
              plain="${plain}"$'\n'"${l3}"
              [ -n "$client" ] && plain="${plain}"$'\n'"📱 ${client}"
              [ -n "$link" ] && plain="${plain}"$'\n'"直链: $link"
              [ -n "$pl_footer" ] && plain="${plain}$(_tg_strip_html "$pl_footer")"
              code=$(curl -s -m 10 -o /tmp/pl-tg.json -w '%{http_code}' \
                       -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                       --data-urlencode "chat_id=$TG_CHAT_ID" \
                       --data-urlencode "text=${plain}")
            fi
            [ "$code" = "200" ] || echo "[WARNING] TG 推送失败 http=$code resp=$(head -c 200 /tmp/pl-tg.json 2>/dev/null)"
          }

          # 数据源 A：ge2o 访问日志（302 模式主源）
          #   真实格式（v2.8.2）：
          #   [ge2o:v2.8.2] 2026-09-01 08:49:01 | 206 | 4.16s | 141.11.43.124 | 8095 <路由> | GET /emby/videos/554849/stream?...
          #   3xx = 直链重定向；200/206 = 经 ge2o/Emby 中转；304 = 客户端缓存校验，不计为播放
          (
            tail -n0 -F "$LOG" 2>/dev/null | while read -r line; do
              case "$line" in
                *'/videos/'*) ;;
                *) continue;;
              esac
              # 只认访问日志行（带 " | 方法 /path"），[ERROR] 等业务日志一律跳过
              case "$line" in
                *' | GET '*|*' | POST '*|*' | HEAD '*) ;;
                *)
                  if [ "$DIAG" -lt 12 ]; then
                    DIAG=$((DIAG+1))
                    echo "[SKIP] 非访问日志行: $(printf '%s' "$line" | redact | head -c 160)"
                  fi
                  continue;;
              esac
              case "$line" in
                *stream*|*original*|*master.m3u8*|*universal*) ;;
                *)
                  if [ "$DIAG" -lt 12 ]; then
                    DIAG=$((DIAG+1))
                    echo "[SKIP] 非播放请求: $(printf '%s' "$line" | redact | head -c 160)"
                  fi
                  continue;;
              esac
              ST=$(printf '%s\n' "$line" | grep -oE '\| [0-9]{3} \|' | head -1 | tr -d '| ')
              case "$ST" in
                302|307) KIND=302直链;;
                200|206) KIND=中转;;
                *)
                  if [ "$DIAG" -lt 12 ] && [ "$ST" != "304" ]; then
                    DIAG=$((DIAG+1))
                    echo "[SKIP] 状态码 $ST 不计为播放: $(printf '%s' "$line" | redact | head -c 160)"
                  fi
                  continue;;
              esac
              IID=$(printf '%s\n' "$line" | sed -E 's|.*emby/[Vv]ideos/([0-9]+).*|\1|')
              case "$IID" in
                ''|*[!0-9]*) continue;;
              esac
              # 首个中转事件时归档 ge2o 播放时刻上下文（脱敏），用于定位"为何没走 302 直链"
              if [ "$KIND" = "中转" ] && [ "$CTX" -lt 1 ]; then
                CTX=1
                echo "--- 中转事件上下文: ge2o.log 末尾 30 行（脱敏）---"
                tail -n 30 "$LOG" 2>/dev/null | redact
              fi
              # 访问日志里还有"耗时"与"客户端 IP"两列（起播慢 / 谁在播的定位依据），一并带进通知：
              #   [ge2o:v2.8.2] <时间> | 206 | 4.16s | 141.11.43.124 | 8095 <路由> | GET /emby/videos/...
              DUR=$(printf '%s\n' "$line" | grep -oE '\| [0-9]+\.[0-9]+s \|' | head -1 | tr -d '| ')
              CIP=$(printf '%s\n' "$line" | grep -oE '\| [0-9]{1,3}(\.[0-9]{1,3}){3} \|' | head -1 | tr -d '| ')
              notify "$KIND" "$IID" "" "$DUR" "$CIP"
            done
          ) &

          # 数据源 B：Emby Sessions 轮询（ge2o 覆盖不到的播放：direct 模式 / 日志格式变化）
          (
            while true; do
              sleep 10
              MODE=$(cat /tmp/PLAYBACK_MODE 2>/dev/null || echo 302)
              SC=$(emby_get /emby/Sessions /tmp/pl-sessions.json)
              if [ "$SC" != "200" ]; then
                SFAIL=$((SFAIL+1))
                [ $((SFAIL % 10)) -eq 1 ] && echo "[WARN] Sessions 查询失败 http=$SC（第 $SFAIL 次）"
                continue
              fi
              jq -c 'if type=="array" then . else (.Items // []) end
                     | .[]
                     | select(.NowPlayingItem != null)
                     | {id: (.NowPlayingItem.Id // ""), name: (.NowPlayingItem.Name // ""), method: (.PlayState.PlayMethod // "")}' \
                /tmp/pl-sessions.json 2>/dev/null | while read -r s; do
                  IID=$(printf '%s' "$s" | jq -r '.id' 2>/dev/null)
                  NAME=$(printf '%s' "$s" | jq -r '.name' 2>/dev/null)
                  METHOD=$(printf '%s' "$s" | jq -r '.method' 2>/dev/null)
                  case "$IID" in
                    ''|*[!0-9]*) continue;;
                  esac
                  case "$METHOD" in
                    Transcode) KIND=中转;;
                    *) if [ "$MODE" = "direct" ]; then KIND=中转; else KIND=302直链; fi;;
                  esac
                  notify "$KIND" "$IID" "$NAME"
                done
            done
          ) &

          wait
          PL_EOF
          TELEGRAM_BOT_TOKEN="$TG_BOT_TOKEN" TG_CHAT_ID="$TG_CHAT_ID" \
            EMBY_API_KEY="$EMBY_API_KEY" \
            nohup bash /opt/playlog.sh >> /opt/logs/playlog.log 2>&1 &
      - name: warmup images
        run: |
          # 三段预热，把"点开就播"的冷启动成本提前付掉：
          #   海报墙 —— Emby 现场缩放 + ge2o 内存缓存就绪
          #   直链   —— odlink 路径逐段解析与直链签发提前完成（零流量成本）
          #   头尾   —— ffprobe 读的正是文件头部与尾部，提前读进 VFS 稀疏缓存
          # 每段都带计时：预热同时就是测量工具，冷解析与冷读的耗时直接可量化。
          cat > /opt/warmup.sh <<'WU_EOF'
          #!/bin/bash
          KEY="$EMBY_API_KEY"
          EMBY=http://127.0.0.1:8096
          GE2O=http://127.0.0.1:8095
          # UID 是 bash 只读内建变量，赋值会直接报 "readonly variable" 并失败，
          # 于是用户 ID 一直是 runner 的数字 uid，Latest 查询拿不到数据、预热静默空转。
          # 改名以绝后患——这个坑让海报预热一直没真正跑过。
          # 用户名来自 EMBY_USER secret：仓库公开，绝不写死；日志里也只打 ID 不打名字。
          # 用 jq --arg 传参而不是拼字符串，顺带避免名字里带引号把 JSON 过滤器搞坏。
          USER_NAME="${EMBY_USER:-}"
          [ -n "$USER_NAME" ] || { echo "warmup: EMBY_USER 未配置，跳过"; exit 0; }
          USER_ID=$(curl -s "$EMBY/emby/Users?api_key=$KEY" \
                    | jq -r --arg n "$USER_NAME" '.[] | select(.Name==$n) | .Id' | head -1)
          [ -n "$USER_ID" ] || { echo "warmup: 未找到目标用户（按 EMBY_USER 匹配），跳过"; exit 0; }

          # 预热规模：可用 workflow env 覆盖，无需改脚本
          WU_ITEMS=${WU_ITEMS:-10}             # 参与直链/头尾预热的条目数
          WU_EDGE_MB=${WU_EDGE_MB:-64}         # 头尾单边预热大小（每条目 ×2）
          WU_BUDGET_MB=${WU_BUDGET_MB:-2048}   # 头尾预热总预算(MB)，达上限即停

          curl -s "$EMBY/emby/Users/$USER_ID/Items/Latest?Limit=40&Fields=ImageTags,Path,MediaSources&api_key=$KEY" > /tmp/wu-items.json

          # ---------- 1. 海报墙预热 ----------
          # 宽度档位读跨 run 统计 Top5（随备份跨 run 传递；兼容旧版无得分的 sizes 格式）。
          # ⚠️ 不回退固定 400/600——没有客户端消费过的尺寸预热了也是白占空间，
          # 无档位时本段与 1b 自然零请求（wallwarmer 本轮会把统计写回状态文件）。
          # 请求只带 maxWidth：缓存键含参数组合，box-fit 下补 maxHeight 得到的是
          # 更小的图，与客户端实际要的对不上（同 wallwarmer 口径）。
          WU_SIZES=$(jq -r 'if has("scores") then .scores[]?[0] else .sizes[]? end' \
                     /var/lib/emby/warm-state.json 2>/dev/null | tr '\n' ' ')
          echo "海报墙/首屏预热宽度档: ${WU_SIZES:-无（跳过，等 wallwarmer 记录客户端档位）}"
          N=0
          for ID in $(jq -r '.[].Id' /tmp/wu-items.json | head -40); do
            jq -r --arg id "$ID" '.[] | select(.Id==$id) | .ImageTags.Primary // empty' /tmp/wu-items.json > /tmp/wu-tag.txt 2>/dev/null
            read -r TAG < /tmp/wu-tag.txt 2>/dev/null || TAG=
            [ -n "$TAG" ] || continue
            for W in $WU_SIZES; do
              curl -s -o /dev/null "$GE2O/emby/Items/$ID/Images/Primary?maxWidth=$W&tag=$TAG"
              N=$((N + 1))
            done
          done
          echo "海报墙预热完成: ${N} 次请求 $(date '+%T')"

          # ---------- 1b. 各媒体库首屏海报预热 ----------
          # 上面的 Latest 只是"首页-最近添加"那 40 条；滑进某个媒体库的第一屏是另一批
          # 条目，每张首图都要 经挂载冷读原图 → 现场缩放 → 写缓存（85k 条目不可能全量
          # 预热）。这里对每个媒体库按默认排序（SortName）取前 WU_LIB_ITEMS 张预热，
          # 让"点开任意媒体库的第一屏"也命中缓存。串行请求，避免并发冷读触发限流。
          WU_LIB_ITEMS=${WU_LIB_ITEMS:-20}
          LIB_N=0
          # 宽度档位沿用上面的 $WU_SIZES（已含"无档位则零请求"语义）
          VIEWS=$(curl -s "$EMBY/emby/Users/$USER_ID/Views?api_key=$KEY" \
                  | jq -r '.Items[]?.Id' 2>/dev/null || true)
          for VIEW in $VIEWS; do
            T0=$(date +%s%N)
            LIB_OK=0
            # ImageTags 的值是十六进制串（无空格），"Id TAG" 空格分行即可安全 split
            ROWS=$(curl -s "$EMBY/emby/Users/$USER_ID/Items?ParentId=$VIEW&Recursive=true&SortBy=SortName&SortOrder=Ascending&Limit=$WU_LIB_ITEMS&Fields=ImageTags&api_key=$KEY" \
                   | jq -r '.Items[]? | "\(.Id) \(.ImageTags.Primary // "-")"' 2>/dev/null || true)
            for ROW in $ROWS; do
              ID=${ROW%% *}; TAG=${ROW#* }
              { [ -n "$TAG" ] && [ "$TAG" != "-" ]; } || continue
              for W in $WU_SIZES; do
                curl -s -o /dev/null "$GE2O/emby/Items/$ID/Images/Primary?maxWidth=$W&tag=$TAG" || true
                LIB_OK=$((LIB_OK + 1))
              done
            done
            MS=$(( ( $(date +%s%N) - T0 ) / 1000000 ))
            LIB_N=$((LIB_N + LIB_OK))
            echo "媒体库首屏预热 view=$VIEW ${LIB_OK}张 ${MS}ms"
          done
          echo "媒体库首屏预热完成: 共 ${LIB_N} 张 $(date '+%T')"

          # ---------- 2. 直链预热 ----------
          # odlink 的 dir_cache(无 TTL) 与 link_cache(40min) 都在进程内存里，每轮 run 都是冷启动。
          # 提前打一次 /api/fs/get，起播时 ge2o 打过来直接命中：路径解析结果本轮内一直有效，
          # 40 分钟后只需重新签发直链（1 次 Graph 调用，而非逐段下钻 N 次）。
          source "$EMBY302_DIR/lib.sh"     # link_host / link_token 是直链源的唯一真相
          LK_HOST=$(link_host)
          LK_TOKEN=$(link_token)
          LK_N=0; LK_MS=0
          for ID in $(jq -r '.[].Id' /tmp/wu-items.json | head -"$WU_ITEMS"); do
            P=$(jq -r --arg id "$ID" '.[] | select(.Id==$id) | (.MediaSources[0].Path // .Path // empty)' /tmp/wu-items.json)
            [ -n "$P" ] || continue
            T0=$(date +%s%N)
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$LK_HOST/api/fs/get" \
                  -H 'Content-Type: application/json' -H "Authorization: $LK_TOKEN" \
                  -d "$(jq -nc --arg p "$P" '{path:$p}')" --max-time 30)
            MS=$(( ( $(date +%s%N) - T0 ) / 1000000 ))
            echo "直链预热 $(basename "$P") http=$CODE ${MS}ms"
            LK_N=$((LK_N + 1)); LK_MS=$((LK_MS + MS))
          done
          if [ "$LK_N" -gt 0 ]; then
            echo "直链预热完成: ${LK_N} 条 / 合计 ${LK_MS}ms / 均值 $((LK_MS / LK_N))ms $(date '+%T')"
          else
            echo "直链预热: 无可用路径（Latest 未返回 Path/MediaSources）$(date '+%T')"
          fi

          # ---------- 3. 头尾预热 ----------
          # Emby 起播会 ffprobe 文件，读的正是头部与尾部（moov / MKV SeekHead）。
          # full 模式是稀疏缓存、只下载真正读过的区间，所以精准预热这两段即可让探测命中本地。
          # 代价是真实 OneDrive 流量，故用 WU_BUDGET_MB 兜底；
          # 这里测出的耗时同时就是"挂载冷读速度"的实测值，可反推 ffprobe 会花多久。
          EDGE_N=0; EDGE_MS=0; USED_MB=0
          for ID in $(jq -r '.[].Id' /tmp/wu-items.json | head -"$WU_ITEMS"); do
            [ "$USED_MB" -lt "$WU_BUDGET_MB" ] || { echo "头尾预热达预算 ${WU_BUDGET_MB}MB，停止 $(date '+%T')"; break; }
            P=$(jq -r --arg id "$ID" '.[] | select(.Id==$id) | (.MediaSources[0].Path // .Path // empty)' /tmp/wu-items.json)
            [ -n "$P" ] || continue
            [ -f "$P" ] || { echo "头尾预热: 挂载上找不到 $(basename "$P")，跳过"; continue; }
            T0=$(date +%s%N)
            head -c "${WU_EDGE_MB}M" "$P" >/dev/null 2>&1
            tail -c "${WU_EDGE_MB}M" "$P" >/dev/null 2>&1
            MS=$(( ( $(date +%s%N) - T0 ) / 1000000 ))
            echo "头尾预热 $(basename "$P") ${WU_EDGE_MB}MB×2 ${MS}ms"
            EDGE_N=$((EDGE_N + 1)); EDGE_MS=$((EDGE_MS + MS)); USED_MB=$((USED_MB + WU_EDGE_MB * 2))
          done
          if [ "$EDGE_N" -gt 0 ]; then
            echo "头尾预热完成: ${EDGE_N} 条 / ${USED_MB}MB / 合计 ${EDGE_MS}ms / 均值 $((EDGE_MS / EDGE_N))ms $(date '+%T')"
          fi
          WU_EOF
          EMBY_API_KEY="${{ secrets.EMBY_API_TOKEN }}" nohup bash /opt/warmup.sh > /opt/logs/warmup.log 2>&1 &

      - name: start wall warmer
        run: |
          cat > /opt/wallwarmer.sh <<'WW_EOF'
          #!/bin/bash
          # 全库海报后台预热：把所有媒体条目的 Primary 海报尽量拉进 Emby 缓存
          # （cache 软链 → /mnt/emby-cache），与 warmup.sh 的"首屏预热"互补——
          # 首屏管"点开就热"，这里管"滑到哪都热"。首轮覆盖不全没关系：
          # 缓存随备份持久化，按 DateCreated 倒序逐轮往深处推进。
          # 保护措施：
          #   - 直连 Emby(:8096)，不过 ge2o——避免把 ge2o 有限的内存缓存挤掉热条目
          #   - 并发 WW_WORKERS + 间隔：挂载压力控制在低位（302 播放不走挂载，不受影响）
          #   - /mnt 剩余低于阈值即停（缓存与 VFS 共享 /mnt，不与 VFS 的让位机制打架）
          #   - Emby 连续不可达即退出（优雅停机/收尾阶段不再空转）
          # 动态档位（跨 run 统计）：缓存键包含请求参数，客户端（Web/Infuse/爆米花）各要
          # 各的宽度。状态文件存 [宽度,得分]（得分=按半衰期衰减的历史请求量），每轮启动
          # 先对历史得分衰减一次，再与本轮 ge2o 实测计数合并；持续被消费的档位留存，
          # 无人用的按半衰期退出（得分<1 淘汰），永远只留 Top-N——文件恒定百字节级。
          KEY="$EMBY_API_KEY"
          EMBY=http://127.0.0.1:8096
          GE2O_LOG=/opt/logs/ge2o.log
          USER_NAME="${EMBY_USER:-}"
          [ -n "$USER_NAME" ] || { echo "wallwarmer: EMBY_USER 未配置，退出"; exit 0; }
          USER_ID=$(curl -s "$EMBY/emby/Users?api_key=$KEY" \
                    | jq -r --arg n "$USER_NAME" '.[] | select(.Name==$n) | .Id' | head -1)
          [ -n "$USER_ID" ] || { echo "wallwarmer: 未找到目标用户（按 EMBY_USER 匹配），退出"; exit 0; }

          WW_PAGE=500                                   # 每页条目数
          WW_WORKERS=${WW_WORKERS:-2}                   # 并发数
          WW_GAP=${WW_GAP:-0.2}                         # 每批间隔（秒）
          WW_MAX_MIN=${WW_MAX_MIN:-300}                 # 最长预热时长（分钟）
          WW_SIZES_MAX=${WW_SIZES_MAX:-5}               # 宽度档数上限：客户端用了几档就预热几档，超过则取得分最高的 Top-N
          WW_DECAY=${WW_DECAY:-0.5}                     # 跨 run 衰减系数：每轮历史得分×0.5，无人消费的档位按半衰期退出
          STATE=/var/lib/emby/warm-state.json           # 统计文件（随备份跨 run 传递），只存 Top-N 条 [宽度,得分]
          WW_MIN_FREE_KB=${WW_MIN_FREE_KB:-10485760}    # /mnt 剩余低于 10GB 停止
          DEADLINE=$(( $(date +%s) + WW_MAX_MIN * 60 ))
          DONE=0 PAGE=0 EMBY_DOWN=0

          free_mnt_kb() { df -k /mnt 2>/dev/null | awk 'NR==2 {print $4}'; }

          # ---- 跨 run 统计：读历史得分并按半衰期衰减（每轮一次）----
          # 旧格式（无 scores 的 sizes 数组）自动迁移：每档记 10 分起步
          BASE=$(jq -r '.scores[]? | "\(.[0]) \(.[1])"' "$STATE" 2>/dev/null || true)
          if [ -z "$BASE" ] && jq -e 'has("sizes")' "$STATE" >/dev/null 2>&1; then
            BASE=$(jq -r '.sizes[]? | "\(.) 10"' "$STATE" 2>/dev/null || true)
          fi
          BASE=$(printf '%s' "$BASE" | awk -v d="$WW_DECAY" 'NF>=2 {s=$2*d; if(s>=1) printf "%s %.1f\n", $1, s}')
          export BASE   # merged_sizes 的 awk 经 ENVIRON["BASE"] 读取（变量须导出）

          # 合并得分 = 历史衰减分 + 本轮 ge2o 实测计数（排除 127.0.0.1：warmup.sh 的
          # 首屏预热也走 ge2o，会把 400/600 的计数灌进来污染统计）。输出"得分 宽度"按分降序。
          merged_sizes() {
            grep -E '\| (GET|POST|HEAD) ' "$GE2O_LOG" 2>/dev/null | grep -v '127\.0\.0\.1' \
              | grep -oE 'Images/Primary\?[^ ]*maxWidth=[0-9]+' \
              | grep -oE 'maxWidth=[0-9]+' | sed 's/maxWidth=//' \
              | sort | uniq -c \
              | awk '
                  # ⚠️ 历史得分经 ENVIRON["BASE"] 传入而非 -v：BASE 是多行文本，
                  # awk -v 遇换行直接报 "newline in string"
                  { live[$2]=$1 }
                  END { n=split(ENVIRON["BASE"],b,"\n");
                        for(i=1;i<=n;i++){ split(b[i],p," "); if(p[1]!=""){ if(!(p[1] in live)) live[p[1]]=0; live[p[1]]+=p[2]+0 } }
                        for(w in live) printf "%.1f %s\n", live[w], w }' \
              | sort -rn
          }

          # 统计写回：只留 Top-N（文件恒定百字节级）。/var/lib/emby 属主是 emby，
          # runner 写不进，走 sudo tee；失败不影响预热。用 here-string 而非管道喂
          # while——管道会让 while 进子 shell，first 标记失效、JSON 逗号丢失。
          persist_state() { # $1="得分 宽度"多行
            local entries="" first=1 w s
            while read -r s w; do
              [ -n "$w" ] || continue
              [ "$first" -eq 1 ] || entries="${entries},"
              entries="${entries}[$w,$s]"
              first=0
            done <<< "$(printf '%s' "$1" | sort -rn | head -"$WW_SIZES_MAX")"
            { printf '{"updated":%s,"scores":[%s]}' "$(date +%s)" "$entries"
            } | sudo tee "$STATE" >/dev/null 2>&1 || true
          }
          persist_state "$BASE"   # 启动即落盘衰减结果：哪怕本轮中途被杀，衰减也已生效

          echo "=== wallwarmer 启动 $(date '+%F %T')（并发=$WW_WORKERS 最长=${WW_MAX_MIN}min）==="
          # 让 warmup.sh 的首屏预热先跑完（约 2-4 分钟），避免同时抢 OneDrive
          sleep "${WW_START_DELAY:-180}"
          while :; do
            [ "$(date +%s)" -lt "$DEADLINE" ] || { echo "达到时长上限 ${WW_MAX_MIN}min，停止"; break; }
            IDX=$((PAGE * WW_PAGE))
            if ! curl -s -m 10 "http://127.0.0.1:8096/emby/System/Info/Public" >/dev/null 2>&1; then
              EMBY_DOWN=$((EMBY_DOWN + 1))
              [ "$EMBY_DOWN" -ge 3 ] && { echo "Emby 连续 3 次不可达，退出（收尾阶段）"; break; }
              sleep 30; continue
            fi
            EMBY_DOWN=0
            JSON=$(curl -s -m 30 "$EMBY/emby/Users/$USER_ID/Items?Recursive=true&SortBy=DateCreated&SortOrder=Descending&Limit=$WW_PAGE&StartIndex=$IDX&Fields=ImageTags&api_key=$KEY")
            TOTAL=$(printf '%s' "$JSON" | jq -r '.TotalRecordCount // 0' 2>/dev/null)
            # ⚠️ 分隔符用逗号而非空格：$ROWS 未加引号的 for 展开会按所有空白拆词，
            # "Id TAG" 会被拆成两个独立"行"，Id 和 tag 错位组合（测试实测踩过）
            ROWS=$(printf '%s' "$JSON" | jq -r '.Items[]? | "\(.Id),\(.ImageTags.Primary // "-")"' 2>/dev/null)
            [ -n "$ROWS" ] || { echo "第 $((PAGE + 1)) 页无更多条目，遍历完成"; break; }
            # 每页重算合并得分（历史衰减分 + 本轮 ge2o 实测累计），档位随客户端行为漂移自动跟随
            MERGED=$(merged_sizes)
            TOP=$(printf '%s' "$MERGED" | head -"$WW_SIZES_MAX" | awk '{printf "%s ", $2}')
            if [ -z "$TOP" ]; then
              # ⚠️ 不回退 400：没有客户端消费过的尺寸预热了也是白占空间——
              # 等到有人浏览、日志里出现真实宽度再开跑
              echo "尚无客户端图片请求数据，60s 后重试 $(date '+%T')"
              sleep 60
              continue
            fi
            PAGE=$((PAGE + 1))
            # 统计写回：衰减分+本轮实测，只留 Top-N（≤5 条恒小）；ge2o 日志每轮
            # 清零，跨 run 统计全靠它
            persist_state "$MERGED"
            echo "第 $PAGE 页 宽度档: $TOP（每条目预热 $(( $(printf '%s' "$TOP" | wc -w) )) 个尺寸）"
            for ROW in $ROWS; do
              ID=${ROW%%,*}; TAG=${ROW#*,}
              { [ -n "$TAG" ] && [ "$TAG" != "-" ]; } || continue
              # ⚠️ 请求只带 maxWidth 不带 maxHeight：缓存键包含参数组合，Emby Web 的
              # 海报请求通常只带 maxWidth；box-fit 语义下补 maxHeight 会得到更小的图，
              # 与客户端实际要的缓存对不上（白预热）
              for W in $TOP; do
                curl -s -m 30 -o /dev/null "$EMBY/emby/Items/$ID/Images/Primary?maxWidth=$W&tag=$TAG" &
                DONE=$((DONE + 1))
                # 并发闸：每 WW_WORKERS 张等一波
                if [ $((DONE % WW_WORKERS)) -eq 0 ]; then wait; sleep "$WW_GAP"; fi
                # 每 200 次请求报一次进度，每 500 次查一次 /mnt 余量
                if [ $((DONE % 200)) -eq 0 ]; then
                  echo "已预热 $DONE 请求 / 第 $PAGE 页 / 档位 $TOP / /mnt 剩余 $(free_mnt_kb)KB $(date '+%T')"
                fi
                if [ $((DONE % 500)) -eq 0 ]; then
                  if [ "$(free_mnt_kb)" -lt "$WW_MIN_FREE_KB" ]; then
                    echo "/mnt 剩余不足 ${WW_MIN_FREE_KB}KB，停止（已预热 $DONE 请求）"; break 3
                  fi
                fi
              done
            done
            wait
            case "$TOTAL" in ''|*[!0-9]*) ;; *) [ "$IDX" -ge "$TOTAL" ] && { echo "已覆盖全部 $TOTAL 条，遍历完成"; break; };; esac
          done
          echo "=== wallwarmer 结束: 共 $DONE 次图片请求 / $PAGE 页 $(date '+%F %T') ==="
          WW_EOF
          EMBY_API_KEY="${{ secrets.EMBY_API_TOKEN }}" EMBY_USER="${{ secrets.EMBY_USER }}" \
            nohup bash /opt/wallwarmer.sh > /opt/logs/wallwarm.log 2>&1 &

      - name: sleep
        run: |
          sleep 340m
      - name: backup emby data
        if: always()
        run: |
          set -euo pipefail
          # 与 install emby 共用同一份公共函数，保证恢复侧与备份侧的校验口径一致
          source "$EMBY302_DIR/lib.sh"

          # 同步 OpenList 数据目录：仅当实例真正配置了存储（fs/list 实测通过）才回传，防止空数据覆盖远端
          if [ -x /usr/local/bin/openlist ] && curl -s http://127.0.0.1:5244/ping >/dev/null 2>&1; then
            OTOKEN=$(cat /tmp/openlist-token 2>/dev/null || true)
            if [ -n "$OTOKEN" ] && curl -s -X POST http://127.0.0.1:5244/api/fs/list \
                 -H "Authorization: $OTOKEN" -H 'Content-Type: application/json' \
                 -d '{"path":"/onedrive","page":1,"per_page":1}' | jq -e '.code == 200' >/dev/null 2>&1; then
              rm -rf /tmp/ol-persist && mkdir -p /tmp/ol-persist
              cp /opt/openlist/config.json /tmp/ol-persist/ 2>/dev/null || true
              cp /opt/openlist/data.db /tmp/ol-persist/ 2>/dev/null || true
              rclone sync /tmp/ol-persist dropbox:self-hosted/openlist-emby/data/ -vv 2>/dev/null \
                && echo "OpenList 数据已同步到 openlist-emby（config.json+data.db，无日志）" \
                || echo "[WARNING] OpenList data persist failed"
              rm -rf /tmp/ol-persist
            else
              echo "[WARNING] OpenList has no working storage; skip persist to protect remote data"
            fi
          fi

          if [ ! -f /tmp/EMBY_READY_FOR_BACKUP ]; then
              echo "⚠️ Emby 未能成功启动，跳过备份以防空数据覆盖云端。"
              exit 0
          fi

          # 优雅停机
          SHUTDOWN_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "X-Emby-Token: ${{ secrets.EMBY_API_TOKEN }}" http://127.0.0.1:8096/System/Shutdown || echo 000)
          echo "优雅停机: http=$SHUTDOWN_CODE（401 说明该密钥已失效，Emby 只能被 runner 强杀）"
          sleep 15

          # 只有在本地模式下才打包回传（避免覆盖云端的软链接源文件）
          if [ ! -L /var/lib/emby ]; then
              validate_emby_data /var/lib/emby
              echo "🚀 本地模式运行结束，正在打包数据回传 Dropbox..."
              src_kb=$(sudo du -skL /var/lib/emby | awk '{print $1}')
              if [ -z "${src_kb:-}" ] || [ "$src_kb" -le 0 ]; then
                echo "❌ emby archive preflight: unable to calculate source size" >&2
                exit 1
              fi
              echo "待压缩目录大小: ${src_kb}KB"
              # 打包是流式的（tar 管道直进 rcat，不落 staging），根分区只需容下
              # zstd 工作内存与 rclone 缓冲，1GB 足够；写死 4GB 只会在根分区紧张时误杀。
              require_free_kb /var/lib/emby $((1024 * 1024)) "emby archive preflight (root, 流式不落盘)"
              # 流式：tar 直接管道进 rcat 上传 OneDrive（含图片缓存），30GB 级 tarball 不落本地盘
              sudo tar -I 'zstd -3 -T0' -chf - \
                --exclude='logs' \
                --exclude='transcoding-temp' \
                -C /var/lib/emby . \
                | rclone rcat onedrive:backup/emby/emby-backup.tar.zst -v
              echo "📤 备份已流式上传 OneDrive:emby-backup/"
              cleanup_archive_workdir
          else
              echo "😴 当前为软链接模式，跳过本地打包备份。"
          fi

      - name: send telegram notification
        if: always()
        env:
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          source "$EMBY302_DIR/lib.sh"
          STATUS="${{ job.status }}"
          MODE=$(cat /tmp/PLAYBACK_MODE 2>/dev/null || echo unknown)
          case "$STATUS" in
            success) STATUS_EMOJI="✅";;
            failure) STATUS_EMOJI="❌";;
            cancelled) STATUS_EMOJI="⏹";;
            *) STATUS_EMOJI="❓";;
          esac
          # 运行时长不再在本 step 自算（旧 '%dh %dm' 写法与全库收尾区不一致）：
          # 统一交给 tg_add_footer 读 step env 的 TG_RUN_STARTED_AT
          # 302 链路统计：直链命中/未取到/解析失败/回落 OpenList 次数（odlink /stats）
          OD_SUMMARY="odlink 未运行"
          if curl -fsS -m 5 http://127.0.0.1:5245/ping >/dev/null 2>&1; then
            S=$(curl -s -m 5 http://127.0.0.1:5245/stats 2>/dev/null || true)
            G_GET=$(printf '%s' "$S" | jq -r '.fs.get // 0' 2>/dev/null || echo 0)
            G_OK=$(printf '%s' "$S" | jq -r '.fs.link_ok // 0' 2>/dev/null || echo 0)
            G_MISS=$(printf '%s' "$S" | jq -r '.fs.link_miss // 0' 2>/dev/null || echo 0)
            G_ERR=$(printf '%s' "$S" | jq -r '.fs.resolve_err // 0' 2>/dev/null || echo 0)
            G_FB=$(printf '%s' "$S" | jq -r '.fs.fallback // 0' 2>/dev/null || echo 0)
            G_XD=$(printf '%s' "$S" | jq -r '.fs.cross_drive // 0' 2>/dev/null || echo 0)
            OD_SUMMARY="直链命中 ${G_OK} / 未取到 ${G_MISS} / 解析失败 ${G_ERR} / 回落 ${G_FB} / 跨盘 ${G_XD} (get共 ${G_GET})"
          fi
          # 全库海报预热统计：取 wallwarm.log 最后的进度数字与档位。
          # 优先解析"结束"行（正常收尾时最准确）；cancelled 中途被杀时该行不存在，
          # 退回每 200 请求的进度行；不足 200 请求（基本没跑起来）就显示未运行。
          WW_SUMMARY="未运行"
          if [ -f /opt/logs/wallwarm.log ]; then
            WW_N=$(grep -oE '共 [0-9]+ 次图片请求' /opt/logs/wallwarm.log 2>/dev/null | tail -1 | grep -oE '[0-9]+')
            [ -n "$WW_N" ] || WW_N=$(grep -oE '已预热 [0-9]+ 请求' /opt/logs/wallwarm.log 2>/dev/null | tail -1 | grep -oE '[0-9]+')
            WW_TOP=$(grep '宽度档:' /opt/logs/wallwarm.log 2>/dev/null | tail -1 | sed -E 's/.*宽度档: ([^（]*).*/\1/' | tr -s ' ')
            case "$WW_N" in ''|0) ;; *) WW_SUMMARY="${WW_N} 次请求 / 档位 ${WW_TOP:-?}";; esac
          fi
          # 本轮活跃客户端：authentication.db 登态表中本轮有活动的 AppName（去重）。
          # 活动窗口锚定 run 起点——/tmp/link-host 由本轮早期步骤创建，mtime 即本轮开始。
          # 只列 AppName 不带设备名/用户名：TG 私信与公开日志同源（公开日志安全边界，
          # 设备名可能含个人信息）；排除预热器自建的 'emby302 workflow' 登录态。
          CLIENTS="未知"
          command -v sqlite3 >/dev/null 2>&1 || sudo apt-get install -y -qq sqlite3 >/dev/null 2>&1 || true
          if command -v sqlite3 >/dev/null 2>&1 && [ -f /var/lib/emby/data/authentication.db ]; then
            CUT=$(stat -c %Y /tmp/link-host 2>/dev/null || echo $(( $(date +%s) - 7 * 3600 )))
            CLIENTS=$(sudo sqlite3 -readonly /var/lib/emby/data/authentication.db \
              "SELECT group_concat(AppName, '、') FROM (SELECT DISTINCT AppName FROM Tokens_2
                WHERE IsActive=1 AND DateLastActivityInt >= $CUT AND AppName != '' AND AppName != 'emby302 workflow')" 2>/dev/null) || CLIENTS="未知"
            [ -n "$CLIENTS" ] || CLIENTS="无记录"
          fi
          # 统一 HTML 版式 + 统一收尾区（发送层；本 step 无 checkout 依赖，脚本目录
          # 已由 EMBY302_DIR 旁的 checkout 提供）
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"
          case "$MODE" in
            302) MODE_DESC="302 直链";;
            direct) MODE_DESC="direct 中转";;
            *) MODE_DESC="$MODE";;
          esac
          msg=""
          tg_add_title msg "${STATUS_EMOJI} Emby 服务停止"
          tg_add_kv msg "状态" "${STATUS}"
          tg_add_kv msg "模式" "${MODE_DESC}"
          tg_add_kv msg "302 链路" "$OD_SUMMARY"
          tg_add_kv msg "全库预热" "$WW_SUMMARY"
          tg_add_kv msg "客户端" "$CLIENTS"
          tg_add_kv msg "时间" "$(date '+%Y-%m-%d %H:%M:%S %Z')"
          # 统一收尾区（⏱ 已运行 X · 🔗 运行日志；读 step env 的 TG_RUN_URL / TG_RUN_STARTED_AT）
          tg_add_footer msg
          echo "TG(收尾): 已构建统一版式消息"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            --data-urlencode "text=${msg}" \
            -d parse_mode=HTML
          # 播放事件日志归档：便于排查"播了但没通知"
          echo "--- playlog.log (tail 80) ---"
          tail -n 80 /opt/logs/playlog.log 2>/dev/null || echo "(无 playlog.log)"
          # ge2o 自身日志归档：定位播放走中转而非 302 直链的原因。
          # redact_log 会整行丢掉 ge2o 的 cacheKey 调试行（内含完整请求头与 cf_clearance Cookie）
          echo "--- ge2o.log (tail 60, 脱敏) ---"
          tail -n 60 /opt/logs/ge2o.log 2>/dev/null | redact_log || echo "(无 ge2o.log)"
          # odlink 日志归档：直链服务的解析结果——段数/是否跨盘/Graph 码/是否取到直链。
          # odlink 自身已脱敏（不落 token、不落完整链接），这里只再拦一道 URL 兜底。
          echo "--- odlink.log (tail 60, 脱敏) ---"
          tail -n 60 /opt/logs/odlink.log 2>/dev/null | redact_urls || echo "(无 odlink.log)"
          # rclone 挂载日志：VFS 缓存逐出、429/403 限流、seek 后的重取。
          # 必须 grep 筛关键行而不是纯 tail——缓存清理类输出每 15s 一条，
          # 5.7 小时上千行，纯 tail 只会被它们占满，看不到真正的异常。
          echo "--- rclone-mount.log (关键行 40, 脱敏) ---"
          grep -aE "ERROR|WARNING|throttl|429|403|rate limit|low level retry|vfs cache" \
            /opt/logs/rclone-mount.log 2>/dev/null | tail -n 40 | redact_urls || echo "(无 rclone-mount.log)"
          # Emby 控制台日志：起播时的 ffprobe / ffmpeg 记录，
          # 是定位"点击播放后要等 20 秒"的关键现场——这段成本不在挂载层。
          echo "--- emby-console.log (tail 60, 脱敏) ---"
          tail -n 60 /opt/logs/emby-console.log 2>/dev/null | redact_urls || echo "(无 emby-console.log)"
          # 预热日志：直链冷解析与挂载冷读的实测耗时，判断起播慢在哪一层的量化依据。
          echo "--- warmup.log (tail 40) ---"
          tail -n 40 /opt/logs/warmup.log 2>/dev/null || echo "(无 warmup.log)"
          # 全库海报预热日志：本轮覆盖了多少张、是否触发磁盘/停机保护
          echo "--- wallwarm.log (tail 15) ---"
          tail -n 15 /opt/logs/wallwarm.log 2>/dev/null || echo "(无 wallwarm.log)"
