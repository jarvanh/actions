# task0 同步结果核对验证: onedrive:0 vs openlist:wopan176Crypt/0
# 用途: 同步完成后独立核对——文件数量、总大小、逐文件 size-only 比对、抽样内容校验。
# 触发: 仅手动 Dispatch。复用主 workflow 基础设施（OpenList 容器 + 隧道，crypt 目标须经其访问）。
# 回滚: 删除本文件即可。
name: openlist-task0-verify

on:
  workflow_dispatch:
    inputs:
      sample_count:
        description: "抽样校验文件数"
        required: false
        type: number
        default: 5

concurrency: openlist-singleton

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENLIST_PROBE_TIMEOUT: "15"
      OPENLIST_ADMIN_PASSWORD: ${{ secrets.OPENLIST_ADMIN_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: 安装 rclone（GitHub Releases 直下，rclone.org 近期持续超时）
        run: |
          set -e
          RVER=v1.71.2
          curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 300 \
            -o /tmp/rclone.deb \
            "https://github.com/rclone/rclone/releases/download/${RVER}/rclone-${RVER}-linux-amd64.deb"
          sudo dpkg -i /tmp/rclone.deb
          rclone version | head -2

      - name: 写入 rclone 配置（含密钥掩码）
        env:
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE }}
        run: |
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG_SECRET
          EOF
          python3 "$GITHUB_WORKSPACE/.github/scripts/openlist/mask_rclone_config.py"

      - name: 验证远端连通
        run: |
          echo "==========onedrive==========="
          rclone lsf onedrive:

      - name: 拉起 OpenList 容器（数据库本地化）
        run: |
          sudo docker rm -f openlist 2>/dev/null || true
          sudo mkdir -p /opt/openlist-data
          sudo chmod 0777 /opt/openlist-data
          rclone copy dropbox:self-hosted/openlist/data /opt/openlist-data \
            --exclude "data.db-wal" --exclude "data.db-shm" --exclude "data.db-journal"
          OPENLIST_DB_MD5_PULL=$(md5sum /opt/openlist-data/data.db 2>/dev/null | awk '{print $1}')
          OPENLIST_DB_MD5_PULL="${OPENLIST_DB_MD5_PULL:-none}"
          echo "OPENLIST_DB_MD5_PULL=$OPENLIST_DB_MD5_PULL" >> "$GITHUB_ENV"
          sudo docker run -d --restart=unless-stopped -v /opt/openlist-data:/opt/openlist/data -p 5244:5244 -e PUID=0 -e PGID=0 -e UMASK=022 --name="openlist" openlistteam/openlist:latest

      - name: 安装 cloudflared 并启动隧道
        run: |
          source "$GITHUB_WORKSPACE/.github/scripts/openlist/load_all.sh"
          echo "等待 OpenList 就绪..."
          if wait_openlist_ready; then
            echo "✅ OpenList 就绪"
          else
            echo "❌ OpenList 未能就绪"
            exit 1
          fi
          sudo mkdir -p ~/.cloudflared
          sudo rclone copy dropbox:self-hosted/.cloudflared ~/.cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          nohup cloudflared tunnel run --url http://127.0.0.1:5244 openlist &
          sleep 10

      # ===== 核对主体 =====
      - name: "核对: 数量/大小/逐文件比对/抽样校验"
        env:
          SAMPLE_COUNT: ${{ inputs.sample_count || 5 }}
        run: |
          set -o pipefail
          REPORT="/tmp/task0_verify_$(date +%Y%m%d_%H%M%S).log"
          echo "=== task0 核对报告 $(date -u +'%Y-%m-%dT%H:%M:%SZ') ===" | tee "$REPORT"
          echo "源端: onedrive:0  目标端: openlist:wopan176Crypt/0" | tee -a "$REPORT"

          echo "" | tee -a "$REPORT"
          echo "--- [1] 源端 rclone size ---" | tee -a "$REPORT"
          rclone size onedrive:0 --json | tee /tmp/src_size.json
          cat /tmp/src_size.json | tee -a "$REPORT"

          echo "" | tee -a "$REPORT"
          echo "--- [2] 目标端 rclone size（经 OpenList 加密挂载）---" | tee -a "$REPORT"
          rclone size openlist:wopan176Crypt/0 --json | tee /tmp/dst_size.json
          cat /tmp/dst_size.json | tee -a "$REPORT"

          SRC_COUNT=$(jq -r '.count' /tmp/src_size.json)
          DST_COUNT=$(jq -r '.count' /tmp/dst_size.json)
          SRC_BYTES=$(jq -r '.bytes' /tmp/src_size.json)
          DST_BYTES=$(jq -r '.bytes' /tmp/dst_size.json)
          echo "" | tee -a "$REPORT"
          echo "--- [3] 数量/大小对照 ---" | tee -a "$REPORT"
          echo "文件数: 源=$SRC_COUNT 目标=$DST_COUNT 差值=$((DST_COUNT - SRC_COUNT))" | tee -a "$REPORT"
          echo "字节数: 源=$SRC_BYTES 目标=$DST_BYTES 差值=$((DST_BYTES - SRC_BYTES))" | tee -a "$REPORT"

          echo "" | tee -a "$REPORT"
          echo "--- [4] 逐文件 size-only 比对（rclone check）---" | tee -a "$REPORT"
          rclone check onedrive:0 openlist:wopan176Crypt/0 --size-only --combined /tmp/check_combined.txt 2>&1 | tail -15 | tee -a "$REPORT"
          CHECK_RC=$?
          OK_N=$(grep -c '^= ' /tmp/check_combined.txt || true)
          MISS_N=$(grep -c '^- ' /tmp/check_combined.txt || true)
          EXTRA_N=$(grep -c '^+ ' /tmp/check_combined.txt || true)
          DIFF_N=$(grep -c '^\* ' /tmp/check_combined.txt || true)
          echo "check结果: 一致=$OK_N 目标缺失=$MISS_N 目标多余=$EXTRA_N 大小不同=$DIFF_N (rc=$CHECK_RC)" | tee -a "$REPORT"
          if [ "$MISS_N" != "0" ] || [ "$DIFF_N" != "0" ]; then
            echo "缺失/不一致清单（前50条）:" | tee -a "$REPORT"
            grep -E '^(-|\*) ' /tmp/check_combined.txt | head -50 | tee -a "$REPORT"
          fi

          echo "" | tee -a "$REPORT"
          echo "--- [5] 抽样内容校验（md5，含加密挂载读取）---" | tee -a "$REPORT"
          # 从一致清单中抽大/中/小三档文件，源端取 md5，目标端下载算 md5 比对
          grep '^= ' /tmp/check_combined.txt | awk '{print $2}' | sort -R | head -"$SAMPLE_COUNT" > /tmp/sample_list.txt
          SAMPLE_PASS=0; SAMPLE_FAIL=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            SRC_MD5=$(rclone hashsum MD5 "onedrive:0" --files-from-raw /dev/null 2>/dev/null; rclone md5sum "onedrive:0" 2>/dev/null | awk -v F="$f" -F'  ' '$2==F{print $1}')
            DST_MD5=$(rclone cat "openlist:wopan176Crypt/0/$f" 2>/dev/null | md5sum | awk '{print $1}')
            if [ -n "$DST_MD5" ] && [ "$SRC_MD5" = "$DST_MD5" ]; then
              echo "✅ $f md5=$DST_MD5" | tee -a "$REPORT"
              SAMPLE_PASS=$((SAMPLE_PASS+1))
            else
              echo "❌ $f 源md5=${SRC_MD5:-N/A} 目标md5=${DST_MD5:-N/A}" | tee -a "$REPORT"
              SAMPLE_FAIL=$((SAMPLE_FAIL+1))
            fi
          done < /tmp/sample_list.txt
          echo "抽样结果: 通过=$SAMPLE_PASS 失败=$SAMPLE_FAIL" | tee -a "$REPORT"

          echo "" | tee -a "$REPORT"
          echo "--- [6] 结论 ---" | tee -a "$REPORT"
          if [ "$SRC_COUNT" = "$DST_COUNT" ] && [ "$SRC_BYTES" = "$DST_BYTES" ] && [ "$MISS_N" = "0" ] && [ "$DIFF_N" = "0" ] && [ "$SAMPLE_FAIL" = "0" ]; then
            echo "✅ 核对通过: 源与目标数量、大小、逐文件、抽样全部一致" | tee -a "$REPORT"
          else
            echo "⚠️ 核对存在差异，详见上文（缺失/不一致清单）" | tee -a "$REPORT"
          fi

          # 报告留档到 onedrive:/logs/verify/
          rclone copyto "$REPORT" "onedrive:/logs/verify/$(basename "$REPORT")" || true
          echo "报告已留档: onedrive:/logs/verify/$(basename "$REPORT")"

      - name: "Persist: openlist 数据库回传"
        if: ${{ always() }}
        run: |
          sudo docker stop openlist 2>/dev/null || true
          CUR_MD5=$(md5sum /opt/openlist-data/data.db 2>/dev/null | awk '{print $1}')
          CUR_MD5="${CUR_MD5:-none}"
          if [ "$CUR_MD5" = "${OPENLIST_DB_MD5_PULL:-none}" ]; then
            echo "db 未变化，跳过回传"
          else
            rclone sync /opt/openlist-data dropbox:self-hosted/openlist/data \
              --exclude "data.db-wal" --exclude "data.db-shm" --exclude "data.db-journal"
            echo "db 回传完成"
          fi
