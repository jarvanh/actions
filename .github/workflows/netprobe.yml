name: netprobe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: runner identity
        run: |
          echo "=== runner 出口 IP 归属 ==="
          curl -sS --max-time 20 --noproxy '*' https://ipinfo.io/json || true
          echo
          echo "=== 代理变量（应为空）==="
          env | grep -i proxy || echo "(无)"
      - name: downlink 50MiB
        run: |
          for i in 1 2 3; do
            curl -sS -L -o /dev/null --noproxy '*' \
              -w "down#$i http=%{http_code} size=%{size_download} time=%{time_total} speed=%{speed_download}B/s\n" \
              --max-time 120 -r 0-52428799 \
              https://registry.npmmirror.com/-/binary/node/v26.9.0/node-v26.9.0-win-x64.zip || true
          done
      - name: uplink 20MiB
        run: |
          head -c 20971520 /dev/urandom > /tmp/up20.bin
          for i in 1 2 3; do
            curl -sS -o /dev/null --noproxy '*' \
              -w "up#$i http=%{http_code} uploaded=%{size_upload} time=%{time_total} speed=%{speed_upload}B/s\n" \
              --max-time 180 -X POST --data-binary @/tmp/up20.bin \
              -H 'Content-Type: application/octet-stream' \
              https://speed.cloudflare.com/__up || true
          done
