name: proxy-speedtest-taier

# 订阅节点三网测速：逐个节点用 MiaM1ku/taierspeedtest（全球网测 / 泰尔测速，
# 协议还原自 com.cnspeedtest.globalspeed）测「节点 → 国内电信/联通/移动测速点」
# 的延迟与单/多线程上下行，结果推送 Telegram。
#
# 与 proxy-speedtest 系列同族（同一订阅源 PROXY_SPEEDTEST_SUB_URLS、同一 mihomo 内核），
# 只是测速引擎换成泰尔测速：它给的是三网测速点口径的延迟/带宽，而 proxy-speedtest
# 给的是延迟 + 镜像站下载 + Gitee 上行的综合口径。
#
# 链路说明：taierspeedtest 是原生 TCP/ICMP 客户端，没有 --proxy 参数，且 Go 的
# net.Dialer 直接发系统调用（proxychains 之类 LD_PRELOAD 方案无效），所以走
# mihomo TUN 透明接管该进程流量：
#   rules: [PROCESS-NAME,taierspeedtest,AUTO, MATCH,DIRECT]
# 即只有测速进程走节点、其余流量（含 runner 心跳/日志）直连；再用「测速出口 IP
# 是否等于 runner 直连出口 IP」校验规则真的生效（TUN 起不来会静默直连、结果失真）。
# 开 TUN 需要 CAP_NET_ADMIN，脚本会在非 root 时自动加 sudo。
on:
  schedule:
    # 每天 4 次、间隔 4 小时：UTC 23:00, 03:00, 07:00, 11:00（北京 07:00, 11:00, 15:00, 19:00）。
    # 与 gitee（京 05/09/13/17）、cdn（京 06/10/14/18）各错开 1 小时，避免共用订阅源互相抢带宽；
    # 全部落在北京时间 05:00–21:00（夜间不测：runner 排队 + 出口拥塞会让读数失真）。
    # 本套耗时最长（测速点多时尤甚），4 小时间隔若撞车由 concurrency singleton 排队，不会并发。
    - cron: "0 23,3,7,11 * * *"
  workflow_dispatch:
    inputs:
      points:
        description: '测速点（省份/城市 + 运营商；每多一个点单节点耗时翻倍）'
        required: false
        type: choice
        default: '广东联通'
        options:
          - '广东联通'
          - '广东电信'
          - '广东移动'
          - '北京电信'
          - '北京联通'
          - '北京移动'
          - '上海电信'
          - '上海联通'
          - '上海移动'
          - '浙江电信'
          - '江苏电信'
          - '四川电信'
          - '湖北电信'
      mode:
        description: '测速模式：single = 单连接（与 proxy-speedtest 系列口径可比、贴近日常单流体验）；multi = 下8+上4 连接叠加看带宽上限；both = 两者对照（耗时翻倍）'
        required: false
        type: choice
        default: 'single'
        options:
          - 'single'
          - 'multi'
          - 'both'
      duration:
        description: '每个方向测速秒数（上游二进制硬钳制 5-13，>13 会被压到 13）'
        required: false
        default: '13'
      alive_probe:
        description: '测活开关（on = 默认，跳过连不上的节点省下 ≈31 秒窗口 / off = 关闭，直接测速）'
        required: false
        type: choice
        default: 'on'
        options:
          - 'on'
          - 'off'
  # 被 proxy-speedtest-gistnodes 当子流程复用（gist 抓来的节点当订阅源）。
  # 入参是 workflow_dispatch 那套的超集：不传就走与定时运行完全一样的默认值。
  workflow_call:
    inputs:
      sub_urls:
        description: '订阅源覆盖（逗号分隔 URL）；留空用仓库 secret PROXY_SPEEDTEST_SUB_URLS'
        required: false
        type: string
      source_gist_id:
        # 与 sub_urls 二选一：编排层（proxy-speedtest-gistnodes）用这条把「抓来的节点」
        # 当订阅源。为什么不直接传 raw URL——URL 里含 gist id，而 gist id 是注册过的
        # secret，含它的 job output 会被 GitHub 整个丢掉（详见「Resolve source
        # subscription」步骤的注释）。传 id、本工作流自己现取 raw URL。
        #
        # 注意：编排层**不会**设这个值（`secrets` 上下文在 job 级 `with:` 里不可用，
        # 会报 `Unrecognized named-value: 'secrets'`）。它只用来给手动 dispatch 留个
        # 覆盖口子；编排层走下面的 `use_gistnodes_source` 开关。
        description: '源订阅 Gist 的 id（手动覆盖用）；设了它就由本工作流解析 raw URL'
        required: false
        type: string
      source_gist_filename:
        description: '源订阅在 Gist 里的文件名（与 source_gist_id 配对）'
        required: false
        type: string
      use_gistnodes_source:
        # 编排层（proxy-speedtest-gistnodes）专用开关：置 '1' 表示「把 gistnodes 抓来的
        # 节点当订阅源」，此时本工作流从**自己的** secrets 里读
        # `PROXY_SPEEDTEST_GISTNODES_GIST_ID` 并解析它的 raw URL。
        # 为什么不直接把 id 传进来：见上面 `source_gist_id` 的注释。
        description: '置 1 = 用 gistnodes 抓来的节点当订阅源（从本工作流 secrets 取 Gist id）'
        required: false
        type: string
      result_gist_id_from_gistnodes:
        # 同理：结果 Gist 也改从本工作流的 secrets 取 `PROXY_SPEEDTEST_GISTNODES_GIST_ID`，
        # 因为编排层传不进来（`secrets` 在 job 级 `with:` 里不可用）。
        description: '置 1 = 结果写进 secrets.PROXY_SPEEDTEST_GISTNODES_GIST_ID（而非本工作流自己的）'
        required: false
        type: string
      points:
        description: '测速点（与 workflow_dispatch 同名入参同义）'
        required: false
        type: string
      mode:
        description: '测速模式 single|multi|both'
        required: false
        type: string
      duration:
        description: '每个方向测速秒数'
        required: false
        type: string
      alive_probe:
        description: '测活覆盖（on|off）；留空走默认值 on'
        required: false
        type: string
      include_regex:
        # 节点名 include 正则（不区分大小写）：命中者保留、未命中者**丢弃**——与
        # TAIER_PRIORITY_REGEX（只排序、不丢弃）互补，是真正能缩短运行时长的那个。
        # 为什么做成 workflow_call 入参而不是写死 env：**只有编排轮（gistnodes）该过滤**，
        # 它交接的池子上万、远超 5 小时预算（2026-09-22 实测 15793 个只测完 1905 个）；
        # 本工作流的定时轮吃的是用户自己的机场订阅，不该被正则砍。默认空 = 不过滤，
        # 定时轮与手动 dispatch 行为不变；dispatch 也不设同名入参，防止误开。
        description: '节点名 include 正则（命中保留、未命中丢弃；空 = 不过滤，编排轮专用）'
        required: false
        type: string
      # 下面四个供编排层（proxy-speedtest-gistnodes）覆盖：让同一套测速既能写自己的 Gist，
      # 也能把结果写进调用方指定的 Gist，并让通知标题带上来源标签
      gist_id:
        description: '结果 Gist 的 id 覆盖；留空用本工作流自己的 secret'
        required: false
        type: string
      gist_filename:
        description: '结果 Gist 的文件名覆盖'
        required: false
        type: string
      gist_description:
        description: '结果 Gist 的描述覆盖'
        required: false
        type: string
      label:
        description: '通知标题前缀，用于区分同一套测速的不同来源（留空则不显示）'
        required: false
        type: string

jobs:
  speedtest:
    concurrency: proxy-speedtest-taier-singleton
    runs-on: ubuntu-latest
    # **刻意不设 `timeout-minutes`**，与 gitee / cdn 两套一致（走 GitHub 的 job 默认 360 分钟）。
    # 原先写死 45 分钟，等于把「无界的串行测速」交给一个拍出来的天花板，必撞硬取消：
    # 测速是逐节点串行的、每节点 ≈ `2 × duration + 5` = 31 秒（duration 默认 13，见
    # taier_speedtest.py 里 `TAIER_DURATION` 的注释），**45 分钟只够约 87 个节点**；而
    # proxy-speedtest-gistnodes 一次会交接几千个（实测 2026-09-16 run 35116972319 交接
    # 8326 个 ≈ 71.7 小时），于是整轮白烧。
    # ⚠️ 不设 ≠ 没有上限，默认 360 分钟。**要让长轮真正跑完，靠的是脚本自己的墙钟预算
    # 到点收摊、拿已测节点出订阅，而不是靠抬天花板**（2026-09-14 已实现：
    # `TAIER_BUDGET_SECONDS`，默认 18000 秒 = 5 小时，比 360 分钟少 1 小时留给前置准备
    # 与收尾/**Gist 提交**）。改了 `TAIER_BUDGET_SECONDS` 或将来加回 `timeout-minutes`，
    # 都要回头确认「预算 + 收尾余量 < 硬上限」这个关系没被破。
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Resolve source subscription
        # 为什么要有这一步：gistnodes 编排把「源节点订阅」传给本工作流，但那个订阅的 raw URL
        # 里含 gist id —— gist id 本身是注册过的 secret，GitHub 会把含它的 job output
        # **整个丢掉**（`Skip output 'sub_url' since it may contain secret.`）。下游拿到空值
        # 就 fallback 到仓库 secret：实测 run 34956069334 因此测的是用户自己的机场订阅、
        # 结果还写进了另一个泰尔 Gist，且零报错。所以改由本步骤按 id 现取 raw URL。
        #
        # id 从**本工作流的 secrets** 取，而不是从编排层传入——`secrets` 上下文在 job 级
        # `with:` 里不可用（报 `Unrecognized named-value: 'secrets'`），编排层只能传布尔开关。
        #
        # 两种触发都走这里，统一把最终订阅地址写进 $GITHUB_ENV，下一步只读不覆盖：
        #   - 编排层（use_gistnodes_source='1'）或手动给了 id → 现取源 Gist 的 raw URL
        #   - 其余（定时轮 / 普通手动轮）→ 原样透传 inputs.sub_urls / 仓库 secret
        env:
          USE_GISTNODES: ${{ inputs.use_gistnodes_source }}
          SOURCE_GIST_ID_IN: ${{ inputs.source_gist_id }}
          SOURCE_GIST_ID_SECRET: ${{ secrets.PROXY_SPEEDTEST_GISTNODES_GIST_ID }}
          SOURCE_GIST_FILENAME: ${{ inputs.source_gist_filename || 'proxy_speedtest_gistnodes_providers.yaml' }}
          SUB_URLS_IN: ${{ inputs.sub_urls }}
          SUB_URLS_SECRET: ${{ secrets.PROXY_SPEEDTEST_SUB_URLS }}
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          want_gist=0
          [ "$USE_GISTNODES" = "1" ] && want_gist=1
          [ -n "$SOURCE_GIST_ID_IN" ] && want_gist=1

          if [ "$want_gist" = "1" ]; then
            # 手动给了 id 就优先用它，否则用仓库 secret 里那个（编排层的常规路径）
            export SOURCE_GIST_ID="${SOURCE_GIST_ID_IN:-$SOURCE_GIST_ID_SECRET}"
            # 只认哨兵那一行拿 URL。**不能**直接 `url=$(python -c 'print(resolve...)')`：
            # `resolve_gist_raw_url` 失败时会 `log_progress` 往 stdout 写一行 JSON，而
            # `$( )` 把 stdout 整段当值 ⇒ 取不到时 `$url` 是那行 JSON 而不是空串，
            # 下面的判空失效、畸形值被写进 $GITHUB_ENV，错误被推迟到下一步且完全变形
            # （实测 2026-09-16 run 35082354560：`bootstrap_failed: unknown url type: {"kind"`）
            # —— 本该「响亮地报解析失败」，变成了「拿到了一个畸形 URL」。
            url=$(python -c "
          import os, sys
          sys.path.insert(0, '.github/scripts/proxy-speedtest')
          from speedtest_common import resolve_gist_raw_url_cli
          sys.exit(resolve_gist_raw_url_cli())
          " | sed -n 's/^__GIST_RAW_URL__//p')
            if [ -z "$url" ]; then
              echo "::error::按 gist id 解析源订阅 raw URL 失败（文件=$SOURCE_GIST_FILENAME）"
              exit 1
            fi
            echo "已解析源订阅 raw URL（长度 ${#url}）"
          else
            url="${SUB_URLS_IN:-$SUB_URLS_SECRET}"
            echo "未走 gistnodes 源，沿用既有订阅源配置（长度 ${#url}）"
          fi
          if [ -z "$url" ]; then
            echo "::error::订阅源为空：既没解析出源 Gist raw URL，inputs.sub_urls 与仓库 secret 也都是空"
            exit 1
          fi
          # 同 job 内用 $GITHUB_ENV 交给下一步——不经 job output，所以不会被
          # 「疑似含 secret」那条规则丢掉。
          echo "PROXY_SPEEDTEST_SUB_URLS=$url" >> "$GITHUB_ENV"

      - name: Run taier speedtest
        # 订阅源**不在 env 里设**：上面那步已经把最终值写进 $GITHUB_ENV，这里再设一次会
        # 把它覆盖掉（步骤级 env 优先级高于 GITHUB_ENV）。脚本自己从环境读。
        env:
          # 测速参数（workflow_call 入参 > workflow_dispatch 入参 > 默认值；定时运行走默认值）
          TAIER_POINTS: ${{ inputs.points || github.event.inputs.points || '广东联通' }}
          TAIER_MODE: ${{ inputs.mode || github.event.inputs.mode || 'single' }}
          # 默认 13（上游硬钳上限）：每方向采样 13 秒、单节点 ≈31 秒，读数最稳。
          # 2026-09-24 从 5 上调——此前压到 5 是为了「同等预算多覆盖节点」，而真正的耗时
          # 大头（死节点各吃一个测速窗口）已由测活层筛掉，不再需要拿 duration 换覆盖数。
          TAIER_DURATION: ${{ inputs.duration || github.event.inputs.duration || '13' }}
          # ⚠️ TAIER_MAX_NODES 与 TAIER_PRIORITY_REGEX 已于 2026-09-24 删除（脚本不再读）：
          # max_nodes 是「按 provider 原序砍尾巴」，会砍掉还没测过的节点、与「到点收摊」
          # 语义重复且更易误伤；priority 只排顺序、不减量，测活能真筛死节点后已无收益。
          # 池子大小交给 TAIER_INCLUDE_REGEX，跑不完交给 TAIER_BUDGET_SECONDS 到点收摊。
          # include 过滤正则：workflow_call 入参透传（只有编排轮传，定时轮/手动 dispatch 为
          # 空 = 不过滤）。命中保留、未命中丢弃；正则非法或过滤后为空时脚本 fail-open 原样放行。
          TAIER_INCLUDE_REGEX: ${{ inputs.include_regex || '' }}
          # 测活开关：默认**开**（跳过连不上泰尔控制面的死节点，省下每个测速窗口）。
          # 判据是开测前一次批量拿整组延迟表：拿不到表 ⇒ 探测层整体关闭、全量放行；
          # 拿到了 ⇒ 「表里没有」是真判死（2026-09-24 改，旧逐个探测路径恒 404）。
          # 不接仓库 Variables（排查现场的开关，不适合当成长期仓库配置）。
          TAIER_ALIVE_PROBE: ${{ (inputs.alive_probe || github.event.inputs.alive_probe) == 'off' && '0' || '1' }}
          # 墙钟预算（秒，0 = 不限）：到点不再开下一个节点，拿已测节点照常出订阅（退出码 0），
          # 目的是**不撞 job 的 360 分钟硬取消**（撞上则整轮白烧、订阅来不及提交 Gist）。
          # 默认 18000 秒 = 5 小时，比硬上限少 1 小时留给前置准备与收尾。**与 job 的
          # timeout-minutes 成对，改一个要回看另一个。**
          TAIER_BUDGET_SECONDS: '18000'
          # 订阅导出策略（四套共用，脚本默认值；各脚本消费）：阈值（兆，默认 10）、
          # 判定指标 upload|download（默认 upload 按上行判定；主指标达标数 < 回退门槛
          # 且另一指标更多时改用另一指标。taier 上传常测不出（CDN 拒绝上传包），通常会落到下行）、
          # 最少节点数（默认 1，不足则不上传）、回退门槛（默认 3，与最少节点数是两回事）。
          PROXY_SPEEDTEST_MIN_MEGABIT: '10'
          PROXY_SPEEDTEST_SPEED_METRIC: 'upload'
          PROXY_SPEEDTEST_MIN_NODES: '1'
          PROXY_SPEEDTEST_METRIC_FALLBACK_MIN_NODES: '3'
          # GitHub API 匿名调用在共享出口 IP 上 60 次/h 限流时的认证回退
          GH_TOKEN: ${{ secrets.PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 订阅导出：本工作流专属 Gist（三个测速工作流各用各的，互不覆盖）。
          # 留空则首次运行自动新建，TG 通知会给链接；拿到 id 后回填此 secret 避免每轮新建。
          # 编排层（gistnodes）触发时改成写进 gistnodes 的 Gist —— id 从本工作流 secrets 取，
          # 因为编排层传不进来（`secrets` 上下文在 job 级 `with:` 里不可用）。
          PROXY_SPEEDTEST_GIST_ID: ${{ (inputs.result_gist_id_from_gistnodes == '1' && secrets.PROXY_SPEEDTEST_GISTNODES_GIST_ID) || inputs.gist_id || secrets.PROXY_SPEEDTEST_TAIER_GIST_ID }}
          # 新建 gist 后自动把 id 回填到哪个 secret（治「每轮新建 ⇒ 旧链接 404」的自续循环，
          # 见 speedtest_common._backfill_gist_secret）。**只在写自己的 Gist 时回填**:
          # 编排层（gistnodes）/ 手动 gist_id 时写的是别人的 Gist，回填会污染对方的 secret。
          PROXY_SPEEDTEST_GIST_SECRET_NAME: ${{ (inputs.result_gist_id_from_gistnodes == '1' || inputs.gist_id) && '' || 'PROXY_SPEEDTEST_TAIER_GIST_ID' }}
          PROXY_SPEEDTEST_GIST_FILENAME: ${{ inputs.gist_filename || 'proxy_speedtest_taier_subscription.yaml' }}
          PROXY_SPEEDTEST_GIST_DESCRIPTION: ${{ inputs.gist_description || 'proxy speedtest subscription (taier 三网)' }}
          # 通知标题前缀：编排层传入时标题变成「gist 节点 · 泰尔三网测速」，便于分辨来源
          PROXY_SPEEDTEST_LABEL: ${{ inputs.label }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 统一收尾区（footer）: 运行日志链接 + 已运行时长
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/proxy-speedtest/taier_speedtest.py

      # 兜底收尾：mihomo TUN 的 auto-route 会接管整机出向路由，内核不撤掉的话
      # runner 无法把日志/状态回传 GitHub（表现为所有 step 已完成但 run 卡在
      # in_progress、连取消都执行不了）。脚本正常路径会自己关，这里防异常/超时。
      - name: Cleanup mihomo TUN
        if: ${{ always() }}
        run: |
          sudo -n pkill -f "mihomo -d" || true
          sleep 2
          echo "mihomo 残留进程：$(pgrep -cf 'mihomo -d' || true)"
