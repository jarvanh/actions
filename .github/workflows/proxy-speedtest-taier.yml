name: proxy-speedtest-taier

# 订阅节点三网测速：逐个节点用 MiaM1ku/taierspeedtest（全球网测 / 泰尔测速，
# 协议还原自 com.cnspeedtest.globalspeed）测「节点 → 国内电信/联通/移动测速点」
# 的延迟与单/多线程上下行，结果推送 Telegram。
#
# 与 proxy-speedtest 系列同族（同一订阅源 PROXY_SPEEDTEST_SUB_URLS、同一 mihomo 内核），
# 只是测速引擎换成泰尔测速：它给的是三网测速点口径的延迟/带宽，而 proxy-speedtest
# 给的是延迟 + 镜像站下载 + Gitee 上行的综合口径。
#
# 链路说明：taierspeedtest 是原生 TCP/ICMP 客户端，没有 --proxy 参数，且 Go 的
# net.Dialer 直接发系统调用（proxychains 之类 LD_PRELOAD 方案无效），所以走
# mihomo TUN 透明接管该进程流量：
#   rules: [PROCESS-NAME,taierspeedtest,AUTO, MATCH,DIRECT]
# 即只有测速进程走节点、其余流量（含 runner 心跳/日志）直连；再用「测速出口 IP
# 是否等于 runner 直连出口 IP」校验规则真的生效（TUN 起不来会静默直连、结果失真）。
# 开 TUN 需要 CAP_NET_ADMIN，脚本会在非 root 时自动加 sudo。
on:
  schedule:
    # 每 6 小时测一次：UTC 04:00, 10:00, 16:00, 22:00（北京 12:00, 18:00, 00:00, 06:00）
    # 与 proxy-speedtest-gitee（02/08/14/20）、proxy-speedtest-cdn（03/09/15/21）错峰
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      points:
        description: '测速点（省份/城市 + 运营商；每多一个点单节点耗时翻倍）'
        required: false
        type: choice
        default: '广东联通'
        options:
          - '广东联通'
          - '广东电信'
          - '广东移动'
          - '北京电信'
          - '北京联通'
          - '北京移动'
          - '上海电信'
          - '上海联通'
          - '上海移动'
          - '浙江电信'
          - '江苏电信'
          - '四川电信'
          - '湖北电信'
      mode:
        description: '测速模式：single = 单连接（与 proxy-speedtest 系列口径可比、贴近日常单流体验）；multi = 下8+上4 连接叠加看带宽上限；both = 两者对照（耗时翻倍）'
        required: false
        type: choice
        default: 'single'
        options:
          - 'single'
          - 'multi'
          - 'both'
      duration:
        description: '每个方向测速秒数（上游二进制硬钳制 5-13，>13 会被压到 13）'
        required: false
        default: '10'
      max_nodes:
        description: '最多测几个节点（0 = 不限）'
        required: false
        default: '0'

jobs:
  speedtest:
    concurrency: proxy-speedtest-taier-singleton
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run taier speedtest
        env:
          # 订阅源（与 proxy-speedtest / proxy-speedtest-gitee 同一个 secret）
          PROXY_SPEEDTEST_SUB_URLS: ${{ secrets.PROXY_SPEEDTEST_SUB_URLS }}
          # 测速参数（workflow_dispatch 可覆盖；定时运行走默认值）
          TAIER_POINTS: ${{ github.event.inputs.points || '广东联通' }}
          TAIER_MODE: ${{ github.event.inputs.mode || 'single' }}
          TAIER_DURATION: ${{ github.event.inputs.duration || '10' }}
          TAIER_MAX_NODES: ${{ github.event.inputs.max_nodes || '0' }}
          # 订阅导出策略（四套共用；可在仓库 Settings → Secrets and variables → Actions
          # → Variables 里覆盖，留空走脚本默认值）：
          #   PROXY_SPEEDTEST_MIN_MEGABIT  达标阈值（兆，默认 10）
          #   PROXY_SPEEDTEST_SPEED_METRIC 判定指标 upload|download（默认 upload 按上行判定；
          #                                达标数 < 最少节点数时自动改用另一指标，反之亦然。
          #                                taier 上传常测不出（CDN 拒绝上传包），通常会自动落到下行）
          #   PROXY_SPEEDTEST_MIN_NODES    上传订阅的最少节点数（默认 1，不足则不上传）
          PROXY_SPEEDTEST_MIN_MEGABIT: ${{ vars.PROXY_SPEEDTEST_MIN_MEGABIT || '10' }}
          PROXY_SPEEDTEST_SPEED_METRIC: ${{ vars.PROXY_SPEEDTEST_SPEED_METRIC || 'upload' }}
          PROXY_SPEEDTEST_MIN_NODES: ${{ vars.PROXY_SPEEDTEST_MIN_NODES || '1' }}
          # GitHub API 匿名调用在共享出口 IP 上 60 次/h 限流时的认证回退
          GH_TOKEN: ${{ secrets.PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 订阅导出：本工作流专属 Gist（三个测速工作流各用各的，互不覆盖）。
          # 留空则首次运行自动新建，TG 通知会给链接；拿到 id 后回填此 secret 避免每轮新建
          PROXY_SPEEDTEST_GIST_ID: ${{ secrets.PROXY_SPEEDTEST_TAIER_GIST_ID }}
          PROXY_SPEEDTEST_GIST_FILENAME: proxy_speedtest_taier_subscription.yaml
          PROXY_SPEEDTEST_GIST_DESCRIPTION: 'proxy speedtest subscription (taier 三网)'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 统一收尾区（footer）: 运行日志链接 + 已运行时长
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_RUN_STARTED_AT: ${{ github.run_started_at }}
        run: python .github/scripts/proxy-speedtest/taier_speedtest.py

      # 兜底收尾：mihomo TUN 的 auto-route 会接管整机出向路由，内核不撤掉的话
      # runner 无法把日志/状态回传 GitHub（表现为所有 step 已完成但 run 卡在
      # in_progress、连取消都执行不了）。脚本正常路径会自己关，这里防异常/超时。
      - name: Cleanup mihomo TUN
        if: ${{ always() }}
        run: |
          sudo -n pkill -f "mihomo -d" || true
          sleep 2
          echo "mihomo 残留进程：$(pgrep -cf 'mihomo -d' || true)"
