name: icloud-photos-downloader

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
  watch:
    types: started

jobs:
  build:
    # 与 openlist 工作流共用并发组: 两个工作流都会启动 OpenList 容器，
    # 数据库本地化后各 runner 持有独立副本，并发运行会互相覆盖配置（脑裂）
    concurrency: openlist-singleton
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: rclone-install
        run: |
          set -e
          # 安装 rclone：GitHub Releases 直下 .deb，失败回退 rclone.org 安装脚本
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          # 写配置 + 持久化：secret 起步 → 掩码 → Dropbox 恢复优先 → 有效性检查 → 同步回 Dropbox
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config
      - name: rclone-run
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo mkdir -p /dropbox /mnt/vfs/dropbox /opt/logs
          sudo chown runner:runner /dropbox /mnt/vfs/dropbox /opt/logs
          # 挂载改用 runner 用户（与 emby.yml 一致）：root 身份挂载时 rclone 刷新 token 会把
          # rclone.conf 回写成 root:600，之后非 root 的 rclone（lsf / 末尾 db 回传）读取即 EACCES
          grep -q '^user_allow_other' /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf >/dev/null
          # 参数按"配置"画像：这个挂载只承载 icloudpd 的 cookie 目录，小文件随机读写
          #   --cache-dir        默认 ~/.cache/rclone 会落进根分区（≈14GB），必须指向 /mnt
          #   --attr-timeout 1m  原 10m：cookie 会被反复改写，属性缓存 10 分钟有陈旧风险
          #   --poll-interval 0  run 期间远端目录不会自己变，关轮询省 API 配额
          #   删除 --vfs-read-chunk-size-limit 10G：会让单个 Range 请求一路翻倍到 10GB
          nohup rclone mount dropbox: /dropbox \
            --config /home/runner/.config/rclone/rclone.conf \
            --cache-dir /mnt/vfs/dropbox \
            --allow-other --umask 000 --no-gzip-encoding \
            --attr-timeout 1m \
            --dir-cache-time 72h --poll-interval 0 \
            --vfs-cache-mode full \
            --vfs-cache-max-size 2G --vfs-cache-max-age 1h \
            --vfs-cache-min-free-space 2G \
            --vfs-cache-poll-interval 30s \
            --buffer-size 16M \
            --log-file /opt/logs/rclone-dropbox.log --log-level INFO &
          # 等挂载就绪：下一步的 icloudpd 要立刻读写 cookie 目录
          for _ in $(seq 1 30); do
            mount | grep -q " on /dropbox " && break
            sleep 2
          done
          echo "==========onedrive==========="
          rclone lsf onedrive:
          echo "==========dropbox==========="
          rclone lsf dropbox:
      - name: Run openlist container
        run: |
          # ===== 数据库本地化（与 openlist 工作流同模式）=====
          # SQLite 不能跑在 rclone FUSE 挂载上 → 启动拉取本地、结束回传
          # （见末尾 "Persist" step；撕裂快照源头 -wal/-shm/-journal 拉取时排除）
          sudo mkdir -p /opt/openlist-data
          sudo chmod 0777 /opt/openlist-data
          rclone copy dropbox:self-hosted/openlist/data /opt/openlist-data \
            --exclude "data.db-wal" --exclude "data.db-shm" --exclude "data.db-journal"
          OPENLIST_DB_MD5_PULL=$(md5sum /opt/openlist-data/data.db 2>/dev/null | awk '{print $1}' || echo "none")
          echo "OPENLIST_DB_MD5_PULL=$OPENLIST_DB_MD5_PULL" >> "$GITHUB_ENV"
          docker run -d --restart=unless-stopped -v /opt/openlist-data:/opt/openlist/data -p 5244:5244 -e PUID=0 -e PGID=0 -e UMASK=022 --name="openlist" openlistteam/openlist:latest
          sleep 1m
          docker ps
          sudo mkdir -p /openlist /mnt/vfs/openlist /opt/logs
          sudo chown runner:runner /openlist /mnt/vfs/openlist /opt/logs
          # 参数按"批量写入"画像：icloudpd 会往这里持续下载大量照片
          #   --cache-dir          默认 ~/.cache/rclone 会落进根分区（≈14GB），必须指向 /mnt
          #   --vfs-cache-max-age 24h  ★ 原 5m 是数据风险：文件写完若 5 分钟内没回传完就被逐出
          #   --vfs-write-back 5m  攒 5 分钟再回传，减少请求数（照片是批量写入，攒批明显更省）
          #   --transfers 4        并行回传
          #   --attr-timeout 1m    原 10m：目录内容随下载不断变化，缓存 10 分钟属性有陈旧风险
          #   删除 --vfs-read-chunk-size-limit 10G：写入场景用不到，且会让读请求涨到 10GB
          nohup rclone mount openlist: /openlist \
            --config /home/runner/.config/rclone/rclone.conf \
            --cache-dir /mnt/vfs/openlist \
            --allow-other --umask 000 --no-gzip-encoding \
            --attr-timeout 1m \
            --dir-cache-time 72h --poll-interval 0 \
            --vfs-cache-mode full \
            --vfs-cache-max-size 8G --vfs-cache-max-age 24h \
            --vfs-cache-min-free-space 2G \
            --vfs-cache-poll-interval 30s \
            --buffer-size 16M \
            --vfs-write-back 5m --transfers 4 \
            --log-file /opt/logs/rclone-openlist.log --log-level INFO &
          for _ in $(seq 1 30); do
            mount | grep -q " on /openlist " && break
            sleep 2
          done
      - name: run icloud-photos-downloader
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          sudo apt-get update
          pip install icloudpd
          icloudpd --list-libraries --cookie-directory /dropbox/self-hosted/iCloudPhotosCookie --username ${{ secrets.APPLEID }} --password ${{ secrets.APPLEPASSWORD }} --auto-delete
          icloudpd --library SharedSync-6D80D39D-BDF2-49D1-9E6C-1EE9B681177F --directory /openlist/123panCrypt1/iCloudPhotosShared --cookie-directory /dropbox/self-hosted/iCloudPhotosCookie --username ${{ secrets.APPLEID }} --password ${{ secrets.APPLEPASSWORD }} --auto-delete
          icloudpd --library PrimarySync --directory /openlist/123panCrypt1/iCloudPhotosPersonal --cookie-directory /dropbox/self-hosted/iCloudPhotosCookie --username ${{ secrets.APPLEID }} --password ${{ secrets.APPLEPASSWORD }} --auto-delete
          echo "github icloud-photos-downloader 任务执行结束"
          # 统一 HTML 通知 + 统一收尾区（发送失败不判任务失败）
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"
          msg=""
          tg_add_title msg "☁️ iCloud 照片下载完成"
          tg_add_kv msg "图库" "个人 + 共享 · 增量 · 自动清理"
          tg_add_kv msg "状态" "✅ 完成"
          tg_add_footer msg
          send_tg "$msg" || echo "::warning::iCloud 通知发送失败（不影响任务）"

      # ===== 数据库回传（失败/取消也执行）=====
      # 停容器 → SQLite 干净关闭 → 整目录 sync 镜像回传（db 未变化则跳过）
      - name: "Persist: openlist 数据库回传"
        if: ${{ always() }}
        run: |
          sudo fusermount -uz /openlist 2>/dev/null || true
          docker stop openlist 2>/dev/null || true
          CUR_MD5=$(md5sum /opt/openlist-data/data.db 2>/dev/null | awk '{print $1}' || echo "none")
          if [ "$CUR_MD5" = "${OPENLIST_DB_MD5_PULL:-none}" ]; then
            echo "db 未变化（${CUR_MD5}），跳过回传"
          else
            echo "db 已变化（${OPENLIST_DB_MD5_PULL:-none} → ${CUR_MD5}），sync 回传..."
            rclone sync /opt/openlist-data dropbox:self-hosted/openlist/data \
              --exclude "data.db-wal" --exclude "data.db-shm" --exclude "data.db-journal"
            rclone delete dropbox:self-hosted/openlist/data \
              --include "data.db-wal" --include "data.db-shm" --include "data.db-journal" 2>/dev/null || true
            echo "回传完成"
          fi
