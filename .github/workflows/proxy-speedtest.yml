name: proxy-speedtest

# 独立的可视化测速任务：测量节点延迟 + 下载速度，生成可交互 HTML 报告。
# 与 proxy-speedtest.yml（Gitee 上行测速）解耦，可单独触发，互不依赖。
on:
  schedule:
    # 每 6 小时测一次：UTC 03:00, 09:00, 15:00, 21:00（北京 11:00, 17:00, 23:00, 05:00），与 Gitee 任务错峰
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:

jobs:
  speedtest:
    concurrency: proxy-speedtest-singleton
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run node speedtest (latency + download)
        env:
          PROXY_SPEEDTEST_DETACH: '0'
          PROXY_SPEEDTEST_SUB_URLS: ${{ secrets.PROXY_SPEEDTEST_SUB_URLS }}
          # 自定义测试参数（可按需修改）
          PROXY_SPEEDTEST_LATENCY_TARGETS: 'https://www.baidu.com,https://www.taobao.com'
          PROXY_SPEEDTEST_LATENCY_SAMPLES: '4'
          PROXY_SPEEDTEST_LATENCY_TIMEOUT: '8'
          # 下载测速点不写死版本号：留空时脚本自动组合两类国内测速点——
          #  1) 国内滚动 ISO 索引目录（腾讯云 8/9-stream、清华 TUNA 等）自动发现
          #     *-latest-*.iso 软链，始终指向最新可用文件；
          #  2) 国内厂商 CDN（npmmirror 淘宝镜像）最新版 node 安装包，经 dist-tags
          #     实时解析版本号拼出「最新版」固定直链，代表日常软件下载带宽。
          # 两者均运行时自动取最新，规避版本号失效。如需固定测速点，可显式设置
          # 该变量为逗号分隔的 URL 列表；设 PROXY_SPEEDTEST_NPMMIRROR_ENABLED=0 可关闭第 2 类。
          # PROXY_SPEEDTEST_DOWNLOAD_URLS: ''
          # PROXY_SPEEDTEST_NPMMIRROR_ENABLED: '1'
          PROXY_SPEEDTEST_SIZE_MIB: '10'
          PROXY_SPEEDTEST_DOWNLOAD_TIMEOUT: '30'
          PROXY_SPEEDTEST_CONNECTIONS: '1'
          PROXY_SPEEDTEST_SWITCH_SETTLE_SECONDS: '1.5'
          PROXY_SPEEDTEST_MAX_NODES: '0'
          # 上行测速：默认开启，且经 mihomo 代理上传到 Gitee（反映代理节点上行带宽）。
          # 需先在仓库 Secrets 配置 GITEE_PRIVATE_TOKEN 与 PROXY_SPEEDTEST_GITEE_OWNER，
          # 并准备可写的私有仓库（默认 proxy-speedtest-temp）。设 ENABLE_PUSH=0 可关闭。
          PROXY_SPEEDTEST_ENABLE_PUSH: '1'
          # 上行是否经代理：1=经代理（代理节点上行质量）；0=直连 Gitee（家庭宽带上行）
          PROXY_SPEEDTEST_UPLOAD_VIA_PROXY: '1'
          GITEE_PRIVATE_TOKEN: ${{ secrets.GITEE_PRIVATE_TOKEN }}
          PROXY_SPEEDTEST_GITEE_OWNER: ${{ secrets.PROXY_SPEEDTEST_GITEE_OWNER }}
          PROXY_SPEEDTEST_GITEE_REPO: proxy-speedtest-temp
          PROXY_SPEEDTEST_PUSH_TIMEOUT: '30'
          # 报告写入仓库内的 proxy-speedtest-reports/ 目录（默认回退即此路径，显式指定以防歧义）
          PROXY_SPEEDTEST_OUTPUT_DIR: ${{ github.workspace }}/proxy-speedtest-reports
        run: python .github/scripts/proxy-speedtest/speedtest.py

      - name: Commit report to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxy-speedtest-reports/
          if git diff --cached --quiet; then
            echo "no report changes"
          else
            git commit -m "chore(proxy-speedtest): 更新可视化测速报告 [skip ci]"
            git push
          fi

      - name: Upload speedtest report (artifact backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-speedtest-report
          path: |
            ~/proxy-speedtest/speedtest_report.html
            ~/proxy-speedtest/speedtest_result.json
          retention-days: 30
