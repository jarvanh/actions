name: Backup All GitHub Repositories to OneDrive

on:
  schedule:
    - cron: '0 3 * * *' # 每天 UTC 03:00（北京 11:00）运行
  workflow_dispatch:

concurrency:
  group: backup-repos
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: rclone-install
        run: |
          set -e
          # 安装 rclone：GitHub Releases 直下 .deb，并用同 Release 的 SHA256SUMS 校验（取不到校验和即失败）
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          # 写配置 + 持久化：secret 起步 → 掩码 → Dropbox 恢复优先 → 有效性检查 → 同步回 Dropbox
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config
      - name: Backup all repositories
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          # 备份包含所有仓库的完整历史（含私有库），产物一律 0600，避免同机其他进程读取
          umask 077
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "❌ PAT 未配置（secrets.PAT），无法枚举/克隆私有仓库" >&2
            exit 1
          fi
          REPO_LIST="$(mktemp)"
          cleanup_backup_workdir() {
            rm -f github_repos_latest.tar.gz 2>/dev/null || true
            rm -rf github_backup_temp.tmp 2>/dev/null || true
            rm -f "$REPO_LIST" 2>/dev/null || true
          }
          free_kb() { df -Pk "${1:-.}" | awk 'NR==2 {print $4}'; }
          require_free_kb() {
            local path="$1" min_kb="$2" label="$3"
            local avail
            avail=$(free_kb "$path")
            if [ "${avail:-0}" -lt "$min_kb" ]; then
              echo "❌ ${label}: insufficient free space at ${path}. available=${avail}KB required=${min_kb}KB" >&2
              exit 1
            fi
            echo "✅ ${label}: free space ok at ${path}. available=${avail}KB required=${min_kb}KB"
          }
          require_free_kb "." $((5 * 1024 * 1024)) "github repos backup initial preflight"
          trap cleanup_backup_workdir EXIT
          # 💡 修改：使用固定压缩包名，不再使用日期后缀
          ARCHIVE_NAME="github_repos_latest.tar.gz"
          BACKUP_DIR="github_backup_temp"
          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR"
          
          # 获取用户所有的仓库 (包括 private 和 public)。必须全量分页：单页
          # per_page=100 在第 101 个仓库起会静默漏备；按 Link/不足 100 条结束。
          page=1
          : > "$REPO_LIST"
          while :; do
            resp="$(curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/user/repos?per_page=100&type=owner&page=${page}")"
            count="$(printf '%s' "$resp" | jq 'if type == "array" then length else error("unexpected response") end')"
            printf '%s' "$resp" | jq -r '.[].full_name' >> "$REPO_LIST"
            [ "$count" -lt 100 ] && break
            page=$((page + 1))
            if [ "$page" -gt 100 ]; then
              echo "❌ 仓库分页超过 100 页，疑似 API 异常，终止以避免半量备份" >&2
              exit 1
            fi
          done
          mapfile -t REPOS < <(sed '/^[[:space:]]*$/d' "$REPO_LIST" | sort -u)

          if [ "${#REPOS[@]}" -eq 0 ]; then
            echo "未找到任何仓库，请检查 PAT 权限。"
            exit 1
          fi

          # PAT 只经 credential helper（子进程环境变量）传给 git，绝不拼进 clone URL：
          # URL 会落进 .git/config，随后被 tar 进 OneDrive 备份包（原实现即此泄露路径）。
          GIT_ASKPASS=/bin/true
          export GIT_ASKPASS
          GIT_CONFIG_COUNT=1
          GIT_CONFIG_KEY_0=credential.helper
          # 单引号是刻意的：${GH_TOKEN} 必须由 git 调起的 helper 子壳展开，
          # 不能在本 step 里展开（否则 token 会进 argv/日志）。
          # shellcheck disable=SC2016,SC2089,SC2090
          GIT_CONFIG_VALUE_0='!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          # shellcheck disable=SC2090
          export GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          for REPO in "${REPOS[@]}"; do
            REPO_NAME="${REPO##*/}"
            echo "----------------------------------------"
            echo "正在处理仓库: $REPO_NAME ..."

            DEST="$BACKUP_DIR/$REPO_NAME.git"
            if ! GIT_TERMINAL_PROMPT=0 git clone --mirror "https://github.com/${REPO}.git" "$DEST"; then
              echo "❌ $REPO_NAME 备份失败（可能已被 GitHub 禁用或访问受限），跳过此仓库。"
              rm -rf "$DEST"
              continue
            fi
            # 防御性清理：无论 clone 用何种认证方式，origin URL 必须是无凭据形式；
            # 同时清掉可能被写入的认证辅助配置。
            if ! git -C "$DEST" remote set-url origin "https://github.com/${REPO}.git"; then
              echo "❌ $REPO_NAME 无法重置 origin URL，终止（防止凭据入包）" >&2
              exit 1
            fi
            git -C "$DEST" config --unset-all http.extraheader 2>/dev/null || true
            git -C "$DEST" config --unset-all credential.helper 2>/dev/null || true
          done

          # 打包前凭据扫描：任何文本文件（含每个仓库的 .git/config）出现 PAT 即失败，
          # 不把可能带凭据的包上传到云端。
          if grep -rIlF -- "$GH_TOKEN" "$BACKUP_DIR" >/dev/null 2>&1; then
            echo "❌ 备份目录中发现 PAT 明文（疑似落入 .git/config），拒绝打包上传" >&2
            grep -rIlF -- "$GH_TOKEN" "$BACKUP_DIR" | sed 's/^/  - /' >&2 || true
            exit 1
          fi
          
          echo "----------------------------------------"
          echo "正在打包所有备份成功的仓库..."
          src_kb=$(du -sk "$BACKUP_DIR" | awk '{print $1}')
          if [ -z "${src_kb:-}" ] || [ "$src_kb" -le 0 ]; then
            echo "❌ github repos archive preflight: unable to calculate source size" >&2
            exit 1
          fi
          echo "待压缩目录大小: ${src_kb}KB"
          require_free_kb "." $((src_kb + 1024 * 1024)) "github repos archive preflight"
          rm -f "$ARCHIVE_NAME"
          tar -czf "$ARCHIVE_NAME" "$BACKUP_DIR"
          chmod 600 "$ARCHIVE_NAME"
          archive_bytes=$(stat -c%s "$ARCHIVE_NAME")
          if [ -z "${archive_bytes:-}" ] || [ "$archive_bytes" -le 0 ]; then
            echo "❌ github repos archive validation: archive is empty" >&2
            exit 1
          fi
          tar -tzf "$ARCHIVE_NAME" >/dev/null
          archive_human=$(numfmt --to=iec-i --suffix=B "$archive_bytes" 2>/dev/null || echo "${archive_bytes}B")
          {
            echo "GITHUB_REPOS_ARCHIVE_NAME=$ARCHIVE_NAME"
            echo "GITHUB_REPOS_ARCHIVE_BYTES=$archive_bytes"
            echo "GITHUB_REPOS_ARCHIVE_HUMAN=$archive_human"
          } >> "$GITHUB_ENV"
          echo "✅ 压缩包校验通过: ${ARCHIVE_NAME} (${archive_human})"
          
          echo "正在上传到 OneDrive backup/ (覆盖旧备份)..."
          # 💡 修改：直接覆盖 OneDrive backup/ 下的最新备份包
          rclone copy "$ARCHIVE_NAME" "onedrive:backup/" -P --retries 3
          rm -f "$ARCHIVE_NAME"
          
      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 告警档凭据（tier=alert 直达告警 bot @SaberFuckBot，无回落）
          TELEGRAM_BOT_TOKEN_ALERT: ${{ secrets.TELEGRAM_BOT_TOKEN_ALERT }}
          TELEGRAM_CHAT_ID_ALERT: ${{ secrets.TELEGRAM_CHAT_ID_ALERT }}
          STATUS: ${{ job.status }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if { [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; } && { [ -z "$TELEGRAM_BOT_TOKEN_ALERT" ] || [ -z "$TELEGRAM_CHAT_ID_ALERT" ]; } then
            echo "Telegram 凭证未配置，跳过发送通知。"
            exit 0
          fi
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"

          msg=""
          # 状态语义对齐规范 · 状态图标：cancelled=⛔ 中断（区别于 ❌ 失败）
          if [ "$STATUS" == "cancelled" ]; then
            tg_add_title msg "⛔ 任务已中断"
            tg_add_note msg "任务被取消，数据未受影响；如需继续请重新运行。"
            tg_add_footer msg
            send_tg "$msg" alert || echo "::warning::TG 通知发送失败（不影响任务结果）"
            exit 0
          fi
          if [ "$STATUS" == "success" ]; then
            ARCHIVE_NAME="${GITHUB_REPOS_ARCHIVE_NAME:-github_repos_latest.tar.gz}"
            FILE_SIZE_BYTES="${GITHUB_REPOS_ARCHIVE_BYTES:-0}"
            # 大小走真源 format_bytes（规范 · 大小：bash 侧只有一份实现，source 了
            # 真源的通知点直接用它）——numfmt --to=iec-i 输出 "3.4GiB"（无空格、
            # 非三位小数），与全库 "3.400 GiB" 形态漂移
            FILE_SIZE_HUMAN=$(format_bytes "$FILE_SIZE_BYTES")
            if [ "$FILE_SIZE_BYTES" -le 0 ]; then
              _tier="alert"   # ⚠️ 状态异常 = 需人工检查日志
              tg_add_title msg "⚠️ GitHub 全仓库备份状态异常"
              tg_add_kv msg "日期" "$(TZ=Asia/Shanghai date +'%Y-%m-%d')"
              tg_add_path msg "文件" "$ARCHIVE_NAME"
              tg_add_kv msg "文件大小" "$FILE_SIZE_HUMAN"
              tg_add_note msg "备份任务成功但未记录到有效压缩包大小，请检查 GitHub Actions 日志。"
            else
              tg_add_title msg "✅ GitHub 全仓库备份成功"
              tg_add_kv msg "日期" "$(TZ=Asia/Shanghai date +'%Y-%m-%d')"
              tg_add_path msg "文件" "$ARCHIVE_NAME"
              tg_add_kv msg "文件大小" "$FILE_SIZE_HUMAN"
              tg_add_note msg "已覆盖旧包"
            fi
          else
            _tier="alert"     # ❌ 备份失败 = 告警档
            tg_add_title msg "❌ GitHub 全仓库备份失败"
            tg_add_note msg "请前往 GitHub Actions 检查日志详情。"
          fi
          tg_add_footer msg
          send_tg "$msg" "${_tier:-}" || echo "::warning::TG 通知发送失败（不影响任务结果）"
