name: odprobe

# OneDrive 快捷方式(remoteItem) 只读探测
#
# 目的：验证 302 直链方案是否可行——Graph 能否跟随快捷方式、跟随后能否列子目录、
#       目标文件能否返回 @microsoft.graph.downloadUrl（预授权直链）。
#
# 独立存在的理由：emby.yml 用 concurrency: emby-singleton，长驻 run 会长期占用该组，
# 手动触发的 emby run 只能排队等待；探测本身不需要 Emby/OpenList/隧道，
# 单独跑不必打断正在提供服务的 emby run，且几分钟内自己结束，日志可直接拉取。
#
# 只读、不改变任何链路行为。输出已脱敏（仓库公开）。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -1

      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          mkdir -p ~/.config/rclone/
          cat << IN_EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG
          IN_EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: probe onedrive shortcuts
        continue-on-error: true
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/emby302/od_probe.sh"
