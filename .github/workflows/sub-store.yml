name: sub-store

# 自续触发（收尾用 gh workflow run 起下一轮）需要 actions:write，其余只读
permissions:
  contents: read
  actions: write

on:
  schedule:
    # - cron: "0 2,8,14,20 * * *"
    # 兜底触发（自续触发是主接力机制，见收尾「自续触发（下轮接力）」步骤）。
    # 频率取 1h 而非 */5：高频 cron 会被 GitHub 限流（实测 */5 曾 4.5h 零触发），
    # 且每 5 分钟造一个被单例挡掉的排队运行、把 run 列表塞满；交接本身由"队列里
    # pending 运行在上一轮结束瞬间接管"完成——零空档不靠频率。
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      self_retrigger:
        description: "收尾是否自动起下一轮（关掉则本轮结束后静止）"
        type: boolean
        default: true
  watch:
    # types: started

jobs:
  build:
    # 安全守卫（2026-09-08）：公开仓库任何人 star 都会触发 watch 事件——仅放行仓库本人，
    # schedule / workflow_dispatch 等其余触发方式不受影响
    if: github.event_name != 'watch' || github.actor == 'jarvanh'
    concurrency: sub-store-singleton
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: rclone-install
        run: |
          set -e
          # 安装 rclone：GitHub Releases 直下 .deb，失败回退 rclone.org 安装脚本
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          # 写配置 + 持久化：secret 起步 → 掩码 → Dropbox 恢复优先 → 有效性检查 → 同步回 Dropbox
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config
      - name: rclone-run
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo mkdir -p /dropbox /mnt/vfs/dropbox /opt/logs
          sudo chown runner:runner /dropbox /mnt/vfs/dropbox /opt/logs
          # 挂载改用 runner 用户（与 emby.yml 一致）：root 身份挂载时 rclone 刷新 token 会把
          # rclone.conf 回写成 root:600，之后非 root 的 rclone（含下面的 lsf）读取即 EACCES
          # sub-store 容器以 root 挂载 /dropbox/self-hosted/sub-store，非 root 挂载必须开 --allow-other
          grep -q '^user_allow_other' /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf >/dev/null
          # 参数按"配置 / Docker 数据卷"画像：sub-store 的数据目录是小文件随机读写。
          #   --cache-dir        默认 ~/.cache/rclone 会落进根分区（≈14GB），必须指向 /mnt
          #   --attr-timeout 1m  容器内文件频繁增删改，属性缓存 10 分钟有陈旧风险
          #   --poll-interval 0  run 期间远端目录不会自己变，关轮询省 API 配额
          nohup rclone mount dropbox: /dropbox \
            --config /home/runner/.config/rclone/rclone.conf \
            --cache-dir /mnt/vfs/dropbox \
            --allow-other --umask 000 \
            --attr-timeout 1m \
            --dir-cache-time 72h --poll-interval 0 \
            --vfs-cache-mode full \
            --vfs-cache-max-size 2G --vfs-cache-max-age 1h \
            --vfs-cache-min-free-space 2G \
            --vfs-cache-poll-interval 30s \
            --buffer-size 16M \
            --log-file /opt/logs/rclone-dropbox.log --log-level INFO &
          # 等挂载就绪：容器紧接着就要挂 /dropbox/self-hosted/sub-store，没起来会失败
          for i in {1..30}; do
            mount | grep -q " on /dropbox " && break
            sleep 2
          done
          # mkdir -p ~/sub-store
          # rclone copy onedrive:self-hosted/sub-store ~/sub-store
          echo "==========onedrive==========="
          rclone lsf onedrive:
          echo "==========dropbox==========="
          rclone lsf dropbox:
      - name: Check if the tunnel is running
        env:
          TUNNEL_NAME: "sub-store" # cloudflared 隧道名
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          sudo mkdir -p ~/.cloudflared/
          sudo chown -R runner:runner ~/.cloudflared
          # rclone 以 runner 身份运行（与挂载步骤同）：root 运行会在 token 刷新时回写 rclone.conf 属主
          rclone copy dropbox:self-hosted/.cloudflared ~/.cloudflared -vv
          
          cloudflared tunnel list
          # 获取隧道列表
          OUTPUT=$(cloudflared tunnel list)      
          # 查找目标隧道的行
          TUNNEL_LINE=$(echo "$OUTPUT" | grep -w "$TUNNEL_NAME")
          if [ -z "$TUNNEL_LINE" ]; then
            echo "The tunnel '$TUNNEL_NAME' does not exist. Proceeding."
            exit 0
          fi
  
          # 提取 CONNECTIONS 列并检查是否为空
          CONNECTIONS=$(echo "$TUNNEL_LINE" | awk '{if (NF>=4) print $4; else print "-"}')
          if [ "$CONNECTIONS" == "-" ]; then
            echo "The tunnel '$TUNNEL_NAME' exists but has no active connections. Proceeding."
          else
            echo "The tunnel '$TUNNEL_NAME' is running with connections: $CONNECTIONS. Stopping actions."
            exit 0
          fi
      - name: Set up Docker
        uses: docker/setup-buildx-action@v4
      - name: Run sub-store container
        # 后端鉴权路径走 secret：公开仓库绝不写死（2026-09-08 已轮换，旧值作废）
        # CORS 白名单：Sub-Store 自 2026-09-04 起在 Node/Docker 端改为 allowlist，只放行
        # SUB_STORE_CORS_ALLOWED_ORIGINS（不设时为 sub-store.vercel.app / substore.stash），
        # 其余 Origin 一律 403 "CORS origin not allowed"。前端虽与后端同源，浏览器对
        # POST/PUT/DELETE 仍会带 Origin 头，不配就「界面能看、一改订阅就报 403」；
        # GET 不带 Origin 所以读取正常。域名由 VD 拼出，同样不写死。
        env:
          SUB_STORE_FRONTEND_BACKEND_PATH: ${{ secrets.SUB_STORE_FRONTEND_BACKEND_PATH }}
          SUB_STORE_CORS_ALLOWED_ORIGINS: "https://sub-store.${{ secrets.VD }}.eu.org"
        run: docker run -it -d --restart=always -e "SUB_STORE_BACKEND_SYNC_CRON=50 * * * *" -e SUB_STORE_FRONTEND_BACKEND_PATH="$SUB_STORE_FRONTEND_BACKEND_PATH" -e "SUB_STORE_CORS_ALLOWED_ORIGINS=$SUB_STORE_CORS_ALLOWED_ORIGINS" -p 9876:9876 -p 127.0.0.1:3001:3001 -v /dropbox/self-hosted/sub-store:/opt/app/data --name sub-store xream/sub-store:http-meta
      - name: Verify container is running
        run: docker ps    
      - name: run cloudflared
        run: |
          cloudflared tunnel route dns sub-store sub-store.'${{ secrets.VD }}'.eu.org
          if [ -f "$GITHUB_WORKSPACE/.github/scripts/tunnels/tunnels.sh" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/tunnels/tunnels.sh" ensure sub-store || true
          else
            nohup cloudflared tunnel run --url http://127.0.0.1:3001 sub-store &
          fi
      - name: sleep
        run: |
          sleep 350m          
      - name: Stop
        run: |
          docker stop sub-store
          # sleep 1m 
          # rclone sync ~/sub-store onedrive:self-hosted/sub-store
          sleep 1m 
          echo "Stopping GitHub Actions"

      # ===== 自续触发（下轮接力）=====
      # 放在最后一步：数据已回传完才派下一轮，避免下一轮开机时读到半份数据。
      # 三条判据（人工取消不接力 / 已有排队则跳过 / 开关关闭不接力）与统一日志都在
      # .github/scripts/lib/self_retrigger.sh 里，与 emby 同源。
      - name: 自续触发（下轮接力）
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SR_STATUS: ${{ job.status }}
          SR_ENABLED: ${{ github.event.inputs.self_retrigger || 'true' }}
        run: |
          source "$GITHUB_WORKSPACE/.github/scripts/lib/self_retrigger.sh"
          self_retrigger sub-store.yml || true
