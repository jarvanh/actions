name: ph-dl

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      clean_all:
        description: '清理 Telegram 频道所有视频并重置 uploaded_videos.txt'
        type: boolean
        default: false
        required: false
  watch:
    types: started

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: rclone-install
        run: |
          # 安装 rclone
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          cd rclone-*-linux-amd64
          sudo mv rclone /usr/bin
          sudo chmod +x /usr/bin/rclone
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          # 写配置文件
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG
          EOF
      - name: rclone-run
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          mkdir ~/onedrive
          nohup rclone --vfs-cache-mode full mount onedrive: ~/onedrive &
          echo "~/onedrive 文件列表"
          cd ~/onedrive
          ls
      - name: check duplicate videos by ID and dedupe by hash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TARGET_DIR=~/onedrive/0/j-1024j-视频-pornhub-favorites
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory not found: $TARGET_DIR"
            exit 0
          fi
          cd "$TARGET_DIR"
          # 提取文件名中 [...] 内的 ID，统计重复项
          declare -A ID_FILES
          while IFS= read -r file; do
            id=$(echo "$file" | grep -oE '\[[a-f0-9]+\]' | tail -n1)
            [ -n "$id" ] || continue
            if [ -n "${ID_FILES[$id]}" ]; then
              ID_FILES[$id]+=$'\n'"$file"
            else
              ID_FILES[$id]="$file"
            fi
          done < <(find . -maxdepth 1 -type f -name '*.mp4' -print | sed 's|^\./||' | sort)

          DUP_DETAILS=""
          DUP_COUNT=0
          REMOVED_COUNT=0
          DIFFERENT_COUNT=0
          for id in "${!ID_FILES[@]}"; do
            files="${ID_FILES[$id]}"
            count=$(echo "$files" | wc -l)
            if [ "$count" -gt 1 ]; then
              DUP_COUNT=$((DUP_COUNT + 1))
              # 按修改时间从新到旧排序，保留最晚下载的文件作为基准
              sorted_files=$(echo "$files" | xargs -d '\n' ls -t 2>/dev/null)
              kept=$(echo "$sorted_files" | head -n1)
              kept_hash=$(sha1sum "$kept" | cut -d' ' -f1)
              group_details=""
              while IFS= read -r f; do
                [ "$f" = "$kept" ] && continue
                f_hash=$(sha1sum "$f" | cut -d' ' -f1)
                if [ "$f_hash" = "$kept_hash" ]; then
                  # 哈希一致，删除重复文件
                  rm -f "$f"
                  REMOVED_COUNT=$((REMOVED_COUNT + 1))
                  group_details+=$'  🗑 删除 '"${f}"$'（哈希一致 '"${kept_hash:0:12}"$'）\n'
                else
                  # 哈希不同，保留并标记
                  DIFFERENT_COUNT=$((DIFFERENT_COUNT + 1))
                  group_details+=$'  ⚠ 保留 '"${f}"$'（哈希 '"${f_hash:0:12}"$' ≠ '"${kept_hash:0:12}"$'）\n'
                fi
              done <<< "$sorted_files"
              DUP_DETAILS+=$'🔖 ID '"${id}"$'（'"${count}"$' 个，保留: '"${kept}"$'）\n'"${group_details}"
            fi
          done

          # 去重日志输出到 Actions 日志，便于追溯
          echo "=== ph-dl 去重日志 ==="
          echo "重复 ID 数量: ${DUP_COUNT}"
          echo "删除重复文件数量: ${REMOVED_COUNT}"
          echo "哈希不同保留数量: ${DIFFERENT_COUNT}"
          echo "--- 详情 ---"
          echo "${DUP_DETAILS}"

          # 发送通知
          if [ "$DUP_COUNT" -gt 0 ]; then
            MSG="🔍 ph-dl 重复视频检测与去重"$'\n\n'"📁 目录: j-1024j-视频-pornhub-favorites"$'\n'"🔢 重复 ID 数量: ${DUP_COUNT}"$'\n'"🗑 删除重复: ${REMOVED_COUNT}"$'\n'"⚠ 哈希不同保留: ${DIFFERENT_COUNT}"
            if [ "$REMOVED_COUNT" -eq 0 ] && [ "$DIFFERENT_COUNT" -gt 0 ]; then
              MSG+=$'\n'"ℹ 重复文件哈希各不相同，未自动删除"
            fi
            MSG+=$'\n\n'"📋 详情:"$'\n'"${DUP_DETAILS}"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MSG}"
          else
            echo "No duplicate video IDs found."
          fi

      - name: cleanup yt-dlp fragment files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TARGET_DIR=~/onedrive/0/j-1024j-视频-pornhub-favorites
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory not found: $TARGET_DIR"
            exit 0
          fi
          cd "$TARGET_DIR"
          # 查找 yt-dlp 残留的分片文件：*.mp4-Frag* 和 *.part-Frag*
          mapfile -t FRAG_FILES < <(find . -maxdepth 1 -type f \( -name '*.mp4-Frag*' -o -name '*.part-Frag*' \) -print)
          FRAG_COUNT=${#FRAG_FILES[@]}
          if [ "$FRAG_COUNT" -eq 0 ]; then
            echo "No fragment files found."
            exit 0
          fi
          # 收集文件名与大小
          FILE_DETAILS=""
          for f in "${FRAG_FILES[@]}"; do
            fname=$(basename "$f")
            fsize=$(du -h "$f" | cut -f1)
            FILE_DETAILS="${FILE_DETAILS}🗑 ${fname} (${fsize})
          "
          done
          # 清理
          find . -maxdepth 1 -type f \( -name '*.mp4-Frag*' -o -name '*.part-Frag*' \) -delete
          echo "Cleaned up ${FRAG_COUNT} fragment files."
          # 发送通知
          MSG="🧹 ph-dl 清理 yt-dlp 分片文件"$'\n\n'"📁 目录: j-1024j-视频-pornhub-favorites"$'\n'"🗑️ 清理数量: ${FRAG_COUNT}"$'\n\n'"📋 文件列表:"$'\n'"${FILE_DETAILS}"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}"

      - name: clean telegram channel and reset upload archive
        if: github.event.inputs.clean_all == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip3 install telethon
          # 删除 Telegram 频道所有消息
          python3 ${GITHUB_WORKSPACE}/.github/scripts/clean_channel.py "${TELEGRAM_CHANNEL_ID}"
          # 删除 uploaded_videos.txt，下次运行会重新处理所有视频
          SOURCE_REMOTE="onedrive:0/j-1024j-视频-pornhub-favorites"
          rclone delete "$SOURCE_REMOTE/uploaded_videos.txt" 2>/dev/null || true
          echo "Deleted uploaded_videos.txt"
          # 发送通知
          MSG="🧹 ph-dl 频道清理完成"$'\n\n'"📁 已清空 Telegram 频道所有视频"$'\n'"📄 已删除 uploaded_videos.txt（下次运行重新处理全部视频）"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}"

      - name: transcode and send videos to telegram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sudo apt-get install -y ffmpeg
          pip3 install telethon

          SOURCE_REMOTE="onedrive:0/j-1024j-视频-pornhub-favorites"
          TMP_DIR="/tmp/ph-dl-tg"
          mkdir -p "$TMP_DIR"

          # 读取 uploaded_videos.txt（记录已上传的文件名），rclone cat 绕过 mount
          rclone cat "$SOURCE_REMOTE/uploaded_videos.txt" 2>/dev/null > "$TMP_DIR/uploaded_videos.txt" || touch "$TMP_DIR/uploaded_videos.txt"

          # 列出源目录所有视频文件（按修改时间从旧到新排序）
          rclone lsf "$SOURCE_REMOTE/" --files-only --sort-by modtime 2>/dev/null | grep -iE '\.mp4$' > "$TMP_DIR/all_videos.txt" || true
          TOTAL_VIDEOS=$(wc -l < "$TMP_DIR/all_videos.txt")
          echo "源目录视频总数: $TOTAL_VIDEOS"

          # 过滤掉已上传的视频
          grep -Fxvf "$TMP_DIR/uploaded_videos.txt" "$TMP_DIR/all_videos.txt" > "$TMP_DIR/pending.txt" 2>/dev/null || true
          PENDING_COUNT=$(wc -l < "$TMP_DIR/pending.txt" 2>/dev/null || echo 0)
          echo "待上传: $PENDING_COUNT"

          if [ "$PENDING_COUNT" -eq 0 ] || [ ! -s "$TMP_DIR/pending.txt" ]; then
            echo "没有新视频需要上传"
            MSG="📺 ph-dl"$'\n'"📊 源目录: ${TOTAL_VIDEOS} 个视频"$'\n'"✅ 已上传: ${TOTAL_VIDEOS}"$'\n'"⏳ 待上传: 0"$'\n\n'"没有新视频需要上传"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MSG}"
            exit 0
          fi

          # 创建单文件处理脚本，供 xargs -P 并行调用
          cat << 'SCRIPT' > process_one.sh
          #!/bin/bash
          set +e
          file="$1"
          SOURCE_REMOTE="onedrive:0/j-1024j-视频-pornhub-favorites"
          TMP_DIR="/tmp/ph-dl-tg"
          WORK_DIR="$TMP_DIR/$$"
          LOCAL_FILE="$WORK_DIR/$file"
          OUTPUT_FILE="$WORK_DIR/output.mp4"
          UPLOADED_PID="$TMP_DIR/uploaded_$$.txt"
          ARCHIVE_FILE="$HOME/onedrive/0/j-1024j-视频-pornhub-favorites/archive.txt"

          mkdir -p "$WORK_DIR"

          # 从 OneDrive 下载到本地（不修改原文件）
          if ! rclone copy "$SOURCE_REMOTE/$file" "$WORK_DIR/" 2>/dev/null || [ ! -f "$LOCAL_FILE" ]; then
            echo "RESULT|FAILED|rclone copy failed|$file" >&2
            echo "RESULT|FAILED|rclone copy failed|$file"
            rm -rf "$WORK_DIR"
            exit 0
          fi
          dst_size=$(stat -c%s "$LOCAL_FILE" 2>/dev/null || echo 0)

          # 检测编码
          vcodec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$LOCAL_FILE" 2>/dev/null) || vcodec=""
          acodec=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$LOCAL_FILE" 2>/dev/null) || acodec=""
          pix_fmt=$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$LOCAL_FILE" 2>/dev/null) || pix_fmt=""
          width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$LOCAL_FILE" 2>/dev/null) || width=0
          height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$LOCAL_FILE" 2>/dev/null) || height=0

          if [ -z "$vcodec" ]; then
            FFPROBE_ERR=$(ffprobe -v error -show_format -show_streams "$LOCAL_FILE" 2>&1)
            echo "Skip (cannot read codec): $file (size=$dst_size)" >&2
            if echo "$FFPROBE_ERR" | grep -q "moov atom not found"; then
              echo "  → 文件损坏（moov atom 缺失），删除远程文件并从 archive.txt 移除" >&2
              rclone delete "$SOURCE_REMOTE/$file" 2>/dev/null
              id="${file%.*}"
              id="${id##*-}"
              if [ -n "$id" ] && [ -f "$ARCHIVE_FILE" ]; then
                ( flock -x 200; grep -v "^${id}|" "$ARCHIVE_FILE" > "${ARCHIVE_FILE}.tmp" 2>/dev/null && mv "${ARCHIVE_FILE}.tmp" "$ARCHIVE_FILE"; ) 200>"${ARCHIVE_FILE}.lock"
              fi
              echo "RESULT|CORRUPTED||$file"
            else
              echo "RESULT|FAILED|cannot read codec|$file"
            fi
            rm -rf "$WORK_DIR"
            exit 0
          fi

          echo "OK: $file (size=$dst_size, ${width}x${height}, vcodec=$vcodec, acodec=$acodec, pix_fmt=$pix_fmt)" >&2

          # Telegram 流式播放要求：H.264 + AAC + yuv420p + 偶数维度 + faststart
          NEED_REENCODE=0
          REASON=""
          if [ "$vcodec" != "h264" ]; then
            NEED_REENCODE=1; REASON="vcodec=$vcodec"
          elif [ "$acodec" != "aac" ]; then
            NEED_REENCODE=1; REASON="acodec=$acodec"
          elif [ "$pix_fmt" != "yuv420p" ]; then
            NEED_REENCODE=1; REASON="pix_fmt=$pix_fmt"
          elif [ $((width % 2)) -ne 0 ] || [ $((height % 2)) -ne 0 ]; then
            NEED_REENCODE=1; REASON="odd dims ${width}x${height}"
          fi

          # 检测旋转元数据和非标准 SAR：
          # stream copy（-c copy）会原样保留 rotation 和 SAR，Telegram 播放器可能不尊重
          # rotation 导致画面只显示一部分；非标准 SAR 导致画面比例错误。
          # 重编码时 ffmpeg 会自动应用旋转（autorotate）并通过 setsar=1 归一化像素比例。
          if [ "$NEED_REENCODE" -eq 0 ]; then
            side_data=$(ffprobe -v error -select_streams v:0 -show_entries stream=side_data -of csv=p=0 "$LOCAL_FILE" 2>/dev/null)
            if echo "$side_data" | grep -qi 'rotation'; then
              NEED_REENCODE=1; REASON="has rotation (stream copy would preserve it)"
            else
              sar=$(ffprobe -v error -select_streams v:0 -show_entries stream=sample_aspect_ratio -of csv=p=0 "$LOCAL_FILE" 2>/dev/null)
              if [ -n "$sar" ] && [ "$sar" != "1:1" ] && [ "$sar" != "0:1" ]; then
                NEED_REENCODE=1; REASON="sar=$sar (stream copy would preserve it)"
              fi
            fi
          fi

          if [ "$NEED_REENCODE" -eq 1 ]; then
            # 重编码为 Telegram 兼容格式（yuv420p + 偶数维度 + faststart）
            # -map 0:a? 处理无音频流的视频；setsar=1 确保方形像素
            echo "Convert: $file ($REASON → h264/yuv420p/aac)" >&2
            if ffmpeg -y -i "$LOCAL_FILE" -map 0:v:0 -map 0:a? -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2,setsar=1" -c:a aac -movflags +faststart "$OUTPUT_FILE" 2>"$WORK_DIR/ffmpeg.err" && mv "$OUTPUT_FILE" "$LOCAL_FILE" 2>/dev/null; then
              : # 成功
            else
              rm -f "$OUTPUT_FILE"
              ERR=$(tail -3 "$WORK_DIR/ffmpeg.err" 2>/dev/null | tr '\n|' '  ' | cut -c1-200)
              echo "RESULT|FAILED|transcode failed ($REASON): ${ERR}|$file" >&2
              echo "RESULT|FAILED|transcode failed ($REASON): ${ERR}|$file"
              rm -rf "$WORK_DIR"
              exit 0
            fi
          else
            # 已是 H.264+AAC+yuv420p+偶数维度，仅添加 faststart
            echo "Faststart: $file" >&2
            if ffmpeg -y -i "$LOCAL_FILE" -c copy -movflags +faststart "$OUTPUT_FILE" 2>"$WORK_DIR/ffmpeg.err" && mv "$OUTPUT_FILE" "$LOCAL_FILE" 2>/dev/null; then
              : # 成功
            else
              # faststart 失败 → 重编码兜底，不再上传无 faststart 的原文件
              rm -f "$OUTPUT_FILE"
              ERR1=$(tail -3 "$WORK_DIR/ffmpeg.err" 2>/dev/null | tr '\n|' '  ' | cut -c1-200)
              echo "WARN: faststart failed (${ERR1}), re-encoding: $file" >&2
              if ffmpeg -y -i "$LOCAL_FILE" -map 0:v:0 -map 0:a? -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2,setsar=1" -c:a aac -movflags +faststart "$OUTPUT_FILE" 2>"$WORK_DIR/ffmpeg.err" && mv "$OUTPUT_FILE" "$LOCAL_FILE" 2>/dev/null; then
                : # 成功
              else
                rm -f "$OUTPUT_FILE"
                ERR2=$(tail -3 "$WORK_DIR/ffmpeg.err" 2>/dev/null | tr '\n|' '  ' | cut -c1-200)
                echo "RESULT|FAILED|faststart(${ERR1}) + transcode(${ERR2}) both failed|$file" >&2
                echo "RESULT|FAILED|faststart(${ERR1}) + transcode(${ERR2}) both failed|$file"
                rm -rf "$WORK_DIR"
                exit 0
              fi
            fi
          fi

          # 上传到 Telegram 频道（CHANNEL_ID 从环境变量获取）
          FILESIZE_HUMAN=$(du -h "$LOCAL_FILE" | cut -f1)
          if python3 ${GITHUB_WORKSPACE}/.github/scripts/upload_video.py "$LOCAL_FILE" "$CHANNEL_ID" "ph: $file ($FILESIZE_HUMAN)"; then
            echo "$file" >> "$UPLOADED_PID"
            echo "RESULT|SENT||$file" >&2
            echo "RESULT|SENT||$file"
          else
            echo "RESULT|FAILED|telegram upload failed|$file" >&2
            echo "RESULT|FAILED|telegram upload failed|$file"
          fi

          rm -rf "$WORK_DIR"
          SCRIPT
          chmod +x process_one.sh

          # 导出 CHANNEL_ID 供 process_one.sh 使用
          export CHANNEL_ID="${TELEGRAM_CHANNEL_ID}"

          # 并行处理（nproc 个进程同时运行）
          # 使用 -d '\n' 指定换行为分隔符，禁用 xargs 对引号/反斜杠的特殊解释
          RESULTS_FILE="$TMP_DIR/results.txt"
          : > "$RESULTS_FILE"
          xargs -d '\n' -P "$(nproc)" -I {} ./process_one.sh "{}" < "$TMP_DIR/pending.txt" > "$RESULTS_FILE"
          XARGS_EXIT=$?

          # 合并各进程的 uploaded 文件到本地 uploaded_videos.txt
          cat "$TMP_DIR"/uploaded_*.txt >> "$TMP_DIR/uploaded_videos.txt" 2>/dev/null || true

          # 上传更新后的 uploaded_videos.txt 到 OneDrive
          rclone copyto "$TMP_DIR/uploaded_videos.txt" "$SOURCE_REMOTE/uploaded_videos.txt" 2>/dev/null

          # 汇总结果
          SENT=0
          FAILED=0
          CORRUPTED=0
          SENT_LIST=""
          FAILED_LIST=""
          CORRUPTED_LIST=""
          while IFS='|' read -r prefix status detail file; do
            [ "$prefix" = "RESULT" ] || continue
            case "$status" in
              SENT) SENT=$((SENT + 1)); SENT_LIST+="- ${file}"$'\n' ;;
              FAILED) FAILED=$((FAILED + 1)); FAILED_LIST+="- ${file}（${detail}）"$'\n' ;;
              CORRUPTED) CORRUPTED=$((CORRUPTED + 1)); CORRUPTED_LIST+="- ${file}"$'\n' ;;
            esac
          done < "$RESULTS_FILE"

          # xargs 自身失败 → 发送告警并退出
          if [ "$XARGS_EXIT" -ne 0 ]; then
            MSG="❌ ph-dl 处理管道失败（xargs exit=${XARGS_EXIT}）"$'\n\n'"📊 待处理: ${PENDING_COUNT}"$'\n'"✅ 成功: ${SENT}"$'\n'"❌ 失败: ${FAILED}"$'\n\n'"⚠ xargs 可能因文件名特殊字符或脚本错误而中断，请检查 Actions 日志"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MSG}" || true
            exit 1
          fi

          echo "上传完成: 成功 $SENT, 失败 $FAILED, 损坏 $CORRUPTED"

          # 发送通知
          MSG="📺 ph-dl 上传完成"$'\n\n'"📊 总计: ${PENDING_COUNT}"$'\n'"✅ 成功: ${SENT}"$'\n'"❌ 失败: ${FAILED}"
          if [ "$CORRUPTED" -gt 0 ]; then
            MSG+=$'\n'"🗑 损坏已删除: ${CORRUPTED}"
          fi
          if [ -n "$SENT_LIST" ]; then
            MSG+=$'\n\n'"✅ 已上传:"$'\n'"${SENT_LIST}"
          fi
          if [ -n "$FAILED_LIST" ]; then
            MSG+=$'\n\n'"❌ 失败:"$'\n'"${FAILED_LIST}"
          fi
          if [ -n "$CORRUPTED_LIST" ]; then
            MSG+=$'\n\n'"🗑 损坏已删除（下次运行将重新下载）:"$'\n'"${CORRUPTED_LIST}"
          fi
          MSG+=$'\n\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}"

          rm -rf "$TMP_DIR"

      - name: run ph-dl favorites
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
        run: |
          sudo apt-get update
          sudo apt-get install python3 -y
          sudo apt-get install ffmpeg -y
          pip3 install --upgrade yt-dlp telethon
          cd ~
          cd ~/onedrive/0/j-1024j-视频-pornhub-favorites
          echo "favorites文件列表"
          ls
          echo "favorites文件夹 下载前大小"
          BEFORE_SIZE=$(du -sh . | cut -f1)
          echo "$BEFORE_SIZE"
          
