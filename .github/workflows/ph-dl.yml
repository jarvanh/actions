name: ph-dl

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      clean_tg_uploaded_videos:
        description: '清空 Telegram 频道所有消息并删除 uploaded_videos.txt，会重新上传全部视频到 Telegram 频道'
        type: boolean
        default: false
        required: false
      auto_delete_duplicates:
        description: '删除重复视频：1、ID+标题相同→保留最大/最新 2、标题不同但哈希一致→删除旧文件 3、标题不同且哈希不同的仍仅通知 4、关闭时全部仅标记"待删除"不删除'
        type: boolean
        default: false
        required: false
      dedupe_by_id_only:
        description: '仅按 ID 删除重复视频，跳过标题和哈希校验：同 ID 视为重复，直接删除较小/较旧文件，保留最大/最新。无论 auto_delete_duplicates 是否开启都会执行删除。注意：可能误删标题不同但碰巧同 ID 的视频'
        type: boolean
        default: false
        required: false
  watch:
    types: started

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # OneDrive 远程路径：rclone 配置中的远端 + 路径
      SOURCE_REMOTE: "onedrive:0/j-1024j-视频-pornhub-favorites"
      # SOURCE_REMOTE: "onedrive:3/1024j-视频-pornhub-channel"
      # SOURCE_REMOTE: "onedrive:4/1024j-视频-pornhub-channel"
      # SOURCE_REMOTE: "onedrive:5/1024j-视频-pornhub-channel"
    steps:
      - uses: actions/checkout@v3

      # ============ 环境准备：rclone 安装与挂载 ============
      - name: rclone-install
        run: |
          # 安装 rclone 命令行工具
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          cd rclone-*-linux-amd64
          sudo mv rclone /usr/bin
          sudo chmod +x /usr/bin/rclone
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          # 写入 rclone 配置文件（来自 GitHub secrets）
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG
          EOF
      - name: rclone-run
        run: |
          # 挂载 OneDrive 到本地目录（后台运行，vfs 全量缓存模式）
          sudo apt-get update
          sudo apt-get install -y fuse3
          mkdir ~/onedrive
          nohup rclone --vfs-cache-mode full mount onedrive: ~/onedrive &
          echo "~/onedrive 文件列表"
          cd ~/onedrive
          ls

      # ============ 步骤1：清理 yt-dlp 残留文件 ============
      - name: cleanup yt-dlp residual files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/cleanup_ytdlp_residual.sh"

      # ============ 步骤2：检测并去重重复视频 ============
      - name: check duplicate videos by ID and dedupe by hash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_DELETE: ${{ github.event.inputs.auto_delete_duplicates == 'true' }}
          DEDUPE_BY_ID_ONLY: ${{ github.event.inputs.dedupe_by_id_only == 'true' }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/dedupe_ph_videos.sh"

      # ============ 步骤3：清空 Telegram 频道并重置上传记录 ============
      - name: clean telegram channel and reset upload archive
        if: github.event.inputs.clean_tg_uploaded_videos == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/reset_tg_channel.sh" \
            "${TELEGRAM_CHANNEL_ID}" \
            "ph-dl"

      # ============ 步骤4：将 OneDrive 中尚未上传的视频补传到 Telegram 频道 ============
      - name: transcode and send videos to telegram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          sudo apt-get install -y ffmpeg
          pip3 install telethon
          bash "${GITHUB_WORKSPACE}/.github/scripts/sync_to_tg.sh" \
            "$SOURCE_REMOTE" \
            "${TELEGRAM_CHANNEL_ID}" \
            "ph"

      # ============ 步骤5：yt-dlp 下载新增收藏并处理上传 ============
      - name: run ph-dl favorites
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
        run: |
          sudo apt-get update
          sudo apt-get install python3 -y
          sudo apt-get install ffmpeg -y
          pip3 install --upgrade yt-dlp telethon
          cd ~/onedrive/0/j-1024j-视频-pornhub-favorites
          echo "favorites 文件列表"
          ls
          echo "favorites 文件夹 下载前大小"
          BEFORE_SIZE=$(du -sh . | cut -f1)
          echo "$BEFORE_SIZE"

          # 下载到临时目录，验证完整性后再上传到 OneDrive
          DOWNLOAD_TMP="/tmp/ph-dl-downloads"
          mkdir -p "$DOWNLOAD_TMP"

          BEFORE_COUNT=$(wc -l < archive.txt 2>/dev/null || echo 0)

          # 迁移 archive.txt 到新格式（id|filename|url），兼容旧格式（Pornhub id）
          if [ -f archive.txt ]; then
            awk -F'|' '{
              if (NF >= 2) { print }                              # 新格式: id|filename|url
              else if ($1 ~ /^[Pp]ornhub[[:space:]].+/) {         # 旧格式: Pornhub ph5fdf9f06b965d
                id=$1; sub(/^[Pp]ornhub[[:space:]]+/, "", id); print id "||"
              } else if ($1 != "") { print $1 "||" }              # 仅 ID
            }' archive.txt > archive.txt.migrated
            mv archive.txt.migrated archive.txt
          fi
          # 生成 yt-dlp 用的临时 archive（格式: Pornhub id），process_ph_download.sh 写入真正的 archive.txt
          YT_DLP_ARCHIVE="/tmp/yt-dlp-archive.txt"
          grep -v '^$' archive.txt 2>/dev/null | while IFS='|' read -r id _ _; do
            [ -n "$id" ] && echo "Pornhub $id"
          done > "$YT_DLP_ARCHIVE"

          # 优先选择 H.264+AAC 流并合并为 MP4。仅 remux（不重编码），避免 ffmpeg 转码被中断导致 moov atom 缺失。
          # 下载到临时目录，process_ph_download.sh 验证完整性后写入 archive.txt（id|filename|url）并上传到 OneDrive。
          yt-dlp -f "bestvideo[vcodec^=avc1]+bestaudio[acodec^=mp4a]/best[ext=mp4]/best" \
            --merge-output-format mp4 --remux-video mp4 --force-overwrites \
            --download-archive "$YT_DLP_ARCHIVE" --playlist-end 50 \
            -o "$DOWNLOAD_TMP/%(title)s-%(id)s.%(ext)s" \
            --exec "bash ${GITHUB_WORKSPACE}/.github/scripts/process_ph_download.sh {} %(webpage_url)q" \
            -i "https://www.pornhub.com/users/${{ secrets.PORNHUBNAME }}/videos/favorites" || echo "url不存在"
          rm -f "$YT_DLP_ARCHIVE"

          # 损坏文件通知（process_ph_download.sh 验证失败并丢弃的文件）
          if [ -f "$DOWNLOAD_TMP/corrupted.txt" ]; then
            source "${GITHUB_WORKSPACE}/.github/scripts/tg_notify.sh"
            CORRUPTED_COUNT=$(wc -l < "$DOWNLOAD_TMP/corrupted.txt")
            CORRUPTED_LIST=$(cat "$DOWNLOAD_TMP/corrupted.txt")
            HEADER="🗑 ph-dl 下载阶段损坏视频"$'\n'"━━━━━━━━━━━━━━━━━━"$'\n'$'\n'"📊 数量: ${CORRUPTED_COUNT}"
            send_tg "$HEADER"
            send_tg_chunked "📋 文件列表"$'\n'"━━━━━━━━━━━━━━━━━━"$'\n\n'"${CORRUPTED_LIST}"
            send_tg "🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          rm -rf "$DOWNLOAD_TMP"

          AFTER_COUNT=$(wc -l < archive.txt 2>/dev/null || echo 0)
          DOWNLOAD_COUNT=$((AFTER_COUNT - BEFORE_COUNT))
          if [ "$DOWNLOAD_COUNT" -lt 0 ]; then
            DOWNLOAD_COUNT=0
          fi
          echo "本次新增下载数量: ${DOWNLOAD_COUNT}"
          echo "favorites 文件夹 下载后大小"
          AFTER_SIZE=$(du -sh . | cut -f1)
          echo "$AFTER_SIZE"

          if [ -f new_downloads_list.txt ]; then
            FILE_LIST=$(cat new_downloads_list.txt)
          else
            FILE_LIST="无"
          fi

          source "${GITHUB_WORKSPACE}/.github/scripts/tg_notify.sh"
          HEADER="✅ ph-dl 下载任务完成"$'\n'"━━━━━━━━━━━━━━━━━━"$'\n'$'\n'"📊 本次下载: ${DOWNLOAD_COUNT} 个视频"$'\n'"💾 下载前: ${BEFORE_SIZE}"$'\n'"💾 下载后: ${AFTER_SIZE}"
          send_tg "$HEADER"
          if [ "$FILE_LIST" != "无" ]; then
            send_tg_chunked "📋 文件列表"$'\n'"━━━━━━━━━━━━━━━━━━"$'\n\n'"${FILE_LIST}"
          fi
          send_tg "🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
