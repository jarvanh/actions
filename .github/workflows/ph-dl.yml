name: ph-dl

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  watch:
    types: started

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: rclone-install
        run: |
          # 安装 rclone
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          cd rclone-*-linux-amd64
          sudo mv rclone /usr/bin
          sudo chmod +x /usr/bin/rclone
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          # 写配置文件
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG
          EOF
      - name: rclone-run
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          mkdir ~/onedrive
          nohup rclone --vfs-cache-mode full mount onedrive: ~/onedrive &
          echo "~/onedrive 文件列表"
          cd ~/onedrive
          ls
      - name: check duplicate videos by ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TARGET_DIR=~/onedrive/0/j-1024j-视频-pornhub-favorites
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory not found: $TARGET_DIR"
            exit 0
          fi
          cd "$TARGET_DIR"
          # 提取文件名中 [...] 内的 ID，统计重复项
          declare -A ID_FILES
          while IFS= read -r file; do
            id=$(echo "$file" | grep -oE '\[[a-f0-9]+\]' | tail -n1)
            [ -n "$id" ] || continue
            if [ -n "${ID_FILES[$id]}" ]; then
              ID_FILES[$id]+=$'\n'"$file"
            else
              ID_FILES[$id]="$file"
            fi
          done < <(find . -maxdepth 1 -type f -name '*.mp4' -print | sed 's|^\./||' | sort)

          DUP_DETAILS=""
          DUP_COUNT=0
          for id in "${!ID_FILES[@]}"; do
            files="${ID_FILES[$id]}"
            count=$(echo "$files" | wc -l)
            if [ "$count" -gt 1 ]; then
              DUP_COUNT=$((DUP_COUNT + 1))
              DUP_DETAILS+="ID ${id} (${count} 个):"$'\n'"${files}"$'\n\n'"
            fi
          done

          if [ "$DUP_COUNT" -gt 0 ]; then
            MSG="ph-dl 发现重复视频（按文件名中的 ID）"$'\n'"目录: j-1024j-视频-pornhub-favorites"$'\n'"重复 ID 数量: ${DUP_COUNT}"$'\n\n'"${DUP_DETAILS}"$'\n'"任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MSG}"
          else
            echo "No duplicate video IDs found."
          fi

      - name: cleanup yt-dlp fragment files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TARGET_DIR=~/onedrive/0/j-1024j-视频-pornhub-favorites
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory not found: $TARGET_DIR"
            exit 0
          fi
          cd "$TARGET_DIR"
          # 查找 yt-dlp 残留的分片文件：*.mp4-Frag* 和 *.part-Frag*
          mapfile -t FRAG_FILES < <(find . -maxdepth 1 -type f \( -name '*.mp4-Frag*' -o -name '*.part-Frag*' \) -print)
          FRAG_COUNT=${#FRAG_FILES[@]}
          if [ "$FRAG_COUNT" -eq 0 ]; then
            echo "No fragment files found."
            exit 0
          fi
          # 收集文件名与大小
          FILE_DETAILS=""
          for f in "${FRAG_FILES[@]}"; do
            fname=$(basename "$f")
            fsize=$(du -h "$f" | cut -f1)
            FILE_DETAILS="${FILE_DETAILS}- ${fname} (${fsize})
          "
          done
          # 清理
          find . -maxdepth 1 -type f \( -name '*.mp4-Frag*' -o -name '*.part-Frag*' \) -delete
          echo "Cleaned up ${FRAG_COUNT} fragment files."
          # 发送通知
          MSG="ph-dl 清理 yt-dlp 分片文件"$'\n'"目录: j-1024j-视频-pornhub-favorites"$'\n'"清理数量: ${FRAG_COUNT}"$'\n'"文件列表:"$'\n'"${FILE_DETAILS}"$'\n'"任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}"

      - name: temp send old videos to telegram channel
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip3 install telethon
          cd ~/onedrive/0/j-1024j-视频-pornhub-favorites 2>/dev/null || exit 0
          ARCHIVE_FILE="uploaded_old_videos.txt"
          touch "$ARCHIVE_FILE"
          FAILED_FILES=""
          TOTAL=0
          SKIPPED=0
          SUCCESS=0
          FAILED=0
          # 按文件更新时间从旧到新排序上传（使用进程替换以便 while 循环内变量可持久化）
          while IFS= read -r file; do
            [ -e "$file" ] || continue
            TOTAL=$((TOTAL + 1))
            # 跳过已成功上传的文件
            if grep -Fxq "$file" "$ARCHIVE_FILE" 2>/dev/null; then
              echo "Skip (already uploaded): $file"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            FILESIZE_HUMAN=$(du -h "$file" | cut -f1)
            if python3 ${GITHUB_WORKSPACE}/.github/scripts/upload_video.py "$file" "${TELEGRAM_CHANNEL_ID}" "Old video: ${file} (${FILESIZE_HUMAN})"; then
              echo "$file" >> "$ARCHIVE_FILE"
              SUCCESS=$((SUCCESS + 1))
            else
              FAILED=$((FAILED + 1))
              FAILED_FILES="${FAILED_FILES}- ${file} (${FILESIZE_HUMAN})
          "
            fi
            sleep 5 # 防止触发速率限制
          done < <(ls -tr *.mp4 2>/dev/null)

          echo "总计: ${TOTAL}，跳过: ${SKIPPED}，成功: ${SUCCESS}，失败: ${FAILED}"

          # 失败汇总通知
          if [ "$FAILED" -gt 0 ]; then
            MSG="ph-dl 旧视频上传失败汇总"$'\n'"总计: ${TOTAL}，跳过: ${SKIPPED}，成功: ${SUCCESS}，失败: ${FAILED}"$'\n'"失败文件:"$'\n'"${FAILED_FILES}"$'\n'"任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MSG}"
          fi

      - name: run ph-dl favorites
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
        run: |
          sudo apt-get update
          sudo apt-get install python3 -y
          sudo apt-get install ffmpeg -y
          pip3 install --upgrade yt-dlp telethon
          cd ~
          cd ~/onedrive/0/j-1024j-视频-pornhub-favorites
          echo "favorites文件列表"
          ls
          echo "favorites文件夹 下载前大小"
          BEFORE_SIZE=$(du -sh . | cut -f1)
          echo "$BEFORE_SIZE"
          
          # 创建处理脚本供 yt-dlp 调用
          cat << 'EOF' > post_process.sh
          #!/bin/bash
          FILEPATH="$1"
          URL="$2"
          FILENAME=$(basename "$FILEPATH")
          FILESIZE_HUMAN=$(du -h "$FILEPATH" | cut -f1)
          
          echo "- ${FILENAME} (${FILESIZE_HUMAN}) [链接](${URL})" >> new_downloads_list.txt
          
          python3 ${GITHUB_WORKSPACE}/.github/scripts/upload_video.py "${FILEPATH}" "${TELEGRAM_CHANNEL_ID}" "Downloaded: ${FILENAME} (${FILESIZE_HUMAN})"
          EOF
          chmod +x post_process.sh
          
          BEFORE_COUNT=$(wc -l < archive.txt 2>/dev/null || echo 0)
          
          yt-dlp -f bestvideo+bestaudio/best --force-overwrites --no-part --download-archive archive.txt --playlist-end 50 --exec "./post_process.sh {} %(webpage_url)q" -i https://www.pornhub.com/users/'${{ secrets. PORNHUBNAME }}'/videos/favorites || echo "url不存在"
          
          AFTER_COUNT=$(wc -l < archive.txt 2>/dev/null || echo 0)
          DOWNLOAD_COUNT=$((AFTER_COUNT - BEFORE_COUNT))
          if [ "$DOWNLOAD_COUNT" -lt 0 ]; then
            DOWNLOAD_COUNT=0
          fi
          echo "本次新增下载数量: ${DOWNLOAD_COUNT}"
          echo "favorites文件夹 下载后大小"
          AFTER_SIZE=$(du -sh . | cut -f1)
          echo "$AFTER_SIZE"
          
          if [ -f new_downloads_list.txt ]; then
            FILE_LIST=$(cat new_downloads_list.txt)
          else
            FILE_LIST="无"
          fi
          
          MSG="github p站下载任务执行完毕 favorites
          本次下载: ${DOWNLOAD_COUNT} 个视频
          下载前大小: ${BEFORE_SIZE}
          下载后大小: ${AFTER_SIZE}
          任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          文件列表:
          ${FILE_LIST}"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="${MSG}"
