name: ph-dl

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      clean_tg_uploaded_videos:
        description: '清理 Telegram 频道所有视频并重置 uploaded_videos.txt'
        type: boolean
        default: false
        required: false
      auto_delete_duplicates:
        description: '自动删除重复视频（默认仅通知不删除）'
        type: boolean
        default: false
        required: false
      auto_delete_corrupted:
        description: '自动删除无效视频（默认仅通知不删除）'
        type: boolean
        default: false
        required: false
  watch:
    types: started

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: rclone-install
        run: |
          # 安装 rclone
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          cd rclone-*-linux-amd64
          sudo mv rclone /usr/bin
          sudo chmod +x /usr/bin/rclone
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          # 写配置文件
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG
          EOF
      - name: rclone-run
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          mkdir ~/onedrive
          nohup rclone --vfs-cache-mode full mount onedrive: ~/onedrive &
          echo "~/onedrive 文件列表"
          cd ~/onedrive
          ls
      - name: check duplicate videos by ID and dedupe by hash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_DELETE: ${{ github.event.inputs.auto_delete_duplicates == 'true' }}
        run: |
          SOURCE_REMOTE="onedrive:0/j-1024j-视频-pornhub-favorites"
          # rclone lsf 列出文件（time;size;path），path 放最后，文件名含 ; 时最后一个字段获取剩余全部，安全
          rclone lsf "$SOURCE_REMOTE/" --files-only --format "tsp" 2>/dev/null \
            | grep -iE '\.mp4$' > /tmp/videos_tsp.txt || true
          TOTAL=$(wc -l < /tmp/videos_tsp.txt)
          echo "📊 数据采集: $TOTAL 个 mp4 文件"
          if [ "$TOTAL" -eq 0 ]; then
            echo "No mp4 files found in $SOURCE_REMOTE"
            exit 0
          fi

          # 按 ID 分组，entry 格式: time;size;path（path 在最后，含 ; 安全）
          declare -A ID_ENTRIES
          while IFS=';' read -r time size path; do
            [ -z "$path" ] && continue
            id=$(echo "$path" | grep -oE 'ph[a-f0-9]+' | tail -n1)
            [ -n "$id" ] || continue
            entry="${time};${size};${path}"
            if [ -n "${ID_ENTRIES[$id]}" ]; then
              ID_ENTRIES[$id]+=$'\n'"${entry}"
            else
              ID_ENTRIES[$id]="${entry}"
            fi
          done < /tmp/videos_tsp.txt

          # 计算规范化标题：去扩展名 + 去掉所有位置的 ph ID + 方括号 + 压缩分隔符并 trim + NFC 归一化
          # NFC 归一化解决 OneDrive/macOS(NFD) 与其他系统(NFC) 对同一字符（如 й）编码不同导致的误判
          get_title() {
            local p="$1"
            local base="${p%.*}"
            echo "$base" \
              | sed -E 's/ph[a-f0-9]{6,}//g' \
              | sed -E 's/[][]//g' \
              | sed -E 's/[-_ ]+/ /g' \
              | sed -E 's/^ //; s/ $//' \
              | python3 -c "import sys,unicodedata; print(unicodedata.normalize('NFC', sys.stdin.read().rstrip('\n')))"
          }

          # 预统计重复 ID 组数量（出现 >1 次的 ID）
          DUP_TOTAL=0
          for i in "${!ID_ENTRIES[@]}"; do
            c=$(echo "${ID_ENTRIES[$i]}" | wc -l)
            [ "$c" -gt 1 ] && DUP_TOTAL=$((DUP_TOTAL + 1))
          done
          echo "🔍 发现 $DUP_TOTAL 个重复 ID 组，开始处理..."

          DUP_DETAILS=""
          DUP_COUNT=0
          REMOVED_COUNT=0
          NOTIFY_ONLY_COUNT=0
          IDX=0
          for id in "${!ID_ENTRIES[@]}"; do
            entries="${ID_ENTRIES[$id]}"
            count=$(echo "$entries" | wc -l)
            if [ "$count" -le 1 ]; then
              continue
            fi
            IDX=$((IDX + 1))
            DUP_COUNT=$((DUP_COUNT + 1))
            echo "[$IDX/$DUP_TOTAL] 处理 ID $id（$count 个文件）"

            # 判断所有文件的 title 是否完全相同
            title_count=$(while IFS=';' read -r t s p; do
              [ -z "$p" ] && continue
              get_title "$p"
            done <<< "$entries" | sort -u | wc -l)

            if [ "$title_count" -eq 1 ]; then
              # 规则1：ID 和 title 都相同 → 优先删除文件小的，其次删除修改时间旧的
              # 排序：size 升序（小的先删），size 相同则 time 旧者优先删；保留最后一个（最大/最新）
              sorted=$(echo "$entries" | sort -t';' -k2,2n -k1,1)
              kept_path=$(echo "$sorted" | tail -n1 | cut -d';' -f3-)
              group_details=""
              while IFS=';' read -r t s p; do
                [ "$p" = "$kept_path" ] && continue
                [ -z "$p" ] && continue
                if [ "$AUTO_DELETE" = "true" ]; then
                  if rclone deletefile "$SOURCE_REMOTE/$p" 2>/tmp/rclone_err.log; then
                    REMOVED_COUNT=$((REMOVED_COUNT + 1))
                    group_details+=$'  🗑 删除 '"${p}"$'（'"${s}"$' 字节，'"${t}"$'）\n'
                  else
                    group_details+=$'  ❌ 删除失败 '"${p}"$'\n'
                    echo "  ❌ 删除失败: $(tail -n 3 /tmp/rclone_err.log)"
                  fi
                else
                  group_details+=$'  ⚠ 待删除（已跳过） '"${p}"$'（'"${s}"$' 字节，'"${t}"$'）\n'
                fi
              done <<< "$sorted"
              DUP_DETAILS+=$'🔖 ID '"${id}"$'（'"${count}"$' 个，标题相同，保留: '"${kept_path}"$'）\n'"${group_details}"
            else
              # 规则2：title 不同 → 对比哈希
              # 打印各文件规范化 title，便于排查为何被判不同（如不可见字符）
              echo "  ⚠ 标题不同，需哈希确认："
              while IFS=';' read -r t s p; do
                [ -z "$p" ] && continue
                printf '    title=[%s] file=%s\n' "$(get_title "$p")" "$p"
              done <<< "$entries"
              # 计算每个文件哈希，写入: hash;time;size;path
              HASH_LIST="/tmp/hash_list_${id}.txt"
              > "$HASH_LIST"
              HCOUNT=0
              while IFS=';' read -r t s p; do
                [ -z "$p" ] && continue
                HCOUNT=$((HCOUNT + 1))
                echo "  计算哈希 [$HCOUNT/$count]: $p"
                hash=$(rclone hashsum sha1 "$SOURCE_REMOTE/$p" 2>/dev/null | awk '{print $1}')
                echo "${hash};${t};${s};${p}" >> "$HASH_LIST"
              done <<< "$entries"
              # 找出重复哈希（出现 >1 次的哈希）
              DUP_HASHES=$(awk -F';' '{print $1}' "$HASH_LIST" | sort | uniq -d)
              group_details=""
              if [ -n "$DUP_HASHES" ]; then
                # 哈希一致的组：每组删除修改时间旧的，保留最新
                while IFS= read -r hash; do
                  [ -z "$hash" ] && continue
                  hsorted=$(grep "^${hash};" "$HASH_LIST" | sort -t';' -k2)
                  hkept_path=$(echo "$hsorted" | tail -n1 | cut -d';' -f4-)
                  while IFS=';' read -r h t s p; do
                    [ "$p" = "$hkept_path" ] && continue
                    [ -z "$p" ] && continue
                    if [ "$AUTO_DELETE" = "true" ]; then
                      if rclone deletefile "$SOURCE_REMOTE/$p" 2>/tmp/rclone_err.log; then
                        REMOVED_COUNT=$((REMOVED_COUNT + 1))
                        group_details+=$'  🗑 删除 '"${p}"$'（哈希一致 '"${hash:0:12}"$'，旧文件）\n'
                      else
                        group_details+=$'  ❌ 删除失败 '"${p}"$'\n'
                        echo "  ❌ 删除失败: $(tail -n 3 /tmp/rclone_err.log)"
                      fi
                    else
                      group_details+=$'  ⚠ 待删除（已跳过） '"${p}"$'（哈希一致 '"${hash:0:12}"$'，旧文件）\n'
                    fi
                  done <<< "$hsorted"
                done <<< "$DUP_HASHES"
                DUP_DETAILS+=$'🔖 ID '"${id}"$'（'"${count}"$' 个，标题不同，删除哈希一致的旧文件）\n'"${group_details}"
              else
                # 所有哈希各不相同 → 仅通知不删除
                NOTIFY_ONLY_COUNT=$((NOTIFY_ONLY_COUNT + 1))
                while IFS=';' read -r h t s p; do
                  group_details+=$'  ⚠ 保留 '"${p}"$'（哈希 '"${h:0:12}"$'）\n'
                done < "$HASH_LIST"
                DUP_DETAILS+=$'🔖 ID '"${id}"$'（'"${count}"$' 个，标题不同且哈希各不相同，仅通知）\n'"${group_details}"
              fi
              rm -f "$HASH_LIST"
            fi
          done

          # 去重日志输出到 Actions 日志，便于追溯
          echo "=== ph-dl 去重日志 ==="
          echo "重复 ID 数量: ${DUP_COUNT}"
          echo "删除重复文件数量: ${REMOVED_COUNT}"
          echo "仅通知未删除数量: ${NOTIFY_ONLY_COUNT}"
          echo "--- 详情 ---"
          echo "${DUP_DETAILS}"

          # 发送通知（按 4000 字符分片，避免超过 Telegram 4096 字符限制）
          source "${GITHUB_WORKSPACE}/.github/scripts/tg_notify.sh"

          if [ "$DUP_COUNT" -gt 0 ]; then
            HEADER="🔍 ph-dl 重复视频检测与去重"$'\n\n'"📁 目录: j-1024j-视频-pornhub-favorites"$'\n'"🔢 重复 ID 数量: ${DUP_COUNT}"$'\n'"🗑 删除重复: ${REMOVED_COUNT}"$'\n'"⚠ 仅通知未删除: ${NOTIFY_ONLY_COUNT}"
            if [ "$AUTO_DELETE" = "true" ]; then
              HEADER+=$'\n'"⚙️ 模式: 自动删除已开启"
            else
              HEADER+=$'\n'"⚙️ 模式: 仅通知未删除（手动触发可开启 auto_delete_duplicates）"
            fi
            if [ "$REMOVED_COUNT" -eq 0 ] && [ "$NOTIFY_ONLY_COUNT" -gt 0 ]; then
              HEADER+=$'\n'"ℹ 重复文件标题不同且哈希各不相同，未自动删除"
            fi
            send_tg "$HEADER"
            if [ -n "$DUP_DETAILS" ]; then
              send_tg_chunked "📋 详情:"$'\n\n'"${DUP_DETAILS}"
            fi
            send_tg "🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "No duplicate video IDs found."
          fi

      - name: check corrupted videos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_DELETE: ${{ github.event.inputs.auto_delete_corrupted == 'true' }}
        run: |
          sudo apt-get install -y ffmpeg
          SOURCE_REMOTE="onedrive:0/j-1024j-视频-pornhub-favorites"
          mapfile -t ALL_FILES < <(rclone lsf "$SOURCE_REMOTE/" --files-only 2>/dev/null | grep -iE '\.mp4$')
          TOTAL=${#ALL_FILES[@]}
          if [ "$TOTAL" -eq 0 ]; then
            echo "No mp4 files found in $SOURCE_REMOTE"
            exit 0
          fi

          echo "📊 共 $TOTAL 个 mp4 文件，开始并行检测（8 并发）..."

          # 启动 minimal-cache 只读 mount：ffprobe 可 seek 查找 moov atom
          # 仅通过 range request 下载所需字节范围（1-2MB），无需从头流式传输整个文件
          mkdir -p /tmp/od-fast
          nohup rclone --vfs-cache-mode minimal --read-only \
            --attr-timeout 30s --dir-cache-time 30s mount onedrive: /tmp/od-fast >/dev/null 2>&1 &
          MOUNT_PID=$!
          for i in $(seq 1 15); do
            ls /tmp/od-fast/ >/dev/null 2>&1 && break
            sleep 1
          done
          FAST_DIR="/tmp/od-fast/0/j-1024j-视频-pornhub-favorites"
          if [ ! -d "$FAST_DIR" ]; then
            echo "❌ minimal-cache mount 启动失败，回退到 rclone cat 模式"
            kill $MOUNT_PID 2>/dev/null || true
            FAST_DIR=""
          fi

          # 检测脚本（文件名作为参数传入，避免特殊字符问题；进度输出到 stderr）
          cat > /tmp/check_corrupted.sh << 'SCRIPT'
#!/bin/bash
SOURCE_REMOTE="$1"
FILE="$2"
TOTAL="$3"
FAST_DIR="$4"
PROGRESS_FILE="/tmp/check_progress"

# 原子计数器 + 进度输出到 stderr（不干扰 stdout 结果收集）
{
  flock 9
  CUR=$(cat "$PROGRESS_FILE" 2>/dev/null || echo 0)
  CUR=$((CUR + 1))
  echo $CUR > "$PROGRESS_FILE"
  echo "[$CUR/$TOTAL] 检测: $FILE" >&2
} 9>"${PROGRESS_FILE}.lock"

if [ -n "$FAST_DIR" ]; then
  # 模式1: minimal-cache mount，ffprobe 可 seek，仅下载 moov atom 所在字节范围
  if ! timeout 30 ffprobe -v error -select_streams v:0 -show_entries stream=codec_name \
       -of csv=p=0 "${FAST_DIR}/${FILE}" 2>/dev/null | grep -q .; then
    echo "$FILE"
  fi
else
  # 模式2（回退）: rclone cat 流式传输，head 限制 10MB 下载量
  if ! rclone cat "$SOURCE_REMOTE/$FILE" 2>/dev/null | head -c 10485760 | \
       timeout 30 ffprobe -probesize 10485760 -analyzeduration 2000000 -v error \
       -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 - 2>/dev/null | grep -q .; then
    echo "$FILE"
  fi
fi
SCRIPT
          chmod +x /tmp/check_corrupted.sh

          echo 0 > /tmp/check_progress

          # 并行检测（8 并发），stdout 仅输出 corrupted 文件名
          CORRUPTED_LIST=$(printf '%s\n' "${ALL_FILES[@]}" \
            | xargs -P 8 -I {} /tmp/check_corrupted.sh "$SOURCE_REMOTE" {} "$TOTAL" "$FAST_DIR")

          # 清理 minimal-cache mount
          if [ -n "$FAST_DIR" ]; then
            sudo fusermount -uz /tmp/od-fast 2>/dev/null || true
            kill $MOUNT_PID 2>/dev/null || true
          fi

          CORRUPTED_COUNT=0
          if [ -n "$CORRUPTED_LIST" ]; then
            CORRUPTED_COUNT=$(echo "$CORRUPTED_LIST" | wc -l)
          fi

          echo "=== 无效视频检测日志 ==="
          echo "检测总数: ${TOTAL}"
          echo "无效视频: ${CORRUPTED_COUNT}"

          if [ "$CORRUPTED_COUNT" -gt 0 ]; then
            if [ "$AUTO_DELETE" = "true" ]; then
              echo "$CORRUPTED_LIST" | while IFS= read -r file; do
                [ -z "$file" ] && continue
                if rclone deletefile "$SOURCE_REMOTE/$file" 2>/tmp/rclone_err.log; then
                  echo "  🗑 已删除: $file"
                else
                  echo "  ❌ 删除失败: $file: $(tail -n 3 /tmp/rclone_err.log)"
                fi
              done
            else
              echo "$CORRUPTED_LIST" | while IFS= read -r file; do
                echo "  ⚠ 可能无效: $file"
              done
            fi

            source "${GITHUB_WORKSPACE}/.github/scripts/tg_notify.sh"
            HEADER="🗑 ph-dl 无效视频检测"$'\n\n'"📁 目录: j-1024j-视频-pornhub-favorites"$'\n'"📊 检测总数: ${TOTAL}"$'\n'"⚠ 无效视频: ${CORRUPTED_COUNT}"
            if [ "$AUTO_DELETE" = "true" ]; then
              HEADER+=$'\n'"⚙️ 模式: 自动删除已开启"
            else
              HEADER+=$'\n'"⚙️ 模式: 仅通知未删除（手动触发可开启 auto_delete_corrupted）"
            fi
            send_tg "$HEADER"
            send_tg_chunked "📋 无效文件列表:"$'\n\n'"$(echo "$CORRUPTED_LIST" | sed 's/^/- /')"
            send_tg "🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "No corrupted videos found."
          fi

      - name: cleanup yt-dlp fragment files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TARGET_DIR=~/onedrive/0/j-1024j-视频-pornhub-favorites
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory not found: $TARGET_DIR"
            exit 0
          fi
          cd "$TARGET_DIR"
          # 查找 yt-dlp 残留的分片文件：*.mp4-Frag* 和 *.part-Frag*
          mapfile -t FRAG_FILES < <(find . -maxdepth 1 -type f \( -name '*.mp4-Frag*' -o -name '*.part-Frag*' \) -print)
          FRAG_COUNT=${#FRAG_FILES[@]}
          if [ "$FRAG_COUNT" -eq 0 ]; then
            echo "No fragment files found."
            exit 0
          fi
          # 收集文件名与大小
          FILE_DETAILS=""
          for f in "${FRAG_FILES[@]}"; do
            fname=$(basename "$f")
            fsize=$(du -h "$f" | cut -f1)
            FILE_DETAILS="${FILE_DETAILS}🗑 ${fname} (${fsize})
          "
          done
          # 清理
          find . -maxdepth 1 -type f \( -name '*.mp4-Frag*' -o -name '*.part-Frag*' \) -delete
          echo "Cleaned up ${FRAG_COUNT} fragment files."
          # 发送通知
          source "${GITHUB_WORKSPACE}/.github/scripts/tg_notify.sh"
          HEADER="🧹 ph-dl 清理 yt-dlp 分片文件"$'\n\n'"📁 目录: j-1024j-视频-pornhub-favorites"$'\n'"🗑️ 清理数量: ${FRAG_COUNT}"
          send_tg "$HEADER"
          send_tg_chunked "📋 文件列表:"$'\n\n'"${FILE_DETAILS}"
          send_tg "🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: clean telegram channel and reset upload archive
        if: github.event.inputs.clean_tg_uploaded_videos == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip3 install telethon
          # 删除 Telegram 频道所有消息
          python3 ${GITHUB_WORKSPACE}/.github/scripts/clean_channel.py "${TELEGRAM_CHANNEL_ID}"
          # 删除 uploaded_videos.txt，下次运行会重新处理所有视频
          SOURCE_REMOTE="onedrive:0/j-1024j-视频-pornhub-favorites"
          rclone delete "$SOURCE_REMOTE/uploaded_videos.txt" 2>/dev/null || true
          echo "Deleted uploaded_videos.txt"
          # 发送通知
          MSG="🧹 ph-dl 频道清理完成"$'\n\n'"📁 已清空 Telegram 频道所有视频"$'\n'"📄 已删除 uploaded_videos.txt（下次运行重新处理全部视频）"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}"

      - name: transcode and send videos to telegram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sudo apt-get install -y ffmpeg
          pip3 install telethon
          bash ${GITHUB_WORKSPACE}/.github/scripts/process_and_upload.sh \
            "onedrive:0/j-1024j-视频-pornhub-favorites" \
            "${TELEGRAM_CHANNEL_ID}" \
            "ph"

      - name: run ph-dl favorites
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
        run: |
          sudo apt-get update
          sudo apt-get install python3 -y
          sudo apt-get install ffmpeg -y
          pip3 install --upgrade yt-dlp telethon
          cd ~
          cd ~/onedrive/0/j-1024j-视频-pornhub-favorites
          echo "favorites文件列表"
          ls
          echo "favorites文件夹 下载前大小"
          BEFORE_SIZE=$(du -sh . | cut -f1)
          echo "$BEFORE_SIZE"
          
          # 下载到临时目录，验证完整性后再上传到 OneDrive
          DOWNLOAD_TMP="/tmp/ph-dl-downloads"
          mkdir -p "$DOWNLOAD_TMP"

          # 创建处理脚本供 yt-dlp 调用
          cat << 'EOF' > post_process.sh
          #!/bin/bash
          FILEPATH="$1"
          URL="$2"
          FILENAME=$(basename "$FILEPATH")
          FILESIZE_HUMAN=$(du -h "$FILEPATH" | cut -f1)
          TARGET_DIR="$HOME/onedrive/0/j-1024j-视频-pornhub-favorites"
          REMOTE_BASE="onedrive:0/j-1024j-视频-pornhub-favorites"
          ARCHIVE_FILE="$TARGET_DIR/archive.txt"
          CORRUPTED_LOG="/tmp/ph-dl-downloads/corrupted.txt"

          # 验证文件完整性（moov atom 存在）
          if ! ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$FILEPATH" 2>/dev/null | grep -q .; then
            echo "Corrupted (no moov atom): $FILENAME"
            rm -f "$FILEPATH"
            # 从 archive.txt 移除视频 ID（格式: id|filename|url），以便下次重新下载
            id="${FILENAME%.*}"
            id="${id##*-}"
            if [ -n "$id" ] && [ -f "$ARCHIVE_FILE" ]; then
              grep -v "^${id}|" "$ARCHIVE_FILE" > "${ARCHIVE_FILE}.tmp" 2>/dev/null && mv "${ARCHIVE_FILE}.tmp" "$ARCHIVE_FILE"
            fi
            echo "$FILENAME" >> "$CORRUPTED_LOG"
            exit 0
          fi

          # 文件完好，预处理（转码/faststart）并上传到 Telegram
          # 直接输出原始 URL，Telegram 自动识别为可点击链接（无需 parse_mode）
          echo "- ${FILENAME} (${FILESIZE_HUMAN}) ${URL}" >> new_downloads_list.txt
          if bash ${GITHUB_WORKSPACE}/.github/scripts/process_one_file.sh "${FILEPATH}" "${TELEGRAM_CHANNEL_ID}" "ph"; then
            echo "${FILENAME}" >> uploaded_videos.txt
          fi

          # 上传到 OneDrive（覆盖已有文件），完成后删除临时文件
          if rclone copyto "${FILEPATH}" "${REMOTE_BASE}/${FILENAME}" 2>/dev/null; then
            rm -f "$FILEPATH"
            # 写入 archive.txt（格式: id|filename|url）
            id="${FILENAME%.*}"
            id="${id##*-}"
            echo "${id}|${FILENAME}|${URL}" >> "$ARCHIVE_FILE"
          else
            echo "WARN: rclone copyto failed, keeping temp file: $FILENAME"
          fi
          EOF
          chmod +x post_process.sh
          
          BEFORE_COUNT=$(wc -l < archive.txt 2>/dev/null || echo 0)

