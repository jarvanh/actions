name: ph-dl

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      clean_all:
        description: '清理 Telegram 频道所有视频并重置 uploaded_old_videos.txt'
        type: boolean
        default: false
        required: false
  watch:
    types: started

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: rclone-install
        run: |
          # 安装 rclone
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          cd rclone-*-linux-amd64
          sudo mv rclone /usr/bin
          sudo chmod +x /usr/bin/rclone
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          # 写配置文件
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG
          EOF
      - name: rclone-run
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          mkdir ~/onedrive
          nohup rclone --vfs-cache-mode full mount onedrive: ~/onedrive &
          echo "~/onedrive 文件列表"
          cd ~/onedrive
          ls
      - name: check duplicate videos by ID and dedupe by hash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TARGET_DIR=~/onedrive/0/j-1024j-视频-pornhub-favorites
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory not found: $TARGET_DIR"
            exit 0
          fi
          cd "$TARGET_DIR"
          # 提取文件名中 [...] 内的 ID，统计重复项
          declare -A ID_FILES
          while IFS= read -r file; do
            id=$(echo "$file" | grep -oE '\[[a-f0-9]+\]' | tail -n1)
            [ -n "$id" ] || continue
            if [ -n "${ID_FILES[$id]}" ]; then
              ID_FILES[$id]+=$'\n'"$file"
            else
              ID_FILES[$id]="$file"
            fi
          done < <(find . -maxdepth 1 -type f -name '*.mp4' -print | sed 's|^\./||' | sort)

          DUP_DETAILS=""
          DUP_COUNT=0
          REMOVED_COUNT=0
          DIFFERENT_COUNT=0
          for id in "${!ID_FILES[@]}"; do
            files="${ID_FILES[$id]}"
            count=$(echo "$files" | wc -l)
            if [ "$count" -gt 1 ]; then
              DUP_COUNT=$((DUP_COUNT + 1))
              # 按修改时间从新到旧排序，保留最晚下载的文件作为基准
              sorted_files=$(echo "$files" | xargs -d '\n' ls -t 2>/dev/null)
              kept=$(echo "$sorted_files" | head -n1)
              kept_hash=$(sha1sum "$kept" | cut -d' ' -f1)
              group_details=""
              while IFS= read -r f; do
                [ "$f" = "$kept" ] && continue
                f_hash=$(sha1sum "$f" | cut -d' ' -f1)
                if [ "$f_hash" = "$kept_hash" ]; then
                  # 哈希一致，删除重复文件
                  rm -f "$f"
                  REMOVED_COUNT=$((REMOVED_COUNT + 1))
                  group_details+=$'  🗑 删除 '"${f}"$'（哈希一致 '"${kept_hash:0:12}"$'）\n'
                else
                  # 哈希不同，保留并标记
                  DIFFERENT_COUNT=$((DIFFERENT_COUNT + 1))
                  group_details+=$'  ⚠ 保留 '"${f}"$'（哈希 '"${f_hash:0:12}"$' ≠ '"${kept_hash:0:12}"$'）\n'
                fi
              done <<< "$sorted_files"
              DUP_DETAILS+=$'🔖 ID '"${id}"$'（'"${count}"$' 个，保留: '"${kept}"$'）\n'"${group_details}"
            fi
          done

          # 去重日志输出到 Actions 日志，便于追溯
          echo "=== ph-dl 去重日志 ==="
          echo "重复 ID 数量: ${DUP_COUNT}"
          echo "删除重复文件数量: ${REMOVED_COUNT}"
          echo "哈希不同保留数量: ${DIFFERENT_COUNT}"
          echo "--- 详情 ---"
          echo "${DUP_DETAILS}"

          # 发送通知
          if [ "$DUP_COUNT" -gt 0 ]; then
            MSG="🔍 ph-dl 重复视频检测与去重"$'\n\n'"📁 目录: j-1024j-视频-pornhub-favorites"$'\n'"🔢 重复 ID 数量: ${DUP_COUNT}"$'\n'"🗑 删除重复: ${REMOVED_COUNT}"$'\n'"⚠ 哈希不同保留: ${DIFFERENT_COUNT}"
            if [ "$REMOVED_COUNT" -eq 0 ] && [ "$DIFFERENT_COUNT" -gt 0 ]; then
              MSG+=$'\n'"ℹ 重复文件哈希各不相同，未自动删除"
            fi
            MSG+=$'\n\n'"📋 详情:"$'\n'"${DUP_DETAILS}"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MSG}"
          else
            echo "No duplicate video IDs found."
          fi

      - name: cleanup yt-dlp fragment files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TARGET_DIR=~/onedrive/0/j-1024j-视频-pornhub-favorites
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory not found: $TARGET_DIR"
            exit 0
          fi
          cd "$TARGET_DIR"
          # 查找 yt-dlp 残留的分片文件：*.mp4-Frag* 和 *.part-Frag*
          mapfile -t FRAG_FILES < <(find . -maxdepth 1 -type f \( -name '*.mp4-Frag*' -o -name '*.part-Frag*' \) -print)
          FRAG_COUNT=${#FRAG_FILES[@]}
          if [ "$FRAG_COUNT" -eq 0 ]; then
            echo "No fragment files found."
            exit 0
          fi
          # 收集文件名与大小
          FILE_DETAILS=""
          for f in "${FRAG_FILES[@]}"; do
            fname=$(basename "$f")
            fsize=$(du -h "$f" | cut -f1)
            FILE_DETAILS="${FILE_DETAILS}🗑 ${fname} (${fsize})
          "
          done
          # 清理
          find . -maxdepth 1 -type f \( -name '*.mp4-Frag*' -o -name '*.part-Frag*' \) -delete
          echo "Cleaned up ${FRAG_COUNT} fragment files."
          # 发送通知
          MSG="🧹 ph-dl 清理 yt-dlp 分片文件"$'\n\n'"📁 目录: j-1024j-视频-pornhub-favorites"$'\n'"🗑️ 清理数量: ${FRAG_COUNT}"$'\n\n'"📋 文件列表:"$'\n'"${FILE_DETAILS}"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}"

      - name: clean telegram channel and reset upload archive
        if: github.event.inputs.clean_all == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip3 install telethon
          # 删除 Telegram 频道所有消息
          python3 ${GITHUB_WORKSPACE}/.github/scripts/clean_channel.py "${TELEGRAM_CHANNEL_ID}"
          # 清空 uploaded_old_videos.txt，使旧视频重新上传
          TARGET_DIR=~/onedrive/0/j-1024j-视频-pornhub-favorites
          if [ -d "$TARGET_DIR" ]; then
            : > "$TARGET_DIR/uploaded_old_videos.txt"
            echo "Cleared uploaded_old_videos.txt"
          fi
          # 发送通知
          MSG="🧹 ph-dl 频道清理完成"$'\n\n'"📁 已清空 Telegram 频道所有视频"$'\n'"📄 已重置 uploaded_old_videos.txt"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}"

      - name: transcode existing videos for Telegram compatibility
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          TARGET_DIR=~/onedrive/0/j-1024j-视频-pornhub-favorites
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory not found: $TARGET_DIR"
            exit 0
          fi
          cd "$TARGET_DIR"

          # 关闭 set -e，文件处理中的错误由脚本自行处理，避免单个文件失败导致整个步骤中断
          set +e

          # rclone 挂载的随机 seek 不稳定，cp 产生的副本可能损坏，导致 ffprobe 无法读取 codec。
          # 直接用 rclone copy 从远程下载到本地临时目录，绕过 mount，再用 ffprobe/ffmpeg 处理。
          TMP_DIR="/tmp/ph-dl-transcode"
          mkdir -p "$TMP_DIR"

          # 确认 ffprobe 可用
          if ! command -v ffprobe &>/dev/null; then
            echo "ERROR: ffprobe 不可用，跳过转码步骤"
            exit 0
          fi
          REMOTE_BASE="onedrive:0/j-1024j-视频-pornhub-favorites"

          CONVERTED=0
          FASTSTART=0
          SKIPPED=0
          FAILED=0
          CORRUPTED=0
          TOTAL=0
          CONVERTED_LIST=""
          FAILED_LIST=""
          CORRUPTED_LIST=""

          touch transcoded.txt
          # 创建单文件处理脚本，供 xargs -P 并行调用
          # 脚本写到本地 $TMP_DIR（rclone 挂载不支持 execute 权限）
          cat << 'SCRIPT' > "$TMP_DIR/transcode_one.sh"
          #!/bin/bash
          set +e
          file="$1"
          TMP_DIR="/tmp/ph-dl-transcode"
          WORK_DIR="$TMP_DIR/$$"
          REMOTE_BASE="onedrive:0/j-1024j-视频-pornhub-favorites"
          REMOTE_PATH="$REMOTE_BASE/$file"
          LOCAL_FILE="$WORK_DIR/$file"
          mkdir -p "$WORK_DIR"

          # 下载
          rm -f "$LOCAL_FILE"
          if ! rclone copy "$REMOTE_PATH" "$WORK_DIR/" 2>/dev/null || [ ! -f "$LOCAL_FILE" ]; then
            echo "Skip (rclone copy failed): $file" >&2
            echo "RESULT|SKIP|rclone copy failed|$file"
            rm -rf "$WORK_DIR"
            exit 0
          fi
          dst_size=$(stat -c%s "$LOCAL_FILE" 2>/dev/null || echo 0)

          # 检测编码
          vcodec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$LOCAL_FILE" 2>/dev/null) || vcodec=""
          acodec=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$LOCAL_FILE" 2>/dev/null) || acodec=""

          if [ -z "$vcodec" ]; then
            FFPROBE_ERR=$(ffprobe -v error -show_format -show_streams "$LOCAL_FILE" 2>&1)
            echo "Skip (cannot read codec): $file (size=$dst_size)" >&2
            if echo "$FFPROBE_ERR" | grep -q "moov atom not found"; then
              echo "  → 文件损坏（moov atom 缺失），删除远程文件并从 archive.txt 移除" >&2
              rclone delete "$REMOTE_PATH" 2>/dev/null
              id="${file%.*}"
              id="${id##*-}"
              if [ -n "$id" ] && [ -f archive.txt ]; then
                ( flock -x 200; grep -v "^${id}|" archive.txt > archive.txt.tmp 2>/dev/null && mv archive.txt.tmp archive.txt; ) 200>archive.txt.lock
              fi
              echo "RESULT|CORRUPTED||$file"
            else
              echo "RESULT|SKIP|cannot read codec|$file"
            fi
            rm -rf "$WORK_DIR"
            exit 0
          fi

          echo "OK: $file (size=$dst_size, vcodec=$vcodec, acodec=$acodec)" >&2

          if [ "$vcodec" = "h264" ] && [ "$acodec" = "aac" ]; then
            echo "Faststart: $file" >&2
            if ffmpeg -y -i "$LOCAL_FILE" -c copy -movflags +faststart "${LOCAL_FILE}.tmp" 2>/dev/null && mv "${LOCAL_FILE}.tmp" "$LOCAL_FILE" 2>/dev/null; then
              if rclone copyto "$LOCAL_FILE" "$REMOTE_PATH" 2>/dev/null; then
                echo "$file" >> transcoded.txt
                echo "RESULT|FASTSTART||$file"
              else
                echo "RESULT|FAILED|复制回 OneDrive 失败|$file"
              fi
            else
              rm -f "${LOCAL_FILE}.tmp"
              echo "RESULT|FAILED|faststart 失败|$file"
            fi
          else
            echo "Convert: $file (${vcodec}/${acodec} → h264/aac)" >&2
            if ffmpeg -y -i "$LOCAL_FILE" -c:v libx264 -preset fast -c:a aac -movflags +faststart "${LOCAL_FILE}.tmp" 2>/dev/null && mv "${LOCAL_FILE}.tmp" "$LOCAL_FILE" 2>/dev/null; then
              if rclone copyto "$LOCAL_FILE" "$REMOTE_PATH" 2>/dev/null; then
                echo "$file" >> transcoded.txt
                echo "RESULT|CONVERTED|${vcodec}/${acodec}|$file"
              else
                echo "RESULT|FAILED|复制回 OneDrive 失败|$file"
              fi
            else
              rm -f "${LOCAL_FILE}.tmp"
              echo "RESULT|FAILED|转码失败|$file"
            fi
          fi
          rm -rf "$WORK_DIR"
          SCRIPT
          # 用 bash 调用，无需 execute 权限（rclone 挂载不支持 chmod +x）

          # 收集待处理文件（跳过已处理），并行处理（nproc 个进程同时运行）
          # 使用 -0 / NUL 分隔，避免文件名中的单引号/空格/特殊字符导致 xargs 报错
          RESULTS_FILE="$TMP_DIR/results.txt"
          : > "$RESULTS_FILE"
          for file in *.mp4; do
            [ -e "$file" ] || continue
            if grep -Fxq "$file" transcoded.txt 2>/dev/null; then
              continue
            fi
            TOTAL=$((TOTAL + 1))
            printf '%s\0' "$file"
          done | xargs -0 -P "$(nproc)" -I {} bash "$TMP_DIR/transcode_one.sh" "{}" > "$RESULTS_FILE"
          # 捕获 xargs 退出码（PIPESTATUS[1] 为管道中 xargs 的状态）
          # 若 xargs 自身失败（例如参数解析错误、脚本不可执行），必须让本步骤失败，
          # 否则后续 upload 步骤会把未转码的视频直接上传到 Telegram。
          XARGS_EXIT=${PIPESTATUS[1]}

          # 汇总结果
          while IFS='|' read -r prefix status detail file; do
            [ "$prefix" = "RESULT" ] || continue
            case "$status" in
              CONVERTED) CONVERTED=$((CONVERTED + 1)); CONVERTED_LIST+="- ${file}（${detail} → h264/aac）"$'\n' ;;
              FASTSTART) FASTSTART=$((FASTSTART + 1)) ;;
              CORRUPTED) CORRUPTED=$((CORRUPTED + 1)); CORRUPTED_LIST+="- ${file}"$'\n' ;;
              SKIP) SKIPPED=$((SKIPPED + 1)) ;;
              FAILED) FAILED=$((FAILED + 1)); FAILED_LIST+="- ${file}（${detail}）"$'\n' ;;
            esac
          done < "$RESULTS_FILE"
          rm -rf "$TMP_DIR"

          echo "=== 转码统计 ==="
          echo "总计: ${TOTAL}，重编码: ${CONVERTED}，仅 faststart: ${FASTSTART}，跳过: ${SKIPPED}（其中损坏已删除: ${CORRUPTED}），失败: ${FAILED}"

          # xargs 管道自身失败（非单文件转码失败）→ 阻断后续上传步骤，避免未转码视频被上传
          if [ "$XARGS_EXIT" -ne 0 ]; then
            MSG="❌ ph-dl 转码步骤执行失败（xargs exit=${XARGS_EXIT}）"$'\n\n'"📁 目录: j-1024j-视频-pornhub-favorites"$'\n'"📊 待处理: ${TOTAL}"$'\n'"🎬 已重编码: ${CONVERTED}"$'\n'"⏭️ 跳过: ${SKIPPED}"$'\n'"❌ 失败: ${FAILED}"$'\n\n'"🚫 已阻断上传步骤，请检查 Actions 日志后重试"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MSG}" || true
            exit 1
          fi

          # 发送通知
          if [ "$TOTAL" -gt 0 ] && { [ "$CONVERTED" -gt 0 ] || [ "$FAILED" -gt 0 ] || [ "$FASTSTART" -gt 0 ] || [ "$CORRUPTED" -gt 0 ]; }; then
            MSG="🔄 ph-dl 旧视频转码完成"$'\n\n'"📁 目录: j-1024j-视频-pornhub-favorites"$'\n'"📊 总计: ${TOTAL}"$'\n'"🎬 重编码: ${CONVERTED}"$'\n'"⚡ 仅 faststart: ${FASTSTART}"$'\n'"⏭️ 跳过: ${SKIPPED}"$'\n'"🗑 损坏已删除: ${CORRUPTED}"$'\n'"❌ 失败: ${FAILED}"
            if [ -n "$CONVERTED_LIST" ]; then
              MSG+=$'\n\n'"📋 重编码列表:"$'\n'"${CONVERTED_LIST}"
            fi
            if [ -n "$FAILED_LIST" ]; then
              MSG+=$'\n\n'"❌ 失败列表:"$'\n'"${FAILED_LIST}"
            fi
            if [ -n "$CORRUPTED_LIST" ]; then
              MSG+=$'\n\n'"🗑 损坏已删除（下次运行将重新下载）:"$'\n'"${CORRUPTED_LIST}"
            fi
            MSG+=$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MSG}" || true
          fi
          exit 0

      - name: send old videos to telegram channel
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip3 install telethon
          cd ~/onedrive/0/j-1024j-视频-pornhub-favorites 2>/dev/null || exit 0
          ARCHIVE_FILE="uploaded_old_videos.txt"
          touch "$ARCHIVE_FILE"
          FAILED_FILES=""
          SKIPPED_CODEC_LIST=""
          TOTAL=0
          SKIPPED=0
          SUCCESS=0
          FAILED=0
          SKIPPED_CODEC=0
          # 按文件更新时间从旧到新排序上传（使用进程替换以便 while 循环内变量可持久化）
          while IFS= read -r file; do
            [ -e "$file" ] || continue
            TOTAL=$((TOTAL + 1))
            # 跳过已成功上传的文件
            if grep -Fxq "$file" "$ARCHIVE_FILE" 2>/dev/null; then
              echo "Skip (already uploaded): $file"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            # 校验编码：仅上传已转码为 h264/aac 的视频，避免上传未处理视频到 Telegram
            # ffprobe 读 moov atom，转码后的文件已 +faststart（moov 在头部），读取很快
            vcodec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$file" 2>/dev/null)
            acodec=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$file" 2>/dev/null)
            if [ "$vcodec" != "h264" ] || [ "$acodec" != "aac" ]; then
              echo "Skip (not h264/aac: v=${vcodec:-?} a=${acodec:-?}): $file"
              SKIPPED_CODEC=$((SKIPPED_CODEC + 1))
              SKIPPED_CODEC_LIST+="- ${file} (v=${vcodec:-?} a=${acodec:-?})"$'\n'
              continue
            fi
            FILESIZE_HUMAN=$(du -h "$file" | cut -f1)
            if python3 ${GITHUB_WORKSPACE}/.github/scripts/upload_video.py "$file" "${TELEGRAM_CHANNEL_ID}" "Old video: ${file} (${FILESIZE_HUMAN})"; then
              echo "$file" >> "$ARCHIVE_FILE"
              SUCCESS=$((SUCCESS + 1))
            else
              FAILED=$((FAILED + 1))
              FAILED_FILES="${FAILED_FILES}- ${file} (${FILESIZE_HUMAN})
          "
            fi
            sleep 5 # 防止触发速率限制
          done < <(ls -tr *.mp4 2>/dev/null)

          echo "总计: ${TOTAL}，跳过(已上传): ${SKIPPED}，跳过(编码不符): ${SKIPPED_CODEC}，成功: ${SUCCESS}，失败: ${FAILED}"

          # 编码不符汇总通知（这些文件未转码完成，不会上传）
          if [ "$SKIPPED_CODEC" -gt 0 ]; then
            MSG="⚠ ph-dl 旧视频上传跳过（编码不是 h264/aac）"$'\n\n'"📊 跳过数量: ${SKIPPED_CODEC}"$'\n\n'"📋 文件列表:"$'\n'"${SKIPPED_CODEC_LIST}"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MSG}" || true
          fi

          # 失败汇总通知
          if [ "$FAILED" -gt 0 ]; then
            MSG="ph-dl 旧视频上传失败汇总"$'\n'"总计: ${TOTAL}，跳过(已上传): ${SKIPPED}，跳过(编码不符): ${SKIPPED_CODEC}，成功: ${SUCCESS}，失败: ${FAILED}"$'\n'"失败文件:"$'\n'"${FAILED_FILES}"$'\n'"任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MSG}"
          fi

      - name: run ph-dl favorites
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
