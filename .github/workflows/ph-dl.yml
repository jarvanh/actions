name: ph-dl

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      clean_all:
        description: '清理 Telegram 频道所有视频并重置 uploaded_videos.txt'
        type: boolean
        default: false
        required: false
  watch:
    types: started

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: rclone-install
        run: |
          # 安装 rclone
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          cd rclone-*-linux-amd64
          sudo mv rclone /usr/bin
          sudo chmod +x /usr/bin/rclone
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          # 写配置文件
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG
          EOF
      - name: rclone-run
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          mkdir ~/onedrive
          nohup rclone --vfs-cache-mode full mount onedrive: ~/onedrive &
          echo "~/onedrive 文件列表"
          cd ~/onedrive
          ls
      - name: check duplicate videos by ID and dedupe by hash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TARGET_DIR=~/onedrive/0/j-1024j-视频-pornhub-favorites
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory not found: $TARGET_DIR"
            exit 0
          fi
          cd "$TARGET_DIR"
          # 提取文件名中 [...] 内的 ID，统计重复项
          declare -A ID_FILES
          while IFS= read -r file; do
            id=$(echo "$file" | grep -oE '\[[a-f0-9]+\]' | tail -n1)
            [ -n "$id" ] || continue
            if [ -n "${ID_FILES[$id]}" ]; then
              ID_FILES[$id]+=$'\n'"$file"
            else
              ID_FILES[$id]="$file"
            fi
          done < <(find . -maxdepth 1 -type f -name '*.mp4' -print | sed 's|^\./||' | sort)

          DUP_DETAILS=""
          DUP_COUNT=0
          REMOVED_COUNT=0
          DIFFERENT_COUNT=0
          for id in "${!ID_FILES[@]}"; do
            files="${ID_FILES[$id]}"
            count=$(echo "$files" | wc -l)
            if [ "$count" -gt 1 ]; then
              DUP_COUNT=$((DUP_COUNT + 1))
              # 按修改时间从新到旧排序，保留最晚下载的文件作为基准
              sorted_files=$(echo "$files" | xargs -d '\n' ls -t 2>/dev/null)
              kept=$(echo "$sorted_files" | head -n1)
              kept_hash=$(sha1sum "$kept" | cut -d' ' -f1)
              group_details=""
              while IFS= read -r f; do
                [ "$f" = "$kept" ] && continue
                f_hash=$(sha1sum "$f" | cut -d' ' -f1)
                if [ "$f_hash" = "$kept_hash" ]; then
                  # 哈希一致，删除重复文件
                  rm -f "$f"
                  REMOVED_COUNT=$((REMOVED_COUNT + 1))
                  group_details+=$'  🗑 删除 '"${f}"$'（哈希一致 '"${kept_hash:0:12}"$'）\n'
                else
                  # 哈希不同，保留并标记
                  DIFFERENT_COUNT=$((DIFFERENT_COUNT + 1))
                  group_details+=$'  ⚠ 保留 '"${f}"$'（哈希 '"${f_hash:0:12}"$' ≠ '"${kept_hash:0:12}"$'）\n'
                fi
              done <<< "$sorted_files"
              DUP_DETAILS+=$'🔖 ID '"${id}"$'（'"${count}"$' 个，保留: '"${kept}"$'）\n'"${group_details}"
            fi
          done

          # 去重日志输出到 Actions 日志，便于追溯
          echo "=== ph-dl 去重日志 ==="
          echo "重复 ID 数量: ${DUP_COUNT}"
          echo "删除重复文件数量: ${REMOVED_COUNT}"
          echo "哈希不同保留数量: ${DIFFERENT_COUNT}"
          echo "--- 详情 ---"
          echo "${DUP_DETAILS}"

          # 发送通知
          if [ "$DUP_COUNT" -gt 0 ]; then
            MSG="🔍 ph-dl 重复视频检测与去重"$'\n\n'"📁 目录: j-1024j-视频-pornhub-favorites"$'\n'"🔢 重复 ID 数量: ${DUP_COUNT}"$'\n'"🗑 删除重复: ${REMOVED_COUNT}"$'\n'"⚠ 哈希不同保留: ${DIFFERENT_COUNT}"
            if [ "$REMOVED_COUNT" -eq 0 ] && [ "$DIFFERENT_COUNT" -gt 0 ]; then
              MSG+=$'\n'"ℹ 重复文件哈希各不相同，未自动删除"
            fi
            MSG+=$'\n\n'"📋 详情:"$'\n'"${DUP_DETAILS}"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MSG}"
          else
            echo "No duplicate video IDs found."
          fi

      - name: cleanup yt-dlp fragment files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TARGET_DIR=~/onedrive/0/j-1024j-视频-pornhub-favorites
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory not found: $TARGET_DIR"
            exit 0
          fi
          cd "$TARGET_DIR"
          # 查找 yt-dlp 残留的分片文件：*.mp4-Frag* 和 *.part-Frag*
          mapfile -t FRAG_FILES < <(find . -maxdepth 1 -type f \( -name '*.mp4-Frag*' -o -name '*.part-Frag*' \) -print)
          FRAG_COUNT=${#FRAG_FILES[@]}
          if [ "$FRAG_COUNT" -eq 0 ]; then
            echo "No fragment files found."
            exit 0
          fi
          # 收集文件名与大小
          FILE_DETAILS=""
          for f in "${FRAG_FILES[@]}"; do
            fname=$(basename "$f")
            fsize=$(du -h "$f" | cut -f1)
            FILE_DETAILS="${FILE_DETAILS}🗑 ${fname} (${fsize})
          "
          done
          # 清理
          find . -maxdepth 1 -type f \( -name '*.mp4-Frag*' -o -name '*.part-Frag*' \) -delete
          echo "Cleaned up ${FRAG_COUNT} fragment files."
          # 发送通知
          MSG="🧹 ph-dl 清理 yt-dlp 分片文件"$'\n\n'"📁 目录: j-1024j-视频-pornhub-favorites"$'\n'"🗑️ 清理数量: ${FRAG_COUNT}"$'\n\n'"📋 文件列表:"$'\n'"${FILE_DETAILS}"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}"

      - name: clean telegram channel and reset upload archive
        if: github.event.inputs.clean_all == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip3 install telethon
          # 删除 Telegram 频道所有消息
          python3 ${GITHUB_WORKSPACE}/.github/scripts/clean_channel.py "${TELEGRAM_CHANNEL_ID}"
          # 删除 uploaded_videos.txt，下次运行会重新处理所有视频
          SOURCE_REMOTE="onedrive:0/j-1024j-视频-pornhub-favorites"
          rclone delete "$SOURCE_REMOTE/uploaded_videos.txt" 2>/dev/null || true
          echo "Deleted uploaded_videos.txt"
          # 发送通知
          MSG="🧹 ph-dl 频道清理完成"$'\n\n'"📁 已清空 Telegram 频道所有视频"$'\n'"📄 已删除 uploaded_videos.txt（下次运行重新处理全部视频）"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}"

      - name: transcode and send videos to telegram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sudo apt-get install -y ffmpeg
          pip3 install telethon
          bash ${GITHUB_WORKSPACE}/.github/scripts/process_and_upload.sh \
            "onedrive:0/j-1024j-视频-pornhub-favorites" \
            "${TELEGRAM_CHANNEL_ID}" \
            "ph"

      - name: run ph-dl favorites
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
        run: |
          sudo apt-get update
          sudo apt-get install python3 -y
          sudo apt-get install ffmpeg -y
          pip3 install --upgrade yt-dlp telethon
          cd ~
          cd ~/onedrive/0/j-1024j-视频-pornhub-favorites
          echo "favorites文件列表"
          ls
          echo "favorites文件夹 下载前大小"
          BEFORE_SIZE=$(du -sh . | cut -f1)
          echo "$BEFORE_SIZE"
          
          # 下载到临时目录，验证完整性后再上传到 OneDrive
          DOWNLOAD_TMP="/tmp/ph-dl-downloads"
          mkdir -p "$DOWNLOAD_TMP"

          # 创建处理脚本供 yt-dlp 调用
          cat << 'EOF' > post_process.sh
          #!/bin/bash
          FILEPATH="$1"
          URL="$2"
          FILENAME=$(basename "$FILEPATH")
          FILESIZE_HUMAN=$(du -h "$FILEPATH" | cut -f1)
          TARGET_DIR="$HOME/onedrive/0/j-1024j-视频-pornhub-favorites"
          REMOTE_BASE="onedrive:0/j-1024j-视频-pornhub-favorites"
          ARCHIVE_FILE="$TARGET_DIR/archive.txt"
          CORRUPTED_LOG="/tmp/ph-dl-downloads/corrupted.txt"

          # 验证文件完整性（moov atom 存在）
          if ! ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$FILEPATH" 2>/dev/null | grep -q .; then
            echo "Corrupted (no moov atom): $FILENAME"
            rm -f "$FILEPATH"
            # 从 archive.txt 移除视频 ID（格式: id|filename|url），以便下次重新下载
            id="${FILENAME%.*}"
            id="${id##*-}"
            if [ -n "$id" ] && [ -f "$ARCHIVE_FILE" ]; then
              grep -v "^${id}|" "$ARCHIVE_FILE" > "${ARCHIVE_FILE}.tmp" 2>/dev/null && mv "${ARCHIVE_FILE}.tmp" "$ARCHIVE_FILE"
            fi
            echo "$FILENAME" >> "$CORRUPTED_LOG"
            exit 0
          fi

          # 文件完好，先上传到 Telegram（从临时文件直接上传）
          echo "- ${FILENAME} (${FILESIZE_HUMAN}) [链接](${URL})" >> new_downloads_list.txt
          if python3 ${GITHUB_WORKSPACE}/.github/scripts/upload_video.py "${FILEPATH}" "${TELEGRAM_CHANNEL_ID}" "Downloaded: ${FILENAME} (${FILESIZE_HUMAN})"; then
            echo "${FILENAME}" >> uploaded_videos.txt
          fi

          # 上传到 OneDrive（覆盖已有文件），完成后删除临时文件
          if rclone copyto "${FILEPATH}" "${REMOTE_BASE}/${FILENAME}" 2>/dev/null; then
            rm -f "$FILEPATH"
            # 写入 archive.txt（格式: id|filename|url）
            id="${FILENAME%.*}"
            id="${id##*-}"
            echo "${id}|${FILENAME}|${URL}" >> "$ARCHIVE_FILE"
          else
            echo "WARN: rclone copyto failed, keeping temp file: $FILENAME"
          fi
          EOF
          chmod +x post_process.sh
          
          BEFORE_COUNT=$(wc -l < archive.txt 2>/dev/null || echo 0)

          # 迁移 archive.txt 到新格式（id|filename|url），兼容旧格式（Pornhub id）
          if [ -f archive.txt ]; then
            awk -F'|' '{
              if (NF >= 2) { print }                              # 新格式: id|filename|url
              else if ($1 ~ /^[Pp]ornhub[[:space:]].+/) {         # 旧格式: Pornhub ph5fdf9f06b965d
                id=$1; sub(/^[Pp]ornhub[[:space:]]+/, "", id); print id "||"
              } else if ($1 != "") { print $1 "||" }              # 仅 ID
            }' archive.txt > archive.txt.migrated
            mv archive.txt.migrated archive.txt
          fi
          # 生成 yt-dlp 用的临时 archive（格式: Pornhub id），post_process.sh 写入真正的 archive.txt
          YT_DLP_ARCHIVE="/tmp/yt-dlp-archive.txt"
          grep -v '^$' archive.txt 2>/dev/null | while IFS='|' read -r id _ _; do
            [ -n "$id" ] && echo "Pornhub $id"
          done > "$YT_DLP_ARCHIVE"
          
          # 优先选择 H.264+AAC 流并合并为 MP4。仅 remux（不重编码），避免 ffmpeg 转码被中断导致 moov atom 缺失。
          # 下载到临时目录，post_process.sh 验证完整性后写入 archive.txt（id|filename|url）并上传到 OneDrive。
          yt-dlp -f "bestvideo[vcodec^=avc1]+bestaudio[acodec^=mp4a]/best[ext=mp4]/best" --merge-output-format mp4 --remux-video mp4 --force-overwrites --download-archive "$YT_DLP_ARCHIVE" --playlist-end 50 -o "$DOWNLOAD_TMP/%(title)s-%(id)s.%(ext)s" --exec "./post_process.sh {} %(webpage_url)q" -i https://www.pornhub.com/users/'${{ secrets. PORNHUBNAME }}'/videos/favorites || echo "url不存在"
          rm -f "$YT_DLP_ARCHIVE"
          
          # 损坏文件通知（post_process.sh 验证失败并丢弃的文件）
          if [ -f "$DOWNLOAD_TMP/corrupted.txt" ]; then
            CORRUPTED_COUNT=$(wc -l < "$DOWNLOAD_TMP/corrupted.txt")
            CORRUPTED_LIST=$(cat "$DOWNLOAD_TMP/corrupted.txt")
            CORRUPT_MSG="🗑 ph-dl 下载阶段检测到损坏视频并已丢弃"$'\n\n'"📊 数量: ${CORRUPTED_COUNT}"$'\n'"📋 文件列表:"$'\n'"${CORRUPTED_LIST}"$'\n\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${CORRUPT_MSG}"
          fi
          rm -rf "$DOWNLOAD_TMP"
          
          AFTER_COUNT=$(wc -l < archive.txt 2>/dev/null || echo 0)
          DOWNLOAD_COUNT=$((AFTER_COUNT - BEFORE_COUNT))
          if [ "$DOWNLOAD_COUNT" -lt 0 ]; then
            DOWNLOAD_COUNT=0
          fi
          echo "本次新增下载数量: ${DOWNLOAD_COUNT}"
          echo "favorites文件夹 下载后大小"
          AFTER_SIZE=$(du -sh . | cut -f1)
          echo "$AFTER_SIZE"
          
          if [ -f new_downloads_list.txt ]; then
            FILE_LIST=$(cat new_downloads_list.txt)
          else
            FILE_LIST="无"
          fi
          
          MSG="github p站下载任务执行完毕 favorites
          本次下载: ${DOWNLOAD_COUNT} 个视频
          下载前大小: ${BEFORE_SIZE}
          下载后大小: ${AFTER_SIZE}
          任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          文件列表:
          ${FILE_LIST}"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="${MSG}"
