name: ph-dl

concurrency:
  group: video-processing
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      clean_tg_uploaded_videos:
        description: '清空 Telegram 频道所有消息并删除 uploaded_videos.json，会重新上传全部视频到 Telegram 频道'
        type: boolean
        default: false
        required: false
      auto_delete_duplicates:
        description: '删除重复视频：1、ID+标题相同→保留最大/最新 2、标题不同但哈希一致→删除旧文件 3、标题不同且哈希不同的仍仅通知 4、关闭时全部仅标记"待删除"不删除'
        type: boolean
        default: false
        required: false
      dedupe_by_id_only:
        description: '仅按 ID 删除重复视频，跳过标题和哈希校验：同 ID 视为重复，直接删除较小/较旧文件，保留最大/最新。无论 auto_delete_duplicates 是否开启都会执行删除。注意：可能误删标题不同但碰巧同 ID 的视频'
        type: boolean
        default: false
        required: false
  watch:
    types: started

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 统一收尾区（tg_add_footer）: 运行日志链接 + 已运行时长（所有通知 step 继承）
      TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TG_RUN_STARTED_AT: ${{ github.run_started_at }}
      # OneDrive 远程路径：rclone 配置中的远端 + 路径
      SOURCE_REMOTE: "onedrive:0/j-1024j-视频-pornhub-favorites"
      # SOURCE_REMOTE: "onedrive:3/1024j-视频-pornhub-channel"
      # SOURCE_REMOTE: "onedrive:4/1024j-视频-pornhub-channel"
      # SOURCE_REMOTE: "onedrive:5/1024j-视频-pornhub-channel"
    steps:
      - uses: actions/checkout@v7

      # ============ 环境准备：rclone 安装与挂载 ============
      - name: rclone-install
        run: |
          set -e
          # 安装 rclone：GitHub Releases 直下 .deb，失败回退 rclone.org 安装脚本
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          # 写配置 + 持久化：secret 起步 → 掩码 → Dropbox 恢复优先 → 有效性检查 → 同步回 Dropbox
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config
      - name: rclone-run
        run: |
          # 挂载 OneDrive 到本地目录（后台运行，vfs 全量缓存模式）
          sudo apt-get update
          sudo apt-get install -y fuse3
          mkdir ~/onedrive
          nohup rclone --vfs-cache-mode full mount onedrive: ~/onedrive &
          echo "~/onedrive 文件列表"
          cd ~/onedrive
          ls

      # ============ 步骤1：清理 yt-dlp 残留文件 ============
      - name: cleanup yt-dlp residual files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/telegram/cleanup_ytdlp_residual.sh"

      # ============ 步骤2：检测并去重重复视频 ============
      - name: check duplicate videos by ID and dedupe by hash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_DELETE: ${{ github.event.inputs.auto_delete_duplicates == 'true' }}
          DEDUPE_BY_ID_ONLY: ${{ github.event.inputs.dedupe_by_id_only == 'true' }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/telegram/dedupe_ph_videos.sh"

      # ============ 步骤3：清空 Telegram 频道并重置上传记录 ============
      - name: clean telegram channel and reset upload archive
        if: github.event.inputs.clean_tg_uploaded_videos == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/telegram/reset_tg_channel.sh" \
            "${TELEGRAM_CHANNEL_ID}" \
            "ph-dl"

      # ============ 步骤4：将 OneDrive 中尚未上传的视频补传到 Telegram 频道 ============
      - name: transcode and send videos to telegram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          sudo apt-get install -y ffmpeg
          pip3 install telethon
          bash "${GITHUB_WORKSPACE}/.github/scripts/telegram/sync_to_tg.sh" \
            "$SOURCE_REMOTE" \
            "${TELEGRAM_CHANNEL_ID}" \
            "ph"

      # ============ 步骤5：yt-dlp 下载新增收藏并处理上传 ============
      - name: run ph-dl favorites
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
        run: |
          sudo apt-get update
          sudo apt-get install python3 -y
          sudo apt-get install ffmpeg -y
          pip3 install --upgrade yt-dlp telethon

          # 同步远端最新的 uploaded_videos.json 到挂载目录（刷新 VFS 缓存）
          # step4 通过 rclone copyto 直接写远端，挂载目录可能读到旧缓存；否则 process_ph_download.sh 可能在旧文件基础上 >> 追加导致丢项
          TARGET_DIR="$HOME/onedrive/0/j-1024j-视频-pornhub-favorites"
          mkdir -p "$TARGET_DIR"
          if rclone cat "$SOURCE_REMOTE/uploaded_videos.json" > "$TARGET_DIR/uploaded_videos.json.remote" 2>/dev/null && [ -s "$TARGET_DIR/uploaded_videos.json.remote" ]; then
            mv "$TARGET_DIR/uploaded_videos.json.remote" "$TARGET_DIR/uploaded_videos.json"
            echo "已同步 uploaded_videos.json 从远端到挂载目录 (size: $(wc -c < "$TARGET_DIR/uploaded_videos.json"))"
          else
            rm -f "$TARGET_DIR/uploaded_videos.json.remote"
            echo "uploaded_videos.json 在远端为空或不存在，跳过同步"
          fi

          # 同步远端最新的 failed_videos.json（损坏名单）到挂载目录
          # 否则下面的库存统计拿不到损坏名单，会把已标记损坏的文件算进"待上传"
          if rclone cat "$SOURCE_REMOTE/failed_videos.json" > "$TARGET_DIR/failed_videos.json.remote" 2>/dev/null && [ -s "$TARGET_DIR/failed_videos.json.remote" ]; then
            mv "$TARGET_DIR/failed_videos.json.remote" "$TARGET_DIR/failed_videos.json"
            echo "已同步 failed_videos.json 从远端到挂载目录 (size: $(wc -c < "$TARGET_DIR/failed_videos.json"))"
          else
            rm -f "$TARGET_DIR/failed_videos.json.remote"
            # 远端没有损坏名单（如刚执行过频道重置）时，删掉挂载目录里的陈旧副本，避免统计读到过期数据
            rm -f "$TARGET_DIR/failed_videos.json"
            echo "failed_videos.json 在远端为空或不存在，跳过同步"
          fi

          cd ~/onedrive/0/j-1024j-视频-pornhub-favorites
          echo "favorites 文件列表"
          ls
          echo "favorites 文件夹 下载前大小"
          BEFORE_SIZE=$(du -sh . | cut -f1)
          echo "$BEFORE_SIZE"

          # 下载到临时目录，验证完整性后再上传到 OneDrive
          DOWNLOAD_TMP="/tmp/ph-dl-downloads"
          mkdir -p "$DOWNLOAD_TMP"

          BEFORE_COUNT=$(wc -l < archive.txt 2>/dev/null || echo 0)

          # 迁移 archive.txt 到新格式（id|filename|url），兼容旧格式（Pornhub id）
          if [ -f archive.txt ]; then
            awk -F'|' '{
              if (NF >= 2) { print }                              # 新格式: id|filename|url
              else if ($1 ~ /^[Pp]ornhub[[:space:]].+/) {         # 旧格式: Pornhub ph5fdf9f06b965d
                id=$1; sub(/^[Pp]ornhub[[:space:]]+/, "", id); print id "||"
              } else if ($1 != "") { print $1 "||" }              # 仅 ID
            }' archive.txt > archive.txt.migrated
            mv archive.txt.migrated archive.txt
          fi
          # 生成 yt-dlp 用的临时 archive（格式: Pornhub id），process_ph_download.sh 写入真正的 archive.txt
          YT_DLP_ARCHIVE="/tmp/yt-dlp-archive.txt"
          grep -v '^$' archive.txt 2>/dev/null | while IFS='|' read -r id _ _; do
            [ -n "$id" ] && echo "Pornhub $id"
          done > "$YT_DLP_ARCHIVE"

          # 优先选择 H.264+AAC 流并合并为 MP4。仅 remux（不重编码），避免 ffmpeg 转码被中断导致 moov atom 缺失。
          # 下载到临时目录，process_ph_download.sh 验证完整性后写入 archive.txt（id|filename|url）并上传到 OneDrive。
          yt-dlp -f "bestvideo[vcodec^=avc1]+bestaudio[acodec^=mp4a]/best[ext=mp4]/best" \
            --merge-output-format mp4 --remux-video mp4 --force-overwrites \
            --download-archive "$YT_DLP_ARCHIVE" --playlist-end 50 \
            -o "$DOWNLOAD_TMP/%(title)s-%(id)s.%(ext)s" \
            --exec "bash ${GITHUB_WORKSPACE}/.github/scripts/telegram/process_ph_download.sh {} %(webpage_url)q" \
            -i "https://www.pornhub.com/users/${{ secrets.PORNHUBNAME }}/videos/favorites" || echo "url不存在"
          rm -f "$YT_DLP_ARCHIVE"

          # 损坏文件通知（process_ph_download.sh 验证失败并丢弃的文件；统一 HTML 版式）
          if [ -f "$DOWNLOAD_TMP/corrupted.txt" ]; then
            source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"
            CORRUPTED_COUNT=$(wc -l < "$DOWNLOAD_TMP/corrupted.txt")
            CORRUPTED_LIST=$(cat "$DOWNLOAD_TMP/corrupted.txt")
            msg=""
            tg_add_title msg "🗑️ ph-dl 下载阶段损坏视频"
            tg_add_kv msg "损坏数量" "${CORRUPTED_COUNT} 个"
            tg_add_section msg "📋 文件列表"
            # tree_code_fold: 逐行转义 + 超 8 条折叠（裸文件名未转义会触发 400 整条退化）
            tg_add_block msg "$(tree_code_fold "$CORRUPTED_LIST")"
            tg_add_footer msg
            send_tg_chunked "$msg"
          fi
          rm -rf "$DOWNLOAD_TMP"

          AFTER_COUNT=$(wc -l < archive.txt 2>/dev/null || echo 0)
          DOWNLOAD_COUNT=$((AFTER_COUNT - BEFORE_COUNT))
          if [ "$DOWNLOAD_COUNT" -lt 0 ]; then
            DOWNLOAD_COUNT=0
          fi
          echo "本次新增下载数量: ${DOWNLOAD_COUNT}"
          echo "favorites 文件夹 下载后大小"
          AFTER_SIZE=$(du -sh . | cut -f1)
          echo "$AFTER_SIZE"

          # 计算视频文件统计（总数 / 已上传 / 待上传 / 失败上传）
          # 使用外部 Python 脚本避免内联 heredoc 与 YAML 的歧义
          TARGET_DIR="$HOME/onedrive/0/j-1024j-视频-pornhub-favorites"
          VIDEO_STATS=$(python3 "${GITHUB_WORKSPACE}/.github/scripts/telegram/compute_video_stats.py" "$TARGET_DIR" || echo "0|0|0|0|0")
          TOTAL_VIDEOS=$(echo "$VIDEO_STATS" | cut -d'|' -f1)
          UPLOADED_VIDEOS=$(echo "$VIDEO_STATS" | cut -d'|' -f2)
          PENDING_VIDEOS=$(echo "$VIDEO_STATS" | cut -d'|' -f3)
          FAILED_VIDEOS=$(echo "$VIDEO_STATS" | cut -d'|' -f4)
          CORRUPT_VIDEOS=$(echo "$VIDEO_STATS" | cut -d'|' -f5)
          VIDEO_SUMMARY="视频文件 ${TOTAL_VIDEOS} 条，已上传 ${UPLOADED_VIDEOS} 条，待上传 ${PENDING_VIDEOS} 条，损坏已跳过 ${CORRUPT_VIDEOS} 条，失败上传 ${FAILED_VIDEOS} 条"
          echo "$VIDEO_SUMMARY"

          # 强制将挂载目录中 appended 的 uploaded_videos.json 写回远端（VFS full 模式写回是后台异步，避免 VM 销毁前丢数据）
          TARGET_DIR="$HOME/onedrive/0/j-1024j-视频-pornhub-favorites"
          if [ -f "$TARGET_DIR/uploaded_videos.json" ] && [ -s "$TARGET_DIR/uploaded_videos.json" ]; then
            cp "$TARGET_DIR/uploaded_videos.json" /tmp/uploaded_videos.final.txt
            if rclone copyto /tmp/uploaded_videos.final.txt "$SOURCE_REMOTE/uploaded_videos.json" 2>/dev/null; then
              echo "uploaded_videos.json 已同步回远端 (size: $(wc -c < /tmp/uploaded_videos.final.txt))"
            else
              echo "WARN: uploaded_videos.json 回写远端失败，下次运行时可能重复上传部分视频"
            fi
            rm -f /tmp/uploaded_videos.final.txt
          fi

          if [ -f new_downloads_list.txt ]; then
            FILE_LIST=$(cat new_downloads_list.txt)
          else
            FILE_LIST="无"
          fi

          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"
          # 统一 HTML 版式 + 统一收尾区（散装消息合并为一条，明细树形列出）
          msg=""
          tg_add_title msg "✅ ph-dl 下载任务完成"
          tg_add_kv msg "视频文件" "${TOTAL_VIDEOS} 条"
          tg_add_kv msg "库存状态" "已上传 ${UPLOADED_VIDEOS} · 待上传 ${PENDING_VIDEOS} · 失败 ${FAILED_VIDEOS}"
          if [ "${CORRUPT_VIDEOS:-0}" -gt 0 ]; then
            tg_add_kv msg "损坏已跳过" "${CORRUPT_VIDEOS} 条"
          fi
          tg_add_kv msg "本次下载" "${DOWNLOAD_COUNT} 个视频"
          tg_add_kv msg "磁盘占用" "${BEFORE_SIZE} → ${AFTER_SIZE}"
          if [ "$FILE_LIST" != "无" ]; then
            tg_add_section msg "📋 本次新增"
            tg_add_block msg "$(tree_code_fold "$FILE_LIST")"
          fi
          tg_add_footer msg
          send_tg_chunked "$msg"
