            DOWNLOAD_COUNT=0
          fi
          echo "本次新增下载数量: ${DOWNLOAD_COUNT}"
          echo "favorites文件夹 下载后大小"
          AFTER_SIZE=$(du -sh . | cut -f1)
          echo "$AFTER_SIZE"
          
          if [ -f new_downloads_list.txt ]; then
            FILE_LIST=$(cat new_downloads_list.txt)
          else
            FILE_LIST="无"
          fi
          
          MSG="github p站下载任务执行完毕 favorites
          本次下载: ${DOWNLOAD_COUNT} 个视频
          下载前大小: ${BEFORE_SIZE}
          下载后大小: ${AFTER_SIZE}
          任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          文件列表:
          ${FILE_LIST}"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="${MSG}"
