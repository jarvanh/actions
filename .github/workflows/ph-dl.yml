name: ph-dl

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      clean_all:
        description: '清理 Telegram 频道所有视频并重置 uploaded_old_videos.txt'
        type: boolean
        default: false
        required: false
  watch:
    types: started

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: rclone-install
        run: |
          # 安装 rclone
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          cd rclone-*-linux-amd64
          sudo mv rclone /usr/bin
          sudo chmod +x /usr/bin/rclone
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          # 写配置文件
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG
          EOF
      - name: rclone-run
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          mkdir ~/onedrive
          nohup rclone --vfs-cache-mode full mount onedrive: ~/onedrive &
          echo "~/onedrive 文件列表"
          cd ~/onedrive
          ls
      - name: check duplicate videos by ID and dedupe by hash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TARGET_DIR=~/onedrive/0/j-1024j-视频-pornhub-favorites
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory not found: $TARGET_DIR"
            exit 0
          fi
          cd "$TARGET_DIR"
          # 提取文件名中 [...] 内的 ID，统计重复项
          declare -A ID_FILES
          while IFS= read -r file; do
            id=$(echo "$file" | grep -oE '\[[a-f0-9]+\]' | tail -n1)
            [ -n "$id" ] || continue
            if [ -n "${ID_FILES[$id]}" ]; then
              ID_FILES[$id]+=$'\n'"$file"
            else
              ID_FILES[$id]="$file"
            fi
          done < <(find . -maxdepth 1 -type f -name '*.mp4' -print | sed 's|^\./||' | sort)

          DUP_DETAILS=""
          DUP_COUNT=0
          REMOVED_COUNT=0
          REMOVED_LIST=""
          DIFFERENT_LIST=""
          for id in "${!ID_FILES[@]}"; do
            files="${ID_FILES[$id]}"
            count=$(echo "$files" | wc -l)
            if [ "$count" -gt 1 ]; then
              DUP_COUNT=$((DUP_COUNT + 1))
              # 按修改时间从新到旧排序，保留最晚下载的文件作为基准
              sorted_files=$(echo "$files" | xargs -d '\n' ls -t 2>/dev/null)
              kept=$(echo "$sorted_files" | head -n1)
              kept_hash=$(sha1sum "$kept" | cut -d' ' -f1)
              group_removed=""
              group_kept=""
              while IFS= read -r f; do
                [ "$f" = "$kept" ] && continue
                f_hash=$(sha1sum "$f" | cut -d' ' -f1)
                if [ "$f_hash" = "$kept_hash" ]; then
                  # 哈希一致，删除重复文件
                  rm -f "$f"
                  REMOVED_COUNT=$((REMOVED_COUNT + 1))
                  REMOVED_LIST+="- ${f}（与 ${kept} 哈希一致: ${kept_hash:0:12}）"$'\n'
                  group_removed+="${f}"$'\n'
                else
                  # 哈希不同，保留并标记
                  DIFFERENT_LIST+="- ${f}（哈希 ${f_hash:0:12} ≠ 保留 ${kept_hash:0:12}）"$'\n'
                  group_kept+="${f}"$'\n'
                fi
              done <<< "$sorted_files"
              DUP_DETAILS+="🔖 ID ${id}（${count} 个，保留: ${kept}）"$'\n'"${group_removed}${group_kept}"$'\n'
            fi
          done

          # 去重日志输出到 Actions 日志，便于追溯
          echo "=== ph-dl 去重日志 ==="
          echo "重复 ID 数量: ${DUP_COUNT}"
          echo "删除重复文件数量: ${REMOVED_COUNT}"
          echo "[删除的重复文件（哈希一致）]"
          echo "${REMOVED_LIST}"
          echo "[哈希不同已保留]"
          echo "${DIFFERENT_LIST}"

          # 发送通知
          if [ "$DUP_COUNT" -gt 0 ]; then
            MSG="🔍 ph-dl 重复视频检测与去重"$'\n\n'"📁 目录: j-1024j-视频-pornhub-favorites"$'\n'"🔢 重复 ID 数量: ${DUP_COUNT}"$'\n'"🗑️ 删除重复: ${REMOVED_COUNT}"$'\n\n'"📋 详情:"$'\n'"${DUP_DETAILS}"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MSG}"
          else
            echo "No duplicate video IDs found."
          fi

      - name: cleanup yt-dlp fragment files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TARGET_DIR=~/onedrive/0/j-1024j-视频-pornhub-favorites
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory not found: $TARGET_DIR"
            exit 0
          fi
          cd "$TARGET_DIR"
          # 查找 yt-dlp 残留的分片文件：*.mp4-Frag* 和 *.part-Frag*
          mapfile -t FRAG_FILES < <(find . -maxdepth 1 -type f \( -name '*.mp4-Frag*' -o -name '*.part-Frag*' \) -print)
          FRAG_COUNT=${#FRAG_FILES[@]}
          if [ "$FRAG_COUNT" -eq 0 ]; then
            echo "No fragment files found."
            exit 0
          fi
          # 收集文件名与大小
          FILE_DETAILS=""
          for f in "${FRAG_FILES[@]}"; do
            fname=$(basename "$f")
            fsize=$(du -h "$f" | cut -f1)
            FILE_DETAILS="${FILE_DETAILS}🗑 ${fname} (${fsize})
          "
          done
          # 清理
          find . -maxdepth 1 -type f \( -name '*.mp4-Frag*' -o -name '*.part-Frag*' \) -delete
          echo "Cleaned up ${FRAG_COUNT} fragment files."
          # 发送通知
          MSG="🧹 ph-dl 清理 yt-dlp 分片文件"$'\n\n'"📁 目录: j-1024j-视频-pornhub-favorites"$'\n'"🗑️ 清理数量: ${FRAG_COUNT}"$'\n\n'"📋 文件列表:"$'\n'"${FILE_DETAILS}"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}"

      - name: clean telegram channel and reset upload archive
        if: github.event.inputs.clean_all == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip3 install telethon
          # 删除 Telegram 频道所有消息
          python3 ${GITHUB_WORKSPACE}/.github/scripts/clean_channel.py "${TELEGRAM_CHANNEL_ID}"
          # 清空 uploaded_old_videos.txt，使旧视频重新上传
          TARGET_DIR=~/onedrive/0/j-1024j-视频-pornhub-favorites
          if [ -d "$TARGET_DIR" ]; then
            : > "$TARGET_DIR/uploaded_old_videos.txt"
            echo "Cleared uploaded_old_videos.txt"
          fi
          # 发送通知
          MSG="🧹 ph-dl 频道清理完成"$'\n\n'"📁 已清空 Telegram 频道所有视频"$'\n'"📄 已重置 uploaded_old_videos.txt"$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}"

      - name: transcode existing videos for Telegram compatibility
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          TARGET_DIR=~/onedrive/0/j-1024j-视频-pornhub-favorites
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory not found: $TARGET_DIR"
            exit 0
          fi
          cd "$TARGET_DIR"

          CONVERTED=0
          FASTSTART=0
          SKIPPED=0
          FAILED=0
          TOTAL=0
          CONVERTED_LIST=""
          FAILED_LIST=""

          for file in *.mp4; do
            [ -e "$file" ] || continue
            TOTAL=$((TOTAL + 1))
            # 读取视频和音频编码
            vcodec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$file" 2>/dev/null)
            acodec=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$file" 2>/dev/null)

            if [ -z "$vcodec" ]; then
              echo "Skip (cannot read codec): $file"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if [ "$vcodec" = "h264" ] && [ "$acodec" = "aac" ]; then
              # 已是 H.264+AAC，仅添加 faststart（重排 moov atom 到文件头部，秒级完成）
              echo "Faststart: $file (vcodec=$vcodec, acodec=$acodec)"
              if ffmpeg -y -i "$file" -c copy -movflags +faststart "${file}.tmp" 2>/dev/null; then
                mv "${file}.tmp" "$file"
                FASTSTART=$((FASTSTART + 1))
              else
                rm -f "${file}.tmp"
                FAILED=$((FAILED + 1))
                FAILED_LIST+="- ${file}（faststart 失败）"$'\n'
              fi
            else
              # 非 H.264+AAC，需重编码（如 VP9/Opus 等）
              echo "Convert: $file (vcodec=$vcodec, acodec=$acodec) → h264/aac"
              if ffmpeg -y -i "$file" -c:v libx264 -preset fast -c:a aac -movflags +faststart "${file}.tmp" 2>/dev/null; then
                mv "${file}.tmp" "$file"
                CONVERTED=$((CONVERTED + 1))
                CONVERTED_LIST+="- ${file}（${vcodec}/${acodec} → h264/aac）"$'\n'
              else
                rm -f "${file}.tmp"
                FAILED=$((FAILED + 1))
                FAILED_LIST+="- ${file}（转码失败）"$'\n'
              fi
            fi
          done

          echo "=== 转码统计 ==="
          echo "总计: ${TOTAL}，重编码: ${CONVERTED}，仅 faststart: ${FASTSTART}，跳过: ${SKIPPED}，失败: ${FAILED}"

          # 发送通知
          if [ "$TOTAL" -gt 0 ] && { [ "$CONVERTED" -gt 0 ] || [ "$FAILED" -gt 0 ] || [ "$FASTSTART" -gt 0 ]; }; then
            MSG="🔄 ph-dl 旧视频转码完成"$'\n\n'"📁 目录: j-1024j-视频-pornhub-favorites"$'\n'"📊 总计: ${TOTAL}"$'\n'"🎬 重编码: ${CONVERTED}"$'\n'"⚡ 仅 faststart: ${FASTSTART}"$'\n'"⏭️ 跳过: ${SKIPPED}"$'\n'"❌ 失败: ${FAILED}"
            if [ -n "$CONVERTED_LIST" ]; then
              MSG+=$'\n\n'"📋 重编码列表:"$'\n'"${CONVERTED_LIST}"
            fi
            if [ -n "$FAILED_LIST" ]; then
              MSG+=$'\n\n'"❌ 失败列表:"$'\n'"${FAILED_LIST}"
            fi
            MSG+=$'\n'"🔗 任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MSG}"
          fi

      - name: send old videos to telegram channel
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip3 install telethon
          cd ~/onedrive/0/j-1024j-视频-pornhub-favorites 2>/dev/null || exit 0
          ARCHIVE_FILE="uploaded_old_videos.txt"
          touch "$ARCHIVE_FILE"
          FAILED_FILES=""
          TOTAL=0
          SKIPPED=0
          SUCCESS=0
          FAILED=0
          # 按文件更新时间从旧到新排序上传（使用进程替换以便 while 循环内变量可持久化）
          while IFS= read -r file; do
            [ -e "$file" ] || continue
            TOTAL=$((TOTAL + 1))
            # 跳过已成功上传的文件
            if grep -Fxq "$file" "$ARCHIVE_FILE" 2>/dev/null; then
              echo "Skip (already uploaded): $file"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            FILESIZE_HUMAN=$(du -h "$file" | cut -f1)
            if python3 ${GITHUB_WORKSPACE}/.github/scripts/upload_video.py "$file" "${TELEGRAM_CHANNEL_ID}" "Old video: ${file} (${FILESIZE_HUMAN})"; then
              echo "$file" >> "$ARCHIVE_FILE"
              SUCCESS=$((SUCCESS + 1))
            else
              FAILED=$((FAILED + 1))
              FAILED_FILES="${FAILED_FILES}- ${file} (${FILESIZE_HUMAN})
          "
            fi
            sleep 5 # 防止触发速率限制
          done < <(ls -tr *.mp4 2>/dev/null)

          echo "总计: ${TOTAL}，跳过: ${SKIPPED}，成功: ${SUCCESS}，失败: ${FAILED}"

          # 失败汇总通知
          if [ "$FAILED" -gt 0 ]; then
            MSG="ph-dl 旧视频上传失败汇总"$'\n'"总计: ${TOTAL}，跳过: ${SKIPPED}，成功: ${SUCCESS}，失败: ${FAILED}"$'\n'"失败文件:"$'\n'"${FAILED_FILES}"$'\n'"任务链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${MSG}"
          fi

      - name: run ph-dl favorites
