          if [ -f archive.txt ]; then
            awk -F'|' '{
              if (NF >= 2) { print }                              # 新格式: id|filename|url
              else if ($1 ~ /^[Pp]ornhub[[:space:]].+/) {         # 旧格式: Pornhub ph5fdf9f06b965d
                id=$1; sub(/^[Pp]ornhub[[:space:]]+/, "", id); print id "||"
              } else if ($1 != "") { print $1 "||" }              # 仅 ID
            }' archive.txt > archive.txt.migrated
            mv archive.txt.migrated archive.txt
          fi
