# 测试载体（独立于所有业务 workflow）
#
# 为什么单独一个 workflow:
#   · 业务 workflow（openlist / emby / proxy-speedtest …）跑真实任务、动辄数小时，
#     把测试塞进去等于"想跑测试就得跑一遍业务"；
#   · 本机跑测试要吃 CPU（openlist 全套串行约 1–2 分钟），而且 macOS / 本机沙箱会带来
#     一批**环境假红**：无 `date -d`（marker_skip_guards）、`wc` 前导空格
#     （sync_trend_budget）、无 docker（truth）、沙箱拦子进程（progress_no_orphans）。
#     ubuntu runner 上这些都不存在，基线因此更硬（本域套件全绿）。
# 结构: 按「域」分组，每域一个 job；新增域照抄同构 job 即可（域内一律串行）。
# 现状: 三个 job —— openlist、proxy-speedtest 与 notify（通知版式/机械校验）。
#       新增域时：在 inputs.domain 的说明里列上它、加一个同构 job（`if` 判 domain）。
# 触发: 只 workflow_dispatch —— 仓库既有约定是「无任何 workflow 监听 push/pull_request」
#       （main 有并行推送，加了会产生大量冗余运行）。需要验证时手动 dispatch。
name: tests

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "只跑指定域（留空 = 全部：openlist / proxy-speedtest / notify）"
        required: false
        type: string
        default: ""

# 独立并发组: 绝不与 openlist-singleton / openlist-diag 等业务组互等
concurrency: tests

permissions:
  contents: read

jobs:
  openlist:
    if: ${{ github.event.inputs.domain == '' || github.event.inputs.domain == 'openlist' }}
    runs-on: ubuntu-latest
    # 全套串行；本机约 1–2 分钟，runner 上含 setup 给足余量
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: 静态检查（bash -n 全部脚本 + workflow YAML 解析）
        run: |
          set -u
          fail=0
          n=0
          while IFS= read -r f; do
            n=$((n + 1))
            bash -n "$f" || { echo "❌ bash -n 失败: $f"; fail=1; }
          done < <(find .github/scripts -name '*.sh' -type f | sort)
          echo "bash -n 通过 $n 个脚本"
          # 注意: 块标量内的多行代码必须整段缩进到块层级（否则 YAML 在顶格处断句）——
          # 块标量会剥掉最小公共缩进，所以 python 代码传进去后仍是顶格的。
          python3 -c "
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
              except Exception as e:
                  print('❌ YAML 解析失败: ' + f + ': ' + str(e)); bad = 1
          print('YAML 全部通过' if not bad else 'YAML 有失败')
          sys.exit(bad)
          "
          [ "$fail" -eq 0 ] || exit 1

      - name: 环境自检（测试依赖是否齐备）
        run: |
          set -u
          echo "bash:    $(bash --version | head -1)"
          echo "python3: $(python3 --version 2>&1)"
          echo "jq:      $(jq --version 2>&1 || echo 不可用)"
          echo "md5sum:  $(md5sum --version 2>&1 | head -1)"
          echo "docker:  $(docker --version 2>&1 || echo '不可用（truth 套件会红）')"
          echo "date -d: $(date -d '@0' '+%Y-%m-%d' 2>/dev/null || echo '不可用（marker_skip_guards 会红）')"

      - name: rclone-install
        run: |
          set -e
          # test_restore_real_local.sh 需要**真 rclone 二进制**（local 远端，真搬文件）。
          # 它只用 local 远端、不碰任何云凭据 ⇒ 只 install 不 config（无需 RCLONE secret）。
          # 没有 install 之前该套件在 CI 恒走 SKIP 分支，场景 1-8 从未真跑过。
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install

      - name: openlist 回归套件（串行）
        run: |
          set -u
          cd .github/scripts/openlist/tests || { echo "❌ 测试目录不存在"; exit 1; }
          WORK=/tmp/ol_tests
          rm -rf "$WORK"; mkdir -p "$WORK"
          pass=0; fail=0; failed=""
          # 串行是硬要求: 并行会多出已知的 T5 时序假红（progress_no_orphans）
          # ⚠️ 该套件还有**偶发**时序红（即使串行）: 2026-09-16 同一 commit 上 4 次里 2 次
          #    `T4 8 路并发刷新后无孤儿` 判失败、2 次全绿（本机对拍 HEAD 亦曾 1 FAIL）
          #    ⇒ 见到它红先重跑一次再排查；持续红才当回归（并发刷新本身是竞态，
          #    8 路并发下"发送已记账但删除未完成"的窗口可能被踩到）
          # ⚠️ runner 的 bash 带 -e: 命令替换必须用 if 包住，否则**第一套失败就直接终止
          #    整个 step**，而且因为输出还没刷出，日志里一片空白（2026-09-16 实测踩到，
          #    表现为"74 秒后 exit 1 且零输出"）。
          for f in test_*.sh; do
            if out=$(bash "$f" </dev/null 2>&1); then rc=0; else rc=$?; fi
            printf '%s\n' "$out" > "$WORK/$f.out"
            # 边跑边打: 万一中途异常退出，至少能看到已跑完的部分
            printf '%-46s EXIT=%s\n' "$f" "$rc" | tee -a "$WORK/summary.txt"
            if [ "$rc" -eq 0 ]; then pass=$((pass + 1)); else fail=$((fail + 1)); failed="$failed $f"; fi
          done
          echo "=== 汇总: PASS=$pass FAIL=$fail（共 $((pass + fail)) 套）==="

          # 红线: 任何测试输出里出现 command not found 即失败（说明测试在调不存在的命令）
          cnf=$(grep -h "command not found" "$WORK"/*.out 2>/dev/null | wc -l | tr -d ' ')
          echo "=== command not found 命中: $cnf（必须为 0）==="
          if [ "$cnf" -ne 0 ]; then
            echo "❌ 出现 command not found:"
            grep -h "command not found" "$WORK"/*.out | sort -u | head -20
            exit 1
          fi

          # 失败套件: 打印输出尾部便于直接定位
          if [ "$fail" -ne 0 ]; then
            for f in $failed; do
              echo ""
              echo "########## $f 输出尾部（最后 30 行）##########"
              tail -30 "$WORK/$f.out"
            done
            echo ""
            echo "❌ 有 $fail 套失败"
            exit 1
          fi
          echo "✅ openlist 回归套件全绿（$pass/$pass）"

  proxy-speedtest:
    # 与 openlist 同构：域内串行、按 domain 选择。留空 = 两个域都跑。
    if: ${{ github.event.inputs.domain == '' || github.event.inputs.domain == 'proxy-speedtest' }}
    runs-on: ubuntu-latest
    # 自检本身 ~15 秒（含两个真 curl 端到端，各 2–3 秒），给足 setup 余量
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        # 自检要 import speedtest_common / gist_nodes（它们 import yaml）；
        # 业务 workflow 也是 pip install pyyaml，这里保持同一份依赖口径。
        run: pip install pyyaml

      - name: 静态检查（py_compile 全部脚本 + workflow YAML 解析）
        run: |
          set -u
          fail=0
          n=0
          while IFS= read -r f; do
            n=$((n + 1))
            python3 -m py_compile "$f" || { echo "❌ py_compile 失败: $f"; fail=1; }
          done < <(find .github/scripts/proxy-speedtest -name '*.py' -type f | sort)
          echo "py_compile 通过 $n 个脚本"
          # 只解析本域的四个 workflow：它们的 block scalar / env 表达式最容易写坏，
          # 而业务 workflow 改动与测试载体无关（全量解析留给业务 workflow 自己的运行）。
          python3 -c "
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/proxy-speedtest-*.yml')):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
              except Exception as e:
                  print('❌ YAML 解析失败: ' + f + ': ' + str(e)); bad = 1
          print('proxy-speedtest YAML 全部通过' if not bad else 'proxy-speedtest YAML 有失败')
          sys.exit(bad)
          "
          [ "$fail" -eq 0 ] || exit 1

      - name: proxy-speedtest 回归套件（串行）
        run: |
          set -u
          cd .github/scripts/proxy-speedtest || { echo "❌ 测试目录不存在"; exit 1; }
          WORK=/tmp/ps_tests
          rm -rf "$WORK"; mkdir -p "$WORK"
          pass=0; fail=0; failed=""
          # 串行是硬要求：`test_download_window.py` 会起本地限速 HTTP 服务，
          # 并行跑会让端口/时序互相干扰（与本域其余套件的耗时判据同源）。
          #
          # PYTHONPATH=. ：`test_normalize_proxy_scalars.py` 是 pytest 风格（直接
          # `from speedtest_common import ...`，没有自行插 sys.path）。本载体用
          # `python3 文件` 直跑，不设它会在 import 阶段就 ModuleNotFoundError。
          # 注意 runner 的 bash 带 -e：命令替换必须用 if 包住，否则第一套失败就
          # 直接终止整个 step 且输出刷不出来（openlist job 里踩过同样的问题）。
          for f in tests/test_*.py; do
            if out=$(PYTHONPATH=. python3 "$f" </dev/null 2>&1); then rc=0; else rc=$?; fi
            printf '%s\n' "$out" > "$WORK/$(basename "$f").out"
            printf '%-46s EXIT=%s\n' "$f" "$rc" | tee -a "$WORK/summary.txt"
            if [ "$rc" -eq 0 ]; then pass=$((pass + 1)); else fail=$((fail + 1)); failed="$failed $f"; fi
          done
          echo "=== 汇总: PASS=$pass FAIL=$fail（共 $((pass + fail)) 套）==="

          # 红线：任何测试输出里出现 ModuleNotFoundError 即失败——说明 PYTHONPATH /
          # 依赖装漏了，而不是某条判据真的红（这两类失败必须区分开）。
          mne=$(grep -h "ModuleNotFoundError" "$WORK"/*.out 2>/dev/null | wc -l | tr -d ' ')
          echo "=== ModuleNotFoundError 命中: $mne（必须为 0）==="
          if [ "$mne" -ne 0 ]; then
            echo "❌ 有测试因缺模块失败:"
            grep -h "ModuleNotFoundError" "$WORK"/*.out | sort -u | head -10
            exit 1
          fi

          if [ "$fail" -ne 0 ]; then
            for f in $failed; do
              echo ""
              echo "########## $f 输出尾部（最后 30 行）##########"
              tail -30 "$WORK/$(basename "$f").out"
            done
            echo ""
            echo "❌ 有 $fail 套失败"
            exit 1
          fi
          echo "✅ proxy-speedtest 回归套件全绿（$pass/$pass）"

  notify:
    # 通知域：版式渲染自检 + 审计清单 1–15 项机械校验。
    # 无外部依赖（只用 bash/python3 + 仓库内脚本），因此不需要 setup / 凭据。
    if: ${{ github.event.inputs.domain == '' || github.event.inputs.domain == 'notify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: 渲染预览（版式构件自检）
        # 转义/空行/条目粘连/子行对齐都在这里验；失败即版式构件被改坏
        run: bash skills/telegram-notify-audit/scripts/render_preview.sh

      - name: 机械校验（审计清单 1–15 项）
        # 粗体/平铺/半角冒号/紧凑时长/curl 直发/分隔线/TG_RUN_URL/树形前缀/
        # 分节计数/助手表/函数体内 source/收尾区覆盖/🕒/UTC；有 FAIL 退出码 1
        run: bash skills/telegram-notify-audit/scripts/list_notify.sh --check

      - name: 通知清单（打印，便于对照本次改动）
        run: bash skills/telegram-notify-audit/scripts/list_notify.sh | tail -30
