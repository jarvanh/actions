# openlist 一键还原 try run（只读预演）
#
# 为什么单独一个 workflow（不塞进 openlist.yml 的 run_mode）:
#   · **副作用边界完全不同**: 主轮会写目标端（moveto / copyto / 删分卷）、发通知、
#     自续接力；本 workflow **一个字节都不写**。混在同一个 run_mode 里，"这次到底写不写"
#     就全靠记住选了哪个选项 —— 而这种事迟早记错一次。
#   · **并发语义不同**: 它是只读的，可以同时跑（独立 concurrency 组），不必像主轮那样
#     单例串行；也不该占用主轮的 6h 预算（单次分钟级）。
#   · **使用时机不同**: 真跑一键还原之前先看一眼，或 marker 攒了一段时间想核对
#     "这些条目会被还原到哪"，都不该触发一整个同步轮次。
#
# 它回答什么（每条修复条目给出三条完整路径 + 一条交叉核对路径）:
#   ① 备份文件（目标端现存形态）      = <dest_path>/<alternative>
#   ② marker 记录的原文件             = <dest_path>/<original>
#   ③ 实际执行还原的完整路径           = 生产那条命令真正落地的路径
#        move 类  → rclone moveto 的 dst（= ②，服务端一步改名归位）
#        split 类 → 本地合卷解压产物 rclone copyto 的 dst（= ②，落点不变）
#        noop     → 原路径原名，只校验存在，不搬任何东西
#   ④ 源端原路径（灾难恢复口径）       = <source_path>/<original>
#   另给出"备份文件在不在"、"原路径是不是已经存在"的核对结果。
#
# 零写入是**结构性**的，不是"小心一点": 预演模块所有远端调用走只读白名单
#   （只放行 ls/lsd/lsf/lsl/lsjson/cat/size/version），写子命令一律被拒绝执行，
#   由 test_restore_tryrun.sh 场景 4/5 锁住。
#   ⚠️ 唯一的例外是 reset_markers 入参: 它会删 onedrive:/logs/sync_state 下的 marker
#   （先归档）。它不是预演的一部分 —— 选中后**独占本次运行**并提前退出，日志形态与
#   只读轮完全不同，避免"这次到底删没删"要靠回忆选项。
#
# 安全边界（与 openlist-diag.yml 同口径）: 不装 cloudflared、不碰隧道、不回传 DB；
#   容器名固定 openlist，拉的是 dropbox 上的生产配置副本（`--restart=no`，用完即删）。
#
# 什么时候可以不起容器: check_exists=否 时只做 marker 推导（秒级），不访问目标端
#   ⇒ 三条路径照样准确，只是"在不在"会显示"未核对"。
name: openlist-restore-tryrun

on:
  workflow_dispatch:
    inputs:
      task:
        description: "任务名（marker 文件名前缀，同生产 restore_task；留空/all = 全部 marker）"
        required: false
        type: string
        default: "all"
      within_days:
        description: "只预演最近 N 天产生的 marker（0/留空 = 全量，默认）。这是相对天数，会混入语义变更提交之前写的 marker；要切出全都是新语义写的那批，请用下面的 since"
        required: false
        type: string
        default: "0"
      since:
        description: "绝对时间下界（UTC，YYYY-MM-DD 或 YYYY-MM-DDTHH:MM:SS；留空 = 不限）。只看该时刻之后产生的 marker —— 判新旧 marker 是否不兼容必须用这个: 最近一次改写 marker 语义的是 e90118e 2026-09-19T11:03:00Z（move 改 moveto），之前的 marker 其还原脚本是错的 move。与 within_days 同时给时取更严者"
        required: false
        type: string
        default: ""
      check_exists:
        description: "核对目标端文件在不在（需拉起 OpenList 容器，约 +6 分钟）: 否 = 只做 marker 推导，秒级出结果、不起容器"
        required: false
        type: choice
        default: "是"
        options:
          - "是"
          - "否"
      send_tg:
        description: "发送 Telegram 汇总"
        required: false
        type: choice
        default: "是"
        options:
          - "是"
          - "否"
      dump_marker:
        description: "marker 原文探针（只读，填了就只做它、不做预演）: 给出 marker 名的关键字（子串匹配），dump 其 source_path / dest_path / last_success / 远端 ModTime / 前几条 original —— 回答「这条修复记录是什么时候、由哪个目录对写下的」（marker 只增不减，老记录会一直躺在里面）"
        required: false
        type: string
        default: ""
      reset_markers:
        description: "⚠️ marker 归档 + 清空（**会删数据**，填了就只做它、不做预演）。填 dry = 只打印将做什么；填 commit = 真删（先打包归档到 dropbox、归档失败则拒绝清空）。用于串写修复后的历史脏数据清洗"
        required: false
        type: choice
        default: "关"
        options:
          - "关"
          - "dry"
          - "commit"

# 独立并发组: 只读预演可与主轮并行，不与 openlist-singleton / -diag / -fix-check 互等。
# 「与主轮错开」那条纪律是为**吞吐测量**与**在途 sync / 容器重启窗口**立的（主轮在传会把
# 各档位压平、容器重启会挂起在途同步），try run 不测速、不传数据、不动任何共享容器
# （起的是自己的 data.db 副本且从不回传），故不适用。唯一代价是共享网盘账号的列举限流，
# 靠下面 job 里「不并发列举」的取舍压到最低。
concurrency: openlist-restore-tryrun

jobs:
  tryrun:
    runs-on: ubuntu-latest
    # 实测（run 35478771033，4684 条）: 拉库+容器就绪 2.5 分钟 + 主循环 37.5 分钟
    # （逐条真实远端列举，约 0.48s/条）。40 分钟是 diag/fix-check 的定点诊断口径，
    # 照搬到全量核对会正好卡在边界被硬杀（连 artifact 与 TG 汇总都来不及产出）。
    # 300 = GitHub 每 job 上限 360 之内留 60 分钟给收尾/上传，且条目数还会继续涨
    # （每轮同步都新增 marker）。刻意**不**用并发列举提速：会把共享网盘账号的
    # 限流压力翻几倍，拖慢并行中的主轮。
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENLIST_ADMIN_PASSWORD: ${{ secrets.OPENLIST_ADMIN_PASSWORD }}
      TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: rclone-install
        run: |
          set -e
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install

      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          # 与主 workflow 同一套配置来源: 幂等（配置一致时无变更），主 run 每轮都在做
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config

      - name: 验证远端连通
        run: |
          rclone lsf dropbox: | head -5

      # ⚠️ 本段与 openlist-diag.yml / openlist-fix-check.yml 的「拉起 OpenList 容器」
      #    **同源**（逐行等价）—— 三处都改时必须同步，否则各自读的不是同一份配置
      #    （"用不同的库验证等于测了个别的东西"）。
      #    只在 check_exists=是 时执行: 预演的三条路径只依赖 marker，核对存在性才需要
      #    访问 openlist: 远端（该远端是容器内 WebDAV，容器不在就连不上）。
      #    reset_markers 选中时**也不起容器**: 归档+清空只碰 onedrive:/logs/sync_state，
      #    用不到 OpenList；白等 6 分钟拉库还会让"这轮到底做没做删除"更难一眼看清。
      - name: 拉起 OpenList 容器（只读核对副本）
        if: ${{ inputs.check_exists != '否' && inputs.reset_markers == '关' }}
        env:
          OL_CONTAINER: openlist
        run: |
          set -e
          docker rm -f "$OL_CONTAINER" 2>/dev/null || true
          sudo mkdir -p /opt/openlist-data
          sudo chmod 0777 /opt/openlist-data
          # 与主 workflow 完全相同的拉库口径（含排除项）
          rclone copy dropbox:self-hosted/openlist/data /opt/openlist-data \
            --exclude "data.db-wal" --exclude "data.db-shm" --exclude "data.db-journal" \
            --exclude "log/**" --exclude "temp/**"
          echo "拉取完成: $(ls -la /opt/openlist-data/ | tail -n +2 | wc -l) 个条目"
          docker run -d --restart=no -v /opt/openlist-data:/opt/openlist/data \
            -p 5244:5244 -e PUID=0 -e PGID=0 -e UMASK=022 \
            --name="$OL_CONTAINER" openlistteam/openlist:latest

      - name: 校验 OpenList 容器运行状态
        if: ${{ inputs.check_exists != '否' && inputs.reset_markers == '关' }}
        run: |
          set -e
          source "$GITHUB_WORKSPACE/.github/scripts/openlist/load_all.sh"
          echo "等待 OpenList 就绪..."
          if wait_openlist_ready; then
            echo "✅ OpenList 容器及 HTTP 服务正常就绪"
          else
            echo "❌ OpenList 容器未能就绪（预演仍会给出三条路径，但存在性会显示'未核对'）"
          fi

      - name: 运行一键还原 try run（只读预演）
        env:
          # inputs 一律经 env 传入（README「注入面」: 不做 ${{ }} 直接内插 bash）
          TRYRUN_TASK_INPUT: ${{ inputs.task }}
          TRYRUN_DAYS_INPUT: ${{ inputs.within_days }}
          TRYRUN_SINCE_INPUT: ${{ inputs.since }}
          TRYRUN_CHECK_INPUT: ${{ inputs.check_exists }}
          TRYRUN_TG_INPUT: ${{ inputs.send_tg }}
          TRYRUN_DUMP_INPUT: ${{ inputs.dump_marker }}
          RESET_INPUT: ${{ inputs.reset_markers }}
        run: |
          # ── marker 归档 + 清空（不可逆运维动作，早于只读预演并直接退出）───────
          # 为什么"做完就 exit 0": 这次运行到底删不删数据，不能靠事后回忆"我当时
          # 选的是 dry 还是 commit"。删与不删两种运行必须在日志里长得完全不一样，
          # 所以 reset 一旦被选中就独占这次运行，绝不和只读预演混在一起。
          # 为什么默认 dry: 清空 marker = 丢弃全部修复记录的唯一副本，只能靠归档
          # 兜底；默认演练一遍，让人先看清楚"将要删多少个、归档到哪"。
          if [ "${RESET_INPUT:-关}" != "关" ]; then
            echo "=========== marker 归档 + 清空（RESET=${RESET_INPUT}）==========="
            case "$RESET_INPUT" in
              commit) bash "$GITHUB_WORKSPACE/.github/scripts/openlist/reset_markers.sh" --commit ;;
              *)      bash "$GITHUB_WORKSPACE/.github/scripts/openlist/reset_markers.sh" ;;
            esac
            echo "RESET_EXIT=$?" >> "$GITHUB_ENV"
            exit 0
          fi

          # 中文选项 → 脚本口径的映射放在 bash 里做（不在 YAML 里内插）
          export TRYRUN_TASK="${TRYRUN_TASK_INPUT:-all}"
          [ -z "$TRYRUN_TASK" ] && export TRYRUN_TASK=all
          # 时间窗: 默认 0（全量）；只认非负整数，其它输入一律回落全量
          # （宁可多跑，也不要因为一个拼错的数字静默筛掉 marker）
          case "${TRYRUN_DAYS_INPUT:-0}" in
            ''|*[!0-9]*) export TRYRUN_WITHIN_DAYS=0 ;;
            *)           export TRYRUN_WITHIN_DAYS="${TRYRUN_DAYS_INPUT}" ;;
          esac
          # 绝对下界: 原样传给脚本，由脚本解析并（解析失败时）大声告警回落
          # —— 不在 YAML 里校验格式，避免"这里静默吞掉、那里以为筛过了"
          export TRYRUN_SINCE="${TRYRUN_SINCE_INPUT:-}"
          case "$TRYRUN_CHECK_INPUT" in
            否|0|no) export TRYRUN_CHECK_EXISTS=0 ;;
            *)       export TRYRUN_CHECK_EXISTS=1 ;;
          esac
          case "$TRYRUN_TG_INPUT" in
            否|0|no) export TRYRUN_SEND_TG=0 ;;
            *)       export TRYRUN_SEND_TG=1 ;;
          esac
          # marker 原文探针: 原样传给脚本（空 = 不做，走常规预演）
          export TRYRUN_DUMP_MARKER="${TRYRUN_DUMP_INPUT:-}"
          export TRYRUN_WORK=/tmp/restore_tryrun

          source "$GITHUB_WORKSPACE/.github/scripts/openlist/load_all.sh"

          # 恒不因"有备份缺失"把 step 判红: 缺失是**预演结论**之一，红了会跳过
          # artifact 上传（同 openlist-diag / -fix-check 的取舍）
          set +e
          restore_try_run "$TRYRUN_TASK"
          _rc=$?
          set -e
          echo "TRYRUN_EXIT=$_rc" >> "$GITHUB_ENV"
          echo ""
          echo "退出码 ${_rc}（0=正常产出预演 · 2=marker 读不到等环境问题）"
          echo "=========== 预演报告（逐条三路径）==========="
          cat /tmp/restore_tryrun/tryrun.log 2>/dev/null || echo "(无报告文件)"

      - name: 上传预演报告
        if: always()
        # 报告已全量打印进 run 日志，artifact 只是方便取用；该 action 不可用时
        # 不该把整次预演判失败
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ol-restore-tryrun-report
          path: |
            /tmp/restore_tryrun/tryrun.log
            /tmp/restore_tryrun/tryrun.tsv
          if-no-files-found: warn
          retention-days: 7

      - name: 收尾（容器日志兜底 + 结论）
        if: always()
        env:
          OL_CONTAINER: openlist
        run: |
          docker logs "$OL_CONTAINER" 2>&1 | tail -40 || true
          docker rm -f "$OL_CONTAINER" 2>/dev/null || true
          # reset 运行（归档+清空）不走预演结论分支 —— 否则"清空成功"会被误报成
          # "环境问题"，把不可逆动作的结果盖掉
          if [ -n "${RESET_EXIT:-}" ]; then
            case "$RESET_EXIT" in
              0) echo "✅ 结论: marker 归档 + 清空完成（archive=${MARKER_RESET_ARCHIVE:-dropbox 默认路径}）" ;;
              *) echo "⚠️ 结论: marker 归档/清空未成功（退出码 ${RESET_EXIT}）—— 看上方脚本输出，marker 未被清空或已归档后再查" ;;
            esac
            exit 0
          fi
          case "${TRYRUN_EXIT:-unknown}" in
            0) echo "✅ 结论: 预演已产出 —— 看上方逐条三路径（① 备份文件 / ② marker 原文件 / ③ 实际落点）" ;;
            2) echo "⚠️ 结论: 环境问题（marker 目录读不到）—— 检查 rclone 配置与 onedrive:/logs/sync_state" ;;
            *) echo "⚠️ 结论: 脚本未产出退出码（可能 setup 阶段就失败）—— 看上方日志" ;;
          esac
          echo "ℹ️ 本轮全程只读: 源端与目标端均未写入/移动/删除任何数据"
