name: ctx-probe
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "run_started_at=[${{ github.run_started_at }}]"
          echo "event_sent_at=[${{ github.event.sent_at }}]"
          echo "head_commit_ts=[${{ github.event.head_commit.timestamp }}]"
          echo "event_name=[${{ github.event_name }}]"
