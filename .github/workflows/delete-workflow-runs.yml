name: Delete old workflow runs
on:
  schedule:
    - cron: "*/6 * * * *"
  workflow_dispatch:
  watch:
    types: started

jobs:
  del_runs:
    # 安全守卫（2026-09-08）：公开仓库任何人 star 都会触发 watch 事件——仅放行仓库本人，
    # schedule / workflow_dispatch 等其余触发方式不受影响
    if: github.event_name != 'watch' || github.actor == 'jarvanh'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
        with:
          token: ${{ secrets.PAT }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 0
