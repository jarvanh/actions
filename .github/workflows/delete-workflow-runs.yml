name: Delete old workflow runs
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      retain_days:
        description: '保留最近 N 天的运行记录，更旧的会被删除'
        type: number
        default: 7
        required: false
  watch:
    types: started

jobs:
  del_runs:
    # 安全守卫（2026-09-08）：公开仓库任何人 star 都会触发 watch 事件——仅放行仓库本人，
    # schedule / workflow_dispatch 等其余触发方式不受影响
    if: github.event_name != 'watch' || github.actor == 'jarvanh'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
        with:
          token: ${{ secrets.PAT }}
          repository: ${{ github.repository }}
          # schedule 触发时 inputs.retain_days 为空，|| 兜底保证默认 7 天
          retain_days: ${{ inputs.retain_days || 7 }}
          keep_minimum_runs: 0
