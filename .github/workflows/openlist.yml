# 备份文件到 openlist 中的网盘
# 脚本架构、模块划分、环境变量与命名约定见仓库根 README.md 的「OpenList 同步子系统」
name: openlist

on:
  workflow_dispatch:
    inputs:
      # ===== 运行模式（单选下拉，互斥）=====
      # 取代旧的 3 个 boolean（fix_test_mode / restore_fixed / restore_to_source），
      # 从 UI 上杜绝多开关误组合; ⚠️ 开头的项为还原类危险操作，排在末尾
      run_mode:
        description: "▶️ 运行模式（单选互斥）。⚠️ 标记的三项为危险操作: 会改写目标端或回传/删改源端，运行前请核对下方 restore_task 任务名"
        required: true
        type: choice
        default: "同步"
        options:
          - "同步"
          - "调试 · 修复管线测试"
          - "⚠️ 还原 · 修复文件还原为原路径"
          - "⚠️ 灾难恢复 · 目标端→源端"
          - "⚠️ 灾难恢复 · 目标端→源端（删除源端多余文件）"
      # ===== 同步模式选项（force_sync 同时作用于调试·修复管线测试）=====
      force_sync:
        description: "同步/调试模式: 强制同步（忽略跳过天数与源端缩小警告，始终执行）"
        required: false
        type: boolean
        default: false
      split_on_sync_failure:
        description: "同步模式: 失败后切割超阈值大文件（默认关闭; 关闭时日志的『跳过切割』提示仅为开关状态通知，不代表同步失败）"
        required: false
        type: boolean
        default: false
      skip_preview:
        description: "同步模式: 跳过任务预览通知（直接开始同步）"
        required: false
        type: boolean
        default: false
      transfers:
        description: "同步模式: OpenList 目标端 rclone 并发上传数（默认 1 串行=最保守；wopan176 保持 1——run 32749862280 整批假成功事故后端。baidupan/wopan175 可先在调试模式单任务试 2，truth-check 会兜底暴露假成功）"
        required: false
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
      subdir_parallel:
        description: "同步模式: auto-split 子目录并行数（默认 1 串行。>=2 时顶层子目录并行同步，对同一后端并发 PUT 翻倍——启用前先用调试模式观察一轮 object not found 率；递归层始终串行）"
        required: false
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"
      session_hold:
        # 默认改为 false: 同步 step 预算 320min 常态跑满（近 15 轮 duration_s 普遍
        # 19000-19800s），job 随之撞 6h 上限或被 330min 超时收掉，本 step 实测从未
        # 真正执行过（run 34660149180 cancelled / 34674196629 skipped）。开着只是
        # 白占 6h 窗口；关掉后同步结束立即 Persist 回传收摊，窗口全部给同步。
        # db 周期热备的兜底是 always() 的 Persist 回传，不依赖本 step。
        description: "同步模式: 同步完成后保持会话 5 小时并周期热备 db（默认关闭: 跑满 320min 预算时本 step 从未执行到，关闭可把 6h 窗口全部让给同步）"
        required: false
        type: boolean
        default: false
      self_retrigger:
        description: "同步模式: 本轮收场后立即自动触发下一轮接力（时间预算优雅到站/正常收摊后触发；人工取消且未到 6h 上限时不接力）"
        required: false
        type: boolean
        default: true
      # ===== 调试模式选项 =====
      fix_test_task:
        description: "调试模式: 要测试的任务 id（如 backup、task0；带后缀的变体如 task0-baidupan，完整清单见 task_engine.sh SYNC_TASK_REGISTRY）"
        required: false
        type: string
        default: "backup"
      fix_test_max:
        description: "调试模式: 单次修复数量上限（快速验证用）"
        required: false
        type: number
        default: 5
      # ===== 还原类模式选项（危险）=====
      restore_task:
        description: "⚠️ 还原/灾难恢复模式专用: 任务名（backup/task0-task5，即 marker 文件名前缀）或 all"
        required: false
        type: string
        default: "all"
  schedule:
    # 兜底触发（自续触发是主接力机制，见「自续触发」step）。
    # GitHub 对高频 cron 限流严重（实测 */5 曾 4.5h 零触发）。
    # 频率取 1h 而非 30min: 单轮 job 上限 6h + concurrency 单例，30min 一次会在
    # 一个 job 周期内堆出 ~12 个 waiting run（run 34685067684 实测排队 3h27m 才
    # 启动），既让「已有排队/等待中的运行」护栏长期命中、自续触发几乎永不生效，
    # 也让 run 列表塞满空转的过时排队。1h 折中: 堆 6 个，兜底延迟 ≤1h。
    - cron: "0 * * * *"
  watch:
    types: started

jobs:
  build:
    # 安全守卫（2026-09-08）：公开仓库任何人 star 都会触发 watch 事件——仅放行仓库本人，
    # schedule / workflow_dispatch 等其余触发方式不受影响
    if: github.event_name != 'watch' || github.actor == 'jarvanh'
    env:
      OPENLIST_SPLIT_ON_SYNC_FAILURE: ${{ inputs.split_on_sync_failure || 'false' }}
      FORCE_SYNC: ${{ inputs.force_sync || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # 统一收尾区（tg_add_footer）: 运行日志链接 + 已运行时长
      TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TG_RUN_STARTED_AT: ${{ github.run_started_at }}

      # ===== 集中阈值定义（避免魔数散落各处）=====
      # 字节大小阈值
      LARGE_FILE_THRESHOLD_BYTES: "4000000000"
      SYNC_SPLIT_THRESHOLD_BYTES: "20000000000"
      OPENLIST_SPLIT_PART_BYTES: "1073741824"
      OPENLIST_MAX_PART_SIZE: "4000000000"
      OPENLIST_TARGET_PART_SIZE: "3980000000"
      OPENLIST_7Z_VOLUME_SIZE: "3810m"
      OPENLIST_MAX_SPLIT_ATTEMPTS: "4"
      OPENLIST_ERR_LOG_MAX_BYTES: "50000000"

      # 超时时间（秒）
      OPENLIST_PROBE_TIMEOUT: "15"
      OPENLIST_CACHE_REFRESH_WAIT: "60"
      # 注: 驱动初始化等待 120s 硬编码在 openlist_api.sh wait_openlist_ready 阶段3，未参数化
      OPENLIST_RCLONE_LISTING_TIMEOUT: "900"
      OPENLIST_MKDIR_TIMEOUT: "120"
      OPENLIST_DOWNLOAD_TIMEOUT: "300"
      OPENLIST_UPLOAD_TIMEOUT: "300"

      # 重试/轮询
      # 注: 熔断阈值实际生效变量是 OPENLIST_FIX_CB_FILES（sync_engine.sh，默认3）；
      #     轮转上限实际生效变量是 ROTATION_MAX_CONSECUTIVE_ATTEMPTS（task_engine.sh，默认8）
      # 8005（OpenList 把 wopan176 的写失败包装成 HTTP 405 给 rclone）重试次数。
      # 取 1 而非 3: 405 常常是路径/后端层面的确定性拒写，刷新 token 重跑整批不会
      # 有第二种结果 —— run 34674196629 实测 3 次重试全是同样的 405，整批 1051 个
      # 文件每次 ~45-69min，单轮烧掉约 3.5h 而净传输为 0（trend transferred_bytes=0）。
      # 1 次保留「刷新 token 后补偿一次」的能力；缺失项由 truth-check + 修复管线
      # 的 diff 兜底，不依赖批量重试成功。
      OPENLIST_8005_RETRY_ATTEMPTS: "1"
      OPENLIST_423_RETRY_ATTEMPTS: "3"
      OPENLIST_423_RETRY_SLEEP_SECONDS: "300"
      OPENLIST_PERSIST_RETRY_ROUNDS: "11"
      OPENLIST_RAW_CHECK_BUDGET: "40"
      OPENLIST_RAW_COUNT_TIMEOUT: "240"
      # 逐文件修复的单次条数上限（只约束慢路径，批量折叠不占这个额度）。
      # 400 而非 200: 修复管线现已受 OPENLIST_SYNC_DEADLINE_EPOCH 预算约束（到点停在
      # 下一个文件前、状态已增量持久化），调大不会再有"撞 330min 被强杀丢 marker"
      # 的风险；而 200 在 run 34674196629 那种"批量阶段烧光 4h、只剩 50min 修复"
      # 的局面下反而够用，真正的浪费在批量阶段（已由目录级批量折叠解决）。
      OPENLIST_MISSING_FIX_MAX: "400"
      # 修复管线的"最小工作片": 剩余预算不足它就在下一个文件前收摊，把尾部时间
      # 留给持久化复核与收尾（默认继承 OPENLIST_SYNC_MIN_SLICE_SECONDS=600s）
      OPENLIST_FIX_MIN_SLICE_SECONDS: "600"
      OPENLIST_TOKEN_REFRESH_SECS: "240"

      # 后端级熔断（读预检放行了"写不进"的后端是 5h 零产出的根因，见
      # openlist_driver.sh _backend_write_probe 与 file_fix.sh _BACKEND_DEAD）
      OPENLIST_BACKEND_WRITE_PROBE: "1"
      OPENLIST_BACKEND_WRITE_PROBE_TIMEOUT: "60"
      OPENLIST_BACKEND_DEAD_THRESHOLD: "3"

      # 目录级批量折叠（快路径，见 file_fix_pipeline.sh _sync_bulk_hash_dir_fold）:
      # 整目录写不进（加密后路径超长 → 后端 405）时，把整组缺失文件一次
      # rclone sync 到短哈希目录，替代逐文件修复。逐文件 ~30s/个 ≈ 29 KiB/s，
      # 批量 2-3 MiB/s —— 差约 100 倍（run 34674196629 实测，该轮 5.5h 只修 73 个）。
      # 折叠只动"原目录已探明不可写"的目录，且以目标端实际落盘清单为准校验，
      # 零落盘则退回逐文件修复，不会丢条目。
      OPENLIST_BULK_HASH_FOLD: "1"
      # 目录内缺失文件数达到此值才折叠（只有 1 个文件时不值得为它开一次批量 sync）
      OPENLIST_BULK_FOLD_MIN_FILES: "2"
      # 单轮最多折叠的目录数。40 而非 8: 按 run 34674196629 的真实分布定 ——
      # 1050 个缺失文件散在 43 个长路径目录里，取 8 只覆盖 29%、16 覆盖 50%、
      # 32 覆盖 87%。目录级开销（1 探测 + 1 sync + 1 lsf）远小于文件级，
      # 上限给足；真正兜底的是时间预算闸，不是这个数。
      OPENLIST_BULK_FOLD_MAX_DIRS: "40"

      # OpenList 管理面账密（动态登录换取 token，取代静态 config.json token）
      OPENLIST_ADMIN_PASSWORD: ${{ secrets.OPENLIST_ADMIN_PASSWORD }}

      # 并发参数
      OPENLIST_TRANSFERS: ${{ inputs.transfers || '1' }}
      OPENLIST_CHECKERS: "8"
      # auto-split 顶层子目录并行数（1=串行，行为与历史版本一致）
      OPENLIST_SUBDIR_PARALLEL: ${{ inputs.subdir_parallel || '1' }}
    concurrency: openlist-singleton
    runs-on: ubuntu-latest
    # actions:write 供「自续触发」step 用 GITHUB_TOKEN dispatch 下一轮
    # （workflow_dispatch 是 GITHUB_TOKEN 触发新 run 的两种例外事件之一）
    permissions:
      actions: write
      contents: read
    steps:
      # 检出仓库，使 .github/scripts/openlist/ 下的脚本文件可用
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: rclone-install
        run: |
          set -e
          # 安装 rclone：GitHub Releases 直下 .deb，失败回退 rclone.org 安装脚本
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          # 写配置 + 持久化：secret 起步 → 掩码 → Dropbox 恢复优先 → 有效性检查 → 同步回 Dropbox
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config
      - name: 验证远端连通
        run: |
          # 本步骤原先还挂了一个 /dropbox，但实际上后续所有数据操作都直接走
          # dropbox:/onedrive: 远端（见下一节的 rclone copy），挂载点全程零读写，
          # 只是白占一个 FUSE 挂载与持续的 token 刷新。已移除。
          echo "==========onedrive==========="
          rclone lsf onedrive:
          echo "==========dropbox==========="
          rclone lsf dropbox:

      - name: 拉起 OpenList 容器（数据库本地化）
        run: |
          docker rm -f openlist 2>/dev/null || true
          # 数据库本地化: SQLite 不能直接运行在 rclone FUSE 上，
          # 因此启动时先拉取数据库至本地并排除了会导致撕裂快照的文件，
          # 随后的周期热备及会话结束都会回传同步此数据库。
          sudo mkdir -p /opt/openlist-data
          sudo chmod 0777 /opt/openlist-data
          rclone copy dropbox:self-hosted/openlist/data /opt/openlist-data \
            --exclude "data.db-wal" --exclude "data.db-shm" --exclude "data.db-journal" \
            --exclude "log/**" --exclude "temp/**"
          echo "拉取完成: $(ls -la /opt/openlist-data/ | tail -n +2 | wc -l) 个条目"
          # 记录拉取时 db 指纹（回传前对比: 未变化则跳过回传，
          # 避免极端并发场景下用过期副本覆盖远端新配置）
          OPENLIST_DB_MD5_PULL=$(md5sum /opt/openlist-data/data.db 2>/dev/null | awk '{print $1}')
          OPENLIST_DB_MD5_PULL="${OPENLIST_DB_MD5_PULL:-none}"
          echo "OPENLIST_DB_MD5_PULL=$OPENLIST_DB_MD5_PULL" >> "$GITHUB_ENV"
          echo "db 拉取指纹: $OPENLIST_DB_MD5_PULL"
          docker run -d --restart=unless-stopped -v /opt/openlist-data:/opt/openlist/data -p 5244:5244 -e PUID=0 -e PGID=0 -e UMASK=022 --name="openlist" openlistteam/openlist:latest

      - name: 校验 OpenList 容器运行状态
        run: |
          # 依赖 openlist_api.sh 的 wait_openlist_ready 检查 OpenList 就绪状态；
          # 走 load_all.sh 统一入口，避免函数库再拆分时此处漏改
          source "$GITHUB_WORKSPACE/.github/scripts/openlist/load_all.sh"
          echo "等待 OpenList 就绪..."
          if wait_openlist_ready; then
            echo "✅ OpenList 容器及 HTTP 服务正常就绪"
          else
            echo "❌ OpenList 容器未能就绪"
            exit 1
          fi

      - name: 安装 cloudflared 并载入隧道凭据
        run: |
          sudo mkdir -p ~/.cloudflared
          sudo chown -R runner:runner ~/.cloudflared
          # rclone 以 runner 身份运行：root 运行会在 token 刷新时回写 rclone.conf 属主
          rclone copy dropbox:self-hosted/.cloudflared ~/.cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      # 隧道状态守卫:
      #   - 隧道不存在        → 终止（需先手动创建: cloudflared tunnel create openlist）
      #   - 隧道存在但无连接  → 本实例接管，继续执行
      #   - 隧道已有活跃连接  → 其他实例正在服务，终止本次运行避免两端争写同一份数据
      - name: 检查 Cloudflare 隧道状态
        env:
          TUNNEL_NAME: "openlist"
        run: |
          OUTPUT=$(cloudflared tunnel list)
          TUNNEL_LINE=$(echo "$OUTPUT" | grep -w "$TUNNEL_NAME")
          if [ -z "$TUNNEL_LINE" ]; then
            echo "隧道 '${TUNNEL_NAME}' 不存在，请先手动创建（cloudflared tunnel create ${TUNNEL_NAME}），终止本次运行"
            # 退出码 31: 隧道未初始化（人工前置操作缺失），区别于一般运行失败，
            # 便于在 Actions 失败列表里一眼分类
            exit 31
          fi

          CONNECTIONS=$(echo "$TUNNEL_LINE" | awk '{if (NF>=4) print $4; else print "-"}')
          if [ "$CONNECTIONS" = "-" ]; then
            echo "隧道 '$TUNNEL_NAME' 存在但无活跃连接，继续执行"
          else
            echo "隧道 '$TUNNEL_NAME' 已有 ${CONNECTIONS} 个活跃连接（其他实例正在服务），终止本次运行"
            exit 1
          fi

      - name: 启动 Cloudflare 隧道
        run: |
          # DNS 路由只需创建一次；检查是否已解析到该隧道，避免重复 API 调用
          if ! dig +short openlist.'${{ secrets.VD }}'.eu.org | grep -q .; then
            cloudflared tunnel route dns openlist openlist.'${{ secrets.VD }}'.eu.org
          else
            echo "DNS 路由已存在，跳过 cloudflared tunnel route dns"
          fi
          # setsid 脱离会话组: 纯 nohup 在 broken session 下有被连带杀死的
          # 先例；隧道须存活整个 job（~6h），必须最可靠的启动形态
          setsid nohup cloudflared tunnel run --url http://127.0.0.1:5244 openlist &

      - name: 安装同步依赖（ffmpeg/jq 等）
        run: |
          sudo apt-get install -y ffmpeg jq coreutils bc p7zip-full

      # ===== 加载函数库 =====
      # 所有同步相关函数已提取到 .github/scripts/openlist/ 目录下的脚本文件中。
      # 修改函数逻辑请编辑对应脚本文件；修改任务定义请编辑 task_engine.sh 的 SYNC_TASK_REGISTRY，rclone 参数请编辑 rclone_flags.sh。
      - name: 加载同步函数库
        run: |
          echo "加载 OpenList 同步函数库..."
          source "$GITHUB_WORKSPACE/.github/scripts/openlist/load_all.sh"
          # 将函数库复制到 /tmp 以便后续 step 使用（每个 step 是独立 shell）
          # *.py: save_sync_marker 的 fallback 扫描（scan_fix_signatures.py）
          # *.jq: fix_list 序列化的修复方式分类程序（restore_info.jq）
          cp "$GITHUB_WORKSPACE/.github/scripts/openlist/"*.sh "$GITHUB_WORKSPACE/.github/scripts/openlist/"*.py "$GITHUB_WORKSPACE/.github/scripts/openlist/"*.jq /tmp/
          # 通知真源（tg_add_* 排版助手 + send_tg 发送层）由 load_all.sh 在 L0 层 source；
          # 复制到 /tmp/telegram/ 以保持与 workspace 布局一致的路径形态
          mkdir -p /tmp/telegram
          cp "$GITHUB_WORKSPACE/.github/scripts/telegram/tg_notify.sh" /tmp/telegram/
          echo "函数库加载完成"
          # 环境就绪标记: 供「收尾与清理」「自续触发」两个 always() step 判定。
          # 二者在前置 step 失败时仍会执行，而那时 /tmp/load_all.sh 根本不存在 ——
          # run 34685067684 就是 rclone-install 挂掉后，收尾 source 不到文件再补一个
          # exit 1，把真实原因盖掉；自续触发还照常 dispatch 了下一轮，形成空转接力。
          echo "OL_ENV_READY=1" >> "$GITHUB_ENV"

      # ===== 一键还原修复文件 =====
      # 把 marker fixed_files 中的替代文件还原为原路径原文件名:
      #   改名类 → rclone move 服务端移动；压缩/分卷类 → 下载还原后回传
      #   原路径；成功后清理目标端替代文件并从 marker 移除条目。
      # 完成后发送 Telegram 汇总。restore_task 指定任务名（backup/task0-5，
      # 即 marker 文件名前缀）或 all。
      - name: "⚠️ Restore: 一键还原修复文件"
        if: ${{ inputs.run_mode == '⚠️ 还原 · 修复文件还原为原路径' }}
        timeout-minutes: 240
        env:
          # 经 env 传参，不经 "${{ }} 直接内插 bash（string input 注入面，
          # 危险模式更不该留此门；GitHub 官方反模式清单）
          RESTORE_TASK: ${{ inputs.restore_task || 'all' }}
        run: |
          source /tmp/load_all.sh
          restore_fixed_files "$RESTORE_TASK"

      # ===== 灾难恢复: 目标端 → 源端 =====
      # 修复文件以替代形态存在正是因为原形态无法在该后端持久化，因此恢复
      # 不经过"目标端改回原名"，一步直达源端:
      #   1. 普通文件（crypt 层透明）rclone copy 目标 → 源端，--size-only 幂等
      #   2. 修复文件: 排除出批量拷贝，逐条下载替代形态 → 本地解码（解压/
      #      合卷/解 base64/改名类直传）→ 以原路径原文件名上传源端，
      #      按 marker size_bytes 校验
      # 全程不删改目标端，可重复执行补齐失败条目。
      # 依赖 marker（与源端同在 OneDrive；极端情况 OneDrive 整体丢失时
      # 需外置的 marker 备份才能映射修复条目）。
      - name: "⚠️ Restore: 灾难恢复 目标端→源端"
        if: ${{ inputs.run_mode == '⚠️ 灾难恢复 · 目标端→源端' }}
        timeout-minutes: 240
        env:
          RESTORE_TASK: ${{ inputs.restore_task || 'all' }}
        run: |
          source /tmp/load_all.sh
          restore_source_from_target "$RESTORE_TASK"

      # ===== 镜像灾难恢复: 目标端 → 源端（删除源端多余文件）=====
      # rebuild_source_from_target（restore_source_from_target 的破坏性变体）:
      # 批量层用 rclone sync 镜像，
      # 源端存在但目标端没有的文件会被删除，最终源端内容 = 目标端全部有效内容。
      # 替代形态与修复条目原路径均排除出 sync（防密文名拷回/防误删待还原路径），
      # 由逐条还原负责回填并按 marker md5 校验。目标端全程只读，可重复执行。
      - name: "⚠️ Restore: 镜像灾难恢复 目标端→源端（删除源端多余文件）"
        if: ${{ inputs.run_mode == '⚠️ 灾难恢复 · 目标端→源端（删除源端多余文件）' }}
        timeout-minutes: 240
        env:
          RESTORE_TASK: ${{ inputs.restore_task || 'all' }}
        run: |
          source /tmp/load_all.sh
          rebuild_source_from_target "$RESTORE_TASK"

      # ===== 调试: 单任务测试修复管线 =====
      # 用真实生产代码路径（sync_task → sync_with_logging）按任务清单
      # （task_engine.sh SYNC_TASK_REGISTRY）查表跑单个任务（id 形如 backup、task0，
      # 含带后缀的变体 task0-baidupan / task0-wopan175 等，覆盖全部目标后端），
      # 验证 truth-check（重启取真值） + 缺失文件修复的实际效果。
      # 与正式流程的区别: 只跑单任务、跳过任务预览、跳过结尾 5h sleep，
      # 并用 OPENLIST_MISSING_FIX_MAX 限制修复数量快速得到结果。
      # 注意: --1d-skip 标记仍照常检查（近 1 天已成功同步的任务会跳过），
      # 需测试这类任务时配合 force_sync=true 强制执行。
      - name: "Debug: 单任务测试修复管线"
        if: ${{ inputs.run_mode == '调试 · 修复管线测试' }}
        timeout-minutes: 120
        env:
          # 经 env 传参，不经 "${{ }} 直接内插 bash（string/number input 注入面）
          FIX_TEST_TASK: ${{ inputs.fix_test_task || 'backup' }}
          FIX_TEST_MAX: ${{ inputs.fix_test_max || 5 }}
        run: |
          source /tmp/load_all.sh

          # ===== 等待 OpenList 就绪 =====
          echo "等待 OpenList 就绪..."
          wait_openlist_ready || true

          # ===== 初始化 =====
          init_sync_state

          # 单次修复数量上限（快速验证用）
          export OPENLIST_MISSING_FIX_MAX="${FIX_TEST_MAX}"
          # 跳过 initial sync 实际传输（debug 只验证修复方法: diff → 修复 → 持久化复核）
          export OPENLIST_FIX_TEST_MODE=1

          # ===== 按 input 从任务清单（task_engine.sh SYNC_TASK_REGISTRY）查表执行 =====
          echo "=== 修复管线测试任务: ${FIX_TEST_TASK} (修复上限 ${OPENLIST_MISSING_FIX_MAX}) ==="
          run_task_by_id "$FIX_TEST_TASK"
          echo "=== 修复管线测试完成 (SYNC_FAILED=${SYNC_FAILED}) ==="

      - name: 初始化同步状态
        if: ${{ inputs.run_mode == '' || inputs.run_mode == '同步' }}
        run: |
          source /tmp/load_all.sh
          init_sync_state
          # 同步任务在独立的 Actions step 中执行（每个 step 是独立 shell），
          # 必须写入 GITHUB_ENV 才能在后续 step 中保留；否则 threshold 为空，
          # 触发 `[: : integer expression expected` 错误。
          echo "PROCESSED_FILES_LOG=$PROCESSED_FILES_LOG" >> "$GITHUB_ENV"
          echo "=== 初始化已处理文件日志 ===" > "$PROCESSED_FILES_LOG"
          echo "开始时间: $(date)" >> "$PROCESSED_FILES_LOG"
          echo "==========================" >> "$PROCESSED_FILES_LOG"

      # ===== 所有同步任务预览 + 执行 =====
      # （任务清单/参数维护入口见上方"加载同步函数库"step 注释）
      - name: 任务预览与全量同步
        id: sync
        # P2 优雅到站硬兜底: 预算正常时脚本会先优雅退出（success），
        # 此超时只防"预算检查本身失效"的极端情况（330min < 6h job 上限，
        # 给收尾/Persist/接力留出余量）
        timeout-minutes: 330
        if: ${{ inputs.run_mode == '' || inputs.run_mode == '同步' }}
        env:
          SKIP_PREVIEW: ${{ inputs.skip_preview || 'false' }}
        run: |
          source /tmp/load_all.sh
          # P0 趋势: 记录同步工作开始时间（收尾时算本轮历时）
          trend_capture_start
          # P2 优雅到站: 预算锚点 = 本 step 启动 + 320min（6h 上限留出
          # setup/收尾/Persist/接力余量；超预算后不再开新工作，做完当前即退）
          export OPENLIST_SYNC_DEADLINE_EPOCH=$(( $(date +%s) + ${OPENLIST_SYNC_BUDGET_SECONDS:-19200} ))
          echo "同步时间预算: 320min（至 $(date -d "@$OPENLIST_SYNC_DEADLINE_EPOCH" '+%H:%M') UTC，超时优雅收摊）"

          # 等待 OpenList 就绪（容器刚启动时如果尚未就绪会导致预览为空及无谓的同步重传）
          echo "等待 OpenList 就绪..."
          wait_openlist_ready || true

          # 跳过预览通知（skip_preview=true，仅注册任务队列）:
          # boolean input 也经 env 传参，与 restore_task 等同一注入面规范
          if [ "${SKIP_PREVIEW:-false}" = "true" ]; then
            echo "=== 跳过预览通知（skip_preview=true，仅注册任务队列）==="
            # 仅注册模式: 不发预览通知，但把全部任务（含源端大小）注册进进度队列，
            # 否则任务随 progress_task_begin 逐个注册，进度消息的"总任务"会从 3 之类的小数字慢慢涨
            TASK_REGISTER_ONLY=1 run_all_tasks
          else
            echo "=== 发送任务预览通知 ==="
            TASK_PREVIEW_ONLY=1 run_all_tasks
            flush_task_preview
            echo "=== 所有任务预览通知已发送 ==="
          fi
          # P0 趋势: 预览完成后把全量"未传量"落文件（收尾趋势通知的剩余口径；
          # skip_preview=true 时无预览数据，本轮剩余记为未知）
          trend_capture_remaining
          # 注册完成后立即刷新，让"总任务"在同步开始前就是全量
          progress_reload

          echo "=== 开始同步所有任务 ==="
          run_all_tasks
          if [ "${SYNC_TIME_EXHAUSTED:-0}" = "1" ]; then
            echo "=== 时间预算用尽，优雅收摊（剩余任务由下轮接力，marker/游标已持久化）==="
          else
            echo "=== 所有任务同步完成 ==="
          fi

      - name: 收尾与清理
        # always(): 大任务（如 task0 的 226GiB）常态撞 6h job 上限被取消，
        # 本 run 已完成的 marker/processed log 收尾不能丢——run 31954162437
        # 实测取消后 always() step（Persist）仍会执行，此处同理
        if: ${{ always() && (inputs.run_mode == '' || inputs.run_mode == '同步') }}
        run: |
          # 环境未就绪（前置 step 失败，函数库没落到 /tmp）时直接退出: 否则
          # source 报 "No such file or directory" 并把 step 打成 failure，
          # 把真正的失败原因压在下面（run 34685067684 已实际发生一次）
          if [ "${OL_ENV_READY:-0}" != "1" ]; then
            echo "环境未就绪（OL_ENV_READY!=1），跳过收尾。真实失败原因见上方 step"
            exit 0
          fi
          source /tmp/load_all.sh

          # 本轮修复成效（跨任务累计，见 file_fix_pipeline.sh _ol_round_stats_bump）
          # 收尾必须自己说出来: run #12616 结论 success，实际 394 次修复全败、
          # 5 小时零产出 —— 不打印就只能在 5 万行日志里翻。
          ROUND_FIXED_OK=0
          ROUND_MISSING=0
          if [ -f /tmp/ol_round_stats.env ]; then . /tmp/ol_round_stats.env; fi
          ROUND_FAILED=$(( ROUND_MISSING - ROUND_FIXED_OK ))
          [ "$ROUND_FAILED" -lt 0 ] && ROUND_FAILED=0
          echo "本轮修复成效: 成功 ${ROUND_FIXED_OK} · 缺失 ${ROUND_MISSING} · 未修复 ${ROUND_FAILED}"
          if [ "$ROUND_MISSING" -gt 0 ] && [ "$ROUND_FIXED_OK" -eq 0 ]; then
            echo "🚨 本轮零成功: ${ROUND_MISSING} 个缺失文件全部修复失败（典型成因: 目标后端写不进/驱动失效）—— 本 run 可能仍以 success 收场，但实际没有任何数据落盘"
          fi

          actual_entries=0
          total_lines=0

          # 标记全局进度通知为最终完成状态
          progress_finalize

          if [ -f "processed_videos.log" ]; then
            total_lines=$(wc -l < "processed_videos.log" 2>/dev/null || echo 0)
            actual_entries=$((total_lines - 3))
            echo "==========================" >> "processed_videos.log"
            echo "结束时间: $(date)" >> "processed_videos.log"
            echo "=== 所有同步任务完成 ===" >> "processed_videos.log"

            if [ "$actual_entries" -gt 0 ]; then
              REMOTE_PROC_LOG="onedrive:/logs/processed/processed_videos_$(date +%Y%m%d_%H%M%S).log"
              rclone copyto "processed_videos.log" "$REMOTE_PROC_LOG" || true
            fi

            rm -f "processed_videos.log" 2>/dev/null || true
          fi

          # 镜像同步状态标记到 Dropbox（marker 是修复文件还原链路的唯一索引，
          # 与源端同在 OneDrive —— OneDrive 整体故障时灾难恢复需要外置副本）
          echo "镜像 sync_state → dropbox..."
          rclone sync onedrive:/logs/sync_state dropbox:sync_state_mirror --create-empty-src-dirs 2>&1 | tail -2 || true
          echo "sync_state 镜像完成: $(rclone lsf dropbox:sync_state_mirror 2>/dev/null | wc -l | tr -d ' ') 个文件"

          # P0 趋势: 追加本轮 {历时/净传/剩余} 到 trend.jsonl 并回传，
          # 发送 "📈 同步趋势" 通知（近 5 轮速率 + 剩余 + 预计清零时间）。
          # 放在 always() 收尾里: 被 6h 上限取消的 run 也计入趋势，不丢样本
          trend_record_and_notify "${{ github.run_id }}" "${{ github.event_name }}"

          rm -f /tmp/*.sh /tmp/*.py /tmp/*.jq 2>/dev/null || true
          # P4: 按同步 step 实际结论分流收场消息——旧版无条件打印
          # "所有同步任务完成！"，被取消/失败的 run 也这么报，误导排查
          if [ "${{ steps.sync.conclusion }}" = "success" ]; then
            echo "所有同步任务完成！"
          else
            echo "本轮同步未完整收场（conclusion=${{ steps.sync.conclusion }}），状态已持久化，下轮接力继续"
          fi

      # ===== 会话保持 + 数据库周期热备回传 =====
      # 原为纯 sleep 300m；runner 被强杀（VM 销毁/取消超时）时 Finalize 的
      # 回传来不及执行，改为每 5 分钟做一次一致性快照并回传变化的 db，
      # 强杀丢失窗口从 5 小时压缩到 ≤5 分钟。
      # 快照用 SQLite backup API（在线、逻辑一致），不直接拷 data.db 文件
      # （容器运行中直接拷可能捕获到撕裂状态）。
      # session_hold=false（全量冲刺期）时整个 step 跳过: 同步结束立即走
      # Persist 回传收摊，6h 窗口全部让给同步；代价是强杀丢失窗口回到
      # "自上次 Persist 起"（冲刺期通常 ≤6h，可接受）
      - name: 会话保持与数据库周期热备
        # 注意: 开关判断不能用 `inputs.session_hold != false` —— schedule 触发时
        # inputs.* 为空串，GitHub 松比较下 '' == false 成立，该条件恒为 false，
        # 本 step 在所有定时运行里都是 skipped（run #12613~#12618 已确认）。
        # 改用 github.event.inputs（字符串上下文，未触发时为 null）经 env 取默认
        # 值，再由 bash 字符串比较决定是否执行。
        if: ${{ inputs.run_mode == '' || inputs.run_mode == '同步' }}
        env:
          SESSION_HOLD: ${{ github.event.inputs.session_hold || 'true' }}
        run: |
          if [ "${SESSION_HOLD:-true}" != "true" ]; then
            echo "session_hold=false，跳过会话保持（同步结束立即回传收摊，6h 窗口全部让给同步）"
            exit 0
          fi
          LAST_MD5="${OPENLIST_DB_MD5_PULL:-none}"
          for _ in $(seq 1 60); do
            sleep 300
            # 容器运行中的在线一致性快照（root 属主，用 sudo 读）
            if sudo python3 -c "import sqlite3; src=sqlite3.connect('file:/opt/openlist-data/data.db?mode=ro', uri=True); dst=sqlite3.connect('/tmp/data.db.snapshot'); src.backup(dst); dst.close(); src.close()" 2>/dev/null; then
              # 快照是 root 产出、随后由 runner 身份的 rclone 上传，显式放开读权限
              sudo chmod 644 /tmp/data.db.snapshot 2>/dev/null || true
              NEW_MD5=$(md5sum /tmp/data.db.snapshot 2>/dev/null | awk '{print $1}' || echo "")
              if [ -n "$NEW_MD5" ] && [ "$NEW_MD5" != "$LAST_MD5" ]; then
                if rclone copyto /tmp/data.db.snapshot dropbox:self-hosted/openlist/data/data.db; then
                  LAST_MD5="$NEW_MD5"
                  echo "[$(date -u +'%H:%M:%SZ')] db 已变化，热备回传完成 ($NEW_MD5)"
                else
                  echo "[$(date -u +'%H:%M:%SZ')] ⚠️ 热备回传失败，下轮重试"
                fi
              fi
            fi
          done
          docker stop openlist

      # ===== 数据库回传（所有模式 + 失败/取消也执行）=====
      # 停容器（幂等）→ SQLite 干净关闭、-wal/-shm 由 SQLite 自行清理/合并
      # → 整目录 rclone sync 镜像回传（未变化的 db 跳过，防止并发场景覆盖）。
      # if: always() 保证同步步骤失败/手动取消时，会话内的配置变更也能回传
      # （runner 被强杀除外——该场景由上一步的周期热备兜底）。
      - name: "Persist: openlist 数据库回传"
        if: ${{ always() }}
        run: |
          docker stop openlist 2>/dev/null || true
          CUR_MD5=$(md5sum /opt/openlist-data/data.db 2>/dev/null | awk '{print $1}')
          CUR_MD5="${CUR_MD5:-none}"
          if [ "$CUR_MD5" = "${OPENLIST_DB_MD5_PULL:-none}" ]; then
            echo "db 未变化（${CUR_MD5}），跳过回传"
          else
            echo "db 已变化（${OPENLIST_DB_MD5_PULL:-none} → ${CUR_MD5}），sync 回传..."
            # 排除 -wal/-shm/-journal 后 sync 镜像（本地为权威副本）
            rclone sync /opt/openlist-data dropbox:self-hosted/openlist/data \
              --exclude "data.db-wal" --exclude "data.db-shm" --exclude "data.db-journal" \
              --exclude "log/**" --exclude "temp/**"
            # sync 的 exclude 不会删远端对应文件，显式清理可能残留的撕裂源
            rclone delete dropbox:self-hosted/openlist/data \
              --include "data.db-wal" --include "data.db-shm" --include "data.db-journal" 2>/dev/null || true
            echo "回传完成: $(rclone lsl dropbox:self-hosted/openlist/data 2>/dev/null | grep -c .) 个文件"
          fi

      # ===== 自续触发（P2 接力机制）=====
      # 背景: GitHub 对高频 cron 限流严重（*/5 实测曾 4.5h 零触发），"常驻
      # 队列"假设不成立 → 改为本轮收场后立即 dispatch 下一轮，cron 只做兜底。
      # workflow_dispatch 是 GITHUB_TOKEN 能触发新 run 的两种例外事件之一，
      # 已在 job permissions 里给 actions:write。
      # 三道护栏:
      #   1. 仅同步模式且 self_retrigger 开启（调试/还原/关闭即完全静止）
      #   2. 人工取消不打架: 同步 step 被 cancel 且 job 未到 6h 上限
      #      （<5h50m）→ 判定为人工取消，不接力
      #   3. 防堆积: 已有排队/等待中的运行则不重复触发
      - name: 自续触发（下轮接力）
        # 同「会话保持」step: 开关判断从 `inputs.self_retrigger != false`
        # （schedule 下恒 false → 定时运行从未接接过力）改为 env 默认值 +
        # bash 字符串比较。
        if: ${{ always() && (inputs.run_mode == '' || inputs.run_mode == '同步') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SELF_RETRIGGER: ${{ github.event.inputs.self_retrigger || 'true' }}
        run: |
          set -e
          # 环境未就绪时不接力: 否则基础设施一挂，就会以「失败 → 接力 → 再失败」
          # 的节奏持续空转（run 34685067684 在 install 步骤已失败，本 step 仍
          # dispatch 了下一轮）。先修前置 step，再让接力恢复。
          if [ "${OL_ENV_READY:-0}" != "1" ]; then
            echo "环境未就绪（OL_ENV_READY!=1），不接力。请先修复前置 step 的失败"
            exit 0
          fi
          if [ "${SELF_RETRIGGER:-true}" != "true" ]; then
            echo "self_retrigger=false，不接力（完全静止）"
            exit 0
          fi
          REPO="${{ github.repository }}"
          SYNC_CONCLUSION="${{ steps.sync.conclusion }}"
          ELAPSED=$(( $(date +%s) - $(date -d "${{ github.run_started_at }}" +%s) ))

          # 护栏2: 人工取消不接力（6h 上限的取消表现为 elapsed ≈ 21600s）
          if [ "$SYNC_CONCLUSION" = "cancelled" ] && [ "$ELAPSED" -lt 21000 ]; then
            echo "同步 step 被取消且运行仅 $((ELAPSED / 60))min，判定为人工取消，不接力"
            exit 0
          fi

          # 护栏3: 已有排队/等待中的运行则不重复触发（cron 仍会创建排队）
          PENDING=$(gh run list -R "$REPO" --workflow=openlist.yml --limit 30 --json status \
            | jq '[.[] | select(.status == "queued" or .status == "waiting" or .status == "pending")] | length')
          if [ "${PENDING:-0}" -gt 0 ]; then
            echo "已有 ${PENDING} 个排队/等待中的运行，跳过接力"
            exit 0
          fi

          gh workflow run openlist.yml -R "$REPO"
          echo "✅ 已触发下一轮接力（本轮 conclusion=${SYNC_CONCLUSION:-unknown}，运行 $((ELAPSED / 60))min）"
