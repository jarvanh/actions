# 备份文件到 openlist 中的网盘
name: openlist

on:
  workflow_dispatch:
    inputs:
      # ===== 运行模式（单选下拉，互斥）=====
      # 取代旧的 3 个 boolean（fix_test_mode / restore_fixed / restore_to_source），
      # 从 UI 上杜绝多开关误组合; ⚠️ 开头的两项为还原类危险操作，排在末尾
      run_mode:
        description: "▶️ 运行模式（单选互斥）。⚠️ 标记的两项为危险操作: 会改写目标端或回传源端，运行前请核对下方 restore_task 任务名"
        required: true
        type: choice
        default: "同步"
        options:
          - "同步"
          - "调试 · 修复管线测试"
          - "⚠️ 还原 · 修复文件还原为原路径"
          - "⚠️ 灾难恢复 · 目标端→源端"
      # ===== 同步模式选项 =====
      force_sync:
        description: "同步模式: 强制同步（忽略跳过天数与源端缩小警告，始终执行）"
        required: false
        type: boolean
        default: false
      split_on_sync_failure:
        description: "同步模式: 失败后切割超阈值大文件（默认关闭; 关闭时日志的『跳过切割』提示仅为开关状态通知，不代表同步失败）"
        required: false
        type: boolean
        default: false
      skip_preview:
        description: "同步模式: 跳过任务预览通知（直接开始同步）"
        required: false
        type: boolean
        default: false
      # ===== 调试模式选项 =====
      fix_test_task:
        description: "调试模式: 要测试的任务 (backup/task0-task5)"
        required: false
        type: string
        default: "backup"
      fix_test_max:
        description: "调试模式: 单次修复数量上限（快速验证用）"
        required: false
        type: number
        default: 5
      # ===== 还原类模式选项（危险）=====
      restore_task:
        description: "⚠️ 还原/灾难恢复模式专用: 任务名 (backup/task0-task5/all)"
        required: false
        type: string
        default: "all"
  schedule:
    # - cron: "10 1 * * *"
    - cron: "*/5 * * * *"
  watch:
    types: started

jobs:
  build:
    env:
      OPENLIST_SPLIT_ON_SYNC_FAILURE: ${{ inputs.split_on_sync_failure || 'false' }}
      FORCE_SYNC: ${{ inputs.force_sync || 'false' }}
      # Telegram 通知凭据（注入为环境变量供脚本文件使用）
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    concurrency: openlist-singleton
    runs-on: ubuntu-latest
    steps:
      # 检出仓库，使 .github/scripts/openlist/ 下的脚本文件可用
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: rclone-install
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: rclone-config
        env:
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE }}
        run: |
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG_SECRET
          EOF

          # 在 rclone 命令可能打印配置详情前，掩码配置中的嵌套密钥
          python3 << 'PY'
          import json
          import re
          from pathlib import Path

          text = Path.home().joinpath(".config/rclone/rclone.conf").read_text()
          secrets = set()

          for match in re.finditer(r'(?im)^\s*(?:client_secret|pass|password)\s*=\s*(.+?)\s*$', text):
              secrets.add(match.group(1).strip())

          for match in re.finditer(r'(?im)^\s*token\s*=\s*(\{.*\})\s*$', text):
              try:
                  token = json.loads(match.group(1))
              except Exception:
                  continue
              for key in ("access_token", "refresh_token", "id_token"):
                  value = token.get(key)
                  if value:
                      secrets.add(str(value))

          for value in sorted(secrets, key=len, reverse=True):
              if value:
                  print(f"::add-mask::{value}")
          PY


      - name: rclone-run
        run: |
          echo "==========onedrive==========="
          rclone lsf onedrive:
          echo "==========dropbox==========="
          rclone lsf dropbox:

          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo mkdir -p /dropbox
          sudo nohup rclone mount dropbox: /dropbox --no-gzip-encoding --umask 000 --allow-other --attr-timeout 10m --vfs-cache-mode full --vfs-cache-max-age 5m --vfs-read-chunk-size-limit 10G --buffer-size 100M --vfs-cache-max-size 10G &

      - name: Run openlist container
        run: |
          sudo docker rm -f openlist 2>/dev/null || true
          # ===== 数据库本地化 =====
          # SQLite 不能跑在 rclone FUSE 挂载上（无 POSIX 锁/fsync、runner 销毁无
          # clean unmount、-wal 与主库异步上传会造成撕裂快照）→ 配置每次重启丢失。
          # 改为: 启动拉取到 runner 本地 /opt/openlist-data，容器挂本地目录，
          # 会话期间周期热备 + 结束时整目录 sync 回传（见末尾两个 step）。
          # 拉取排除 -wal/-shm/-journal: 撕裂快照的源头，宁可不带也不能带错
          sudo mkdir -p /opt/openlist-data
          sudo chmod 0777 /opt/openlist-data
          rclone copy dropbox:self-hosted/openlist/data /opt/openlist-data \
            --exclude "data.db-wal" --exclude "data.db-shm" --exclude "data.db-journal"
          echo "拉取完成: $(ls -la /opt/openlist-data/ | tail -n +2 | wc -l) 个条目"
          # 记录拉取时 db 指纹（回传前对比: 未变化则跳过回传，
          # 避免极端并发场景下用过期副本覆盖远端新配置）
          OPENLIST_DB_MD5_PULL=$(md5sum /opt/openlist-data/data.db 2>/dev/null | awk '{print $1}' || echo "none")
          echo "OPENLIST_DB_MD5_PULL=$OPENLIST_DB_MD5_PULL" >> "$GITHUB_ENV"
          echo "db 拉取指纹: $OPENLIST_DB_MD5_PULL"
          sudo docker run -d --restart=unless-stopped -v /opt/openlist-data:/opt/openlist/data -p 5244:5244 -e PUID=0 -e PGID=0 -e UMASK=022 --name="openlist" openlistteam/openlist:latest

      - name: sleep
        run: |
          sudo sleep 1m

      - name: Verify docker container is running
        run: docker ps --filter name=openlist --filter status=running | grep -q openlist

      - name: install cloudflared
        run: |
          sudo mkdir ~/.cloudflared/
          sudo rclone copy dropbox:self-hosted/.cloudflared ~/.cloudflared -vv
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Check if the tunnel is running
        env:
          TUNNEL_NAME: "openlist"
        run: |
          OUTPUT=$(cloudflared tunnel list)
          TUNNEL_LINE=$(echo "$OUTPUT" | grep -w "$TUNNEL_NAME")
          if [ -z "$TUNNEL_LINE" ]; then
            echo "The tunnel '$TUNNEL_NAME' does not exist. Proceeding."
            exit 31
          fi

          CONNECTIONS=$(echo "$TUNNEL_LINE" | awk '{if (NF>=4) print $4; else print "-"}')
          if [ "$CONNECTIONS" == "-" ]; then
            echo "The tunnel '$TUNNEL_NAME' exists but has no active connections. Proceeding."
          else
            echo "The tunnel '$TUNNEL_NAME' is running with connections: $CONNECTIONS. Stopping actions."
            exit 0
          fi

      - name: run cloudflared
        run: |
          # DNS 路由只需创建一次；检查是否已解析到该隧道，避免重复 API 调用
          if ! dig +short openlist.'${{ secrets.VD }}'.eu.org | grep -q .; then
            cloudflared tunnel route dns openlist openlist.'${{ secrets.VD }}'.eu.org
          else
            echo "DNS 路由已存在，跳过 cloudflared tunnel route dns"
          fi
          nohup cloudflared tunnel run --url http://127.0.0.1:5244 openlist &

      - name: Install required tools
        run: |
          echo "Installing ffmpeg, jq, coreutils..."
          sudo apt-get install -y ffmpeg jq coreutils bc p7zip-full

      # ===== 加载函数库 =====
      # 所有同步相关函数已提取到 .github/scripts/openlist/ 目录下的脚本文件中。
      # 修改函数逻辑请编辑对应脚本文件；修改任务定义和 rclone 参数请编辑下方 "Preview and sync all tasks" step。
      - name: Load helper functions
        run: |
          echo "加载 OpenList 同步函数库..."
          source "$GITHUB_WORKSPACE/.github/scripts/openlist/load_all.sh"
          # 将函数库复制到 /tmp 以便后续 step 使用（每个 step 是独立 shell）
          cp "$GITHUB_WORKSPACE/.github/scripts/openlist/"*.sh /tmp/
          echo "函数库加载完成"

      # ===== 一键还原修复文件 =====
      # 把 marker fixed_files 中的替代文件还原为原路径原文件名:
      #   改名类 → rclone move 服务端移动；压缩/分卷/base64 内容类 → 下载还
      #   原后回传原路径；成功后清理目标端替代文件并从 marker 移除条目。
      # 完成后发送 Telegram 汇总。restore_task 指定任务名（backup/task0-5）或 all。
      - name: "⚠️ Restore: 一键还原修复文件"
        if: ${{ inputs.run_mode == '⚠️ 还原 · 修复文件还原为原路径' }}
        timeout-minutes: 240
        run: |
          source /tmp/load_all.sh
          restore_fixed_files "${{ inputs.restore_task || 'all' }}"

      # ===== 灾难恢复: 目标端 → 源端 =====
      # 修复文件以替代形态存在正是因为原形态无法在该后端持久化，因此恢复
      # 不经过"目标端改回原名"，一步直达源端:
      #   1. 普通文件（crypt 层透明）rclone copy 目标 → 源端，--size-only 幂等
      #   2. 修复文件: 排除出批量拷贝，逐条下载替代形态 → 本地解码（解压/
      #      合卷/解 base64/改名类直传）→ 以原路径原文件名上传源端，
      #      按 marker size_bytes 校验
      # 全程不删改目标端，可重复执行补齐失败条目。
      # 依赖 marker（与源端同在 OneDrive；极端情况 OneDrive 整体丢失时
      # 需外置的 marker 备份才能映射修复条目）。
      - name: "⚠️ Restore: 灾难恢复 目标端→源端"
        if: ${{ inputs.run_mode == '⚠️ 灾难恢复 · 目标端→源端' }}
        timeout-minutes: 240
        run: |
          source /tmp/load_all.sh
          restore_source_from_target "${{ inputs.restore_task || 'all' }}"

      # ===== 调试: 单任务测试修复管线 =====
      # 用真实生产代码路径（sync_task → sync_with_logging）跑单个 wopan176Crypt 任务，
      # 验证 truth-check（重启取真值） + 缺失文件修复的实际效果。
      # 与正式流程的区别: 只跑单任务、跳过任务预览、不检查 --1d-skip 标记、
      # 跳过结尾 5h sleep，并用 OPENLIST_MISSING_FIX_MAX 限制修复数量快速得到结果。
      - name: "Debug: 单任务测试修复管线"
        if: ${{ inputs.run_mode == '调试 · 修复管线测试' }}
        timeout-minutes: 120
        run: |
          source /tmp/load_all.sh

          # ===== 等待 OpenList 就绪（与正式流程相同的探测策略）=====
          echo "等待 OpenList 就绪..."
          code="000"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5244/ping 2>/dev/null || echo "000")
            [ "$code" = "200" ] && { echo "HTTP 就绪 (${i}次)"; break; }
            sleep 2
          done
          echo "等待驱动初始化 (120s) ..."
          sleep 120
          if rclone lsd openlist: >/dev/null 2>&1; then
            echo "WebDAV(rclone) 验证通过"
          else
            echo "再等 90s ..."
            sleep 90
            rclone lsd openlist: >/dev/null 2>&1 && echo "WebDAV(rclone) 验证通过" || echo "⚠️ WebDAV 未就绪，继续执行"
          fi

          # ===== 初始化（与 Initialize sync 对齐的最小集）=====
          SYNC_SKIP_QUIET=0
          SYNC_SKIPPED=0
          SYNC_FAILED=0
          SYNC_TRANSFERRED_BYTES=0
          AUTO_SPLIT_INFO=""
          SYNC_AUTO_SPLIT_DEPTH=0
          progress_init

          # 单次修复数量上限（快速验证用）
          export OPENLIST_MISSING_FIX_MAX="${{ inputs.fix_test_max || 5 }}"
          # 跳过 initial sync 实际传输（debug 只验证修复方法: diff → 修复 → 持久化复核）
          export OPENLIST_FIX_TEST_MODE=1

          # ===== rclone 参数（与 "Preview and sync all tasks" step 保持一致）=====
          RCLONE_DEFAULT_FLAGS=(
            --progress
            --stats 15s
            --stats-one-line
            --ignore-errors
            --verbose
            --size-only
            --timeout 5m
            --contimeout 30s
            --retries 1
            --low-level-retries 3
          )
          RCLONE_SYNC_TASK_FLAGS=(
            --delete-before
          )

          # ===== 按 input 选择要测试的任务（与 run_all_tasks 中 sync_task 定义一致）=====
          FIX_TASK="${{ inputs.fix_test_task || 'backup' }}"
          echo "=== 修复管线测试任务: ${FIX_TASK} (修复上限 ${OPENLIST_MISSING_FIX_MAX}) ==="
          case "$FIX_TASK" in
            backup) sync_task "onedrive:backup" "openlist:wopan176Crypt/backup" "backup" ;;
            task0)  sync_task "onedrive:0" "openlist:wopan176Crypt/0" "task0" ;;
            task1)  sync_task "onedrive:1" "openlist:wopan176Crypt/1" "task1" ;;
            task2)  sync_task "onedrive:2" "openlist:wopan176Crypt/2" "task2" ;;
            task3)  sync_task "onedrive:3" "openlist:wopan176Crypt/3" "task3" ;;
            task4)  sync_task "onedrive:4" "openlist:wopan176Crypt/4" "task4" ;;
            task5)  sync_task "onedrive:5" "openlist:wopan176Crypt/5" "task5" ;;
            *) echo "未知任务: ${FIX_TASK}（可选: backup/task0-task5）"; exit 1 ;;
          esac
          echo "=== 修复管线测试完成 (SYNC_FAILED=${SYNC_FAILED}) ==="

      - name: Initialize sync
        if: ${{ inputs.run_mode == '' || inputs.run_mode == '同步' }}
        run: |
          source /tmp/load_all.sh
          PROCESSED_FILES_LOG="processed_videos.log"
          SYNC_SKIP_QUIET=0
          SYNC_SKIPPED=0
          SYNC_FAILED=0
          SYNC_TRANSFERRED_BYTES=0
          AUTO_SPLIT_INFO=""
          SYNC_AUTO_SPLIT_DEPTH=0
          # 集中定义阈值，避免魔数散落各处
          LARGE_FILE_THRESHOLD_BYTES="${LARGE_FILE_THRESHOLD:-4000000000}"
          SYNC_SPLIT_THRESHOLD_BYTES="${SYNC_SPLIT_THRESHOLD:-50000000000}"
          # 同步任务在独立的 Actions step 中执行（每个 step 是独立 shell），
          # 必须写入 GITHUB_ENV 才能在后续 step 中保留；否则 threshold 为空，
          # 触发 `[: : integer expression expected` 错误。
          echo "PROCESSED_FILES_LOG=$PROCESSED_FILES_LOG" >> "$GITHUB_ENV"
          echo "LARGE_FILE_THRESHOLD_BYTES=$LARGE_FILE_THRESHOLD_BYTES" >> "$GITHUB_ENV"
          echo "SYNC_SPLIT_THRESHOLD_BYTES=$SYNC_SPLIT_THRESHOLD_BYTES" >> "$GITHUB_ENV"
          echo "=== 初始化已处理文件日志 ===" > "$PROCESSED_FILES_LOG"
          echo "开始时间: $(date)" >> "$PROCESSED_FILES_LOG"
          echo "==========================" >> "$PROCESSED_FILES_LOG"

          # 初始化全局进度通知（任务在预览阶段自动注册）
          progress_init

      # ===== 所有同步任务定义 + 预览 + 执行 =====
      # 增减任务只需编辑下方 run_all_tasks 函数体；rclone 参数编辑下方 RCLONE_*_FLAGS 数组。
      - name: Preview and sync all tasks
        if: ${{ inputs.run_mode == '' || inputs.run_mode == '同步' }}
        run: |
          source /tmp/load_all.sh

          # 等待 OpenList 就绪（容器刚启动时 401/429 会导致预览 0 B/0 文件、同步无谓重传）
          # 注意：不能用 rclone lsd 反复探测，会触发后端 429 Too Many Requests
          echo "等待 OpenList 就绪..."
          _wait_openlist_ready() {
            local i code c t
            # 阶段1: HTTP /ping 起来
            for i in $(seq 1 40); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5244/ping 2>/dev/null || echo "000")
              [ "$code" = "200" ] && break
              sleep 2
            done
            if [ "$code" != "200" ]; then
              echo "⚠️ OpenList HTTP 未就绪 (code=${code})"
              return 1
            fi
            echo "HTTP 就绪，尝试获取 token..."
            # 阶段2: 获取 token 用于 API 探测（多个候选路径）
            local OL_TOKEN=""
            for c in \
              "/opt/openlist-data/config.json" \
              "/dropbox/self-hosted/openlist/data/config.json" \
              "/dropbox/self-hosted/openlist/data/conf/config.json" \
              "/data/openlist/data/config.json"; do
              [ -f "$c" ] || continue
              t=$(jq -r '.token // .jwt_secret // empty' "$c" 2>/dev/null || echo "")
              if [ -n "$t" ] && [ "$t" != "null" ]; then
                OL_TOKEN="$t"
                echo "  token: OK (来自 ${c}, 长度 ${#OL_TOKEN})"
                break
              fi
            done
            # 阶段3: 等驱动初始化（长等待 120s，给 ali + crypt 拉元数据）
            echo "等待驱动初始化 (120s) ..."
            sleep 120
            # 阶段4: 单次 rclone 验证（最多 2 次，避免 429）
            if rclone lsd openlist: >/dev/null 2>&1; then
              echo "WebDAV(rclone) 验证通过"
              return 0
            fi
            echo "再等 90s ..."
            sleep 90
            if rclone lsd openlist: >/dev/null 2>&1; then
              echo "WebDAV(rclone) 验证通过（第二次）"
              return 0
            fi
            sleep 60
            rclone lsd openlist: >/dev/null 2>&1 \
              && { echo "WebDAV(rclone) 验证通过（第三次）"; return 0; } \
              || echo "⚠️ WebDAV 仍未就绪，继续执行"
            return 1
          }
          _wait_openlist_ready || true
          unset -f _wait_openlist_ready

          # ===== rclone 参数集中配置（修改参数只需编辑此处）=====
          # sync_task / copy_task 共用的默认 rclone 参数
          RCLONE_DEFAULT_FLAGS=(
            --progress
            --stats 15s
            --stats-one-line
            --ignore-errors
            --verbose
            --size-only
            --timeout 5m
            --contimeout 30s
            --retries 1
            --low-level-retries 3
          )

          # sync_task 特有参数（rclone sync 模式，删除目标端多余文件，自动追加）
          # 禁止加 --delete-excluded: rclone 语义下 filter 排除的文件"不传输也不删除"，
          #   这是已修复文件（original/alternative）在 sync 模式下唯一的删除保护；
          #   --delete-excluded 会连排除项一起删掉，直接毁掉修复成果。
          #   代价: --exclude 匹配的历史文件（如 notion/）会在目标端残留，可接受。
          RCLONE_SYNC_TASK_FLAGS=(
            --delete-before
          )

          # ===== 所有同步任务定义（增减任务只需在此添加/删除一行）=====
          # 所有任务统一 sync_task（rclone sync，删除目标端多余文件）:
          #   - --delete-before 等由 RCLONE_SYNC_TASK_FLAGS 自动追加
          #   - 已修复文件（original/alternative）由 sync.sh 的 filter-from 排除，
          #     排除 = 不传输 + 不删除，sync 模式下不会被误删
          # gd_task    = Google Drive 专用同步（处理配额超限、API 限流等 GD 特有错误）
          # 可选参数: --auto-split  --1d-skip (或 --2d-skip / --3d-skip 自定义天数)
          # 其余 rclone 参数（如 --exclude）直接追加在后面
          # 共有/特有 rclone 参数请在上方 RCLONE_*_FLAGS 数组中集中修改
          run_all_tasks() {
            sync_task "onedrive:backup" "openlist:aliyundriveCrypt/backup" "backup" --auto-split --1d-skip --exclude "/notion/**" --exclude "notion/**" --exclude "/self-hosted_latest.tar.gz" --exclude "self-hosted_latest.tar.gz" --exclude "/github_repos_latest.tar.gz" --exclude "github_repos_latest.tar.gz"
            sync_task "onedrive:backup" "openlist:wopan176Crypt/backup" "backup" --auto-split --1d-skip
            # gd_task "onedrive:backup" "gd:backup" "backup" --1d-skip

            sync_task "onedrive:0" "openlist:wopan176Crypt/0" "task0" --auto-split --1d-skip
            sync_task "onedrive:0" "openlist:baidupanCrypt/0" "task0" --auto-split --1d-skip
            sync_task "onedrive:0/j-1024j-视频-pornhub-favorites" "openlist:wopan175/0/j-1024j-视频-pornhub-favorites" "task0" --auto-split --1d-skip
            # gd_task "onedrive:0" "gd:0" "task0" --1d-skip

            sync_task "onedrive:1" "openlist:wopan176Crypt/1" "task1" --auto-split --1d-skip
            sync_task "onedrive:1" "openlist:baidupanCrypt/1" "task1" --auto-split --1d-skip
            sync_task "onedrive:1" "openlist:wopan175/1" "task1" --auto-split --1d-skip
            # gd_task "onedrive:1" "gd:1" "task1" --1d-skip

            sync_task "onedrive:2" "openlist:wopan176Crypt/2" "task2" --auto-split --1d-skip
            sync_task "onedrive:2" "openlist:wopan175/2" "task2" --auto-split --1d-skip
            # gd_task "onedrive:2" "gd:2" "task2" --1d-skip

            sync_task "onedrive:3" "openlist:wopan176Crypt/3" "task3" --auto-split --1d-skip
            sync_task "onedrive:3" "openlist:wopan175/3" "task3" --auto-split --1d-skip
            # gd_task "onedrive:3" "gd:3" "task3" --1d-skip

            sync_task "onedrive:4" "openlist:wopan176Crypt/4" "task4" --auto-split --1d-skip
            sync_task "onedrive:4" "openlist:wopan175/4" "task4" --auto-split --1d-skip

            sync_task "onedrive:5" "openlist:wopan176Crypt/5" "task5" --auto-split --1d-skip
            sync_task "onedrive:5" "openlist:wopan175/5" "task5" --auto-split --1d-skip
          }

          if [ "${{ inputs.skip_preview }}" = "true" ]; then
            echo "=== 跳过任务预览（skip_preview=true，直接开始同步）==="
          else
            echo "=== 发送任务预览通知 ==="
            TASK_PREVIEW_ONLY=1 run_all_tasks
            flush_task_preview
            echo "=== 所有任务预览通知已发送 ==="
          fi

          echo "=== 开始同步所有任务 ==="
          run_all_tasks
          echo "=== 所有任务同步完成 ==="

      - name: Finalize and cleanup
        # always(): 大任务（如 task0 的 226GiB）常态撞 6h job 上限被取消，
        # 本 run 已完成的 marker/processed log 收尾不能丢——run 31954162437
        # 实测取消后 always() step（Persist）仍会执行，此处同理
        if: ${{ always() && (inputs.run_mode == '' || inputs.run_mode == '同步') }}
        run: |
          source /tmp/load_all.sh
          actual_entries=0
          total_lines=0
          DELETE_COUNT=0

          # 标记全局进度通知为最终完成状态
          progress_finalize

          if [ -f "processed_videos.log" ]; then
            total_lines=$(wc -l < "processed_videos.log" 2>/dev/null || echo 0)
            actual_entries=$((total_lines - 3))
            echo "==========================" >> "processed_videos.log"
            echo "结束时间: $(date)" >> "processed_videos.log"
            echo "=== 所有同步任务完成 ===" >> "processed_videos.log"

            if [ "$actual_entries" -gt 0 ]; then
              REMOTE_PROC_LOG="onedrive:/logs/processed/processed_videos_$(date +%Y%m%d_%H%M%S).log"
              rclone copyto "processed_videos.log" "$REMOTE_PROC_LOG" || true
            fi

            rm -f "processed_videos.log" 2>/dev/null || true
          fi

          # 镜像同步状态标记到 Dropbox（marker 是修复文件还原链路的唯一索引，
          # 与源端同在 OneDrive —— OneDrive 整体故障时灾难恢复需要外置副本）
          echo "镜像 sync_state → dropbox..."
          rclone sync onedrive:/logs/sync_state dropbox:sync_state_mirror --create-empty-src-dirs 2>&1 | tail -2 || true
          echo "sync_state 镜像完成: $(rclone lsf dropbox:sync_state_mirror 2>/dev/null | wc -l | tr -d ' ') 个文件"

          rm -f /tmp/*.sh 2>/dev/null || true
          echo "所有同步任务完成！"

      # ===== 会话保持 + 数据库周期热备回传 =====
      # 原为纯 sleep 300m；runner 被强杀（VM 销毁/取消超时）时 Finalize 的
      # 回传来不及执行，改为每 5 分钟做一次一致性快照并回传变化的 db，
      # 强杀丢失窗口从 5 小时压缩到 ≤5 分钟。
      # 快照用 SQLite backup API（在线、逻辑一致），不直接拷 data.db 文件
      # （容器运行中直接拷可能捕获到撕裂状态）。
      - name: sleep
        if: ${{ inputs.run_mode == '' || inputs.run_mode == '同步' }}
        run: |
          LAST_MD5="${OPENLIST_DB_MD5_PULL:-none}"
          for i in $(seq 1 60); do
            sleep 300
            # 容器运行中的在线一致性快照（root 属主，用 sudo 读）
            if sudo python3 -c "import sqlite3; src=sqlite3.connect('file:/opt/openlist-data/data.db?mode=ro', uri=True); dst=sqlite3.connect('/tmp/data.db.snapshot'); src.backup(dst); dst.close(); src.close()" 2>/dev/null; then
              NEW_MD5=$(md5sum /tmp/data.db.snapshot 2>/dev/null | awk '{print $1}' || echo "")
              if [ -n "$NEW_MD5" ] && [ "$NEW_MD5" != "$LAST_MD5" ]; then
                if rclone copyto /tmp/data.db.snapshot dropbox:self-hosted/openlist/data/data.db; then
                  LAST_MD5="$NEW_MD5"
                  echo "[$(date -u +'%H:%M:%SZ')] db 已变化，热备回传完成 ($NEW_MD5)"
                else
                  echo "[$(date -u +'%H:%M:%SZ')] ⚠️ 热备回传失败，下轮重试"
                fi
              fi
            fi
          done
          sudo docker stop openlist

      # ===== 数据库回传（所有模式 + 失败/取消也执行）=====
      # 停容器（幂等）→ SQLite 干净关闭、-wal/-shm 由 SQLite 自行清理/合并
      # → 整目录 rclone sync 镜像回传（未变化的 db 跳过，防止并发场景覆盖）。
      # if: always() 保证同步步骤失败/手动取消时，会话内的配置变更也能回传
      # （runner 被强杀除外——该场景由上一步的周期热备兜底）。
      - name: "Persist: openlist 数据库回传"
        if: ${{ always() }}
        run: |
          sudo docker stop openlist 2>/dev/null || true
          CUR_MD5=$(md5sum /opt/openlist-data/data.db 2>/dev/null | awk '{print $1}' || echo "none")
          if [ "$CUR_MD5" = "${OPENLIST_DB_MD5_PULL:-none}" ]; then
            echo "db 未变化（${CUR_MD5}），跳过回传"
          else
            echo "db 已变化（${OPENLIST_DB_MD5_PULL:-none} → ${CUR_MD5}），sync 回传..."
            # 排除 -wal/-shm/-journal 后 sync 镜像（本地为权威副本）
            rclone sync /opt/openlist-data dropbox:self-hosted/openlist/data \
              --exclude "data.db-wal" --exclude "data.db-shm" --exclude "data.db-journal"
            # sync 的 exclude 不会删远端对应文件，显式清理可能残留的撕裂源
            rclone delete dropbox:self-hosted/openlist/data \
              --include "data.db-wal" --include "data.db-shm" --include "data.db-journal" 2>/dev/null || true
            echo "回传完成: $(rclone lsl dropbox:self-hosted/openlist/data 2>/dev/null | grep -c .) 个文件"
          fi
