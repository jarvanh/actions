# 备份文件到 openlist 中的网盘
name: openlist

on:
  workflow_dispatch:
    inputs:
      split_on_sync_failure:
        description: "Sync task 失败后，对该 task 源目录中的超阈值大文件执行切割"
        required: false
        type: boolean
        default: false
      force_sync:
        description: "强制同步（忽略跳过天数与源端缩小警告，始终执行）"
        required: false
        type: boolean
        default: false
      debug_crypt_size:
        description: "调试: 验证 OpenList crypt 大小报告（不执行同步）"
        required: false
        type: boolean
        default: false
      debug_sync_diff:
        description: "调试: 诊断源端 vs 目标端文件级差异（找出缺失/残留/大小不一致的文件）"
        required: false
        type: boolean
        default: false
  schedule:
    # - cron: "10 1 * * *"
    - cron: "*/5 * * * *"
  watch:
    types: started

jobs:
  build:
    env:
      OPENLIST_SPLIT_ON_SYNC_FAILURE: ${{ inputs.split_on_sync_failure || 'false' }}
      FORCE_SYNC: ${{ inputs.force_sync || 'false' }}
      # Telegram 通知凭据（注入为环境变量供脚本文件使用）
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    concurrency: openlist-singleton
    runs-on: ubuntu-latest
    steps:
      # 检出仓库，使 .github/scripts/openlist/ 下的脚本文件可用
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: rclone-install
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: rclone-config
        env:
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE }}
        run: |
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG_SECRET
          EOF

          # 在 rclone 命令可能打印配置详情前，掩码配置中的嵌套密钥
          python3 << 'PY'
          import json
          import re
          from pathlib import Path

          text = Path.home().joinpath(".config/rclone/rclone.conf").read_text()
          secrets = set()

          for match in re.finditer(r'(?im)^\s*(?:client_secret|pass|password)\s*=\s*(.+?)\s*$', text):
              secrets.add(match.group(1).strip())

          for match in re.finditer(r'(?im)^\s*token\s*=\s*(\{.*\})\s*$', text):
              try:
                  token = json.loads(match.group(1))
              except Exception:
                  continue
              for key in ("access_token", "refresh_token", "id_token"):
                  value = token.get(key)
                  if value:
                      secrets.add(str(value))

          for value in sorted(secrets, key=len, reverse=True):
              if value:
                  print(f"::add-mask::{value}")
          PY


      - name: rclone-run
        run: |
          echo "==========onedrive==========="
          rclone lsf onedrive:
          echo "==========dropbox==========="
          rclone lsf dropbox:

          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo mkdir -p /dropbox
          sudo nohup rclone mount dropbox: /dropbox --no-gzip-encoding --umask 000 --allow-other --attr-timeout 10m --vfs-cache-mode full --vfs-cache-max-age 5m --vfs-read-chunk-size-limit 10G --buffer-size 100M --vfs-cache-max-size 10G &

      - name: Run openlist container
        run: |
          sudo docker rm -f openlist 2>/dev/null || true
          sudo docker run -d --restart=unless-stopped -v /dropbox/self-hosted/openlist/data:/opt/openlist/data -p 5244:5244 -e PUID=0 -e PGID=0 -e UMASK=022 --name="openlist" openlistteam/openlist:latest

      - name: sleep
        run: |
          sudo sleep 1m

      - name: Verify docker container is running
        run: docker ps --filter name=openlist --filter status=running | grep -q openlist

      - name: install cloudflared
        run: |
          sudo mkdir ~/.cloudflared/
          sudo rclone copy dropbox:self-hosted/.cloudflared ~/.cloudflared -vv
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Check if the tunnel is running
        env:
          TUNNEL_NAME: "openlist"
        run: |
          OUTPUT=$(cloudflared tunnel list)
          TUNNEL_LINE=$(echo "$OUTPUT" | grep -w "$TUNNEL_NAME")
          if [ -z "$TUNNEL_LINE" ]; then
            echo "The tunnel '$TUNNEL_NAME' does not exist. Proceeding."
            exit 31
          fi

          CONNECTIONS=$(echo "$TUNNEL_LINE" | awk '{if (NF>=4) print $4; else print "-"}')
          if [ "$CONNECTIONS" == "-" ]; then
            echo "The tunnel '$TUNNEL_NAME' exists but has no active connections. Proceeding."
          else
            echo "The tunnel '$TUNNEL_NAME' is running with connections: $CONNECTIONS. Stopping actions."
            exit 0
          fi

      - name: run cloudflared
        run: |
          # DNS 路由只需创建一次；检查是否已解析到该隧道，避免重复 API 调用
          if ! dig +short openlist.'${{ secrets.VD }}'.eu.org | grep -q .; then
            cloudflared tunnel route dns openlist openlist.'${{ secrets.VD }}'.eu.org
          else
            echo "DNS 路由已存在，跳过 cloudflared tunnel route dns"
          fi
          nohup cloudflared tunnel run --url http://127.0.0.1:5244 openlist &

      - name: Install required tools
        run: |
          echo "Installing ffmpeg, jq, coreutils..."
          sudo apt-get install -y ffmpeg jq coreutils bc p7zip-full

      # ===== 临时调试: 验证 crypt 大小报告 =====
      # 确认 OpenList crypt 通过 WebDAV 返回的是明文大小还是加密后大小
      # 诊断完成后可删除此 step 及对应的 workflow_dispatch input
      - name: "Debug: 验证 crypt 大小报告"
        if: ${{ inputs.debug_crypt_size == true }}
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "  验证 OpenList crypt 大小报告"
          echo "=========================================="

          # ===== OpenList 就绪探测 =====
          # 注意：不能用 rclone lsd 反复探测，会触发后端 429 Too Many Requests
          # 策略：/ping 等 HTTP 起来 → 诊断 config/token → 用 /api 探测存储驱动 →
          #       充足等待驱动初始化 → 最后 rclone 验证
          echo "等待 OpenList 就绪..."

          # 阶段1: 等 HTTP /ping（纯本地，不触发任何后端存储）
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5244/ping 2>/dev/null || echo "000")
            [ "$code" = "200" ] && { echo "HTTP 就绪 (${i}次, code=${code})"; break; }
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "⚠️ HTTP 未就绪 (code=${code})，放弃等待"
          else
            # 阶段2: 诊断 OpenList 配置和 token
            CONFIG_CANDIDATES=(
              "/dropbox/self-hosted/openlist/data/config.json"
              "/dropbox/self-hosted/openlist/data/conf/config.json"
              "/data/openlist/data/config.json"
              "/tmp/openlist_data/config.json"
            )
            OL_TOKEN=""
            OL_CONFIG=""
            for c in "${CONFIG_CANDIDATES[@]}"; do
              if [ -f "$c" ]; then
                t=$(jq -r '.token // .jwt_secret // empty' "$c" 2>/dev/null || echo "")
                if [ -n "$t" ] && [ "$t" != "null" ]; then
                  OL_TOKEN="$t"
                  OL_CONFIG="$c"
                  echo "找到配置: ${OL_CONFIG}，token 长度: ${#OL_TOKEN}"
                  break
                else
                  echo "配置文件 ${c} 存在但 token/jwt_secret 为空或不存在"
                  echo "  顶层 keys: $(jq -r 'keys | join(", ")' "$c" 2>/dev/null || echo '无法解析')"
                fi
              fi
            done
            if [ -z "$OL_CONFIG" ]; then
              echo "⚠️ 未找到可用的 OpenList 配置文件。列出候选路径:"
              for c in "${CONFIG_CANDIDATES[@]}"; do
                [ -f "$c" ] && echo "  存在: $c (size $(wc -c < $c))" || echo "  不存在: $c"
              done
              # 尝试从挂载目录结构找
              echo "  查找 openlist 相关文件..."
              find /dropbox /data -maxdepth 5 -name "config.json" -path "*openlist*" 2>/dev/null | head -5
            fi

            # 阶段3: 通过 HTTP API /api/storage/list 看存储驱动是否加载（不用 WebDAV，不触发 401）
            echo "检测存储驱动加载情况..."
            _check_storage() {
              local t_out="/tmp/_ol_storage_$$"
              local hdrs=(-H "Content-Type: application/json")
              [ -n "$OL_TOKEN" ] && hdrs+=(-H "Authorization: ${OL_TOKEN}")
              # /api/auth/getstatus 能返回会话状态，不用鉴权
              local code
              code=$(curl -s -o "$t_out" -w "%{http_code}" "${hdrs[@]}" \
                "http://127.0.0.1:5244/api/auth/getstatus" 2>/dev/null || echo "000")
              if [ "$code" = "200" ] && [ -s "$t_out" ]; then
                echo "  /api/auth/getstatus 200: $(head -c 200 "$t_out")..."
              fi
              # /api/storage/list 查看存储列表
              code=$(curl -s -o "$t_out" -w "%{http_code}" "${hdrs[@]}" \
                "http://127.0.0.1:5244/api/storage/list" 2>/dev/null || echo "000")
              echo "  /api/storage/list code=${code}"
              if [ "$code" = "200" ] && [ -s "$t_out" ]; then
                local count
                count=$(jq -r '.data // . | if type=="array" then length else 0 end' "$t_out" 2>/dev/null || echo 0)
                echo "    存储驱动数: ${count}"
                if [ "${count}" -gt 0 ] 2>/dev/null; then
                  echo "    驱动名: $(jq -r '[.data // .[] | .mount_path // .name // .driver] | join(", ")' "$t_out" 2>/dev/null || echo 'N/A')"
                fi
              else
                echo "    响应: $(head -c 200 "$t_out" 2>/dev/null)"
              fi
              rm -f "$t_out"
            }
            _check_storage

            # 阶段4: 充足等待 crypt 驱动初始化 + ali 网盘拉元数据
            echo "等待驱动初始化 (120s) ..."
            sleep 120
            _check_storage

            # 阶段5: 用 rclone 验证 WebDAV
            if rclone lsd openlist: >/dev/null 2>&1; then
              echo "WebDAV(rclone) 验证通过"
            else
              echo "WebDAV 未通过，再等 90s ..."
              sleep 90
              if rclone lsd openlist: >/dev/null 2>&1; then
                echo "WebDAV(rclone) 验证通过（第二次）"
              else
                echo "⚠️ WebDAV 仍未通过，最后一次尝试前再等 60s ..."
                sleep 60
                rclone lsd openlist: >/dev/null 2>&1 \
                  && echo "WebDAV(rclone) 验证通过（第三次）" \
                  || echo "⚠️ WebDAV 仍未就绪，继续执行（可能出现 401/429 错误）"
              fi
            fi
          fi

          # 刷新所有 Crypt 远程的缓存（避免 stale listing 影响判断）
          # 验证范围: 覆盖 workflow 中 run_all_tasks() 里所有 *Crypt 目标端（wopan175/GoogleDrive 非 Crypt 不测）
          VERIFY_PAIRS=(
            # aliyundriveCrypt (sync)
            "onedrive:backup|openlist:aliyundriveCrypt/backup"
            # wopan176Crypt (copy, 7 条不同路径)
            "onedrive:backup|openlist:wopan176Crypt/backup"
            "onedrive:0|openlist:wopan176Crypt/0"
            "onedrive:1|openlist:wopan176Crypt/1"
            "onedrive:2|openlist:wopan176Crypt/2"
            "onedrive:3|openlist:wopan176Crypt/3"
            "onedrive:4|openlist:wopan176Crypt/4"
            "onedrive:5|openlist:wopan176Crypt/5"
            # baidupanCrypt (sync, 2 条不同路径)
            "onedrive:0|openlist:baidupanCrypt/0"
            "onedrive:1|openlist:baidupanCrypt/1"
          )
          # 去重提取需要刷新缓存的 OpenList 路径
          UNIQUE_OL_PATHS=()
          for pair in "${VERIFY_PAIRS[@]}"; do
            dst="${pair#*|}"
            ol_path="/${dst#openlist:}"
            seen=0
            for p in "${UNIQUE_OL_PATHS[@]}"; do [ "$p" = "$ol_path" ] && { seen=1; break; }; done
            [ "$seen" = "0" ] && UNIQUE_OL_PATHS+=("$ol_path")
          done

          if [ -n "$OL_TOKEN" ] && [ "$OL_TOKEN" != "null" ]; then
            for ol_path in "${UNIQUE_OL_PATHS[@]}"; do
              echo "刷新 OpenList 缓存 ${ol_path} ..."
              rcode=$(curl -s -o /tmp/_ol_refresh -w "%{http_code}" -X POST \
                -H "Authorization: ${OL_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"path\":\"${ol_path}\",\"recursive\":true}" \
                "http://127.0.0.1:5244/api/fs/refresh" 2>/dev/null || echo "000")
              echo "  refresh ${ol_path} code=${rcode}  $(head -c 200 /tmp/_ol_refresh 2>/dev/null)"
              rm -f /tmp/_ol_refresh
            done
            sleep 15
          else
            echo "跳过缓存刷新 (token 不可用)"
          fi

          # ===== 对每个 Crypt 远程逐一验证 =====
          # 汇总结果用于最后输出总结论
          OVERALL_MATCH=0
          OVERALL_CRYPT=0
          OVERALL_OTHER=0
          OVERALL_NO_COMMON=0
          rm -f /tmp/_verify_result.txt

          for pair in "${VERIFY_PAIRS[@]}"; do
            src_remote="${pair%|*}"
            dst_remote="${pair#*|}"

            echo ""
            echo "######################################################"
            echo "# 对比: ${src_remote}  →  ${dst_remote}"
            echo "######################################################"

            # 目录结构诊断
            echo "--- 目标端目录结构 (${dst_remote}) ---"
            rclone lsd "${dst_remote}" 2>&1 | head -10
            echo ""

            # 获取源端列表（非递归根目录）
            echo "--- 获取源端文件列表 (${src_remote}) ---"
            timeout 60 rclone lsjson "${src_remote}" --no-modtime --no-mimetype 2>/tmp/src_err.txt > "/tmp/src_${$}.json" || true
            src_count=$(jq '[.[] | select(.IsDir == false)] | length' "/tmp/src_${$}.json" 2>/dev/null || echo 0)
            echo "源端根目录文件数: ${src_count}"
            [ -s /tmp/src_err.txt ] && echo "源端错误:" && cat /tmp/src_err.txt

            # 获取目标端列表
            echo "--- 获取目标端文件列表 (${dst_remote}) ---"
            timeout 60 rclone lsjson "${dst_remote}" --no-modtime --no-mimetype 2>/tmp/dst_err.txt > "/tmp/dst_${$}.json" || true
            dst_count=$(jq '[.[] | select(.IsDir == false)] | length' "/tmp/dst_${$}.json" 2>/dev/null || echo 0)
            echo "目标端根目录文件数: ${dst_count}"
            [ -s /tmp/dst_err.txt ] && echo "目标端错误:" && cat /tmp/dst_err.txt

            # 如果根目录无共同文件，取第一个共同子目录递归列出
            FIRST_SUBDIR=$(jq -r '[.[] | select(.IsDir == true)] | .[0].Path // empty' "/tmp/src_${$}.json" 2>/dev/null)
            if [ -n "$FIRST_SUBDIR" ]; then
              echo "--- 子目录比较: ${FIRST_SUBDIR} ---"
              timeout 90 rclone lsjson "${src_remote}/${FIRST_SUBDIR}" --recursive --no-modtime --no-mimetype 2>/tmp/src_sub_err.txt > "/tmp/src_sub_${$}.json" || true
              src_sub_count=$(jq '[.[] | select(.IsDir == false)] | length' "/tmp/src_sub_${$}.json" 2>/dev/null || echo 0)
              echo "源端子目录文件数: ${src_sub_count}"
              [ -s /tmp/src_sub_err.txt ] && echo "源端子目录错误:" && cat /tmp/src_sub_err.txt

              timeout 90 rclone lsjson "${dst_remote}/${FIRST_SUBDIR}" --recursive --no-modtime --no-mimetype 2>/tmp/dst_sub_err.txt > "/tmp/dst_sub_${$}.json" || true
              dst_sub_count=$(jq '[.[] | select(.IsDir == false)] | length' "/tmp/dst_sub_${$}.json" 2>/dev/null || echo 0)
              echo "目标端子目录文件数: ${dst_sub_count}"
              [ -s /tmp/dst_sub_err.txt ] && echo "目标端子目录错误:" && cat /tmp/dst_sub_err.txt
            fi

            echo ""
            echo "--- 大小对比分析 ---"
            python3 - "$src_remote" "$dst_remote" "/tmp/src_${$}.json" "/tmp/dst_${$}.json" "/tmp/src_sub_${$}.json" "/tmp/dst_sub_${$}.json" << 'PYEOF'
          import json, math, os, sys

          src_remote, dst_remote, src_path, dst_path, src_sub_path, dst_sub_path = sys.argv[1:7]

          def load_listing(path):
              try:
                  with open(path) as f:
                      data = json.load(f)
                  return {item['Path']: item['Size'] for item in data if not item.get('IsDir', False)}
              except Exception:
                  return {}

          src = load_listing(src_path)
          dst = load_listing(dst_path)
          src_sub = load_listing(src_sub_path) if os.path.exists(src_sub_path) else {}
          dst_sub = load_listing(dst_sub_path) if os.path.exists(dst_sub_path) else {}

          using_sub = False
          if (not src or not dst) and (src_sub and dst_sub):
              src, dst = src_sub, dst_sub
              using_sub = True
              print("(使用子目录数据)")
          elif src_sub and not dst and not dst_sub:
              src = {**src, **src_sub}

          common = sorted(set(src.keys()) & set(dst.keys()))

          # 挑选 copy 测试用文件（大文件优先，上限 4 GB）
          TEST_CANDIDATE = None
          TEST_SIZE = 0
          MAX_BYTES = 4 * 1024 * 1024 * 1024  # 4 GB
          if common:
              # 档位按大小降序取，优先最大的那个（但不超过 4 GB）
              eligible = sorted(
                  [n for n in common if 0 < src[n] <= MAX_BYTES],
                  key=lambda n: src[n], reverse=True
              )
              if eligible:
                  TEST_CANDIDATE = eligible[0]
                  TEST_SIZE = src[TEST_CANDIDATE]

          if TEST_CANDIDATE:
              with open('/tmp/_test_file.txt', 'w') as f:
                  f.write(f"{TEST_CANDIDATE}\n{'sub' if using_sub else 'root'}\n{TEST_SIZE}\n")

          print(f"源端文件数: {len(src)}")
          print(f"目标端文件数: {len(dst)}")
          print(f"共同文件数: {len(common)}")
          print()

          if not common:
              print("⚠️ 无共同文件")
              if src:
                  print("源端文件名样本:")
                  for name in list(src.keys())[:3]:
                      print(f"  {name}  ({src[name]:,} bytes)")
              if dst:
                  print("目标端文件名样本:")
                  for name in list(dst.keys())[:3]:
                      print(f"  {name}  ({dst[name]:,} bytes)")
              if not dst:
                  print("\n目标端为空 — 可能原因:")
                  print("  - OpenList 缓存未刷新 / 驱动未就绪")
                  print("  - crypt 路径不正确（检查上方目录结构）")
                  print("  - OpenList crypt 驱动未配置")
              # 写入汇总标记
              with open('/tmp/_verify_result.txt', 'a') as f:
                  f.write(f"{dst_remote}|NO_COMMON\n")
          else:
              match_count = 0
              crypt_count = 0
              other_count = 0

              for name in common[:5]:
                  s = src[name]
                  d = dst[name]
                  expected_crypt = 32 + 16 * math.ceil(s / 64)
                  if s == d:
                      status = "✅ 一致 (明文大小)"
                      match_count += 1
                  elif d == expected_crypt:
                      status = f"🔴 加密后大小 (差异 {d-s} = 32 + 16*ceil({s}/64))"
                      crypt_count += 1
                  else:
                      status = f"⚠️ 不一致 (差异 {d-s}, 预期 crypt 开销 {expected_crypt-s})"
                      other_count += 1
                  print(f"  {name}")
                  print(f"    源端: {s:,} bytes")
                  print(f"    目标: {d:,} bytes")
                  print(f"    {status}")
                  print()

              print("=" * 50)
              if crypt_count > 0 and match_count == 0:
                  print("🔴 结论: OpenList WebDAV 报告的是加密后大小")
                  print("   --size-only 永远不匹配 → 每次都会重传")
                  print("   建议: copy_task 加 --ignore-size --update，或改用 rclone crypt remote")
                  with open('/tmp/_verify_result.txt', 'a') as f:
                      f.write(f"{dst_remote}|CRYPT\n")
              elif match_count > 0 and crypt_count == 0:
                  print("✅ 结论: OpenList WebDAV 报告的是明文大小")
                  print("   --size-only 应正常工作")
                  with open('/tmp/_verify_result.txt', 'a') as f:
                      f.write(f"{dst_remote}|PLAIN\n")
              elif other_count > 0:
                  print("⚠️ 结论: 大小不一致但不符合 crypt 开销规律")
                  print("   需进一步调查 (可能是缓存问题或上传不完整)")
                  with open('/tmp/_verify_result.txt', 'a') as f:
                      f.write(f"{dst_remote}|OTHER\n")
              else:
                  print("⚠️ 混合结果，请查看上方详细对比")
                  with open('/tmp/_verify_result.txt', 'a') as f:
                      f.write(f"{dst_remote}|MIXED\n")
          PYEOF

            # ===== Copy 测试: 用刚比对过、大小一致的文件实测 rclone --size-only 是否生效 =====
            # 使用与 copy_task 相同的 flag (--size-only --no-traverse)，对单个文件执行实际 copy
            if [ -f /tmp/_test_file.txt ]; then
              TEST_FILE=$(sed -n '1p' /tmp/_test_file.txt)
              TEST_LOC=$(sed -n '2p' /tmp/_test_file.txt)
              TEST_SIZE=$(sed -n '3p' /tmp/_test_file.txt)
              # 若文件来自子目录，需拼接子目录前缀作为 --include 路径
              if [ "$TEST_LOC" = "sub" ] && [ -n "$FIRST_SUBDIR" ]; then
                TEST_INCLUDE="${FIRST_SUBDIR}/${TEST_FILE}"
              else
                TEST_INCLUDE="${TEST_FILE}"
              fi
              # 按大小设定 rclone 超时 (大文件给足时间，但又不至于卡死 workflow)
              TEST_SIZE_MB=$(( (TEST_SIZE + 1048575) / 1048576 ))
              # 按 20 MB/s 估计速度 * 3 倍余量 + 基础 90s；上限 1800s 下限 120s
              TIMEOUT_SEC=$(( TEST_SIZE_MB / 20 * 3 + 90 ))
              [ "$TIMEOUT_SEC" -lt 120 ] && TIMEOUT_SEC=120
              [ "$TIMEOUT_SEC" -gt 1800 ] && TIMEOUT_SEC=1800

              echo ""
              echo "--- Copy 测试: rclone copy --size-only --no-traverse ---"
              echo "  测试文件: ${TEST_INCLUDE}  (约 ${TEST_SIZE_MB} MB / ${TEST_SIZE} bytes)"
              echo "  源端: ${src_remote}"
              echo "  目标: ${dst_remote}"
              echo "  预估实拷 timeout: ${TIMEOUT_SEC}s (若需要执行)"
              echo ""

              # 阶段 1: Dry-run — 看 rclone 对大小一致的文件会做什么
              echo "[1/2] Dry-run (不会真的传数据):"
              DRY_LOG="/tmp/_dry_$$.log"
              rclone copy "${src_remote}" "${dst_remote}" \
                --include "${TEST_INCLUDE}" \
                --size-only --no-traverse --dry-run \
                --verbose --stats-one-line --stats 0 \
                --timeout 5m --contimeout 30s --retries 1 --low-level-retries 3 \
                > "$DRY_LOG" 2>&1
              cat "$DRY_LOG" | head -20
              echo ""
              echo "  → Dry-run 结论判读:"
              if grep -qiE 'Skipped|: \(SKIPPED\)|INFO.*0 (transferred|Bytes)' "$DRY_LOG" \
                 && ! grep -qiE 'Copied.*replaced|NOTICE.*Copied|would copy|Transferred:\s+[1-9]' "$DRY_LOG"; then
                echo "    ✅ Dry-run: 大小一致，计划 SKIP（不重传）"
                DRY_SKIP=1
              elif grep -qiE 'Copied.*replaced|NOTICE.*Copied|would copy|Transferred:\s+[1-9]' "$DRY_LOG"; then
                echo "    🔴 Dry-run: 计划 RE-COPY（会重传，存在问题！）"
                DRY_SKIP=0
              else
                echo "    ⚠️ Dry-run: 无法确定，请查看上方详细日志"
                # 日志里看不清楚时保守执行（对 >500MB 文件还是跳过，怕卡太久）
                if [ "$TEST_SIZE_MB" -gt 500 ]; then
                  echo "    文件太大，跳过实拷以免卡死 step。"
                  DRY_SKIP=1
                else
                  DRY_SKIP=0
                fi
              fi
              echo ""

              # 阶段 2: 实拷（仅当 dry-run 显示要重传或文件较小时执行，避免白等几十分钟）
              if [ "$DRY_SKIP" = "1" ]; then
                echo "[2/2] 实拷 — 跳过（dry-run 已确认 SKIP，实拷无意义，不消耗时间）"
              else
                echo "[2/2] 实拷 — 确认实际行为 (timeout ${TIMEOUT_SEC}s):"
                timeout "${TIMEOUT_SEC}" rclone copy "${src_remote}" "${dst_remote}" \
                  --include "${TEST_INCLUDE}" \
                  --size-only --no-traverse \
                  --verbose --stats 15s --stats-one-line \
                  --timeout 10m --contimeout 30s --retries 1 --low-level-retries 3 \
                  2>&1 | tail -60
                COPY_RC=${PIPESTATUS[0]}
                echo ""
                echo "  → 实拷结论:"
                echo "    rclone exit code: ${COPY_RC}"
                echo "    判读关键字: 'Skipped'=正常  |  'Copied (replaced existing)'=存在问题  |  无特殊 INFO=空跑/跳过"
              fi
              rm -f "$DRY_LOG"
              echo ""
              echo "  总判读:"
              echo "    Dry-run SKIP → --size-only 正常，rclone 比较结果与 WebDAV 报告一致"
              echo "    Dry-run RECOPY + 实拷也显示 Copied → 虽大小相同但 rclone 仍上传（bug场景）"
              rm -f /tmp/_test_file.txt
            else
              echo "  (无匹配文件，跳过 copy 测试)"
            fi

            # 清理本对临时文件
            rm -f "/tmp/src_${$}.json" "/tmp/dst_${$}.json" "/tmp/src_sub_${$}.json" "/tmp/dst_sub_${$}.json"
          done

          # ===== 输出总结论 =====
          echo ""
          echo "======================================================"
          echo "  总结论 (全部 Crypt 远程)"
          echo "======================================================"
          # Python 子进程将每个远程的结论写入 /tmp/_verify_result.txt
          if [ -f /tmp/_verify_result.txt ]; then
            while IFS='|' read -r remote result; do
              case "$result" in
                CRYPT)     echo "🔴 ${remote}: 报告加密后大小（--size-only 失效）" ;;
                PLAIN)     echo "✅ ${remote}: 报告明文大小（--size-only 正常）" ;;
                OTHER)     echo "⚠️ ${remote}: 大小不一致但非 crypt 开销" ;;
                MIXED)     echo "⚠️ ${remote}: 混合结果" ;;
                NO_COMMON) echo "⚠️ ${remote}: 无共同文件（驱动未就绪或路径不对）" ;;
                *)         echo "?  ${remote}: ${result}" ;;
              esac
            done < /tmp/_verify_result.txt
          else
            echo "(未收集到结果，请查看上方每个 Crypt 远程的详细输出)"
          fi
          rm -f /tmp/_verify_result.txt

          echo ""
          echo "=========================================="
          echo "  验证完成"
          echo "=========================================="

      # ===== 临时调试: 诊断源端 vs 目标端文件级差异 =====
      # 找出"预估待同步 +N 文件 / +M bytes"的具体来源：
      #   1. 缺失（源端有、目标端没有）
      #   2. 残留（目标端有、源端没有）
      #   3. 大小不一致（两端都有但大小不同 — 可能是上传不完整/crypt 损坏）
      # 诊断完成后可删除此 step 及对应的 workflow_dispatch input
      - name: "Debug: 诊断源端 vs 目标端文件差异"
        if: ${{ inputs.debug_sync_diff == true }}
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "  诊断源端 vs 目标端文件级差异"
          echo "=========================================="

          # ===== OpenList 就绪探测（简化版，复用 debug_crypt_size 的探测逻辑）=====
          echo "等待 OpenList 就绪..."
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5244/ping 2>/dev/null || echo "000")
            [ "$code" = "200" ] && { echo "HTTP 就绪 (${i}次)"; break; }
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "⚠️ HTTP 未就绪 (code=${code})，放弃等待"
          fi

          # 获取 token 用于刷新缓存
          OL_TOKEN=""
          for c in \
            "/dropbox/self-hosted/openlist/data/config.json" \
            "/dropbox/self-hosted/openlist/data/conf/config.json" \
            "/data/openlist/data/config.json"; do
            [ -f "$c" ] || continue
            t=$(jq -r '.token // .jwt_secret // empty' "$c" 2>/dev/null || echo "")
            if [ -n "$t" ] && [ "$t" != "null" ]; then
              OL_TOKEN="$t"
              echo "  token: OK (来自 ${c})"
              break
            fi
          done

          # 等驱动初始化（45s 给 ali + crypt 拉元数据）
          echo "等待驱动初始化 (45s) ..."
          sleep 45
          if ! rclone lsd openlist: >/dev/null 2>&1; then
            echo "WebDAV 未就绪，再等 90s ..."
            sleep 90
            rclone lsd openlist: >/dev/null 2>&1 \
              && echo "WebDAV(rclone) 验证通过" \
              || echo "⚠️ WebDAV 仍未就绪，继续执行（可能影响结果）"
          else
            echo "WebDAV(rclone) 验证通过"
          fi

          # ===== 要诊断的同步对清单 =====
          # 格式: "src|dst|excludes_csv"（与 run_all_tasks 中 copy_task/sync_task 的路径一致）
          # excludes_csv: 逗号分隔的 glob；aliyundriveCrypt/backup 有 --exclude 需在 Python 侧用 fnmatch 过滤
          DIFF_PAIRS=(
            "onedrive:backup|openlist:aliyundriveCrypt/backup|/notion/**,notion/**,/self-hosted_latest.tar.gz,self-hosted_latest.tar.gz,/github_repos_latest.tar.gz,github_repos_latest.tar.gz"
            "onedrive:backup|openlist:wopan176Crypt/backup|"
            "onedrive:0|openlist:wopan176Crypt/0|"
            "onedrive:1|openlist:wopan176Crypt/1|"
            "onedrive:2|openlist:wopan176Crypt/2|"
            "onedrive:3|openlist:wopan176Crypt/3|"
            "onedrive:4|openlist:wopan176Crypt/4|"
            "onedrive:5|openlist:wopan176Crypt/5|"
            "onedrive:0|openlist:baidupanCrypt/0|"
            "onedrive:1|openlist:baidupanCrypt/1|"
          )

          # 全局汇总
          rm -f /tmp/_diff_summary.txt
          DELAY_RECHECK_DONE=""
          RESTART_RECHECK_DONE=""

          for pair in "${DIFF_PAIRS[@]}"; do
            # pair 格式: "src|dst|excludes_csv"
            pair_src="${pair%%|*}"
            pair_rest="${pair#*|}"
            dst_remote="${pair_rest%%|*}"
            excludes_csv="${pair_rest#*|}"
            # dst_remote 不含 '|' 的情况下，#*| 会返回原值，所以如果 excludes_csv == dst_remote 说明没有 excludes
            if [ "$excludes_csv" = "$dst_remote" ]; then
              excludes_csv=""
            fi
            src_remote="$pair_src"

            echo ""
            echo "######################################################"
            echo "# 对比: ${src_remote}  →  ${dst_remote}"
            echo "######################################################"
            [ -n "$excludes_csv" ] && echo "  源端排除: ${excludes_csv}"

            # 刷新 OpenList 缓存（避免 stale listing 把已删除文件还报出来）
            if [ -n "$OL_TOKEN" ] && [ "$OL_TOKEN" != "null" ]; then
              ol_path="/${dst_remote#openlist:}"
              rcode=$(curl -s -o /tmp/_ol_refresh -w "%{http_code}" -X POST \
                -H "Authorization: ${OL_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"path\":\"${ol_path}\",\"recursive\":true}" \
                "http://127.0.0.1:5244/api/fs/refresh" 2>/dev/null || echo "000")
              echo "刷新缓存 ${ol_path} code=${rcode}  $(head -c 200 /tmp/_ol_refresh 2>/dev/null)"
              rm -f /tmp/_ol_refresh
              sleep 5
            fi

            # 用 rclone size 复核差异（与预览口径一致）— 并行获取
            echo "--- rclone size 复核 (并行) ---"
            _src_sz_tmp="/tmp/_src_sz_$$.json"
            _dst_sz_tmp="/tmp/_dst_sz_$$.json"
            timeout 300 rclone size "$src_remote" --json > "$_src_sz_tmp" 2>/dev/null &
            timeout 300 rclone size "$dst_remote" --json > "$_dst_sz_tmp" 2>/dev/null &
            wait
            src_size_json=$(cat "$_src_sz_tmp" 2>/dev/null || echo '{}')
            dst_size_json=$(cat "$_dst_sz_tmp" 2>/dev/null || echo '{}')
            rm -f "$_src_sz_tmp" "$_dst_sz_tmp"
            src_bytes=$(echo "$src_size_json" | jq -r '.bytes // 0')
            src_count=$(echo "$src_size_json" | jq -r '.count // 0')
            dst_bytes=$(echo "$dst_size_json" | jq -r '.bytes // 0')
            dst_count=$(echo "$dst_size_json" | jq -r '.count // 0')
            echo "  源端: ${src_bytes} bytes / ${src_count} 文件"
            echo "  目标: ${dst_bytes} bytes / ${dst_count} 文件"
            echo "  差异: $((src_bytes - dst_bytes)) bytes / $((src_count - dst_count)) 文件"

            # 获取两端完整文件列表（路径 + 大小）— 并行获取 src/dst
            # rclone lsf -R --files-only --format "ps" 输出 "path;size"
            # crypt remote 会自动解密文件名和大小（明文口径，可与源端直接对比）
            echo "--- 获取两端文件列表 (rclone lsf -R, 并行) ---"
            SRC_LIST="/tmp/_diff_src_$$.txt"
            DST_LIST="/tmp/_diff_dst_$$.txt"
            timeout 600 rclone lsf "$src_remote" -R --files-only --format "ps" --separator ";" \
              > "$SRC_LIST" 2>/tmp/_diff_src_err.txt &
            SRC_PID=$!
            timeout 600 rclone lsf "$dst_remote" -R --files-only --format "ps" --separator ";" \
              > "$DST_LIST" 2>/tmp/_diff_dst_err.txt &
            DST_PID=$!
            wait $SRC_PID || echo "⚠️ 源端 lsf 失败"
            wait $DST_PID || echo "⚠️ 目标端 lsf 失败"
            echo "  源端列表: $(wc -l < "$SRC_LIST" 2>/dev/null || echo 0) 行"
            echo "  目标列表: $(wc -l < "$DST_LIST" 2>/dev/null || echo 0) 行"
            [ -s /tmp/_diff_src_err.txt ] && { echo "源端 lsf 错误:"; cat /tmp/_diff_src_err.txt; }
            [ -s /tmp/_diff_dst_err.txt ] && { echo "目标端 lsf 错误:"; cat /tmp/_diff_dst_err.txt; }

            # Python 做差集分析
            python3 - "$src_remote" "$dst_remote" "$SRC_LIST" "$DST_LIST" "$excludes_csv" << 'PYEOF'
          import sys, os, fnmatch

          args = sys.argv[1:]
          src_remote = args[0]
          dst_remote = args[1]
          src_list   = args[2]
          dst_list   = args[3]
          excludes_csv = args[4] if len(args) > 4 else ""
          excludes = [p.strip() for p in excludes_csv.split(",") if p.strip()]

          def is_excluded(rel_path: str, patterns) -> bool:
              """与 rclone --exclude 语义尽量对齐：匹配任一 glob 就算命中
              - 路径带或不带前导 '/' 都要匹配
              - fnmatch 处理 ** 需要自定义：fnmatch 的 * 不跨 /；手动转换 **
              """
              if not patterns:
                  return False
              candidates = [rel_path, rel_path.lstrip("/")]
              if rel_path.startswith("/"):
                  pass
              else:
                  candidates.append("/" + rel_path)
              for pat in patterns:
                  p_clean = pat.strip()
                  if not p_clean:
                      continue
                  for cand in candidates:
                      # 简化版 ** 匹配：把 ** 转换为允许跨 '/' 的 glob
                      if "**" in p_clean:
                          # 转成正则：** -> '.*' ，* -> '[^/]*'，? -> '.'，其他 fnmatch_escape
                          import re
                          regex_parts = []
                          i = 0
                          while i < len(p_clean):
                              ch = p_clean[i]
                              if ch == '*' and i + 1 < len(p_clean) and p_clean[i+1] == '*':
                                  regex_parts.append('.*')
                                  i += 2
                              elif ch == '*':
                                  regex_parts.append('[^/]*')
                                  i += 1
                              elif ch == '?':
                                  regex_parts.append('.')
                                  i += 1
                              else:
                                  regex_parts.append(re.escape(ch))
                                  i += 1
                          rx = re.compile('^' + ''.join(regex_parts) + '$')
                          if rx.match(cand):
                              return True
                      else:
                          if fnmatch.fnmatch(cand, p_clean):
                              return True
              return False

          def human(b):
              b = float(b)
              for unit in ['B','KB','MB','GB','TB']:
                  if abs(b) < 1024:
                      return f"{b:.2f} {unit}"
                  b /= 1024
              return f"{b:.2f} PB"

          def load(path):
              items = {}
              if not os.path.exists(path):
                  return items
              with open(path) as f:
                  for line in f:
                      line = line.rstrip('\n')
                      if not line or ';' not in line:
                          continue
                      # path 可能含 ';'，但 rclone 路径通常不含；用 rpartition 安全取最后一段为 size
                      p, _, s = line.rpartition(';')
                      try:
                          size = int(s)
                      except ValueError:
                          size = 0
                      items[p] = size
              return items

          src_raw = load(src_list)
          dst = load(dst_list)

          # aliyundriveCrypt/backup 有 --exclude，从源端文件列表中剔除排除项，
          # 保证 only_src 计算口径与 sync_task 中实际使用 --exclude 的 rclone sync 一致
          if excludes:
              excluded_count = 0
              excluded_bytes = 0
              src = {}
              for p, s in src_raw.items():
                  if is_excluded(p, excludes):
                      excluded_count += 1
                      excluded_bytes += s
                      continue
                  src[p] = s
              if excluded_count:
                  print(f"  [debug] 源端按 excludes 过滤: 剔除 {excluded_count} 个文件 / {human(excluded_bytes)}")
          else:
              src = src_raw

          src_keys = set(src.keys())
          dst_keys = set(dst.keys())
          only_src = sorted(src_keys - dst_keys)         # 缺失（目标端没）
          only_dst = sorted(dst_keys - src_keys)         # 残留（源端没）
          common = sorted(src_keys & dst_keys)
          mismatch = [p for p in common if src[p] != dst[p]]  # 大小不一致

          only_src_bytes = sum(src[p] for p in only_src)
          only_dst_bytes = sum(dst[p] for p in only_dst)
          mismatch_src_bytes = sum(src[p] for p in mismatch)
          mismatch_dst_bytes = sum(dst[p] for p in mismatch)

          print()
          print("=== 文件级差异分析 ===")
          print(f"源端文件数: {len(src)}  ({human(sum(src.values()))})")
          print(f"目标文件数: {len(dst)}  ({human(sum(dst.values()))})")
          print(f"共同文件数: {len(common)}")
          print()
          print(f"📊 缺失（仅在源端）: {len(only_src)} 个文件, 共 {human(only_src_bytes)}")
          print(f"📊 残留（仅在目标端）: {len(only_dst)} 个文件, 共 {human(only_dst_bytes)}")
          print(f"📊 大小不一致（两端都有）: {len(mismatch)} 个文件  源端共 {human(mismatch_src_bytes)}  目标共 {human(mismatch_dst_bytes)}")

          # 缺失文件明细（按大小降序，前 30 条）
          if only_src:
              print()
              print(f"--- 缺失文件 (Top 30 by size) ---")
              for p in sorted(only_src, key=lambda x: src[x], reverse=True)[:30]:
                  print(f"  [{human(src[p])}]  {p}")
              if len(only_src) > 30:
                  print(f"  ... 还有 {len(only_src) - 30} 个缺失文件未列出")

          # 残留文件明细（前 20 条）
          if only_dst:
              print()
              print(f"--- 残留文件 (Top 20 by size) ---")
              for p in sorted(only_dst, key=lambda x: dst[x], reverse=True)[:20]:
                  print(f"  [{human(dst[p])}]  {p}")
              if len(only_dst) > 20:
                  print(f"  ... 还有 {len(only_dst) - 20} 个残留文件未列出")

          # 不一致明细（前 30 条，显示差值）
          if mismatch:
              print()
              print(f"--- 大小不一致 (Top 30 by |diff|) ---")
              for p in sorted(mismatch, key=lambda x: abs(src[x] - dst[x]), reverse=True)[:30]:
                  d = src[p] - dst[p]
                  sign = '+' if d > 0 else ''
                  print(f"  [src={human(src[p])} dst={human(dst[p])} diff={sign}{human(d)}]  {p}")
              if len(mismatch) > 30:
                  print(f"  ... 还有 {len(mismatch) - 30} 个不一致文件未列出")

          # 写汇总
          with open('/tmp/_diff_summary.txt', 'a') as f:
              f.write(f"{src_remote} -> {dst_remote}\n")
              f.write(f"  src={len(src)} files / {human(sum(src.values()))}\n")
              f.write(f"  dst={len(dst)} files / {human(sum(dst.values()))}\n")
              f.write(f"  missing={len(only_src)} files / {human(only_src_bytes)}\n")
              f.write(f"  orphan ={len(only_dst)} files / {human(only_dst_bytes)}\n")
              f.write(f"  mismatch={len(mismatch)} files\n")

          # 把缺失文件按大小降序写入磁盘（path<tab>size_bytes），供后续同步测试使用
          pair_token = (src_remote.replace(":", "_").replace("/", "_") + "__" +
                        dst_remote.replace(":", "_").replace("/", "_").replace("*", "_"))
          missing_path = f"/tmp/_missing_{pair_token}.txt"
          with open(missing_path, "w") as mf:
              for p in sorted(only_src, key=lambda x: src[x], reverse=True):
                  mf.write(f"{p}\t{src[p]}\n")
          # 写入 pair 元数据（shell 侧要用 src_remote/dst_remote）
          meta_path = f"/tmp/_missing_{pair_token}_meta.txt"
          with open(meta_path, "w") as m:
              m.write(f"{src_remote}\n{dst_remote}\n{missing_path}\n")
          print(f"[debug] 缺失列表写入: {missing_path} ({len(only_src)} 条)")
          PYEOF

            # 对当前 pair 立刻执行差异文件同步测试（样本取自 just-written missing 文件）
            # 规则：
            #   - 样本：缺失列表按大小降序取前 6 个大文件 + 末尾 3 个小文件（共 9 个）
            #   - 每种同步方式成功后：保留上传文件（不删除），记录到成功列表，跳到下一样本
            #   - 全部样本跑完：再做一次 lsf 差异，打印"同步测试后还缺失 XX 文件"
            pair_token="${src_remote//[:\/]/_}__${dst_remote//[:\/\*]/_}"
            meta_file="/tmp/_missing_${pair_token}_meta.txt"
            if [ -f "$meta_file" ]; then
              pair_src=$(sed -n '1p' "$meta_file")
              pair_dst=$(sed -n '2p' "$meta_file")
              missing_file=$(sed -n '3p' "$meta_file")
              total_missing=$(wc -l < "$missing_file" 2>/dev/null | tr -d ' ' || echo 0)
              if [ "$total_missing" -gt 0 ]; then

                echo ""
                echo "=========================================="
                echo "  差异文件同步测试 ($pair_src -> $pair_dst)"
                echo "=========================================="

                # 样本选取（前 3 大 + 2 小，共 5 个）
                SAMPLE_FILE="/tmp/_samples_${pair_token}.txt"
                { head -n 3 "$missing_file"; tail -n 2 "$missing_file"; } | awk '!seen[$0]++' > "$SAMPLE_FILE"
                SAMPLE_COUNT=$(wc -l < "$SAMPLE_FILE" | tr -d ' ')
                echo "样本数: $SAMPLE_COUNT / $total_missing"

                RCLONE_TEST_FLAGS=(--retries 1 --low-level-retries 3 --timeout 5m --contimeout 30s --size-only)

                b64url_encode() {
                  printf '%s' "$1" | base64 | tr -d '=' | tr '+/' '-_'
                }

                # 成功清单（样本路径<TAB>方式名<TAB>目标路径<TAB>字节数）
                SYNC_TEST_OK="/tmp/_sync_test_ok_$$.txt"
                : > "$SYNC_TEST_OK"
                SYNC_TEST_FAILED="/tmp/_sync_test_fail_$$.txt"
                : > "$SYNC_TEST_FAILED"

                while IFS=$'\t' read -r sample_rel src_size; do
                  [ -z "$sample_rel" ] && continue

                  echo ""
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  echo "样本: $sample_rel"
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  echo "源文件大小: $src_size bytes"

                  local_src="${pair_src}/${sample_rel}"
                  local_dst="${pair_dst}/${sample_rel}"
                  sample_dir=$(dirname "$sample_rel")
                  sample_fname=$(basename "$sample_rel")
                  OK_WAY=""
                  OK_DST=""

                  # ===== 方式 A: 直接 rclone copyto =====
                  echo "--- 方式 A: rclone copyto（原路径+原名）---"
                  rclone deletefile "$local_dst" 2>/dev/null || true
                  sleep 0.5
                  rclone copyto "$local_src" "$local_dst" "${RCLONE_TEST_FLAGS[@]}" 2>&1 | head -15
                  rc_a=$?
                  dst_size_a=$(rclone size --json "$local_dst" 2>/dev/null | jq -r '.bytes // 0' 2>/dev/null || echo 0)
                  if [ "$dst_size_a" = "$src_size" ] && [ "$dst_size_a" -gt 0 ]; then
                    echo ">>> 方式 A: ✅ 成功 (dst_size=$dst_size_a / rc=$rc_a)，保留文件，继续下一样本"
                    OK_WAY="A"; OK_DST="$local_dst"
                  else
                    echo ">>> 方式 A: ❌ 失败 (rc=$rc_a, dst_size=$dst_size_a, expected=$src_size)"
                    rclone deletefile "$local_dst" 2>/dev/null || true
                    sleep 0.5
                  fi

                  if [ -z "$OK_WAY" ]; then
                    # ===== 方式 B: 刷新缓存后 copyto =====
                    echo "--- 方式 B: 刷新缓存 + rclone copyto ---"
                    if [ -n "$OL_TOKEN" ] && [[ "$pair_dst" == openlist:* ]]; then
                      rel_ol_path="${pair_dst#openlist:}"
                      ol_path="/${rel_ol_path%/}/${sample_dir}"
                      curl -s -X POST "http://127.0.0.1:5244/api/fs/refresh" \
                        -H "Authorization: $OL_TOKEN" \
                        -H "Content-Type: application/json" \
                        -d "$(jq -n --arg p "$ol_path" '{path:$p, recursive:false}')" >/dev/null 2>&1 || true
                      sleep 3
                    fi
                    rclone copyto "$local_src" "$local_dst" "${RCLONE_TEST_FLAGS[@]}" 2>&1 | head -15
                    rc_b=$?
                    dst_size_b=$(rclone size --json "$local_dst" 2>/dev/null | jq -r '.bytes // 0' 2>/dev/null || echo 0)
                    if [ "$dst_size_b" = "$src_size" ] && [ "$dst_size_b" -gt 0 ]; then
                      echo ">>> 方式 B: ✅ 成功 (dst_size=$dst_size_b / rc=$rc_b)"
                      OK_WAY="B"; OK_DST="$local_dst"
                    else
                      echo ">>> 方式 B: ❌ 失败 (rc=$rc_b, dst_size=$dst_size_b)"
                      rclone deletefile "$local_dst" 2>/dev/null || true
                      sleep 0.5
                    fi
                  fi

                  if [ -z "$OK_WAY" ]; then
                    # ===== 方式 C: base64URL 编码目录名 + copyto =====
                    echo "--- 方式 C: base64URL 编码目录名 ---"
                    b64_dir=$(b64url_encode "$sample_dir")
                    alt_c="${pair_dst}/${b64_dir}/${sample_fname}"
                    echo "  编码目录: $sample_dir → $b64_dir"
                    rclone copyto "$local_src" "$alt_c" "${RCLONE_TEST_FLAGS[@]}" 2>&1 | head -15
                    rc_c=$?
                    dst_size_c=$(rclone size --json "$alt_c" 2>/dev/null | jq -r '.bytes // 0' 2>/dev/null || echo 0)
                    if [ "$dst_size_c" = "$src_size" ] && [ "$dst_size_c" -gt 0 ]; then
                      echo ">>> 方式 C: ✅ 成功 (dst_size=$dst_size_c / rc=$rc_c)"
                      OK_WAY="C"; OK_DST="$alt_c"
                    else
                      echo ">>> 方式 C: ❌ 失败 (rc=$rc_c, dst_size=$dst_size_c)"
                      rclone deletefile "$alt_c" 2>/dev/null || true
                      sleep 0.5
                    fi
                  fi

                  if [ -z "$OK_WAY" ]; then
                    # ===== 方式 D: base64URL 编码文件名 + copyto =====
                    echo "--- 方式 D: base64URL 编码文件名 ---"
                    fname_noext="${sample_fname%.*}"
                    fext="${sample_fname##*.}"
                    [ "$fname_noext" = "$sample_fname" ] && fext=""
                    b64_fn=$(b64url_encode "$fname_noext")
                    alt_fname="$b64_fn"
                    [ -n "$fext" ] && alt_fname="$alt_fname.$fext"
                    alt_d="${pair_dst}/${sample_dir}/${alt_fname}"
                    echo "  编码文件名: $sample_fname → $alt_fname"
                    rclone copyto "$local_src" "$alt_d" "${RCLONE_TEST_FLAGS[@]}" 2>&1 | head -15
                    rc_d=$?
                    dst_size_d=$(rclone size --json "$alt_d" 2>/dev/null | jq -r '.bytes // 0' 2>/dev/null || echo 0)
                    if [ "$dst_size_d" = "$src_size" ] && [ "$dst_size_d" -gt 0 ]; then
                      echo ">>> 方式 D: ✅ 成功 (dst_size=$dst_size_d / rc=$rc_d)"
                      OK_WAY="D"; OK_DST="$alt_d"
                    else
                      echo ">>> 方式 D: ❌ 失败 (rc=$rc_d, dst_size=$dst_size_d)"
                      rclone deletefile "$alt_d" 2>/dev/null || true
                      sleep 0.5
                    fi
                  fi

                  if [ -z "$OK_WAY" ]; then
                    # ===== 方式 E: 下载到本地再上传（大文件跳过，太慢）=====
                    if [ "$src_size" -gt 209715200 ]; then
                      echo "--- 方式 E: 跳过（文件 >200MB，下载+上传太慢）---"
                    else
                      echo "--- 方式 E: 下载到本地再上传 ---"
                    tmp_dir="/tmp/_sync_test_$(date +%s)_$$"
                    mkdir -p "$tmp_dir"
                    dl_ok=0
                    rclone copyto "$local_src" "$tmp_dir/$sample_fname" --retries 1 --timeout 5m 2>&1 | tail -5
                    if [ -f "$tmp_dir/$sample_fname" ]; then
                      local_sz=$(wc -c < "$tmp_dir/$sample_fname" | tr -d ' ')
                      echo "  下载成功: $local_sz bytes (期望 $src_size)"
                      if [ "$local_sz" = "$src_size" ] || [ "$local_sz" -gt 0 ]; then
                        dl_ok=1
                        rclone copyto "$tmp_dir/$sample_fname" "$local_dst" "${RCLONE_TEST_FLAGS[@]}" 2>&1 | head -15
                        rc_e2=$?
                        dst_size_e=$(rclone size --json "$local_dst" 2>/dev/null | jq -r '.bytes // 0' 2>/dev/null || echo 0)
                        if [ "$dst_size_e" = "$src_size" ] && [ "$dst_size_e" -gt 0 ]; then
                          echo ">>> 方式 E: ✅ 上传成功 (dst_size=$dst_size_e / rc=$rc_e2)"
                          OK_WAY="E"; OK_DST="$local_dst"
                        else
                          echo ">>> 方式 E: ❌ 上传失败 (rc=$rc_e2, dst_size=$dst_size_e)"
                          rclone deletefile "$local_dst" 2>/dev/null || true
                        fi
                      else
                        echo ">>> 方式 E: ❌ 下载大小不符 ($local_sz != $src_size)"
                      fi
                    else
                      echo ">>> 方式 E: ❌ 下载失败（文件不存在于本地临时目录）"
                    fi
                    rm -rf "$tmp_dir"
                    fi
                  fi

                  # ===== 写结果 =====
                  if [ -n "$OK_WAY" ]; then
                    printf '%s\t%s\t%s\t%s\n' "$sample_rel" "$OK_WAY" "$OK_DST" "$src_size" >> "$SYNC_TEST_OK"
                  else
                    printf '%s\t0\t\t%s\n' "$sample_rel" "$src_size" >> "$SYNC_TEST_FAILED"
                  fi

                done < "$SAMPLE_FILE"

                # ===== 二次校验：刷新 OpenList 缓存 + 抽样复验 =====
                echo ""
                echo "=== 同步测试后二次校验 ($pair_dst) ==="
                # 缓存刷新（可选 — 没有 token 也要做复验）
                if [[ "$pair_dst" == openlist:* ]] && [ -n "$OL_TOKEN" ]; then
                  rel_ol_root="${pair_dst#openlist:}"
                  ol_root_path="/${rel_ol_root%/}"
                  echo "刷新目标端缓存 $ol_root_path (recursive=true)..."
                  curl -s -X POST "http://127.0.0.1:5244/api/fs/refresh" \
                    -H "Authorization: $OL_TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "$(jq -n --arg p "$ol_root_path" '{path:$p, recursive:true}')" >/dev/null 2>&1 || true
                  echo "等待缓存刷新 (15s) ..."
                  sleep 15
                else
                  echo "⚠️ 跳过缓存刷新 (OL_TOKEN 为空或非 openlist 目标)，仍执行复验"
                fi

                # 抽样复验（只验前 3 个成功样本，而非全部）
                ok_recheck=0
                fail_recheck=0
                recheck_count=0
                while IFS=$'\t' read -r srel sway sdst sbytes; do
                  [ -z "$srel" ] && continue
                  recheck_count=$((recheck_count + 1))
                  [ "$recheck_count" -gt 3 ] && break
                  recheck_size=$(rclone size --json "$sdst" 2>/dev/null | jq -r '.bytes // 0' 2>/dev/null || echo 0)
                  listed=$(rclone lsf "$(dirname "$sdst")" --files-only --format "ps" --separator ";" 2>/dev/null | awk -v FS=';' -v bn="$(basename "$sdst")" '$1==bn{print $2; exit}')
                  if [ "$recheck_size" = "$sbytes" ] && [ "$listed" = "$sbytes" ]; then
                    echo "  ✅ 持久化校验通过: $srel (方式$sway, $sbytes bytes)"
                    ok_recheck=$((ok_recheck + 1))
                  else
                    echo "  ❌ 持久化校验失败: $srel (预期=$sbytes, recheck=$recheck_size, lsf_size=$listed)"
                    fail_recheck=$((fail_recheck + 1))
                  fi
                done < "$SYNC_TEST_OK"
                echo "  复验汇总: 抽样 $recheck_count / 通过 $ok_recheck / 失败 $fail_recheck"

                # ===== 延迟复验：等 3 分钟让 wopan176 后端缓存过期后再查 =====
                # 目的：区分"上传未持久化"vs"缓存刷新导致列表丢失"
                # 只对第一个有成功样本的 pair 执行一次，避免每对都等 3 分钟
                if [ -z "$DELAY_RECHECK_DONE" ] && [ "$ok_recheck" -gt 0 ]; then
                  DELAY_RECHECK_DONE=1
                  echo ""
                  echo "=== 延迟复验（等 180s 让后端缓存过期后重新检查）==="
                  echo "  等待 180s ..."
                  sleep 180
                  # 再次刷新缓存
                  if [[ "$pair_dst" == openlist:* ]] && [ -n "$OL_TOKEN" ]; then
                    rel_ol_root="${pair_dst#openlist:}"
                    ol_root_path="/${rel_ol_root%/}"
                    echo "  刷新缓存 $ol_root_path ..."
                    curl -s -X POST "http://127.0.0.1:5244/api/fs/refresh" \
                      -H "Authorization: $OL_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "$(jq -n --arg p "$ol_root_path" '{path:$p, recursive:true}')" >/dev/null 2>&1 || true
                    sleep 15
                  fi
                  # 对即时复验通过的样本再次检查
                  delay_ok=0
                  delay_fail=0
                  delay_count=0
                  while IFS=$'\t' read -r srel sway sdst sbytes; do
                    [ -z "$srel" ] && continue
                    delay_count=$((delay_count + 1))
                    [ "$delay_count" -gt 3 ] && break
                    delay_size=$(rclone size --json "$sdst" 2>/dev/null | jq -r '.bytes // 0' 2>/dev/null || echo 0)
                    delay_listed=$(rclone lsf "$(dirname "$sdst")" --files-only --format "ps" --separator ";" 2>/dev/null | awk -v FS=';' -v bn="$(basename "$sdst")" '$1==bn{print $2; exit}')
                    if [ "$delay_size" = "$sbytes" ] && [ "$delay_listed" = "$sbytes" ]; then
                      echo "  ✅ 延迟复验通过: $srel (方式$sway, $sbytes bytes)"
                      delay_ok=$((delay_ok + 1))
                    else
                      echo "  ❌ 延迟复验失败: $srel (预期=$sbytes, size=$delay_size, lsf=$delay_listed)"
                      echo "     → 文件可能未被后端持久化（列表缓存未更新或上传丢失）"
                      delay_fail=$((delay_fail + 1))
                    fi
                  done < "$SYNC_TEST_OK"
                  echo "  延迟复验汇总: 抽样 $delay_count / 通过 $delay_ok / 失败 $delay_fail"
                  if [ "$delay_fail" -gt 0 ] && [ "$delay_ok" -eq 0 ]; then
                    echo "  ⚠️ 所有延迟复验均失败 → 后端列表缓存未更新，上传的文件在缓存刷新后不可见"
                    echo "     这解释了为什么'永远同步不完'：上传成功但缓存刷新后文件从列表中消失"
                  elif [ "$delay_fail" -gt 0 ]; then
                    echo "  ⚠️ 部分延迟复验失败 → 某些文件可能未被后端持久化"
                  fi
                fi

                # ===== 抓取 OpenList 容器日志（在重启之前，日志含上传记录）=====
                if [ -z "$RESTART_RECHECK_DONE" ] && [ "${delay_ok:-0}" -gt 0 ]; then
                  echo ""
                  echo "=== OpenList 容器日志（上传相关）==="

                  # 1. docker stdout 日志
                  echo "--- docker logs (stdout, 最近 500 行, 过滤关键字) ---"
                  sudo docker logs openlist --tail 500 2>&1 | \
                    grep -iE 'error|fail|warn|put|upload|405|409|429|500|502|503|exception|panic|wopan|crypt' || \
                    echo "  （stdout 无匹配）"

                  # 2. OpenList 日志文件（AList/OpenList 默认写到 data/log/ 目录）
                  echo "--- OpenList 日志文件 ---"
                  for logdir in \
                    "/dropbox/self-hosted/openlist/data/log" \
                    "/dropbox/self-hosted/openlist/data/logs" \
                    "/opt/openlist/data/log"; do
                    if [ -d "$logdir" ]; then
                      echo "  日志目录: $logdir"
                      ls -lt "$logdir" | head -10
                      # 取最新的日志文件，过滤上传/错误关键字
                      latest_log=$(ls -t "$logdir"/*.log 2>/dev/null | head -1)
                      if [ -n "$latest_log" ]; then
                        echo "  最新日志文件: $latest_log"
                        echo "  --- 过滤上传/错误关键字 (最近 200 行) ---"
                        tail -200 "$latest_log" | \
                          grep -iE 'error|fail|warn|put|upload|405|409|429|500|502|503|exception|panic|wopan|crypt' || \
                          echo "  （日志文件无匹配，显示最近 30 行）"
                        echo "  --- 最近 30 行原始日志 ---"
                        tail -30 "$latest_log"
                      fi
                      break
                    fi
                  done

                  # 3. OpenList 存储配置（查看 wopan176 驱动配置）
                  echo "--- OpenList 存储配置 (wopan176 相关) ---"
                  for cfg in \
                    "/dropbox/self-hosted/openlist/data/config.json" \
                    "/dropbox/self-hosted/openlist/data/conf/config.json"; do
                    if [ -f "$cfg" ]; then
                      echo "  配置文件: $cfg"
                      # 提取存储列表中 wopan176 相关的配置（完整字段）
                      wopan_cfg=$(jq -r '.storage // [] | .[] | select(.mount_path | test("wopan|176"; "i"))' "$cfg" 2>/dev/null)
                      if [ -n "$wopan_cfg" ] && [ "$wopan_cfg" != "null" ]; then
                        echo "$wopan_cfg" | jq .
                        # 重点检查：上传模式、API 地址、配额等
                        echo "$wopan_cfg" | jq -r '{mount_path, driver, addition: (.addition | fromjson? // .)}' 2>/dev/null || \
                          echo "$wopan_cfg" | jq .
                        # 检查 addition 字段中的上传/API 配置
                        addition=$(echo "$wopan_cfg" | jq -r '.addition // ""' 2>/dev/null)
                        if [ -n "$addition" ] && [ "$addition" != "null" ]; then
                          echo "  --- addition 字段解析 ---"
                          echo "$addition" | jq -r '
                            to_entries
                            | map(select(.key | test("pass|key|secret|token|auth"; "i")) | not)
                            | from_entries
                            | to_entries[]
                            | "    \(.key): \(.value)"
                          ' 2>/dev/null || echo "    (无法解析为 JSON)"
                        fi
                      else
                        echo "  （未找到 wopan176 存储配置）"
                      fi
                      break
                    fi
                  done

                  # 4. 日志中搜索 wopan176 相关的错误/警告（更全面）
                  echo "--- 搜索日志中 wopan176 相关错误 ---"
                  for logdir in \
                    "/dropbox/self-hosted/openlist/data/log" \
                    "/dropbox/self-hosted/openlist/data/logs"; do
                    if [ -d "$logdir" ]; then
                      latest_log=$(ls -t "$logdir"/*.log 2>/dev/null | head -1)
                      if [ -n "$latest_log" ]; then
                        echo "  日志文件: $latest_log"
                        echo "  --- 全量搜索 wopan176 / crypt 驱动错误 ---"
                        grep -iE 'wopan|crypt\.|failed to get|failed to put|object not found|storage.*full|quota|429|rate.limit|PUT.*(400|401|403|404|405|409|413|429|500|502|503|504)|timeout|context deadline' "$latest_log" 2>/dev/null | tail -80 || \
                          echo "  （无 wopan176 / crypt 相关错误）"

                        echo "  --- Crypt.Get / failed to get obj 上下文 (前后 5 行) ---"
                        grep -n -B 3 -A 5 'failed to get obj\|object not found\|drivers/crypt' "$latest_log" 2>/dev/null | tail -120 || \
                          echo "  （无 Crypt.Get 失败记录）"

                        echo "  --- 统计 HTTP 状态码分布 (最近 2000 行) ---"
                        tail -2000 "$latest_log" 2>/dev/null | awk '
                          match($0, /\| ([0-9]{3}) \|/, m) { codes[m[1]]++ }
                          END { for (c in codes) printf("    HTTP %s: %d\n", c, codes[c]) }
                        ' | sort -k2 -rn | head -20

                        echo "  --- PUT 请求耗时分布 (识别慢/失败上传) ---"
                        grep -E '\| [0-9]+ \.[0-9]+ms .*PUT' "$latest_log" 2>/dev/null | \
                          awk -F'|' '{
                            gsub(/^ +/, "", $2)
                            gsub(/ms.*/, "", $2)
                            split($2, t, "."); ms=t[1]+0
                            code=$3; gsub(/^ +/, "", code)
                            if (ms >= 500) slow[code]++
                            total[code]++
                          }
                          END {
                            for (c in total) printf("    PUT %s: total=%d, slow(>=500ms)=%d\n", c, total[c], slow[c]+0)
                          }' | sort

                        echo "  --- PROPFIND 404 比例 (判断后端列表缓存健康度) ---"
                        total_pf=$(grep -c 'PROPFIND' "$latest_log" 2>/dev/null || echo 0)
                        pf_404=$(grep -c 'PROPFIND.*404' "$latest_log" 2>/dev/null || echo 0)
                        pf_207=$(grep -c 'PROPFIND.*207' "$latest_log" 2>/dev/null || echo 0)
                        echo "    PROPFIND 总数: $total_pf"
                        echo "    PROPFIND 404:  $pf_404"
                        echo "    PROPFIND 207:  $pf_207"
                        if [ "$total_pf" -gt 0 ] && [ "$pf_404" -gt 0 ]; then
                          echo "    404 比例: $(awk -v a=$pf_404 -v b=$total_pf 'BEGIN{printf("%.1f%%", a/b*100)}')"
                        fi

                        echo "  --- 容器级诊断 (OpenList) ---"
                        sudo docker inspect openlist --format '状态: {{.State.Status}} | 启动: {{.State.StartedAt}} | 重启次数: {{.RestartCount}} | OOMKilled: {{.State.OOMKilled}}' 2>/dev/null || true
                        sudo docker stats openlist --no-stream --format 'CPU={{.CPUPerc}} MEM={{.MemUsage}} NET={{.NetIO}} BLOCK={{.BlockIO}}' 2>/dev/null || true
                        echo "  --- OpenList 最近 10s 内存/CPU 峰值 ---"
                        sudo docker exec openlist sh -c 'uptime; free -m 2>/dev/null || echo "(no free)"; df -h / 2>/dev/null || echo "(no df)"' 2>/dev/null || true
                      fi
                      break
                    fi
                  done

                  # ===== 上传完整日志到 OneDrive（避免 GitHub Actions 输出截断） =====
                  echo ""
                  echo "=== 上传完整日志到 OneDrive ==="
                  OL_LOG_REMOTE_DIR="onedrive:/logs/openlist"
                  OL_LOG_TS=$(date -u +%Y%m%d_%H%M%S)
                  OL_LOG_BASE="openlist_${OL_LOG_TS}"

                  # 1. OpenList 完整日志文件（原始，不截断）
                  for logdir in \
                    "/dropbox/self-hosted/openlist/data/log" \
                    "/dropbox/self-hosted/openlist/data/logs" \
                    "/opt/openlist/data/log"; do
                    if [ -d "$logdir" ]; then
                      latest_log=$(ls -t "$logdir"/*.log 2>/dev/null | head -1)
                      if [ -n "$latest_log" ]; then
                        log_size=$(stat -c %s "$latest_log" 2>/dev/null || stat -f %z "$latest_log" 2>/dev/null || echo 0)
                        echo "  上传日志文件: $latest_log ($((log_size / 1024)) KB)"
                        rclone mkdir "$OL_LOG_REMOTE_DIR" >/dev/null 2>&1 || true
                        rclone copyto "$latest_log" "${OL_LOG_REMOTE_DIR}/${OL_LOG_BASE}.log" 2>&1 | tail -3 || true
                        echo "  → 已保存: ${OL_LOG_REMOTE_DIR}/${OL_LOG_BASE}.log"
                      fi
                      break
                    fi
                  done

                  # 2. docker stdout 日志（完整，不截断）
                  STDOUT_FILE="/tmp/openlist_stdout_${OL_LOG_TS}.log"
                  sudo docker logs openlist > "$STDOUT_FILE" 2>&1 || true
                  stdout_size=$(stat -c %s "$STDOUT_FILE" 2>/dev/null || stat -f %z "$STDOUT_FILE" 2>/dev/null || echo 0)
                  echo "  上传 docker stdout: $((stdout_size / 1024)) KB"
                  rclone copyto "$STDOUT_FILE" "${OL_LOG_REMOTE_DIR}/${OL_LOG_BASE}_stdout.log" 2>&1 | tail -3 || true
                  rm -f "$STDOUT_FILE"
                  echo "  → 已保存: ${OL_LOG_REMOTE_DIR}/${OL_LOG_BASE}_stdout.log"

                  # 3. wopan176 驱动配置（脱敏后）
                  for cfg in \
                    "/dropbox/self-hosted/openlist/data/config.json" \
                    "/dropbox/self-hosted/openlist/data/conf/config.json"; do
                    if [ -f "$cfg" ]; then
                      CFG_SAFE_FILE="/tmp/openlist_cfg_${OL_LOG_TS}.json"
                      # 提取 wopan/crypt 相关 storage 条目，再 sed 脱敏敏感字段
                      jq '.storage // [] | map(select(.mount_path | test("wopan|176|crypt"; "i")))' \
                        "$cfg" > "$CFG_SAFE_FILE" 2>/dev/null || cp "$cfg" "$CFG_SAFE_FILE"
                      sed -i.bak \
                        -e 's/"access_token"[[:space:]]*:[[:space:]]*"[^"]*"/"access_token":"<redacted>"/g' \
                        -e 's/"refresh_token"[[:space:]]*:[[:space:]]*"[^"]*"/"refresh_token":"<redacted>"/g' \
                        -e 's/"password"[[:space:]]*:[[:space:]]*"[^"]*"/"password":"<redacted>"/g' \
                        -e 's/"client_secret"[[:space:]]*:[[:space:]]*"[^"]*"/"client_secret":"<redacted>"/g' \
                        -e 's/"token"[[:space:]]*:[[:space:]]*"[^"]*"/"token":"<redacted>"/g' \
                        "$CFG_SAFE_FILE" 2>/dev/null || true
                      rm -f "${CFG_SAFE_FILE}.bak"
                      rclone copyto "$CFG_SAFE_FILE" "${OL_LOG_REMOTE_DIR}/${OL_LOG_BASE}_wopan_cfg.json" 2>&1 | tail -3 || true
                      rm -f "$CFG_SAFE_FILE"
                      echo "  → 已保存: ${OL_LOG_REMOTE_DIR}/${OL_LOG_BASE}_wopan_cfg.json"
                      break
                    fi
                  done

                  # 4. 同步测试结果 + 复验记录（如有）
                  if [ -f "$SYNC_TEST_OK" ]; then
                    rclone copyto "$SYNC_TEST_OK" "${OL_LOG_REMOTE_DIR}/${OL_LOG_BASE}_synctest.tsv" 2>&1 | tail -3 || true
                    echo "  → 已保存: ${OL_LOG_REMOTE_DIR}/${OL_LOG_BASE}_synctest.tsv"
                  fi

                  # 5. 清理 30 天前的旧日志
                  echo "  清理 30 天前的旧日志..."
                  rclone delete "$OL_LOG_REMOTE_DIR" --min-age 30d 2>/dev/null || true

                  echo "=== 日志上传完毕 ==="
                  echo "  完整日志目录: $OL_LOG_REMOTE_DIR"
                  echo "  本次时间戳: $OL_LOG_TS"
                fi

                # ===== 容器重启复验：重启 OpenList 容器后检查文件是否真的被后端持久化 =====
                # 这是确定性验证：如果重启后文件消失，说明 OpenList PUT 返回成功但后端未持久化
                # 只在延迟复验有通过的情况下执行一次
                if [ -z "$RESTART_RECHECK_DONE" ] && [ "${delay_ok:-0}" -gt 0 ]; then
                  RESTART_RECHECK_DONE=1
                  RECHECK_LIST="/tmp/_restart_recheck_${pair_token}.txt"
                  cp "$SYNC_TEST_OK" "$RECHECK_LIST"

                  echo ""
                  echo "=== 容器重启复验（重启 OpenList 后重新检查）==="
                  echo "  目的：验证文件是否被 wopan176 后端真正持久化"
                  echo "  重启 OpenList 容器..."
                  sudo docker restart openlist 2>&1 | head -3

                  # 等待 HTTP 就绪
                  echo "  等待 OpenList HTTP 就绪..."
                  http_ok=0
                  for i in $(seq 1 30); do
                    if curl -sf http://127.0.0.1:5244 >/dev/null 2>&1; then
                      http_ok=1
                      echo "  HTTP 就绪 (${i}次)"
                      break
                    fi
                    sleep 2
                  done

                  if [ "$http_ok" -eq 0 ]; then
                    echo "  ❌ OpenList HTTP 60s 内未就绪，跳过容器重启复验"
                  else
                    # 重新获取 token（容器重启后可能变化）
                    OL_TOKEN=""
                    for c in \
                      "/dropbox/self-hosted/openlist/data/config.json" \
                      "/dropbox/self-hosted/openlist/data/conf/config.json" \
                      "/data/openlist/data/config.json"; do
                      [ -f "$c" ] || continue
                      t=$(jq -r '.token // .jwt_secret // empty' "$c" 2>/dev/null || echo "")
                      if [ -n "$t" ] && [ "$t" != "null" ]; then
                        OL_TOKEN="$t"
                        echo "  token: OK (来自 $c)"
                        break
                      fi
                    done

                    # 等待驱动初始化
                    echo "  等待驱动初始化 (45s) ..."
                    sleep 45

                    # 刷新缓存
                    if [[ "$pair_dst" == openlist:* ]] && [ -n "$OL_TOKEN" ]; then
                      rel_ol_root="${pair_dst#openlist:}"
                      ol_root_path="/${rel_ol_root%/}"
                      echo "  刷新缓存 $ol_root_path ..."
                      curl -s -X POST "http://127.0.0.1:5244/api/fs/refresh" \
                        -H "Authorization: $OL_TOKEN" \
                        -H "Content-Type: application/json" \
                        -d "$(jq -n --arg p "$ol_root_path" '{path:$p, recursive:true}')" >/dev/null 2>&1 || true
                      sleep 15
                    fi

                    # 对延迟复验通过的样本再次检查
                    restart_ok=0
                    restart_fail=0
                    restart_count=0
                    while IFS=$'\t' read -r srel sway sdst sbytes; do
                      [ -z "$srel" ] && continue
                      restart_count=$((restart_count + 1))
                      [ "$restart_count" -gt 3 ] && break
                      restart_size=$(rclone size --json "$sdst" 2>/dev/null | jq -r '.bytes // 0' 2>/dev/null || echo 0)
                      restart_listed=$(rclone lsf "$(dirname "$sdst")" --files-only --format "ps" --separator ";" 2>/dev/null | awk -v FS=';' -v bn="$(basename "$sdst")" '$1==bn{print $2; exit}')
                      if [ "$restart_size" = "$sbytes" ] && [ "$restart_listed" = "$sbytes" ]; then
                        echo "  ✅ 重启复验通过: $srel (方式$sway, $sbytes bytes)"
                        restart_ok=$((restart_ok + 1))
                      else
                        echo "  ❌ 重启复验失败: $srel (预期=$sbytes, size=$restart_size, lsf=$restart_listed)"
                        echo "     → 文件未被后端持久化：PUT 返回成功但文件不在 wopan176 后端"
                        restart_fail=$((restart_fail + 1))
                      fi
                    done < "$RECHECK_LIST"
                    echo "  重启复验汇总: 抽样 $restart_count / 通过 $restart_ok / 失败 $restart_fail"

                    echo ""
                    echo "  ===== 最终诊断结论 ====="
                    if [ "$restart_fail" -gt 0 ] && [ "$restart_ok" -eq 0 ]; then
                      echo "  🔴 即时复验 ✅ → 延迟复验 ✅ → 重启复验 ❌（全部失败）"
                      echo "     根因：OpenList PUT 返回成功，但文件未被 wopan176 后端持久化"
                      echo "     OpenList 的 /api/fs/refresh 在同一容器生命周期内不会真正从后端重新拉列表"
                      echo "     只有容器重启后才暴露真实状态：文件从未写入后端"
                      echo "     这就是'永远同步不完'的根本原因"
                    elif [ "$restart_fail" -gt 0 ]; then
                      echo "  🟡 即时复验 ✅ → 延迟复验 ✅ → 重启复验 部分失败"
                      echo "     部分文件未被后端持久化"
                    else
                      echo "  🟢 即时复验 ✅ → 延迟复验 ✅ → 重启复验 ✅（全部通过）"
                      echo "     文件已被后端持久化，'永远同步不完'的原因在别处（可能是 rclone --size-only 缓存问题）"
                    fi
                  fi
                  rm -f "$RECHECK_LIST"
                fi

                if [ -s "$SYNC_TEST_FAILED" ]; then
                  echo ""
                  echo "  ⚠️ 下列样本所有方式均失败："
                  cat "$SYNC_TEST_FAILED" | while IFS=$'\t' read -r srel _x _y sbytes; do
                    [ -z "$srel" ] && continue
                    echo "    - $srel ($sbytes bytes)"
                  done
                fi

                ok_count=$(wc -l < "$SYNC_TEST_OK" | tr -d ' ' || echo 0)
                fail_count=$(wc -l < "$SYNC_TEST_FAILED" | tr -d ' ' || echo 0)
                ok_bytes=$(awk -F '\t' '{s+=$4} END {print s+0}' "$SYNC_TEST_OK" 2>/dev/null || echo 0)
                echo ""
                echo "  同步测试汇总: OK=$ok_count  FAIL=$fail_count  OK_BYTES=$ok_bytes"

                rm -f "$SAMPLE_FILE" "$SYNC_TEST_OK" "$SYNC_TEST_FAILED"
              fi
              rm -f "$meta_file" "$missing_file"
            fi

            rm -f "$SRC_LIST" "$DST_LIST" /tmp/_diff_src_err.txt /tmp/_diff_dst_err.txt
          done

          # ===== 总结论 =====
          echo ""
          echo "======================================================"
          echo "  差异诊断总结"
          echo "======================================================"
          if [ -f /tmp/_diff_summary.txt ]; then
            cat /tmp/_diff_summary.txt
          else
            echo "(未收集到结果)"
          fi
          rm -f /tmp/_diff_summary.txt
          echo ""
          echo "=========================================="
          echo "  诊断完成"
          echo "=========================================="

      # ===== 加载函数库 =====
      # 所有同步相关函数已提取到 .github/scripts/openlist/ 目录下的脚本文件中。
      # 修改函数逻辑请编辑对应脚本文件；修改任务定义和 rclone 参数请编辑下方 "Preview and sync all tasks" step。
      - name: Load helper functions
        run: |
          echo "加载 OpenList 同步函数库..."
          source "$GITHUB_WORKSPACE/.github/scripts/openlist/load_all.sh"
          # 将函数库复制到 /tmp 以便后续 step 使用（每个 step 是独立 shell）
          cp "$GITHUB_WORKSPACE/.github/scripts/openlist/"*.sh /tmp/
          echo "函数库加载完成"

      - name: Initialize sync
        if: ${{ inputs.debug_crypt_size != true && inputs.debug_sync_diff != true }}
        run: |
          source /tmp/load_all.sh
          PROCESSED_FILES_LOG="processed_videos.log"
          SYNC_SKIP_QUIET=0
          SYNC_SKIPPED=0
          SYNC_FAILED=0
          SYNC_TRANSFERRED_BYTES=0
          AUTO_SPLIT_INFO=""
          SYNC_AUTO_SPLIT_DEPTH=0
          # 集中定义阈值，避免魔数散落各处
          LARGE_FILE_THRESHOLD_BYTES="${LARGE_FILE_THRESHOLD:-4000000000}"
          SYNC_SPLIT_THRESHOLD_BYTES="${SYNC_SPLIT_THRESHOLD:-50000000000}"
          # 同步任务在独立的 Actions step 中执行（每个 step 是独立 shell），
          # 必须写入 GITHUB_ENV 才能在后续 step 中保留；否则 threshold 为空，
          # 触发 `[: : integer expression expected` 错误。
          echo "PROCESSED_FILES_LOG=$PROCESSED_FILES_LOG" >> "$GITHUB_ENV"
          echo "LARGE_FILE_THRESHOLD_BYTES=$LARGE_FILE_THRESHOLD_BYTES" >> "$GITHUB_ENV"
          echo "SYNC_SPLIT_THRESHOLD_BYTES=$SYNC_SPLIT_THRESHOLD_BYTES" >> "$GITHUB_ENV"
          echo "=== 初始化已处理文件日志 ===" > "$PROCESSED_FILES_LOG"
          echo "开始时间: $(date)" >> "$PROCESSED_FILES_LOG"
          echo "==========================" >> "$PROCESSED_FILES_LOG"

          # 初始化全局进度通知（任务在预览阶段自动注册）
          progress_init

      # ===== 所有同步任务定义 + 预览 + 执行 =====
      # 增减任务只需编辑下方 run_all_tasks 函数体；rclone 参数编辑下方 RCLONE_*_FLAGS 数组。
      - name: Preview and sync all tasks
        if: ${{ inputs.debug_crypt_size != true && inputs.debug_sync_diff != true }}
        run: |
          source /tmp/load_all.sh

          # 等待 OpenList 就绪（容器刚启动时 401/429 会导致预览 0 B/0 文件、同步无谓重传）
          # 注意：不能用 rclone lsd 反复探测，会触发后端 429 Too Many Requests
          echo "等待 OpenList 就绪..."
          _wait_openlist_ready() {
            local i code c t
            # 阶段1: HTTP /ping 起来
            for i in $(seq 1 40); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5244/ping 2>/dev/null || echo "000")
              [ "$code" = "200" ] && break
              sleep 2
            done
            if [ "$code" != "200" ]; then
              echo "⚠️ OpenList HTTP 未就绪 (code=${code})"
              return 1
            fi
            echo "HTTP 就绪，尝试获取 token..."
            # 阶段2: 获取 token 用于 API 探测（多个候选路径）
            local OL_TOKEN=""
            for c in \
              "/dropbox/self-hosted/openlist/data/config.json" \
              "/dropbox/self-hosted/openlist/data/conf/config.json" \
              "/data/openlist/data/config.json"; do
              [ -f "$c" ] || continue
              t=$(jq -r '.token // .jwt_secret // empty' "$c" 2>/dev/null || echo "")
              if [ -n "$t" ] && [ "$t" != "null" ]; then
                OL_TOKEN="$t"
                echo "  token: OK (来自 ${c}, 长度 ${#OL_TOKEN})"
                break
              fi
            done
            # 阶段3: 等驱动初始化（长等待 120s，给 ali + crypt 拉元数据）
            echo "等待驱动初始化 (120s) ..."
            sleep 120
            # 阶段4: 单次 rclone 验证（最多 2 次，避免 429）
            if rclone lsd openlist: >/dev/null 2>&1; then
              echo "WebDAV(rclone) 验证通过"
              return 0
            fi
            echo "再等 90s ..."
            sleep 90
            if rclone lsd openlist: >/dev/null 2>&1; then
              echo "WebDAV(rclone) 验证通过（第二次）"
              return 0
            fi
            sleep 60
            rclone lsd openlist: >/dev/null 2>&1 \
              && { echo "WebDAV(rclone) 验证通过（第三次）"; return 0; } \
              || echo "⚠️ WebDAV 仍未就绪，继续执行"
            return 1
          }
          _wait_openlist_ready || true
          unset -f _wait_openlist_ready

          # ===== rclone 参数集中配置（修改参数只需编辑此处）=====
          # sync_task / copy_task 共用的默认 rclone 参数
          RCLONE_DEFAULT_FLAGS=(
            --progress
            --stats 15s
            --stats-one-line
            --ignore-errors
            --verbose
            --size-only
            --timeout 5m
            --contimeout 30s
            --retries 1
            --low-level-retries 3
          )

          # sync_task 特有参数（rclone sync 模式，删除目标端多余文件，自动追加）
          # --delete-excluded: 同时删除目标端匹配 --exclude 模式的历史文件
          #   （否则 sync 只会忽略 exclude 文件而不删除，导致目标端残留历史文件，
          #    预览文件数/大小永远对不上源端）
          RCLONE_SYNC_TASK_FLAGS=(
            --delete-before
            --delete-excluded
          )

          # copy_task 特有参数（rclone copy 模式，不删除，逐文件检查，自动追加）
          RCLONE_COPY_TASK_FLAGS=(
            --no-traverse
          )

          # ===== 所有同步任务定义（增减任务只需在此添加/删除一行）=====
          # sync_task  = rclone sync（删除目标端多余文件，--delete-before 等由 RCLONE_SYNC_TASK_FLAGS 自动追加）
          # copy_task  = rclone copy（不删除，--no-traverse 等由 RCLONE_COPY_TASK_FLAGS 自动追加）
          # gd_task    = Google Drive 专用同步（处理配额超限、API 限流等 GD 特有错误）
          # 可选参数: --auto-split  --1d-skip (或 --2d-skip / --3d-skip 自定义天数)
          # 其余 rclone 参数（如 --exclude）直接追加在后面
          # 共有/特有 rclone 参数请在上方 RCLONE_*_FLAGS 数组中集中修改
          run_all_tasks() {
            sync_task "onedrive:backup" "openlist:aliyundriveCrypt/backup" "backup" --auto-split --1d-skip --exclude "/notion/**" --exclude "notion/**" --exclude "/self-hosted_latest.tar.gz" --exclude "self-hosted_latest.tar.gz" --exclude "/github_repos_latest.tar.gz" --exclude "github_repos_latest.tar.gz"
            copy_task "onedrive:backup" "openlist:wopan176Crypt/backup" "backup" --auto-split --1d-skip
            # gd_task "onedrive:backup" "gd:backup" "backup" --1d-skip

            copy_task "onedrive:0" "openlist:wopan176Crypt/0" "task0" --auto-split --1d-skip
            sync_task "onedrive:0" "openlist:baidupanCrypt/0" "task0" --auto-split --1d-skip
            sync_task "onedrive:0/j-1024j-视频-pornhub-favorites" "openlist:wopan175/0/j-1024j-视频-pornhub-favorites" "task0" --auto-split --1d-skip
            # gd_task "onedrive:0" "gd:0" "task0" --1d-skip

            copy_task "onedrive:1" "openlist:wopan176Crypt/1" "task1" --auto-split --1d-skip
            sync_task "onedrive:1" "openlist:baidupanCrypt/1" "task1" --auto-split --1d-skip
            sync_task "onedrive:1" "openlist:wopan175/1" "task1" --auto-split --1d-skip
            # gd_task "onedrive:1" "gd:1" "task1" --1d-skip

            copy_task "onedrive:2" "openlist:wopan176Crypt/2" "task2" --auto-split --1d-skip
            sync_task "onedrive:2" "openlist:wopan175/2" "task2" --auto-split --1d-skip
            # gd_task "onedrive:2" "gd:2" "task2" --1d-skip

            copy_task "onedrive:3" "openlist:wopan176Crypt/3" "task3" --auto-split --1d-skip
            sync_task "onedrive:3" "openlist:wopan175/3" "task3" --auto-split --1d-skip
            # gd_task "onedrive:3" "gd:3" "task3" --1d-skip

            copy_task "onedrive:4" "openlist:wopan176Crypt/4" "task4" --auto-split --1d-skip
            sync_task "onedrive:4" "openlist:wopan175/4" "task4" --auto-split --1d-skip

            copy_task "onedrive:5" "openlist:wopan176Crypt/5" "task5" --auto-split --1d-skip
            sync_task "onedrive:5" "openlist:wopan175/5" "task5" --auto-split --1d-skip
          }

          echo "=== 发送任务预览通知 ==="
          TASK_PREVIEW_ONLY=1 run_all_tasks
          flush_task_preview
          echo "=== 所有任务预览通知已发送 ==="

          echo "=== 开始同步所有任务 ==="
          run_all_tasks
          echo "=== 所有任务同步完成 ==="

      - name: Finalize and cleanup
        if: ${{ inputs.debug_crypt_size != true && inputs.debug_sync_diff != true }}
        run: |
          source /tmp/load_all.sh
          actual_entries=0
          total_lines=0
          DELETE_COUNT=0

          # 标记全局进度通知为最终完成状态
          progress_finalize

          if [ -f "processed_videos.log" ]; then
            total_lines=$(wc -l < "processed_videos.log" 2>/dev/null || echo 0)
            actual_entries=$((total_lines - 3))
            echo "==========================" >> "processed_videos.log"
            echo "结束时间: $(date)" >> "processed_videos.log"
            echo "=== 所有同步任务完成 ===" >> "processed_videos.log"

            if [ "$actual_entries" -gt 0 ]; then
              REMOTE_PROC_LOG="onedrive:/logs/processed/processed_videos_$(date +%Y%m%d_%H%M%S).log"
              rclone copyto "processed_videos.log" "$REMOTE_PROC_LOG" || true
            fi

            rm -f "processed_videos.log" 2>/dev/null || true
          fi

          rm -f /tmp/*.sh 2>/dev/null || true
          echo "所有同步任务完成！"

      - name: sleep
        if: ${{ inputs.debug_crypt_size != true && inputs.debug_sync_diff != true }}
        run: |
          sleep 300m
          sudo docker stop openlist
