# 备份文件到openlist中的网盘
name: openlist

on:
  workflow_dispatch:
    inputs:
      split_on_sync_failure:
        description: "Sync task 失败后，对该 task 源目录中的超阈值大文件执行切割"
        required: false
        type: boolean
        default: false
      force_sync:
        description: "强制同步（忽略 1 天跳过和源端大小减小警告）"
        required: false
        type: boolean
        default: false
  schedule:
    # - cron: "10 1 * * *"
    - cron: "*/5 * * * *"
  watch:
    types: started

jobs:
  build:
    env:
      OPENLIST_SPLIT_ON_SYNC_FAILURE: ${{ inputs.split_on_sync_failure || 'false' }}
      FORCE_SYNC: ${{ inputs.force_sync || 'false' }}
    concurrency: openlist-singleton
    runs-on: ubuntu-latest
    steps:
      - name: rclone-install
        run: |
          curl -O https://beta.rclone.org/rclone-beta-latest-linux-amd64.zip
          unzip rclone-*-amd64.zip
          cd rclone-*-linux-amd64
          sudo mv rclone /usr/bin
          sudo chmod +x /usr/bin/rclone

      - name: rclone-config
        env:
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE }}
        run: |
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG_SECRET
          EOF

          # Mask nested tokens inside the multi-line rclone config before any
          # rclone command can print config details on failure.
          python3 << 'PY'
          import json
          import re
          from pathlib import Path

          text = Path.home().joinpath(".config/rclone/rclone.conf").read_text()
          secrets = set()

          for match in re.finditer(r'(?im)^\s*(?:client_secret|pass|password)\s*=\s*(.+?)\s*$', text):
              secrets.add(match.group(1).strip())

          for match in re.finditer(r'(?im)^\s*token\s*=\s*(\{.*\})\s*$', text):
              try:
                  token = json.loads(match.group(1))
              except Exception:
                  continue
              for key in ("access_token", "refresh_token", "id_token"):
                  value = token.get(key)
                  if value:
                      secrets.add(str(value))

          for value in sorted(secrets, key=len, reverse=True):
              if value:
                  print(f"::add-mask::{value}")
          PY


      - name: rclone-run
        run: |
          echo "==========onedrive==========="
          rclone lsf onedrive:
          echo "==========dropbox==========="
          rclone lsf dropbox:

          sudo apt-get install -y fuse3
          sudo mkdir -p /dropbox
          sudo nohup rclone mount dropbox: /dropbox --allow-non-empty --no-gzip-encoding --umask 000 --allow-other --attr-timeout 10m --vfs-cache-mode full --vfs-cache-max-age 5m --vfs-read-chunk-size-limit 10G --buffer-size 100M --vfs-cache-max-size 10G &

      - name: Run openlist container
        run: sudo docker run -d --restart=unless-stopped -v /dropbox/self-hosted/openlist/data:/opt/openlist/data -p 5244:5244 -e PUID=0 -e PGID=0 -e UMASK=022 --name="openlist" openlistteam/openlist:latest

      - name: sleep
        run: |
          sudo sleep 1m

      - name: Verify docker container is running
        run: docker ps

      - name: install cloudflared
        run: |
          sudo mkdir ~/.cloudflared/
          sudo rclone copy dropbox:self-hosted/.cloudflared ~/.cloudflared -vv
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Check if the tunnel is running
        env:
          TUNNEL_NAME: "openlist"
        run: |
          OUTPUT=$(cloudflared tunnel list)
          TUNNEL_LINE=$(echo "$OUTPUT" | grep -w "$TUNNEL_NAME")
          if [ -z "$TUNNEL_LINE" ]; then
            echo "The tunnel '$TUNNEL_NAME' does not exist. Proceeding."
            exit 31
          fi

          CONNECTIONS=$(echo "$TUNNEL_LINE" | awk '{if (NF>=4) print $4; else print "-"}')
          if [ "$CONNECTIONS" == "-" ]; then
            echo "The tunnel '$TUNNEL_NAME' exists but has no active connections. Proceeding."
          else
            echo "The tunnel '$TUNNEL_NAME' is running with connections: $CONNECTIONS. Stopping actions."
            exit 0
          fi

      - name: run cloudflared
        run: |
          cloudflared tunnel route dns openlist openlist.'${{ secrets.VD }}'.eu.org
          nohup cloudflared tunnel run --url http://127.0.0.1:5244 openlist &

      # - name: config openlist
      #   run: |
      #     sleep 10m
      #     sudo docker stop openlist
      #     sleep 1m
      #     exit 31

      - name: Install required tools
        run: |
          echo "Installing ffmpeg, jq, coreutils..."
          sudo apt-get update && sudo apt-get install -y ffmpeg jq coreutils bc p7zip-full

      - name: Setup helper functions - part 1
        run: |
          cat > /tmp/functions_part1.sh << 'EOF'
                    send_log_to_telegram() {
                      local log_file="$1"
                      local task_name="$2"
                      local exit_code="$3"
                      local log_type="${4:-sync}"
                      local source_info="${5:-未知}"
                      local dest_info="${6:-未知}"

                      local critical_logs="无"
                      if [ -f "$log_file" ]; then
                        critical_logs=$(grep -Ei "error|failed|too large|timeout|permission denied|connection refused" "$log_file" | tail -n 5 || echo "无明显错误关键字")
                      fi

                      # 获取源端和目标端大小及文件数
                      local src_size="未知" dst_size="未知"
                      local src_count="" dst_count="" count_info=""
                      local size_out size_json

                      size_out=$(rclone size "$source_info" 2>/dev/null || true)
                      [ -n "$size_out" ] && src_size=$(echo "$size_out" | sed -n 's/^Total size:[[:space:]]*//p' | head -n 1)
                      size_json=$(rclone size "$source_info" --json 2>/dev/null || true)
                      [ -n "$size_json" ] && src_count=$(echo "$size_json" | jq -r '.count // empty' 2>/dev/null)

                      size_out=$(rclone size "$dest_info" 2>/dev/null || true)
                      [ -n "$size_out" ] && dst_size=$(echo "$size_out" | sed -n 's/^Total size:[[:space:]]*//p' | head -n 1)
                      size_json=$(rclone size "$dest_info" --json 2>/dev/null || true)
                      [ -n "$size_json" ] && dst_count=$(echo "$size_json" | jq -r '.count // empty' 2>/dev/null)

                      if [[ "$src_count" =~ ^[0-9]+$ ]] && [[ "$dst_count" =~ ^[0-9]+$ ]]; then
                        local diff=$((src_count - dst_count))
                        if [ "$diff" -ne 0 ]; then
                          count_info="文件数差异：${diff} (源端 ${src_count} / 目标 ${dst_count})"
                        else
                          count_info="文件数：${src_count} (一致)"
                        fi
                      elif [ -n "$src_count" ] || [ -n "$dst_count" ]; then
                        count_info="文件数：源端 ${src_count:-未知} / 目标 ${dst_count:-未知}"
                      fi

                      local file_size=$(stat -c%s "$log_file" 2>/dev/null || echo 0)

                      local message
                      message="⚠️ ${task_name} 同步告警"$'\n'
                      message+='━━━━━━━━━━━━━━'$'\n'
                      message+="源端大小：${src_size}"$'\n'
                      message+="目标大小：${dst_size}"$'\n'
                      message+="状态：部份文件同步失败"$'\n'
                      [ -n "$count_info" ] && message+="${count_info}"$'\n'
                      message+=$'\n'"📁 任务信息"$'\n'
                      message+="• 任务：${task_name}"$'\n'
                      message+="• 源端：${source_info}"$'\n'
                      message+="• 目标：${dest_info}"$'\n'
                      message+=$'\n'"🧾 错误详情"$'\n'
                      message+="• 关键日志："$'\n'
                      while IFS= read -r line; do
                        [ -n "$line" ] && message+="  ${line}"$'\n'
                      done <<< "$critical_logs"

                      curl -s -X POST https://api.telegram.org/bot'${{ secrets.TELEGRAM_BOT_TOKEN }}'/sendMessage \
                        -d chat_id='${{ secrets.TELEGRAM_CHAT_ID }}' \
                        --data-urlencode text="$message" || true
                      if [ "$file_size" -gt 0 ] && [ "$file_size" -lt 50000000 ]; then
                        curl -s -X POST https://api.telegram.org/bot'${{ secrets.TELEGRAM_BOT_TOKEN }}'/sendDocument \
                          -F chat_id='${{ secrets.TELEGRAM_CHAT_ID }}' \
                          -F document=@"$log_file" \
                          -F caption="📁 ${task_name} 错误日志" || true
                      fi
                    }
                    has_real_content() {
                      local log_file="$1"
                      if [ ! -f "$log_file" ] || [ ! -s "$log_file" ]; then
                        echo "empty"
                        return
                      fi
                      local log_content=$(grep -v "^Transferred:\|^Checks:\|^Elapsed time:\|^ *$" "$log_file" 2>/dev/null | head -20)
                      if [ -z "$log_content" ]; then
                        echo "transfer_only"
                      else
                        echo "has_content"
                      fi
                    }
                    log_video_split() {
                      local log_file="$1"
                      local message="$2"
                      echo "[$(date '+%Y-%m-%d %H:%M:%S')] $message" >> "$log_file"
                      echo "$message"
                    }
                    sync_with_logging() {
                      local source_path="$1"
                      local dest_path="$2"
                      local task_name="$3"
                      shift 3
                      local extra_args=("$@")
                      local TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                      local LOG_FILENAME="${task_name}_sync_${TIMESTAMP}.log"
                      echo "开始同步: $source_path -> $dest_path"
                      rclone sync "$source_path" "$dest_path" \
                        "${extra_args[@]}" \
                        --progress \
                        --stats 15s \
                        --stats-one-line \
                        --ignore-errors \
                        --verbose \
                        --timeout 10m \
                        --contimeout 30s \
                        --retries 3 \
                        --low-level-retries 3 \
                        2>&1 | tee "$LOG_FILENAME"
                      local SYNC_STATUS=${PIPESTATUS[0]}
                      if [ "$SYNC_STATUS" -ne 0 ] || grep -Eqi '(^|[^[:alpha:]])(ERROR|Error|Failed|failed|timeout|forbidden|unauthorized|permission denied|connection refused)([^[:alpha:]]|$)' "$LOG_FILENAME"; then
                        send_log_to_telegram "$LOG_FILENAME" "$task_name" "$SYNC_STATUS" "sync" "$source_path" "$dest_path"
                        process_failed_videos "$LOG_FILENAME" "onedrive" "$task_name"
                      else
                        local source_size_human="未知"
                        local size_output=$(rclone size "$source_path" 2>/dev/null || true)
                        if [ -n "$size_output" ]; then
                          source_size_human=$(echo "$size_output" | sed -n 's/^Total size:[[:space:]]*//p' | head -n 1)
                        fi
                        local ok_message
                        printf -v ok_message '%s\n%s\n%s\n\n%s\n%s\n%s\n%s' \
                          "✅ ${task_name} 同步完成" \
                          '━━━━━━━━━━━━━━' \
                          "源端大小：${source_size_human}" \
                          '📁 任务信息' \
                          "• 任务：${task_name}" \
                          "• 源端：${source_path}" \
                          "• 目标：${dest_path}"
                        curl -s -X POST https://api.telegram.org/bot'${{ secrets.TELEGRAM_BOT_TOKEN }}'/sendMessage \
                          -d chat_id='${{ secrets.TELEGRAM_CHAT_ID }}' \
                          --data-urlencode text="$ok_message" || true
                      fi
                      rm -f "$LOG_FILENAME" 2>/dev/null || true
                      return 0
                    }
          EOF

      - name: Setup helper functions - part 2
        run: |
          cat > /tmp/functions_part2.sh << 'EOF'
          # 发送视频分割通知到Telegram
          send_video_split_notification() {
            local file_path="$1"
            local file_size="$2"
            local parts_count="$3"
            local result="$4"
            local log_file="$5"
            local validation_summary="${6:-}"

            local file_size_human=$(numfmt --to=iec-i --suffix=B "$file_size" 2>/dev/null || echo "${file_size}B")

            local message
            if [ "$result" = "success" ]; then
              printf -v message '%s\n%s\n%s\n%s\n%s\n%s' '✅ OpenList 视频分割通知' '━━━━━━━━━━' '状态：分割成功' "文件：$file_path" "原始大小：$file_size_human" "分割数量：$parts_count 个部分"
            else
              printf -v message '%s\n%s\n%s\n%s\n%s\n%s' '❌ OpenList 视频分割通知' '━━━━━━━━━━' '状态：分割失败' "文件：$file_path" "文件大小：$file_size_human" "失败原因：$result"
            fi

            if [ -n "$validation_summary" ]; then
              message+=$'\n\n安全检查：\n'
              message+="$validation_summary"
            fi

            if [ -f "$log_file" ]; then
              local log_status=$(has_real_content "$log_file")
              if [ "$log_status" = "has_content" ]; then
                local current_file_name
                current_file_name=$(basename -- "$file_path")
                local current_log
                current_log=$(awk -v marker="开始分割视频文件: ${current_file_name}" '
                  index($0, marker) { capture=1; buf=$0 "\n"; next }
                  capture { buf = buf $0 "\n" }
                  END { printf "%s", buf }
                ' "$log_file" 2>/dev/null || true)
                local log_summary
                if [ -n "$current_log" ]; then
                  log_summary=$(printf '%s' "$current_log" | tail -c 1200 2>/dev/null || echo "无法读取当前文件日志")
                else
                  log_summary=$(tail -c 1200 "$log_file" 2>/dev/null || echo "无法读取日志")
                fi
                message+=$'\n\n日志摘要（当前文件）：\n'
                message+="$log_summary"
              fi
            fi

            curl -s -X POST https://api.telegram.org/bot'${{ secrets.TELEGRAM_BOT_TOKEN }}'/sendMessage \
              -d chat_id='${{ secrets.TELEGRAM_CHAT_ID }}' \
              --data-urlencode text="$message" || true
          }

          # 上传视频分割日志到OneDrive
          upload_video_split_log() {
            local log_file="$1"

            if [ -f "$log_file" ] && [ -s "$log_file" ]; then
              local log_status=$(has_real_content "$log_file")
              if [ "$log_status" = "has_content" ]; then
                local REMOTE_LOG_DIR="onedrive:/logs/video_split"
                log_video_split "$log_file" "上传视频分割日志到OneDrive: $REMOTE_LOG_DIR"
                rclone copyto "$log_file" "$REMOTE_LOG_DIR/$(basename "$log_file")" 2>/dev/null || echo "上传视频分割日志失败，继续执行"

                rclone lsf "$REMOTE_LOG_DIR/" 2>/dev/null | \
                  grep "^video_split_.*\.log$" | \
                  sort | head -n -10 | while read -r old_file; do
                    echo "删除旧视频分割日志: $old_file"
                    rclone delete "$REMOTE_LOG_DIR/$old_file" 2>/dev/null || true
                  done
              else
                log_video_split "$log_file" "跳过上传空日志文件"
                echo "跳过上传空视频分割日志: $log_file"
              fi
            else
              echo "视频分割日志为空或不存在，不上传"
            fi
          }
          EOF

      - name: Setup helper functions - part 3
        run: |
          cat > /tmp/functions_part3.sh << 'EOF'
          # 视频文件分割函数
          split_large_video() {
            local remote_path="$1"
            local remote_source="$2"
            local local_file_path="$3"
            local file_name="$4"
            local video_split_log="$5"

            log_video_split "$video_split_log" "开始分割视频文件: $file_name"
            local base_name="${file_name%.*}"
            local extension="${file_name##*.}"
            local file_size
            file_size=$(stat -c%s "$local_file_path" 2>/dev/null || stat -f%z "$local_file_path" 2>/dev/null || echo 0)
            # OpenList/阿里云盘大文件阈值按 4,000,000,000 bytes 处理。
            # 分片目标略低于 4G，尽量贴近上限，同时给封装开销和关键帧边界留余量。
            local max_part_size="${OPENLIST_MAX_PART_SIZE:-4000000000}"
            local target_part_size="${OPENLIST_TARGET_PART_SIZE:-3980000000}"
            local check_duration="⏳ 未执行"
            local check_ffmpeg="⏳ 未执行"
            local check_parts_generated="⏳ 未执行"
            local check_parts_size="⏳ 未执行"
            local check_upload="⏳ 未执行"
            local check_delete="⏳ 未执行"
            local split_validation_summary=""
            build_split_validation_summary() {
              printf -v split_validation_summary '%s\n%s\n%s\n%s\n%s\n%s' \
                "1. 获取/估算视频时长：${check_duration}" \
                "2. ffmpeg 成功退出：${check_ffmpeg}" \
                "3. 至少生成 1 个分片：${check_parts_generated}" \
                "4. 每个分片 ≤ ${max_part_size} bytes：${check_parts_size}" \
                "5. 所有分片上传成功：${check_upload}" \
                "6. 满足以上条件后删除原始文件：${check_delete}"
            }
            send_split_notification_with_checks() {
              local notify_parts_count="$1"
              local notify_result="$2"
              build_split_validation_summary
              send_video_split_notification "${remote_source}:${remote_path}/${file_name}" "$file_size" "$notify_parts_count" "$notify_result" "$video_split_log" "$split_validation_summary"
            }
            log_video_split "$video_split_log" "文件大小: $(numfmt --to=iec-i --suffix=B "$file_size" 2>/dev/null || echo "${file_size}B")"
            log_video_split "$video_split_log" "获取视频时长..."

            local duration
            duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$local_file_path" 2>/dev/null | head -n 1 || true)
            if ! echo "$duration" | grep -Eq '^[0-9]+([.][0-9]+)?$' || [ "$(echo "$duration > 0" | bc 2>/dev/null || echo 0)" -ne 1 ]; then
              duration=$(ffprobe -v error -select_streams v:0 -show_entries stream=duration -of default=noprint_wrappers=1:nokey=1 "$local_file_path" 2>/dev/null | head -n 1 || true)
            fi
            if ! echo "$duration" | grep -Eq '^[0-9]+([.][0-9]+)?$' || [ "$(echo "$duration > 0" | bc 2>/dev/null || echo 0)" -ne 1 ]; then
              local bit_rate
              bit_rate=$(ffprobe -v error -show_entries format=bit_rate -of default=noprint_wrappers=1:nokey=1 "$local_file_path" 2>/dev/null | head -n 1 || true)
              if echo "$bit_rate" | grep -Eq '^[0-9]+$' && [ "$bit_rate" -gt 0 ]; then
                duration=$(echo "scale=2; ($file_size * 8) / $bit_rate" | bc 2>/dev/null || echo 0)
                log_video_split "$video_split_log" "format duration 不可用，按 bit_rate 估算时长: ${duration}s"
              fi
            fi

            local duration_fallback_mode=0
            if ! echo "$duration" | grep -Eq '^[0-9]+([.][0-9]+)?$' || [ "$(echo "$duration > 0" | bc 2>/dev/null || echo 0)" -ne 1 ]; then
              duration_fallback_mode=1
              duration=0
              check_duration="⚠️ 未获取有效时长，改用固定时间分段兜底"
              log_video_split "$video_split_log" "无法获取有效视频时长，改用固定时间分段兜底: $file_name"
            else
              check_duration="✅ 通过（duration=${duration}s）"
            fi

            local n=$(( (file_size + target_part_size - 1) / target_part_size ))
            if [ "$n" -lt 2 ]; then n=2; fi
            local max_split_attempts="${OPENLIST_MAX_SPLIT_ATTEMPTS:-4}"
            local safe_base_name
            safe_base_name=$(printf '%s' "$base_name" | tr '/\\' '__')
            local split_dir=""
            local generated_count=0
            local oversized_parts=""
            local part part_size part_name
            local split_success=0
            local attempt=1

            while [ "$attempt" -le "$max_split_attempts" ]; do
              local segment_count=$((n + attempt - 1))
              local segment_time
              if [ "$duration_fallback_mode" -eq 1 ]; then
                # ffprobe 无法给出 duration 时，仍尝试按固定时间切。
                # 若分片超 4G，后续 attempt 会继续缩短 segment_time 后重切。
                segment_time=$((3600 / attempt))
                if [ "$segment_time" -lt 300 ]; then segment_time=300; fi
              else
                segment_time=$(echo "scale=2; $duration / $segment_count" | bc 2>/dev/null || echo 0)
              fi
              if ! echo "$segment_time" | grep -Eq '^[0-9]+([.][0-9]+)?$' || [ "$(echo "$segment_time > 0" | bc 2>/dev/null || echo 0)" -ne 1 ]; then
                log_video_split "$video_split_log" "计算分段时长失败: duration=$duration segment_count=$segment_count fallback=$duration_fallback_mode"
                check_ffmpeg="❌ 未执行（分段时长计算失败）"
                check_parts_generated="❌ 未执行（分段时长计算失败）"
                check_parts_size="❌ 未执行（分段时长计算失败）"
                break
              fi

              rm -rf "$split_dir" 2>/dev/null || true
              split_dir="split_${safe_base_name}_$(date +%s)_$$_${attempt}"
              mkdir -p "$split_dir"
              log_video_split "$video_split_log" "尝试分割: attempt=$attempt segment_count=$segment_count target_part_size=${target_part_size} max_part_size=${max_part_size} segment_time=${segment_time}s"

              ffmpeg -hide_banner -y -i "$local_file_path" -c copy -map 0 -segment_time "$segment_time" -f segment -reset_timestamps 1 -segment_start_number 1 "$split_dir/${base_name} - part%d.${extension}" 2>&1 | \
                while IFS= read -r line; do
                  log_video_split "$video_split_log" "ffmpeg: $line"
                done
              local ffmpeg_exit_code=${PIPESTATUS[0]}

              if [ "$ffmpeg_exit_code" -ne 0 ]; then
                log_video_split "$video_split_log" "ffmpeg 分割命令失败，退出码: $ffmpeg_exit_code"
                check_ffmpeg="❌ 未通过（exit=$ffmpeg_exit_code，已尝试 ${attempt}/${max_split_attempts}）"
                check_parts_generated="❌ 未执行（ffmpeg 失败）"
                check_parts_size="❌ 未执行（ffmpeg 失败）"
                rm -rf "$split_dir" 2>/dev/null || true
                split_dir=""
                if [ "$attempt" -lt "$max_split_attempts" ]; then
                  attempt=$((attempt + 1))
                  log_video_split "$video_split_log" "ffmpeg 失败，准备重试下一轮: attempt=$attempt/$max_split_attempts"
                  continue
                fi
                break
              fi

              generated_count=0
              oversized_parts=""
              shopt -s nullglob
              for part in "$split_dir/${base_name} - part"*."${extension}"; do
                [ -f "$part" ] || continue
                generated_count=$((generated_count + 1))
                part_size=$(stat -c%s "$part" 2>/dev/null || stat -f%z "$part" 2>/dev/null || echo 0)
                part_name=$(basename -- "$part")
                log_video_split "$video_split_log" "生成分片: $part_name ($(numfmt --to=iec-i --suffix=B "$part_size" 2>/dev/null || echo "${part_size}B"))"
                if [ "$part_size" -gt "$max_part_size" ]; then
                  oversized_parts+="${part_name} "
                fi
              done
              shopt -u nullglob

              if [ "$generated_count" -eq 0 ]; then
                log_video_split "$video_split_log" "ffmpeg 未生成任何分片"
                check_ffmpeg="✅ 通过"
                check_parts_generated="❌ 未通过（0 个分片）"
                check_parts_size="❌ 未执行（无分片）"
                rm -rf "$split_dir" 2>/dev/null || true
                split_dir=""
                break
              fi

              if [ -z "$oversized_parts" ]; then
                if [ "$duration_fallback_mode" -eq 1 ]; then
                  check_duration="⚠️ 未获取有效时长；固定时间分段兜底成功"
                fi
                check_ffmpeg="✅ 通过"
                check_parts_generated="✅ 通过（${generated_count} 个分片）"
                check_parts_size="✅ 通过（全部 ≤ ${max_part_size} bytes）"
                split_success=1
                break
              fi

              check_ffmpeg="✅ 通过"
              check_parts_generated="✅ 通过（${generated_count} 个分片）"
              check_parts_size="❌ 未通过（超限：${oversized_parts}）"
              log_video_split "$video_split_log" "存在超过阈值的分片，将增加分片数后重试: $oversized_parts"
              attempt=$((attempt + 1))
            done

            if [ "$split_success" -ne 1 ]; then
              log_video_split "$video_split_log" "未能生成全部小于阈值的分片，跳过上传和删除原始文件"
              rm -f "$local_file_path" 2>/dev/null || true
              rm -rf "$split_dir" 2>/dev/null || true
              check_delete="⛔ 未删除（前置检查未通过）"
              send_split_notification_with_checks "$generated_count" "分片仍超过阈值或生成失败，已保留原始文件"
              return 1
            fi

            local part_count=0
            local upload_failed=0
            shopt -s nullglob
            for part in "$split_dir/${base_name} - part"*."${extension}"; do
              [ -f "$part" ] || continue
              part_name=$(basename -- "$part")
              rclone copyto "$part" "${remote_source}:${remote_path}/${part_name}" --retries 3 --low-level-retries 3 2>&1 | \
                while IFS= read -r line; do
                  log_video_split "$video_split_log" "rclone upload part ${part_name}: $line"
                done
              local upload_exit_code=${PIPESTATUS[0]}
              if [ "$upload_exit_code" -ne 0 ]; then
                log_video_split "$video_split_log" "上传分片失败: ${remote_source}:${remote_path}/${part_name} exit=$upload_exit_code"
                check_upload="❌ 未通过（${part_name} exit=$upload_exit_code）"
                upload_failed=1
                break
              fi
              part_count=$((part_count + 1))
            done
            shopt -u nullglob

            if [ "$upload_failed" -ne 0 ] || [ "$part_count" -ne "$generated_count" ]; then
              log_video_split "$video_split_log" "分片上传未全部成功，已上传 $part_count/$generated_count；保留原始大文件"
              rm -f "$local_file_path" 2>/dev/null || true
              rm -rf "$split_dir" 2>/dev/null || true
              check_upload="❌ 未通过（已上传 $part_count/$generated_count）"
              check_delete="⛔ 未删除（分片上传未全部成功）"
              send_split_notification_with_checks "$part_count" "分片上传失败，已保留原始文件"
              return 1
            fi

            check_upload="✅ 通过（${part_count}/${generated_count}）"

            local delete_exit_code=0
            rclone deletefile "${remote_source}:${remote_path}/${file_name}" 2>&1 | \
              while IFS= read -r line; do
                log_video_split "$video_split_log" "rclone delete original: $line"
              done
            delete_exit_code=${PIPESTATUS[0]}
            if [ "$delete_exit_code" -ne 0 ]; then
              log_video_split "$video_split_log" "删除原始大文件失败: ${remote_source}:${remote_path}/${file_name} exit=$delete_exit_code"
              rm -f "$local_file_path" 2>/dev/null || true
              rm -rf "$split_dir" 2>/dev/null || true
              check_delete="❌ 未通过（删除命令失败）"
              send_split_notification_with_checks "$part_count" "删除原始文件失败"
              return 1
            fi

            log_video_split "$video_split_log" "已删除原始大文件: ${remote_source}:${remote_path}/${file_name}"
            rm -f "$local_file_path" 2>/dev/null || true
            rm -rf "$split_dir" 2>/dev/null || true
            echo "$(date +%Y-%m-%d_%H:%M:%S) - ${remote_source}:${remote_path}/${file_name} - 分割成 $part_count 个部分" >> "$PROCESSED_FILES_LOG"
            check_delete="✅ 已删除（全部前置条件已满足）"
            send_split_notification_with_checks "$part_count" "success"
            return 0
          }
          EOF

      - name: Setup helper functions - part 4
        run: |
          cat > /tmp/functions_part4.sh << 'EOF'
          # 非视频大文件使用 7z 分卷存储模式。
          # 恢复方式：下载全部 .7z.00x 后，双击 .7z.001 或执行 7z x 文件名.7z.001。
          split_large_binary_file() {
            local remote_path="$1"
            local remote_source="$2"
            local local_file_path="$3"
            local file_name="$4"
            local video_split_log="$5"

            local file_size
            file_size=$(stat -c%s "$local_file_path" 2>/dev/null || stat -f%z "$local_file_path" 2>/dev/null || echo 0)
            local max_part_size="${OPENLIST_MAX_PART_SIZE:-4000000000}"
            local volume_size="${OPENLIST_7Z_VOLUME_SIZE:-3810m}"
            local split_dir="binary_split_$(printf '%s' "$file_name" | tr '/\\' '__')_$(date +%s)_$$"
            mkdir -p "$split_dir"

            log_video_split "$video_split_log" "开始非视频 7z 分卷: $file_name"
            log_video_split "$video_split_log" "文件大小: $(numfmt --to=iec-i --suffix=B "$file_size" 2>/dev/null || echo "${file_size}B") volume_size=${volume_size} max_part_size=${max_part_size}"

            local abs_split_dir
            abs_split_dir="$(cd "$split_dir" && pwd)"
            local local_dir
            local_dir="$(dirname -- "$local_file_path")"
            local local_base
            local_base="$(basename -- "$local_file_path")"

            (cd "$local_dir" && 7z a -t7z -mx=0 -v"$volume_size" "$abs_split_dir/${file_name}.7z" "$local_base") 2>&1 | \
              while IFS= read -r line; do
                log_video_split "$video_split_log" "7z: $line"
              done
            local seven_zip_exit_code=${PIPESTATUS[0]}
            if [ "$seven_zip_exit_code" -ne 0 ]; then
              log_video_split "$video_split_log" "7z 分卷失败，退出码: $seven_zip_exit_code"
              rm -f "$local_file_path" 2>/dev/null || true
              rm -rf "$split_dir" 2>/dev/null || true
              send_binary_split_notification "${remote_source}:${remote_path}/${file_name}" "$file_size" "0" "7z 分卷失败，已保留原始文件" "$video_split_log"
              return 1
            fi

            local generated_count=0
            local oversized_parts=""
            local part part_size part_name
            shopt -s nullglob
            for part in "$split_dir/${file_name}.7z."*; do
              [ -f "$part" ] || continue
              generated_count=$((generated_count + 1))
              part_size=$(stat -c%s "$part" 2>/dev/null || stat -f%z "$part" 2>/dev/null || echo 0)
              part_name=$(basename -- "$part")
              log_video_split "$video_split_log" "生成 7z 分卷: $part_name ($(numfmt --to=iec-i --suffix=B "$part_size" 2>/dev/null || echo "${part_size}B"))"
              if [ "$part_size" -gt "$max_part_size" ]; then
                oversized_parts+="${part_name} "
              fi
            done
            shopt -u nullglob

            if [ "$generated_count" -eq 0 ]; then
              log_video_split "$video_split_log" "7z 未生成任何分卷，跳过删除原始文件"
              rm -f "$local_file_path" 2>/dev/null || true
              rm -rf "$split_dir" 2>/dev/null || true
              send_binary_split_notification "${remote_source}:${remote_path}/${file_name}" "$file_size" "0" "未生成 7z 分卷，已保留原始文件" "$video_split_log"
              return 1
            fi

            if [ -n "$oversized_parts" ]; then
              log_video_split "$video_split_log" "存在超过阈值的 7z 分卷，跳过上传和删除原始文件: $oversized_parts"
              rm -f "$local_file_path" 2>/dev/null || true
              rm -rf "$split_dir" 2>/dev/null || true
              send_binary_split_notification "${remote_source}:${remote_path}/${file_name}" "$file_size" "$generated_count" "7z 分卷仍超过阈值，已保留原始文件" "$video_split_log"
              return 1
            fi

            (cd "$local_dir" && sha256sum "$local_base") > "$split_dir/${file_name}.sha256" 2>/dev/null || true
            printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
              '恢复方式：' \
              "1. 下载全部 ${file_name}.7z.00x 分卷到同一目录。" \
              "2. 双击 ${file_name}.7z.001，或运行：" \
              "   7z x '${file_name}.7z.001'" \
              "3. 解压后会得到原文件：${file_name}" \
              '4. 如需校验，运行：' \
              "   sha256sum -c '${file_name}.sha256'" \
              > "$split_dir/${file_name}.restore.txt"

            local upload_count=0
            local upload_failed=0
            shopt -s nullglob
            for part in "$split_dir/${file_name}.7z."* "$split_dir/${file_name}.sha256" "$split_dir/${file_name}.restore.txt"; do
              [ -f "$part" ] || continue
              part_name=$(basename -- "$part")
              rclone copyto "$part" "${remote_source}:${remote_path}/${part_name}" --retries 3 --low-level-retries 3 2>&1 | \
                while IFS= read -r line; do
                  log_video_split "$video_split_log" "rclone upload binary part ${part_name}: $line"
                done
              local upload_exit_code=${PIPESTATUS[0]}
              if [ "$upload_exit_code" -ne 0 ]; then
                log_video_split "$video_split_log" "上传非视频分卷/辅助文件失败: ${remote_source}:${remote_path}/${part_name} exit=$upload_exit_code"
                upload_failed=1
                break
              fi
              upload_count=$((upload_count + 1))
            done
            shopt -u nullglob

            local expected_upload_count=$((generated_count + 2))
            if [ "$upload_failed" -ne 0 ] || [ "$upload_count" -ne "$expected_upload_count" ]; then
              log_video_split "$video_split_log" "非视频分卷上传未全部成功，已上传 $upload_count/$expected_upload_count；保留原始大文件"
              rm -f "$local_file_path" 2>/dev/null || true
              rm -rf "$split_dir" 2>/dev/null || true
              send_binary_split_notification "${remote_source}:${remote_path}/${file_name}" "$file_size" "$generated_count" "分卷上传失败，已保留原始文件" "$video_split_log"
              return 1
            fi

            local delete_exit_code=0
            rclone deletefile "${remote_source}:${remote_path}/${file_name}" 2>&1 | \
              while IFS= read -r line; do
                log_video_split "$video_split_log" "rclone delete original binary: $line"
              done
            delete_exit_code=${PIPESTATUS[0]}
            if [ "$delete_exit_code" -ne 0 ]; then
              log_video_split "$video_split_log" "删除原始非视频大文件失败: ${remote_source}:${remote_path}/${file_name} exit=$delete_exit_code"
              rm -f "$local_file_path" 2>/dev/null || true
              rm -rf "$split_dir" 2>/dev/null || true
              send_binary_split_notification "${remote_source}:${remote_path}/${file_name}" "$file_size" "$generated_count" "删除原始文件失败" "$video_split_log"
              return 1
            fi

            log_video_split "$video_split_log" "已删除原始非视频大文件: ${remote_source}:${remote_path}/${file_name}"
            rm -f "$local_file_path" 2>/dev/null || true
            rm -rf "$split_dir" 2>/dev/null || true
            send_binary_split_notification "${remote_source}:${remote_path}/${file_name}" "$file_size" "$generated_count" "success" "$video_split_log"
            return 0
          }

          send_binary_split_notification() {
            local file_path="$1"
            local file_size="$2"
            local parts_count="$3"
            local result="$4"
            local log_file="$5"
            local file_size_human
            file_size_human=$(numfmt --to=iec-i --suffix=B "$file_size" 2>/dev/null || echo "${file_size}B")
            local message
            if [ "$result" = "success" ]; then
              printf -v message '%s\n%s\n%s\n%s\n%s\n%s\n%s' \
                '✅ OpenList 非视频 7z 分卷通知' \
                '━━━━━━━━━━' \
                '状态：分卷成功' \
                "文件：$file_path" \
                "原始大小：$file_size_human" \
                "分卷数量：$parts_count 个 .7z.00x" \
                '恢复：下载全部分卷后，双击 .7z.001 或运行 7z x 文件名.7z.001'
            else
              printf -v message '%s\n%s\n%s\n%s\n%s\n%s' \
                '❌ OpenList 非视频 7z 分卷通知' \
                '━━━━━━━━━━' \
                '状态：分卷失败' \
                "文件：$file_path" \
                "文件大小：$file_size_human" \
                "失败原因：$result"
            fi
            if [ -f "$log_file" ]; then
              local log_summary
              log_summary=$(tail -c 1200 "$log_file" 2>/dev/null || echo "无法读取日志")
              message+=$'\n\n日志摘要：\n'
              message+="$log_summary"
            fi
            curl -s -X POST https://api.telegram.org/bot'${{ secrets.TELEGRAM_BOT_TOKEN }}'/sendMessage \
              -d chat_id='${{ secrets.TELEGRAM_CHAT_ID }}' \
              --data-urlencode text="$message" || true
          }

          # 对指定源目录中的超阈值大文件进行切割。
          # 默认不主动调用；仅在 sync task 失败且 OPENLIST_SPLIT_ON_SYNC_FAILURE=true 时调用。
          preprocess_large_files_for_openlist() {
            local source_path="$1"
            local task_name="$2"
            local large_file_threshold="${LARGE_FILE_THRESHOLD:-4000000000}"

            local remote_source="${source_path%%:*}"
            local remote_path="${source_path#*:}"
            remote_path="${remote_path#/}"
            remote_path="${remote_path%/}"

            if [ -z "$remote_source" ] || [ -z "$remote_path" ] || [ "$remote_source" = "$source_path" ]; then
              echo "无法解析源路径，跳过大文件预处理: $source_path"
              return 0
            fi

            echo "=== OpenList 前置大文件预处理: $source_path ($task_name) ==="

            local video_split_log="video_split_pre_${task_name}_$(date +%Y%m%d_%H%M%S).log"
            echo "=== OpenList 前置视频分割日志 - 开始于 $(date) ===" > "$video_split_log"
            local processed_count=0
            local success_count=0
            local failed_count=0
            local processed_files=""
            local deleted_files=""
            local failed_files=""

            while IFS=$'\t' read -r file_size relative_path; do
              [ -n "$relative_path" ] || continue

              local split_kind="binary"
              case "$relative_path" in
                *.mp4|*.mkv|*.mov|*.avi|*.flv|*.webm|*.m4v|*.wmv|*.mpg|*.mpeg|*.3gp|*.mp3|*.wav|*.aac|*.flac|*.m4a)
                  split_kind="media"
                  ;;
              esac

              local full_path="${remote_path}/${relative_path}"
              local file_name
              file_name="$(basename -- "$relative_path")"
              local file_dir
              file_dir="$(dirname -- "$full_path")"
              if [ "$file_dir" = "." ]; then
                file_dir="$remote_path"
              fi

              processed_count=$((processed_count + 1))
              local temp_dir="temp_video_pre_split_$(date +%s)_${processed_count}"
              mkdir -p "$temp_dir"

              log_video_split "$video_split_log" "下载待分割大文件: ${remote_source}:${full_path}"
              rclone copyto "${remote_source}:${full_path}" "$temp_dir/$file_name" --progress --stats 15s --stats-one-line 2>&1 | \
                while IFS= read -r line; do log_video_split "$video_split_log" "rclone copy: $line"; done
              local copy_exit_code=${PIPESTATUS[0]}

              local split_success=1
              if [ "$copy_exit_code" -eq 0 ] && [ -f "$temp_dir/$file_name" ]; then
                if [ "$split_kind" = "media" ]; then
                  split_large_video "$file_dir" "$remote_source" "$temp_dir/$file_name" "$file_name" "$video_split_log" || split_success=0
                else
                  split_large_binary_file "$file_dir" "$remote_source" "$temp_dir/$file_name" "$file_name" "$video_split_log" || split_success=0
                fi
              else
                split_success=0
              fi

              if [ "$split_success" -eq 1 ]; then
                success_count=$((success_count + 1))
                processed_files+="• ${remote_source}:${full_path} ($(numfmt --to=iec-i --suffix=B "$file_size" 2>/dev/null || echo "${file_size}B"), ${split_kind})"$'\n'
                deleted_files+="• ${remote_source}:${full_path}"$'\n'
                echo "$(date +%Y-%m-%d_%H:%M:%S) - ${remote_source}:${full_path} - OpenList 前置分割成功(${split_kind})，已删除原始大文件" >> "$PROCESSED_FILES_LOG"
              else
                failed_count=$((failed_count + 1))
                failed_files+="• ${remote_source}:${full_path}"$'\n'
                log_video_split "$video_split_log" "OpenList 前置分割失败: ${remote_source}:${full_path}"
              fi

              rm -rf "$temp_dir" 2>/dev/null || true
            done < <(
              rclone lsjson "$source_path" --recursive --files-only 2>/dev/null | \
                jq -r --argjson threshold "$large_file_threshold" \
                  '.[] | select((.Size // 0) > $threshold) | [(.Size | tostring), .Path] | @tsv'
            )

            upload_video_split_log "$video_split_log"

            if [ "$processed_count" -gt 0 ]; then
              local summary_message
              printf -v summary_message '%s\n%s\n%s\n%s\n%s\n%s' \
                '📊 OpenList 前置大文件处理总结' \
                '━━━━━━━━━━' \
                "任务：$task_name" \
                "尝试处理：$processed_count" \
                "处理成功：$success_count" \
                "处理失败：$failed_count"
              if [ -n "$processed_files" ]; then
                summary_message+=$'\n\n✂️ 已切割文件：\n'
                summary_message+="$processed_files"
              fi
              if [ -n "$deleted_files" ]; then
                summary_message+=$'\n🗑️ 已删除 OneDrive 原始大文件：\n'
                summary_message+="$deleted_files"
              fi
              if [ -n "$failed_files" ]; then
                summary_message+=$'\n⚠️ 处理失败文件：\n'
                summary_message+="$failed_files"
              fi
              curl -s -X POST https://api.telegram.org/bot'${{ secrets.TELEGRAM_BOT_TOKEN }}'/sendMessage \
                -d chat_id='${{ secrets.TELEGRAM_CHAT_ID }}' \
                --data-urlencode text="$summary_message" || true
            fi

            rm -f "$video_split_log" 2>/dev/null || true
            return 0
          }

          split_large_files_after_sync_failure() {
            local source_path="$1"
            local task_name="$2"
            local switch_value="${OPENLIST_SPLIT_ON_SYNC_FAILURE:-false}"
            case "$switch_value" in
              true|TRUE|1|yes|YES|on|ON) ;;
              *)
                echo "OpenList 大文件失败后切割开关关闭，跳过: task=${task_name} source=${source_path}"
                return 0
                ;;
            esac

            echo "OpenList 大文件失败后切割开关已开启，开始处理: task=${task_name} source=${source_path}"
            preprocess_large_files_for_openlist "$source_path" "$task_name"
          }


          # 分析错误日志，查找失败的大视频文件
          process_failed_videos() {
            local log_file="$1"
            local remote_source="$2"
            local task_name="$3"

            echo "分析错误日志，查找失败的视频文件..."
            local log_status=$(has_real_content "$log_file")
            if [ "$log_status" != "has_content" ]; then
              echo "日志文件没有实际错误内容，跳过视频处理"
              return
            fi

            local video_split_log="video_split_${task_name}_$(date +%Y%m%d_%H%M%S).log"
            echo "=== 视频分割日志 - 开始于 $(date) ===" > "$video_split_log"
            local failed_videos=$(grep -i "error\|failed\|too large\|size" "$log_file" | grep -E "\.(mp4|mkv|mov|avi|flv|webm|m4v|wmv|mpg|mpeg|3gp|mp3|wav|aac|flac|m4a)$" | head -20 || true)

            if [ -n "$failed_videos" ]; then
              local file_patterns=$(echo "$failed_videos" | grep -oE "[a-zA-Z09_\-./]+\.(mp4|mkv|mov|avi|flv|webm|m4v|wmv|mpg|mpeg|3gp|mp3|wav|aac|flac|m4a)" | sort -u)
              local processed_count=0
              local success_count=0

              for file_pattern in $file_patterns; do
                local cleaned_path=$(echo "$file_pattern" | sed 's/^.*\///')
                local full_path=""
                local file_size=0

                case "$task_name" in
                  "backup") search_paths=("backup") ;;
                  "task0") search_paths=("0") ;;
                  "task1") search_paths=("1") ;;
                  "task2") search_paths=("2") ;;
                  "task3") search_paths=("3") ;;
                  *) search_paths=("backup" "0" "1" "2" "3") ;;
                esac

                for search_path in "${search_paths[@]}"; do
                  local found_file=$(rclone lsf "${remote_source}:${search_path}" --include "*${cleaned_path}*" 2>/dev/null | head -1)
                  if [ -n "$found_file" ]; then
                    local file_info=$(rclone size "${remote_source}:${search_path}/${found_file}" 2>/dev/null || echo "0")
                    file_size=$(echo "$file_info" | grep "Total size" | grep -oE '[0-9]+' || echo "0")
                    if [ "$file_size" -gt 4000000000 ]; then
                      full_path="${search_path}/${found_file}"
                      break
                    fi
                  fi
                done

                if [ -n "$full_path" ] && [ "$file_size" -gt 4000000000 ]; then
                  processed_count=$((processed_count + 1))
                  local temp_dir="temp_video_split_$(date +%s)_${processed_count}"
                  mkdir -p "$temp_dir"
                  rclone copy "${remote_source}:${full_path}" "$temp_dir/" 2>&1 | while IFS= read -r line; do log_video_split "$video_split_log" "rclone copy: $line"; done
                  local local_file="$temp_dir/$(basename "$full_path")"
                  if [ -f "$local_file" ] && split_large_video "$(dirname "$full_path")" "$remote_source" "$local_file" "$(basename "$full_path")" "$video_split_log"; then
                    success_count=$((success_count + 1))
                  fi
                  rm -rf "$temp_dir" 2>/dev/null || true
                fi
              done

              upload_video_split_log "$video_split_log"
              if [ $processed_count -gt 0 ]; then
                local summary_message
                printf -v summary_message '%s\n%s\n%s\n%s\n%s' '📊 OpenList 视频分割总结' '━━━━━━━━━━' "任务：$task_name" "尝试处理：$processed_count" "处理成功：$success_count"
                curl -s -X POST https://api.telegram.org/bot'${{ secrets.TELEGRAM_BOT_TOKEN }}'/sendMessage \
                  -d chat_id='${{ secrets.TELEGRAM_CHAT_ID }}' \
                  --data-urlencode text="$summary_message" || true
              fi
            fi

            rm -f "$video_split_log" 2>/dev/null || true
          }
          EOF

      - name: Setup helper functions - part 5
        run: |
          cat > /tmp/functions_part5.sh << 'EOF'
          # 修复日志函数（独立于视频分割日志）
          log_fix_attempt() {
            local log_file="$1"
            local message="$2"
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] $message" >> "$log_file"
            echo "$message"
          }

          # 尝试修复 405/409 等无法同步的文件
          # 1. 如果目录创建失败，将最底层文件夹名 base64URL 编码后重新创建目录
          # 2. 目录就绪后，尝试多种方式同步文件到目标路径（原始路径或 base64URL 目录）
          # 结果写入全局变量：
          #   TRY_FIX_STATUS / TRY_FIX_ORIGINAL / TRY_FIX_ALTERNATIVE / TRY_FIX_METHOD / TRY_FIX_MESSAGE
          try_fix_failed_file() {
            local source_path="$1"
            local dest_path="$2"
            local task_name="$3"
            local failed_file_rel="$4"
            local fix_log="$5"

            local src_file="${source_path}/${failed_file_rel}"
            local dst_file="${dest_path}/${failed_file_rel}"

            local file_name
            file_name="$(basename -- "$failed_file_rel")"
            local file_dir_rel
            file_dir_rel="$(dirname -- "$failed_file_rel")"
            local dst_dir="${dest_path}/${file_dir_rel}"

            # OpenList 内部路径（去掉 openlist: 前缀）
            local ol_dst_base="${dest_path#openlist:}"
            ol_dst_base="${ol_dst_base#/}"

            TRY_FIX_STATUS="failed"
            TRY_FIX_ORIGINAL="$failed_file_rel"
            TRY_FIX_ALTERNATIVE=""
            TRY_FIX_METHOD=""
            TRY_FIX_MESSAGE=""

            log_fix_attempt "$fix_log" "=== 尝试修复失败文件: $failed_file_rel ==="
            log_fix_attempt "$fix_log" "源文件: $src_file"
            log_fix_attempt "$fix_log" "原始目标: $dst_file"

            # 下载源文件到本地临时目录
            local temp_dir="temp_fix_$(date +%s)_$$"
            mkdir -p "$temp_dir"
            local local_file="$temp_dir/$file_name"

            log_fix_attempt "$fix_log" "下载源文件到本地..."
            rclone copyto "$src_file" "$local_file" --retries 1 --low-level-retries 3 --timeout 5m --contimeout 30s 2>&1 | \
              while IFS= read -r line; do log_fix_attempt "$fix_log" "rclone copy: $line"; done
            local copy_status=${PIPESTATUS[0]}

            if [ "$copy_status" -ne 0 ] || [ ! -f "$local_file" ]; then
              log_fix_attempt "$fix_log" "下载源文件失败，跳过修复"
              TRY_FIX_MESSAGE="无法从源端下载文件"
              rm -rf "$temp_dir" 2>/dev/null || true
              return 1
            fi

            local file_size
            file_size=$(stat -c%s "$local_file" 2>/dev/null || stat -f%z "$local_file" 2>/dev/null || echo 0)
            log_fix_attempt "$fix_log" "源文件已下载，大小: $(numfmt --to=iec-i --suffix=B "$file_size" 2>/dev/null || echo "${file_size}B")"

            # Step 1: 尝试创建/确认目标目录
            local dir_ok=0
            local used_base64_dir=0
            local actual_dst_dir="$dst_dir"
            local actual_ol_dir="/${ol_dst_base}/${file_dir_rel}"

            log_fix_attempt "$fix_log" "尝试创建目标目录: $dst_dir"
            rclone mkdir "$dst_dir" --retries 1 --low-level-retries 3 --timeout 2m --contimeout 30s 2>&1 | \
              while IFS= read -r line; do log_fix_attempt "$fix_log" "rclone mkdir: $line"; done
            local mkdir_status=${PIPESTATUS[0]}

            if [ "$mkdir_status" -eq 0 ]; then
              dir_ok=1
              log_fix_attempt "$fix_log" "rclone mkdir 成功"
            else
              log_fix_attempt "$fix_log" "rclone mkdir 失败 (exit=$mkdir_status)，尝试 OpenList API mkdir..."
              local ol_token
              ol_token=$(jq -r '.token' /dropbox/self-hosted/openlist/data/config.json 2>/dev/null || echo "")
              if [ -n "$ol_token" ] && [ "$ol_token" != "null" ]; then
                local mkdir_resp mkdir_http
                mkdir_resp=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "http://127.0.0.1:5244/api/fs/mkdir" \
                  -H "Authorization: $ol_token" \
                  -H "Content-Type: application/json" \
                  -d "$(jq -n --arg path "$actual_ol_dir" '{path:$path}')" 2>&1)
                mkdir_http=$(echo "$mkdir_resp" | tail -n 1)
                log_fix_attempt "$fix_log" "OpenList API mkdir 响应: ${mkdir_http}"
                if echo "$mkdir_http" | grep -qE 'HTTP_CODE:(200|201|204)'; then
                  dir_ok=1
                  log_fix_attempt "$fix_log" "OpenList API mkdir 成功"
                fi
              fi

              # 目录创建仍失败 → base64URL 编码最底层文件夹名后重试
              if [ "$dir_ok" -ne 1 ] && [ "$file_dir_rel" != "." ] && [ -n "$file_dir_rel" ]; then
                log_fix_attempt "$fix_log" "目录创建失败，尝试 base64URL 编码文件夹名..."

                local parent_dir leaf_dir encoded_leaf new_file_dir_rel
                parent_dir="$(dirname -- "$file_dir_rel")"
                leaf_dir="$(basename -- "$file_dir_rel")"
                encoded_leaf=$(printf '%s' "$leaf_dir" | base64 | tr '+/' '-_' | tr -d '=')

                if [ "$parent_dir" = "." ]; then
                  new_file_dir_rel="$encoded_leaf"
                else
                  new_file_dir_rel="${parent_dir}/${encoded_leaf}"
                fi

                actual_dst_dir="${dest_path}/${new_file_dir_rel}"
                actual_ol_dir="/${ol_dst_base}/${new_file_dir_rel}"

                log_fix_attempt "$fix_log" "原始目录: $file_dir_rel"
                log_fix_attempt "$fix_log" "base64URL 编码目录: $new_file_dir_rel"

                rclone mkdir "$actual_dst_dir" --retries 1 --low-level-retries 3 --timeout 2m --contimeout 30s 2>&1 | \
                  while IFS= read -r line; do log_fix_attempt "$fix_log" "rclone mkdir (base64URL): $line"; done
                mkdir_status=${PIPESTATUS[0]}

                if [ "$mkdir_status" -eq 0 ]; then
                  dir_ok=1
                  used_base64_dir=1
                  dst_file="${actual_dst_dir}/${file_name}"
                  log_fix_attempt "$fix_log" "base64URL 目录创建成功 (rclone)"
                else
                  if [ -n "$ol_token" ] && [ "$ol_token" != "null" ]; then
                    mkdir_resp=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "http://127.0.0.1:5244/api/fs/mkdir" \
                      -H "Authorization: $ol_token" \
                      -H "Content-Type: application/json" \
                      -d "$(jq -n --arg path "$actual_ol_dir" '{path:$path}')" 2>&1)
                    mkdir_http=$(echo "$mkdir_resp" | tail -n 1)
                    log_fix_attempt "$fix_log" "OpenList API mkdir (base64URL) 响应: ${mkdir_http}"
                    if echo "$mkdir_http" | grep -qE 'HTTP_CODE:(200|201|204)'; then
                      dir_ok=1
                      used_base64_dir=1
                      dst_file="${actual_dst_dir}/${file_name}"
                      log_fix_attempt "$fix_log" "base64URL 目录创建成功 (API)"
                    fi
                  fi
                fi
              fi
            fi

            if [ "$dir_ok" -ne 1 ]; then
              log_fix_attempt "$fix_log" "目录创建最终失败（含 base64URL 编码后），无法修复文件"
              TRY_FIX_MESSAGE="目录创建失败，base64URL 编码后仍失败"
              rm -rf "$temp_dir" 2>/dev/null || true
              return 1
            fi

            # Step 2: 目录已就绪，尝试多种方式同步文件
            log_fix_attempt "$fix_log" "目录已就绪，开始尝试多种方式同步到: $dst_file"

            local ol_dst_dir
            ol_dst_dir="${dst_file#openlist:}"
            ol_dst_dir="/$(dirname -- "$ol_dst_dir")"

            local ol_token
            ol_token=$(jq -r '.token' /dropbox/self-hosted/openlist/data/config.json 2>/dev/null || echo "")

            # 方法 1：直接 rclone copyto
            log_fix_attempt "$fix_log" "方法 1: 直接 rclone copyto"
            rclone copyto "$src_file" "$dst_file" --retries 1 --low-level-retries 3 --timeout 5m --contimeout 30s 2>&1 | \
              while IFS= read -r line; do log_fix_attempt "$fix_log" "m1: $line"; done
            local m1_status=${PIPESTATUS[0]}
            if [ "$m1_status" -eq 0 ]; then
              log_fix_attempt "$fix_log" "方法 1 成功"
              TRY_FIX_STATUS="success"
              TRY_FIX_METHOD="直接 copyto"
              if [ "$used_base64_dir" -eq 1 ]; then
                TRY_FIX_ALTERNATIVE="${dst_file#${dest_path}/}"
              else
                TRY_FIX_ALTERNATIVE="$failed_file_rel"
              fi
              rm -rf "$temp_dir" 2>/dev/null || true
              return 0
            fi
            log_fix_attempt "$fix_log" "方法 1 失败 (exit=$m1_status)"

            # 方法 2：文件名 base64URL 编码后上传
            log_fix_attempt "$fix_log" "方法 2: 文件名 base64URL 编码后上传"
            local encoded_name m2_dst m2_status
            if [[ "$file_name" == *.* ]]; then
              local name_base="${file_name%.*}"
              local name_ext="${file_name##*.}"
              encoded_name="$(printf '%s' "$name_base" | base64 | tr '+/' '-_' | tr -d '=').${name_ext}"
            else
              encoded_name="$(printf '%s' "$file_name" | base64 | tr '+/' '-_' | tr -d '=')"
            fi
            m2_dst="${actual_dst_dir}/${encoded_name}"
            rclone copyto "$local_file" "$m2_dst" --retries 1 --low-level-retries 3 --timeout 5m --contimeout 30s 2>&1 | \
              while IFS= read -r line; do log_fix_attempt "$fix_log" "m2: $line"; done
            m2_status=${PIPESTATUS[0]}
            if [ "$m2_status" -eq 0 ]; then
              log_fix_attempt "$fix_log" "方法 2 成功"
              TRY_FIX_STATUS="success"
              TRY_FIX_METHOD="base64URL 改名上传"
              TRY_FIX_ALTERNATIVE="${m2_dst#${dest_path}/}"
              rm -rf "$temp_dir" 2>/dev/null || true
              return 0
            fi
            log_fix_attempt "$fix_log" "方法 2 失败 (exit=$m2_status)"

            # 方法 3：zip 压缩后上传
            log_fix_attempt "$fix_log" "方法 3: zip 压缩后上传"
            (cd "$temp_dir" && 7z a -tzip -mx=0 "${file_name}.zip" "$file_name") 2>&1 | \
              while IFS= read -r line; do log_fix_attempt "$fix_log" "m3 7z: $line"; done
            if [ -f "$temp_dir/${file_name}.zip" ]; then
              local m3_dst m3_status
              m3_dst="${actual_dst_dir}/${file_name}.zip"
              rclone copyto "$temp_dir/${file_name}.zip" "$m3_dst" --retries 1 --low-level-retries 3 --timeout 5m --contimeout 30s 2>&1 | \
                while IFS= read -r line; do log_fix_attempt "$fix_log" "m3: $line"; done
              m3_status=${PIPESTATUS[0]}
              if [ "$m3_status" -eq 0 ]; then
                log_fix_attempt "$fix_log" "方法 3 成功"
                TRY_FIX_STATUS="success"
                TRY_FIX_METHOD="zip 压缩"
                TRY_FIX_ALTERNATIVE="${m3_dst#${dest_path}/}"
                rm -rf "$temp_dir" 2>/dev/null || true
                return 0
              fi
              log_fix_attempt "$fix_log" "方法 3 失败 (exit=$m3_status)"
            else
              log_fix_attempt "$fix_log" "方法 3 zip 未生成"
            fi

            # 方法 4：7z 压缩后上传
            log_fix_attempt "$fix_log" "方法 4: 7z 压缩后上传"
            (cd "$temp_dir" && 7z a -t7z -mx=0 "${file_name}.7z" "$file_name") 2>&1 | \
              while IFS= read -r line; do log_fix_attempt "$fix_log" "m4 7z: $line"; done
            if [ -f "$temp_dir/${file_name}.7z" ]; then
              local m4_dst m4_status
              m4_dst="${actual_dst_dir}/${file_name}.7z"
              rclone copyto "$temp_dir/${file_name}.7z" "$m4_dst" --retries 1 --low-level-retries 3 --timeout 5m --contimeout 30s 2>&1 | \
                while IFS= read -r line; do log_fix_attempt "$fix_log" "m4: $line"; done
              m4_status=${PIPESTATUS[0]}
              if [ "$m4_status" -eq 0 ]; then
                log_fix_attempt "$fix_log" "方法 4 成功"
                TRY_FIX_STATUS="success"
                TRY_FIX_METHOD="7z 压缩"
                TRY_FIX_ALTERNATIVE="${m4_dst#${dest_path}/}"
                rm -rf "$temp_dir" 2>/dev/null || true
                return 0
              fi
              log_fix_attempt "$fix_log" "方法 4 失败 (exit=$m4_status)"
            else
              log_fix_attempt "$fix_log" "方法 4 7z 未生成"
            fi

            # 方法 5：OpenList API 直传
            log_fix_attempt "$fix_log" "方法 5: OpenList API 直传"
            if [ -n "$ol_token" ] && [ "$ol_token" != "null" ]; then
              curl -s -X POST "http://127.0.0.1:5244/api/fs/refresh" \
                -H "Authorization: $ol_token" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg path "$ol_dst_dir" '{path:$path,recursive:true}')" >/dev/null 2>&1 || true
              sleep 3

              local api_name upload_resp upload_http
              if [[ "$file_name" == *.* ]]; then
                api_name="file_$(date +%s)_$$_api.${file_name##*.}"
              else
                api_name="file_$(date +%s)_$$_api"
              fi
              upload_resp=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "http://127.0.0.1:5244/api/fs/form" \
                -H "Authorization: $ol_token" \
                -F "file=@$local_file" \
                -F "path=$ol_dst_dir" \
                -F "name=$api_name" 2>&1)
              upload_http=$(echo "$upload_resp" | tail -n 1)
              log_fix_attempt "$fix_log" "OpenList API 上传响应: ${upload_http}"
              if echo "$upload_http" | grep -qE 'HTTP_CODE:(200|201|204)'; then
                log_fix_attempt "$fix_log" "方法 5 成功"
                TRY_FIX_STATUS="success"
                TRY_FIX_METHOD="OpenList API 直传"
                local alt_rel_base
                alt_rel_base="${actual_dst_dir#${dest_path}/}"
                TRY_FIX_ALTERNATIVE="${alt_rel_base}/${api_name}"
                rm -rf "$temp_dir" 2>/dev/null || true
                return 0
              fi
              log_fix_attempt "$fix_log" "方法 5 失败 (${upload_http})"
            else
              log_fix_attempt "$fix_log" "方法 5 跳过（无法读取 OpenList token）"
            fi

            # 所有方法均失败
            log_fix_attempt "$fix_log" "所有修复方法均失败"
            TRY_FIX_MESSAGE="所有修复方法均失败"
            rm -rf "$temp_dir" 2>/dev/null || true
            return 1
          }
          EOF

      - name: Setup helper functions - part 6
        run: |
          cat > /tmp/functions_part6.sh << 'EOF'
          # 从 rclone 日志中解析传输字节数
          get_transferred_bytes_from_log() {
            local log_file="$1"
            local line
            line=$(grep 'Transferred:' "$log_file" 2>/dev/null | tail -1)
            if [ -z "$line" ]; then
              echo 0
              return
            fi
            # 提取第一个大小值，如 "1.234 GiB" 或 "0 B"
            local size_str
            size_str=$(echo "$line" | sed -n 's/.*Transferred:[[:space:]]*\([0-9.]*[[:space:]]*[KMGTPEZY]iB\).*/\1/p')
            if [ -z "$size_str" ]; then
              size_str=$(echo "$line" | sed -n 's/.*Transferred:[[:space:]]*\([0-9.]*[[:space:]]*B\).*/\1/p')
            fi
            if [ -z "$size_str" ]; then
              echo 0
              return
            fi
            local num unit
            num=$(echo "$size_str" | awk '{print $1}')
            unit=$(echo "$size_str" | awk '{print $2}')
            case "$unit" in
              KiB) awk "BEGIN {printf \"%d\", $num * 1024}" ;;
              MiB) awk "BEGIN {printf \"%d\", $num * 1048576}" ;;
              GiB) awk "BEGIN {printf \"%d\", $num * 1073741824}" ;;
              TiB) awk "BEGIN {printf \"%d\", $num * 1099511627776}" ;;
              PiB) awk "BEGIN {printf \"%d\", $num * 1125899906842624}" ;;
              B)   awk "BEGIN {printf \"%d\", $num}" ;;
              *) echo 0 ;;
            esac
          }

          # 格式化字节数为人类可读
          format_bytes() {
            local bytes="$1"
            if [ "$bytes" -ge 1125899906842624 ]; then
              awk "BEGIN {printf \"%.3f PiB\", $bytes / 1125899906842624}"
            elif [ "$bytes" -ge 1099511627776 ]; then
              awk "BEGIN {printf \"%.3f TiB\", $bytes / 1099511627776}"
            elif [ "$bytes" -ge 1073741824 ]; then
              awk "BEGIN {printf \"%.3f GiB\", $bytes / 1073741824}"
            elif [ "$bytes" -ge 1048576 ]; then
              awk "BEGIN {printf \"%.3f MiB\", $bytes / 1048576}"
            elif [ "$bytes" -ge 1024 ]; then
              awk "BEGIN {printf \"%.3f KiB\", $bytes / 1024}"
            else
              echo "${bytes} B"
            fi
          }

          # Sync with probes and detailed logs.
          # 带探测和更清晰日志的同步函数。
          sync_with_logging() {
            local source_path="$1"
            local dest_path="$2"
            local task_name="$3"
            shift 3
            local extra_args=("$@")
            local TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            local LOG_FILENAME="${task_name}_sync_${TIMESTAMP}.log"

            echo "开始同步: $source_path -> $dest_path"

            local LAST_ATTEMPT_LOG="${LOG_FILENAME}.last"

            run_rclone_sync_once() {
              local attempt_label="$1"
              echo "=== ${task_name} ${attempt_label} ===" | tee -a "$LOG_FILENAME"
              echo "OpenList sync args: ${extra_args[*]}" | tee -a "$LOG_FILENAME"
              : > "$LAST_ATTEMPT_LOG"

              # Emit a simple heartbeat while rclone is busy scanning/checking.
              # rclone progress output can be sparse or carriage-return based,
              # which makes GitHub's live log look blank during long WebDAV waits.
              # rclone 扫描/检查阶段可能长时间没有换行输出；这里每分钟输出一次心跳，
              # 避免 GitHub Actions 页面看起来像没有日志或卡死。
              (
                while true; do
                  sleep 60
                  echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] ${task_name} ${attempt_label} still running..."
                done
              ) &
              local heartbeat_pid=$!

              rclone sync "$source_path" "$dest_path" \
                --progress \
                --stats 15s \
                --stats-one-line \
                --ignore-errors \
                --verbose \
                --size-only \
                --delete-before \
                --timeout 5m \
                --contimeout 30s \
                --retries 1 \
                --low-level-retries 3 \
                "${extra_args[@]}" \
                2>&1 | tee "$LAST_ATTEMPT_LOG"
              local attempt_status=${PIPESTATUS[0]}

              kill "$heartbeat_pid" 2>/dev/null || true
              wait "$heartbeat_pid" 2>/dev/null || true

              cat "$LAST_ATTEMPT_LOG" >> "$LOG_FILENAME"
              return "$attempt_status"
            }

            : > "$LOG_FILENAME"
            local SYNC_STATUS=0
            run_rclone_sync_once "initial sync" || SYNC_STATUS=$?

            # OpenList / WebDAV may temporarily lock target objects and return
            # HTTP 423. Retry the whole sync after a delay; already copied files
            # will be skipped by rclone, so this mainly retries locked leftovers.
            # OpenList / WebDAV 可能临时锁定目标对象并返回 HTTP 423。
            # 延迟后重跑整次 sync；已完成文件会被 rclone 跳过，主要补偿锁定残留文件。
            if [[ "$dest_path" == openlist:* ]] && grep -Eqi 'Locked:[[:space:]]*423|423[[:space:]]+Locked' "$LAST_ATTEMPT_LOG"; then
              local lock_retry_attempts="${OPENLIST_423_RETRY_ATTEMPTS:-3}"
              local lock_retry_sleep="${OPENLIST_423_RETRY_SLEEP_SECONDS:-300}"
              local lock_retry_index

              for ((lock_retry_index = 1; lock_retry_index <= lock_retry_attempts; lock_retry_index++)); do
                echo "检测到 OpenList 423 Locked，等待 ${lock_retry_sleep}s 后重试 ${lock_retry_index}/${lock_retry_attempts}。" | tee -a "$LOG_FILENAME"
                sleep "$lock_retry_sleep"
                run_rclone_sync_once "423 retry ${lock_retry_index}/${lock_retry_attempts}" || SYNC_STATUS=$?

                if ! grep -Eqi 'Locked:[[:space:]]*423|423[[:space:]]+Locked' "$LAST_ATTEMPT_LOG"; then
                  break
                fi
              done
            fi

            # OpenList 后端不允许 PUT 覆盖已存在文件，返回 405 Method Not Allowed。
            # rclone check 预删除可能因 WebDAV PROPFIND 不完整而漏掉部分文件，
            # 这里在 sync 失败后从日志解析 405 失败的文件，逐个 deletefile 后重试。
            if [[ "$dest_path" == openlist:* ]] && grep -Eqi 'Method Not Allowed: 405|405 Method Not Allowed' "$LAST_ATTEMPT_LOG"; then
              local retry_405_attempts="${OPENLIST_405_RETRY_ATTEMPTS:-3}"
              local retry_405_index

              for ((retry_405_index = 1; retry_405_index <= retry_405_attempts; retry_405_index++)); do
                echo "检测到 OpenList 405 Method Not Allowed，解析失败文件并预删除后重试 ${retry_405_index}/${retry_405_attempts}。" | tee -a "$LOG_FILENAME"

                local retry_405_deleted=0
                while IFS= read -r failed_line; do
                  [ -z "$failed_line" ] && continue
                  echo "405 补救: 预删除 ${dest_path}/${failed_line}" | tee -a "$LOG_FILENAME"
                  local delete_out
                  delete_out=$(rclone deletefile "${dest_path}/${failed_line}" \
                       --retries 1 --low-level-retries 1 \
                       --timeout 2m --contimeout 30s \
                       2>&1) && retry_405_deleted=$((retry_405_deleted + 1)) || \
                       echo "405 补救: deletefile 结果: $delete_out" | tee -a "$LOG_FILENAME"
                done < <(
                  grep -E 'ERROR : .+: Failed to copy.*405 Method Not Allowed' "$LAST_ATTEMPT_LOG" 2>/dev/null | \
                    sed -E 's/^.*ERROR : //; s/: Failed to copy.*$//' | sort -u
                )

                # 刷新 OpenList 服务端目录缓存，清除"幽灵文件"
                # （PROPFIND 返回缓存中已不存在的文件 → rclone 尝试覆盖 → 405）
                local ol_path="${dest_path#openlist:}"
                ol_path="/${ol_path}"
                local ol_token
                ol_token=$(jq -r '.token' /dropbox/self-hosted/openlist/data/config.json 2>/dev/null || echo "")
                if [ -n "$ol_token" ] && [ "$ol_token" != "null" ]; then
                  echo "405 补救: 刷新 OpenList 缓存 $ol_path" | tee -a "$LOG_FILENAME"
                  curl -s -X POST "http://127.0.0.1:5244/api/fs/refresh" \
                    -H "Authorization: $ol_token" \
                    -H "Content-Type: application/json" \
                    -d "{\"path\":\"$ol_path\",\"recursive\":true}" \
                    >/dev/null 2>&1 || true
                  sleep 3
                fi

                echo "405 补救: 已预删除 $retry_405_deleted 个文件，已刷新缓存，重新 sync" | tee -a "$LOG_FILENAME"
                run_rclone_sync_once "405 retry ${retry_405_index}/${retry_405_attempts}" || SYNC_STATUS=$?

                if ! grep -Eqi 'Method Not Allowed: 405|405 Method Not Allowed' "$LAST_ATTEMPT_LOG"; then
                  break
                fi
              done
            fi

            # 405/409 失败文件尝试修复（目录创建→base64URL编码→多种方式同步），不阻止后续 task
            local fail_list="/tmp/${task_name}_sync_failures.txt"
            local fix_list="/tmp/${task_name}_sync_fixes.txt"
            : > "$fail_list"
            : > "$fix_list"
            if [[ "$dest_path" == openlist:* ]] && grep -Eqi 'Method Not Allowed: 405|405 Method Not Allowed|409 Conflict' "$LAST_ATTEMPT_LOG"; then
              echo "=== ${task_name} 尝试修复 405/409 失败文件 ===" | tee -a "$LOG_FILENAME"

              local fix_log="file_fix_${task_name}_$(date +%Y%m%d_%H%M%S).log"
              echo "=== 405/409 修复日志 - $(date) ===" > "$fix_log"

              while IFS= read -r failed_line; do
                [ -z "$failed_line" ] && continue

                local file_size="未知"
                local size_out
                size_out=$(rclone size "${source_path}/${failed_line}" 2>/dev/null || true)
                if [ -n "$size_out" ]; then
                  file_size=$(echo "$size_out" | sed -n 's/^Total size:[[:space:]]*//p' | head -n 1)
                fi

                echo "修复中: ${failed_line} (${file_size})" | tee -a "$LOG_FILENAME"

                try_fix_failed_file "$source_path" "$dest_path" "$task_name" "$failed_line" "$fix_log" || true

                if [ "$TRY_FIX_STATUS" = "success" ]; then
                  echo "修复成功: ${failed_line} -> 方法: ${TRY_FIX_METHOD}" | tee -a "$LOG_FILENAME"
                  echo "${TRY_FIX_ORIGINAL}|${TRY_FIX_ALTERNATIVE}|${TRY_FIX_METHOD}|${file_size}" >> "$fix_list"
                else
                  echo "修复失败: ${failed_line} - ${TRY_FIX_MESSAGE}" | tee -a "$LOG_FILENAME"
                  echo "${failed_line}|${file_size}|${TRY_FIX_MESSAGE}" >> "$fail_list"
                fi
              done < <(
                grep -E 'ERROR : .+: Failed to copy.*(405 Method Not Allowed|409 Conflict)' "$LAST_ATTEMPT_LOG" 2>/dev/null | \
                  sed -E 's/^.*ERROR : //; s/: Failed to copy.*$//' | sort -u
              )

              rm -f "$fix_log" 2>/dev/null || true
            fi

            SYNC_FAILED=0

            # 获取源端和目标端大小及文件数量（用 --json 获取文件数，更可靠）
            local source_size_human="未知"
            local dest_size_human="未知"
            local source_count="未知"
            local dest_count="未知"
            local count_info=""
            local size_output size_json

            size_output=$(rclone size "$source_path" 2>/dev/null || true)
            if [ -n "$size_output" ]; then
              source_size_human=$(echo "$size_output" | sed -n 's/^Total size:[[:space:]]*//p')
            fi
            size_json=$(rclone size "$source_path" --json 2>/dev/null || true)
            if [ -n "$size_json" ]; then
              source_count=$(echo "$size_json" | jq -r '.count // empty' 2>/dev/null || echo "")
              [ -z "$source_count" ] && source_count="未知"
            fi

            size_output=$(rclone size "$dest_path" 2>/dev/null || true)
            if [ -n "$size_output" ]; then
              dest_size_human=$(echo "$size_output" | sed -n 's/^Total size:[[:space:]]*//p')
            fi
            size_json=$(rclone size "$dest_path" --json 2>/dev/null || true)
            if [ -n "$size_json" ]; then
              dest_count=$(echo "$size_json" | jq -r '.count // empty' 2>/dev/null || echo "")
              [ -z "$dest_count" ] && dest_count="未知"
            fi

            # 始终显示文件数信息
            local diff_files_list=""
            if [[ "$source_count" =~ ^[0-9]+$ ]] && [[ "$dest_count" =~ ^[0-9]+$ ]]; then
              local diff=$((source_count - dest_count))
              if [ "$diff" -ne 0 ]; then
                count_info="文件数差异：${diff} (源端 ${source_count} / 目标 ${dest_count})"
                # 文件数不一致时，运行 rclone check 找出差异文件
                local check_combined
                check_combined=$(timeout 300 rclone check "$source_path" "$dest_path" --size-only "${extra_args[@]}" --combined - 2>/dev/null || true)
                local diff_count=0
                while IFS= read -r line; do
                  local marker="${line:0:1}"
                  local fpath="${line:2}"
                  case "$marker" in
                    +) diff_files_list+="• [源端有/目标缺失] ${fpath}"$'\n' ;;
                    -) diff_files_list+="• [目标多余/仅目标存在] ${fpath}"$'\n' ;;
                    '*') diff_files_list+="• [大小/内容不一致] ${fpath}"$'\n' ;;
                  esac
                  diff_count=$((diff_count + 1))
                  if [ "$diff_count" -ge 20 ]; then
                    diff_files_list+="... (更多差异文件省略)"$'\n'
                    break
                  fi
                done <<< "$(echo "$check_combined" | grep -E '^[-+*] ')"
              else
                count_info="文件数：${source_count} (一致)"
              fi
            else
              count_info="文件数：源端 ${source_count} / 目标 ${dest_count}"
            fi

            # 提取 --exclude 规则，方便在通知中说明
            local exclude_list=""
            local i
            for ((i=0; i<${#extra_args[@]}; i++)); do
              if [ "${extra_args[$i]}" == "--exclude" ] && [ $((i+1)) -lt ${#extra_args[@]} ]; then
                exclude_list+="• ${extra_args[$((i+1))]}"$'\n'
              fi
            done
            [ -z "$exclude_list" ] && exclude_list="无"

            # 构建 fix_summary（已修复文件：原始文件名 → 实际文件名）
            local fix_summary=""
            if [ -s "$fix_list" ]; then
              while IFS='|' read -r f_original f_alternative f_method f_size; do
                [ -z "$f_original" ] && continue
                if [ "$f_original" = "$f_alternative" ]; then
                  fix_summary+="• ${f_original} (${f_size}) — ${f_method}"$'\n'
                else
                  fix_summary+="• ${f_original} → ${f_alternative} (${f_size}, ${f_method})"$'\n'
                fi
              done < "$fix_list"
            fi
            [ -z "$fix_summary" ] && fix_summary="无"

            # 构建 fail_summary（无法修复的文件）
            local fail_summary=""
            if [ -s "$fail_list" ]; then
              while IFS='|' read -r fpath fsize fmsg; do
                [ -z "$fpath" ] && continue
                fail_summary+="• ${fpath} (${fsize}) — ${fmsg}"$'\n'
              done < "$fail_list"
            fi
            [ -z "$fail_summary" ] && fail_summary="无"

            # 解析本次同步传输的字节数
            SYNC_TRANSFERRED_BYTES=$(get_transferred_bytes_from_log "$LOG_FILENAME")
            SYNC_SKIPPED=0

            # 子目录拆分模式下，如果没有文件变更且无错误，跳过通知
            if [ "$SYNC_SKIP_QUIET" = "1" ] && [ ! -s "$fail_list" ] && [ ! -s "$fix_list" ]; then
              if ! grep -Eqi 'Copied|Deleted|Renamed|Moved' "$LOG_FILENAME" 2>/dev/null; then
                SYNC_SKIPPED=1
                echo "无文件变更，跳过通知 (SYNC_SKIP_QUIET=1, task=${task_name})"
                rm -f "$LOG_FILENAME" 2>/dev/null || true
                return 0
              fi
            fi

            if [ -s "$fail_list" ]; then
              # 有无法修复的 405/409 文件
              local partial_msg=""
              partial_msg+="⚠️ ${task_name} 部分文件同步失败"$'\n'
              partial_msg+='━━━━━━━━━━━━━━'$'\n'
              partial_msg+="源端大小：${source_size_human}"$'\n'
              partial_msg+="目标大小：${dest_size_human}"$'\n'
              partial_msg+="状态：OpenList 405/409 错误，部分文件无法同步"$'\n'
              partial_msg+="${count_info}"$'\n'
              [ -n "$AUTO_SPLIT_INFO" ] && partial_msg+="${AUTO_SPLIT_INFO}"$'\n'
              partial_msg+=$'\n'
              partial_msg+='📁 任务信息'$'\n'
              partial_msg+="• 任务：${task_name}"$'\n'
              partial_msg+="• 源端：${source_path}"$'\n'
              partial_msg+="• 目标：${dest_path}"$'\n'
              partial_msg+=$'\n'
              partial_msg+='🚫 排除规则'$'\n'
              partial_msg+="${exclude_list}"$'\n'
              partial_msg+=$'\n'
              partial_msg+='✅ 已通过其他方式同步（原始文件名 → 实际文件名）：'$'\n'
              partial_msg+="${fix_summary}"$'\n'
              partial_msg+=$'\n'
              partial_msg+='❌ 无法同步文件：'$'\n'
              partial_msg+="${fail_summary}"
              if [ -n "$diff_files_list" ]; then
                partial_msg+=$'\n\n'"📋 差异文件列表："$'\n'
                partial_msg+="$diff_files_list"
              fi

              curl -s -X POST https://api.telegram.org/bot'${{ secrets.TELEGRAM_BOT_TOKEN }}'/sendMessage \
                -d chat_id='${{ secrets.TELEGRAM_CHAT_ID }}' \
                --data-urlencode text="$partial_msg" || true

            elif [ -s "$fix_list" ]; then
              # 所有 405/409 文件都已通过其他方式同步
              local partial_msg=""
              partial_msg+="⚠️ ${task_name} 部分文件已通过其他方式同步"$'\n'
              partial_msg+='━━━━━━━━━━━━━━'$'\n'
              partial_msg+="源端大小：${source_size_human}"$'\n'
              partial_msg+="目标大小：${dest_size_human}"$'\n'
              partial_msg+="状态：405/409 文件已修复，但部分文件使用了其他方式同步"$'\n'
              partial_msg+="${count_info}"$'\n'
              [ -n "$AUTO_SPLIT_INFO" ] && partial_msg+="${AUTO_SPLIT_INFO}"$'\n'
              partial_msg+=$'\n'
              partial_msg+='📁 任务信息'$'\n'
              partial_msg+="• 任务：${task_name}"$'\n'
              partial_msg+="• 源端：${source_path}"$'\n'
              partial_msg+="• 目标：${dest_path}"$'\n'
              partial_msg+=$'\n'
              partial_msg+='🚫 排除规则'$'\n'
              partial_msg+="${exclude_list}"$'\n'
              partial_msg+=$'\n'
              partial_msg+='✅ 已通过其他方式同步（原始文件名 → 实际文件名）：'$'\n'
              partial_msg+="${fix_summary}"
              if [ -n "$diff_files_list" ]; then
                partial_msg+=$'\n\n'"📋 差异文件列表："$'\n'
                partial_msg+="$diff_files_list"
              fi

              curl -s -X POST https://api.telegram.org/bot'${{ secrets.TELEGRAM_BOT_TOKEN }}'/sendMessage \
                -d chat_id='${{ secrets.TELEGRAM_CHAT_ID }}' \
                --data-urlencode text="$partial_msg" || true

            elif [ "$SYNC_STATUS" -ne 0 ] || grep -Eqi '(^|[^[:alpha:]])(ERROR|Error|Failed|failed|timeout|forbidden|unauthorized|permission denied|connection refused)([^[:alpha:]]|$)' "$LAST_ATTEMPT_LOG"; then
              SYNC_FAILED=1
              send_log_to_telegram "$LOG_FILENAME" "$task_name" "$SYNC_STATUS" "sync" "$source_path" "$dest_path"
            else
              local ok_message
              if [ -n "$diff_files_list" ]; then
                printf -v ok_message '%s\n%s\n%s\n%s\n%s\n\n%s\n%s\n%s\n%s\n\n%s\n%s\n\n%s\n%s' \
                  "✅ ${task_name} 同步完成" \
                  '━━━━━━━━━━━━━━' \
                  "源端大小：${source_size_human}" \
                  "目标大小：${dest_size_human}" \
                  "$count_info" \
                  '📁 任务信息' \
                  "• 任务：${task_name}" \
                  "• 源端：${source_path}" \
                  "• 目标：${dest_path}" \
                  '🚫 排除规则' \
                  "$exclude_list" \
                  '📋 差异文件列表' \
                  "$diff_files_list"
              else
                printf -v ok_message '%s\n%s\n%s\n%s\n%s\n\n%s\n%s\n%s\n%s\n\n%s\n%s' \
                  "✅ ${task_name} 同步完成" \
                  '━━━━━━━━━━━━━━' \
                  "源端大小：${source_size_human}" \
                  "目标大小：${dest_size_human}" \
                  "$count_info" \
                  '📁 任务信息' \
                  "• 任务：${task_name}" \
                  "• 源端：${source_path}" \
                  "• 目标：${dest_path}" \
                  '🚫 排除规则' \
                  "$exclude_list"
              fi

              [ -n "$AUTO_SPLIT_INFO" ] && ok_message="${ok_message}"$'\n'"${AUTO_SPLIT_INFO}"

              curl -s -X POST https://api.telegram.org/bot'${{ secrets.TELEGRAM_BOT_TOKEN }}'/sendMessage \
                -d chat_id='${{ secrets.TELEGRAM_CHAT_ID }}' \
                --data-urlencode text="$ok_message" || true
            fi

            rm -f "$LOG_FILENAME" "$LAST_ATTEMPT_LOG" "$fail_list" "$fix_list" /tmp/probe_src.txt /tmp/probe_dst.txt 2>/dev/null || true
            return "$SYNC_FAILED"
          }

          openlist_sync_with_failure_split() {
            local source_path="$1"
            local dest_path="$2"
            local task_name="$3"
            shift 3
            local extra_args=("$@")
            local openlist_sync_args=()

            if sync_with_logging "$source_path" "$dest_path" "$task_name" "${openlist_sync_args[@]}" "${extra_args[@]}"; then
              return 0
            fi

            split_large_files_after_sync_failure "$source_path" "$task_name"
            return 0
          }
          EOF

      - name: Setup helper functions - part 7
        run: |
          cat > /tmp/functions_part7.sh << 'EOF'
          # 自动拆分同步：源端 > 50GB 时按一级子目录拆分，最后再完整同步一次
          sync_task_with_auto_split() {
            local source_path="$1"
            local dest_path="$2"
            local task_name="$3"
            shift 3
            local extra_args=("$@")

            local current_depth=${SYNC_AUTO_SPLIT_DEPTH:-0}
            local max_depth=3

            # 仅在顶层检查同步标记
            if [ "$current_depth" -eq 0 ]; then
              check_sync_marker "$source_path" "$dest_path" "$task_name"
              case "$MARKER_ACTION" in
                skip)
                  SYNC_SKIPPED=1
                  SYNC_FAILED=0
                  SYNC_TRANSFERRED_BYTES=0
                  return 0
                  ;;
                warning)
                  send_sync_warning "$task_name" "$source_path" "$dest_path"
                  SYNC_SKIPPED=1
                  SYNC_FAILED=1
                  SYNC_TRANSFERRED_BYTES=0
                  return 1
                  ;;
              esac
            fi

            # 50GB 阈值
            local threshold=50000000000

            # 检查源端大小
            local source_size_bytes=0
            local size_json
            size_json=$(rclone size "$source_path" --json 2>/dev/null || true)
            if [ -n "$size_json" ]; then
              source_size_bytes=$(echo "$size_json" | jq -r '.bytes // 0' 2>/dev/null || echo 0)
            fi

            if [ "$source_size_bytes" -le "$threshold" ]; then
              echo "源端大小 $(numfmt --to=iec-i --suffix=B "$source_size_bytes" 2>/dev/null || echo "${source_size_bytes}B") 未超过 50GB 阈值，直接同步"
              sync_with_logging "$source_path" "$dest_path" "$task_name" "${extra_args[@]}"
              # 顶层同步成功后保存标记
              if [ "$current_depth" -eq 0 ] && [ "$SYNC_FAILED" = "0" ]; then
                save_sync_marker "$source_path" "$dest_path" "$task_name"
              fi
              return $?
            fi

            # 超过 50GB，需要拆分
            if [ "$current_depth" -ge "$max_depth" ]; then
              echo "已达最大拆分深度 ${max_depth}，按文件批次拆分 (depth=${current_depth}, size=$(numfmt --to=iec-i --suffix=B "$source_size_bytes" 2>/dev/null || echo "${source_size_bytes}B"))"
              sync_dir_by_file_batches "$source_path" "$dest_path" "$task_name" "${extra_args[@]}"
              return $?
            fi

            echo "源端大小 $(numfmt --to=iec-i --suffix=B "$source_size_bytes" 2>/dev/null || echo "${source_size_bytes}B") 超过 50GB 阈值，按子目录拆分同步 (depth=${current_depth})"

            # 列出一级子目录
            local subdirs
            subdirs=$(rclone lsf --dirs-only "$source_path" 2>/dev/null | sed 's|/$||')
            if [ -z "$subdirs" ]; then
              echo "无子目录，按文件批次拆分同步"
              sync_dir_by_file_batches "$source_path" "$dest_path" "$task_name" "${extra_args[@]}"
              return $?
            fi

            # 从 extra_args 中提取排除的目录名（模式如 notion/** 或 /notion/**）
            local exclude_dir_list=""
            local i=0
            while [ $i -lt ${#extra_args[@]} ]; do
              if [ "${extra_args[$i]}" = "--exclude" ] && [ $((i+1)) -lt ${#extra_args[@]} ]; then
                local pattern="${extra_args[$((i+1))]}"
                if [[ "$pattern" == */** ]]; then
                  local dirname="${pattern#/}"
                  dirname="${dirname%/**}"
                  if [ -n "$dirname" ]; then
                    exclude_dir_list="${exclude_dir_list}${dirname}"$'\n'
                  fi
                fi
                i=$((i+2))
              else
                i=$((i+1))
              fi
            done

            # 过滤掉匹配排除规则的子目录
            if [ -n "$exclude_dir_list" ]; then
              local filtered_subdirs=""
              while IFS= read -r subdir; do
                [ -z "$subdir" ] && continue
                if echo "$exclude_dir_list" | grep -qxF "$subdir"; then
                  echo "跳过排除的子目录: ${subdir}"
                  continue
                fi
                if [ -z "$filtered_subdirs" ]; then
                  filtered_subdirs="$subdir"
                else
                  filtered_subdirs="${filtered_subdirs}"$'\n'"${subdir}"
                fi
              done <<< "$subdirs"
              subdirs="$filtered_subdirs"
              if [ -z "$subdirs" ]; then
                echo "所有子目录均被排除，直接执行完整同步"
                sync_with_logging "$source_path" "$dest_path" "$task_name" "${extra_args[@]}"
                return $?
              fi
            fi

            # 按子目录大小从小到大排序
            echo "按子目录大小排序..."
            local sorted_subdirs=""
            while IFS= read -r subdir; do
              [ -z "$subdir" ] && continue
              local subdir_bytes=0
              local subdir_json
              subdir_json=$(rclone size "${source_path}/${subdir}" --json 2>/dev/null || true)
              [ -n "$subdir_json" ] && subdir_bytes=$(echo "$subdir_json" | jq -r '.bytes // 0' 2>/dev/null || echo 0)
              echo "  ${subdir}: $(format_bytes "$subdir_bytes")"
              sorted_subdirs+="${subdir_bytes} ${subdir}"$'\n'
            done <<< "$subdirs"
            subdirs=$(echo "$sorted_subdirs" | sort -n | cut -d' ' -f2-)

            # 按子目录逐个同步（静默模式：无文件变更时跳过通知）
            SYNC_SKIP_QUIET=1
            local total_subtasks=0
            local synced_subtasks=0
            local failed_subtasks=0
            local skipped_subtasks=0
            local total_transferred=0
            local synced_list=""
            local failed_list=""
            local skipped_list=""
            while IFS= read -r subdir; do
              [ -z "$subdir" ] && continue
              total_subtasks=$((total_subtasks + 1))
              local safe_subtask="${task_name}_${subdir//\//_}"
              echo "=== 子目录同步: ${safe_subtask} ==="
              SYNC_AUTO_SPLIT_DEPTH=$((current_depth + 1))
              sync_task_with_auto_split "${source_path}/${subdir}" "${dest_path}/${subdir}" "${safe_subtask}" "${extra_args[@]}" || true
              SYNC_AUTO_SPLIT_DEPTH=$current_depth
              if [ "$SYNC_SKIPPED" = "1" ]; then
                skipped_subtasks=$((skipped_subtasks + 1))
                skipped_list+="• ${subdir}"$'\n'
              elif [ "$SYNC_FAILED" = "0" ]; then
                synced_subtasks=$((synced_subtasks + 1))
                total_transferred=$((total_transferred + SYNC_TRANSFERRED_BYTES))
                synced_list+="• ${subdir} ($(format_bytes "$SYNC_TRANSFERRED_BYTES"))"$'\n'
              else
                failed_subtasks=$((failed_subtasks + 1))
                total_transferred=$((total_transferred + SYNC_TRANSFERRED_BYTES))
                failed_list+="• ${subdir} ($(format_bytes "$SYNC_TRANSFERRED_BYTES"))"$'\n'
              fi
            done <<< "$subdirs"
            SYNC_SKIP_QUIET=0

            # 设置拆分信息供最终通知使用
            AUTO_SPLIT_INFO="🔀 子任务拆分统计"$'\n'
            AUTO_SPLIT_INFO+="• 总子目录数：${total_subtasks}"$'\n'
            AUTO_SPLIT_INFO+="• 已同步：${synced_subtasks}，未同步：${failed_subtasks}，已跳过：${skipped_subtasks}"$'\n'
            AUTO_SPLIT_INFO+="• 子任务传输总量：$(format_bytes "$total_transferred")"
            if [ -n "$synced_list" ]; then
              AUTO_SPLIT_INFO+=$'\n\n'"✅ 已同步的子目录："$'\n'"${synced_list%"$'\n'"}"
            fi
            if [ -n "$failed_list" ]; then
              AUTO_SPLIT_INFO+=$'\n\n'"❌ 未同步的子目录："$'\n'"${failed_list%"$'\n'"}"
            fi
            if [ -n "$skipped_list" ]; then
              AUTO_SPLIT_INFO+=$'\n\n'"⏭️ 已跳过的子目录（无文件变动）："$'\n'"${skipped_list%"$'\n'"}"
            fi

            # 最终完整同步（仅在顶层执行，正常通知）
            if [ "$current_depth" -eq 0 ]; then
              echo "=== 最终完整同步: ${task_name} ==="
              sync_with_logging "$source_path" "$dest_path" "$task_name" "${extra_args[@]}"
              AUTO_SPLIT_INFO=""
              # 顶层同步成功后保存标记
              if [ "$SYNC_FAILED" = "0" ]; then
                save_sync_marker "$source_path" "$dest_path" "$task_name"
              fi
            else
              SYNC_SKIPPED=0
              SYNC_FAILED=0
              SYNC_TRANSFERRED_BYTES=$total_transferred
            fi
          }
          EOF

      - name: Setup helper functions - part 8
        run: |
          cat > /tmp/functions_part8.sh << 'EOF'
          # 按文件批次拆分同步（用于无子目录的大文件夹）
          sync_dir_by_file_batches() {
            local source_path="$1"
            local dest_path="$2"
            local task_name="$3"
            shift 3
            local extra_args=("$@")

            local threshold=50000000000  # 50GB
            local batch_dir="/tmp/file_batches_${task_name}"
            mkdir -p "$batch_dir"

            echo "=== 按文件批次拆分: ${task_name} ==="

            # 递归列出所有文件（使用 lsjson，比 lsf --json 更可靠）
            local file_list_file="${batch_dir}/all_files.jsonl"
            echo "正在列出文件..."
            rclone lsjson --recursive --files-only --no-modtime --no-mimetype "$source_path" 2>&1 | jq -c '.[]' > "$file_list_file" 2>/dev/null

            local total_files
            total_files=$(wc -l < "$file_list_file" | tr -d ' ')
            echo "总文件数: ${total_files}"

            if [ "$total_files" -eq 0 ]; then
              echo "⚠️ 无文件列出，尝试 rclone lsf 备选方案..."
              # 备选：用 rclone lsf -l 获取文件列表和大小
              rclone lsf -l --files-only --recursive "$source_path" 2>&1 | \
                awk '{
                  size=$1
                  # 文件名是第5个字段之后的所有内容（文件名可能含空格）
                  for(i=5;i<=NF;i++) name = (i==5 ? $i : name " " $i)
                  if (name != "") printf "{\"size\":%s,\"path\":\"%s\"}\n", size, name
                }' > "$file_list_file" 2>/dev/null
              total_files=$(wc -l < "$file_list_file" | tr -d ' ')
              echo "备选方案文件数: ${total_files}"
            fi

            if [ "$total_files" -eq 0 ]; then
              echo "无文件可同步"
              SYNC_SKIPPED=1
              SYNC_FAILED=0
              SYNC_TRANSFERRED_BYTES=0
              rm -rf "$batch_dir"
              return 0
            fi

            # 按大小拆分为 ~50GB 的批次
            local batch_num=0
            local batch_size=0
            local batch_file="${batch_dir}/batch_${batch_num}.txt"
            > "$batch_file"

            while IFS= read -r line; do
              local size fpath
              # lsjson 用 .size 和 .path (小写)，lsf --json 用 .Size 和 .Path (大写)
              size=$(echo "$line" | jq -r '(.size // .Size // 0)')
              fpath=$(echo "$line" | jq -r '(.path // .Path // empty)')
              [ -z "$fpath" ] && continue

              # 当前批次加此文件超阈值则开新批次
              if [ "$batch_size" -gt 0 ] && [ $((batch_size + size)) -gt "$threshold" ]; then
                batch_num=$((batch_num + 1))
                batch_file="${batch_dir}/batch_${batch_num}.txt"
                > "$batch_file"
                batch_size=0
              fi

              echo "$fpath" >> "$batch_file"
              batch_size=$((batch_size + size))
            done < "$file_list_file"

            local total_batches=$((batch_num + 1))
            echo "拆分为 ${total_batches} 个批次"

            # 逐批同步（rclone copy + --files-from）
            local synced_batches=0
            local failed_batches=0

            for i in $(seq 0 $batch_num); do
              local bf="${batch_dir}/batch_${i}.txt"
              if [ -s "$bf" ]; then
                local batch_file_count
                batch_file_count=$(wc -l < "$bf" | tr -d ' ')
                echo "=== 批次 $((i+1))/${total_batches}: ${batch_file_count} 个文件 ==="

                rclone copy "$source_path" "$dest_path" \
                  --files-from "$bf" \
                  --size-only \
                  --no-traverse \
                  --retries 1 \
                  --low-level-retries 3 \
                  --timeout 5m \
                  --contimeout 30s \
                  --ignore-errors \
                  --progress \
                  --stats 15s \
                  --stats-one-line \
                  --verbose \
                  "${extra_args[@]}" \
                  2>&1 | tee "${task_name}_batch_${i}.log"

                local rc=${PIPESTATUS[0]}
                if [ "$rc" -eq 0 ]; then
                  synced_batches=$((synced_batches + 1))
                elif [ "$rc" -eq 4 ]; then
                  # exit code 4 = 部分文件失败，大部分成功
                  synced_batches=$((synced_batches + 1))
                  local err_count
                  err_count=$(grep -c 'ERROR.*object not found' "${task_name}_batch_${i}.log" 2>/dev/null || echo 0)
                  echo "批次 $((i+1)) 部分成功 (exit=4, ${err_count} 个文件 object not found)"
                  grep 'ERROR.*object not found' "${task_name}_batch_${i}.log" 2>/dev/null | head -50 | while IFS= read -r line; do
                    echo "  ${line}"
                  done
                else
                  failed_batches=$((failed_batches + 1))
                  echo "批次 $((i+1)) 失败 (exit=${rc})"
                fi
              fi
            done

            # 清理批次文件
            rm -rf "$batch_dir"

            echo "=== 批次传输完成 (成功 ${synced_batches}/${total_batches}, 失败 ${failed_batches})，执行最终同步检查 ==="

            # 最终用 sync_with_logging 做完整同步检查（处理 405/409、通知等）
            sync_with_logging "$source_path" "$dest_path" "$task_name" "${extra_args[@]}"
          }
          EOF

      - name: Setup helper functions - part 9
        run: |
          cat > /tmp/functions_part9.sh << 'EOF'
          # ===== 同步标记系统 =====
          # 标记存储路径: onedrive:/logs/sync_state/
          SYNC_STATE_DIR="onedrive:/logs/sync_state"
          SYNC_SKIP_SECONDS=$((24 * 60 * 60))

          # 生成标记文件路径（每个 task+dest 唯一）
          get_marker_path() {
            local task_name="$1"
            local dest_path="$2"
            local dest_hash
            dest_hash=$(echo -n "${task_name}_${dest_path}" | md5sum | cut -c1-8)
            echo "${SYNC_STATE_DIR}/${task_name}_${dest_hash}.json"
          }

          # 保存同步标记（同步成功后调用）
          save_sync_marker() {
            local source_path="$1"
            local dest_path="$2"
            local task_name="$3"

            local marker_path
            marker_path=$(get_marker_path "$task_name" "$dest_path")

            # 获取源端大小和文件数
            local size_json source_bytes source_count
            size_json=$(rclone size "$source_path" --json 2>/dev/null || true)
            source_bytes=$(echo "$size_json" | jq -r '.bytes // 0' 2>/dev/null || echo 0)
            source_count=$(echo "$size_json" | jq -r '.count // 0' 2>/dev/null || echo 0)

            # 获取顶层目录列表
            local top_dirs
            top_dirs=$(rclone lsf --dirs-only "$source_path" 2>/dev/null | sed 's|/$||' | sort)

            # 构建 JSON 标记
            local marker_json
            marker_json=$(jq -n \
              --arg last_success "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg source_path "$source_path" \
              --arg dest_path "$dest_path" \
              --argjson source_bytes "$source_bytes" \
              --argjson source_count "$source_count" \
              --arg top_dirs "$top_dirs" \
              '{last_success: $last_success, source_path: $source_path, dest_path: $dest_path, source_bytes: $source_bytes, source_count: $source_count, top_dirs: $top_dirs}')

            # 上传标记到 OneDrive
            rclone mkdir "$SYNC_STATE_DIR" >/dev/null 2>&1 || true
            echo "$marker_json" | rclone rcat "$marker_path" 2>/dev/null
            echo "已保存同步标记: $marker_path (源端 $(format_bytes "$source_bytes"), $source_count 文件)"
          }

          # 检查同步标记（同步前调用）
          # 设置全局变量: MARKER_ACTION ("skip" | "warning" | "proceed")
          # MARKER_JSON, MARKER_CURRENT_BYTES, MARKER_CURRENT_COUNT, MARKER_CURRENT_DIRS
          check_sync_marker() {
            local source_path="$1"
            local dest_path="$2"
            local task_name="$3"

            MARKER_ACTION="proceed"
            MARKER_JSON=""
            MARKER_CURRENT_BYTES=0
            MARKER_CURRENT_COUNT=0
            MARKER_CURRENT_DIRS=""

            # 强制同步跳过所有检查
            if [ "$FORCE_SYNC" = "true" ]; then
              echo "强制同步模式，跳过标记检查"
              return 0
            fi

            local marker_path
            marker_path=$(get_marker_path "$task_name" "$dest_path")

            # 下载标记
            local marker_json
            marker_json=$(rclone cat "$marker_path" 2>/dev/null) || true

            if [ -z "$marker_json" ]; then
              echo "无同步标记，继续同步"
              return 0
            fi

            MARKER_JSON="$marker_json"

            # 解析上次成功时间
            local last_success
            last_success=$(echo "$marker_json" | jq -r '.last_success // ""')

            if [ -z "$last_success" ]; then
              echo "标记无时间戳，继续同步"
              return 0
            fi

            # 检查是否 < 24h
            local now_epoch last_epoch diff
            now_epoch=$(date +%s)
            last_epoch=$(date -d "$last_success" +%s 2>/dev/null || echo 0)

            if [ "$last_epoch" -gt 0 ]; then
              diff=$((now_epoch - last_epoch))
              if [ "$diff" -lt "$SYNC_SKIP_SECONDS" ]; then
                echo "1天内已成功同步（距今 $((diff / 3600)) 小时），跳过"
                MARKER_ACTION="skip"
                return 0
              fi
            fi

            # 检查源端大小是否减小
            local marker_bytes
            marker_bytes=$(echo "$marker_json" | jq -r '.source_bytes // 0')

            local current_size_json
            current_size_json=$(rclone size "$source_path" --json 2>/dev/null || true)
            MARKER_CURRENT_BYTES=$(echo "$current_size_json" | jq -r '.bytes // 0' 2>/dev/null || echo 0)
            MARKER_CURRENT_COUNT=$(echo "$current_size_json" | jq -r '.count // 0' 2>/dev/null || echo 0)
            MARKER_CURRENT_DIRS=$(rclone lsf --dirs-only "$source_path" 2>/dev/null | sed 's|/$||' | sort)

            if [ "$MARKER_CURRENT_BYTES" -lt "$marker_bytes" ]; then
              echo "⚠️ 源端大小减小: $(format_bytes "$marker_bytes") → $(format_bytes "$MARKER_CURRENT_BYTES")"
              MARKER_ACTION="warning"
              return 0
            fi

            echo "标记检查通过，继续同步"
            MARKER_ACTION="proceed"
            return 0
          }

          # 发送源端大小减小的警告通知
          send_sync_warning() {
            local task_name="$1"
            local source_path="$2"
            local dest_path="$3"

            local marker_bytes marker_count marker_dirs
            marker_bytes=$(echo "$MARKER_JSON" | jq -r '.source_bytes // 0')
            marker_count=$(echo "$MARKER_JSON" | jq -r '.source_count // 0')
            marker_dirs=$(echo "$MARKER_JSON" | jq -r '.top_dirs // ""')

            local diff_bytes=$((marker_bytes - MARKER_CURRENT_BYTES))
            local diff_count=$((marker_count - MARKER_CURRENT_COUNT))
            local pct=0
            if [ "$marker_bytes" -gt 0 ]; then
              pct=$((diff_bytes * 100 / marker_bytes))
            fi

            # 找出缺失和新增的目录
            local missing_dirs="" new_dirs=""
            if [ -n "$marker_dirs" ] && [ -n "$MARKER_CURRENT_DIRS" ]; then
              missing_dirs=$(comm -23 <(echo "$marker_dirs") <(echo "$MARKER_CURRENT_DIRS") 2>/dev/null || true)
              new_dirs=$(comm -13 <(echo "$marker_dirs") <(echo "$MARKER_CURRENT_DIRS") 2>/dev/null || true)
            fi

            local msg="⚠️ ${task_name} 源端大小异常减小"$'\n'
            msg+="━━━━━━━━━━━━━━"$'\n'
            msg+="任务：${task_name}"$'\n'
            msg+="源端：${source_path}"$'\n'
            msg+="目标：${dest_path}"$'\n'
            msg+=$'\n'"📊 大小对比"$'\n'
            msg+="• 上次记录：$(format_bytes "$marker_bytes") (${marker_count} 文件)"$'\n'
            msg+="• 当前大小：$(format_bytes "$MARKER_CURRENT_BYTES") (${MARKER_CURRENT_COUNT} 文件)"$'\n'
            msg+="• 减少：$(format_bytes "$diff_bytes") (-${pct}%)"$'\n'
            if [ "$diff_count" -ne 0 ]; then
              msg+="• 文件减少：${diff_count} 个"$'\n'
            fi

            if [ -n "$missing_dirs" ]; then
              msg+=$'\n'"📁 缺失的目录（可能被删除）"$'\n'
              while IFS= read -r d; do
                [ -n "$d" ] && msg+="• ${d}"$'\n'
              done <<< "$missing_dirs"
            fi

            if [ -n "$new_dirs" ]; then
              msg+=$'\n'"📁 新增的目录"$'\n'
              while IFS= read -r d; do
                [ -n "$d" ] && msg+="• ${d}"$'\n'
              done <<< "$new_dirs"
            fi

            msg+=$'\n'"⏸️ 已跳过同步（源端大小减小）"$'\n'
            msg+="如确认无误，请手动触发 force_sync=true"

            send_telegram "$msg"
          }
          EOF

      - name: Combine all functions
        run: |
          cat /tmp/functions_part1.sh /tmp/functions_part2.sh /tmp/functions_part3.sh /tmp/functions_part4.sh /tmp/functions_part5.sh /tmp/functions_part6.sh /tmp/functions_part7.sh /tmp/functions_part8.sh /tmp/functions_part9.sh > /tmp/functions.sh
          rm -f /tmp/functions_part*.sh

      - name: Initialize sync
        run: |
          source /tmp/functions.sh
          PROCESSED_FILES_LOG="processed_videos.log"
          SYNC_SKIP_QUIET=0
          SYNC_SKIPPED=0
          SYNC_FAILED=0
          SYNC_TRANSFERRED_BYTES=0
          AUTO_SPLIT_INFO=""
          SYNC_AUTO_SPLIT_DEPTH=0
          echo "PROCESSED_FILES_LOG=$PROCESSED_FILES_LOG" >> "$GITHUB_ENV"
          echo "=== 初始化已处理文件日志 ===" > "$PROCESSED_FILES_LOG"
          echo "开始时间: $(date)" >> "$PROCESSED_FILES_LOG"
          echo "==========================" >> "$PROCESSED_FILES_LOG"

      # - name: List source files larger than OpenList threshold before sync
      #   run: |
      #     LARGE_FILE_THRESHOLD=4000000000
      #     LARGE_FILE_THRESHOLD_HUMAN="$(numfmt --to=iec-i --suffix=B "$LARGE_FILE_THRESHOLD" 2>/dev/null || echo "${LARGE_FILE_THRESHOLD}B")"

      #     list_large_files() {
      #       local remote_path="$1"
      #       local label="$2"

      #       echo "========================================"
      #       echo "检查源目录：$label ($remote_path)"
      #       echo "列出大于 OpenList 预处理阈值的文件：${LARGE_FILE_THRESHOLD_HUMAN}"

      #       local result
      #       result=$(rclone lsjson "$remote_path"               --recursive               --files-only 2>/dev/null |               jq -r --argjson threshold "$LARGE_FILE_THRESHOLD" '
      #           .[]
      #           | select((.Size // 0) > $threshold)
      #           | "- \(.Path) (\((.Size / 1024 / 1024 / 1024 * 100 | round) / 100) GiB)"
      #         ')

      #       if [ -n "$result" ]; then
      #         echo "$result"
      #       else
      #         echo "- 未发现大于预处理阈值的文件"
      #       fi
      #     }

      #     list_large_files "onedrive:backup" "backup"
      #     list_large_files "onedrive:0" "0"
      #     list_large_files "onedrive:1" "1"
      #     list_large_files "onedrive:2" "2"
      #     list_large_files "onedrive:3" "3"

      - name: Configure Google Drive sync limits
        run: |
          cat >> /tmp/functions.sh << 'EOF'
          # Let rclone use its provider defaults for sync concurrency,
          # chunking, pacing, retries and timeouts. Keep this array so task
          # calls can still pass explicit overrides when needed.
          GD_SYNC_ARGS=()

          gd_sync_with_1d_skip() {
            local source_path="$1"
            local dest_path="$2"
            local task_name="$3"
            shift 3
            local extra_args=("$@")

            # 使用统一标记系统检查
            check_sync_marker "$source_path" "$dest_path" "${task_name}_gd"

            case "$MARKER_ACTION" in
              skip)
                echo "跳过 ${task_name} GD: 1天内已成功同步"
                return 0
                ;;
              warning)
                send_sync_warning "${task_name} GD" "$source_path" "$dest_path"
                return 1
                ;;
            esac

            echo "执行 ${task_name} GD 同步"

            local TIMESTAMP
            local LOG_FILENAME
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            LOG_FILENAME="${task_name}_gd_sync_${TIMESTAMP}.log"
            LAST_GD_ATTEMPT_LOG="${LOG_FILENAME}.last"

            run_gd_sync_once() {
              local attempt_label="$1"
              shift
              local attempt_args=("$@")

              echo "=== ${task_name} ${attempt_label} ===" | tee -a "$LOG_FILENAME"
              echo "GD sync args: ${attempt_args[*]}" | tee -a "$LOG_FILENAME"
              : > "$LAST_GD_ATTEMPT_LOG"

              set +e
              rclone sync "$source_path" "$dest_path" \
                "${attempt_args[@]}" \
                --progress \
                --stats 15s \
                --stats-one-line \
                --ignore-errors \
                --verbose \
                --retries 1 \
                2>&1 | tee "$LAST_GD_ATTEMPT_LOG"
              local status=${PIPESTATUS[0]}
              set -e

              cat "$LAST_GD_ATTEMPT_LOG" >> "$LOG_FILENAME"
              return "$status"
            }

            : > "$LOG_FILENAME"
            local SYNC_STATUS=0
            run_gd_sync_once "initial sync" "${extra_args[@]}" || SYNC_STATUS=$?

            # 获取源端和目标端大小及文件数量
            local gd_src_size="未知"
            local gd_dst_size="未知"
            local gd_src_count="未知"
            local gd_dst_count="未知"
            local gd_count_info=""
            local gd_diff_files_list=""
            local gd_size_out gd_size_json

            gd_size_out=$(rclone size "$source_path" 2>/dev/null || true)
            if [ -n "$gd_size_out" ]; then
              gd_src_size=$(echo "$gd_size_out" | sed -n 's/^Total size:[[:space:]]*//p')
            fi
            gd_size_json=$(rclone size "$source_path" --json 2>/dev/null || true)
            if [ -n "$gd_size_json" ]; then
              gd_src_count=$(echo "$gd_size_json" | jq -r '.count // empty' 2>/dev/null || echo "")
              [ -z "$gd_src_count" ] && gd_src_count="未知"
            fi

            gd_size_out=$(rclone size "$dest_path" 2>/dev/null || true)
            if [ -n "$gd_size_out" ]; then
              gd_dst_size=$(echo "$gd_size_out" | sed -n 's/^Total size:[[:space:]]*//p')
            fi
            gd_size_json=$(rclone size "$dest_path" --json 2>/dev/null || true)
            if [ -n "$gd_size_json" ]; then
              gd_dst_count=$(echo "$gd_size_json" | jq -r '.count // empty' 2>/dev/null || echo "")
              [ -z "$gd_dst_count" ] && gd_dst_count="未知"
            fi

            if [[ "$gd_src_count" =~ ^[0-9]+$ ]] && [[ "$gd_dst_count" =~ ^[0-9]+$ ]]; then
              local gd_diff=$((gd_src_count - gd_dst_count))
              if [ "$gd_diff" -ne 0 ]; then
                gd_count_info="文件数差异：${gd_diff} (源端 ${gd_src_count} / 目标 ${gd_dst_count})"
                # 文件数不一致时，运行 rclone check 找出差异文件
                local gd_check_combined
                gd_check_combined=$(timeout 300 rclone check "$source_path" "$dest_path" --size-only "${extra_args[@]}" --combined - 2>/dev/null || true)
                local gd_diff_count=0
                while IFS= read -r line; do
                  local marker="${line:0:1}"
                  local fpath="${line:2}"
                  case "$marker" in
                    +) gd_diff_files_list+="• [源端有/目标缺失] ${fpath}"$'\n' ;;
                    -) gd_diff_files_list+="• [目标多余/仅目标存在] ${fpath}"$'\n' ;;
                    '*') gd_diff_files_list+="• [大小/内容不一致] ${fpath}"$'\n' ;;
                  esac
                  gd_diff_count=$((gd_diff_count + 1))
                  if [ "$gd_diff_count" -ge 20 ]; then
                    gd_diff_files_list+="... (更多差异文件省略)"$'\n'
                    break
                  fi
                done <<< "$(echo "$gd_check_combined" | grep -E '^[-+*] ')"
              else
                gd_count_info="文件数：${gd_src_count} (一致)"
              fi
            else
              gd_count_info="文件数：源端 ${gd_src_count} / 目标 ${gd_dst_count}"
            fi

            # 提取 --exclude 规则，方便在通知中说明
            local gd_exclude_list=""
            local i
            for ((i=0; i<${#extra_args[@]}; i++)); do
              if [ "${extra_args[$i]}" == "--exclude" ] && [ $((i+1)) -lt ${#extra_args[@]} ]; then
                gd_exclude_list+="• ${extra_args[$((i+1))]}"$'\n'
              fi
            done
            [ -z "$gd_exclude_list" ] && gd_exclude_list="无"

            if grep -Eqi 'storageQuotaExceeded|storage quota has been exceeded' "$LAST_GD_ATTEMPT_LOG"; then
              # Google Drive 存储配额超限，跳过同步，发送通知，不阻止后续 task
              local quota_msg
              printf -v quota_msg '%s\n%s\n%s\n%s\n%s\n%s\n\n%s\n%s\n%s\n%s\n\n%s\n%s' \
                "⚠️ ${task_name} Google Drive 存储配额超限" \
                '━━━━━━━━━━━━━━' \
                "源端大小：${gd_src_size}" \
                "目标大小：${gd_dst_size}" \
                "状态：配额超限，跳过本次同步" \
                "$gd_count_info" \
                '📁 任务信息' \
                "• 任务：${task_name}" \
                "• 源端：${source_path}" \
                "• 目标：${dest_path}" \
                '🚫 排除规则' \
                "$gd_exclude_list"

              curl -s -X POST https://api.telegram.org/bot'${{ secrets.TELEGRAM_BOT_TOKEN }}'/sendMessage \
                -d chat_id='${{ secrets.TELEGRAM_CHAT_ID }}' \
                --data-urlencode text="$quota_msg" || true
            elif [ "$SYNC_STATUS" -ne 0 ] || grep -Eqi '403|forbidden|rateLimitExceeded|userRateLimitExceeded|dailyLimitExceeded|ERROR|Failed|timeout|unauthorized|permission denied|connection refused|upload chunks may be taking too long' "$LAST_GD_ATTEMPT_LOG"; then
              send_log_to_telegram "$LOG_FILENAME" "$task_name" "$SYNC_STATUS" "gd-sync" "$source_path" "$dest_path"
              process_failed_videos "$LOG_FILENAME" "onedrive" "$task_name" || true
            else
              save_sync_marker "$source_path" "$dest_path" "${task_name}_gd"

              local ok_message
              if [ -n "$gd_diff_files_list" ]; then
                printf -v ok_message '%s\n%s\n%s\n%s\n%s\n%s\n\n%s\n%s\n%s\n%s\n\n%s\n%s\n\n%s\n%s' \
                  "✅ ${task_name} Google Drive sync 完成" \
