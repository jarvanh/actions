# 备份文件到 openlist 中的网盘
# 脚本架构、模块划分、环境变量与命名约定见仓库根 README.md 的「OpenList 同步子系统」
name: openlist

on:
  workflow_dispatch:
    inputs:
      # ===== 运行模式（单选下拉，互斥）=====
      # 取代旧的 3 个 boolean（fix_test_mode / restore_fixed / restore_to_source），
      # 从 UI 上杜绝多开关误组合; ⚠️ 开头的项为还原类危险操作，排在末尾
      run_mode:
        description: "▶️ 运行模式（单选互斥）。⚠️ 标记的三项为危险操作: 会改写目标端或回传/删改源端，运行前请核对下方 restore_task 任务名"
        required: true
        type: choice
        default: "同步"
        options:
          - "同步"
          - "调试 · 修复管线测试"
          - "⚠️ 还原 · 修复文件还原为原路径"
          - "⚠️ 灾难恢复 · 目标端→源端"
          - "⚠️ 灾难恢复 · 目标端→源端（删除源端多余文件）"
      # ===== 同步模式选项（force_sync 同时作用于调试·修复管线测试）=====
      force_sync:
        description: "同步/调试模式: 强制同步（忽略跳过天数与源端缩小警告，始终执行）"
        required: false
        type: boolean
        default: false
      split_on_sync_failure:
        description: "同步模式: 失败后切割超阈值大文件（默认关闭; 关闭时日志的『跳过切割』提示仅为开关状态通知，不代表同步失败）"
        required: false
        type: boolean
        default: false
      skip_preview:
        description: "同步模式: 跳过任务预览通知（直接开始同步）"
        required: false
        type: boolean
        default: false
      # ===== 调试模式选项 =====
      fix_test_task:
        description: "调试模式: 要测试的任务 id（如 backup、task0；带后缀的变体如 task0-baidupan，完整清单见 task_engine.sh SYNC_TASK_REGISTRY）"
        required: false
        type: string
        default: "backup"
      fix_test_max:
        description: "调试模式: 单次修复数量上限（快速验证用）"
        required: false
        type: number
        default: 5
      # ===== 还原类模式选项（危险）=====
      restore_task:
        description: "⚠️ 还原/灾难恢复模式专用: 任务名（backup/task0-task5，即 marker 文件名前缀）或 all"
        required: false
        type: string
        default: "all"
  schedule:
    - cron: "*/5 * * * *"
  watch:
    types: started

jobs:
  build:
    env:
      OPENLIST_SPLIT_ON_SYNC_FAILURE: ${{ inputs.split_on_sync_failure || 'false' }}
      FORCE_SYNC: ${{ inputs.force_sync || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ===== 集中阈值定义（避免魔数散落各处）=====
      # 字节大小阈值
      LARGE_FILE_THRESHOLD_BYTES: "4000000000"
      SYNC_SPLIT_THRESHOLD_BYTES: "20000000000"
      OPENLIST_SPLIT_PART_BYTES: "1073741824"
      OPENLIST_MAX_PART_SIZE: "4000000000"
      OPENLIST_TARGET_PART_SIZE: "3980000000"
      OPENLIST_7Z_VOLUME_SIZE: "3810m"
      OPENLIST_MAX_SPLIT_ATTEMPTS: "4"
      OPENLIST_ERR_LOG_MAX_BYTES: "50000000"

      # 超时时间（秒）
      OPENLIST_PROBE_TIMEOUT: "15"
      OPENLIST_CACHE_REFRESH_WAIT: "60"
      # 注: 驱动初始化等待 120s 硬编码在 openlist_api.sh wait_openlist_ready 阶段3，未参数化
      OPENLIST_RCLONE_LISTING_TIMEOUT: "900"
      OPENLIST_MKDIR_TIMEOUT: "120"
      OPENLIST_DOWNLOAD_TIMEOUT: "300"
      OPENLIST_UPLOAD_TIMEOUT: "300"

      # 重试/轮询
      # 注: 熔断阈值实际生效变量是 OPENLIST_FIX_CB_FILES（sync_engine.sh，默认3）；
      #     轮转上限实际生效变量是 ROTATION_MAX_CONSECUTIVE_ATTEMPTS（task_engine.sh，默认8）
      OPENLIST_8005_RETRY_ATTEMPTS: "3"
      OPENLIST_423_RETRY_ATTEMPTS: "3"
      OPENLIST_423_RETRY_SLEEP_SECONDS: "300"
      OPENLIST_PERSIST_RETRY_ROUNDS: "11"
      OPENLIST_RAW_CHECK_BUDGET: "40"
      OPENLIST_RAW_COUNT_TIMEOUT: "240"
      OPENLIST_MISSING_FIX_MAX: "200"
      OPENLIST_TOKEN_REFRESH_SECS: "240"

      # OpenList 管理面账密（动态登录换取 token，取代静态 config.json token）
      OPENLIST_ADMIN_PASSWORD: ${{ secrets.OPENLIST_ADMIN_PASSWORD }}

      # 并发参数
      OPENLIST_TRANSFERS: "1"
      OPENLIST_CHECKERS: "8"
    concurrency: openlist-singleton
    runs-on: ubuntu-latest
    steps:
      # 检出仓库，使 .github/scripts/openlist/ 下的脚本文件可用
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: 安装 rclone（GitHub Releases 直下，失败回退 rclone.org 脚本）
        run: |
          set -e
          RVER=v1.71.2
          if curl -fsSL --retry 2 --retry-delay 5 --connect-timeout 30 --max-time 300 \
              -o /tmp/rclone.deb \
              "https://github.com/rclone/rclone/releases/download/${RVER}/rclone-${RVER}-linux-amd64.deb"; then
            sudo dpkg -i /tmp/rclone.deb
          else
            echo "GitHub Releases 下载失败，回退 rclone.org 安装脚本"
            curl -fsSL https://rclone.org/install.sh | sudo bash
          fi
          rclone version | head -2

      - name: 写入 rclone 配置（含密钥掩码）
        env:
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE }}
        run: |
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG_SECRET
          EOF

          # 在 rclone 命令可能打印配置详情前，掩码配置中的嵌套密钥
          python3 "$GITHUB_WORKSPACE/.github/scripts/openlist/mask_rclone_config.py"
      - name: 验证远端连通并挂载 Dropbox
        run: |
          echo "==========onedrive==========="
          rclone lsf onedrive:
          echo "==========dropbox==========="
          rclone lsf dropbox:

          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo mkdir -p /dropbox
          # 后台挂载 Dropbox（openlist 配置/凭据等静态数据走该挂载）
          sudo nohup rclone mount dropbox: /dropbox --no-gzip-encoding --umask 000 --allow-other --attr-timeout 10m --vfs-cache-mode full --vfs-cache-max-age 5m --vfs-read-chunk-size-limit 10G --buffer-size 100M --vfs-cache-max-size 10G &

      - name: 拉起 OpenList 容器（数据库本地化）
        run: |
          sudo docker rm -f openlist 2>/dev/null || true
          # 数据库本地化: SQLite 不能直接运行在 rclone FUSE 上，
          # 因此启动时先拉取数据库至本地并排除了会导致撕裂快照的文件，
          # 随后的周期热备及会话结束都会回传同步此数据库。
          sudo mkdir -p /opt/openlist-data
          sudo chmod 0777 /opt/openlist-data
          rclone copy dropbox:self-hosted/openlist/data /opt/openlist-data \
            --exclude "data.db-wal" --exclude "data.db-shm" --exclude "data.db-journal" \
            --exclude "log/**" --exclude "temp/**"
          echo "拉取完成: $(ls -la /opt/openlist-data/ | tail -n +2 | wc -l) 个条目"
          # 记录拉取时 db 指纹（回传前对比: 未变化则跳过回传，
          # 避免极端并发场景下用过期副本覆盖远端新配置）
          OPENLIST_DB_MD5_PULL=$(md5sum /opt/openlist-data/data.db 2>/dev/null | awk '{print $1}')
          OPENLIST_DB_MD5_PULL="${OPENLIST_DB_MD5_PULL:-none}"
          echo "OPENLIST_DB_MD5_PULL=$OPENLIST_DB_MD5_PULL" >> "$GITHUB_ENV"
          echo "db 拉取指纹: $OPENLIST_DB_MD5_PULL"
          sudo docker run -d --restart=unless-stopped -v /opt/openlist-data:/opt/openlist/data -p 5244:5244 -e PUID=0 -e PGID=0 -e UMASK=022 --name="openlist" openlistteam/openlist:latest

      - name: 校验 OpenList 容器运行状态
        run: |
          # 依赖 openlist_api.sh 的 wait_openlist_ready 检查 OpenList 就绪状态；
          # 走 load_all.sh 统一入口，避免函数库再拆分时此处漏改
          source "$GITHUB_WORKSPACE/.github/scripts/openlist/load_all.sh"
          echo "等待 OpenList 就绪..."
          if wait_openlist_ready; then
            echo "✅ OpenList 容器及 HTTP 服务正常就绪"
          else
            echo "❌ OpenList 容器未能就绪"
            exit 1
          fi

      - name: 安装 cloudflared 并载入隧道凭据
        run: |
          sudo mkdir -p ~/.cloudflared
          sudo rclone copy dropbox:self-hosted/.cloudflared ~/.cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      # 隧道状态守卫:
      #   - 隧道不存在        → 终止（需先手动创建: cloudflared tunnel create openlist）
      #   - 隧道存在但无连接  → 本实例接管，继续执行
      #   - 隧道已有活跃连接  → 其他实例正在服务，终止本次运行避免两端争写同一份数据
      - name: 检查 Cloudflare 隧道状态
        env:
          TUNNEL_NAME: "openlist"
        run: |
          OUTPUT=$(cloudflared tunnel list)
          TUNNEL_LINE=$(echo "$OUTPUT" | grep -w "$TUNNEL_NAME")
          if [ -z "$TUNNEL_LINE" ]; then
            echo "隧道 '${TUNNEL_NAME}' 不存在，请先手动创建（cloudflared tunnel create ${TUNNEL_NAME}），终止本次运行"
            exit 31
          fi

          CONNECTIONS=$(echo "$TUNNEL_LINE" | awk '{if (NF>=4) print $4; else print "-"}')
          if [ "$CONNECTIONS" = "-" ]; then
            echo "隧道 '$TUNNEL_NAME' 存在但无活跃连接，继续执行"
          else
            echo "隧道 '$TUNNEL_NAME' 已有 ${CONNECTIONS} 个活跃连接（其他实例正在服务），终止本次运行"
            exit 1
          fi

      - name: 启动 Cloudflare 隧道
        run: |
          # DNS 路由只需创建一次；检查是否已解析到该隧道，避免重复 API 调用
          if ! dig +short openlist.'${{ secrets.VD }}'.eu.org | grep -q .; then
            cloudflared tunnel route dns openlist openlist.'${{ secrets.VD }}'.eu.org
          else
            echo "DNS 路由已存在，跳过 cloudflared tunnel route dns"
          fi
          nohup cloudflared tunnel run --url http://127.0.0.1:5244 openlist &

      - name: 安装同步依赖（ffmpeg/jq 等）
        run: |
          sudo apt-get install -y ffmpeg jq coreutils bc p7zip-full

      # ===== 加载函数库 =====
      # 所有同步相关函数已提取到 .github/scripts/openlist/ 目录下的脚本文件中。
      # 修改函数逻辑请编辑对应脚本文件；修改任务定义请编辑 task_engine.sh 的 SYNC_TASK_REGISTRY，rclone 参数请编辑 rclone_flags.sh。
      - name: 加载同步函数库
        run: |
          echo "加载 OpenList 同步函数库..."
          source "$GITHUB_WORKSPACE/.github/scripts/openlist/load_all.sh"
          # 将函数库复制到 /tmp 以便后续 step 使用（每个 step 是独立 shell）
          # *.py: save_sync_marker 的 fallback 扫描（scan_fix_signatures.py）
          # *.jq: fix_list 序列化的修复方式分类程序（restore_info.jq）
          cp "$GITHUB_WORKSPACE/.github/scripts/openlist/"*.sh "$GITHUB_WORKSPACE/.github/scripts/openlist/"*.py "$GITHUB_WORKSPACE/.github/scripts/openlist/"*.jq /tmp/
          echo "函数库加载完成"

      # ===== 一键还原修复文件 =====
      # 把 marker fixed_files 中的替代文件还原为原路径原文件名:
      #   改名类 → rclone move 服务端移动；压缩/分卷类 → 下载还原后回传
      #   原路径；成功后清理目标端替代文件并从 marker 移除条目。
      # 完成后发送 Telegram 汇总。restore_task 指定任务名（backup/task0-5，
      # 即 marker 文件名前缀）或 all。
      - name: "⚠️ Restore: 一键还原修复文件"
        if: ${{ inputs.run_mode == '⚠️ 还原 · 修复文件还原为原路径' }}
        timeout-minutes: 240
        run: |
          source /tmp/load_all.sh
          restore_fixed_files "${{ inputs.restore_task || 'all' }}"

      # ===== 灾难恢复: 目标端 → 源端 =====
      # 修复文件以替代形态存在正是因为原形态无法在该后端持久化，因此恢复
      # 不经过"目标端改回原名"，一步直达源端:
      #   1. 普通文件（crypt 层透明）rclone copy 目标 → 源端，--size-only 幂等
      #   2. 修复文件: 排除出批量拷贝，逐条下载替代形态 → 本地解码（解压/
      #      合卷/解 base64/改名类直传）→ 以原路径原文件名上传源端，
      #      按 marker size_bytes 校验
      # 全程不删改目标端，可重复执行补齐失败条目。
      # 依赖 marker（与源端同在 OneDrive；极端情况 OneDrive 整体丢失时
      # 需外置的 marker 备份才能映射修复条目）。
      - name: "⚠️ Restore: 灾难恢复 目标端→源端"
        if: ${{ inputs.run_mode == '⚠️ 灾难恢复 · 目标端→源端' }}
        timeout-minutes: 240
        run: |
          source /tmp/load_all.sh
          restore_source_from_target "${{ inputs.restore_task || 'all' }}"

      # ===== 镜像灾难恢复: 目标端 → 源端（删除源端多余文件）=====
      # rebuild_source_from_target（restore_source_from_target 的破坏性变体）:
      # 批量层用 rclone sync 镜像，
      # 源端存在但目标端没有的文件会被删除，最终源端内容 = 目标端全部有效内容。
      # 替代形态与修复条目原路径均排除出 sync（防密文名拷回/防误删待还原路径），
      # 由逐条还原负责回填并按 marker md5 校验。目标端全程只读，可重复执行。
      - name: "⚠️ Restore: 镜像灾难恢复 目标端→源端（删除源端多余文件）"
        if: ${{ inputs.run_mode == '⚠️ 灾难恢复 · 目标端→源端（删除源端多余文件）' }}
        timeout-minutes: 240
        run: |
          source /tmp/load_all.sh
          rebuild_source_from_target "${{ inputs.restore_task || 'all' }}"

      # ===== 调试: 单任务测试修复管线 =====
      # 用真实生产代码路径（sync_task → sync_with_logging）按任务清单
      # （task_engine.sh SYNC_TASK_REGISTRY）查表跑单个任务（id 形如 backup、task0，
      # 含带后缀的变体 task0-baidupan / task0-wopan175 等，覆盖全部目标后端），
      # 验证 truth-check（重启取真值） + 缺失文件修复的实际效果。
      # 与正式流程的区别: 只跑单任务、跳过任务预览、跳过结尾 5h sleep，
      # 并用 OPENLIST_MISSING_FIX_MAX 限制修复数量快速得到结果。
      # 注意: --1d-skip 标记仍照常检查（近 1 天已成功同步的任务会跳过），
      # 需测试这类任务时配合 force_sync=true 强制执行。
      - name: "Debug: 单任务测试修复管线"
        if: ${{ inputs.run_mode == '调试 · 修复管线测试' }}
        timeout-minutes: 120
        run: |
          source /tmp/load_all.sh

          # ===== 等待 OpenList 就绪 =====
          echo "等待 OpenList 就绪..."
          wait_openlist_ready || true

          # ===== 初始化 =====
          init_sync_state

          # 单次修复数量上限（快速验证用）
          export OPENLIST_MISSING_FIX_MAX="${{ inputs.fix_test_max || 5 }}"
          # 跳过 initial sync 实际传输（debug 只验证修复方法: diff → 修复 → 持久化复核）
          export OPENLIST_FIX_TEST_MODE=1

          # ===== 按 input 从任务清单（task_engine.sh SYNC_TASK_REGISTRY）查表执行 =====
          FIX_TASK="${{ inputs.fix_test_task || 'backup' }}"
          echo "=== 修复管线测试任务: ${FIX_TASK} (修复上限 ${OPENLIST_MISSING_FIX_MAX}) ==="
          run_task_by_id "$FIX_TASK"
          echo "=== 修复管线测试完成 (SYNC_FAILED=${SYNC_FAILED}) ==="

      - name: 初始化同步状态
        if: ${{ inputs.run_mode == '' || inputs.run_mode == '同步' }}
        run: |
          source /tmp/load_all.sh
          init_sync_state
          # 同步任务在独立的 Actions step 中执行（每个 step 是独立 shell），
          # 必须写入 GITHUB_ENV 才能在后续 step 中保留；否则 threshold 为空，
          # 触发 `[: : integer expression expected` 错误。
          echo "PROCESSED_FILES_LOG=$PROCESSED_FILES_LOG" >> "$GITHUB_ENV"
          echo "=== 初始化已处理文件日志 ===" > "$PROCESSED_FILES_LOG"
          echo "开始时间: $(date)" >> "$PROCESSED_FILES_LOG"
          echo "==========================" >> "$PROCESSED_FILES_LOG"

      # ===== 所有同步任务预览 + 执行 =====
      # （任务清单/参数维护入口见上方"加载同步函数库"step 注释）
      - name: 任务预览与全量同步
        if: ${{ inputs.run_mode == '' || inputs.run_mode == '同步' }}
        run: |
          source /tmp/load_all.sh

          # 等待 OpenList 就绪（容器刚启动时如果尚未就绪会导致预览为空及无谓的同步重传）
          echo "等待 OpenList 就绪..."
          wait_openlist_ready || true

          if [ "${{ inputs.skip_preview }}" = "true" ]; then
            echo "=== 跳过预览通知（skip_preview=true，仅注册任务队列）==="
            # 仅注册模式: 不发预览通知，但把全部任务（含源端大小）注册进进度队列，
            # 否则任务随 progress_task_begin 逐个注册，进度消息的"总任务"会从 3 之类的小数字慢慢涨
            TASK_REGISTER_ONLY=1 run_all_tasks
          else
            echo "=== 发送任务预览通知 ==="
            TASK_PREVIEW_ONLY=1 run_all_tasks
            flush_task_preview
            echo "=== 所有任务预览通知已发送 ==="
          fi
          # 注册完成后立即刷新，让"总任务"在同步开始前就是全量
          progress_reload

          echo "=== 开始同步所有任务 ==="
          run_all_tasks
          echo "=== 所有任务同步完成 ==="

      - name: 收尾与清理
        # always(): 大任务（如 task0 的 226GiB）常态撞 6h job 上限被取消，
        # 本 run 已完成的 marker/processed log 收尾不能丢——run 31954162437
        # 实测取消后 always() step（Persist）仍会执行，此处同理
        if: ${{ always() && (inputs.run_mode == '' || inputs.run_mode == '同步') }}
        run: |
          source /tmp/load_all.sh
          actual_entries=0
          total_lines=0

          # 标记全局进度通知为最终完成状态
          progress_finalize

          if [ -f "processed_videos.log" ]; then
            total_lines=$(wc -l < "processed_videos.log" 2>/dev/null || echo 0)
            actual_entries=$((total_lines - 3))
            echo "==========================" >> "processed_videos.log"
            echo "结束时间: $(date)" >> "processed_videos.log"
            echo "=== 所有同步任务完成 ===" >> "processed_videos.log"

            if [ "$actual_entries" -gt 0 ]; then
              REMOTE_PROC_LOG="onedrive:/logs/processed/processed_videos_$(date +%Y%m%d_%H%M%S).log"
              rclone copyto "processed_videos.log" "$REMOTE_PROC_LOG" || true
            fi

            rm -f "processed_videos.log" 2>/dev/null || true
          fi

          # 镜像同步状态标记到 Dropbox（marker 是修复文件还原链路的唯一索引，
          # 与源端同在 OneDrive —— OneDrive 整体故障时灾难恢复需要外置副本）
          echo "镜像 sync_state → dropbox..."
          rclone sync onedrive:/logs/sync_state dropbox:sync_state_mirror --create-empty-src-dirs 2>&1 | tail -2 || true
          echo "sync_state 镜像完成: $(rclone lsf dropbox:sync_state_mirror 2>/dev/null | wc -l | tr -d ' ') 个文件"

          rm -f /tmp/*.sh /tmp/*.py /tmp/*.jq 2>/dev/null || true
          echo "所有同步任务完成！"

      # ===== 会话保持 + 数据库周期热备回传 =====
      # 原为纯 sleep 300m；runner 被强杀（VM 销毁/取消超时）时 Finalize 的
      # 回传来不及执行，改为每 5 分钟做一次一致性快照并回传变化的 db，
      # 强杀丢失窗口从 5 小时压缩到 ≤5 分钟。
      # 快照用 SQLite backup API（在线、逻辑一致），不直接拷 data.db 文件
      # （容器运行中直接拷可能捕获到撕裂状态）。
      - name: 会话保持与数据库周期热备
        if: ${{ inputs.run_mode == '' || inputs.run_mode == '同步' }}
        run: |
          LAST_MD5="${OPENLIST_DB_MD5_PULL:-none}"
          for _ in $(seq 1 60); do
            sleep 300
            # 容器运行中的在线一致性快照（root 属主，用 sudo 读）
            if sudo python3 -c "import sqlite3; src=sqlite3.connect('file:/opt/openlist-data/data.db?mode=ro', uri=True); dst=sqlite3.connect('/tmp/data.db.snapshot'); src.backup(dst); dst.close(); src.close()" 2>/dev/null; then
              NEW_MD5=$(md5sum /tmp/data.db.snapshot 2>/dev/null | awk '{print $1}' || echo "")
              if [ -n "$NEW_MD5" ] && [ "$NEW_MD5" != "$LAST_MD5" ]; then
                if rclone copyto /tmp/data.db.snapshot dropbox:self-hosted/openlist/data/data.db; then
                  LAST_MD5="$NEW_MD5"
                  echo "[$(date -u +'%H:%M:%SZ')] db 已变化，热备回传完成 ($NEW_MD5)"
                else
                  echo "[$(date -u +'%H:%M:%SZ')] ⚠️ 热备回传失败，下轮重试"
                fi
              fi
            fi
          done
          sudo docker stop openlist

      # ===== 数据库回传（所有模式 + 失败/取消也执行）=====
      # 停容器（幂等）→ SQLite 干净关闭、-wal/-shm 由 SQLite 自行清理/合并
      # → 整目录 rclone sync 镜像回传（未变化的 db 跳过，防止并发场景覆盖）。
      # if: always() 保证同步步骤失败/手动取消时，会话内的配置变更也能回传
      # （runner 被强杀除外——该场景由上一步的周期热备兜底）。
      - name: "Persist: openlist 数据库回传"
        if: ${{ always() }}
        run: |
          sudo docker stop openlist 2>/dev/null || true
          CUR_MD5=$(md5sum /opt/openlist-data/data.db 2>/dev/null | awk '{print $1}')
          CUR_MD5="${CUR_MD5:-none}"
          if [ "$CUR_MD5" = "${OPENLIST_DB_MD5_PULL:-none}" ]; then
            echo "db 未变化（${CUR_MD5}），跳过回传"
          else
            echo "db 已变化（${OPENLIST_DB_MD5_PULL:-none} → ${CUR_MD5}），sync 回传..."
            # 排除 -wal/-shm/-journal 后 sync 镜像（本地为权威副本）
            rclone sync /opt/openlist-data dropbox:self-hosted/openlist/data \
              --exclude "data.db-wal" --exclude "data.db-shm" --exclude "data.db-journal" \
              --exclude "log/**" --exclude "temp/**"
            # sync 的 exclude 不会删远端对应文件，显式清理可能残留的撕裂源
            rclone delete dropbox:self-hosted/openlist/data \
              --include "data.db-wal" --include "data.db-shm" --include "data.db-journal" 2>/dev/null || true
            echo "回传完成: $(rclone lsl dropbox:self-hosted/openlist/data 2>/dev/null | grep -c .) 个文件"
          fi
