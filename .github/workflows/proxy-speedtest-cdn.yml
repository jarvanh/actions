name: proxy-speedtest-cdn

# 代理节点测速四套（按测速点命名，便于在 Actions 列表一眼分辨）：
#   proxy-speedtest-gitee = 测速点 Gitee 私有仓库：经代理 git push 上行 + clone 下行 + gitee.com HTTP 延迟
#   proxy-speedtest-cdn   = 本工作流，测速点国内 CDN/镜像站（腾讯云 mirrors、清华 TUNA、
#                           npmmirror；延迟目标 baidu/taobao）：经代理 HTTP 计时 +
#                           单连接 curl 下载，生成 HTML 报告 + 达标节点订阅导出 Gist
#   proxy-speedtest-taier = 测速点泰尔三网（电信/联通/移动）：taierspeedtest + mihomo TUN
#   proxy-speedtest-gistnodes = 编排层，自己不测速：先从 gist.github.com 抓公开节点交给
#                            Sub-Store 去重出 mihomo YAML，再按 env/vars 选择上面三套之一来测
# 本工作流：测量节点延迟 + 下载速度 + 经代理上行速度，生成可交互 HTML 报告。
# 上行测速复用 speedtest_gitee 的「经 mihomo 代理 git push」方案向 Gitee 私有仓库推送测速文件。
on:
  schedule:
    # 每天 4 次、间隔 4 小时：UTC 22:00, 02:00, 06:00, 10:00（北京 06:00, 10:00, 14:00, 18:00）。
    # 与 gitee（京 05/09/13/17）、taier（京 07/11/15/19）各错开 1 小时，避免共用订阅源互相抢带宽；
    # 全部落在北京时间 05:00–21:00（夜间不测：runner 排队 + 出口拥塞会让读数失真）。
    - cron: "0 22,2,6,10 * * *"
  workflow_dispatch:
  # 被 proxy-speedtest-gistnodes 当子流程复用（gist 抓来的节点当订阅源）。
  workflow_call:
    inputs:
      sub_urls:
        description: '订阅源覆盖（逗号分隔 URL）；留空用仓库 secret PROXY_SPEEDTEST_SUB_URLS'
        required: false
        type: string
      source_gist_id:
        # 与 sub_urls 二选一：手动覆盖用。编排层（proxy-speedtest-gistnodes）走下面的
        # `use_gistnodes_source` 开关——`secrets` 上下文在 job 级 `with:` 里不可用
        # （报 `Unrecognized named-value: 'secrets'`），编排层传不了 id。
        description: '源订阅 Gist 的 id（手动覆盖用）；设了它就由本工作流解析 raw URL'
        required: false
        type: string
      source_gist_filename:
        description: '源订阅在 Gist 里的文件名（与 source_gist_id 配对）'
        required: false
        type: string
      use_gistnodes_source:
        # 编排层专用开关：置 '1' 表示「把 gistnodes 抓来的节点当订阅源」，本工作流从
        # **自己的** secrets 读 `PROXY_SPEEDTEST_GISTNODES_GIST_ID` 并解析其 raw URL。
        description: '置 1 = 用 gistnodes 抓来的节点当订阅源（从本工作流 secrets 取 Gist id）'
        required: false
        type: string
      result_gist_id_from_gistnodes:
        description: '置 1 = 结果写进 secrets.PROXY_SPEEDTEST_GISTNODES_GIST_ID（而非本工作流自己的）'
        required: false
        type: string
      max_nodes:
        description: '最多测几个节点（0 = 不限）'
        required: false
        type: string
      # 下面四个供编排层（proxy-speedtest-gistnodes）覆盖：让同一套测速既能写自己的 Gist，
      # 也能把结果写进调用方指定的 Gist，并让通知标题带上来源标签
      gist_id:
        description: '结果 Gist 的 id 覆盖；留空用本工作流自己的 secret'
        required: false
        type: string
      gist_filename:
        description: '结果 Gist 的文件名覆盖'
        required: false
        type: string
      gist_description:
        description: '结果 Gist 的描述覆盖'
        required: false
        type: string
      label:
        description: '通知标题前缀，用于区分同一套测速的不同来源（留空则不显示）'
        required: false
        type: string

jobs:
  speedtest:
    concurrency: proxy-speedtest-cdn-singleton
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Resolve source subscription
        # 为什么要有这一步：gistnodes 编排把「源节点订阅」传给本工作流，但那个订阅的 raw URL
        # 里含 gist id —— gist id 本身是注册过的 secret，GitHub 会把含它的 job output
        # **整个丢掉**（`Skip output 'sub_url' since it may contain secret.`）。下游拿到空值
        # 就 fallback 到仓库 secret（实测 run 34956069334 因此测的是用户自己的机场订阅，
        # 且零报错）。所以改由本步骤按 id 现取 raw URL。
        #
        # id 从**本工作流的 secrets** 取 —— `secrets` 上下文在 job 级 `with:` 里不可用，
        # 编排层只能传布尔开关。
        #
        # 两种触发都走这里，统一把最终订阅地址写进 $GITHUB_ENV，下一步只读不覆盖。
        env:
          USE_GISTNODES: ${{ inputs.use_gistnodes_source }}
          SOURCE_GIST_ID_IN: ${{ inputs.source_gist_id }}
          SOURCE_GIST_ID_SECRET: ${{ secrets.PROXY_SPEEDTEST_GISTNODES_GIST_ID }}
          SOURCE_GIST_FILENAME: ${{ inputs.source_gist_filename || 'proxy_speedtest_gistnodes_providers.yaml' }}
          SUB_URLS_IN: ${{ inputs.sub_urls }}
          SUB_URLS_SECRET: ${{ secrets.PROXY_SPEEDTEST_SUB_URLS }}
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          want_gist=0
          [ "$USE_GISTNODES" = "1" ] && want_gist=1
          [ -n "$SOURCE_GIST_ID_IN" ] && want_gist=1

          if [ "$want_gist" = "1" ]; then
            export SOURCE_GIST_ID="${SOURCE_GIST_ID_IN:-$SOURCE_GIST_ID_SECRET}"
            # 只认哨兵那一行拿 URL，理由见 proxy-speedtest-taier.yml 同步骤的注释
            # （resolve_gist_raw_url 的 progress JSON 会污染 $( ) 整段 stdout）。
            url=$(python -c "
          import os, sys
          sys.path.insert(0, '.github/scripts/proxy-speedtest')
          from speedtest_common import resolve_gist_raw_url_cli
          sys.exit(resolve_gist_raw_url_cli())
          " | sed -n 's/^__GIST_RAW_URL__//p')
            if [ -z "$url" ]; then
              echo "::error::按 gist id 解析源订阅 raw URL 失败（文件=$SOURCE_GIST_FILENAME）"
              exit 1
            fi
            echo "已解析源订阅 raw URL（长度 ${#url}）"
          else
            url="${SUB_URLS_IN:-$SUB_URLS_SECRET}"
            echo "未走 gistnodes 源，沿用既有订阅源配置（长度 ${#url}）"
          fi
          if [ -z "$url" ]; then
            echo "::error::订阅源为空：既没解析出源 Gist raw URL，inputs.sub_urls 与仓库 secret 也都是空"
            exit 1
          fi
          echo "PROXY_SPEEDTEST_SUB_URLS=$url" >> "$GITHUB_ENV"

      - name: Run node speedtest (latency + download + upload)
        # 订阅源**不在 env 里设**：上面那步已经把最终值写进 $GITHUB_ENV，这里再设一次会
        # 把它覆盖掉（步骤级 env 优先级高于 GITHUB_ENV）。
        env:
          PROXY_SPEEDTEST_DETACH: '0'
          # 自定义测试参数（可按需修改）
          PROXY_SPEEDTEST_LATENCY_TARGETS: 'https://www.baidu.com,https://www.taobao.com'
          PROXY_SPEEDTEST_LATENCY_SAMPLES: '4'
          PROXY_SPEEDTEST_LATENCY_TIMEOUT: '8'
          # 下载测速点不写死版本号：留空时脚本自动组合两类国内测速点——
          #  1) 国内滚动 ISO 索引目录（腾讯云 8/9-stream、清华 TUNA 等）自动发现
          #     *-latest-*.iso 软链，始终指向最新可用文件；
          #  2) 国内厂商 CDN（npmmirror 淘宝镜像）最新版 node 安装包，经 dist-tags
          #     实时解析版本号拼出「最新版」固定直链，代表日常软件下载带宽。
          # 两者均运行时自动取最新，规避版本号失效。如需固定测速点，可显式设置
          # 该变量为逗号分隔的 URL 列表；设 PROXY_SPEEDTEST_NPMMIRROR_ENABLED=0 可关闭第 2 类。
          # PROXY_SPEEDTEST_DOWNLOAD_URLS: ''
          # PROXY_SPEEDTEST_NPMMIRROR_ENABLED: '1'
          PROXY_SPEEDTEST_SIZE_MIB: '10'
          PROXY_SPEEDTEST_DOWNLOAD_TIMEOUT: '30'
          PROXY_SPEEDTEST_SWITCH_SETTLE_SECONDS: '1.5'
          # 节点上限：编排按抓取量传入；定时运行不传 = 0 = 不限（与既有行为一致）
          PROXY_SPEEDTEST_MAX_NODES: ${{ inputs.max_nodes || '0' }}
          # 墙钟预算（秒，0 = 不限）：到点不再开下一个节点，拿已测节点照常出订阅（退出码 0），
          # 目的是**不撞 job 的 360 分钟硬取消**（撞上则整轮白烧、订阅来不及提交 Gist）。
          # 默认 18000 秒 = 5 小时，比硬上限少 1 小时留给前置准备与收尾。**与 job 的
          # timeout-minutes 成对，改一个要回看另一个。**
          PROXY_SPEEDTEST_BUDGET_SECONDS: '18000'
          # 上行测速：默认开启，复用 speedtest_gitee 的「经 mihomo 代理 git push」方案，
          # 携带代理环境变量向 Gitee 私有仓库 push 测速文件（反映代理节点上行带宽）。
          # 需先在仓库 Secrets 配置 GITEE_PRIVATE_TOKEN 与 PROXY_SPEEDTEST_GITEE_OWNER，
          # 并准备可写的私有仓库（默认 proxy-speedtest-temp）；仓库体积超限会自动重建。
          # 设 ENABLE_PUSH=0 可关闭；设 UPLOAD_VIA_PROXY=0 则退化为直连 Gitee（家庭宽带上行）。
          PROXY_SPEEDTEST_ENABLE_PUSH: '1'
          # 上行是否经代理：1=经代理（代理节点上行质量）；0=直连 Gitee（家庭宽带上行）
          PROXY_SPEEDTEST_UPLOAD_VIA_PROXY: '1'
          GITEE_PRIVATE_TOKEN: ${{ secrets.GITEE_PRIVATE_TOKEN }}
          PROXY_SPEEDTEST_GITEE_OWNER: ${{ secrets.PROXY_SPEEDTEST_GITEE_OWNER }}
          PROXY_SPEEDTEST_GITEE_REPO: proxy-speedtest-temp
          PROXY_SPEEDTEST_PUSH_TIMEOUT: '30'
          # 直连基线（家庭宽带对照，2026-09-17 与 gitee 统一）：不经代理 push 一次，
          # 给出「家庭宽带 vs 节点」的可比数字——只看节点带宽无法判断节点是否还不如直连。
          # 失败不打死整轮（基线是参考值）：拿不到只记 direct_baseline.ok=false。
          PROXY_SPEEDTEST_DIRECT_BASELINE: '1'
          PROXY_SPEEDTEST_DIRECT_BASELINE_TIMEOUT: '60'
          PROXY_SPEEDTEST_DIRECT_BASELINE_MAX_ATTEMPTS: '5'
          # 订阅导出策略（四套共用，脚本默认值；各脚本消费）：
          #   PROXY_SPEEDTEST_MIN_MEGABIT  达标阈值（兆，默认 10）
          #   PROXY_SPEEDTEST_SPEED_METRIC 判定指标 upload|download（默认 upload 按上行判定；
          #                                另一指标达标数「明显更多」时自动改用另一指标）
          #   PROXY_SPEEDTEST_MIN_NODES    上传订阅的最少节点数（默认 1，不足则不上传）
          PROXY_SPEEDTEST_MIN_MEGABIT: '10'
          PROXY_SPEEDTEST_SPEED_METRIC: 'upload'
          PROXY_SPEEDTEST_MIN_NODES: '1'
          PROXY_SPEEDTEST_METRIC_FALLBACK_RATIO: '1.5'
          # 订阅导出 + 上传 Gist：脚本复用 speedtest_gitee 的 build_subscription_yaml_text /
          # update_gist，把达标节点整理成可用订阅并发布到 GitHub 私有 Gist。
          #   PROXY_SPEEDTEST_SUB_URLS : 见上方同步骤 env 的原始订阅源定义，用于解析节点原始配置；留空则不上传 gist
          #   GH_TOKEN                 : 具备 gist 写入权限的 Personal Access Token（Secrets: PAT，与 proxy-speedtest-gitee 对齐）；
          #                             注意：默认 GITHUB_TOKEN 无 gist 作用域，会导致 403，须用 PAT
          #   PROXY_SPEEDTEST_CDN_GIST_ID : 本工作流专属 Gist 的 id（三个测速工作流各用各的，互不覆盖）；
          #                             首次留空会自动新建，TG 通知会给链接，拿到 id 后回填此 secret
          GH_TOKEN: ${{ secrets.PAT }}
          # 编排层（gistnodes）触发时改成写进 gistnodes 的 Gist —— id 从本工作流 secrets 取，
          # 因为编排层传不进来（`secrets` 上下文在 job 级 `with:` 里不可用）。
          PROXY_SPEEDTEST_GIST_ID: ${{ (inputs.result_gist_id_from_gistnodes == '1' && secrets.PROXY_SPEEDTEST_GISTNODES_GIST_ID) || inputs.gist_id || secrets.PROXY_SPEEDTEST_CDN_GIST_ID }}
          # 新建 gist 后自动回填到哪个 secret（治「每轮新建 ⇒ 旧链接 404」的自续循环，
          # 见 speedtest_common._backfill_gist_secret）。写别人的 Gist（编排层/手动 id）时不回填。
          PROXY_SPEEDTEST_GIST_SECRET_NAME: ${{ (inputs.result_gist_id_from_gistnodes == '1' || inputs.gist_id) && '' || 'PROXY_SPEEDTEST_CDN_GIST_ID' }}
          PROXY_SPEEDTEST_GIST_FILENAME: ${{ inputs.gist_filename || 'proxy_speedtest_cdn_subscription.yaml' }}
          PROXY_SPEEDTEST_GIST_DESCRIPTION: ${{ inputs.gist_description || 'proxy speedtest subscription (cdn 镜像站延迟+下载)' }}
          # 通知标题前缀：编排层传入时标题带上来源标签，便于分辨这一轮是谁触发的
          PROXY_SPEEDTEST_LABEL: ${{ inputs.label }}
          # Telegram 通知：测速完成后推送 TOP 节点（延迟/下载/上传）+ 订阅 Gist 状态
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 统一收尾区（footer）: 运行日志链接 + 已运行时长
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_RUN_STARTED_AT: ${{ github.run_started_at }}
        run: python .github/scripts/proxy-speedtest/speedtest.py
