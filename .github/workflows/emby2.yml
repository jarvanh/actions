name: emby2

on:
  schedule:
    # - cron: "0 3,9,15,21 * * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:
  watch:
    # types: started

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Workflow Status
        run: |
          workflow_runs=$(curl -s -X GET \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs")
          
          isRunning=$(echo "$workflow_runs" | jq '.workflow_runs[] | select(.name == "emby2" and .status == "in_progress")')
          
          if [[ -n $isRunning ]]; then
            echo "Another workflow is already running. Aborting current workflow."
            exit 1
          else
            echo "No running workflows found. Continuing with the workflow execution."
          fi
      - uses: actions/checkout@v4
      - name: rclone-install
        run: |
          set -e
          # 安装 rclone：GitHub Releases 直下 .deb，失败回退 rclone.org 安装脚本
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          # 写配置 + 持久化：secret 起步 → 掩码 → Dropbox 恢复优先 → 有效性检查 → 同步回 Dropbox
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config
      - name: rclone-run
        run: |
          rclone delete onedrive:self-hosted/emby2/config/system.xml --ignore-errors -vv
          rclone copy onedrive:self-hosted/emby2/system.xml onedrive:0/j/emby2/config/ --ignore-errors -vv
          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo mkdir -p /onedrive
          # 挂载改用 runner 用户（与 emby.yml 一致）：root 身份挂载时 rclone 刷新 token 会把
          # rclone.conf 回写成 root:600，之后非 root 的 rclone（含下面的 lsf）读取即 EACCES
          grep -q '^user_allow_other' /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf >/dev/null
          sudo chown runner:runner /onedrive
          nohup rclone mount onedrive: /onedrive --config /home/runner/.config/rclone/rclone.conf --allow-non-empty --no-gzip-encoding --umask 000 --allow-other --attr-timeout 10m --vfs-cache-mode full --vfs-cache-max-age 5m --vfs-read-chunk-size-limit 10G --buffer-size 100M --vfs-cache-max-size 50G &
          echo "==========i==========="
          rclone lsf i:
          echo "==========j==========="
          rclone lsf j:
          echo "==========onedrive==========="
          rclone lsf onedrive:
          echo "==========dropbox==========="
          rclone lsf dropbox:
      - name: install emby
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 匿名调 GitHub API：runner 共享出口 IP 的匿名配额（60 次/h）极易耗尽，
          # 限流响应里没有 browser_download_url，此时回退用内置 GITHUB_TOKEN 认证重试
          RELEASE_JSON=$(curl -s https://api.github.com/repos/MediaBrowser/Emby.Releases/releases/latest)
          if ! echo "$RELEASE_JSON" | grep -q '"browser_download_url"'; then
            echo "匿名 GitHub API 调用失败（可能限流），回退 secrets.GITHUB_TOKEN 认证重试"
            RELEASE_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/MediaBrowser/Emby.Releases/releases/latest)
          fi
          DEB_URL=$(echo "$RELEASE_JSON" | grep -oP '"browser_download_url": "\K(.*emby-server-deb.*amd64.deb)(?=")' || true)
          [ -n "$DEB_URL" ] || { echo "::error::未获取到 Emby 最新版下载地址（GitHub API 异常/限流）"; exit 1; }
          curl -L -o emby-server.deb "$DEB_URL"
          sudo dpkg -i emby-server.deb
          while true; do
              if [ -d /var/lib/emby ]; then
                  echo "Directory exists, deleting..."
                  if sudo rm -rf /var/lib/emby; then
                      echo "Directory deleted successfully"
                      break
                  else
                      echo "Failed to delete directory, retrying..."
                  fi
              else
                  echo "Directory does not exist"
                  break
              fi
          done
          echo "==========/onedrive/self-hosted/emby2==========="
          sudo ls /onedrive/self-hosted/emby2
          sudo ln -s /onedrive/self-hosted/emby2 /var/lib/emby
          echo "==========/var/lib/emby==========="
          sudo ls /var/lib/emby
          sudo chown -R emby:emby /var/lib/emby
      - name: run emby
        run: |
          sudo nohup /opt/emby-server/bin/emby-server &
      - name: run cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          sudo mkdir -p ~/.cloudflared/
          sudo chown -R runner:runner ~/.cloudflared
          # rclone 以 runner 身份运行（与挂载步骤同）：root 运行会在 token 刷新时回写 rclone.conf 属主
          rclone copy i:SyncBack/'${{ secrets.VD }}'/.cloudflared ~/.cloudflared -vv
          cloudflared tunnel route dns ee ee.'${{ secrets.VD }}'.us.kg
          nohup cloudflared tunnel run --url http://127.0.0.1:8096 ee &
      - name: sleep
        run: |
          # 密钥不进 argv（同机任何用户 ps 可见）：写入 600 的临时 curl 配置，用 --config 载入
          EMBY_CURL_CFG="$(mktemp)"; chmod 600 "$EMBY_CURL_CFG"
          printf 'header = "X-Emby-Token: %s"\n' '${{ secrets.EMBY_API_TOKEN }}' > "$EMBY_CURL_CFG"
          sleep 340m
          curl --config "$EMBY_CURL_CFG" -X POST http://127.0.0.1:8096/System/Shutdown
          rm -f "$EMBY_CURL_CFG"
          sleep 3m
