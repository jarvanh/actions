name: jellyfin

on:
  schedule:
    # - cron: "0 2,8,14,20 * * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:
  watch:
    # types: started

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Workflow Status
        run: |
          workflow_runs=$(curl -s -X GET \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs")
          
          isRunning=$(echo "$workflow_runs" | jq '.workflow_runs[] | select(.name == "jellyfin" and .status == "in_progress")')
          
          if [[ -n $isRunning ]]; then
            echo "Another workflow is already running. Aborting current workflow."
            exit 31
          else
            echo "No running workflows found. Continuing with the workflow execution."
          fi
      - uses: actions/checkout@v4
      - name: rclone-install
        run: |
          set -e
          # 安装 rclone：GitHub Releases 直下 .deb，失败回退 rclone.org 安装脚本
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          # 写配置 + 持久化：secret 起步 → 掩码 → Dropbox 恢复优先 → 有效性检查 → 同步回 Dropbox
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config
      - name: rclone-run
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo mkdir -p /content/drive/MyDrive/my /content/drive/MyDrive/1024 \
            /content/drive/MyDrive/my/i /content/drive/MyDrive/my/j /content/drive/MyDrive/my/k \
            /content/drive/MyDrive/my/av1 /content/drive/MyDrive/my/av2 /content/drive/MyDrive/my/dropbox
          # 挂载改用 runner 用户（与 emby.yml 一致）：root 身份挂载时 rclone 刷新 token 会把
          # rclone.conf 回写成 root:600，之后非 root 的 rclone（含下面的 lsf）读取即 EACCES
          grep -q '^user_allow_other' /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf >/dev/null
          sudo chown -R runner:runner /content
          nohup rclone mount 1024: /content/drive/MyDrive/1024 --config /home/runner/.config/rclone/rclone.conf --allow-non-empty --no-gzip-encoding --umask 000 --allow-other --attr-timeout 10m --vfs-cache-mode full --vfs-cache-max-age 5m --vfs-read-chunk-size-limit 10G --buffer-size 100M --vfs-cache-max-size 50G &
          nohup rclone mount i: /content/drive/MyDrive/my/i --config /home/runner/.config/rclone/rclone.conf --allow-non-empty --no-gzip-encoding --umask 000 --allow-other --attr-timeout 10m --vfs-cache-mode full --vfs-cache-max-age 5m --vfs-read-chunk-size-limit 10G --buffer-size 100M --vfs-cache-max-size 50G &
          nohup rclone mount j: /content/drive/MyDrive/my/j --config /home/runner/.config/rclone/rclone.conf --allow-non-empty --no-gzip-encoding --umask 000 --allow-other --attr-timeout 10m --vfs-cache-mode full --vfs-cache-max-age 5m --vfs-read-chunk-size-limit 10G --buffer-size 100M --vfs-cache-max-size 50G &
          nohup rclone mount k: /content/drive/MyDrive/my/k --config /home/runner/.config/rclone/rclone.conf --allow-non-empty --no-gzip-encoding --umask 000 --allow-other --attr-timeout 10m --vfs-cache-mode full --vfs-cache-max-age 5m --vfs-read-chunk-size-limit 10G --buffer-size 100M --vfs-cache-max-size 50G &
          nohup rclone mount av1: /content/drive/MyDrive/my/av1 --config /home/runner/.config/rclone/rclone.conf --allow-non-empty --no-gzip-encoding --umask 000 --allow-other --attr-timeout 10m --vfs-cache-mode full --vfs-cache-max-age 5m --vfs-read-chunk-size-limit 10G --buffer-size 100M --vfs-cache-max-size 50G &
          nohup rclone mount av2: /content/drive/MyDrive/my/av2 --config /home/runner/.config/rclone/rclone.conf --allow-non-empty --no-gzip-encoding --umask 000 --allow-other --attr-timeout 10m --vfs-cache-mode full --vfs-cache-max-age 5m --vfs-read-chunk-size-limit 10G --buffer-size 100M --vfs-cache-max-size 50G &
          nohup rclone mount dropbox: /content/drive/MyDrive/my/dropbox --config /home/runner/.config/rclone/rclone.conf --allow-non-empty --no-gzip-encoding --allow-other --attr-timeout 10m --vfs-cache-mode full --vfs-cache-max-age 5m --vfs-read-chunk-size-limit 10G --buffer-size 100M --vfs-cache-max-size 50G &
          echo "==========i==========="
          rclone lsf i:
          echo "==========j==========="
          rclone lsf j:
          echo "==========k==========="
          rclone lsf k:
          echo "==========o==========="
          rclone lsf o:
          echo "==========1024==========="
          rclone lsf 1024:
          echo "==========av1==========="
          rclone lsf av1:
          echo "==========av2==========="
          rclone lsf av2:
          echo "==========dropbox==========="
          rclone lsf dropbox:
      - name: install jellyfin
        run: |
          curl https://repo.jellyfin.org/install-debuntu.sh | sudo bash
      - name: run jellyfin
        run: |
          sudo nohup /usr/bin/jellyfin -w /usr/share/jellyfin/web --datadir /content/drive/MyDrive/my/j/jellyfin &
      - name: run cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          sudo mkdir -p ~/.cloudflared/
          sudo chown -R runner:runner ~/.cloudflared
          # rclone 以 runner 身份运行（与挂载步骤同）：root 运行会在 token 刷新时回写 rclone.conf 属主
          rclone copy i:SyncBack/'${{ secrets.VD }}'/.cloudflared ~/.cloudflared -vv
          cloudflared tunnel route dns j j.'${{ secrets.VD }}'.eu.org
          nohup cloudflared tunnel run --url http://127.0.0.1:8096 j &
      - name: sleep
        run: |
          # 密钥不进 argv（同机任何用户 ps 可见）：写入 600 的临时 curl 配置，用 --config 载入
          EMBY_CURL_CFG="$(mktemp)"; chmod 600 "$EMBY_CURL_CFG"
          printf 'header = "X-Emby-Token: %s"\n' 'd81ced113e714504aeac7c42d5dbda57' > "$EMBY_CURL_CFG"
          sleep 340m
          curl --config "$EMBY_CURL_CFG" -X POST http://127.0.0.1:8096/System/Shutdown
          rm -f "$EMBY_CURL_CFG"
          sleep 10m
