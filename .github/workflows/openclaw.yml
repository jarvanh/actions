          STAGE_DIR=$(sudo mktemp -d /tmp/rsstt-archive-stage.XXXXXX)
          sudo chmod 755 "$STAGE_DIR"

          set +e
          sudo rsync -a --delete "$SRC_ROOT/" "$STAGE_DIR/"
          rsync_rc=$?
          set -e
          # rc=24：源文件在遍历期间消失（容器正在写），属预期，仍校验最终包
          if [ "$rsync_rc" -ne 0 ] && [ "$rsync_rc" -ne 24 ]; then
          echo "rsstt_snapshot_failed rc=$rsync_rc" >&2
          exit 1
          fi
          sudo chmod -R a+rX "$STAGE_DIR" 2>/dev/null || true

