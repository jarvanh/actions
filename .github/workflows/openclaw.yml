          # 里，主文件单独拿出来是半截状态（2026-10-06 实测：db.sqlite3 主库停在
          # 14:33 的 172032B，而 bot.session 一路写到 23:12 —— 差异就是 WAL 未归并）。
          # .backup 从**活库**导出自包含单文件（比 staging 的 rsync 逐文件拷贝更一致，
          # 后者可能跨越写入时刻），再丢掉 -wal/-shm，还原侧拿到即完整。
          # sqlite3 不可用时保留 rsync 副本（三文件同在本身也是可用快照）。
          if command -v sqlite3 >/dev/null 2>&1; then
          while IFS= read -r live_db; do
          [ -n "$live_db" ] || continue
          rel="${live_db#"$SRC_ROOT"/}"
          staged="$STAGE_DIR/$rel"
          [ -f "$staged" ] || continue
          if sudo sqlite3 "$live_db" ".backup '$staged.tmp'" 2>/dev/null && [ -s "$staged.tmp" ]; then
          sudo mv -f "$staged.tmp" "$staged"
          sudo rm -f "$staged-wal" "$staged-shm" 2>/dev/null || true
          echo "sqlite_snapshot ok $rel"
          else
          sudo rm -f "$staged.tmp" 2>/dev/null || true
          echo "sqlite_snapshot_fallback $rel (kept rsync copy)"
          fi
          done < <(sudo find "$SRC_ROOT" -name '*.sqlite3' -type f 2>/dev/null)
          else
          echo "sqlite_snapshot_skipped (sqlite3 not found; using rsync copies)"
          fi

          # 完整性判据（取代体积基准）：两项都是「没有就说明状态不全」——
          #   config/bot.session  Bot 登录态（SQLite），丢了要重新登录
          #   config/db.sqlite3   订阅列表 + 推送游标，丢了订阅还原并重复推送
          missing=""
          for f in config/bot.session config/db.sqlite3; do
          if [ ! -s "$STAGE_DIR/$f" ]; then
          missing="$missing $f"
          fi
          done
          if [ -n "$missing" ]; then
          echo "rsstt_archive_incomplete missing=$missing" >&2
          exit 4
          fi

          sudo tar -C "$STAGE_DIR" -czf "$OUTPUT_TAR" .
          sudo chmod 644 "$OUTPUT_TAR" 2>/dev/null || true

          actual_size=$(stat -c%s "$OUTPUT_TAR" 2>/dev/null || echo 0)
          if [ ! -s "$OUTPUT_TAR" ]; then
          echo "rsstt_archive_empty output=$OUTPUT_TAR"
          exit 1
          elif [ "$actual_size" -lt "$MIN_SIZE" ]; then
          echo "rsstt_archive_too_small size=${actual_size} min=${MIN_SIZE} output=$OUTPUT_TAR"
          exit 1
          elif ! tar -tzf "$OUTPUT_TAR" >/dev/null 2>&1; then
          echo "rsstt_archive_tar_validation_failed output=$OUTPUT_TAR"
          exit 1
          else
          echo "archive_ready size=${actual_size} output=$OUTPUT_TAR"
          fi
          EOF
          chmod +x /tmp/create-rsstt-archive.sh

          cat > /tmp/create-zcode2api-data-archive.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          # zcode2api 数据快照归档（2026-10-06 新增）：与 rsstt 同一类问题 ——
          # 原先只在 Final Archive 打一次，cancel / 强杀即整轮跳过。实测云端
          # zcode2api-data.tar.gz 落后本地约 5 小时：accounts.db 的 md5 已与本地
          # 分叉，本地新增的 captchalog-2026-10-06.jsonl（96KB）云端包里根本没有。
          # 纳入 20 分钟周期循环后，回滚窗口从 ≈6h 压到 20 分钟。
          #
          # 只收 .env + data/ 两项目，其余一概不管：
          #   代码   ← GitHub 仓库 jarvanh/zcode2api，每轮 clone
          #   logs/  ← 直写 Dropbox（/dropbox/self-hosted/zcode2api/logs），不落 /tmp
          #   凭据   ← cred-sync cron 每 10 分钟从 Dropbox 对齐进库
          # 三者各有真源，重复入包只会让包变大、回滚面变宽。
          #
          # 本目录由 runner 自己跑 systemd 服务写入，无需 sudo（与 rsstt 那边的
          # uid 1001 容器场景不同），故走普通 cp/rsync + 普通 tar。

          OUTPUT_TAR="${1:-}"
          if [ -z "$OUTPUT_TAR" ]; then
          echo "Usage: $0 /path/to/output.tar.gz" >&2
          exit 2
          fi

          MIN_SIZE=$((5 * 1024))
          SRC_ROOT="/tmp/local_zcode2api"
          STAGE_DIR=""

          cleanup() {
          if [ -n "${STAGE_DIR:-}" ] && [ -d "$STAGE_DIR" ]; then
          rm -rf "$STAGE_DIR"
          fi
          }
          trap cleanup EXIT

          rm -f "$OUTPUT_TAR"

          if [ ! -f "$SRC_ROOT/.env" ] && [ ! -d "$SRC_ROOT/data" ]; then
          echo "zcode2api_dir_missing"
          exit 3
          fi

          STAGE_DIR=$(mktemp -d /tmp/zcode2api-data-archive-stage.XXXXXX)
          mkdir -p "$STAGE_DIR/data"

          if [ -f "$SRC_ROOT/.env" ]; then
          cp -a "$SRC_ROOT/.env" "$STAGE_DIR/.env"
          fi

          if [ -d "$SRC_ROOT/data" ]; then
          set +e
          rsync -a --delete "$SRC_ROOT/data/" "$STAGE_DIR/data/"
          rsync_rc=$?
          set -e
          # rc=23/24：服务（8319）正在写 usage-*.jsonl / reqlog-*.jsonl，
          # 部分文件在遍历期间变动或权限受限，属预期，仍校验最终包。
          # 其余非零才是真失败 —— 与 set -e 下同口径的 zcode 归档保持一致。
          if [ "$rsync_rc" -ne 0 ] && [ "$rsync_rc" -ne 23 ] && [ "$rsync_rc" -ne 24 ]; then
          echo "zcode2api_snapshot_failed rc=$rsync_rc" >&2
          exit 1
          fi
          fi

          # SQLite 一致性快照：accounts.db 是账号池，服务在跑处于 WAL（同目录常驻
          # -wal / -shm）。直接搬主文件会漏掉尚未 checkpoint 的账号增删改与额度变化。
          # .backup 从活库导出自包含单文件，再丢掉 -wal/-shm。
          if command -v sqlite3 >/dev/null 2>&1 && [ -f "$SRC_ROOT/data/accounts.db" ]; then
          if sqlite3 "$SRC_ROOT/data/accounts.db" ".backup '$STAGE_DIR/data/accounts.db.tmp'" 2>/dev/null \
          && [ -s "$STAGE_DIR/data/accounts.db.tmp" ]; then
          mv -f "$STAGE_DIR/data/accounts.db.tmp" "$STAGE_DIR/data/accounts.db"
          rm -f "$STAGE_DIR/data/accounts.db-wal" "$STAGE_DIR/data/accounts.db-shm" 2>/dev/null || true
          echo "sqlite_snapshot ok data/accounts.db"
          else
          rm -f "$STAGE_DIR/data/accounts.db.tmp" 2>/dev/null || true
          echo "sqlite_snapshot_fallback data/accounts.db (kept rsync copy)"
          fi
          fi

          # 完整性判据：.env 是运行配置（端口/网关 key/日志路径），
          # accounts.db 是账号池本体；缺任一项即以 4 中止，不覆盖云端好包
          missing=""
          [ -s "$STAGE_DIR/.env" ] || missing="$missing .env"
          [ -s "$STAGE_DIR/data/accounts.db" ] || missing="$missing data/accounts.db"
          if [ -n "$missing" ]; then
          echo "zcode2api_archive_incomplete missing=$missing" >&2
          exit 4
          fi

