          #    storage-backup.sqlite 落在同一数据卷内，随第 2 步一起进包。
          #    失败非致命 —— 活库三件套（sqlite/-wal/-shm）仍在包里兜底。
          if docker ps --format '{{.Names}}' | grep -q '^omniroute$'; then
            if ! docker exec omniroute node -e "const Database=require('better-sqlite3');const db=new Database('/app/data/storage.sqlite');db.backup('/app/data/storage-backup.sqlite').then(()=>process.exit(0)).catch((e)=>{console.error(e.message);process.exit(1);})" 2>/tmp/omniroute-backup.err; then
