name: openclaw

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    # 手动运行时可指定本次使用的 AI 网关后端（默认 auto = 自动降级链）。
    # pinned 模式不降级：指定后端起不来直接失败，便于定点验证单个后端。
    inputs:
      ai_backend:
        description: "AI 网关后端"
        type: choice
        default: auto
        options:
          - auto
          - omniroute
          - clirelay
          - cliproxyapi

permissions:
  contents: read
  actions: write

jobs:
  build:
    concurrency: openclaw-singleton
    runs-on: ubuntu-latest
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
      # Tailscale API access token（tskey-api-*）：具备 devices 读写权限，用于
      # 「僵尸清退」删除上一轮残留的 openclaw* 节点，从根上消掉主机名退化。
      # 与上面那对 OAuth client 凭据不是一类东西：tskey-client-* 天生只有
      # auth_keys scope，永远列不了/删不了设备（2026-10-01 实测 404）。
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      # 本机两个自建 AI 网关（zcode2api 8319 / workbuddy-gateway 8318）共用同一把访问 key，
      # 客户端只需记一个。定义在 job 级供两个 step 复用，避免两处各写一份而写歪。
      # 注：这是本机网关的访问口令，不是任何上游服务的凭据；两者都不对外暴露公网。
      # 取值在仓库 Secrets（2026-09-24 轮换：旧明文已从仓库移除）
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      # 告警档凭据（tier=alert 直达告警 bot @SaberFuckBot，无回落）
      TELEGRAM_BOT_TOKEN_ALERT: ${{ secrets.TELEGRAM_BOT_TOKEN_ALERT }}
      TELEGRAM_CHAT_ID_ALERT: ${{ secrets.TELEGRAM_CHAT_ID_ALERT }}
      # GitHub CLI 鉴权（2026-10-02 事故修复）：缺了它，任何 step 的 shell 里跑
      # `gh api` 都会直接报「To use GitHub CLI in a GitHub Actions workflow, set
      # the GH_TOKEN environment variable」—— 与仓库公开/私有无关、与网络抖动无关。
      # 事故链：trae2api step 未设 GH_TOKEN → gh api 取 Release 恒失败 → 判空
      # exit 1 → 无 continue-on-error → 后续 quota-board/zcode2api/qingyan/
      # Run OpenClaw 被整条级联跳过（run 36963030965 实测）。
      # 更隐蔽的是：下面「Prepare runtime env」里那段「从 GH_TOKEN 持久化 gh auth
      # 到本地 hosts.yml」的逻辑读的也是 ${GH_TOKEN:-} —— 它在 job 级拿不到值时，
      # 持久化从未生效过，等于后续所有 shell 里的 gh 都是裸奔状态。
      # 故在 job 级统一注入，一次覆盖全部 step（含上面那段持久化逻辑）。
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'current' # 始终使用官方发布的最新版
          
      - uses: actions/checkout@v7
      - name: rclone-install
        run: |
          set -e
          # 记录 job 近似起点：Keep alive 的动态死线以它为基准（Set up job/Node/checkout
          # 与本步间隔仅数秒，误差可忽略；2026-10-01 动态保活改造）
          date +%s > /tmp/job-start-epoch 2>/dev/null || true
          # 安装 rclone：GitHub Releases 直下 .deb，失败回退 rclone.org 安装脚本
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          # 写配置 + 持久化：secret 起步 → 掩码 → Dropbox 恢复优先 → 有效性检查 → 同步回 Dropbox
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config
      - name: Prefetch cold artifacts (后台并行)
        # 把「与本轮状态无关」的大块下载从串行关键路径上摘出去。实测一轮冷启动里
        # 主包下载 54s、omniroute 镜像 35.7s、rss 镜像 ~20s 都排在各自消费步骤里干
        # 等（run 39515245551 逐行核对日志），本步把它们丢到后台，与 mount/tailscale/
        # 装 openclaw/解包重叠。
        # 纯增益，不参与正确性：消费方原有的同步下载与 `docker run` 拉取路径一行未动，
        # 预取没跑完/跑失败就按原路走；产物先写 .part 再 mv，消费方不会看到半截文件。
        run: |
          # 关掉 errexit：GH 默认 shell 是 bash -e，本步骤任何一次探测失败（rclone 限流、
          # 磁盘不足）都不该把整轮打死 —— 预取的语义是「成了是赚，砸了照原路走」。
          set +e
          set -uo pipefail
          P=/tmp/openclaw-prefetch
          rm -rf "$P"; mkdir -p "$P"

          cat > "$P/pull-openclaw-tar.sh" <<'PF_EOF'
          #!/usr/bin/env bash
          # 主包 prefetch：产物落在 prefetch 目录，由恢复步骤等完再 mv 走（同一 fs，rename 免费）。
          # rc 文件最后写 —— 它出现即代表 .tar.gz 已就位，轮询方不会读到半截。
          set +e
          P="$1"
          rclone copyto dropbox:self-hosted/openclaw.tar.gz "$P/openclaw.tar.gz.part"
          rc=$?
          if [ "$rc" -eq 0 ] && [ -s "$P/openclaw.tar.gz.part" ]; then
            mv "$P/openclaw.tar.gz.part" "$P/openclaw.tar.gz"
          else
            rm -f "$P/openclaw.tar.gz.part"
            [ "$rc" -eq 0 ] && rc=1
          fi
          echo "$rc" > "$P/openclaw-tar.rc"
          PF_EOF
          cat > "$P/pull-images.sh" <<'PF_EOF'
          #!/usr/bin/env bash
          set +e
          # $1 = prefetch 目录（父 shell 的变量不会自动进子 shell，必须显式传）
          P="$1"
          # 与 workflow 内各步骤的固定 tag 对齐；漏改只丢增益（消费方自己仍会拉）。
          for img in rongronggg9/rss-to-telegram:latest \
                     diegosouzapw/omniroute:3.8.51 \
                     ghcr.io/shuishuipingan/qoder2api-hub:1.6; do
            docker image pull "$img" >"$P/pull-$(printf '%s' "$img" | tr '/:.' '___').log" 2>&1
          done
          PF_EOF
          chmod +x "$P/pull-openclaw-tar.sh" "$P/pull-images.sh"

          nohup bash "$P/pull-images.sh" "$P" >"$P/pull-images.out" 2>&1 &
          echo "🚀 已后台拉起网关镜像预取（pid $!）"

          tar_bytes="$(rclone size --json dropbox:self-hosted/openclaw.tar.gz 2>/dev/null | jq -r '.bytes // 0' 2>/dev/null)" || tar_bytes=0
          case "${tar_bytes:-0}" in ''|*[!0-9]*) tar_bytes=0 ;; esac
          if [ "$tar_bytes" -eq 0 ]; then
            echo "ℹ️ 未取得主包远端体积，跳过预取（恢复步骤按原路同步下载）"
          else
            # 预取不能反过来把恢复侧挤爆：留 2 倍包体积 + 1GB（与恢复侧 require_free_kb 同口径）
            avail_kb="$(df -Pk /tmp | awk 'NR==2 {print $4}')"
            need_kb="$(( tar_bytes / 1024 * 2 + 1024 * 1024 ))"
            if [ "${avail_kb:-0}" -lt "$need_kb" ]; then
              echo "ℹ️ /tmp 空间不足以预取主包（available=${avail_kb}KB required=${need_kb}KB），跳过"
            else
              nohup bash "$P/pull-openclaw-tar.sh" "$P" >"$P/openclaw-tar.out" 2>&1 &
              echo $! > "$P/openclaw-tar.pid"
              echo "🚀 已后台预取主包 openclaw.tar.gz（${tar_bytes}B，pid $(cat "$P/openclaw-tar.pid")）"
            fi
          fi
      - name: Mount Dropbox
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo mkdir -p /dropbox /mnt/vfs/dropbox /opt/logs
          sudo chown runner:runner /dropbox /mnt/vfs/dropbox /opt/logs

          # 挂载改用 runner 用户（与 emby.yml 一致）：conf 全程以 runner 身份读写。
          # 原来用 sudo 挂载，token 刷新时 rclone 以 root 回写 rclone.conf（属主 root、权限 600），
          # 之后非 root 的归档循环再读它就变成
          # "Failed to load config file ... permission denied" —— 即本次 CLIProxyAPI.tar.gz 上传失败的根因。
          # --allow-other 需要 fuse 允许非 root 共享挂载，挂载点也交给 runner 才能免 sudo 挂载。
          grep -q '^user_allow_other' /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf >/dev/null

          # 挂载 Dropbox
          # 参数按"配置 / Docker 数据卷"画像——小文件随机读写，不需要大块顺序预读：
          #   --cache-dir        默认 ~/.cache/rclone 会落进根分区（≈14GB），必须指向 /mnt
          #   --attr-timeout 1m  原 10m：容器内文件频繁增删改，属性缓存 10 分钟有陈旧风险
          #   --poll-interval 0  run 期间远端目录不会自己变，关轮询省 API 配额
          #   --buffer-size 16M  原 100M：每个打开的文件常驻一份，小文件场景用不到
          #   删除 --vfs-read-chunk-size-limit 10G：会让单个 Range 请求一路翻倍到 10GB
          # 长驻服务一律 systemd 托管（2026-10-05 主人拍板）：
          #   挂载进程崩溃或被 signal sweep 后由 Restart=always 秒级自愈，
          #   不再只能等下一轮 run（可达数小时）。管理器缺失时退回原 nohup。
          #   注意：ensure 检测到已有裸跑实例会**跳过**（不打断本轮挂载），
          #   单元在新 VM 上自动接管；回退分支因此仍必须保留。
          if [ -f "$GITHUB_WORKSPACE/.github/scripts/services/services.sh" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/services/services.sh" ensure rclone-dropbox || true
          fi
          if ! mount | grep -q " on /dropbox "; then
            nohup rclone mount dropbox: /dropbox \
              --config /home/runner/.config/rclone/rclone.conf \
              --cache-dir /mnt/vfs/dropbox \
              --allow-other --umask 000 --no-gzip-encoding \
              --attr-timeout 1m \
              --dir-cache-time 72h --poll-interval 0 \
              --vfs-cache-mode full \
              --vfs-cache-max-size 2G --vfs-cache-max-age 1h \
              --vfs-cache-min-free-space 2G \
              --vfs-cache-poll-interval 30s \
              --buffer-size 16M \
              --log-file /opt/logs/rclone-dropbox.log --log-level INFO &
          fi

          echo "Waiting for mount..."
          for i in {1..30}; do
            if mount | grep -q " on /dropbox " && ls /dropbox >/dev/null 2>&1; then
              echo "✅ Dropbox mounted"
              break
            fi
            sleep 2
          done

      # 2026-10-11 事故根治：本轮（run 38118437892）收尾时 zcode-final.tar.gz 上传
      # 三连败于 path/insufficient_space（Dropbox 配额到顶），step 是 set -e 直接炸出
      # exit 1，且后续 4c/5/rsstt 归档整段被级联跳过。改在起跑最前面预检：配额不足
      # 就发 alert 档 TG 告警并中止本轮（exit 1），不空转 6 小时后死在收尾。
      #   - 判据是 rclone about 的 free 原始字节数，阈值经 JOB_QUOTA_MIN_FREE_KB
      #     环境变量可调（默认 1GiB，收尾要上传的增量约为 GB 级）。
      #   - rclone about / 解析失败只告警放行（fail-open）：预检工具故障不该把整轮
      #     服务全停掉；真配额满了收尾侧的上传失败告警仍在。
      #   - 失败（配额不足）时后续 always() 步骤（Keep alive / Final Archive /
      #     Trigger next 等）按 steps.dropbox_preflight.conclusion 闸门跳过：
      #     Keep alive 对空环境白睡 5.5h、Final Archive 对空环境发连环告警都无意义。
      #     Tailscale 的 post 步骤由 action 自己跑，注销入口不受影响。
      - name: Dropbox quota preflight
        id: dropbox_preflight
        env:
          # 告警凭据走 alert 档（@SaberFuckBot）；缺了则发送留痕但不阻断流程
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_ALERT: ${{ secrets.TELEGRAM_BOT_TOKEN_ALERT }}
          TELEGRAM_CHAT_ID_ALERT: ${{ secrets.TELEGRAM_CHAT_ID_ALERT }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"
          # 阈值默认 1GiB：收尾要上传的归档增量约 GB 级，低于它本轮必在收尾炸
          MIN_FREE_KB="${JOB_QUOTA_MIN_FREE_KB:-$((1 * 1024 * 1024))}"
          # --json 拿原始字节数（人类可读输出的 KiB/MiB 单位换算不可靠），jq 失败
          # 则回退 python3，都没有就放行（fail-open，见步骤头注释）
          ABOUT_JSON=$(rclone about dropbox: --json 2>&1) || ABOUT_RC=1
          if [ "${ABOUT_RC:-0}" != "0" ]; then
            echo "::warning::[dropbox-quota] rclone about 失败，放行本轮：${ABOUT_JSON}"
            exit 0
          fi
          PARSE_FAIL=0
          FREE_BYTES=$(printf '%s' "$ABOUT_JSON" | jq -r '.free // empty' 2>/dev/null) || PARSE_FAIL=1
          if [ "$PARSE_FAIL" != "0" ] || [ -z "${FREE_BYTES:-}" ]; then
            # 回退解析 free/total 分行输出：合一行会让空 free 被 awk 误取 total 的值
            if ABOUT_JSON=$(printf '%s' "$ABOUT_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("free","")); print(d.get("total",""))' 2>/dev/null); then
              FREE_BYTES=$(printf '%s' "$ABOUT_JSON" | sed -n '1p')
            fi
          fi
          case "${FREE_BYTES:-}" in ''|*[!0-9]*)
            echo "::warning::[dropbox-quota] rclone about 无可解析的 free 字段，放行本轮"
            exit 0
          esac
          FREE_KB=$((FREE_BYTES / 1024))
          if [ "${FREE_KB}" -ge "$MIN_FREE_KB" ]; then
            echo "✅ Dropbox 剩余配额充足：$(format_bytes "$FREE_BYTES")（阈值 $(format_bytes "$((MIN_FREE_KB * 1024))")）"
            exit 0
          fi

          # 配额不足：alert 档告警后失败退出（后续步骤按闸门跳过，不再空转）
          _m=""
          tg_add_title _m "🚫 Dropbox 配额不足，本轮已中止"
          tg_add_kv _m "结论" "剩余 $(escape_html "$(format_bytes "$FREE_BYTES")")，低于阈值 $(escape_html "$(format_bytes "$((MIN_FREE_KB * 1024))")")"
          tg_add_kv _m "影响" "所有归档/回推都将失败（path/insufficient_space），本轮提前结束"
          tg_add_section _m "🧹 清理建议"
          _qrows=""
          _qrows+="$(tree_sub 1)检查其他大文件或升级套餐"
          tg_add_block _m "$_qrows"
          tg_add_footer _m
          send_tg "$_m" alert || echo "::warning::[dropbox-quota] TG 告警发送失败"
          exit 1

      - name: Install OpenClaw
        id: install_openclaw
        run: |
          # 2026-10-23：本步骤失败也要能触发失败通知。此前通知只认
          # run_openclaw.outcome == 'failure'，而 run 39888680026 / 39886777685
          # 都是 Install 失败、Run OpenClaw 却成功（doctor 现造配置），通知被静默跳过。
          # 把本步输出落一份到 /tmp，供失败通知取错误摘要。
          exec > >(tee -a /tmp/install-openclaw-step.log) 2>&1
          echo "Installing OpenClaw base..."
          INST_T0=$(date +%s)
          curl -fsSL https://openclaw.ai/install.sh | bash -s -- --no-onboard
          echo "⏱️ install timing: cli_install_sec=$(( $(date +%s) - INST_T0 ))"

          echo "Configuring local ~/.openclaw with Dropbox-linked config..."
          mkdir -p /dropbox/self-hosted/openclaw
          mkdir -p ~/.openclaw
          mkdir -p ~/.openclaw/extensions

          TMP_OPENCLAW_TAR="/tmp/openclaw.tar.gz"
          RESTORE_DIR="/tmp/openclaw-restore"

          # 2026-10-23 恢复来源追踪：通知里要能说清本轮用的是云端主包，
          # 还是历史 revision、以及该 revision 的创建时间。空值 = 未知。
          OPENCLAW_RESTORE_SOURCE=""
          OPENCLAW_RESTORE_REV=""
          OPENCLAW_RESTORE_REV_TIME=""

          cleanup_archive_workdir() {
            rm -f "$TMP_OPENCLAW_TAR" 2>/dev/null || true
            rm -rf "$RESTORE_DIR" 2>/dev/null || true
          }
          free_kb() { df -Pk "${1:-/tmp}" | awk 'NR==2 {print $4}'; }
          require_free_kb() {
            local path="$1" min_kb="$2" label="$3"
            local avail
            avail=$(free_kb "$path")
            if [ "${avail:-0}" -lt "$min_kb" ]; then
              echo "❌ ${label}: insufficient free space at ${path}. available=${avail}KB required=${min_kb}KB" >&2
              exit 1
            fi
            echo "✅ ${label}: free space ok at ${path}. available=${avail}KB required=${min_kb}KB"
          }
          require_free_kb /tmp $((2 * 1024 * 1024)) "openclaw restore preflight"

          cleanup_archive_workdir
          mkdir -p "$RESTORE_DIR"

          echo "📦 Restoring ~/.openclaw: prefer archive, fallback to raw directory sync..."
          # 2026-10-02 加固：rclone 对 Dropbox 的瞬时失败（token 刷新/限流/挂载抖动）曾把
          # 「探测失败」误判成「无归档」→ 落入 else 从**空的**原始目录兜底（openclaw/ 目录
          # 早已清空，兜底恒为 no-op）→ ~/.openclaw 空壳静默上岗：网关起不来、归档循环
          # 连续 12 轮 rc=4 告警（2026-10-02 04:09-08:16）。探测重试 3 次再定性，
          # 瞬态不至于丢掉整份主包恢复。
          ARCHIVE_PRESENT=0
          for _probe in 1 2 3; do
            if rclone ls dropbox:self-hosted/openclaw.tar.gz > /dev/null 2>&1; then
              ARCHIVE_PRESENT=1
              break
            fi
            echo "⚠️ rclone ls 探测归档失败（第 ${_probe}/3 次），15s 后重试..."
            sleep 15
          done
          if [ "$ARCHIVE_PRESENT" = "1" ]; then
            echo "📦 Found openclaw.tar.gz! Downloading and extracting..."
            INST_T1=$(date +%s)
            # 主包下载已在 Prefetch cold artifacts 步骤里于后台起跑（实测 9.3GB / 54s
            # 是纯串行等待）。这里只等它收尾：轮询 rc 文件（prefetch 进程先没了就立刻收，
            # 不空等），命中则 mv 进恢复路径 —— 同一文件系统，mv 是 rename 不是拷贝。
            # 未命中/失败一律回落原有同步下载，判据与语义不变。
            PREFETCH_DIR="/tmp/openclaw-prefetch"
            if [ -f "$PREFETCH_DIR/openclaw-tar.pid" ]; then
              _pf_waited=0
              while [ ! -f "$PREFETCH_DIR/openclaw-tar.rc" ] && [ "$_pf_waited" -lt 900 ]; do
                _pf_pid="$(cat "$PREFETCH_DIR/openclaw-tar.pid" 2>/dev/null | tr -dc '0-9')"
                [ -n "$_pf_pid" ] || break
                kill -0 "$_pf_pid" 2>/dev/null || break
                sleep 2
                _pf_waited=$((_pf_waited + 2))
              done
              _pf_rc="$(cat "$PREFETCH_DIR/openclaw-tar.rc" 2>/dev/null || echo none)"
              if [ "$_pf_rc" = "0" ] && [ -s "$PREFETCH_DIR/openclaw.tar.gz" ]; then
                mv "$PREFETCH_DIR/openclaw.tar.gz" "$TMP_OPENCLAW_TAR"
                rm -f "$PREFETCH_DIR/openclaw.tar.gz.part" "$PREFETCH_DIR/openclaw-tar.rc" "$PREFETCH_DIR/openclaw-tar.pid" 2>/dev/null || true
                echo "✅ 主包 prefetch 命中（等待 ${_pf_waited}s）"
              else
                # 回落同步下载前必须清掉 prefetch 的 .part：后台进程被杀时不会自己删，
                # 残留的 9GB 会把 /tmp 挤到解包预检（kb*3+1GB）硬失败 —— 白丢一整轮。
                echo "⚠️ 主包 prefetch 未命中（rc=${_pf_rc}），回落同步下载"
                rm -f "$PREFETCH_DIR/openclaw.tar.gz.part" 2>/dev/null || true
                rclone copyto dropbox:self-hosted/openclaw.tar.gz "$TMP_OPENCLAW_TAR"
              fi
            else
              rm -f "$PREFETCH_DIR/openclaw.tar.gz.part" 2>/dev/null || true
              rclone copyto dropbox:self-hosted/openclaw.tar.gz "$TMP_OPENCLAW_TAR"
            fi
            # 2026-10-02 二次事故：云端主包被 98KB 空壳包覆盖后仍被恢复上岗 —— 恢复侧原
            # 只验 gzip 完整性（98KB 空壳照样通过），而 preflight doctor 会现造一份合法
            # 配置骗过归档侧 config validate，健康门全绿后空壳照样打上行。恢复是最后防线：
            # 真实主包 GB 级，50MB 绝对下限留约两个数量级余量，且 openclaw.json 必须真实
            # 在包内。结构判据之外 2026-10-11 加配置预检：任一不满足 → 走 Dropbox revision
            # 回退（候选上限 100）逐个验到能过为止，全部不可用才 exit 1（任务失败→通知）。
            # 宁可失败，不要空壳/坏配置上岗。
            #
            # 2026-10-21 改成单趟：上面四道判据一条没减，但读的是**解包之后的盘上文件**。
            # 旧实现对同一个包解了三趟全量流 —— listing_has_config 的 tar -tf、ARCHIVE_OK
            # 的 tar -tf、最终 tar -xf，实测白烧 ~180s CPU+IO。第二趟想换来的「gzip 流
            # 完整、tar 结构没坏」这个信息，一趟带写入的解压本来就用非零退出码给出了。
            # 顺带修掉一处哑门：旧流程在 if 之外做 `_verdict="$(config_precheck_ok ...)"`
            # 赋值，本步骤跑在 bash -e 下，配置判据一旦 FAIL 就直接把整步打死，
            # revision 回退分支根本走不到 —— 预检越严，回退越是死代码。
            OPENCLAW_TARBALL_MIN_KB=$((50 * 1024))
            extract_openclaw_archive() {
              # 用法: extract_openclaw_archive <tar.gz 路径> <落点目录>
              # pigz 并行解压（2026-10-02 实测 305MB 样本 5.44s → 3.29s；产物是标准
              # gzip 流，与 tar -xzf 完全兼容）。pipefail 必须开：否则 tar 的失败会被
              # pigz 的成功码掩盖。
              local tar="$1" dest="$2"
              rm -rf "$dest"
              mkdir -p "$dest"
              if command -v pigz >/dev/null 2>&1; then
                ( set -o pipefail; pigz -dc "$tar" | tar -xf - -C "$dest" )
              else
                tar -xzf "$tar" -C "$dest"
              fi
            }
            validate_openclaw_tree() {
              # 用法: validate_openclaw_tree <解包落点>，stdout 给 PASS/SKIP/FAIL 结论
              # 三道判据由宽到严：结构（openclaw.json 真在包里）→ 配置语义 → secrets 可解析性。
              # 配置判据（2026-10-11）：主包可能顶着「结构完好」被恢复上岗，网关却因配置
              # 语义坏起不来，且每轮恢复同一份坏主包、无自动出口 —— 归档侧 config validate
              # 门（退出码 5 不覆盖云端）只挡得住「归档时配置已坏」，挡不住「归档时健康、
              # 运行中写坏」的形态（2026-09-18 事故）。
              # 二进制不可得（openclaw 未装上/安装失败）时跳过语义判据、只按结构放行：
              # 没有校验器比有结构校验强，拦死恢复反而让下一轮连结构兜底都没了。
              # secrets 判据（2026-10-19 事故 run 39229141269）：config validate 不校验
              # SecretRef 可解析性，「新增 telegram 账号但 env 变量没进 secrets allowlist」
              # 的配置照样 validate PASS，网关却在 secrets 激活阶段恒崩（required secrets
              # are unavailable）→ 自愈链（doctor / 回退同版本重装）对该故障无出口，反复
              # 恢复同一份坏主包死循环。unresolved>0 即判不合格，回退到「能真正启动」的
              # 历史版本为止。audit 从 $OPENCLAW_STATE_DIR/.env 取值 —— 单趟解包后 .env
              # 已在盘上（老 revision 包内没有 .env 也不会错杀：老式明文配置不依赖 env
              # 引用，audit 仍给 unresolved=0）。audit 自身崩溃按不合格处理 —— 宁可回退，
              # 不可放行必坏包。
              local root="$1"
              if [ ! -s "$root/.openclaw/openclaw.json" ]; then
                echo "FAIL (openclaw.json missing)"
                return 1
              fi
              command -v openclaw >/dev/null 2>&1 || { echo "SKIP (openclaw not on PATH)"; return 0; }
              if ! OPENCLAW_CONFIG_PATH="$root/.openclaw/openclaw.json" openclaw config validate >/dev/null 2>&1; then
                echo "FAIL (config invalid)"
                return 1
              fi
              local audit_out audit_rc unresolved_n
              if audit_out="$(OPENCLAW_STATE_DIR="$root/.openclaw" OPENCLAW_CONFIG_PATH="$root/.openclaw/openclaw.json" timeout 120 openclaw secrets audit 2>&1)"; then
                echo "PASS"
                return 0
              fi
              audit_rc=$?
              unresolved_n="$(printf '%s' "$audit_out" | grep -oE 'unresolved=[0-9]+' | head -n 1 | cut -d= -f2 || true)"
              if [ -n "${unresolved_n:-}" ] && [ "${unresolved_n}" -gt 0 ]; then
                echo "FAIL (secrets unresolved=${unresolved_n})"
                return 1
              fi
              echo "FAIL (secrets audit rc=${audit_rc})"
              return 1
            }
            try_openclaw_candidate() {
              # 用法: try_openclaw_candidate <tar.gz 路径> <对象名>
              # 通过 = 体积达标 + 能完整解开 + 盘上判据全过，解好的树留在 $RESTORE_DIR 等就位；
              # 任一不过 = 清掉 $RESTORE_DIR，绝不让下一个候选对着上一次的半成品判。
              local tar="$1" label="$2" kb
              kb="$(du -sk "$tar" 2>/dev/null | awk '{print $1}')"
              if [ -z "${kb:-}" ] || [ "$kb" -le 0 ]; then
                echo "⚠️ ${label}: 无法取得包体积，按不可用处理"
                return 1
              fi
              echo "${label} 大小: ${kb}KB"
              if [ "$kb" -lt "$OPENCLAW_TARBALL_MIN_KB" ]; then
                echo "⚠️ ${label} 体积不足（${kb}KB < ${OPENCLAW_TARBALL_MIN_KB}KB），按空壳处理"
                return 1
              fi
              require_free_kb /tmp $((kb * 3 + 1024 * 1024)) "${label} extract preflight"
              if ! extract_openclaw_archive "$tar" "$RESTORE_DIR"; then
                echo "⚠️ ${label} 解包失败（gzip 流不完整或 tar 结构坏）"
                rm -rf "$RESTORE_DIR"
                return 1
              fi
              OPENCLAW_RESTORE_VERDICT="$(validate_openclaw_tree "$RESTORE_DIR" || true)"
              if [[ "$OPENCLAW_RESTORE_VERDICT" == FAIL* ]]; then
                echo "⚠️ ${label} 判据未通过（${OPENCLAW_RESTORE_VERDICT}），不采用"
                rm -rf "$RESTORE_DIR"
                return 1
              fi
              echo "✅ ${label} 结构+配置+secrets 判据通过（${OPENCLAW_RESTORE_VERDICT}）"
              return 0
            }
            tarball_usable=0
            if try_openclaw_candidate "$TMP_OPENCLAW_TAR" "云端主包"; then
              tarball_usable=1
              OPENCLAW_RESTORE_SOURCE="cloud-main"
            else
              echo "⚠️ 云端主包不可用，尝试 revision 回退..."
              DBX_TOKEN=$(rclone config show dropbox 2>/dev/null | sed -n 's/^token = .*"access_token":"\([^"]*\)".*/\1/p' | tail -1)
              if [ -n "$DBX_TOKEN" ]; then
                # limit=100（Dropbox API 上限即 100）：历史版本要多捞些，逐个验到能过为止
                mapfile -t GOOD_REVS < <(curl -s --max-time 60 -X POST https://api.dropboxapi.com/2/files/list_revisions \
                  -H "Authorization: Bearer $DBX_TOKEN" -H "Content-Type: application/json" \
                  -d '{"path":"/self-hosted/openclaw.tar.gz","mode":"path","limit":100}' \
                  | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r['rev'] + '|' + r.get('server_modified','')) for r in d.get('entries',[]) if r.get('size',0) >= ${OPENCLAW_TARBALL_MIN_KB} * 1024]" 2>/dev/null)
                echo "revision 候选（体积达标）: ${#GOOD_REVS[@]} 个"
                _rev_n=0
                for _entry in "${GOOD_REVS[@]:-}"; do
                  [ -z "$_entry" ] && continue
                  _rev="${_entry%%|*}"
                  _rev_time="${_entry#*|}"
                  [ "$_rev_time" = "$_entry" ] && _rev_time=""
                  _rev_n=$((_rev_n + 1))
                  echo "⬇️ 下载历史 revision $_rev（创建于 ${_rev_time:-未知}，候选 $_rev_n/${#GOOD_REVS[@]}）..."
                  # 2026-10-23 修复：files/download 的参数必须放 Dropbox-API-Arg 头，
                  # 此前是裸 JSON 头 → Dropbox 直接 400 拒掉，95 个候选全在 1s 内
                  # 全灭且无任何判据输出，回退名存实亡。-f 让 4xx 显式失败，
                  # 失败时打印 rc 与响应前几行，不再盲试。
                  if curl -fsS --max-time 1800 -X POST https://content.dropboxapi.com/2/files/download \
                     -H "Authorization: Bearer $DBX_TOKEN" \
                     -H "Dropbox-API-Arg: {\"path\":\"/self-hosted/openclaw.tar.gz\",\"rev\":\"$_rev\"}" \
                     -o "$TMP_OPENCLAW_TAR" \
                     && try_openclaw_candidate "$TMP_OPENCLAW_TAR" "revision $_rev"; then
                    tarball_usable=1
                    OPENCLAW_RESTORE_SOURCE="revision"
                    OPENCLAW_RESTORE_REV="$_rev"
                    OPENCLAW_RESTORE_REV_TIME="$_rev_time"
                    echo "✅ 已采用历史 revision $_rev（创建于 ${_rev_time:-未知}）"
                    break
                  else
                    _rev_rc=$?
                    echo "⚠️ revision $_rev 不可用（rc=${_rev_rc}）: $(head -c 120 "$TMP_OPENCLAW_TAR" 2>/dev/null)"
                    rm -f "$TMP_OPENCLAW_TAR"
                  fi
                done
              else
                echo "⚠️ 未能从 rclone 配置取到 Dropbox token，跳过 revision 回退"
              fi
            fi
            if [ "$tarball_usable" -ne 1 ]; then
              echo "❌ 云端主包与全部候选 revision 均不可用（体积/解包/配置/secrets 判据未通过）：拒绝用坏状态上岗" >&2
              exit 1
            fi
            # 判据已在盘上过，剩下的唯一动作是就位：清空 ~/.openclaw 后把通过校验的树搬过去。
            # cp -a → mv（2026-10-02）：/tmp 与 $HOME 实测同一文件系统（设备号相同），跨目录
            # mv 是 rename 而非拷贝 —— 6.39GiB 实测 cp -a 37.3s → mv 0.002s，语义等价（同样
            # 先清空再放入新内容）。回退：若将来换机导致跨设备 mv 失败，重建目录并退回 cp -a。
            if [ -d "$RESTORE_DIR/.openclaw" ]; then
              find ~/.openclaw -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              if rmdir "$HOME/.openclaw" 2>/dev/null && mv "$RESTORE_DIR/.openclaw" "$HOME/.openclaw" 2>/dev/null; then
                :
              else
                mkdir -p "$HOME/.openclaw"
                cp -a "$RESTORE_DIR/.openclaw/." "$HOME/.openclaw/"
              fi
              echo "✅ Restored ~/.openclaw from archive"
              echo "⏱️ install timing: wait_prefetch_and_extract_sec=$(( $(date +%s) - INST_T1 ))"
            else
              echo "⚠️ Archive does not contain .openclaw root, skipping archive restore."
            fi
            cleanup_archive_workdir
          else
            echo "⚠️ No openclaw archive found. Falling back to sync from raw directory..."
            OPENCLAW_RESTORE_SOURCE="raw-dir"
            rclone copy dropbox:self-hosted/openclaw ~/.openclaw \
              --retries 10 \
              --low-level-retries 20 \
              --timeout 1m \
              --contimeout 15s \
              --exclude "logs/**" \
              -P || true
          fi

          # 恢复来源落盘：跨 step 只能走文件（🟢 就绪通知 / 🚨 自愈失败通知都会读）。
          {
            printf 'OPENCLAW_RESTORE_SOURCE=%s\n' "${OPENCLAW_RESTORE_SOURCE:-unknown}"
            printf 'OPENCLAW_RESTORE_REV=%s\n' "${OPENCLAW_RESTORE_REV:-}"
            printf 'OPENCLAW_RESTORE_REV_TIME=%s\n' "${OPENCLAW_RESTORE_REV_TIME:-}"
          } > /tmp/openclaw-restore-meta.env

          # 恢复后诊断：主包里到底恢复了什么（判断是否缺关键文件/状态库）
          echo "=== restored ~/.openclaw ==="
          ls -A ~/.openclaw | sort || true
          echo "⏱️ install timing total_sec=$(( $(date +%s) - INST_T0 ))"
          du -sh ~/.openclaw 2>/dev/null || true
          stat -c '%s bytes  %n' ~/.openclaw/openclaw.json 2>/dev/null || echo "⚠️ openclaw.json 不存在"
          ls -l ~/.openclaw/state 2>/dev/null || echo "⚠️ state/ 不存在"
          # 2026-10-02 硬后置校验：恢复完成后 openclaw.json 必须在盘上。原设计只「大声
          # 标记」、指望 Run OpenClaw 启动失败路径兜底 —— 实测不成立：preflight doctor
          # 会现造一份合法配置让网关健康上岗（当轮 98KB 空壳即此形态），随后空壳照样
          # 被打上行。改为直接 exit 1 硬失败，触发任务失败通知；带病上岗比失败一轮代价大。
          if [ ! -s "$HOME/.openclaw/openclaw.json" ]; then
            echo "❌ 恢复完成后 openclaw.json 仍缺失：本轮状态不全，拒绝继续" >&2
            exit 1
          fi

          # ZCode 数据恢复：~/.zcode 下的个人数据在 runner 重置后会丢，从 Dropbox 主包还原。
          # v2/tasks-index.sqlite 是侧栏会话列表（标题/置顶/归档/未读/删除），不是可再生索引 ——
          # 它只由在线 sessions-index 订阅播种，本地 db 重建不出来，丢了侧栏就是空的。
          # server/ 也入包：它是桌面客户端连接时下载铺开的运行时（约 326MB，含 116MB node），
          # 有包在手就能省掉每轮重新下载。但只在本地**不存在**时铺开 —— 本地已有说明客户端
          # 已部署好（比包内新），覆盖只会把新版本降级成旧版本。
          TMP_ZCODE_TAR="/tmp/zcode-restore.tar.gz"
          ZCODE_RESTORE_DIR="/tmp/zcode-restore"
          rm -rf "$ZCODE_RESTORE_DIR" 2>/dev/null || true
          if rclone ls dropbox:self-hosted/zcode.tar.gz > /dev/null 2>&1; then
            echo "📦 Found zcode.tar.gz! Downloading and extracting..."
            rclone copyto dropbox:self-hosted/zcode.tar.gz "$TMP_ZCODE_TAR"
            if [ -s "$TMP_ZCODE_TAR" ] && tar -tzf "$TMP_ZCODE_TAR" >/dev/null 2>&1; then
              mkdir -p "$ZCODE_RESTORE_DIR"
              tar -xzf "$TMP_ZCODE_TAR" -C "$ZCODE_RESTORE_DIR"
              restored_any=0
              for rel in cli v2; do
                if [ -d "$ZCODE_RESTORE_DIR/.zcode/$rel" ]; then
                  mkdir -p ~/.zcode
                  rm -rf ~/.zcode/$rel
                  cp -a "$ZCODE_RESTORE_DIR/.zcode/$rel" ~/.zcode/$rel
                  echo "✅ Restored ~/.zcode/$rel from archive"
                  restored_any=1
                fi
              done
              if [ "$restored_any" -eq 0 ]; then
                echo "⚠️ Archive contains neither .zcode/cli nor .zcode/v2, skipping ZCode restore."
              fi
              # server 设备身份（v2/certs CA + telemetry-state.json 的 deviceMid）随 v2/ 一起还原。
              # 每次重新部署 server 都会重新生成身份，客户端把归档等本地 UI 状态 keyed 到该身份上；
              # 身份一变，客户端里已归档会话全部复活（2026-09-12 排查结论：归档动作在 runner 侧零落盘）。
              # 复用身份后客户端跨重置认得同一个 server。
              if [ -d "$ZCODE_RESTORE_DIR/.zcode/v2/certs" ]; then
                echo "✅ Restored ~/.zcode/v2 server identity (certs + deviceMid)"
              else
                echo "ℹ️ Archive has no .zcode/v2 identity (old package), server will generate a fresh one."
              fi
              # server/：仅当本地没有时铺开（省一次完整下载）。本地已有则保留 —— 那是客户端
              # 本轮刚部署的版本，可能比包内新，覆盖等于降级。
              if [ -d "$ZCODE_RESTORE_DIR/.zcode/server" ]; then
                if [ -d ~/.zcode/server ]; then
                  echo "ℹ️ ~/.zcode/server 已存在（客户端已部署），保留本地版本、不用包内副本覆盖"
                else
                  mkdir -p ~/.zcode
                  cp -a "$ZCODE_RESTORE_DIR/.zcode/server" ~/.zcode/server
                  echo "✅ Restored ~/.zcode/server from archive (skips this run's re-download)"
                fi
              else
                echo "ℹ️ Archive has no .zcode/server (old package), client will deploy it fresh."
              fi
            else
              echo "⚠️ zcode.tar.gz validation failed, skipping ZCode restore."
            fi
            rm -f "$TMP_ZCODE_TAR" 2>/dev/null || true
            rm -rf "$ZCODE_RESTORE_DIR" 2>/dev/null || true
            echo "=== restored ~/.zcode ==="
            du -sh ~/.zcode/cli ~/.zcode/v2 ~/.zcode/server 2>/dev/null || true
            ls ~/.zcode/cli/db/db.sqlite ~/.zcode/v2/tasks-index.sqlite 2>/dev/null \
              || echo "⚠️ 还原后未见 db.sqlite/tasks-index.sqlite"
            if command -v sqlite3 >/dev/null 2>&1; then
              # 侧栏条数是「还原是否真的成功」最直接的证据：只报文件存在，无法区分空库与有库
              echo "tasks-index rows: $(sqlite3 ~/.zcode/v2/tasks-index.sqlite 'select count(*) from tasks' 2>/dev/null || echo '?')"
              echo "db.sqlite sessions: $(sqlite3 ~/.zcode/cli/db/db.sqlite 'select count(*) from session' 2>/dev/null || echo '?')"
            fi
          else
            echo "ℹ️ No zcode.tar.gz found on Dropbox (first run), skipping ZCode restore."
          fi

          npm i -g @google/gemini-cli
          npm i -g clawhub


      - name: Restore skill symlink for proactivity
        run: |
          set -euo pipefail
          # Persist real Proactivity state under ~/.openclaw, keep ~/proactivity as compatibility symlink.
          mkdir -p "$HOME/.openclaw/workspace/skills-data/proactivity"
          if [ -e "$HOME/proactivity" ] && [ ! -L "$HOME/proactivity" ]; then
            cp -a "$HOME/proactivity/." "$HOME/.openclaw/workspace/skills-data/proactivity/" 2>/dev/null || true
            mv "$HOME/proactivity" "$HOME/proactivity.migrated.$(date -u +%Y%m%dT%H%M%SZ)"
          elif [ -L "$HOME/proactivity" ]; then
            rm "$HOME/proactivity"
          fi
          ln -sfn "$HOME/.openclaw/workspace/skills-data/proactivity" "$HOME/proactivity"
          chmod 700 "$HOME/.openclaw/workspace/skills-data/proactivity" || true
          find "$HOME/.openclaw/workspace/skills-data/proactivity" -type d -exec chmod 700 {} + 2>/dev/null || true
          find "$HOME/.openclaw/workspace/skills-data/proactivity" -type f -exec chmod 600 {} + 2>/dev/null || true
          ls -ld "$HOME/proactivity" "$HOME/.openclaw/workspace/skills-data/proactivity"

      - name: Clean stale Tailscale nodes (openclaw* 僵尸清退)
        id: ts_clean
        if: ${{ always() && (env.TS_API_KEY != '' || (env.TS_OAUTH_CLIENT_ID != '' && env.TS_OAUTH_CLIENT_SECRET != '')) }}
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          set -euo pipefail
          # 上一轮被 360m 硬上限强杀时，tailscale/github-action 的 post-logout 不跑，
          # 节点虽为 ephemeral（action 注册即带 ephemeral=true，源码实测），但控制面
          # 清理有几十分钟级延迟，singleton 立即接力的下一轮仍会撞名 —— 新轮
          # 会被控制面静默退化成 openclaw-1/-2…（2026-09-30 实锤，KeyExpiry=null）。
          # 本步骤先于 Setup Tailscale 执行：此刻 tailnet 里的 openclaw* 一律是历史
          # 残留（含 openclaw-N / openclaw-tmp-*），逐个删除，从根上消掉退化。
          #
          # ⚠️ 关键坑（2026-10-01 实测）：Tailscale API **不用 Bearer**！
          #    此前一律用 -H "Authorization: Bearer ..." 打，无论 tskey-client-*
          #    还是 tskey-api-* 都返回 401/404，被误判成「scope 不足」，守护因此
          #    空转了很久（连代码注释都跟着写错了结论）。正确用法是 Basic auth：
          #      curl -u "${KEY}:" https://api.tailscale.com/api/v2/...
          #    （key 作用户名、密码留空）
          # 凭据优先级：
          #   ① TS_API_KEY（tskey-api-*）—— API access token，具 devices 读写权限；
          #   ② 无则回退 OAuth client（tskey-client-*）—— 仅兼容保留，实测无 devices 权限。
          _auth=()
          if [ -n "${TS_API_KEY:-}" ]; then
            echo "1. 使用 TS_API_KEY（API access token · Basic auth）..."
            _auth=(-u "${TS_API_KEY}:")
          else
            echo "1. OAuth client -> token（scope 仅 auth_keys，预计列设备失败）..."
            _tok="$(curl -fsS --max-time 20 https://api.tailscale.com/api/v2/oauth/token \
              --data-urlencode "client_id=${TS_OAUTH_CLIENT_ID}" \
              --data-urlencode "client_secret=${TS_OAUTH_CLIENT_SECRET}" \
              --data-urlencode "grant_type=client_credentials" 2>/dev/null \
              | jq -r '.access_token // empty' 2>/dev/null || true)"
            if [ -z "${_tok}" ]; then
              echo "⚠️ 未能取得 Tailscale API token，跳过僵尸清退（本轮可能仍退化 openclaw-1）"
              exit 0
            fi
            _auth=(-H "Authorization: Bearer ${_tok}")
          fi
          echo "2. 拉取 tailnet 设备列表..."
          _dev_code="$(curl -s -o /tmp/ts-devices.json -w '%{http_code}' --max-time 20 \
            "${_auth[@]}" \
            https://api.tailscale.com/api/v2/tailnet/-/devices 2>/dev/null || true)"
          if [ "${_dev_code}" != "200" ]; then
            echo "⚠️ 设备列表获取失败 (HTTP ${_dev_code})：僵尸清退未生效"
            if [ -z "${TS_API_KEY:-}" ]; then
              echo "   根因：tskey-client-* 只有 auth_keys scope，天生无 devices 权限"
              echo "   补法：Tailscale admin → Settings → Keys → 生成 tskey-api-* 存为 TS_API_KEY"
            else
              echo "   TS_API_KEY 已配置但仍失败：多为认证方式非 Basic（-u \"KEY:\"），或 key 已撤销/过期"
            fi
            rm -f /tmp/ts-devices.json
            exit 0
          fi
          _dev="$(cat /tmp/ts-devices.json)"
          rm -f /tmp/ts-devices.json
          # 注册前运行：openclaw* 一律视为残留。按 hostname/name 双字段匹配，
          # 覆盖 openclaw / openclaw-1 / openclaw-tmp-* 全家族。
          #
          # ⚠️ 只删「断连」节点，绝不碰活着的（2026-10-01 实测加固）：
          #    权限打通前本步骤因删不动而“安全”；一旦能删，无差别 test("openclaw")
          #    会命中**当前仍在跑的那一轮自己** —— job 重试/手动重触发时开场就把
          #    自己的 SSH 入口删掉（自杀）。故必须加 connectedToControl == false。
          #    判据说明：设备列表**没有 online 字段**（别用 .online // false ——
          #    jq 的 // 对字段缺失同样取右值，会静默把活节点判成离线，已踩）；
          #    真实在线判据是 connectedToControl。实测真僵尸该值为 false，
          #    在跑的节点为 true。
          # 活着的同名节点交给 Enable Tailscale SSH 的临时名中转去回收，不在这里硬删。
          _stale="$(printf '%s' "${_dev}" | jq -r '
            (.devices // [])[]?
            | select(((.hostname // "") + " " + (.name // "")) | test("openclaw"))
            | select(.connectedToControl == false)
            | .id' 2>/dev/null || true)"
          if [ -z "${_stale}" ]; then
            echo "✅ 无 openclaw* 残留节点，跳过删除"
            exit 0
          fi
          echo "3. 发现 $(printf '%s' "${_stale}" | grep -c .) 个残留节点，逐个删除..."
          for _id in ${_stale}; do
            _code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X DELETE \
              "${_auth[@]}" \
              "https://api.tailscale.com/api/v2/device/${_id}" 2>/dev/null || true)"
            case "${_code}" in
              200|204) echo "✅ 已删除残留节点 ${_id} (HTTP ${_code})" ;;
              *) echo "⚠️ 删除 ${_id} 失败 (HTTP ${_code})：凭据无 devices 写权限或该节点不可管理" ;;
            esac
          done
      - name: Tailscale daemon 纳管 (systemd)
        id: ts_daemon
        # 2026-10-23：本步骤与 OpenClaw 无关，不能因前置 Install OpenClaw 失败而被
        # 默认 success() 跳过 —— run 39858698391 就是这样：Install 失败 → 本步 skipped
        # → 下一步 Setup Tailscale 仍用 always() 跑，却没有托管 daemon，直接失败。
        if: ${{ always() }}
        # 长驻服务一律 systemd 托管（2026-10-05 主人拍板）。必须在
        # tailscale/github-action **之前**执行，原因见下方接管原理。
        run: |
          set -uo pipefail
          if [ -f "$GITHUB_WORKSPACE/.github/scripts/services/services.sh" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/services/services.sh" ensure tailscaled || true
          else
            echo "⚠️ services.sh 缺失，沿用 action 自带的 --state=mem: 裸跑"
          fi
          # 接管原理（2026-10-05 实测）：
          #   action 内部无条件 spawn `sudo -E tailscaled --state=mem:`。若本单元
          #   已占据 TUN，action 那个实例会因 "TUN device tailscale0 is busy" 立即
          #   退出；但 action 随后 waitForDaemonReady() 轮询的是**默认 socket**
          #   （即本单元），拿到响应即判定就绪，接着 connectToTailscale 的
          #   `tailscale up` 同样打在本单元上 —— 于是登录态落到托管的 daemon。
          #   第二个实例的退出码被 action 忽略（detached + unref），不会 fail 步骤。
          #
          # 为什么必须 --statedir 而非 --state=mem:（实测踩坑）
          #   mem: 把登录态只放内存，进程一死认证即丢，Restart=always 拉起来的
          #   只是个 Logged out 空壳 —— 托管形同虚设。statedir 落盘后崩溃重启
          #   自动恢复登录，自愈才是真的自愈。
          #
          # 过渡期：若本机已有 action 起的 mem: 裸跑实例，ensure 会检测并跳过
          #   （不抢占 TUN、不打断当前 SSH），单元在新 VM 上自动接管。
      - name: Setup Tailscale (SSH 调试入口)
        id: ts
        # daemon 纳管没成功就不要硬跑 action：否则失败会看起来像 Tailscale 本身坏了，
        # 实际是前置步骤被跳过（run 39858698391 的级联失败）。
        if: ${{ always() && steps.ts_daemon.outcome == 'success' && env.TS_OAUTH_CLIENT_ID != '' && env.TS_OAUTH_CLIENT_SECRET != '' }}
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          # 与 systemd 单元用同一 statedir：即便本轮是 action 的实例抢到了 TUN，
          # 登录态也落盘，下一轮单元接管时无需重新认证。
          statedir: /var/lib/tailscale
          # 注册时就固定主机名（action v4 原生 hostname 入参，实测 306e68a 的
          # action.yml 有该 input）：此前是「先按 runner 名注册、再 set --hostname
          # 改名」，两步之间存在竞态 —— 注册瞬间若 tailnet 里还有上一轮的
          # openclaw 残留，控制面当场就分配 openclaw-1，事后 set 改不回来
          # （prefs 里 Hostname 写对了，DNS 名仍是 openclaw-1，2026-10-01 实锤）。
          # 注册即声明能消掉这个窗口，是防退化的第一优先手段。
          hostname: openclaw

      - name: Enable Tailscale SSH
        id: ts_ssh
        if: ${{ always() && steps.ts.outcome == 'success' }}
        run: |
          set -euo pipefail
          # 开启 Exit Node 前置条件：启用内核转发
          echo 'net.ipv4.ip_forward = 1' | sudo tee /etc/sysctl.d/99-tailscale-forward.conf
          echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.d/99-tailscale-forward.conf
          sudo sysctl -p /etc/sysctl.d/99-tailscale-forward.conf

          # 固定主机名 openclaw（singleton 并发下不会撞名）；节点为 ephemeral，job 结束自动移除
          # 开启 Exit Node：tailnet 内设备可将本 runner 设为出口节点
          # 批准方式（任选其一）：
          #   ① 管理页手动批准: https://login.tailscale.com/admin/machines → 找到 openclaw 节点
          #      → Edit route settings → 勾选 0.0.0.0/0, ::/0（ephemeral 节点每次运行都需重新批准）
          #   ② ACL autoApprovers（推荐，免每次批准）: 在 Tailscale ACL rules 前加：
          #        "autoApprovers": {
          #          "routes": { "0.0.0.0/0": ["tag:ci"], "::/0": ["tag:ci"] }
          #        },
          #   ③ Tailscale API 程序化批准:
          #      GET  https://api.tailscale.com/api/v2/tailnet/{tailnet}/devices  查到节点 id
          #      POST https://api.tailscale.com/api/v2/device/{device_id}/routes  body: {"routes": ["0.0.0.0/0", "::/0"]}
          #      （需 TS_API_KEY，ephemeral 节点 id 每次变化，需按主机名动态查询）
          sudo tailscale set --ssh --hostname=openclaw --advertise-exit-node
          # 回读实际注册的 DNS 名。--hostname 的重命名有传播延迟，若 set 后立刻读取
          # 可能拿到机器原始主机名（如 github-runnervmgx7h7），导致 ts.env 里的 SSH/
          # RustDesk 直连地址每轮漂移。这里轮询等待名字收敛为 openclaw。
          # tailnet 后缀（形如 xxxx.ts.net）动态取，避免硬编码到别的 tailnet 时写歪。
          TS_SUFFIX="$(tailscale status --json | jq -r '.Self.DNSName // empty' | sed 's/\.$//')"
          TS_SUFFIX="${TS_SUFFIX#*.}"
          TS_FQDN=""
          for i in $(seq 1 15); do
            TS_FQDN="$(tailscale status --json | jq -r '.Self.DNSName // empty' | sed 's/\.$//')"
            case "$TS_FQDN" in
              "openclaw.${TS_SUFFIX}") break ;;
            esac
            sleep 2
          done

          # 固定主机名 openclaw（2026-09-30 补）：撞名时控制面会**静默拒绝**并退化成
          # openclaw-1/-2…，根因是上一轮同名 ephemeral 节点残留在 tailnet——离线也照样占名。
          # 直连 set 对这种情况无效（prefs 里 Hostname 已写对，但 DNS 名仍是 openclaw-1）。
          # 兜底：先改到一个临时名把 openclaw 让出来，再改回去 —— 实测可强制收回名字。
          if [ "${TS_FQDN:-}" != "openclaw.${TS_SUFFIX}" ]; then
            echo "⚠️ 主机名被占（当前 ${TS_FQDN:-未知}），走临时名中转回收 openclaw"
            sudo tailscale set --hostname="openclaw-tmp-$$" 2>&1 || true
            for i in $(seq 1 10); do
              _TMP_FQDN="$(tailscale status --json | jq -r '.Self.DNSName // empty' | sed 's/\.$//')"
              case "$_TMP_FQDN" in
                "openclaw-tmp-$$.${TS_SUFFIX}") break ;;
              esac
              sleep 3
            done
            sudo tailscale set --ssh --hostname=openclaw --advertise-exit-node 2>&1 || true
            TS_FQDN=""
            for i in $(seq 1 12); do
              TS_FQDN="$(tailscale status --json | jq -r '.Self.DNSName // empty' | sed 's/\.$//')"
              case "$TS_FQDN" in
                "openclaw.${TS_SUFFIX}") break ;;
              esac
              sleep 5
            done
          fi
          TS_FQDN="${TS_FQDN:-$(tailscale status --json | jq -r '.Self.DNSName // empty' | sed 's/\.$//')}"
          TS_HOST="$(printf '%s' "$TS_FQDN" | cut -d. -f1)"
          {
            printf 'TS_HOST=%s\n' "$TS_HOST"
            printf 'TS_FQDN=%s\n' "$TS_FQDN"
            printf 'TS_IP=%s\n' "$(tailscale ip -4)"
          } > "$HOME/ts.env"
          echo "SSH 入口: ssh runner@${TS_HOST}（RustDesk 直连: ${TS_FQDN}:21118）"

          # ---------- 主机名回收守护（2026-10-01 补）----------
          # 为什么必须有守护：上面所有回收动作都只在本步骤**这一刻**试一次，而残留的
          # 上一轮 ephemeral 节点要几十分钟后才被控制面清掉 —— 名字是在本步骤结束后
          # 才空出来的，那时已经没有任何东西再去收回，于是这一整轮都顶着 openclaw-1。
          # 2026-10-01 实锤：ts.env 写着 TS_HOST=openclaw-1，而控制面 prefs 里
          # Hostname 其实是对的 openclaw（= 名被别人占着，不是我们设错）。
          # 且「Clean stale」步骤删不动（本仓库 OAuth client 只有 auth_keys scope，
          # devices 列表接口 404，整段降级跳过）—— 删不掉就只能等，等就必须有人重试。
          # 故起一个脱离本步骤进程树的守护，在整个 job 生命周期内周期重试回收：
          #   名字一旦变回 openclaw → 重写 ts.env，RustDesk/通知/serve 地址随之自愈。
          # setsid + nohup 脱离进程树；job 结束随 runner 一起消失，无需收尾清理。
          mkdir -p "$HOME/.openclaw/logs"
          if [ "${TS_FQDN:-}" != "openclaw.${TS_SUFFIX}" ]; then
            echo "🔁 当前名为 ${TS_FQDN}，启动后台回收守护（每 120s 重试收回 openclaw）"
            # 守护脚本本体独立成文件（.github/scripts/tailscale/ts-reclaim-hostname.sh）：
            # 内联 heredoc 里的行不带 YAML 块缩进，会打断 run 的缩进层级（实测 YAML 解析报
            # "could not find expected ':'"）——脚本独立出去，workflow 里只剩一行调用。
            setsid nohup bash "${GITHUB_WORKSPACE}/.github/scripts/tailscale/ts-reclaim-hostname.sh" \
              "${TS_SUFFIX}" "${GITHUB_RUN_ID:-0}" \
              >> "$HOME/.openclaw/logs/ts-reclaim.log" 2>&1 < /dev/null &
            disown 2>/dev/null || true
            sleep 1
            echo "✅ 回收守护已启动（日志: ~/.openclaw/logs/ts-reclaim.log）"
          else
            echo "✅ 主机名已为 openclaw，无需回收守护"
          fi

          # 两个后台各占一个端口、各占根路径 /admin：trae2api 8080、zcode-hub 8081。
          # 分开端口是因为两者前端都用绝对路径 /admin，同端口会打架。
          # tailscaled 以 --state=mem: 运行（runner 临时态设计），签不了 HTTPS 证书
          # （no TailscaleVarRoot），故用 HTTP —— 流量仍在 WireGuard 隧道内，
          # 安全性与直连后端端口明文等同。serve 配置随内存态逐轮清零，此处幂等重建。
          sudo tailscale serve --bg --http=8081 http://127.0.0.1:8319
          echo "zcode-hub 后台: http://${TS_FQDN}:8081/admin/accounts（API 网关: /v1）"

          sudo tailscale serve --bg --http=8080 http://127.0.0.1:18080
          echo "trae2api 控制台: http://${TS_FQDN}:8080/admin"

          # workbuddy 只读管理台（v1.23.0 -webui，真源 services.sh）：8316 → 8082。
          # 前端资源用相对路径，挂在 /ui/ 子路径即可；管理 Key 独立于模型 API Key
          # （config.json gateway.adminKey），仅 tailnet 内可访问，不做公网暴露。
          sudo tailscale serve --bg --http=8082 http://127.0.0.1:8316
          echo "workbuddy 控制台: http://${TS_FQDN}:8082/ui/"
          # qoder2api-hub 看板（root 路径直出，无 /admin 前缀）：8790 → 8084。
          # 延续后台端口段（trae 8080 / zcode-hub 8081 / wb 8082 / autoclaw 8083）。
          # 面板密码独立于 API Key（PBKDF2 落盘 settings.json），仅 tailnet 内可访问。
          sudo tailscale serve --bg --http=8084 http://127.0.0.1:8790
          echo "qoder2api 看板: http://${TS_FQDN}:8084/（API 网关: /v1）"
          # 2026-10-19 主人要求「其他控制台怎么不使用 https」：6 个后台统一补 HTTPS 入口。
          # tailscaled 虽以 --state=mem: 运行，实测**仍能签发证书**（8443-8448 全通，
          # TLS 校验无需 -k）—— 上面「签不了 HTTPS 证书」的判断只对无端口 443 成立
          # 的历史场景，勿再据此断言带端口 https 不可用。映射与看板 admin_entries 一致：
          #   8443→8316(wb) 8444→18080(trae) 8445→8319(zcode)
          #   8446→8322(autoclaw) 8447→8790(qoder) 8448→20128(omniroute)
          # 证书签发失败不能拖垮整步，统一加兜底 echo（与 443 同款处理）。
          sudo tailscale serve --bg --https=8443 http://127.0.0.1:8316 2>/dev/null \
            || echo "⚠️ 8443 HTTPS serve 失败，HTTP 8082 仍可用"
          sudo tailscale serve --bg --https=8444 http://127.0.0.1:18080 2>/dev/null \
            || echo "⚠️ 8444 HTTPS serve 失败，HTTP 8080 仍可用"
          sudo tailscale serve --bg --https=8445 http://127.0.0.1:8319 2>/dev/null \
            || echo "⚠️ 8445 HTTPS serve 失败，HTTP 8081 仍可用"
          sudo tailscale serve --bg --https=8446 http://127.0.0.1:8322 2>/dev/null \
            || echo "⚠️ 8446 HTTPS serve 失败，HTTP 8083 仍可用"
          sudo tailscale serve --bg --https=8447 http://127.0.0.1:8790 2>/dev/null \
            || echo "⚠️ 8447 HTTPS serve 失败，HTTP 8084 仍可用"
          sudo tailscale serve --bg --https=8448 http://127.0.0.1:20128 2>/dev/null \
            || echo "⚠️ 8448 HTTPS serve 失败，OmniRoute 控制台将无入口"
          echo "HTTPS 控制台: wb=8443 trae=8444 zcode=8445 autoclaw=8446 qoder=8447 omniroute=8448"
          # OmniRoute AI API 无端口 HTTPS 入口：20128 → 443。
          # 公网 ai-api.derrick.eu.org 走 Cloudflare，有 100s 硬超时；tailnet 内这条
          # 前面没有 Cloudflare，慢请求（step-5-preview 深度思考实测单请求 18~330s）
          # 走这里不撞墙。证书由 tailscale 自动签发、客户端免 -k（实测 TLS 校验通过）。
          # ⚠️ 若节点名变更导致证书签发失败，不能让整步挂掉，故加兜底 echo。
          # 网关 Control UI 另走 8085（网关自身无 /v1 路由，443 不能指 18789）。
          sudo tailscale serve --bg --https=443 http://127.0.0.1:20128 2>/dev/null \
            || echo "⚠️ 443 HTTPS serve 失败（多为证书签发/节点名问题），HTTP 端口 serve 不受影响"
          echo "OmniRoute AI API: https://${TS_FQDN}/v1（API Key: CLIPROXYAPI_API_KEY）"
          # 2026-09-30 曾尝试把 trae 挂到 80 端口的 /trae 子路径（依赖 trae2api commit
          # a75ec3e 的前端前缀自适应），后已整体回退：a75ec3e 被 revert（镜像
          # v2026.09.30-46abeff），zcode 也从 80 挪到 8081，与 trae 端口相邻。
          # 公网隧道 trae2api.derrick.eu.org 已于 2026-09-29 撤销（主人要求不再公网暴露）。

      - name: Tailscale secrets missing
        if: ${{ always() && env.TS_OAUTH_CLIENT_ID == '' && env.TS_OAUTH_CLIENT_SECRET == '' }}
        run: echo "⚠️ 未配置 TS_OAUTH_CLIENT_ID / TS_OAUTH_CLIENT_SECRET，跳过 Tailscale SSH 调试入口"

      - name: Prepare runtime env for later steps
        run: |
          set -euo pipefail

          NODE_PATH_ACTUAL="$(command -v node)"
          NODE_BIN_DIR="$(dirname "$NODE_PATH_ACTUAL")"
          NPM_PREFIX="$(npm config get prefix)"
          NPM_GLOBAL_BIN="$NPM_PREFIX/bin"

          echo "$NODE_BIN_DIR" >> "$GITHUB_PATH"
          if [ -d "$NPM_GLOBAL_BIN" ]; then
            echo "$NPM_GLOBAL_BIN" >> "$GITHUB_PATH"
          fi

          echo "node path: $NODE_PATH_ACTUAL"
          echo "node bin dir: $NODE_BIN_DIR"
          echo "npm prefix: $NPM_PREFIX"
          echo "npm global bin: $NPM_GLOBAL_BIN"

          cat > "$HOME/runtime-env.sh" <<'EOF'
          #!/usr/bin/env bash

          # Load OpenClaw env vars
          if [ -f "$HOME/.openclaw/.env" ]; then
            set -a
            . "$HOME/.openclaw/.env"
            set +a
          fi

          # Import GitHub Actions add_path entries so shells inherit setup-node/toolcache PATH
          if [ -d "$HOME/work/_temp/_runner_file_commands" ]; then
            _openclaw_add_path_file=""
            _openclaw_added_path=""
            for _openclaw_add_path_file in "$HOME"/work/_temp/_runner_file_commands/add_path_*; do
              [ -f "$_openclaw_add_path_file" ] || continue
              while IFS= read -r _openclaw_added_path || [ -n "$_openclaw_added_path" ]; do
                [ -n "$_openclaw_added_path" ] || continue
                case ":$PATH:" in
                  *":$_openclaw_added_path:"*) ;;
                  *) PATH="$_openclaw_added_path:$PATH" ;;
                esac
              done < "$_openclaw_add_path_file"
            done
            : "${_openclaw_add_path_file:=}"
            : "${_openclaw_added_path:=}"
          fi

          # Persist GitHub CLI auth locally from GH_TOKEN, so shells without the env can still use gh.
          # Also connect Git HTTPS auth to gh, so plain `git push` can reuse the authenticated flow.
          if command -v gh >/dev/null 2>&1; then
            GH_TOKEN_VALUE="${GH_TOKEN:-}"
            GH_CONFIG_HOME_LOCAL="$HOME/.config/gh"
            GH_HOSTS_FILE_LOCAL="$GH_CONFIG_HOME_LOCAL/hosts.yml"

            if [ -n "$GH_TOKEN_VALUE" ]; then
              mkdir -p "$GH_CONFIG_HOME_LOCAL"
              chmod 700 "$HOME/.config" "$GH_CONFIG_HOME_LOCAL" 2>/dev/null || true

              if ! env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN -u BASH_ENV gh auth status >/dev/null 2>&1; then
                GH_USER_LOGIN="$(gh api user --jq .login 2>/dev/null || true)"
                if [ -n "$GH_USER_LOGIN" ]; then
                  GH_TMP_DIR="$(mktemp -d)"
                  GH_TMP_HOSTS_FILE="$GH_TMP_DIR/hosts.yml"
                  # 不用 heredoc：heredoc 结束符必须顶格，但本脚本是嵌在 YAML 块里生成的、
                  # 每行都带缩进，结束符永远匹配不上 —— 会把 runtime-env.sh 剩余部分整个吞进 hosts.yml
                  {
                    printf 'github.com:\n'
                    printf '    user: %s\n' "${GH_USER_LOGIN}"
                    printf '    oauth_token: %s\n' "${GH_TOKEN_VALUE}"
                    printf '    git_protocol: https\n'
                  } > "$GH_TMP_HOSTS_FILE"
                  chmod 600 "$GH_TMP_HOSTS_FILE" 2>/dev/null || true

                  if GH_CONFIG_DIR="$GH_TMP_DIR" env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN -u BASH_ENV gh auth status >/dev/null 2>&1; then
                    mv "$GH_TMP_HOSTS_FILE" "$GH_HOSTS_FILE_LOCAL"
                    chmod 600 "$GH_HOSTS_FILE_LOCAL" 2>/dev/null || true
                  fi

                  rm -rf "$GH_TMP_DIR" 2>/dev/null || true
                fi
              fi

              [ -f "$GH_HOSTS_FILE_LOCAL" ] && chmod 600 "$GH_HOSTS_FILE_LOCAL" 2>/dev/null || true
            fi

            # Wire Git HTTPS auth through gh so `git push` can reuse gh auth without embedding tokens in remotes.
            gh auth setup-git >/dev/null 2>&1 || true
          fi
          EOF

          chmod +x "$HOME/runtime-env.sh"
          echo "BASH_ENV=$HOME/runtime-env.sh" >> "$GITHUB_ENV"
          
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          sudo mkdir -p ~/.cloudflared/
          sudo cp -r /dropbox/self-hosted/.cloudflared/* ~/.cloudflared/ 2>/dev/null || true
          # 家目录里的状态必须是 runner 属主：sudo 复制会让凭据变成 root 属主，
          # 而 cloudflared 是 runner 身份启动的（读 ~/.cloudflared 会 EACCES）
          sudo chown -R runner:runner ~/.cloudflared

      - name: Run Cloudflared Tunnel
        run: |
          mkdir -p ~/.openclaw/logs

          cloudflared tunnel route dns oc oc.'${{ secrets.VD }}'.eu.org || true
          # Managed by the unified systemd tunnel manager: tunnels get
          # Restart=always, so a killed connector comes back on its own.
          # Falls back to nohup only if the manager is unavailable.
          if [ -f "$GITHUB_WORKSPACE/.github/scripts/tunnels/tunnels.sh" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/tunnels/tunnels.sh" ensure oc || true
          else
            nohup cloudflared tunnel run --url http://127.0.0.1:18789 oc \
              > ~/.openclaw/logs/cloudflared_oc.log 2>&1 &
            echo $! > ~/.openclaw/logs/cloudflared_oc.pid
          fi

          sleep 10
          echo "OpenClaw tunnel started (systemd-managed)."

      - name: Run rss-to-telegram container
        env:
          # rsstt 服务使用独立 bot，token 经同名 secret 注入（此前未接线导致容器 TOKEN 恒空）
          TELEGRAM_BOT_TOKEN_RSS_SB_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN_RSS_SB_BOT }}
        run: |
          set -euo pipefail
          echo "Starting rss-to-telegram before OmniRoute..."
          mkdir -p /dropbox/self-hosted/rsstt
          cleanup_archive_workdir() {
            rm -f /tmp/rsstt.tar.gz 2>/dev/null || true
            rm -rf /tmp/rsstt-restore 2>/dev/null || true
          }
          free_kb() { df -Pk "${1:-/tmp}" | awk 'NR==2 {print $4}'; }
          require_free_kb() {
            local path="$1" min_kb="$2" label="$3"
            local avail
            avail=$(free_kb "$path")
            if [ "${avail:-0}" -lt "$min_kb" ]; then
              echo "❌ ${label}: insufficient free space at ${path}. available=${avail}KB required=${min_kb}KB" >&2
              exit 1
            fi
            echo "✅ ${label}: free space ok at ${path}. available=${avail}KB required=${min_kb}KB"
          }
          require_free_kb /tmp $((1024 * 1024)) "rsstt restore preflight"
          rm -rf /tmp/local_rsstt
          cleanup_archive_workdir
          mkdir -p /tmp/local_rsstt /tmp/rsstt-restore

          # 门禁只看 rsstt 真正依赖的凭据（同名 secret 注入）：
          # ~/.openclaw/.env 由 OpenClaw 自身维护、与 rsstt 无关，不能作为启动条件
          if [ -n "${TELEGRAM_BOT_TOKEN_RSS_SB_BOT:-}" ]; then
            if rclone ls dropbox:self-hosted/rsstt.tar.gz > /dev/null 2>&1; then
              echo "📦 Found rsstt.tar.gz! Downloading and extracting..."
              rclone copyto dropbox:self-hosted/rsstt.tar.gz /tmp/rsstt.tar.gz
              archive_kb=$(du -sk /tmp/rsstt.tar.gz | awk '{print $1}')
              if [ -z "${archive_kb:-}" ] || [ "$archive_kb" -le 0 ]; then
                echo "❌ rsstt extract preflight: unable to calculate archive size" >&2
                exit 1
              fi
              echo "rsstt.tar.gz 大小: ${archive_kb}KB"
              require_free_kb /tmp $((archive_kb * 3 + 512 * 1024)) "rsstt extract preflight"
              if [ -s /tmp/rsstt.tar.gz ] && tar -tzf /tmp/rsstt.tar.gz >/dev/null 2>&1; then
                tar -xzf /tmp/rsstt.tar.gz -C /tmp/rsstt-restore
                cp -a /tmp/rsstt-restore/. /tmp/local_rsstt/ || true
              else
                echo "⚠️ rsstt.tar.gz validation failed, skipping archive restore."
              fi
              cleanup_archive_workdir
            else
              echo "⚠️ No rsstt archive found. Falling back to sync from raw directory..."
              rclone copy dropbox:self-hosted/rsstt /tmp/local_rsstt \
                --retries 10 \
                --low-level-retries 20 \
                --timeout 1m \
                --contimeout 15s \
                --exclude "docker-compose.yml" \
                -P || true
            fi

            mkdir -p /tmp/local_rsstt/config /tmp/local_rsstt/data
            touch /tmp/local_rsstt/config/.keep /tmp/local_rsstt/data/.keep

            echo "=== restored rss-to-telegram tree ==="
            find /tmp/local_rsstt -maxdepth 3 | sort || true

            start_rsstt_container() {
              docker rm -f rss-to-telegram 2>/dev/null || true
              docker run -d \
                --name rss-to-telegram \
                --restart unless-stopped \
                -v /tmp/local_rsstt/config:/app/config \
                -v /tmp/local_rsstt/data:/app/data \
                -e TOKEN="$TELEGRAM_BOT_TOKEN_RSS_SB_BOT" \
                -e MANAGER="83279194" \
                -e MULTIUSER="0" \
                rongronggg9/rss-to-telegram:latest
            }

            print_rsstt_status() {
              echo "=== rss-to-telegram status ==="
              docker ps -a --filter name=rss-to-telegram
              container_status="$(docker inspect --format '{{.State.Status}}' rss-to-telegram)"
              health_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' rss-to-telegram)"
              restart_count="$(docker inspect --format '{{.RestartCount}}' rss-to-telegram)"
              echo "rss-to-telegram status=${container_status} health=${health_status} restarts=${restart_count}"
            }

            validate_rsstt_container() {
              print_rsstt_status

              if [ "$container_status" != "running" ] || [ "$health_status" = "unhealthy" ]; then
                echo "❌ rss-to-telegram failed to become healthy"
                docker logs --tail 200 rss-to-telegram || true
                return 1
              fi

              if docker logs --tail 200 rss-to-telegram 2>&1 | grep -Eqi 'LOGIN FAILED|Unknown error occurred during login'; then
                echo "❌ rss-to-telegram encountered a Telegram login failure"
                docker logs --tail 200 rss-to-telegram || true
                return 1
              fi
            }

            archive_rsstt_state() {
              local min_size=$((5 * 1024))
              local actual_size

              echo "📦 Archiving repaired rss-to-telegram state immediately..."
              rm -f /tmp/rsstt.tar.gz
              tar -czf /tmp/rsstt.tar.gz -C /tmp/local_rsstt .
              tar -tzf /tmp/rsstt.tar.gz >/dev/null
              actual_size="$(stat -c%s /tmp/rsstt.tar.gz 2>/dev/null || echo 0)"
              if [ "$actual_size" -lt "$min_size" ]; then
                echo "❌ repaired rsstt archive is too small: size=${actual_size} min=${min_size}"
                exit 1
              fi
              rclone copyto /tmp/rsstt.tar.gz dropbox:self-hosted/rsstt.tar.gz -v
              rm -f /tmp/rsstt.tar.gz
              echo "✅ Repaired rss-to-telegram state uploaded"
            }

            echo "Waiting for rss-to-telegram container to stabilize..."
            start_rsstt_container
            sleep 12

            if ! validate_rsstt_container; then
              if docker logs --tail 200 rss-to-telegram 2>&1 | grep -qi 'AuthKeyDuplicatedError'; then
                echo "⚠️ rss-to-telegram session was invalidated by AuthKeyDuplicatedError; deleting session and retrying once."
                docker rm -f rss-to-telegram 2>/dev/null || true
                rm -f \
                  /tmp/local_rsstt/config/bot.session \
                  /tmp/local_rsstt/config/bot.session-journal \
                  /tmp/local_rsstt/config/bot.session-shm \
                  /tmp/local_rsstt/config/bot.session-wal
                start_rsstt_container
                sleep 12
                validate_rsstt_container
                archive_rsstt_state
              else
                exit 1
              fi
            fi

            echo "=== rss-to-telegram /app tree (for persistence verification) ==="
            docker exec rss-to-telegram sh -lc 'find /app -maxdepth 3 \( -type f -o -type d \) | sort | sed -n "1,200p"'
            echo "=== rss-to-telegram local bind tree after startup ==="
            find /tmp/local_rsstt -maxdepth 3 | sort || true
          else
            echo "❌ TELEGRAM_BOT_TOKEN_RSS_SB_BOT 未配置，跳过 rss-to-telegram 启动；本轮无 rsstt 数据，最终归档会跳过上传"
          fi

      - name: "Run AI API gateway (backend: ${{ inputs.ai_backend }})"
        env:
          # 手动运行时可指定本次使用的网关后端（auto = 自动降级链）；定时触发为 auto
          AI_BACKEND_INPUT: ${{ inputs.ai_backend || 'auto' }}
          # 归档存在但恢复失败→bootstrap 空库时发 tier=alert 告警（P0 加固 2026-10-11）
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_ALERT: ${{ secrets.TELEGRAM_BOT_TOKEN_ALERT }}
          TELEGRAM_CHAT_ID_ALERT: ${{ secrets.TELEGRAM_CHAT_ID_ALERT }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # 2026-10-11 网关迁移：CliRelay（compose 全栈）/ CLIProxyAPI（回退）→ OmniRoute 单后端。
          # 部署形态：/home/runner/omniroute（compose + .env 密钥）+ 命名卷 omniroute_omniroute-data
          # （storage.sqlite：全部渠道/入站 key/combo；server.env：STORAGE_ENCRYPTION_KEY）。
          # 灾备 = Dropbox OmniRoute.tar.gz 一起恢复这两样。旧链路归档的处置：
          # CliRelay.tar.gz 由生产侧归档循环在备用容器存活期间继续刷新（备用网关口径），
          # CLIProxyAPI.tar.gz 为历史快照不再刷新 —— DR workflow 均不再消费，仅作手动回滚素材。
          # 本机渠道上游（workbuddy 8318 / zcode2api 8319 / qingyan 8320 / trae 7864）
          # 由 extra_hosts host.docker.internal:host-gateway 回连。
          echo "Configuring AI API gateway: requested backend = ${AI_BACKEND_INPUT:-auto} (port 20128)..."
          mkdir -p /home/runner/omniroute ~/.openclaw/logs

          BACKEND_STATE=/tmp/active-ai-backend.env
          : > "$BACKEND_STATE"

          OMNIROUTE_DIR=/home/runner/omniroute
          OMNIROUTE_TAR=/tmp/OmniRoute.tar.gz
          OMNIROUTE_ARCHIVE="dropbox:self-hosted/OmniRoute.tar.gz"
          OMNIROUTE_IMAGE="diegosouzapw/omniroute:3.8.51"
          OMNIROUTE_VOLUME="omniroute_omniroute-data"
          # 恢复路径观测标记：ARCHIVE_PRESENT=探测通过；ARCHIVE_SEEN=确认云端归档存在
          # （bootstrap 告警判据——归档存在却没恢复成 = 数据事故，见 restore 失败分支）
          OMNIROUTE_ARCHIVE_PRESENT=0
          OMNIROUTE_ARCHIVE_SEEN=0

          cleanup_archive_workdir() {
            rm -f /tmp/OmniRoute.tar.gz 2>/dev/null || true
            rm -rf /tmp/omniroute-restore 2>/dev/null || true
          }
          free_kb() { df -Pk "${1:-/tmp}" | awk 'NR==2 {print $4}'; }
          require_free_kb() {
            local path="$1" min_kb="$2" label="$3"
            local avail
            avail=$(free_kb "$path")
            if [ "${avail:-0}" -lt "$min_kb" ]; then
              echo "❌ ${label}: insufficient free space at ${path}. available=${avail}KB required=${min_kb}KB" >&2
              exit 1
            fi
            echo "✅ ${label}: free space ok at ${path}. available=${avail}KB required=${min_kb}KB"
          }

          wait_api_ready() {
            local label="$1"
            local tries="${2:-120}"
            local code
            for i in $(seq 1 "$tries"); do
              code=$(curl -s --connect-timeout 2 -o /dev/null -w "%{http_code}" http://127.0.0.1:20128/healthz || true)
              if [ -n "$code" ] && [ "$code" -ge 100 ] && [ "$code" -lt 600 ]; then
                echo "✅ [$label] OmniRoute 已就绪 (HTTP ${code})"
                return 0
              fi
              echo "⏳ [$label] 等待中... ${i}/${tries}"
              sleep 2
            done
            return 1
          }

          # ---------- OmniRoute 部署目录 + 数据卷恢复（Dropbox 归档优先，缺失则 bootstrap） ----------
          restore_omniroute_data() {
            if [ -f "$OMNIROUTE_DIR/docker-compose.yml" ] && [ -f "$OMNIROUTE_DIR/.env" ]; then
              echo "ℹ️ OmniRoute 部署目录已就绪，跳过恢复"
              return 0
            fi
            cleanup_archive_workdir
            require_free_kb /tmp $((2 * 1024 * 1024)) "OmniRoute restore preflight"
            # 探测重试 3 次再定性（与 ~/.openclaw 恢复 2026-10-02 加固同口径）：
            # rclone 瞬时失败被误判成"无归档"会静默 bootstrap 空库——比"恢复失败"更
            # 危险，它连 ARCHIVE_SEEN 标记都立不起来，告警都不会响。
            OMNIROUTE_ARCHIVE_PRESENT=0
            for _probe in 1 2 3; do
              if rclone ls "$OMNIROUTE_ARCHIVE" > /dev/null 2>&1; then
                OMNIROUTE_ARCHIVE_PRESENT=1
                break
              fi
              echo "⚠️ rclone ls 探测归档失败（第 ${_probe}/3 次），15s 后重试..."
              sleep 15
            done
            if [ "$OMNIROUTE_ARCHIVE_PRESENT" != "1" ]; then
              echo "ℹ️ 未找到 OmniRoute 归档，走全新 bootstrap"
              return 1
            fi
            OMNIROUTE_ARCHIVE_SEEN=1
            echo "📦 Found OmniRoute.tar.gz! Downloading and validating..."
            if ! rclone copyto "$OMNIROUTE_ARCHIVE" "$OMNIROUTE_TAR"; then
              echo "⚠️ OmniRoute.tar.gz 下载失败，走全新 bootstrap"
              cleanup_archive_workdir
              return 1
            fi
            local archive_kb actual_size
            archive_kb=$(du -sk "$OMNIROUTE_TAR" | awk '{print $1}')
            if [ -z "${archive_kb:-}" ] || [ "$archive_kb" -le 0 ]; then
              echo "❌ OmniRoute extract preflight: unable to calculate archive size" >&2
              exit 1
            fi
            echo "OmniRoute.tar.gz 大小: ${archive_kb}KB"
            require_free_kb /tmp $((archive_kb * 3 + 512 * 1024)) "OmniRoute extract preflight"
            local min_size=$((1024 * 1024))
            actual_size=$(stat -c%s "$OMNIROUTE_TAR" 2>/dev/null || echo 0)
            if [ "$actual_size" -lt "$min_size" ] || ! tar -tzf "$OMNIROUTE_TAR" >/dev/null 2>&1; then
              echo "⚠️ OmniRoute.tar.gz validation failed，走全新 bootstrap"
              cleanup_archive_workdir
              return 1
            fi
            rm -rf /tmp/omniroute-restore
            mkdir -p /tmp/omniroute-restore
            tar -xzf "$OMNIROUTE_TAR" -C /tmp/omniroute-restore
            # cleanup_archive_workdir 会 rm -rf /tmp/omniroute-restore，
            # 必须等数据卷恢复消费完 data.tar.gz 之后才能调用，不能放在检查前
            if [ ! -f /tmp/omniroute-restore/docker-compose.yml ] || [ ! -f /tmp/omniroute-restore/.env ]; then
              echo "⚠️ OmniRoute.tar.gz 缺少 docker-compose.yml/.env，走全新 bootstrap"
              cleanup_archive_workdir
              return 1
            fi
            mkdir -p "$OMNIROUTE_DIR"
            cp -a /tmp/omniroute-restore/docker-compose.yml /tmp/omniroute-restore/.env "$OMNIROUTE_DIR/"
            chmod 600 "$OMNIROUTE_DIR/.env"
            # 数据卷恢复：归档内 data.tar.gz → docker 卷。server.env（STORAGE_ENCRYPTION_KEY）
            # 与 storage.sqlite 必须同代，否则存量 key 解不开 —— 二者同一份归档，天然同代。
            # storage-backup.sqlite（归档侧 sqlite 在线一致性备份）优先于活库三件套。
            if [ -f /tmp/omniroute-restore/data.tar.gz ]; then
              docker volume create "$OMNIROUTE_VOLUME" >/dev/null
              docker run --rm --user root -v "$OMNIROUTE_VOLUME:/target" -v /tmp/omniroute-restore:/src:ro \
                "$OMNIROUTE_IMAGE" sh -c '
                  tar xzf /src/data.tar.gz -C /target
                  if [ -f /target/storage-backup.sqlite ]; then
                    mv -f /target/storage-backup.sqlite /target/storage.sqlite
                    rm -f /target/storage.sqlite-wal /target/storage.sqlite-shm
                  fi
                  find /target -name "._*" -delete 2>/dev/null || true
                  chown -R 1000:1000 /target'
              echo "✅ OmniRoute 数据卷已恢复"
            else
              echo "⚠️ 归档内无 data.tar.gz（纯部署目录），数据卷留空"
            fi
            echo "=== restored OmniRoute tree ==="
            find "$OMNIROUTE_DIR" -maxdepth 2 | sort || true
            cleanup_archive_workdir
            return 0
          }

          # ---------- 全新 bootstrap（无归档时）：生成 compose + 随机密钥，空库起服 ----------
          # 空库 = 无渠道无入站 key，客户端会 401 —— 仅用于首次冷启动兜底；首轮 Final
          # Archive 会把这份空库打包上传，之后每次重建都走归档恢复路径。
          # compose 内容经 sed 剥掉 run-block 的 10 空格缩进后再落盘（heredoc 无法用 <<- 剥空格）。
          bootstrap_omniroute() {
            echo "🔄 Bootstrapping fresh OmniRoute deployment..."
            mkdir -p "$OMNIROUTE_DIR"
            cat <<'OMNIROUTE_COMPOSE_EOF' | sed 's/^          //' > "$OMNIROUTE_DIR/docker-compose.yml"
          services:
            omniroute:
              image: diegosouzapw/omniroute:3.8.51
              container_name: omniroute
              restart: unless-stopped
              stop_grace_period: 40s
              ports:
                - "127.0.0.1:20128:20128"
              env_file: .env
              environment:
                PORT: 20128
                OMNIROUTE_MEMORY_MB: "4096"
                BASE_URL: http://omniroute:20128
                AUTH_COOKIE_SECURE: "false"
                # 上下文窗口自动校正（auto:discovery）周期：24h 扫描上游同步缓存，
                # 上游 /v1/models 报窗口（context_length 等字段）→ 自动写 auto override；
                # model_context_overrides 里的 manual 行永不覆盖（跳过）。设 0 可关闭。
                CONTEXT_WINDOW_RECONCILE_INTERVAL: "86400"
                # ---- 长上下文容忍度（2026-10-12，按实测调；与 CliRelay 时代同口径）----
                # runner-autoclaw 承接 40 万 token 级上下文：上游实测 96 万字符
                # 请求 61s、常规长请求 25~27s。默认首事件 readiness 80s + provider
                # 失败计数（DEGRADED=7 / OPEN=15）会把「慢」判成「坏」，OmniRoute
                # 侧刷屏 "[503] circuit breaker is open (reset after 7s/11s)"。
                # 数值全部按实测延迟量级给，不拍脑袋。
                # ---- 慢透传容差（2026-10-12 二次调，见 docs/openclaw.md）----
                # direct response-start 的 30s 闸比 SSE readiness 更前置：workbuddy
                # (8318) 长上下文实测 24~85s 才出响应头，11 次 30s 超时靠重试救回，
                # 却全计入 provider 失败计数并沿 combo 传染 autoclaw 熔断。
                # 总口径对齐 CliRelay main-api-read-timeout-seconds=1800
                # 与官方推荐 "Long-running code generation: REQUEST_TIMEOUT_MS=900000"
                REQUEST_TIMEOUT_MS: "1800000"
                OMNIROUTE_DIRECT_HEADERS_TIMEOUT_MS: "150000"
                OMNIROUTE_DIRECT_RESPONSE_RETRY_TIMEOUT_MS: "600000"
                STREAM_READINESS_TIMEOUT_MS: "600000"
                STREAM_READINESS_MAX_TIMEOUT_MS: "900000"
                OMNIROUTE_AGENT_GOAL_READINESS_MAX_TIMEOUT_MS: "900000"
                # 流式总寿命：镜像默认 1260000（21min）短于 CliRelay 1800s，长任务会在
                # 第 21 分钟被砍 → 显式设 1800s 对齐（0=禁用，这里不用）。
                STREAM_ACTIVE_TIMEOUT_MS: "1800000"
                FETCH_TIMEOUT_MS: "1800000"
                STREAM_IDLE_TIMEOUT_MS: "1800000"
                # API-key provider 熔断（autoclaw / zcode2api 均属此类）
                OMNIROUTE_CIRCUIT_BREAKER_API_KEY_THRESHOLD: "30"
                OMNIROUTE_CIRCUIT_BREAKER_API_KEY_RESET_MS: "60000"
                OMNIROUTE_PROVIDER_BREAKER_API_KEY_FAILURE_THRESHOLD: "60"
                OMNIROUTE_PROVIDER_BREAKER_API_KEY_DEGRADATION_THRESHOLD: "20"
                OMNIROUTE_PROVIDER_BREAKER_API_KEY_COOLDOWN_MS: "180000"
                OMNIROUTE_PROVIDER_BREAKER_API_KEY_MAX_BACKOFF_MULTIPLIER: "2"
              extra_hosts:
                - "host.docker.internal:host-gateway"
              volumes:
                - omniroute-data:/app/data
              healthcheck:
                test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:20128/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
                interval: 60s
                timeout: 15s
                start_period: 120s
                retries: 5
              logging:
                driver: json-file
                options:
                  max-size: "50m"
                  max-file: "5"

          volumes:
            omniroute-data:
          OMNIROUTE_COMPOSE_EOF
            if [ ! -f "$OMNIROUTE_DIR/.env" ]; then
              {
                printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)"
                printf 'API_KEY_SECRET=%s\n' "$(openssl rand -hex 32)"
                printf 'INITIAL_PASSWORD=%s\n' "$(openssl rand -base64 18 | tr '+/' '-_' | tr -d '=')"
              } > "$OMNIROUTE_DIR/.env"
            fi
            chmod 600 "$OMNIROUTE_DIR/.env"
            echo "✅ OmniRoute 部署目录就绪: $OMNIROUTE_DIR（bootstrap 空库，无渠道/无入站 key）"
          }

          # ===== 回退后端（2026-10-11 恢复自动降级）：CliRelay 全栈 + CLIProxyAPI 单容器 =====
          # 从 dcf418e 迁移提交的父版本移植，改动仅两点：
          #   ① 端口统一：官方 compose "8317:8317" → 降级路径 docker run 侧 -p 20128:8317
          #     （容器内仍 8317，凭据/配置零改动）；健康检查探测 20128。
          #   ② 函数化保持旧语义：归档恢复优先，无效则 bootstrap。
          CLIRELAY_DIR=/tmp/local_CliRelay
          CLIRELAY_TAR=/tmp/CliRelay.tar.gz
          CLIRELAY_ARCHIVE="dropbox:self-hosted/CliRelay.tar.gz"
          COMPOSE="docker compose -p clirelay -f $CLIRELAY_DIR/docker-compose.yml --project-directory $CLIRELAY_DIR"

          # CliRelay/CLIProxyAPI 服务 8317（容器内），宿主侧统一映射 20128：
          # 健康检查与 OmniRoute 同一探测点，降级后客户端/隧道零改动
          wait_clirelay_ready() {
            local label="$1"
            local tries="${2:-120}"
            local code
            for i in $(seq 1 "$tries"); do
              code=$(curl -s --connect-timeout 2 -o /dev/null -w "%{http_code}" http://127.0.0.1:20128/ || true)
              if [ -n "$code" ] && [ "$code" -ge 100 ] && [ "$code" -lt 600 ]; then
                echo "✅ [$label] 20128 已就绪 (HTTP ${code})"
                return 0
              fi
              echo "⏳ [$label] 等待中... ${i}/${tries}"
              sleep 2
            done
            return 1
          }

          # ---------- CLIProxyAPI 数据恢复（旧逻辑原样移植，幂等；回退与 bootstrap 共用） ----------
          restore_cliproxyapi_data() {
            if [ -f /tmp/local_CLIPProxyAPI/config.yaml ]; then
              echo "ℹ️ CLIProxyAPI 数据目录已就绪，跳过恢复"
              return 0
            fi
            echo "Configuring local CLIProxyAPI directory with persistent data..."
            cleanup_archive_workdir
            require_free_kb /tmp $((2 * 1024 * 1024)) "CLIProxyAPI restore preflight"
            rm -rf /tmp/local_CLIPProxyAPI
            mkdir -p /tmp/local_CLIPProxyAPI
            if rclone ls dropbox:self-hosted/CLIProxyAPI.tar.gz > /dev/null 2>&1; then
              echo "📦 Found CLIProxyAPI.tar.gz! Downloading and extracting..."
              rclone copyto dropbox:self-hosted/CLIProxyAPI.tar.gz /tmp/CLIProxyAPI.tar.gz
              archive_kb=$(du -sk /tmp/CLIProxyAPI.tar.gz | awk '{print $1}')
              if [ -z "${archive_kb:-}" ] || [ "$archive_kb" -le 0 ]; then
                echo "❌ CLIProxyAPI extract preflight: unable to calculate archive size" >&2
                exit 1
              fi
              echo "CLIProxyAPI.tar.gz 大小: ${archive_kb}KB"
              require_free_kb /tmp $((archive_kb * 3 + 512 * 1024)) "CLIProxyAPI extract preflight"
              local min_size=$((5 * 1024))
              local actual_size
              actual_size=$(stat -c%s /tmp/CLIProxyAPI.tar.gz 2>/dev/null || echo 0)
              if [ "$actual_size" -ge "$min_size" ] && tar -tzf /tmp/CLIProxyAPI.tar.gz >/dev/null 2>&1; then
                tar -xzf /tmp/CLIProxyAPI.tar.gz -C /tmp/local_CLIPProxyAPI
              else
                echo "⚠️ CLIProxyAPI.tar.gz validation failed, skipping archive restore."
              fi
              cleanup_archive_workdir
            else
              echo "⚠️ No CLIProxyAPI archive found. Falling back to sync from raw directory..."
              rclone copy dropbox:self-hosted/CLIProxyAPI /tmp/local_CLIPProxyAPI \
                --retries 10 \
                --low-level-retries 20 \
                --timeout 1m \
                --contimeout 15s \
                -P || true
            fi
            mkdir -p /tmp/local_CLIPProxyAPI/auth-dir /tmp/local_CLIPProxyAPI/logs
            touch /tmp/local_CLIPProxyAPI/config.yaml
            touch /tmp/local_CLIPProxyAPI/stats.json
            echo "=== restored CLIProxyAPI tree ==="
            find /tmp/local_CLIPProxyAPI -maxdepth 3 | sort || true
          }

          # ---------- CLIProxyAPI 数据 → CliRelay 部署目录（bootstrap 迁移，旧逻辑原样移植） ----------
          bootstrap_clirelay_from_cliproxyapi() {
            echo "🔄 Bootstrapping CliRelay deployment from CLIProxyAPI data..."
            rm -rf "$CLIRELAY_DIR"
            mkdir -p "$CLIRELAY_DIR"/auths "$CLIRELAY_DIR"/sql "$CLIRELAY_DIR"/postgres-data "$CLIRELAY_DIR"/redis-data "$CLIRELAY_DIR"/logs "$CLIRELAY_DIR"/data
            if [ -f /tmp/local_CLIPProxyAPI/config.yaml ]; then
              cp -a /tmp/local_CLIPProxyAPI/config.yaml "$CLIRELAY_DIR/config.yaml"
            else
              touch "$CLIRELAY_DIR/config.yaml"
            fi
            if [ -d /tmp/local_CLIPProxyAPI/auth-dir ]; then
              cp -a /tmp/local_CLIPProxyAPI/auth-dir/. "$CLIRELAY_DIR/auths/" 2>/dev/null || true
            fi
            find "$CLIRELAY_DIR/auths" -name '._*' -delete 2>/dev/null || true
            curl -fsSL --retry 3 https://raw.githubusercontent.com/kittors/CliRelay/main/docker-compose.yml \
              -o "$CLIRELAY_DIR/docker-compose.yml" || { echo "❌ 无法下载 CliRelay docker-compose.yml"; return 1; }
            local pgpass
            pgpass=$(openssl rand -hex 16)
            {
              printf 'CLIRELAY_PROJECT_DIR=%s\n' "$CLIRELAY_DIR"
              printf 'AUTH_PATH=/root/.cli-proxy-api\n'
              printf 'CLIRELAY_POSTGRES_DB=clirelay\n'
              printf 'CLIRELAY_POSTGRES_USER=clirelay\n'
              printf 'CLIRELAY_POSTGRES_PASSWORD=%s\n' "$pgpass"
            } > "$CLIRELAY_DIR/.env"
            chmod 600 "$CLIRELAY_DIR/.env"
            echo "✅ CliRelay 部署目录就绪: $CLIRELAY_DIR"
          }

          # ---------- CliRelay 数据恢复：Dropbox 归档优先，无效则 bootstrap 迁移（旧逻辑原样移植） ----------
          restore_clirelay_data() {
            rm -rf "$CLIRELAY_DIR"
            local restored=0
            if rclone ls "$CLIRELAY_ARCHIVE" > /dev/null 2>&1; then
              echo "📦 Found CliRelay.tar.gz! Downloading and validating..."
              require_free_kb /tmp $((2 * 1024 * 1024)) "clirelay restore preflight"
              if rclone copyto "$CLIRELAY_ARCHIVE" "$CLIRELAY_TAR"; then
                if [ -s "$CLIRELAY_TAR" ] && tar -tzf "$CLIRELAY_TAR" >/dev/null 2>&1; then
                  rm -rf /tmp/clirelay-restore
                  mkdir -p /tmp/clirelay-restore
                  tar -xzf "$CLIRELAY_TAR" -C /tmp/clirelay-restore
                  if [ -f /tmp/clirelay-restore/docker-compose.yml ] && [ -f /tmp/clirelay-restore/.env ]; then
                    mkdir -p "$CLIRELAY_DIR"
                    cp -a /tmp/clirelay-restore/. "$CLIRELAY_DIR/"
                    mkdir -p "$CLIRELAY_DIR"/auths "$CLIRELAY_DIR"/sql "$CLIRELAY_DIR"/postgres-data "$CLIRELAY_DIR"/redis-data "$CLIRELAY_DIR"/logs "$CLIRELAY_DIR"/data
                    echo "✅ Restored CliRelay deployment from archive"
                    restored=1
                  else
                    echo "⚠️ CliRelay.tar.gz 缺少 docker-compose.yml/.env，转 bootstrap 迁移。"
                  fi
                else
                  echo "⚠️ CliRelay.tar.gz validation failed, 转 bootstrap 迁移。"
                fi
              else
                echo "⚠️ CliRelay.tar.gz 下载失败，转 bootstrap 迁移。"
              fi
            else
              echo "ℹ️ 未找到 CliRelay 归档，从 CLIProxyAPI 数据 bootstrap 迁移。"
            fi
            cleanup_archive_workdir
            if [ "$restored" != 1 ]; then
              restore_cliproxyapi_data
              bootstrap_clirelay_from_cliproxyapi
            fi
          }

          # ---------- CliRelay 全栈启动：postgres 先行 → SQL 导入 → 全栈 up（旧逻辑移植 + 统一端口） ----------
          start_clirelay() {
            echo "🚀 Starting CliRelay compose stack..."
            docker rm -f cli-proxy-api clirelay 2>/dev/null || true
            # CliRelay 路径若残留上一轮 socat/端口桥接，先拆
            sudo pkill -f 'socat.*TCP-LISTEN:20128' 2>/dev/null || true
            $COMPOSE down --remove-orphans 2>/dev/null || true
            # 统一端口 override：官方 compose 绑 8317:8317（0.0.0.0），覆盖为宿主
            # 127.0.0.1:20128 → 容器 8317。与 OmniRoute 同宿主端口，降级后客户端/隧道零改动；
            # override 独立成文件不碰云端归档恢复来的 compose 原件。
            printf '%s\n' \
              'services:' \
              '  cli-proxy-api:' \
              '    ports: !override' \
              '      - "127.0.0.1:20128:8317"' \
              '      - "127.0.0.1:8085:8085"' \
              '      - "127.0.0.1:1455:1455"' \
              '      - "127.0.0.1:54545:54545"' \
              '      - "127.0.0.1:51121:51121"' \
              '      - "127.0.0.1:11451:11451"' \
              > "$CLIRELAY_DIR/docker-compose.port-override.yml"
            $COMPOSE -f "$CLIRELAY_DIR/docker-compose.yml" -f "$CLIRELAY_DIR/docker-compose.port-override.yml" up -d postgres || return 1
            local pg_ok=0
            for i in $(seq 1 30); do
              if $COMPOSE exec -T postgres sh -c '. /clirelay-deploy/.env; pg_isready -U "$CLIRELAY_POSTGRES_USER" -d "$CLIRELAY_POSTGRES_DB"' >/dev/null 2>&1; then
                pg_ok=1
                break
              fi
              sleep 2
            done
            if [ "$pg_ok" != 1 ]; then
              echo "❌ CliRelay postgres 未在预期时间内就绪"
              return 1
            fi
            # 恢复脚本：先导 SQL 再起全栈（PG 数据卷不入归档，每轮均为全新库，直接导入无冲突）
            shopt -s nullglob
            local sql_files=( "$CLIRELAY_DIR"/sql/*.sql )
            shopt -u nullglob
            if [ "${#sql_files[@]}" -gt 0 ]; then
              local latest_sql
              latest_sql=$(ls -1t "${sql_files[@]}" | head -n 1)
              echo "📥 Importing PostgreSQL snapshot: $latest_sql"
              $COMPOSE exec -T postgres sh -c '. /clirelay-deploy/.env; exec psql -U "$CLIRELAY_POSTGRES_USER" -d "$CLIRELAY_POSTGRES_DB" -v ON_ERROR_STOP=1' < "$latest_sql" || return 1
              echo "✅ PostgreSQL 数据导入完成"
            fi
            $COMPOSE -f "$CLIRELAY_DIR/docker-compose.yml" -f "$CLIRELAY_DIR/docker-compose.port-override.yml" up -d || return 1
          }

          # ---------- CLIProxyAPI 单容器启动（回退后端；端口改绑 20128→容器 8317） ----------
          start_cliproxyapi() {
            echo "🚀 Starting CLIProxyAPI container (fallback backend)..."
            docker rm -f cliproxyapi cli-proxy-api clirelay 2>/dev/null || true
            # CliRelay 路径残留的 socat 会抢 20128，先拆
            sudo pkill -f 'socat.*TCP-LISTEN:20128' 2>/dev/null || true
            mkdir -p /tmp/local_CLIPProxyAPI/auth-dir /tmp/local_CLIPProxyAPI/logs
            touch /tmp/local_CLIPProxyAPI/config.yaml
            touch /tmp/local_CLIPProxyAPI/stats.json
            # ① 容器原生即 8317，宿主侧直接绑 20128（与 OmniRoute 同端口，客户端/隧道零改动）
            # ② 官方 compose 的 clirelay-init 会写 config，这里数据是归档/旧目录恢复的，直接挂
            docker run -d \
              --name cliproxyapi \
              --restart unless-stopped \
              -p 127.0.0.1:20128:8317 \
              -e TZ=Asia/Shanghai \
              -v /tmp/local_CLIPProxyAPI/config.yaml:/CLIProxyAPI/config.yaml \
              -v /tmp/local_CLIPProxyAPI/auth-dir:/root/.cli-proxy-api \
              -v /tmp/local_CLIPProxyAPI/logs:/CLIProxyAPI/logs \
              -v /tmp/local_CLIPProxyAPI/stats.json:/CLIProxyAPI/stats.json \
              eceasy/cli-proxy-api:latest || return 1
          }

          # ---------- 启动：恢复路径走 compose（卷已由 compose 声明复用），bootstrap 路径走 docker run ----------

          start_omniroute() {
            echo "🚀 Starting OmniRoute container..."
            docker rm -f omniroute 2>/dev/null || true
            docker volume create "$OMNIROUTE_VOLUME" >/dev/null
            if [ -f "$OMNIROUTE_DIR/docker-compose.yml" ]; then
              docker compose -p omniroute -f "$OMNIROUTE_DIR/docker-compose.yml" --project-directory "$OMNIROUTE_DIR" up -d || return 1
            else
              # bootstrap 路径同样要带长上下文阈值 —— 与下方 compose heredoc
              # （restore 路径）保持同值，否则归档缺失的冷启动会被默认
              # readiness 80s + provider 失败计数 7/15 又快快打成熔断。
              # 阈值依据见 compose heredoc 处的注释块（2026-10-12 实测调参）。
              docker run -d \
                --name omniroute \
                --restart unless-stopped \
                --stop-timeout 40 \
                -p 127.0.0.1:20128:20128 \
                -e PORT=20128 \
                -e OMNIROUTE_MEMORY_MB=4096 \
                -e BASE_URL=http://omniroute:20128 \
                -e AUTH_COOKIE_SECURE=false \
                -e REQUEST_TIMEOUT_MS=1800000 \
                -e OMNIROUTE_DIRECT_HEADERS_TIMEOUT_MS=150000 \
                -e OMNIROUTE_DIRECT_RESPONSE_RETRY_TIMEOUT_MS=600000 \
                -e STREAM_READINESS_TIMEOUT_MS=600000 \
                -e STREAM_READINESS_MAX_TIMEOUT_MS=900000 \
                -e OMNIROUTE_AGENT_GOAL_READINESS_MAX_TIMEOUT_MS=900000 \
                -e STREAM_ACTIVE_TIMEOUT_MS=1800000 \
                -e FETCH_TIMEOUT_MS=1800000 \
                -e STREAM_IDLE_TIMEOUT_MS=1800000 \
                -e OMNIROUTE_CIRCUIT_BREAKER_API_KEY_THRESHOLD=30 \
                -e OMNIROUTE_CIRCUIT_BREAKER_API_KEY_RESET_MS=60000 \
                -e OMNIROUTE_PROVIDER_BREAKER_API_KEY_FAILURE_THRESHOLD=60 \
                -e OMNIROUTE_PROVIDER_BREAKER_API_KEY_DEGRADATION_THRESHOLD=20 \
                -e OMNIROUTE_PROVIDER_BREAKER_API_KEY_COOLDOWN_MS=180000 \
                -e OMNIROUTE_PROVIDER_BREAKER_API_KEY_MAX_BACKOFF_MULTIPLIER=2 \
                --add-host host.docker.internal:host-gateway \
                -v "$OMNIROUTE_VOLUME:/app/data" \
                --env-file "$OMNIROUTE_DIR/.env" \
                "$OMNIROUTE_IMAGE" || return 1
            fi
          }

          cleanup_archive_workdir
          # 数据准备失败不终止（bootstrap 全新部署兜底，与旧 CliRelay 同口径）
          if ! restore_omniroute_data; then
            bootstrap_omniroute
            # P0 加固（2026-10-11）：归档明明存在却没恢复成 = 数据事故信号，必须炸响。
            # 当天事故即此形态：cleanup 误删解包目录 → 恒报"缺少 docker-compose.yml/.env"
            # → 静默 bootstrap 空库上岗，全靠归档脚本 1MB 体积门才没让空库覆盖云端好包。
            if [ "$OMNIROUTE_ARCHIVE_SEEN" = "1" ]; then
              if source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh" 2>/dev/null; then
                msg=""
                tg_add_title msg "🚨 OmniRoute 归档恢复失败 · 空库兜底"
                tg_add_kv msg "现象" "Dropbox 归档存在，但本轮恢复未走通，已 bootstrap 空库"
                tg_add_kv msg "影响" "无渠道/无入站 key，客户端 401；1MB 体积门将拦住空库回传"
                tg_add_note msg "根因看本轮日志 OmniRoute 步骤 Found OmniRoute.tar.gz 之后的段"
                tg_add_footer msg
                send_tg "$msg" alert || true
              fi
            fi
          fi

          # ---------- 主流程：三后端降级链 OmniRoute → CliRelay → CLIProxyAPI（2026-10-11 恢复自动降级） ----------
          # 统一端口方案：三个后端全部服务在宿主机 127.0.0.1:20128 —— OpenClaw 客户端
          # （openclaw.json，随主包归档持久化）硬编码指向 127.0.0.1:20128/v1，ai-api 隧道
          # 也是固定地址模式指向 20128（tunnels.conf），因此降级不换端口、不改客户端、
          # 不重建隧道。CliRelay/CLIProxyAPI 官方 compose/容器原生端口 8317，降级路径用
          # docker run 侧端口映射改绑 20128，容器内仍是 8317，凭据/配置零改动。
          # 降级链：主用 OmniRoute 起不来 → 回退 CliRelay 全栈（数据随 CliRelay.tar.gz 恢复）
          # → CliRelay 也起不来 → 回退 CLIProxyAPI 单容器（数据随 CLIProxyAPI.tar.gz 恢复）。
          # 每次降级记录 FALLBACK_REASON 写入 BACKEND_STATE，通知步骤自动向 Telegram 报告。
          ACTIVE_BACKEND=""
          FALLBACK_REASON=""
          # pinned 模式：手动运行时显式指定后端 → 只跑它，失败即失败（不降级），
          # 便于定点验证单个后端；auto（默认/定时触发）走完整降级链
          PINNED_BACKEND="${AI_BACKEND_INPUT:-auto}"

          if [ "$PINNED_BACKEND" = "omniroute" ]; then
            if start_omniroute && wait_api_ready "omniroute" 150; then
              ACTIVE_BACKEND=omniroute
              docker ps -a
              echo "✅ 当前生效 AI 网关: OmniRoute（pinned）"
            else
              echo "❌ OmniRoute（pinned）未就绪 —— pinned 模式不降级，直接失败"
              docker logs omniroute --tail 100 || true
              exit 1
            fi
          elif [ "$PINNED_BACKEND" = "clirelay" ]; then
            restore_clirelay_data || true
            if start_clirelay && wait_clirelay_ready "clirelay" 120; then
              ACTIVE_BACKEND=clirelay
              docker ps -a
              echo "✅ 当前生效 AI 网关: CliRelay（pinned）"
            else
              echo "❌ CliRelay（pinned）未就绪 —— pinned 模式不降级，直接失败"
              $COMPOSE logs --tail 80 2>/dev/null || true
              exit 1
            fi
          elif [ "$PINNED_BACKEND" = "cliproxyapi" ]; then
            restore_cliproxyapi_data
            if start_cliproxyapi && wait_clirelay_ready "cliproxyapi" 120; then
              ACTIVE_BACKEND=cliproxyapi
              docker ps -a
              echo "✅ 当前生效 AI 网关: CLIProxyAPI（pinned）"
            else
              echo "❌ CLIProxyAPI（pinned）未就绪 —— pinned 模式不降级，直接失败"
              docker logs cliproxyapi --tail 100 || true
              exit 1
            fi
          elif start_omniroute && wait_api_ready "omniroute" 150; then
            ACTIVE_BACKEND=omniroute
            docker ps -a
            echo "✅ 当前生效 AI 网关: OmniRoute"
          else
            if [ -z "${FALLBACK_REASON:-}" ]; then
              FALLBACK_REASON="OmniRoute 未能在预期时间内就绪 · compose 启动或 20128 健康检查失败"
            fi
            echo "⚠️ $FALLBACK_REASON，打印日志并回退 CliRelay..."
            echo "--- omniroute logs (tail 100) ---"
            docker logs omniroute --tail 100 || true
            docker rm -f omniroute 2>/dev/null || true

            restore_clirelay_data || {
              [ -z "${FALLBACK_REASON:-}" ] && FALLBACK_REASON="CliRelay 数据准备失败 · 归档缺失/校验失败或 bootstrap 迁移失败"
              echo "⚠️ CliRelay 数据准备失败，跳过 CliRelay 直接回退 CLIProxyAPI"
            }

            if [ -z "${ACTIVE_BACKEND:-}" ] && [ -f "$CLIRELAY_DIR/docker-compose.yml" ] \
              && start_clirelay && wait_clirelay_ready "clirelay" 120; then
              ACTIVE_BACKEND=clirelay
              docker ps -a
              echo "✅ 已回退，当前生效 AI 网关: CliRelay（全栈，20128 统一端口）"
            else
              [ -z "${ACTIVE_BACKEND:-}" ] && [ -z "${FALLBACK_REASON:-}" ] && \
                FALLBACK_REASON="CliRelay 未能在预期时间内就绪 · compose 启动或 20128 健康检查失败"
              echo "⚠️ CliRelay 也未就绪，打印日志并回退 CLIProxyAPI..."
              echo "--- clirelay compose logs (tail 80) ---"
              $COMPOSE logs --tail 80 2>/dev/null || true
              $COMPOSE down -v --remove-orphans 2>/dev/null || true
              docker rm -f cli-proxy-api clirelay 2>/dev/null || true

              restore_cliproxyapi_data
              if start_cliproxyapi && wait_clirelay_ready "cliproxyapi" 120; then
                ACTIVE_BACKEND=cliproxyapi
                docker ps -a
                echo "✅ 已回退，当前生效 AI 网关: CLIProxyAPI（单容器，20128 统一端口）"
              else
                echo "❌ 三个后端全部未就绪（omniroute/clirelay/cliproxyapi）"
                docker logs cliproxyapi --tail 100 2>/dev/null || true
                exit 1
              fi
            fi
          fi
          {
            printf 'ACTIVE_BACKEND=%s\n' "$ACTIVE_BACKEND"
            if [ -n "${FALLBACK_REASON:-}" ]; then printf 'FALLBACK_REASON=%s\n' "$FALLBACK_REASON"; fi
          } > "$BACKEND_STATE"

          # Hand off to the systemd unit (Restart=always) instead of a bare
          # nohup, so the tunnel survives signal sweeps and restarts itself.
          if [ -f "$GITHUB_WORKSPACE/.github/scripts/tunnels/tunnels.sh" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/tunnels/tunnels.sh" ensure ai-api || true
          else
            nohup cloudflared tunnel run --protocol http2 --url http://127.0.0.1:20128 ai-api \
              > ~/.openclaw/logs/cloudflared_omniroute.log 2>&1 &
            sleep 5
            echo $! > ~/.openclaw/logs/cloudflared_omniroute.pid
          fi

          echo "ai-api 命名隧道已启动（systemd 托管，固定地址模式），当前后端: ${ACTIVE_BACKEND}"

      - name: Run OpenClaw
        id: run_openclaw
        # 2026-10-02 事故根因：任一前置服务步骤（quota-board/trae/zcode2api…）硬失败时，
        # 本步骤被静默跳过 —— meta 不写、网关不起，且 outcome=skipped 连
        # 「Notify OpenClaw startup failure」（只认 failure）都不触发，OpenClaw 整条链
        # 无声消失。本步骤的自愈机制（fallback 重装、失败通知）本就为「自己
        # 失败」设计，理应在任何前置失败后仍获得执行机会；cancelled 除外 —— 主动取消
        # 时不该再拉起网关。
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          RUN_OPENCLAW_STEP_LOG="/tmp/run-openclaw-step.log"
          RUN_OPENCLAW_META="/tmp/run-openclaw-meta.env"
          : > "$RUN_OPENCLAW_STEP_LOG"
          : > "$RUN_OPENCLAW_META"
          exec > >(tee -a "$RUN_OPENCLAW_STEP_LOG") 2>&1

          CURRENT_OPENCLAW_VERSION="$(openclaw --version 2>/dev/null | head -n 1 || true)"
          CURRENT_OPENCLAW_SEMVER="$(printf '%s\n' "$CURRENT_OPENCLAW_VERSION" | grep -oE '[0-9]{4}\.[0-9]+\.[0-9]+' | head -n 1 || true)"
          KNOWN_GOOD_VERSION_FILE="$HOME/.openclaw/openclaw-known-good-version"
          echo "CURRENT_OPENCLAW_VERSION=$CURRENT_OPENCLAW_VERSION" >> "$RUN_OPENCLAW_META"
          echo "CURRENT_OPENCLAW_SEMVER=$CURRENT_OPENCLAW_SEMVER" >> "$RUN_OPENCLAW_META"
          echo "FAIL_STAGE=preflight_doctor" >> "$RUN_OPENCLAW_META"
          PREFLIGHT_BEGIN_TS=$(date +%s)

          fail_startup() {
            local msg="$1"
            echo "❌ $msg"
            exit 1
          }

          normalize_openclaw_version() {
            printf '%s\n' "${1:-}" | tr -d '[:space:]' | grep -oE '^[0-9]{4}\.[0-9]+\.[0-9]+$' || true
          }

          read_openclaw_version_file() {
            local file="$1"
            if [ -s "$file" ]; then
              normalize_openclaw_version "$(head -n 1 "$file" 2>/dev/null || true)"
            fi
          }

          record_successful_openclaw_version() {
            local version="$1"
            version="$(normalize_openclaw_version "$version")"
            if [ -z "$version" ]; then
              echo "⚠️ Cannot record successful OpenClaw version: current version is empty or invalid."
              return 0
            fi
            mkdir -p "$HOME/.openclaw"
            printf '%s\n' "$version" > "$KNOWN_GOOD_VERSION_FILE"
            echo "RECORDED_SUCCESSFUL_OPENCLAW_VERSION=$version" >> "$RUN_OPENCLAW_META"
            echo "✅ Recorded successful OpenClaw version: $version"
          }

          resolve_fallback_openclaw_version() {
            local version=""

            version="$(read_openclaw_version_file "$KNOWN_GOOD_VERSION_FILE")"
            if [ -n "$version" ]; then
              echo "FALLBACK_VERSION_SOURCE=known_good_file" >> "$RUN_OPENCLAW_META"
              echo "$version"
              return 0
            fi

            if [ -s "$HOME/.openclaw/openclaw.json" ]; then
              version="$(jq -r '.meta.lastTouchedVersion // empty' "$HOME/.openclaw/openclaw.json" 2>/dev/null | head -n 1 || true)"
              version="$(normalize_openclaw_version "$version")"
              if [ -n "$version" ]; then
                echo "FALLBACK_VERSION_SOURCE=meta_lastTouchedVersion" >> "$RUN_OPENCLAW_META"
                echo "$version"
                return 0
              fi
            fi

            echo ""
            return 1
          }

          fix_openclaw_permissions() {
            echo "🔧 Fixing file permissions to pass security checks..."
            sudo chmod -R o-w "$(npm root -g)"
            chmod 700 ~/.openclaw
            if [ -f ~/.openclaw/openclaw.json ]; then
              chmod 600 ~/.openclaw/openclaw.json
            fi
          }

          openclaw_port_listening() {
            sudo lsof -Pi :18789 -sTCP:LISTEN -t >/dev/null
          }

          openclaw_log_ready() {
            journalctl --user -u openclaw-gateway.service --since "5 minutes ago" --no-pager 2>/dev/null \
              | grep -q "\[gateway\] ready"
          }

          openclaw_health_http_ok() {
            [ "$(curl -fsS -o /dev/null -w "%{http_code}" --connect-timeout 3 --max-time 15 http://127.0.0.1:18789/health || true)" = "200" ]
          }

          wait_for_openclaw_health() {
            local label="$1"
            local timeout_sec="${2:-180}"
            local interval_sec="${3:-5}"
            local start_ts now_ts elapsed
            start_ts=$(date +%s)

            echo "Waiting for OpenClaw health (${label}, timeout=${timeout_sec}s)..."
            while true; do
              now_ts=$(date +%s)
              elapsed=$((now_ts - start_ts))

              if openclaw_port_listening; then
                if openclaw_health_http_ok; then
                  echo "✅ OpenClaw Gateway health is OK after ${elapsed}s (${label})."
                  return 0
                fi

                if openclaw_log_ready; then
                  echo "⏳ Gateway is listening and logged ready, but /health is still slow after ${elapsed}s (${label}); continuing grace wait."
                else
                  echo "⏳ Gateway port is listening, waiting for ready/health... ${elapsed}/${timeout_sec}s (${label})"
                fi
              else
                echo "⏳ Gateway port is not listening yet... ${elapsed}/${timeout_sec}s (${label})"
              fi

              if [ "$elapsed" -ge "$timeout_sec" ]; then
                echo "❌ OpenClaw Gateway health did not become OK within ${timeout_sec}s (${label})."
                return 1
              fi
              sleep "$interval_sec"
            done
          }

          dump_openclaw_diagnostics() {
            echo "⚠️ Gateway not healthy yet. Diagnostics:"
            echo "--- systemd status ---"
            systemctl --user --no-pager --full status openclaw-gateway.service || true
            echo "--- recent journal ---"
            journalctl --user -u openclaw-gateway.service --since "10 minutes ago" --no-pager | tail -n 120 || true
            echo "--- /tmp/openclaw logs ---"
            find /tmp/openclaw -maxdepth 1 -type f -name 'openclaw-*.log' -printf '%T@ %p\n' 2>/dev/null \
              | sort -nr \
              | head -2 \
              | cut -d' ' -f2- \
              | while IFS= read -r log_file; do
                  echo "--- tail $log_file ---"
                  tail -n 80 "$log_file" || true
                done
          }

          fix_openclaw_permissions

          echo "FAIL_STAGE=config_validate" >> "$RUN_OPENCLAW_META"
          echo "🧪 Preflight config validation for $CURRENT_OPENCLAW_VERSION ..."
          CONFIG_VALID_FOR_CURRENT=0
          DOCTOR_RAN=0
          if openclaw config validate >/tmp/config-validate.log 2>&1; then
            CONFIG_VALID_FOR_CURRENT=1
            echo "✅ Config valid for current version."
          else
            echo "⚠️ Config invalid for current version. Trying 'openclaw doctor --fix' to repair, then re-validating. Details:"
            tail -n 15 /tmp/config-validate.log 2>/dev/null || true
            echo "🛠️ Running 'openclaw doctor --fix' to repair the config..."
            DOCTOR_RAN=1
            openclaw doctor --fix || echo "DOCTOR_EXIT=$? (non-fatal, continuing)"
            if openclaw config validate >/tmp/config-validate-2.log 2>&1; then
              CONFIG_VALID_FOR_CURRENT=1
              echo "✅ Config repaired by doctor; now valid for current version."
            else
              echo "❌ Config still invalid after doctor. Gateway start will be skipped; fallback reinstall, downgrade guard and snapshot rollback handle recovery. Details:"
              tail -n 10 /tmp/config-validate-2.log 2>/dev/null || true
            fi
          fi

          if [ "$CONFIG_VALID_FOR_CURRENT" = "1" ] && [ "$DOCTOR_RAN" != "1" ]; then
            # 优化（2026-10-02）：config 已校验通过时，preflight doctor 只在 OpenClaw
            # **版本变化**时才跑。实测该步固定耗时 79s，而配置合法时 doctor 并无
            # 修复动作（日志仅 warnings + registry 刷新 + agent-db 完整性检查）。
            # 版本未变 ⇒ 跳过（省 79s）；版本一变 ⇒ 照跑，保住升级时的自愈。
            # 状态文件放在 ~/.openclaw 内：它随主包归档/恢复，上轮记录得以延续。
            # 版本解析失败时（CURRENT_OPENCLAW_SEMVER 为空）一律照跑 —— 保守。
            DOCTOR_STATE_FILE="$HOME/.openclaw/openclaw-doctor-last-version"
            LAST_DOCTOR_VERSION="$(head -n 1 "$DOCTOR_STATE_FILE" 2>/dev/null || true)"
            if [ -n "$CURRENT_OPENCLAW_SEMVER" ] && [ "$LAST_DOCTOR_VERSION" = "$CURRENT_OPENCLAW_SEMVER" ]; then
              echo "⏭️ Skipping preflight doctor: config valid & version unchanged (${CURRENT_OPENCLAW_SEMVER})"
            else
              echo "🛠️ Running preflight 'openclaw doctor --fix' before gateway restart... (${LAST_DOCTOR_VERSION:-none} → ${CURRENT_OPENCLAW_SEMVER})"
              openclaw doctor --fix || echo "DOCTOR_EXIT=$? (non-fatal, continuing)"
              mkdir -p "$HOME/.openclaw"
              printf '%s\n' "$CURRENT_OPENCLAW_SEMVER" > "$DOCTOR_STATE_FILE"
            fi
          fi
          PREFLIGHT_END_TS=$(date +%s)
          echo "PREFLIGHT_DOCTOR_DURATION_SEC=$((PREFLIGHT_END_TS - PREFLIGHT_BEGIN_TS))" >> "$RUN_OPENCLAW_META"

          echo "FAIL_STAGE=initial_start" >> "$RUN_OPENCLAW_META"
          INITIAL_START_BEGIN_TS=$(date +%s)
          echo "Restarting OpenClaw gateway..."

          # 2026-10-22 冷启动优化（run 39637798065 日志实证）：unit 由 CLI 生成时带
          # TimeoutStopSec=330，而 `gateway install --force` 已经把服务拉起来了；
          # 紧接着再 `gateway restart` 会走一遍完整 stop→start —— 首启进程还在 boot、
          # 不响应 SIGTERM，systemd 就陪它等到 330s 才 SIGKILL。日志里
          # 16:59:47 "Gateway service installed" → 17:05:23 "Restarted systemd service"
          # 的 336s 静默正是它（冷启动根本没有「旧进程」要停）。
          # 对策两层：① drop-in 把停机上限压到 90s（install 重写主 unit 不影响 .d 覆盖）；
          # ② 冷启动不再调 CLI restart：install 已拉起就直接等健康，unit 未激活才显式 start。
          GW_UNIT="openclaw-gateway.service"
          GW_DROPIN_DIR="$HOME/.config/systemd/user/${GW_UNIT}.d"
          # 2026-10-22 修复（run 5507 日志+本机复现实证）：drop-in 必须在 install
          # **之后**落盘。install 的发布事务会快照受管工件（unit/generated/service.d
          # 系目录）并在发布间隙做严格指纹比对（systemd-definition-mutation:248），
          # 事务开始前已存在的 drop-in 目录会被判「工件被外部改动」→ 中止 + 回滚
          # 删 unit，该机后续 install 全部连带失败。EE6A3D5 起的正确顺序是 install
          # 成功后再补 drop-in（TimeoutStopSec 对下一次 stop 依然生效，无损失）。
          # 防御：若上一轮残留了 drop-in（如 10-22 失败轮），先摘除再装；
          # 装完后由 apply_gw_dropin 统一重写（不依赖旧目录）。
          if [ -d "$GW_DROPIN_DIR" ]; then
            mv "$GW_DROPIN_DIR" "${GW_DROPIN_DIR}.pre-install.$$" 2>/dev/null || true
            systemctl --user daemon-reload 2>/dev/null || true
          fi

          # install 成功后落盘 drop-in：目录 755 / 文件 644（install 的安全门会拒绝
          # group/world-writable 的定义文件 —— run 5507 当晚本机复现的第二道坎）。
          # 顺带清掉上方摘除时侧移的旧目录。
          apply_gw_dropin() {
            mkdir -p "$GW_DROPIN_DIR"
            chmod 755 "$GW_DROPIN_DIR"
            cat > "$GW_DROPIN_DIR/10-stop-timeout.conf" <<'EOF_STOP'
          [Service]
          TimeoutStopSec=90
          EOF_STOP
            chmod 644 "$GW_DROPIN_DIR/10-stop-timeout.conf"
            rm -rf "${GW_DROPIN_DIR}".pre-install.* 2>/dev/null || true
            systemctl --user daemon-reload 2>/dev/null || true
          }

          INITIAL_START_RESTART_OK=1
          if [ "$CONFIG_VALID_FOR_CURRENT" != "1" ]; then
            echo "⚠️ Skipping gateway start: config still invalid after doctor. Going straight to fallback reinstall with the recorded compatible version."
            INITIAL_START_RESTART_OK=0
          elif ! openclaw gateway install --force; then
            echo "⚠️ Initial gateway install failed; will attempt fallback reinstall."
            INITIAL_START_RESTART_OK=0
          else
            if [ "$(systemctl --user is-active "$GW_UNIT" 2>/dev/null || echo inactive)" = "active" ]; then
              echo "⏭️ unit 已由 install --force 拉起，跳过 gateway restart，直接等健康（冷启动快路径）"
            else
              echo "ℹ️ unit 未激活，systemctl --user start 拉起（不走 CLI restart）"
              systemctl --user reset-failed "$GW_UNIT" 2>/dev/null || true
              systemctl --user start "$GW_UNIT" 2>/dev/null || echo "⚠️ systemctl start 返回非零，交给健康检查判定"
            fi
            # drop-in 在 install 之后落盘（原因见上）：此刻 unit 已在盘上、服务已拉起，
            # 等健康前补齐 TimeoutStopSec=90（对下一次 stop 生效）
            apply_gw_dropin
            echo "COLD_START_SKIP_RESTART=1" >> "$RUN_OPENCLAW_META"
          fi

          if [ "$INITIAL_START_RESTART_OK" = "1" ] && wait_for_openclaw_health "initial_start" 180 5; then
              INITIAL_START_END_TS=$(date +%s)
              echo "INITIAL_START_DURATION_SEC=$((INITIAL_START_END_TS - INITIAL_START_BEGIN_TS))" >> "$RUN_OPENCLAW_META"
              record_successful_openclaw_version "$CURRENT_OPENCLAW_SEMVER"
              echo "✅ OpenClaw Gateway is healthy!"
          else
              INITIAL_START_END_TS=$(date +%s)
              echo "INITIAL_START_DURATION_SEC=$((INITIAL_START_END_TS - INITIAL_START_BEGIN_TS))" >> "$RUN_OPENCLAW_META"
              dump_openclaw_diagnostics

              echo "FAIL_STAGE=fallback_reinstall" >> "$RUN_OPENCLAW_META"
              echo "🔄 Initial start failed after preflight doctor. Attempting to fallback and reinstall recorded OpenClaw version..."

              TARGET_VERSION="$(resolve_fallback_openclaw_version || true)"
              if [ -z "$TARGET_VERSION" ]; then
                fail_startup "No fallback OpenClaw version found. Checked $KNOWN_GOOD_VERSION_FILE and .meta.lastTouchedVersion."
              fi
              echo "✅ Selected fallback OpenClaw version: $TARGET_VERSION"

              echo "Installing openclaw@$TARGET_VERSION ..."
              echo "FALLBACK_TARGET_VERSION=$TARGET_VERSION" >> "$RUN_OPENCLAW_META"
              FALLBACK_REINSTALL_BEGIN_TS=$(date +%s)
              npm i -g "openclaw@$TARGET_VERSION"

              fix_openclaw_permissions

              echo "🧪 Validating config against fallback openclaw@$TARGET_VERSION ..."
              if openclaw config validate >/tmp/config-validate-fallback.log 2>&1; then
                echo "✅ Config valid for fallback version."
              else
                echo "⚠️ Config invalid for fallback version. Trying 'openclaw doctor --fix' first. Details:"
                tail -n 10 /tmp/config-validate-fallback.log 2>/dev/null || true
                openclaw doctor --fix || echo "DOCTOR_EXIT=$? (non-fatal, continuing)"
                if openclaw config validate >/tmp/config-validate-fallback-2.log 2>&1; then
                  echo "✅ Config repaired by doctor for fallback version."
                else
                  DOWNGRADE_TS="$(date +%Y%m%d-%H%M%S)"
                  echo "❌ Config still invalid for fallback version after doctor. Moving the current state aside so the fallback version starts clean (kept as *.state-bak-$DOWNGRADE_TS; sessions will be lost, upgrade back to recover). Details:"
                  tail -n 10 /tmp/config-validate-fallback-2.log 2>/dev/null || true
                  for STATE_DB in "$HOME/.openclaw/state/openclaw.sqlite" "$HOME/.openclaw/state/openclaw.sqlite-wal" "$HOME/.openclaw/state/openclaw.sqlite-shm"; do
                    if [ -f "$STATE_DB" ]; then
                      mv "$STATE_DB" "$STATE_DB.state-bak-$DOWNGRADE_TS" && echo "➡️ Moved aside: $STATE_DB"
                    fi
                  done
                  echo "🛠️ Running 'openclaw doctor --fix' on the clean state..."
                  openclaw doctor --fix || echo "DOCTOR_EXIT=$? (non-fatal, continuing)"
                fi
              fi

              echo "Restarting OpenClaw after fallback reinstall..."
              FALLBACK_RESTART_OK=1
              # 2026-10-03 事故：降级后的启动崩溃循环会烧光 systemd StartLimitBurst
              # （10 次/300s），此后 restart 恒报 "Start request repeated too quickly"，
              # 自愈还没开始就被熔断锁死。restart 前先清 failed 计数。
              systemctl --user reset-failed openclaw-gateway.service 2>/dev/null || true
              if [ -d "$GW_DROPIN_DIR" ]; then
                mv "$GW_DROPIN_DIR" "${GW_DROPIN_DIR}.pre-install.$$" 2>/dev/null || true
              fi
              if ! openclaw gateway install --force; then
                echo "⚠️ Fallback gateway install failed."
                FALLBACK_RESTART_OK=0
              elif ! openclaw gateway restart; then
                echo "⚠️ Fallback gateway restart failed."
                FALLBACK_RESTART_OK=0
              fi

              if [ "$FALLBACK_RESTART_OK" = "1" ]; then
                # 回退重装的 install 同样要求无 drop-in 现场；成功后先回放再等健康
                apply_gw_dropin
              fi
              if [ "$FALLBACK_RESTART_OK" = "1" ] && wait_for_openclaw_health "fallback_reinstall" 180 5; then
                FALLBACK_REINSTALL_END_TS=$(date +%s)
                echo "FALLBACK_REINSTALL_DURATION_SEC=$((FALLBACK_REINSTALL_END_TS - FALLBACK_REINSTALL_BEGIN_TS))" >> "$RUN_OPENCLAW_META"
                record_successful_openclaw_version "$TARGET_VERSION"
                echo "✅ OpenClaw Gateway is healthy after fallback reinstall!"
              else
                FALLBACK_REINSTALL_END_TS=$(date +%s)
                echo "FALLBACK_REINSTALL_DURATION_SEC=$((FALLBACK_REINSTALL_END_TS - FALLBACK_REINSTALL_BEGIN_TS))" >> "$RUN_OPENCLAW_META"
                dump_openclaw_diagnostics

                # 2026-10-11 移除版本化快照回滚（主人拍板）：快照是主包的服务端副本，
                # 主包坏它也坏，兜底价值≈0，却长期占用一份 4.2GB 云端空间。自愈链
                # 收敛为：doctor --fix → 回退重装（已记录的兼容版本）。走到这里说明
                # 两条都失败了，直接判死走失败通知（人工介入，现场保留）。
                echo "FAIL_STAGE=fallback_reinstall" >> "$RUN_OPENCLAW_META"
                err="回退到最近记录版本（${TARGET_VERSION:-未知}）重装后，OpenClaw 依然无法启动（健康检查失败）"
                fail_startup "$err"
              fi
          fi

      - name: Notify OpenClaw startup failure
        if: ${{ always() && (steps.install_openclaw.outcome == 'failure' || steps.run_openclaw.outcome == 'failure') }}
        env:
          # send_tg 发送闸 + 收尾区接线（时长走 tg_add_footer 内的 runner 开机时刻兜底，
          # 无需注入起始时间——平台无 github.run_started_at 上下文）
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            step_log="/tmp/run-openclaw-step.log"
            meta_file="/tmp/run-openclaw-meta.env"
            install_outcome="${{ steps.install_openclaw.outcome }}"
            run_outcome="${{ steps.run_openclaw.outcome }}"

            sanitize_log() {
              perl -pe 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\r//g'
            }

            error_summary=""
            # Install/恢复失败优先取它自己的日志：此时 Run OpenClaw 可能已经
            # 被 doctor 用空壳配置拉起并“成功”，openclaw.log 里看不到恢复失败的真因。
            if [ "$install_outcome" = "failure" ] && [ -f /tmp/install-openclaw-step.log ]; then
              error_summary=$(sanitize_log < /tmp/install-openclaw-step.log | grep -Ei 'error|fail|exception|unhealthy|timed out|cannot|denied|missing|invalid|解包失败|不可用|revision|拒绝' | tail -n 30 || true)
              if [ -z "$error_summary" ]; then
                error_summary=$(sanitize_log < /tmp/install-openclaw-step.log | tail -n 60 || true)
              fi
            fi
            if [ -z "$error_summary" ] && [ -f openclaw.log ]; then
              error_summary=$(sanitize_log < openclaw.log | grep -Ei 'error|fail|exception|unhealthy|timed out|cannot|denied|missing|invalid' | tail -n 20 || true)
              if [ -z "$error_summary" ]; then
                error_summary=$(sanitize_log < openclaw.log | tail -n 40 || true)
              fi
            fi
            if [ -z "$error_summary" ] && [ -f "$step_log" ]; then
              error_summary=$(sanitize_log < "$step_log" | grep -Ei 'error|fail|exception|unhealthy|timed out|cannot|denied|missing|invalid|doctor|fallback|restart' | tail -n 30 || true)
              if [ -z "$error_summary" ]; then
                error_summary=$(sanitize_log < "$step_log" | tail -n 60 || true)
              fi
            fi
            if [ -z "$error_summary" ]; then
              error_summary="openclaw.log 与步骤日志均未找到可用摘要"
            fi
            # 与同文件 send_telegram_alert / send_archive_alert 同口径（尾部 1200 字节）：
            # 超长输出会让 <pre> 跨 4000 字符分片、标签断开即破版（规范 · 分节）
            error_summary=$(printf '%s' "$error_summary" | tail -c 1200)

            ts_host=""
            ts_ip=""
            if [ -f "$HOME/ts.env" ]; then
              ts_host=$(grep '^TS_HOST=' "$HOME/ts.env" | tail -n 1 | cut -d= -f2- || true)
              ts_ip=$(grep '^TS_IP=' "$HOME/ts.env" | tail -n 1 | cut -d= -f2- || true)
            fi
            ssh_entry="Tailscale SSH 暂不可用 · 稍后查看 Actions 日志"
            if [ -n "$ts_host" ] && [ -n "$ts_ip" ]; then
              ssh_entry="tailscale ssh runner@${ts_host} · 或 ssh runner@${ts_ip}"
            elif [ -n "$ts_host" ]; then
              ssh_entry="tailscale ssh runner@${ts_host}"
            fi

            current_version=""
            fallback_version=""
            fallback_version_source=""
            recorded_successful_version=""
            fail_stage=""
            initial_start_duration_sec=""
            preflight_doctor_duration_sec=""
            fallback_reinstall_duration_sec=""
            if [ -f "$meta_file" ]; then
              current_version=$(grep '^CURRENT_OPENCLAW_VERSION=' "$meta_file" | tail -n 1 | cut -d= -f2- || true)
              fallback_version=$(grep '^FALLBACK_TARGET_VERSION=' "$meta_file" | tail -n 1 | cut -d= -f2- || true)
              fallback_version_source=$(grep '^FALLBACK_VERSION_SOURCE=' "$meta_file" | tail -n 1 | cut -d= -f2- || true)
              recorded_successful_version=$(grep '^RECORDED_SUCCESSFUL_OPENCLAW_VERSION=' "$meta_file" | tail -n 1 | cut -d= -f2- || true)
              fail_stage=$(grep '^FAIL_STAGE=' "$meta_file" | tail -n 1 | cut -d= -f2- || true)
              initial_start_duration_sec=$(grep '^INITIAL_START_DURATION_SEC=' "$meta_file" | tail -n 1 | cut -d= -f2- || true)
              preflight_doctor_duration_sec=$(grep '^PREFLIGHT_DOCTOR_DURATION_SEC=' "$meta_file" | tail -n 1 | cut -d= -f2- || true)
              fallback_reinstall_duration_sec=$(grep '^FALLBACK_REINSTALL_DURATION_SEC=' "$meta_file" | tail -n 1 | cut -d= -f2- || true)
            fi

            # 恢复来源（2026-10-23）：自愈失败时也要能看出是不是靠历史 revision 起的。
            restore_source=""
            restore_rev=""
            restore_rev_time=""
            restore_time_display=""
            if [ -f /tmp/openclaw-restore-meta.env ]; then
              restore_source=$(grep '^OPENCLAW_RESTORE_SOURCE=' /tmp/openclaw-restore-meta.env | tail -n 1 | cut -d= -f2- || true)
              restore_rev=$(grep '^OPENCLAW_RESTORE_REV=' /tmp/openclaw-restore-meta.env | tail -n 1 | cut -d= -f2- || true)
              restore_rev_time=$(grep '^OPENCLAW_RESTORE_REV_TIME=' /tmp/openclaw-restore-meta.env | tail -n 1 | cut -d= -f2- || true)
            fi
            if [ -n "$restore_rev_time" ]; then
              _restore_local=$(TZ=Asia/Shanghai date -d "$restore_rev_time" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || true)
              _restore_utc=$(TZ=UTC date -d "$restore_rev_time" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || true)
              if [ -n "$_restore_local" ] && [ -n "$_restore_utc" ]; then
                restore_time_display="${_restore_local}（UTC+8） · ${_restore_utc} UTC"
              else
                restore_time_display="$restore_rev_time"
              fi
            fi

            export RUN_URL="${TG_RUN_URL}"
            export SSH_ENTRY="$ssh_entry"
            export ERROR_SUMMARY="$error_summary"
            export CURRENT_VERSION="$current_version"
            export FALLBACK_VERSION="$fallback_version"
            export FALLBACK_VERSION_SOURCE="$fallback_version_source"
            export RECORDED_SUCCESSFUL_VERSION="$recorded_successful_version"
            export FAIL_STAGE="$fail_stage"
            export INITIAL_START_DURATION_SEC="$initial_start_duration_sec"
            export PREFLIGHT_DOCTOR_DURATION_SEC="$preflight_doctor_duration_sec"
            export FALLBACK_REINSTALL_DURATION_SEC="$fallback_reinstall_duration_sec"
            # 统一 HTML 版式 + 统一收尾区（动态值一律转义；日志收敛 <pre> 等宽块；
            # HTML 解析失败直接报错不重发——修复"声明 parse_mode=HTML 但未转义"的隐患）
            # 失败阶段英文 token → 中文标签（规范 · 失败与异常：英文原因 token 不得直出通知）
            fail_stage_label=""
            if [ -n "$fail_stage" ]; then
              case "$fail_stage" in
                preflight_doctor) fail_stage_label="预检修复";;
                config_validate) fail_stage_label="配置校验";;
                initial_start) fail_stage_label="首次启动";;
                fallback_reinstall) fail_stage_label="回退重装";;
                *) fail_stage_label="$fail_stage";;
              esac
            fi
            # Install/恢复失败且 Run OpenClaw 没给出更具体阶段时，明确标成「安装/恢复」，
            # 不再让通知看起来像一次普通的启动失败。
            if [ "$install_outcome" = "failure" ] && [ -z "$fail_stage_label" ]; then
              fail_stage_label="安装/恢复"
            fi
            source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"
            # 耗时显示走真源 tg_format_ms（规范 · 时长 第 3/4 层）：≥1 秒两位小数秒、
            # 不足 1 秒整数毫秒 —— 上游写入的是整数秒，恒按 %.2f 输出时 0 会显示成
            # "0.00 秒"：看不出快慢，也让人怀疑没测到。真源唯一实现，不再内联副本。
            msg=""
            tg_add_title msg "🚨 OpenClaw 自愈失败"
            # 英文步骤名不直出通知（规范 · 失败与异常）
            tg_add_kv msg "步骤" "运行 OpenClaw"
            tg_add_path msg "Run ID" "${{ github.run_id }}"
            if [ "$restore_source" = "revision" ]; then
              tg_add_kv msg "恢复来源" "历史 revision ${restore_rev:-未知} · 创建于 ${restore_time_display:-未知}"
            fi
            [ -n "$fail_stage_label" ] && tg_add_kv msg "失败阶段" "$fail_stage_label"
            [ -n "$current_version" ] && tg_add_path msg "当前版本" "$current_version"
            [ -n "$fallback_version" ] && tg_add_path msg "回退版本" "$fallback_version"
            # 英文 token 不直出通知（规范 · 失败与异常）：known_good_file / meta_lastTouchedVersion → 中文
            if [ -n "$fallback_version_source" ]; then
              case "$fallback_version_source" in
                known_good_file) _fvs="known-good 版本文件" ;;
                meta_lastTouchedVersion) _fvs="meta 里的 lastTouchedVersion" ;;
                *) _fvs="$fallback_version_source" ;;
              esac
              tg_add_kv msg "回退来源" "$_fvs"
            fi
            [ -n "$recorded_successful_version" ] && tg_add_path msg "成功版本记录" "$recorded_successful_version"
            # 耗时走 tg_format_ms（规范 · 时长写法第 3/4 层），不再一律按秒两位小数
            [ -n "$initial_start_duration_sec" ] && tg_add_kv msg "首次启动耗时" "$(tg_format_ms "$initial_start_duration_sec")"
            [ -n "$preflight_doctor_duration_sec" ] && tg_add_kv msg "预检修复耗时" "$(tg_format_ms "$preflight_doctor_duration_sec")"
            [ -n "$fallback_reinstall_duration_sec" ] && tg_add_kv msg "回退重装耗时" "$(tg_format_ms "$fallback_reinstall_duration_sec")"
            [ -n "$ssh_entry" ] && tg_add_path msg "SSH 调试" "$ssh_entry"
            tg_add_section msg "🧾 关键日志"
            # 走真源 tg_add_pre（转义 + <pre> 包裹），与同文件归档告警同款；
            # 此前本处手拼 <pre>，是 tg_add_pre 的重复实现
            tg_add_pre msg "$error_summary"
            tg_add_footer msg
            # 统一走发送层：429 按 retry_after 重试已内置，HTML 解析失败直接报错。
            # 用 chunked 版：日志经转义后可能膨胀到单条上限，分片比整条被拒好
            send_tg_chunked "$msg" alert || true
          else
            echo "⚠️ Telegram alert skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is empty"
          fi

      - name: Run workbuddy-gateway (check update first, then serve)
        id: run_workbuddy
        # 2026-10-22 步骤重排后位于 Run OpenClaw 之后：本步失败不得级联跳过
        # （此前排在前面自然免疫，2026-10-02 事故注释同款语义）
        if: ${{ !cancelled() }}
        env:
          # send_tg 发送闸 + 收尾区接线（缺任一则本步骤通知静默跳过）
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # GitHub API 认证（配额 5000/h，而非匿名 60/h/出口 IP）。runner 出口 IP 是共享的，
          # 匿名配额会被同 IP 的其他 job 吃光 —— 本步骤查 release 版本即因此偶发失败。
          # 与 emby.yml / proxy-speedtest-gitee.yml 同口径。缺失时退回匿名 + 重定向兜底。
          WB_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # 通知真源在 step 顶层 source 一次。**不要挪进 wb_notify 函数体**：
          # 该函数在 $( ) / 管道里跑（子 shell），子 shell 内 source 不影响父 shell 的
          # 函数表，会把调用点对 send_tg 的本地覆写还原掉；而且子 shell 里 `local`
          # 管不住父 shell 的变量（规范 4.4）。
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"

          # workbuddy-gateway（jarvanh/workbuddy-gateway）：纯 Go 单二进制的本地 AI 代理网关。
          # 运行目录整体落本地盘，Dropbox 只做持久化存放 —— 与 OpenClaw/CliRelay 同口径。
          # 两处刻意分离的原因：
          #   1. 二进制不能放挂载点：rclone 按 --file-perms 合成权限（默认 0644），chmod +x 是空操作，
          #      从挂载点执行一律 "Permission denied"。
          #   2. 工作目录也不能直接用挂载点：serve 会在 cwd 下高频读写 logs/ 与 workbuddy-status.json，
          #      在 --vfs-cache-mode full 的 FUSE 挂载点上会卡住/被 runner 清理，表现为
          #      「进程已退出且 serve.log 为空」。
          # 2026-10-07 起无 WB_RUN_DIR：数据（凭据/config/usage/status/logs）直写 WB_DIR（Dropbox），
          # 二进制在本地盘；原「起前拉数据、停后回推」机制已随数据直写迁移退役。
          WB_DIR="/dropbox/self-hosted/workbuddy-gateway"
          WB_BIN_DIR="/tmp/local_workbuddy"
          WB_BIN="$WB_BIN_DIR/workbuddy-gateway"
          WB_RELEASE_BASE="https://github.com/jarvanh/workbuddy-gateway/releases/latest/download"
          WB_VER_FILE="$WB_DIR/.installed-version"
          WB_META="/tmp/run-workbuddy-meta.env"
          WB_LOG="$WB_DIR/logs/serve.log"
          : > "$WB_META"

          # workbuddy 通知的版式真源（docs/telegram-notify.md 2.5 workbuddy 段）。
          # 三个调用点（step 内就绪/失败、收尾停止）在同一作业但不同 shell，函数无法跨 step
          # 共享，故版式在两处各存一份；改版式必须同时改两处，否则停止通知会掉队。
          #
          # 用法: wb_notify <标题> <结论> <版本> <更新说明> <原因> <原始输出> [<接口/鉴权 kv>]
          # 第 7 参 = 网关就绪态，取 "1" 才补「接口 / 鉴权」两行：失败或收尾停止时服务已不在，
          # 展示一个指向已停进程的地址会误导读者。
          #
          # 取值口径（逐条见规范）：
          #   结论/更新/原因 → 人写的自然语言 → 裸文本 kv；版本/路径/端口 → 机器值 → <code>；
          #   原始输出 → <pre>，恒为正文最后一块（其后只跟收尾区）。空值整行跳过、空分节整段跳过。
          #   鉴权写实际形态：serve 以 -addr 0.0.0.0 监听（对 Tailscale/局域网开放），
          #   故显式传 -api-key 做客户端 Bearer 校验，取 AI_GATEWAY_API_KEY（workbuddy 专属，
          #   与 zcode2api 的 ZCODE_GATEWAY_API_KEY 已分家，见 zcode2api 步骤 env 注释）。
          #   （此前注释写「仅回环监听，无需密钥」，与 -addr 0.0.0.0 的实际启动参数不符，已订正）
          #   绝不编造密钥值，也不在通知里回显 key 本身。凭据段只列 workbuddy*.json 的文件名，绝不回显内容（真实 Token）。
          #   账号池取自 workbuddy-status.json（键名由上游 Go 结构体固定，见采集处注释）；
          #   免费模型列**具体模型名**（取自上游模型目录接口，见采集处注释），
          #   全量展示不折叠 —— 只给「免费模型 N」读者不知道是哪个，等于没说。
          wb_notify() {
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              local _msg=""
              tg_add_title _msg "$1"
              tg_add_kv _msg "结论" "$2"
              # 数据目录（机器值 → <code>）移到头部（主人 2026-10-06 要求）：
              # 它是「这条通知说的是哪台机/哪份数据」的定位信息，与 版本/接口/API Key
              # 同类；压在正文末尾时夹在「用量/流水」与「原始输出」之间，既不像结论
              # 也不像明细，读者要找它得翻到底。
              tg_add_path _msg "数据目录" "$WB_DIR"
              [ -n "$3" ] && tg_add_path _msg "版本" "$3"
              [ -n "$4" ] && tg_add_kv _msg "更新" "$4"
              if [ "${7:-0}" = "1" ]; then
                tg_add_path _msg "接口" "http://127.0.0.1:${WB_PORT}/v1"
                # 明文 API Key（主人 23:33 要求）：本机网关访问口令，取值即启动 serve
                # 时传入的 job 级 AI_GATEWAY_API_KEY，与客户端实际使用的一致
                # 标签「API Key」+ tg_add_path：值按规范走 <code> 等宽，
                # 客户端点一下即可整块复制（tg_add_kv 是纯文本，只能手选）
                tg_add_path _msg "API Key" "${AI_GATEWAY_API_KEY:-未取到}"
              fi
              [ -n "$5" ] && tg_add_kv _msg "原因" "$5"
              # 凭据段（🔑 凭据 · N）已按主人要求移除（2026-10-05）：凭据文件名去掉
              # 前后缀后与下方账号池条目名逐字相同，同一份名单渲染两遍纯占版面。
              # ⚠️ WB_CREDS 变量本身**保留** —— 上方签到汇总仍用它算「跳过」数
              # （_n_creds - _n_rows），删掉会让跳过数恒为 0。
              # 账号池：逐账号「一条目 + 多子行」。数据源是函数外的 WB_POOL —— 采集处
              # （启动步骤）已用 jq 解析 workbuddy-status.json 成 9 列 TSV：
              #     名录可信标记 \t 凭据文件名 \t 站点 \t 状态 \t 账号冷却 \t 额度 \t 免费模型名 \t 模型冷却 \t Token 过期
              # 采集处保证**每列都不为空**（空值填哨兵「-」），否则 read 的空白折叠会让
              # 中段空列后面的值整体左移（实测会把冷却数当模型名渲染）。故这里先把「-」
              # 还原成空串，再按原来的「非空才并入」逻辑处理，读者看不到哨兵。
              # 凭据名/站点/状态进条目行，第 5/6/8/9 列（账号冷却 / 额度 / 模型冷却 / Token 过期）
              # 并成第一个子行，第 7 列（免费模型名，可能很长）另起一个独立子行
              # 「免费模型 N · <code>名</code> · <code>名</code>」—— 与额度等短字段混在一行会被撑爆。
              # 子行必须用 tree_sub 前缀手拼 —— tree_lines 把每行都当兄弟条目，
              # 子行经它会渲染成 ├─/└─，与条目平级（规范 4.2 二层列表：子行与条目正文同列）。
              if [ -n "${WB_POOL:-}" ]; then
                local _readyflag _cf _st _state _acdl _quota _fm _cdl _tok _n_acc _rows _i _sub _x _last
                local _names _n_names _m _mline
                _n_acc="$(printf '%s\n' "$WB_POOL" | grep -c . || true)"
                tg_add_section _msg "💳 账号池 · ${_n_acc}"
                _rows=""
                _i=0
                while IFS="$(printf '\t')" read -r _readyflag _cf _st _state _acdl _quota _fm _cdl _tok; do
                  [ -z "$_cf" ] && continue
                  # 哨兵「-」还原成空串（采集处保证列非空，故此处不可能因还原再产生空列错位）
                  # 不要用 `eval "[ ... ] && x="`：本 step 跑在 Actions 默认的 `bash -e` 下
                  # （`set -uo pipefail` 不会关掉 -e），A && B 里 A 为假时整条返回 1，
                  # 循环体末条命令返回 1 会直接终止整个 step —— 只要有任何一列是哨兵「-」
                  # 就会 exit 1。改成 if 语句：无论分支走哪边，返回值恒为 0。
                  # ⚠️ _state 也必须在列：active 已映射为空串（常态不显示「· 可用」），
                  # 采集处的 or_dash 会把空串补成哨兵「-」，不还原就渲染成「· -」。
                  for _x in _state _acdl _quota _fm _cdl _tok; do
                    if [ "${!_x}" = "-" ]; then printf -v "$_x" '%s' ""; fi
                  done
                  _i=$((_i + 1))
                  _last=0
                  [ "$_i" -eq "$_n_acc" ] && _last=1
                  _rows+="$(tree_conn "$_last")$(tg_entry "$_cf" "$_st" "$_state")"$'\n'
                  # 第一个子行：账号冷却 / 额度 / 模型冷却 / Token 过期，逐项非空才并入。
                  # 账号冷却只在 state=cooldown 时有值（采集处已按状态过滤）；
                  # 过期时间在 jq 侧已带「过期 」前缀（裸时间戳读者不知道是什么）。
                  _sub=""
                  for _x in "$_acdl" "$_quota" "$_cdl" "$_tok"; do
                    [ -z "$_x" ] && continue
                    _sub="${_sub:+${_sub} · }${_x}"
                  done
                  [ -n "$_sub" ] && _rows+="$(tree_sub "$_last")$(escape_html "$_sub")"$'\n'
                  # 第二个子行：免费模型清单。全量展示、不折叠（规范 · 折叠规则：读者要逐条
                  # 核对哪些模型免费，折叠等于把最需要看的部分藏起来）。模型名是机器值 → <code>，
                  # 逐个转义。名单来自上游模型目录接口 → 格式是「名 · 名 · …」。
                  # 「免费模型 0」只在名录确实取到（_readyflag=1）时才显示 ——
                  # 接口失败时什么都不说，不把「没取到」谎报成「没有免费模型」。
                  _n_names=0
                  _mline=""
                  if [ -n "$_fm" ]; then
                    _names="$(printf '%s' "$_fm" | tr -s ' ' | sed 's/ *· */\n/g')"
                    _n_names="$(printf '%s\n' "$_names" | grep -c . || true)"
                    while IFS= read -r _m; do
                      [ -z "$_m" ] && continue
                      _mline+="${_mline:+ · }<code>$(escape_html "$_m")</code>"
                    done <<< "$_names"
                  fi
                  if [ "$_n_names" -gt 0 ]; then
                    _rows+="$(tree_sub "$_last")$(escape_html "免费模型 ${_n_names}") · ${_mline}"$'\n'
                  elif [ "${_readyflag:-0}" = "1" ]; then
                    _rows+="$(tree_sub "$_last")$(escape_html "免费模型 0")"$'\n'
                  fi
                done <<< "$WB_POOL"
                tg_add_block _msg "${_rows%$'\n'}"
                # 块尾补一个空行：tg_add_block 不补尾空行，下一个 kv（数据目录）会紧贴
                # 末条子行渲染，版式与规范示例（块与 kv 区之间空一行）不一致。
                tg_append _msg $'\n'
              fi
              # 签到段（2026-09-26 补）：workbuddy-gateway 的每日签到是 serve 内置后台协程
              # （backgroundDailyCheckin），**没有 CLI 子命令**（--help 里确实没列出），
              # 也不写进 workbuddy-status.json —— 唯一可观测出口就是 serve.log 的 [Checkin] 行。
              # 此前本通知完全没有这一段：主人看到的是「5 个账号全绿」的账号池，却无从知道
              # 今天签到跑没跑、哪个号失败了。本段即补这个缺口。
              # 数据源 WB_CHECKIN 是上一步合并好的 TSV（5 列）：凭据文件名 \t 站点 \t
              # 签到结果 \t 签到积分 \t 旅行奖励（后两列可为空，空则不展示）。
              # 逐账号一条目：签到信息一行装得下；积分跟在结果后（本次/累计/连签），
              # 旅行奖励有领取动作时独占一条子行（无领取不占行）。
              # 全量不折叠：账号量级只有个位数，读者要逐号核对，折叠等于把要看的藏起来。
              if [ -n "${WB_CHECKIN:-}" ]; then
                local _ckn _ckrows _cki _ckf _cks _ckr _cklast _ckcredit _cktravel _ckline
                _ckn="$(printf '%s\n' "$WB_CHECKIN" | grep -c . || true)"
                tg_add_section _msg "🗓 每日签到 · ${_ckn}"
                _ckrows=""
                _cki=0
                while IFS="$(printf '\t')" read -r _ckf _cks _ckr _ckcredit _cktravel; do
                  [ -z "$_ckf" ] && continue
                  _cki=$((_cki + 1))
                  if [ "$_cki" -eq "$_ckn" ]; then _cklast=1; else _cklast=0; fi
                  _ckline="$(tg_entry "$_ckf" "$_cks" "$_ckr")"
                  if [ -n "$_ckcredit" ]; then
                    _ckline="${_ckline} · $(escape_html "$_ckcredit")"
                  fi
                  _ckrows+="$(tree_conn "$_cklast")${_ckline}"$'\n'
                  if [ -n "$_cktravel" ]; then
                    _ckrows+="$(tree_sub "$_cklast")$(escape_html "$_cktravel")"$'\n'
                  fi
                done <<< "$WB_CHECKIN"
                tg_add_block _msg "${_ckrows%$'\n'}"
                tg_append _msg $'\n'
                # 汇总行（总数/成功/今日已签/失败/跳过）：**被跳过**的账号不会有「开始每日签到」
                # 行、也就不会出现在上面的条目里 —— 只有这行能暴露「有号根本没轮到」，
                # 光看逐账号条目会把「跳过」误读成「没问题」。
                if [ -n "${WB_CHECKIN_SUMMARY:-}" ]; then
                  tg_add_kv _msg "本轮汇总" "$WB_CHECKIN_SUMMARY"
                fi
                # 下次签到时刻：服务自己算的定时点（东八区，日志原文带 UTC+8 后缀）。
                if [ -n "${WB_CHECKIN_NEXT:-}" ]; then
                  tg_add_kv _msg "下次签到" "$WB_CHECKIN_NEXT"
                fi
              fi
              # 模型倍率段：数据源是上方生成的 WB_RATES_TXT（wb-models-cache.json 的
              # catalogs + 免费实测，按站点分组、站点内倍率升序（价格低者在上）每模型一行、
              # **全量不截断**）。
              # 取数失败/缓存缺失时为空，整段跳过（与凭据段同口径），绝不编造倍率。
              # 长度：send_tg 不分片，Telegram 单条上限 4096 B；倍率全量实测 2200+ B，
              # 与凭据 + 账号池（三行明细）叠加后实测 3912 B，余量仅 184 B —— 模型继续
              # 增长必然超限（超限会 400 丢弃、只留 warning，整条通知静默丢失）。
              # 故倍率段**常驻独立第二条**：主消息保持完整版式且远低于上限，倍率段自成
              # 一篇（带标题 + 收尾区）。既不砍数据，也不会因超限丢整条。
              WB_RATES_BLOCK=""
              if [ -n "${WB_RATES_TXT:-}" ]; then
                WB_RATES_BLOCK="$(tg_add_title WB_RATES_BLOCK "📊 workbuddy-gateway 模型倍率 · 模型数量${WB_RATES_N:-0}${WB_RATES_FREE_TAG:-}"; tg_add_pre WB_RATES_BLOCK "$WB_RATES_TXT"; tg_add_footer WB_RATES_BLOCK; printf '%s' "$WB_RATES_BLOCK")"
              fi
              # 用量 + 流水（看板独有，2026-10-05 补进通知）：只渲染本网关自己，
              # 避免 wb 通知里出现 zcode 数据（语义串台）。调 board.py 的 CLI 子命令 ——
              # 与看板**共用同一份渲染代码与本地实时 usage**，不另写一套、不走 Dropbox 旧副本
              # （那版仅收尾回推，实测落后 4 小时丢 93% 行）。文件缺失时 CLI 输出空串，静默跳过。
              _wb_ul_block="$(python3 /dropbox/self-hosted/quota-board/board.py usage-ledger workbuddy 12 2>/dev/null || true)"
              [ -n "$_wb_ul_block" ] && tg_append _msg "$_wb_ul_block"
              if [ -n "$6" ]; then
                tg_add_section _msg "🧾 原始输出"
                tg_add_pre _msg "$(printf '%s' "$6" | tail -c 1200)"
              fi
              tg_add_footer _msg
              send_tg "$_msg" alert || echo "::warning::TG 通知发送失败（不影响任务）"
              # 倍率段独立第二条（常驻：只要取到倍率就发）：数据全量保留，不与主条挤在
              # 同一条里超限丢弃。它自带标题 + 收尾区，是可独立成篇的一条完整通知。
              # 两条之间 sleep 1s：连续 sendMessage 撞 429 会让后一条直接丢失。
              if [ -n "${WB_RATES_BLOCK:-}" ]; then
                sleep 1
                send_tg "$WB_RATES_BLOCK" alert || echo "::warning::模型倍率段独立通知发送失败（不影响任务）"
              fi
            else
              echo "⚠️ Telegram secrets missing, skip workbuddy-gateway notification."
            fi
          }

          mkdir -p "$WB_DIR" "$WB_DIR/logs" "$WB_BIN_DIR"

          # 拉取已移除（2026-10-06）：workbuddy 的 WorkingDirectory 已直指 Dropbox
          # （/dropbox/self-hosted/workbuddy-gateway），凭据/config/usage/status 全部由网关
          # 自己直写，不再需要把数据搬进 /tmp/local_workbuddy/data 这个无人读取的运行目录。
          # 原逻辑每轮在此白跑一次 rclone copy。
          echo "0. workbuddy 数据直写 Dropbox（cwd=$WB_DIR），无需拉取"

          # ---------- 1. 检查更新：比对 GitHub Releases 的 latest 版本号与本地记录 ----------
          # 查版本失败按"保持现状"处理，不因查版本失败而少启一个服务。
          # 走两条路，任一成功即可（此前只有 ①，runner 共享出口 IP 撞上匿名配额就整轮降级）：
          #   ① GitHub API（带 token 认证，配额 5000/h 而非匿名 60/h）；
          #   ② releases/latest 的 302 重定向取 tag（**不消耗 API 配额**，纯网页跳转）。
          # ② 是兜底：即便 token 缺失或 API 抖动，仍能拿到版本号，不必把失败暴露给读者。
          echo "1. Checking workbuddy-gateway release..."
          WB_REMOTE_VER=""
          _release_json="$(curl -fsSL --max-time 20 \
            -H 'Accept: application/vnd.github+json' \
            ${WB_GH_TOKEN:+-H "Authorization: Bearer ${WB_GH_TOKEN}"} \
            https://api.github.com/repos/jarvanh/workbuddy-gateway/releases/latest 2>/dev/null || true)"
          if [ -n "$_release_json" ]; then
            WB_REMOTE_VER="$(printf '%s' "$_release_json" \
              | grep -o '"tag_name"[[:space:]]*:[[:space:]]*"[^"]*"' | head -n 1 \
              | sed 's/.*"\([^"]*\)"$/\1/' || true)"
          fi
          if [ -z "$WB_REMOTE_VER" ]; then
            echo "ℹ️ GitHub API 未取到版本（限流或不可达），改用 releases/latest 重定向兜底..."
            _eff_url="$(curl -sL -o /dev/null -w '%{url_effective}' --max-time 20 \
              https://github.com/jarvanh/workbuddy-gateway/releases/latest 2>/dev/null || true)"
            WB_REMOTE_VER="$(printf '%s' "$_eff_url" \
              | sed -n 's#.*/releases/tag/##p' | head -n 1 || true)"
            [ -n "$WB_REMOTE_VER" ] && echo "✅ 重定向兜底取到版本：${WB_REMOTE_VER}"
          fi
          WB_LOCAL_VER="$(head -n 1 "$WB_VER_FILE" 2>/dev/null || true)"

          # WB_STATE = 部署结论（是否发生了更新），WB_REASON = 只在异常/降级时给的原因，
          # WB_UPDATE = 更新说明（「已在最新版」这类正常结论不写进「原因」，避免
          # 「原因：已在最新版」这种把正常状态说成故障的写法）。
          WB_STATE=""
          WB_REASON=""
          WB_UPDATE=""
          if [ -n "$WB_REMOTE_VER" ] && [ "$WB_REMOTE_VER" = "$WB_LOCAL_VER" ] && [ -x "$WB_BIN" ]; then
            WB_STATE="已就绪"
            WB_UPDATE="已在最新版 ${WB_LOCAL_VER} · 跳过下载"
            echo "✅ 本地已是最新版（${WB_LOCAL_VER}），跳过下载"
          else
            if [ -n "$WB_REMOTE_VER" ]; then
              echo "⬇️ 发现新版本 ${WB_REMOTE_VER}（本地 ${WB_LOCAL_VER:-未安装}），开始下载..."
            else
              echo "⚠️ 无法读取 release 版本（GitHub API 不可达或限流），按当前可用版本部署"
            fi
            # 下载到本地盘的临时文件再原子替换：中途失败不会留下半个二进制
            WB_TMP_BIN="$WB_BIN_DIR/.workbuddy-gateway.new"
            if curl -fsSL --max-time 300 -o "$WB_TMP_BIN" "$WB_RELEASE_BASE/workbuddy-gateway-linux-amd64"; then
              chmod 755 "$WB_TMP_BIN"
              if [ -s "$WB_TMP_BIN" ]; then
                mv -f "$WB_TMP_BIN" "$WB_BIN"
                # mv 保留源文件模式；上面的 chmod 755 只作用于 .new 临时文件。
                # 这里对最终路径再补一次，防「临时文件权限被外部改回」等异常路径。
                chmod +x "$WB_BIN" 2>/dev/null || true
                if [ -n "$WB_REMOTE_VER" ]; then
                  printf '%s\n' "$WB_REMOTE_VER" > "$WB_VER_FILE"
                  if [ -n "$WB_LOCAL_VER" ]; then
                    WB_STATE="已更新"
                    WB_UPDATE="从 ${WB_LOCAL_VER} 更新到 ${WB_REMOTE_VER}"
                  else
                    WB_STATE="已安装"
                    WB_UPDATE="首次安装 ${WB_REMOTE_VER}"
                  fi
                else
                  WB_STATE="已就绪"
                  WB_REASON="版本号查询失败（GitHub API 不可达或限流），以现有二进制运行"
                fi
              else
                WB_STATE="下载失败"
                WB_REASON="下载产物为空"
              fi
            else
              rm -f "$WB_TMP_BIN" 2>/dev/null || true
              WB_STATE="下载失败"
              WB_REASON="GitHub Releases 下载失败"
            fi
            rm -f "$WB_TMP_BIN" 2>/dev/null || true
          fi

          WB_VER="$(head -n 1 "$WB_VER_FILE" 2>/dev/null || true)"
          echo "WB_STATE=${WB_STATE:-未知}" >> "$WB_META"
          echo "WB_VERSION=${WB_VER}" >> "$WB_META"
          printf 'WB_UPDATE=%s\n' "$WB_UPDATE" >> "$WB_META"
          printf 'WB_REASON=%s\n' "$WB_REASON" >> "$WB_META"

          # ---------- 1b. 二进制真源 = GitHub Releases（2026-09-29 v2，真源唯一化） ----------
          # 升级流程唯一正确的顺序：
          #   ① 发版：push v* tag → workbuddy-gateway 的 release.yml 自动构建并发布正式产物；
          #   ② 本步骤从 GitHub Releases 拉「正式产物」上线（绝不本地编译直上，本机曾因此
          #      出现 v1.14.11 这种官方没有的非正式版本号，无法追溯）。
          #   ③ 无需任何「回推」：setup-env.sh 的自愈（v7 起）同样直拉 GitHub
          #      releases/latest，二进制单一真源；Dropbox 只存数据，不存二进制。
          # 历史：自愈源曾是 Dropbox -current，「上线新版 → 忘记回推 → 重启回退」
          # （2026-09-29 18:25 事故）先以回推方案修补（dd04030），后按主人拍板改为
          # 自愈同源直拉 GitHub，回推整体移除 —— 真源唯一化才是根治。
          # ---------- 2. 启动 serve ----------
          # 注意：workbuddy-gateway 上游 -port 默认值是 8317。2026-10-11 起 OpenClaw 主
          # AI 网关为 OmniRoute（20128），8317 已不再被占用；workbuddy 自 2026-09 起按
          # 8318 运行，为避免客户端配置漂移保持不变，故这里仍显式传 -port 8318 覆盖。
          # 通知里的「接口」写实际绑定端口。
          WB_PORT="8318"
          WB_API="http://127.0.0.1:${WB_PORT}"
          echo "2. Starting workbuddy-gateway serve on ${WB_PORT} (systemd --user 托管)..."
          echo "   preflight: binary=$WB_BIN"
          ls -l "$WB_BIN" 2>&1 || true
          # 权限位自愈（2026-09-26 事故加固）：二进制存在但丢了 +x 时，systemd 会以
          # 203/EXEC 反复重启（当晚 23:05-23:15 崩溃循环 8 分钟，根因是手工 mv 了一个
          # 0644 的临时产物进来）。下载分支的 chmod 管不到「非下载路径」写入的二进制，
          # 故启动前统一补一次 +x：仅在「存在且不可执行」时动手，幂等、无副作用。
          if [ -f "$WB_BIN" ] && [ ! -x "$WB_BIN" ]; then
            chmod +x "$WB_BIN" 2>/dev/null || true
            echo "🔧 二进制缺可执行位，已补回：$WB_BIN"
          fi
          if [ ! -x "$WB_BIN" ]; then
            echo "❌ 二进制不可执行：$WB_BIN（下载失败或权限位丢失）"
          fi
          # serve 的工作目录是 Dropbox（WB_DIR，2026-10-06 起数据直写：凭据/状态/缓存/logs 都落这里），
          # 二进制在本地盘 WB_BIN_DIR；unit 真源 services.sh（WorkingDirectory=WB_DIR）。
          # 托管交给 services.sh（systemd --user + Restart=always）：窗口期内进程崩溃
          # 由 systemd 秒级拉起，不再依赖下一轮 run。ensure 语义 = 写单元 + 每轮重启，
          # 与本步骤原先的 pkill + nohup 等价；停止必须走 systemctl（见收尾 3b 注释）。
          # ⚠️ 2026-10-07 事故修复：此处曾残留旧门闸 cd "$WB_RUN_DIR"（/tmp/local_workbuddy/data）。
          #    数据直写迁移（2026-10-06）后该目录不再创建，runner 重启清空 /tmp 后 cd 必败 →
          #    ensure 被跳过 → systemd 单元缺失、服务起不来（告警「无法进入运行目录」）。
          #    ensure 无前置条件，直接执行。
          bash "$GITHUB_WORKSPACE/.github/scripts/services/services.sh" ensure workbuddy || true

          # 健康检查：GET /health 返回任意 HTTP 响应码即视为已监听。
          # 就绪后再校验进程是否还在：进程若已崩，端口可能短暂由 TIME_WAIT/旧进程占用，
          # 只看 HTTP 会把「刚起来就退出」判成成功（凭据缺失时网关会打警告并退出）。
          WB_READY=0
          WB_API_DEAD=0
          for i in $(seq 1 60); do
            _code="$(curl -s --connect-timeout 2 -o /dev/null -w '%{http_code}' "${WB_API}/health" || true)"
            if [ -n "$_code" ] && [ "$_code" -ge 100 ] && [ "$_code" -lt 600 ]; then
              WB_READY=1
              echo "✅ [workbuddy-gateway] ${WB_PORT} 已就绪 (HTTP ${_code})"
              break
            fi
            # 进程已不在（二进制缺失 / 启动即退出）→ 早退，不再空等满 120 秒
            if ! pgrep -f "$WB_BIN serve" >/dev/null 2>&1; then
              WB_API_DEAD=1
              echo "❌ [workbuddy-gateway] serve 进程已退出，停止等待"
              break
            fi
            echo "⏳ [workbuddy-gateway] 等待中... ${i}/60"
            sleep 2
          done

          WB_ACCOUNTS=""
          WB_STATUS_RAW="$(grep -a '账号池' "$WB_LOG" 2>/dev/null | tail -n 1 || true)"
          if [ -n "$WB_STATUS_RAW" ]; then
            WB_ACCOUNTS="$(printf '%s' "$WB_STATUS_RAW" | sed 's/.*账号池[:：][[:space:]]*//' || true)"
          fi
          echo "WB_READY=${WB_READY}" >> "$WB_META"
          printf 'WB_ACCOUNTS=%s\n' "$WB_ACCOUNTS" >> "$WB_META"

          # 凭据清单：只取文件名（真实 token 绝不回显）。serve 自动发现 cwd 下
          # workbuddy*.json 组池，这份清单就是它实际加载的凭据集合。
          WB_CREDS="$(cd "$WB_DIR" 2>/dev/null && ls -1 workbuddy*.json 2>/dev/null \
            | grep -v '^workbuddy-status\.json$' || true)"

          # 逐账号明细走 serve 写出的状态快照 workbuddy-status.json（JSON，jq 直接取）。
          # 此前用 `status` 子命令的文本输出，理由是「有 README 文档」——那个判断是错的：
          #   1. 文本输出是对齐排版的给人看的表格，字段名后跟多个空格、`过期时间` 独立成行，
          #      解析要靠 trim + 逐行匹配，脆且易漏（本轮已踩过）；
          #   2. 快照的键名其实**是稳定的**——它由上游 Go 结构体 accountSnapshot 的
          #      json tag 固定（path/edition/state/tokenExpiresAt/quotaRemaining/
          #      isPaidUser/quotaKnown/freeModels/modelCooldowns…），比文本表格更可靠。
          # 故改用 jq 取快照。字段语义照 accountSnapshot 与 monitor 表格：
          #   state: active|cooldown|paid_exhausted|expired|disabled → 可用/冷却/付费耗尽/已过期/失效
          #   quotaKnown 为 false 时额度三项无意义（monitor 显示 "-"），此处显示「未获取」
          #   quotaRemaining 按上游 formatQuota（两位小数、去尾零）
          WB_STATUS_JSON="$WB_DIR/workbuddy-status.json"

          # 免费模型名单：三路并集（见下方 siteKnownFree 说明），目录接口只是其中一路。
          # 目录接口：GET {Base}/v2/enterprises/personal/models
          #   国内站 Base=https://copilot.tencent.com，国际站 Base=https://www.workbuddy.ai
          #   站点由凭据文件的 edition 决定（cn/缺失 → 国内，intl → 国际），必须逐账号分别请求。
          # 免费判据照上游 siteKnownFree —— 它是**三路并集**，缺一路就会漏报：
          #   ① 实测 verdict=free（wb-models-cache.json 的 probes）
          #   ② 运行时 modelStates[model].costClass == free（快照里，探针观测落库）
          #   ③ 目录接口明确 0.00x（credits 解析出倍率、生效倍率 0、促销未过期）
          # 此前只实现了 ③：实测免费但**不在目录里**的模型就永远不显示
          # （deepseek-v4.1-flash 即此形态 —— 被探针标 free，却不在
          #  /v2/enterprises/personal/models 返回的 18 个模型里）。
          # ②① 都取自 serve 写出的快照/缓存，无需额外请求，故直接补进名录。
          # 生效倍率 = credits（baseMultiplier），命中**有效**促销再乘 factor（factor == 0 即 promoFree）。
          #   解析不出或倍率 > 0 → 不算免费（别把未知当免费）。
          # 这条接口只读：不产生真实 chat 请求、不消耗额度、不改变账号状态
          #   （与已废弃的 /admin/probe 相反 —— 它逐账号×逐模型串行发真实请求，
          #    44 模型 × 4 账号实测 634 秒，超过 serve 的 WriteTimeout=300 秒而被截断）。
          # 结果只用于展示，不写回快照（快照由 serve 独占重写，外部写会被覆盖）。
          # 失败不阻塞：拿不到名单就退回快照的免费模型计数（降级，绝不编造名字）。
          # 凭据直读凭据文件取 accessToken（serve 的加载源就是同一批文件），不落盘、不回显。
          # 逐账号记录「目录接口是否取到」：静默失败与「确实没有免费模型」必须区分，
          # 否则接口一挂就会把每个账号都渲染成「免费模型 0」，把故障谎报成结论。
          # 用「已成功拉取过目录的账号数 == 凭据数」判定名录是否完整可信。
          WB_FREEMAP="$(mktemp)"
          WB_FREE_OK_ACC=0
          WB_FREE_TOTAL_ACC=0
          if [ "$WB_READY" = "1" ]; then
            while IFS= read -r _cf; do
              [ -z "$_cf" ] && continue
              WB_FREE_TOTAL_ACC=$((WB_FREE_TOTAL_ACC + 1))
              _fp="$WB_DIR/$_cf"
              [ -r "$_fp" ] || continue
              _tok="$(jq -r '.auth.accessToken // ""' "$_fp" 2>/dev/null || true)"
              [ -z "$_tok" ] && continue
              _uid="$(jq -r '.account.uid // ""' "$_fp" 2>/dev/null || true)"
              _eid="$(jq -r '.account.enterpriseId // ""' "$_fp" 2>/dev/null || true)"
              _dom="$(jq -r '.auth.domain // ""' "$_fp" 2>/dev/null || true)"
              _ed="$(jq -r '.edition // "cn"' "$_fp" 2>/dev/null || true)"
              case "$(printf '%s' "$_ed" | tr 'A-Z' 'a-z')" in
                intl|international|global|workbuddy.ai) _base="https://www.workbuddy.ai" ;;
                *) _base="https://copilot.tencent.com" ;;
              esac
              _hdr=(-H "Authorization: Bearer ${_tok}"
                    -H 'X-Client-ID: codebuddy-cli'
                    -H 'X-Client-Version: 2.143.1'
                    -H 'X-Product: SaaS')
              [ -n "$_uid" ] && _hdr+=(-H "X-User-Id: ${_uid}")
              [ -n "$_eid" ] && _hdr+=(-H "X-Enterprise-Id: ${_eid}")
              [ -n "$_dom" ] && _hdr+=(-H "X-Domain: ${_dom}")
              _cat="$(curl -s --connect-timeout 5 --max-time 30 "${_hdr[@]}" \
                "${_base}/v2/enterprises/personal/models" 2>/dev/null || true)"
              if ! printf '%s' "$_cat" | jq -e '.data.models' >/dev/null 2>&1; then
                echo "⚠️ ${_cf}: 模型目录接口无有效响应（本账号免费名单留空）"
                continue
              fi
              WB_FREE_OK_ACC=$((WB_FREE_OK_ACC + 1))
              # 免费判据（照上游 parseLiveCatalog + siteKnownFree 逐条对齐）：
              #   credits 解析出 base 倍率；命中「已启用且在有效期内」的促销则乘 factor；
              #   最终倍率为 0 才计入免费名单。促销过期/未生效都不算免费。
              # 字段名照**实测**响应逐条核过，别照文档/直觉写：
              #   响应带信封 → 目录在 .data.models / .data.modelPromotions（顶层取不到）；
              #   credits 形如 "x0.79 credits" / "x0.00"，前缀是 x 不是后缀；
              #   促销的模型列表是 modelIds（小写 d），倍率在 discount.factor（不在顶层）。
              printf '%s' "$_cat" | jq -r --arg fn "$_cf" '
                (.data.modelPromotions // []) as $promos
                | (.data.models // [])[]
                | (.id // "") as $_raw
                | ($_raw | ascii_downcase | gsub("^[[:space:]]+|[[:space:]]+$"; "")) as $_id
                | select($_id != "")
                | ( .credits
                    | if . == null then null
                      elif type == "number" then .
                      elif type == "string" then
                        ( gsub("[Cc]redits?"; "") | gsub("[[:blank:]]"; "") | sub("^[xX]"; "")
                          | try tonumber catch null )
                      else null end ) as $_base
                | ( $promos
                    | map(select(((.modelIds // []) | map(ascii_downcase) | index($_id)) != null)) ) as $_mine
                | ( $_mine
                    | map(select(.enabled == true))
                    | map(select(
                        ((.schedule.validFrom // "") == "" or .schedule.validFrom <= (now | todate))
                        and ((.schedule.validUntil // "") == "" or .schedule.validUntil >= (now | todate))))
                    | sort_by(.discount.factor // 1) | .[0] ) as $_active
                # 生效倍率照上游 parseLiveCatalog 逐条对齐：
                #   命中**生效**促销 → 乘 factor；factor == 0 即免费（此时 credits 解析不出也算免费，
                #   上游此时直接取 factor 作倍率，故不能因 base 为 null 就判未知）；
                #   有促销但**未生效/已过期/已停用** → 上游一律记 PromoExpired，而 siteKnownFree
                #   要求 !PromoExpired，故都不算免费（上游常把促销价固化在 credits 里，
                #   过期后 credits 不可信）。注意判据要拿**全部**促销比，不能只看 enabled 的。
                #   无促销 → 用 credits 原价，解析不出即未知。
                | ( if $_active != null then
                      (($_active.discount.factor // 1) as $_f
                       | if $_f == 0 then 0
                         elif $_base == null then null
                         else ($_base * $_f) end)
                    elif ($_mine | length) > 0 then null
                    else $_base
                    end ) as $_mult
                | select($_mult != null and $_mult == 0)
                | "\($fn)\t\($_id)"
              ' 2>/dev/null >> "$WB_FREEMAP" || true
            done <<< "$WB_CREDS"

            # 补齐 siteKnownFree 的另外两路（② 运行时实测、① 探针 verdict）。
            # 这两路都取自 serve 自己写出的文件，不需要额外请求、不消耗额度：
            #   ② modelStates[model].costClass == free —— 逐账号的实测观测；
            #   ① wb-models-cache.json 的 probes[site|model].verdict == free —— 逐站点的实测结论，
            #      站点级，需按账号 edition 展开到该站点的每个账号（上游 siteKnownFree 正是按站点判）。
            # 为什么必须补：目录接口只返回**当前在售**的模型，实测免费但已下架/未在列的模型
            # （deepseek-v4.1-flash）在目录里根本取不到，只走 ③ 就会漏报（本轮实测少报一半）。
            WB_CACHE="$WB_DIR/wb-models-cache.json"
            # 缓存缺失时 jq --slurpfile 会报错（且引用未定义的 $cache 会直接编译失败），
            # 故缺失就用一个临时空对象顶上：只走 ②（modelStates 在快照里，仍覆盖实测免费），
            # 探针那一路自然为空，而不是整段不产出。
            WB_CACHE_SRC="$WB_CACHE"
            if [ ! -r "$WB_CACHE_SRC" ]; then
              WB_CACHE_SRC="$(mktemp)"
              printf '{}' > "$WB_CACHE_SRC"
            fi
            if [ -r "$WB_STATUS_JSON" ]; then
              jq -r --slurpfile cache "$WB_CACHE_SRC" '
                ((($cache[0].probes) // {}) | to_entries
                  | map(select(.value.verdict == "free"))
                  | map({ key: (.key | split("|") | .[0]), value: (.key | split("|") | .[1]) })
                  | group_by(.key)
                  | map({ key: .[0].key, value: [.[].value] })
                  | from_entries) as $probesBySite
                | .accounts[]?
                | (.path | split("/") | last) as $fn
                | (.edition // "cn") as $site
                | [ (.modelStates // {}) | to_entries[] | select(.value.costClass == "free") | .key ]
                  + ($probesBySite[$site] // [])
                | unique[]
                | "\($fn)\t\(.)"
              ' "$WB_STATUS_JSON" 2>/dev/null >> "$WB_FREEMAP" || true
            fi
            # 三路可能命中同一模型（如 hy3 同时被目录与实测判定），按 (账号, 模型) 去重，
            # 否则渲染层会输出「hy3 · hy3」。
            sort -u -o "$WB_FREEMAP" "$WB_FREEMAP" 2>/dev/null || true
          fi
          # 名录完整可信 ⇔ 每个凭据都成功取到目录（含「成功但 0 个免费」的账号）
          WB_FREE_READY=0
          if [ "$WB_READY" = "1" ] && [ "$WB_FREE_TOTAL_ACC" -gt 0 ] \
             && [ "$WB_FREE_OK_ACC" -eq "$WB_FREE_TOTAL_ACC" ]; then
            WB_FREE_READY=1
          fi
          WB_POOL=""
          if [ "$WB_READY" = "1" ]; then
            if [ -r "$WB_STATUS_JSON" ]; then
              # serve 每 3 秒重写该文件，读到半截会解析失败 —— 失败就本轮留空，
              # 不发半条（下一轮接力会自动补上），也绝不因此判定服务未就绪。
              # 8 列 TSV：名录可信标记 凭据文件名 站点 状态 额度 免费模型名(· 分隔) 模型冷却 Token 过期
              # 第 1 列刻意放**最前**且恒非空：`read` 会把连续制表符折叠成一个
              # （制表符属 IFS 空白），中间列一旦为空，后面的列就整体左移、
              # 错位嫁接到前一个变量上。第 1 列就把错位挡在门外。
              # 但「首列非空」**不足以**保护中间列：第 6 列（免费模型名）与第 7 列（模型冷却）
              # 都可能为空且相邻，一旦如此，后面的值会整体左移、把「模型冷却」当成模型名渲染
              # （已实测复现：输出「免费模型 1 · <code>2</code>」，2 是冷却数不是模型）。
              # 故**所有列一律不留空**：空值统一填哨兵「-」，渲染层再把哨兵还原成「跳过」。
              WB_POOL="$(TZ=Asia/Shanghai jq -r --argjson ready "${WB_FREE_READY:-0}" '
                def fq: if . > -0.005 and . < 0.005 then "0"
                        else (. * 100 | round / 100 | tostring) end;
                # 账号状态中文化：active 是**常态**，映射成空串（渲染层不显示）——
                # 主人 2026-10-06 要求去掉条目行的「· 可用」（6 个号每个都挂一遍纯占版面，
                # 且与看板 board.py 同口径：只露异常）。冷却/付费耗尽/已过期/失效仍要露出。
                def state_cn:
                  if   . == "active"         then ""
                  elif . == "cooldown"       then "冷却"
                  elif . == "paid_exhausted" then "付费耗尽"
                  elif . == "expired"        then "已过期"
                  elif . == "disabled"       then "失效"
                  else . end;
                def or_dash: if . == null or . == "" then "-" else . end;
                ( $wbraw | split("\n")
                  | map(split("\t"))
                  | map(select(length >= 2))
                  | map({ key: .[0], value: .[1] })
                  | group_by(.key)
                  | map({ key: .[0].key, value: (map(.value) | join(" · ")) })
                  | from_entries ) as $free
                | .accounts[]
                | (.path | split("/") | last) as $_fn
                # 模型级冷却的「最早恢复」时刻：遍历 modelStates 取所有 cooldownUntil 的
                # 最小值（= 至少有一个模型先可用）。换算成东八区 HH:MM（jq 前固定 TZ=Asia/Shanghai
                # + strflocaltime；此前 strftime 恒按 UTC 渲染，通知时间比北京早 8 小时）。
                # 冷却普遍是分钟级，跨天时只给 HH:MM 也够用，故不标日期（标了会把子行撑爆）。
                # 正在冷却的**具体模型名**（主人 2026-10-06 要求：别只报数量）：
                # 从 modelStates 的 key 取，只保留 cooldownUntil > now 的（已过期的冷却不算，
                # 否则会写出一条早已恢复的冷却，与「可用」自相矛盾）。
                | ( [ (.modelStates // {}) | to_entries[]
                      | select((.value | type) == "object")
                      | select((.value.cooldownUntil // 0) > now) ] ) as $_cdmpairs
                | ( [ $_cdmpairs[] | .key ] | sort ) as $_cdms
                # 最早恢复时刻：只从**仍在冷却**的条目里取最小值（此前取所有 >0 的，
                # 含已过期项 → 会渲染出过去的恢复时刻）。
                | ( [ $_cdmpairs[] | .value.cooldownUntil ] | min ) as $_mc
                | [
                    ($ready | tostring),
                    ($_fn | or_dash),
                    (if .edition == "intl" then "国际站" else "国内站" end),
                    (.state | state_cn | or_dash),
                    # 账号级冷却时刻：只在 state=cooldown 时展示。cooldownUntil 是
                    # omitempty，其他状态下即便残留也不展示 —— 免得与「可用」自相矛盾。
                    (if .state == "cooldown" and ((.cooldownUntil // 0) > 0)
                       then ("冷却 " + (.cooldownUntil | strflocaltime("%Y-%m-%d %H:%M")))
                     else "" end | or_dash),
                    # 额度行只留额度（主人 2026-10-06 要求去掉「· 免费/付费」后缀：
                    # 该属性由下方「免费模型 N · 模型名」子行表达，两处重复纯占版面）
                    (if .quotaKnown then ("额度剩 " + (.quotaRemaining | fq))
                     else "额度未获取" end),
                    ($free[$_fn] // "" | or_dash),
                    # 模型冷却：**具体模型名** + 最早恢复时刻（缺一不写半截）
                    (if ($_cdms | length) > 0
                       then ("模型冷却 " + ($_cdms | join(" · "))
                             + (if ($_mc // 0) > 0
                                  then (" · 最早 " + ($_mc | strflocaltime("%H:%M")) + " 恢复")
                                else "" end))
                     else "" end | or_dash),
                    (if (.tokenExpiresAt // 0) > 0 then ("过期 " + (.tokenExpiresAt | strflocaltime("%Y-%m-%d %H:%M"))) else "" end | or_dash)
                  ]
                | @tsv
              ' --rawfile wbraw "$WB_FREEMAP" "$WB_STATUS_JSON" 2>/dev/null || true)"
              if [ -z "$WB_POOL" ]; then
                echo "⚠️ workbuddy-status.json 解析失败（多为读到 serve 正在重写的半截文件），本轮账号池明细留空"
              fi
            else
              echo "⚠️ 未找到 $WB_STATUS_JSON（账号池明细本轮留空）"
            fi
          fi

          # 倍率段数据源（三路合并、实测优先）：不做任何模型名过滤，全部列出。
          #   目录价  ：wb-models-cache.json 的 catalogs.<站点>[].multiplier（已含促销）
          #   站点汇总：status 顶层 models 数组的 cnMultiplier/intlMultiplier（每模型×每站点）
          #   免费实测：运行时 modelStates.costClass==free（逐账号按站点归集）
          #             + 探针 probes[site|model].verdict==free（站点级）
          # 只看目录会漏模型（实测缺口）：glm-5.3-flash 在 cn 目录 multiplier=null、
          # hy4-preview-f 在 cn 目录根本没有 —— 靠站点汇总表补齐；
          # deepseek-v4.1-flash 目录标 0.03 但 intl 账号实测免费 —— 实测优先于目录价。
          #
          # 不按 fromLive 分组（主人 08:06 要求取消）：所有模型混在一组、按倍率升序，
          # 只保留站点分组（国内站 / 国际站）。fromLive 不再参与取数、排序与渲染。
          WB_RATES_CAT="$(mktemp)"; WB_RATES_MODELS="$(mktemp)"; WB_RATES_FREE="$(mktemp)"
          if [ -n "${WB_CACHE:-}" ] && [ -r "$WB_CACHE" ]; then
            # 4 列：站点 / 倍率 / 归一键 / 显示名
            jq -r '
              (.catalogs // {}) | to_entries[] as $e | $e.value[]?
              | select((.multiplier // null) != null)
              | ((.id // "") | ascii_downcase | gsub("^[[:space:]]+|[[:space:]]+$"; "")) as $_id
              | select($_id != "")
              | "\($e.key)\t\(.multiplier)\t\($_id)\t\(.id // $_id)"' "$WB_CACHE" 2>/dev/null > "$WB_RATES_CAT" || true
          fi
          if [ -n "${WB_STATUS_JSON:-}" ] && [ -r "$WB_STATUS_JSON" ]; then
            # 全字段防御：edition/modelStates/key 遇非字符串会报
            # explode input must be a string（实测复现）→ 整段静默丢失；
            # serve 每 3s 重写本文件，读到半截时结构异常 —— tostring + type 守卫
            # 对任何脏数据免疫；真读到坏文件时本轮免费路降级为空（下轮自然恢复）。
            # 3 列：站点 / FREE / 模型
            jq -r '
              (.accounts // [])
              | (if type == "array" then .[] else empty end) | objects
              | ((.edition // "cn") | tostring | ascii_downcase) as $ed
              | (if ($ed | test("intl|global|workbuddy")) then "intl" else "cn" end) as $site
              | (.modelStates // {})
              | (if type == "object" then to_entries else empty end)
              | map(select((.value | type) == "object"))
              | .[]
              | select(.value.costClass == "free")
              | (.key | tostring | ascii_downcase) as $m
              | select($m != "")
              | "\($site)\tFREE\t\($m)"' "$WB_STATUS_JSON" 2>/dev/null >> "$WB_RATES_FREE" || true
          fi
          if [ -n "${WB_CACHE:-}" ] && [ -r "$WB_CACHE" ]; then
            # 探针（站点级）：3 列
            jq -r '
              (.probes // {}) | to_entries[]
              | select(.value.verdict == "free")
              | (.key | split("|")) as $p
              | (($p[0] // "") | ascii_downcase) as $site
              | (($p[1] // "") | ascii_downcase) as $m
              | select($m != "")
              | "\($site)\tFREE\t\($m)"' "$WB_CACHE" 2>/dev/null >> "$WB_RATES_FREE" || true
          fi
          # 第三路：status 顶层 models 数组 —— serve 汇总的「每模型 × 每站点」倍率表。
          # 它覆盖目录里缺失/无倍率的条目，是国内站数据齐全的关键：
          #   glm-5.3-flash 在 cn 目录里有但 multiplier=null（被上面 != null 守卫过滤）
          #     → 这里 cnMultiplier=0.06x 补上
          #   hy4-preview-f 在 cn 目录里根本没有（0 次）
          #     → 这里 cnFree=是 / cnMultiplier=0.00x 补上
          # 来源即客户端/监视视图所用的同一张表，非我自造。
          # 4 列：站点 / 倍率或FREE / 归一键 / 显示名（与目录价同构，便于合并）
          if [ -n "${WB_STATUS_JSON:-}" ] && [ -r "$WB_STATUS_JSON" ]; then
            jq -r '
              (.models // [])
              | (if type == "array" then .[] else empty end)
              | objects
              | (.id | tostring | ascii_downcase | gsub("^[[:space:]]+|[[:space:]]+$"; "")) as $m
              | select($m != "")
              | [ { site: "cn",   raw: (.cnMultiplier // "-"),   free: (.cnFree // "-") },
                  { site: "intl", raw: (.intlMultiplier // "-"), free: (.intlFree // "-") } ]
              | .[]
              | (.raw | tostring | gsub("[[:space:]]"; "") | gsub("[xX]$"; "")) as $rm
              | if (.free | tostring) == "是" then
                  "\(.site)\tFREE\t\($m)\t\($m)"
                elif ($rm | test("^[0-9]+([.][0-9]+)?$")) then
                  "\(.site)\t\($rm)\t\($m)\t\($m)"
                else
                  empty
                end' "$WB_STATUS_JSON" 2>/dev/null > "$WB_RATES_MODELS" || true
          fi
          # 合并去重：键=站点|模型（归一小写）。取值口径 = 取最小（FREE 视为 0.00）：
          # 三路都可能给出同一键的倍率，谁更低以谁为准 —— 显示值即实际最低消耗。
          # 倍率降到 0（含实测免费）一律渲染为「免费」。
          # 输出 3 列：站点 / 排序键 / 已渲染行
          # 排序（主人 08:53 定）：站点内按倍率**升序**，价格低的排上面；
          # 免费（0.00）排各站点最前。
          WB_RATES_TXT="$(cat "$WB_RATES_CAT" "$WB_RATES_MODELS" "$WB_RATES_FREE" 2>/dev/null \
            | awk -F'\t' '
                NF >= 3 {
                  k = $1 "|" $3
                  # 取值口径（主人 08:45 定）：FREE 视为 0.00，与数值一起按「取最小」比较。
                  # 理由：显示的就是实际最低消耗；促销/汇总表给出更低值时应以更低值为准，
                  # 不再让先到（目录价）静默压掉后到的更低值。
                  v = ($2 == "FREE" ? 0 : $2)
                  if (!(k in mname) || v + 0 < best[k] + 0) {
                    site[k] = $1; mname[k] = $3; disp[k] = ($4 != "" ? $4 : $3)
                    best[k] = v + 0
                  }
                }
                END {
                  for (k in mname) {
                    d = (k in disp) ? disp[k] : mname[k]
                    if (best[k] + 0 == 0) printf "%s\t0\t  %-26s %6s\n", site[k], d, "免费"
                    else printf "%s\t%s\t  %-26s %6.2fx\n", site[k], best[k], d, best[k]
                  }
                }' 2>/dev/null \
            | sort -t$'\t' -k1,1 -k2,2g \
            | awk -F'\t' 'BEGIN{s=""} {
                if ($1 != s) { s=$1; printf "%s\n", ($1=="intl" ? "国际站" : "国内站") }
                printf "%s\n", $3
              }' 2>/dev/null || true)"
          rm -f "$WB_RATES_CAT" "$WB_RATES_MODELS" "$WB_RATES_FREE"
          WB_RATES_N="$(printf '%s\n' "${WB_RATES_TXT:-}" | grep -cE '^  ' || true)"
          WB_RATES_FREE_N="$(printf '%s\n' "${WB_RATES_TXT:-}" | grep -c '免费' || true)"
          WB_RATES_FREE_TAG=""
          if [ "${WB_RATES_FREE_N:-0}" -gt 0 ]; then
            WB_RATES_FREE_TAG="（含免费 ${WB_RATES_FREE_N}）"
          fi

          # ---------- 每日签到采集（2026-09-26 补）----------
          # 签到是 serve 内置后台协程 backgroundDailyCheckin 干的：**没有 CLI 子命令**
          # （--help 里确实不列）、也**不写进 workbuddy-status.json**（实测该快照无签名字段，
          # 账号键只有 path/edition/state/quota*/modelStates/freeModels/modelCooldowns 等）。
          # 唯一可观测出口就是 serve.log 的 [Checkin] 行 —— 故只能从日志解析。
          # 解析必须**对齐轮次**：只取最后一轮「开始每日签到，账号总数=N」之后的行，
          # 否则会把历史上每一轮的账号都并进来、顺序与计数全乱（首版试跑即踩：
          # 错把逐账号的「账号 X 开始每日签到」当轮次起点，结果只剩最后一个号）。
          # 日志文案由上游 Go 源码固定，实测变体（2026-09-26 从二进制 + 日志双向核对）：
          #   账号 %s 开始每日签到，站点=%s，接口=%s
          #   账号 %s 每日签到成功
          #   账号 %s 今天已经签到，本次按幂等成功处理
          #   账号 %s 每日签到失败，HTTP=%d，原因=%v
          #   本轮签到完成，总数=%d，成功=%d，今日已签=%d，失败=%d，跳过=%d
          #   下一次定时签到时间=%s
          # ⚠️ 国内站与国际站是**两条分支、两套文案**（2026-10-04 补）：
          #   gate 源码 checkinAccount 按 isCN 分流 —— 国内站打 daily-checkin 接口，
          #   国际站改跑网页 ACP 会话（2026-09-26 那版只有国内站分支，故只认得国内站文案）。
          #   国际站文案（v1.19.0 实测）：
          #   账号 %s 开始国际站每日活跃（ACP 会话），模型=%s
          #   账号 %s 国际站每日活跃完成：%d 段输出 / %d 次更新，耗时 %dms
          #   账号 %s 国际站每日活跃失败：%s；不改变账号调度状态
          # 首版只认「开始每日签到」当账号出现判据 → 5 个国际站号全被漏掉，只显示国内站 1 行，
          # 差额又被汇总层反推成「跳过 5」（网关自统计其实是 跳过=0），观感像国际站全挂。
          # 失败原因里有中文与括号，且可能很长（撑爆条目行）—— 条目里只给「⚠️ 失败」定性，
          # 完整原因可看下方「原始输出」段，不在此拼接。
          # 此处先出 3 列 TSV：凭据文件名 \t 站点 \t 签到结果（下方与活动状态接口
          # 合并成 5 列，加签到积分与旅行奖励）。列恒非空（结果缺省填「未取到结果」），
          # 避免 read 的空白折叠导致列错位（与 WB_POOL 同一坑，见其注释）。
          WB_CHECKIN=""
          WB_CHECKIN_SUMMARY=""
          WB_CHECKIN_NEXT=""
          if [ -r "$WB_LOG" ]; then
            # 下次签到时刻：serve 在**上一轮结束时**写入，时间上早于下一轮起点行，
            # 故全局取最后一次，不能被轮次窗口切掉（首版试跑被切掉 → 取空）。
            WB_CHECKIN_NEXT="$(grep -a "下一次定时签到时间=" "$WB_LOG" 2>/dev/null \
              | tail -n 1 | sed 's/.*下一次定时签到时间=//' || true)"
            # 轮次锚点（2026-10-05 修）：取**最近一轮已有完成行的轮次**的起点行，
            # 而不是无脑取最后一个起点行。原因：通知段在签到协程进行中也会被触发，
            # 进行中的轮次大量账号还没写完成行 —— 首版只认最后起点行时，进行中轮次
            # 被当成完整结果：完成行没写的账号全落「未取到结果」/缺行，再被汇总层
            # 反推成「跳过 N」（实测：镜像轮恰逢 22:50 签到轮进行中，国际站 5 个号
            # 被截成 2 行：已签 1 + 未开启 1 + 跳过 4）。取最近**已完成**轮 = 永远
            # 展示完整一轮；进行中的轮次等它写完完成行后自然接管。
            _ck_start="$(grep -an "开始每日签到，账号总数=\|本轮签到完成" "$WB_LOG" 2>/dev/null \
              | awk -F: '
                  /本轮签到完成/ { if (laststart != "") done_start = laststart; next }
                  { laststart = $1 }
                  END { if (done_start != "") print done_start; else if (laststart != "") print laststart }' \
              || true)"
            if [ -n "$_ck_start" ]; then
              WB_CHECKIN="$(tail -n +"$_ck_start" "$WB_LOG" 2>/dev/null \
                | grep -a '\[Checkin\]' \
                | awk '
                  {
                    line=$0
                    if (line ~ /账号 .* 开始每日签到/) {
                      f=line; sub(/.*\[Checkin\] 账号 /,"",f); sub(/ 开始每日签到.*/,"",f)
                      s=line; sub(/.*站点=/,"",s); sub(/，接口=.*/,"",s)
                      if (f != "" && !(f in seen)) { seen[f]=1; order[++n]=f; site[f]=s }
                    } else if (line ~ /账号 .* 开始国际站每日活跃/) {
                      # 国际站分支（2026-10-04 补）：该行不带「站点=」字段，站点是已知的
                      f=line; sub(/.*\[Checkin\] 账号 /,"",f); sub(/ 开始国际站每日活跃.*/,"",f)
                      if (f != "" && !(f in seen)) { seen[f]=1; order[++n]=f; site[f]="国际站" }
                    } else if (line ~ / 国际站每日活跃完成/) {
                      f=line; sub(/.*\[Checkin\] 账号 /,"",f); sub(/ 国际站每日活跃完成.*/,"",f)
                      if (f!="") res[f]="今日活跃 ✓"
                    } else if (line ~ / 国际站每日活跃失败/) {
                      f=line; sub(/.*\[Checkin\] 账号 /,"",f); sub(/ 国际站每日活跃失败.*/,"",f)
                      if (f!="") res[f]="⚠️ 活跃失败"
                    } else if (line ~ / 每日签到成功/) {
                      f=line; sub(/.*\[Checkin\] 账号 /,"",f); sub(/ 每日签到成功.*/,"",f)
                      if (f!="") res[f]="签到 ✓"
                    } else if (line ~ /今天已经签到/) {
                      f=line; sub(/.*\[Checkin\] 账号 /,"",f); sub(/ 今天已经签到.*/,"",f)
                      if (f!="") res[f]="今日已签"
                    } else if (line ~ / 每日签到失败/) {
                      f=line; sub(/.*\[Checkin\] 账号 /,"",f); sub(/ 每日签到失败.*/,"",f)
                      if (f!="") res[f]="⚠️ 失败"
                    }
                  }
                  END {
                    for (i=1;i<=n;i++) {
                      f=order[i]
                      printf "%s\t%s\t%s\n", f, site[f], (res[f]=="" ? "未取到结果" : res[f])
                    }
                  }' 2>/dev/null || true)"
              WB_CHECKIN_SUMMARY="$(tail -n +"$_ck_start" "$WB_LOG" 2>/dev/null \
                | grep -a '本轮签到完成' | tail -n 1 \
                | sed 's/.*\[Checkin\] //; s/^本轮签到完成，//' || true)"
            fi
          fi

          # ---------- 签到积分采集（2026-09-26 补，主人要求通知里显示积分）----------
          # 网关把签到接口的响应体整个丢掉（上游 checkinAccount 只接 status/err），
          # 日志里只有「成功/已签」没有积分数值；「已签」幂等响应（code=10001）也不带积分。
          # 积分真源是独立的活动状态接口（只读、幂等、无副作用，2026-09-26 全账号实测）：
          #   POST {Origin}/v2/billing/meter/checkin-activity-status
          #   data: active / today_checked_in / today_credit(本次) / total_credits(累计)
          #         / streak_days(连签) / daily_credit(每日可得)
          # 实测口径：国内站 active=true（Buddy 加油站，+100/天）；国际站 active=false
          # （活动未开启）—— 而网关把 code=10001 一律按「今日已签」幂等成功处理，
          # 国际站其实没签上（状态接口 today_checked_in=false 佐证）。故结果列以状态
          # 接口为准修正；查询失败/无数据的账号保留网关日志结果，绝不编造积分。
          WB_CKSTAT_OK=0
          WB_CKSTAT_TOTAL=0
          declare -A _CK_ACT _CK_CHK _CK_TODAY _CK_TOTAL _CK_STREAK _CK_DAILY _CK_TRAVEL
          if [ "${WB_READY:-}" = "1" ] && [ -n "${WB_CREDS:-}" ]; then
            WB_CKTMP="$(mktemp)"
            while IFS= read -r _cf; do
              if [ -z "$_cf" ]; then continue; fi
              WB_CKSTAT_TOTAL=$((WB_CKSTAT_TOTAL + 1))
              _fp="$WB_DIR/$_cf"
              _tok=""
              if [ -r "$_fp" ]; then
                _tok="$(jq -r '.auth.accessToken // ""' "$_fp" 2>/dev/null || true)"
              fi
              if [ -z "$_tok" ]; then continue; fi
              _uid="$(jq -r '.account.uid // ""' "$_fp" 2>/dev/null || true)"
              _eid="$(jq -r '.account.enterpriseId // ""' "$_fp" 2>/dev/null || true)"
              _dom="$(jq -r '.auth.domain // ""' "$_fp" 2>/dev/null || true)"
              _ed="$(jq -r '.edition // "cn"' "$_fp" 2>/dev/null || true)"
              case "$(printf '%s' "$_ed" | tr 'A-Z' 'a-z')" in
                intl|international|global|workbuddy.ai) _base="https://www.workbuddy.ai" ;;
                *) _base="https://www.codebuddy.cn" ;;
              esac
              _hdr=(--connect-timeout 5 --max-time 20 -X POST
                -H "Authorization: Bearer ${_tok}"
                -H 'X-Client-ID: codebuddy-cli'
                -H 'X-Client-Version: 2.143.1'
                -H 'X-Product: SaaS'
                -H 'X-Client-Platform: web'
                -H 'Content-Type: application/json' -d '{}')
              if [ -n "$_uid" ]; then _hdr+=(-H "X-User-Id: ${_uid}"); fi
              if [ -n "$_eid" ]; then _hdr+=(-H "X-Enterprise-Id: ${_eid}" -H "X-Tenant-Id: ${_eid}"); fi
              if [ -n "$_dom" ]; then _hdr+=(-H "X-Domain: ${_dom}"); fi
              if curl -o "$WB_CKTMP" "${_hdr[@]}" \
                "${_base}/v2/billing/meter/checkin-activity-status" 2>/dev/null; then
                _row="$(jq -r 'if .code == 0 and (.data | type == "object") then
                    [ (.data.active // false), (.data.today_checked_in // false),
                      (.data.today_credit // 0), (.data.total_credits // 0),
                      (.data.streak_days // 0), (.data.daily_credit // 0) ]
                    | map(tostring) | @tsv
                  else empty end' "$WB_CKTMP" 2>/dev/null || true)"
                if [ -n "$_row" ]; then
                  IFS="$(printf '\t')" read -r _act _chk _tdy _tot _stk _dly <<< "$_row"
                  if [ "$_act" = "true" ] || [ "$_act" = "false" ]; then
                    WB_CKSTAT_OK=$((WB_CKSTAT_OK + 1))
                    _CK_ACT["$_cf"]="$_act"
                    _CK_CHK["$_cf"]="$_chk"
                    _CK_TODAY["$_cf"]="$_tdy"
                    _CK_TOTAL["$_cf"]="$_tot"
                    _CK_STREAK["$_cf"]="$_stk"
                    _CK_DAILY["$_cf"]="$_dly"
                  fi
                fi
              fi
            done <<< "$WB_CREDS"
            rm -f "$WB_CKTMP"
          fi

          # Buddy 旅行奖励（仅国内站有旅行，领取成功才落一行 credit=）。
          # 窗口 = 今天（东八区）全天日志，而不是最后一轮签到窗口：旅行奖励一天最多
          # 领一次，常发生在更早的轮次（实测：启动轮 06:28 领取 credit=10.00，
          # 09:00 定时轮只报「今日派遣已达上限」）—— 按轮次窗口会漏掉当天的实际领取。
          # 日志时间戳已实测为东八区（09:00 定时轮落笔 09:00:00），与 TZ 过滤直接对齐。
          if [ -r "$WB_LOG" ]; then
            _today="$(TZ=Asia/Shanghai date +%Y/%m/%d)"
            while IFS= read -r _tl; do
              if [ -z "$_tl" ]; then continue; fi
              case "$_tl" in
                *"旅行奖励领取成功（credit="*)
                  _tf="$(printf '%s' "$_tl" | sed 's/.*\[Travel\] 账号 //; s/ Buddy 已到达.*//' || true)"
                  _tc="$(printf '%s' "$_tl" | sed 's/.*credit=//; s/）.*//' || true)"
                  if [ -n "$_tf" ] && [ -n "$_tc" ]; then
                    _CK_TRAVEL["$_tf"]="Buddy 旅行 +${_tc}"
                  fi
                  ;;
              esac
            done <<< "$(grep -a "^${_today} " "$WB_LOG" 2>/dev/null | grep -a '\[Travel\]' || true)"
          fi


          # 合并：状态接口修正结果列 + 拼积分/旅行列（3 列 → 5 列，渲染层只管展示）。
          # 结果优先级：网关日志判「失败」时保留原样（HTTP/原因在原始输出里，更具体）；
          # 其余以状态接口为准 —— active=false 修成「活动未开启」（网关把 code=10001
          # 一律幂等成功，国际站活动没开也被记成「今日已签」，这里纠正）。
          # ---------- 国际站「每日活跃」奖励（2026-10-06 补）----------
          # 国际站没有签到活动，活跃奖励的**真值只在 quota-board 的账本里**：
          # 每笔 `wb|<账号>` 的正向 delta，按金额众数还原每日额度（实测 30.0/天，
          # 10-01~10-06 每天一笔）。签到活动状态接口对国际站恒 active=false，
          # 查不到这笔钱 —— 首版据此把国际站写成「活动未开启 · 无积分」，与账本里
          # 实打实的 +30/天 直接矛盾。
          # 故调 board.py 的 CLI 复用**同一份**聚合代码，不在 shell 里另写一套
          # （两边各写一套必然对不齐，与 usage-ledger 走同一条路）。
          declare -A _CK_ADAILY _CK_ATOTAL _CK_ADAYS _CK_ATODAY
          if [ "${WB_READY:-}" = "1" ]; then
            while IFS="$(printf '\t')" read -r _af _adaily _adays _atotal _atoday; do
              [ -z "$_af" ] && continue
              _CK_ADAILY["$_af"]="$_adaily"
              _CK_ATOTAL["$_af"]="$_atotal"
              _CK_ADAYS["$_af"]="$_adays"
              _CK_ATODAY["$_af"]="$_atoday"
            done <<< "$(python3 /dropbox/self-hosted/quota-board/board.py active-credits 2>/dev/null || true)"
          fi

          if [ -n "${WB_CHECKIN:-}" ]; then
            WB_CHECKIN_MERGED=""
            while IFS="$(printf '\t')" read -r _mf _ms _mr; do
              if [ -z "$_mf" ]; then continue; fi
              _mres="$_mr"
              _mcred=""
              if [ -n "${_CK_ACT[$_mf]:-}" ]; then
                if printf '%s' "$_mr" | grep -q '失败'; then
                  _mres="$_mr"
                elif [ "$_mr" = "未取到结果" ]; then
                  # 采集层没拿到结果（结果列缺省值）：说明采集中断/缺行，不是「没签到」。
                  # 不能被下面 active=false 分支降级成「活动未开启」—— 那是把
                  # 「我们不知道」伪装成确定结论，且积分列全 0（实测 2026-10-05：
                  # workbuddy-18 被降级后还带出了「可得 +0」假积分）。
                  # 保留缺省原样如实展示（下轮日志写全自然恢复），汇总层只计「未采集」。
                  _mres="$_mr"
                elif printf '%s' "$_mr" | grep -q '今日活跃 ✓'; then
                  # 国际站（2026-10-04 补）：ACP 会话跑完即签到成功。积分活动 active=false
                  # 只表示「这个站没有积分可领」，**不代表签到没做** —— 不能被下面的
                  # 分支降级成「活动未开启」（首版会显示成活动未开启，观感像没签到）。
                  # 2026-10-06 改名：原文案「活跃 ✓」脱离上下文看不出是签到，改「今日活跃 ✓」。
                  _mres="$_mr"
                  # 活跃奖励：真值在账本（见上方采集段）。只有**今日确实到账**
                  # 才写「本次 +N」，否则只给累计 —— 避免把历史额度当成今天领的。
                  _ak="$(printf '%s' "$_mf" | sed 's/^workbuddy-//; s/\.json$//')"
                  if [ "${_CK_ATODAY[$_ak]:-}" = "1" ]; then
                    _mcred="本次 +${_CK_ADAILY[$_ak]} · 累计 ${_CK_ATOTAL[$_ak]} · 活跃 ${_CK_ADAYS[$_ak]} 天"
                  elif [ -n "${_CK_ATOTAL[$_ak]:-}" ]; then
                    _mcred="累计 ${_CK_ATOTAL[$_ak]} · 活跃 ${_CK_ADAYS[$_ak]} 天"
                  fi
                elif [ "${_CK_ACT[$_mf]}" = "false" ]; then
                  _mres="活动未开启"
                elif [ "${_CK_CHK[$_mf]}" = "true" ]; then
                  case "$_mr" in *"签到 ✓"*) : ;; *) _mres="今日已签" ;; esac
                  _mcred="本次 +${_CK_TODAY[$_mf]} · 累计 ${_CK_TOTAL[$_mf]} · 连签 ${_CK_STREAK[$_mf]} 天"
                else
                  _mres="未签"
                  _mcred="可得 +${_CK_DAILY[$_mf]}"
                fi
              fi
              _mtrav="${_CK_TRAVEL[$_mf]:-}"
              WB_CHECKIN_MERGED+="${WB_CHECKIN_MERGED:+$'\n'}${_mf}"$'\t'"${_ms}"$'\t'"${_mres}"$'\t'"${_mcred}"$'\t'"${_mtrav}"
            done <<< "$WB_CHECKIN"
            WB_CHECKIN="$WB_CHECKIN_MERGED"

            # 汇总：状态接口全覆盖时按展示行重算（与逐账号口径一致，含积分合计）；
            # 有查询失败/无数据时退回网关日志口径的 WB_CHECKIN_SUMMARY，不硬凑。
            if [ "$WB_CKSTAT_OK" -eq "$WB_CKSTAT_TOTAL" ] && [ "$WB_CKSTAT_TOTAL" -gt 0 ]; then
              _n_signed=0
              _n_closed=0
              _n_open=0
              _n_fail=0
              _n_unk=0
              _sum_today=0
              while IFS="$(printf '\t')" read -r _sf _ss _sr _sc _st; do
                if [ -z "$_sf" ]; then continue; fi
                case "$_sr" in
                  # 「今日活跃 ✓」= 国际站 ACP 会话成功（2026-10-04 补），与国内站签到同等计入已签
                  *"签到 ✓"*|*"今日已签"*|*"今日活跃 ✓"*) _n_signed=$((_n_signed + 1)) ;;
                  *"活动未开启"*) _n_closed=$((_n_closed + 1)) ;;
                  *"未签"*) _n_open=$((_n_open + 1)) ;;
                  *"失败"*) _n_fail=$((_n_fail + 1)) ;;
                  *"未取到结果"*) _n_unk=$((_n_unk + 1)) ;;
                esac
              done <<< "$WB_CHECKIN"
              # 国际站活跃奖励（账本口径）：与国内站签到积分同等计入今日合计。
              # 只加「今日确实到账」的号，且只认整数，避免小数把 $(( )) 打挂。
              for _kf in "${!_CK_ATODAY[@]}"; do
                if [ "${_CK_ATODAY[$_kf]}" = "1" ]; then
                  case "${_CK_ADAILY[$_kf]}" in
                    ''|*[!0-9]*) : ;;
                    *) _sum_today=$((_sum_today + ${_CK_ADAILY[$_kf]})) ;;
                  esac
                fi
              done
              for _kf in "${!_CK_ACT[@]}"; do
                if [ "${_CK_ACT[$_kf]}" = "true" ] && [ "${_CK_CHK[$_kf]}" = "true" ]; then
                  case "${_CK_TODAY[$_kf]}" in
                    ''|*[!0-9]*) : ;;
                    *) _sum_today=$((_sum_today + ${_CK_TODAY[$_kf]})) ;;
                  esac
                fi
              done
              _n_rows="$(printf '%s\n' "$WB_CHECKIN" | grep -c . || true)"
              _n_creds="$(printf '%s\n' "$WB_CREDS" | grep -c . || true)"
              _n_skip=$((_n_creds - _n_rows))
              if [ "$_n_skip" -lt 0 ]; then _n_skip=0; fi
              _cksum="已签 ${_n_signed}"
              if [ "$_n_closed" -gt 0 ]; then _cksum="${_cksum} · 未开启 ${_n_closed}"; fi
              if [ "$_n_open" -gt 0 ]; then _cksum="${_cksum} · 未签 ${_n_open}"; fi
              if [ "$_n_fail" -gt 0 ]; then _cksum="${_cksum} · 失败 ${_n_fail}"; fi
              if [ "$_n_unk" -gt 0 ]; then _cksum="${_cksum} · 未采集 ${_n_unk}"; fi
              if [ "$_n_skip" -gt 0 ]; then _cksum="${_cksum} · 跳过 ${_n_skip}"; fi
              if [ "$_sum_today" -gt 0 ]; then _cksum="${_cksum} · 今日合计 +${_sum_today}"; fi
              WB_CHECKIN_SUMMARY="$_cksum"
            fi
          fi

          # 接力轮次的判据：本文件由「Trigger next OpenClaw run」在上一轮收尾时以
          # workflow_dispatch 接力启动（长跑保活标准形态），但接力轮同样会跑一遍本步骤，
          # 于是同一份 service 同一份账号池会**每个 run 各推一条**已就绪通知。
          # 用本步骤自己的结果文件区分（本步骤无 id、幂等引用 steps.run_workbuddy 不安全，
          # 且其结果在本步骤内不可读）：文件在 → 上一轮启动过 = 接力轮，不再发就绪通知。
          # 按标记文件失败处理（多发一条好过漏发；下次重装后自然收敛）。
          WB_RUN_TAG_FILE="/tmp/workbuddy-serve-run-tag"
          WB_RELAUNCH=0
          WB_PREV_TAG=""
          if [ -s "$WB_RUN_TAG_FILE" ]; then
            WB_RELAUNCH=1
            WB_PREV_TAG="$(head -n 1 "$WB_RUN_TAG_FILE" 2>/dev/null || true)"
          fi
          if [ "$WB_READY" = "1" ]; then
            printf '%s\n' "${GITHUB_RUN_ID:-manual}" > "$WB_RUN_TAG_FILE"
            if [ -n "$WB_ACCOUNTS" ]; then
              if [ "$WB_RELAUNCH" = "1" ]; then
                # 接力轮安静续跑：不重复推版式完全相同的「已就绪」，让唯一那条待在本轮顶部。
                echo "ℹ️ [workbuddy-gateway] 接力轮（上一 run ${WB_PREV_TAG} 已启动），跳过重复的就绪通知"
              else
                wb_notify "🟢 workbuddy-gateway 已就绪" "$WB_ACCOUNTS" "$WB_VER" "$WB_UPDATE" "$WB_REASON" "" 1
              fi
            elif [ "$WB_RELAUNCH" != "1" ]; then
              # 网关自己起来了、但账号池为空：多半是数据目录里还没有 workbuddy*.json
              # （二维码登录只能人工做），如实标注为可用性问题，不假装就绪。
              wb_notify "⚠️ workbuddy-gateway 已启动 · 无可用账号" \
                "账号池为空 · 需人工扫码登录" "$WB_VER" "$WB_UPDATE" "$WB_REASON" "" 1
            fi
          else
            WB_TAIL="$(tail -c 1200 "$WB_LOG" 2>/dev/null || true)"
            # 把日志尾部同时打到 stdout：<pre> 只进 Telegram，CI 日志里看不到，
            # 排查时不得不再跑一轮才能拿到真实报错。
            echo "--- serve.log tail (1200B) ---"
            printf '%s\n' "${WB_TAIL:-<empty>}"
            echo "--- end serve.log tail ---"
            if [ "$WB_API_DEAD" = "1" ]; then
              # 从日志尾部区分三种"起来就退"，避免一律写成"凭据/参数错误"误导排查：
              # Permission denied → 二进制不可执行（放错到非 exec 的文件系统）；
              # 未检测到有效凭据 → 账号池为空；其余归为启动即退。
              case "$WB_TAIL" in
                *"Permission denied"*)
                  _wb_fail_reason="二进制不可执行（Permission denied）：须落在本地盘，rclone 挂载点无法执行文件" ;;
                *"未检测到有效凭据"*|*"login"*)
                  _wb_fail_reason="未检测到有效凭据：需人工执行 login 扫码后把凭据放入数据目录" ;;
                *)
                  _wb_fail_reason="serve 进程启动后立即退出（多为参数错误或上游不可达）" ;;
              esac
              echo "❌ workbuddy-gateway serve 进程启动后立即退出" >&2
            else
              _wb_fail_reason="serve 未在 120 秒内监听 ${WB_PORT}"
              echo "❌ workbuddy-gateway 未能在 120 秒内监听 ${WB_PORT}" >&2
            fi
            # WB_REASON 可能为空，拼串前先规整，避免出现「原因： serve …」的前导空格
            _wb_fail_reason="${WB_REASON:+${WB_REASON} · }${_wb_fail_reason}"
            wb_notify "❌ workbuddy-gateway 启动失败" "未监听 ${WB_PORT} · 退出码 1" "$WB_VER" \
              "$WB_UPDATE" "$_wb_fail_reason" "$WB_TAIL" 0
          fi

      # trae2api：TRAE SOLO 反代（OpenAI 兼容 API + Web 管理面板 /admin）。
      # 与 workbuddy-gateway / zcode2api 同为 AI 网关形态服务。
      # 部署方式：取 jarvanh/trae2api 的 Release 静态二进制直接构建镜像，
      # 不再浅克隆源码、不在 runner 上跑 go build（省掉每轮 Go 编译开销）。
      # Dockerfile 与签到/积分工具同样取自 fork 的 Release / raw，本机无需 Go 工具链。
      # 镜像 tag 直接复用 Release 完整 tag（vYYYY.MM.DD-<短 commit>），
      # 二进制 sha256 从 Release 的 SHA256SUMS 实时提取并强制校验，失败即中止。
      # 数据目录直接 bind mount Dropbox fuse 挂载点
      # /dropbox/self-hosted/trae2api（实测可写；fuse 权限位恒 666，容器内
      # uid 10001 与 runner 均可读写，天然绕开 uid 对齐问题）。
      # 容器不纳入 systemd --user（2026-09-25 定）：compose 的
      # restart: unless-stopped 已覆盖崩溃自愈，dockerd 自身重启也会拉回容器，
      # 再包一层 systemd 是重复托管；systemd --user 只管裸进程形态的
      # workbuddy-gateway / zcode2api（见 services.sh）。
      # 隧道 trae2api（原 trae2api.derrick.eu.org → 127.0.0.1:7864）已于 2026-09-29 撤销：
      # /dropbox/self-hosted/.cloudflared 恢复，由 tunnels.conf 纳管。
      - name: Run trae2api container (TRAE SOLO reverse proxy)
        # 2026-10-22 步骤重排后位于 Run OpenClaw 之后：本步失败不得级联跳过
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # 通知真源在 step 顶层 source 一次（勿挪进函数体，理由见 workbuddy 步骤同名注释 / 规范 4.4）
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"

          TRAE_DATA=/dropbox/self-hosted/trae2api
          TRAE_SRC=/tmp/local_trae2api-src
          TRAE_PORT="7864"
          CHECKIN_JSONL=/tmp/trae2api-checkin.jsonl
          CHECKIN_ERR=/tmp/trae2api-checkin.err
          PACKS_JSON=/tmp/trae2api-packs.json
          mkdir -p "$TRAE_DATA/auths" "$TRAE_DATA/data" ~/.openclaw/logs

          # 凭据清单（只列文件名，绝不回显内容——真实凭据；与 wb_notify 同口径）
          TRAE_CREDS="$(cd "$TRAE_DATA/auths" 2>/dev/null && ls -1 trae*.json 2>/dev/null || true)"

          # trae2api 通知的版式真源：与 wb_notify（workbuddy 段）完全同构
          # （docs/telegram-notify.md 2.5；三个调用点共用本函数，改版式只改这里）。
          # 用法: trae_notify <标题> <结论> <版本> <更新说明> <原因> <原始输出> [<接口/鉴权>]
          # 第 7 参 = 服务就绪态，取 "1" 才补「接口 / 鉴权」两行：失败时服务已不在，
          # 展示一个指向已停进程的地址会误导读者（与 wb_notify 同口径）。
          # 取值口径（同 wb_notify）：结论/更新/原因 → 人写的自然语言 → 裸文本 kv；
          # 版本/路径/端口 → 机器值 → <code>；原始输出 → <pre>，恒为正文最后一块。
          # 空值整行跳过、空分节整段跳过。凭据段只列 trae-*.json 文件名，绝不回显内容。
          # 账号池逐账号「一条目 + 多子行」：数据源是函数外的 CHECKIN_JSONL / PACKS_JSON
          # （uid/昵称/状态/积分进条目行，该账号最早过期的前 3 个包各占一个子行）。
          trae_notify() {
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              local _msg=""
              tg_add_title _msg "$1"
              tg_add_kv _msg "结论" "$2"
              # 数据目录（机器值 → <code>）移到头部，与 wb_notify 同口径
              # （主人 2026-10-06 要求）：它是「这条通知说的是哪份数据」的定位信息，
              # 与 版本/接口/API Key 同类；压在正文末尾夹在用量段与原始输出之间，
              # 既不像结论也不像明细，读者要找它得翻到底。
              tg_add_path _msg "数据目录" "$TRAE_DATA"
              [ -n "$3" ] && tg_add_path _msg "版本" "$3"
              [ -n "$4" ] && tg_add_kv _msg "更新" "$4"
              if [ "${7:-0}" = "1" ]; then
                tg_add_path _msg "接口" "http://127.0.0.1:${TRAE_PORT}/v1"
                # 明文 API Key（主人 23:33 要求，与 workbuddy 段同款展示）：
                # 从 Dropbox 数据目录 .env 读取，即面板/CLI 实际使用的那把
                local _trae_key="$(grep -m1 '^TW2A_API_KEY=' "${TRAE_DATA}/.env" 2>/dev/null | cut -d= -f2- || true)"
                # 标签「API Key」+ tg_add_path：值按规范走 <code> 等宽，
                # 客户端点一下即可整块复制（tg_add_kv 是纯文本，只能手选）
                tg_add_path _msg "API Key" "${_trae_key:-未取到}"
              fi
              [ -n "$5" ] && tg_add_kv _msg "原因" "$5"
              # 凭据段（🔑 凭据 · N）已按主人要求移除（2026-10-05），与 wb_notify 同口径。
              # TRAE_CREDS 变量保留（采集处仍在产出，供将来其它用途），仅不再渲染。
              # 账号池：与 wb_notify 同构的「条目 + 子行」形态。子行必须用 tree_sub
              # 前缀手拼 —— tree_lines 把每行都当兄弟条目，子行经它会渲染成 ├─/└─，
              # 与条目平级（规范 4.2 二层列表：子行与条目正文同列）。
              # 错峰签到（主人 09-25 定）：checkin 先零请求落盘全部账号的排程行
              # （skipped=scheduled/cooldown/already，带 planned_at），真实签到完成后
              # 追加结果行 —— 同一 uid 会有两行，按 uid 取末行：有结果显示结果，
              # 没轮到的显示「安排 HH:MM」；计数也按去重后的账号数。
              if [ -s "${CHECKIN_JSONL:-}" ]; then
                local _total _rows _i _line _uid _nick _cr _err _skipr _st _exp3 _eline _last _planned
                # 按 uid 取末行（保持首次出现顺序）：JSONL 逐行 uid 序列去重拼接
                _uids="$(jq -r '.uid' "$CHECKIN_JSONL" | awk '!seen[$0]++')"
                _total="$(printf '%s\n' "$_uids" | grep -c . || true)"
                tg_add_section _msg "💳 账号池 · ${_total}"
                _rows=""
                _i=0
                while IFS= read -r _uid; do
                  [ -z "$_uid" ] && continue
                  _i=$((_i + 1))
                  _last=0
                  [ "$_i" -eq "$_total" ] && _last=1
                  _line="$(jq -c --arg uid "$_uid" 'select(.uid == $uid)' "$CHECKIN_JSONL" | tail -n 1)"
                  _nick=$(jq -r '(.nickname // "-")' <<<"$_line")
                  _cr=$(jq -r '.credits' <<<"$_line")
                  _err=$(jq -r '(.err // "")' <<<"$_line")
                  _skipr=$(jq -r '(.skip_reason // "")' <<<"$_line")
                  _planned=$(jq -r '(.planned_at // "")' <<<"$_line")
                  if [ -n "$_err" ]; then
                    _st="⚠️ $_err"
                  elif [ "$(jq -r '.claimed' <<<"$_line")" = "true" ]; then
                    _st="签到 ✓ 本轮领取"
                  elif [ "$(jq -r '.checked_in' <<<"$_line")" = "true" ]; then
                    _st="今日已签"
                  elif [ -n "$_skipr" ] && [ -n "$_planned" ]; then
                    # 排程/冷却中的账号：显示安排的签到时间（主人 09-25 定）
                    _st="$_skipr · 安排 ${_planned}"
                  elif [ -n "$_skipr" ]; then
                    _st="$_skipr"
                  else
                    _st="今日已签"
                  fi
                  # 条目行只留「uid · 昵称」，签到状态与积分下移成子行
                  # （主人 2026-10-06 要求：少用 · 分割、多换行）。此前四段全挤在
                  # 条目行，读起来是一坨；与看板 trae 段同版式（board.py 该段
                  # 注释里的样板即「今日已签 · 积分 3517」独占一行）。
                  _rows+="$(tree_conn "$_last")$(tg_entry "$_uid" "$_nick")"$'\n'
                  _rows+="$(tree_sub "$_last")$(escape_html "${_st} · 积分 ${_cr}")"$'\n'
                  # 子行：该账号未用完的包里最早过期的前 3 个（逐包一行，完整时间戳）
                  _exp3=$(jq -r --arg uid "$_uid" '[.[] | select(.uid == $uid and .remain > 0 and .expire_at > 0)] | sort_by(.expire_at) | .[:3][] | "剩 \(.remain) 分 · \(.expire_fmt) 过期"' "${PACKS_JSON:-}" 2>/dev/null || true)
                  if [ -n "$_exp3" ]; then
                    while IFS= read -r _eline; do
                      [ -z "$_eline" ] && continue
                      _rows+="$(tree_sub "$_last")$(escape_html "$_eline")"$'\n'
                    done <<< "$_exp3"
                  fi
                done <<< "$_uids"
                tg_add_block _msg "${_rows%$'\n'}"
                # 块尾补一个空行：tg_add_block 不补尾空行，下一个 kv（数据目录）会紧贴
                # 末条子行渲染，版式与 wb_notify（块与 kv 区之间空一行）一致。
                tg_append _msg $'\n'
              fi
              # 签到健康段（主人 09-30 定：原先独立的「签到简报」并入已就绪通知，
              # 不再单独发一条）。只列**需要关注**的账号（连败>0 / 换代过 / 仍在退避），
              # 全健康时整段跳过 —— 健康是常态，异常才值得占版面，否则每轮重复渲染
              # 四行「连败 0」纯属噪音。
              # 数据源：checkin-state.json（连败/上次成功）+ state.json（自愈换代/退避）。
              # 换代 gen>0 是 9074 自愈动过手的证据（不是故障），故单列且不加 ⚠️。
              # 2026-10-04 主人：裸写「自愈换代 gen 1」外人读不懂 → 条目改白话
              # 「签到设备换代 +1」（主人终版措辞），标题改「N 个账号有备注」
              # （N 是账号数不是失败数，此前被误读为「1 个失败」）。
              local _ck_state _st_state _hrows _hu _hfc _hlcd _hgen _hrc _hnick _hinfo
              _ck_state="${TRAE_DATA}/data/checkin-state.json"
              _st_state="${TRAE_DATA}/data/state.json"
              _hrows=""
              _hn=0
              if [ -s "$_ck_state" ]; then
                while IFS= read -r _hu; do
                  [ -z "$_hu" ] && continue
                  _hfc=$(jq -r --arg u "$_hu" '.[$u].fail_count // 0' "$_ck_state" 2>/dev/null || echo 0)
                  _hlcd=$(jq -r --arg u "$_hu" '.[$u].last_claim_date // "-"' "$_ck_state" 2>/dev/null || echo "-")
                  _hgen=$(jq -r --arg u "$_hu" '.accounts[$u].checkin_device_gen // 0' "$_st_state" 2>/dev/null || echo 0)
                  _hrc=$(jq -r --arg u "$_hu" '.accounts[$u].checkin_retry_count // 0' "$_st_state" 2>/dev/null || echo 0)
                  # 全健康 → 跳过（不占版面）
                  [ "${_hfc:-0}" -gt 0 ] || [ "${_hgen:-0}" -gt 0 ] || [ "${_hrc:-0}" -gt 0 ] || continue
                  _hnick=$(jq -r --arg uid "$_hu" '[.[] | select(.uid == $uid) | .nickname] | last // ""' "${CHECKIN_JSONL:-/dev/null}" 2>/dev/null || true)
                  [ -n "$_hnick" ] || _hnick="$_hu"
                  _hinfo="上次成功 ${_hlcd}"
                  [ "${_hfc:-0}" -gt 0 ] && _hinfo="${_hinfo} · ⚠️ 连续失败 ${_hfc} 次"
                  [ "${_hgen:-0}" -gt 0 ] && _hinfo="${_hinfo} · 签到设备换代 +1"
                  [ "${_hrc:-0}" -gt 0 ] && _hinfo="${_hinfo} · ⏳ 退避重试中（已退 ${_hrc} 次）"
                  # 主体是「昵称 · 健康备注」= 自然语言（规范 · 取值行口径），走
                  # tg_add_entry_text 裸文本；tg_add_entry 会把整串当机器值套 <code>
                  tg_add_entry_text _hrows "${_hnick} · ${_hinfo}"
                  _hn=$((_hn + 1))
                done <<< "$(jq -r 'keys[]' "$_ck_state" 2>/dev/null)"
              fi
              if [ "$_hn" -gt 0 ]; then
                tg_add_section _msg "🩺 签到健康 · ${_hn} 个账号有备注"
                tg_add_block _msg "$(tree_lines "${_hrows%$'\n'}")"
                tg_append _msg $'\n'
              fi
              # 模型倍率段：数据源是 7.5 生成的 RATES_TXT（/v1/models 的
              # consumption_rate，倍率升序（价格低的排上面）、每模型一行）；服务未就绪/
              # 取数失败时为空，
              # 整段跳过（与凭据段同口径）。section 计数与「🔑 凭据 · N」同构。
              if [ -n "${RATES_TXT:-}" ]; then
                tg_add_section _msg "📊 模型倍率 · 模型数量${RATES_N:-0}"
                tg_add_pre _msg "$RATES_TXT"
                # tg_add_pre 内部 <pre> 包裹 + 转义；段尾补空行对齐账号池段
                tg_append _msg $'\n'
              fi
              # 用量 + 流水（与 wb_notify 同口径，2026-10-05 补）：只渲染 trae 自己的，
              # 调 board.py CLI 与看板共用渲染代码与数据源。trae 当日无 usage 文件时
              # CLI 输出空串，静默跳过（不留空行）。
              _trae_ul_block="$(python3 /dropbox/self-hosted/quota-board/board.py usage-ledger trae 12 2>/dev/null || true)"
              [ -n "$_trae_ul_block" ] && tg_append _msg "$_trae_ul_block"
              if [ -n "$6" ]; then
                tg_add_section _msg "🧾 原始输出"
                tg_add_pre _msg "$(printf '%s' "$6" | tail -c 1200)"
              fi
              tg_add_footer _msg
              send_tg "$_msg" alert || echo "::warning::TG 通知发送失败（不影响任务）"
            else
              echo "⚠️ Telegram secrets missing, skip trae2api notification."
            fi
          }

          echo "1. Resolving latest Release (jarvanh/trae2api)..."
          # 部署取 fork 的 Release 静态二进制，不在 runner 上跑 go build。
          # Release tag 形如 v2026.09.23-<短 commit>，镜像 tag 直接复用它（一一对应、
          # 同日多构建不撞车）；「更新」说明在第 8 步与 Dropbox 记录的上轮 tag 对比后判定。
          # 重试（2026-10-02 事故修复）：单次 gh api 瞬时返回空就 exit 1 → 服务
          # 停摆一整轮（run 36963030965 实测：step 2 秒即失败，非网络超时；
          # 之后无容器/无镜像/端口未监听，停摆约 5 小时才被发现）。
          # 瞬时抖动不该等价于一整轮不可用，故重试 3 次、间隔 5 秒，
          # 全失败才判定真故障。stderr 保留用于排查，不再静默吞掉。
          TRAE_REL=""
          TRAE_REL_ERR=""
          for _try in 1 2 3; do
            # ⚠️ 不能写 VAR="$(cmd)"：set -euo pipefail 下命令替换失败会直接终止脚本，
            # 重试循环形同虚设。必须让失败落在 &&/|| 列表里被吃掉，再回读文件取结果。
            gh api repos/jarvanh/trae2api/releases/latest --jq '.tag_name' \
              >/tmp/trae-rel.out 2>/tmp/trae-rel.err && _gh_rc=0 || _gh_rc=$?
            TRAE_REL="$(cat /tmp/trae-rel.out 2>/dev/null || true)"
            TRAE_REL_ERR="$(cat /tmp/trae-rel.err 2>/dev/null || true)"
            [ "$_gh_rc" -ne 0 ] && [ -z "$TRAE_REL_ERR" ] && TRAE_REL_ERR="gh api exit=$_gh_rc"
            if [ -n "$TRAE_REL" ]; then
              [ "$_try" -gt 1 ] && echo "   （第 ${_try} 次尝试成功）"
              break
            fi
            echo "   ⚠️ 第 ${_try}/3 次解析 Release 失败，5 秒后重试" >&2
            [ "$_try" -lt 3 ] && sleep 5
          done
          rm -f /tmp/trae-rel.out /tmp/trae-rel.err
          if [ -z "$TRAE_REL" ]; then
            echo "❌ 无法解析 jarvanh/trae2api 最新 Release（已重试 3 次）" >&2
            trae_notify "❌ trae2api 部署失败" "无法解析最新 Release" "" "" \
              "gh api releases/latest 连续 3 次返回空（网络抖动或仓库不可达）" "${TRAE_REL_ERR}" 0
            exit 1
          fi
          TRAE_VER="$TRAE_REL"
          echo "   Release: $TRAE_REL"

          # 二进制 sha256 从 Release 的 SHA256SUMS 实时提取，与版本强绑定；
          # 取不到就拒绝构建（Dockerfile 内还有一道 sha256sum -c 兜底校验）。
          # 同上：SHA256SUMS 是同一轮网络请求的下游，抖动会连带失败，
          # 同样重试 3 次；全失败才拒绝构建（安全底线不动：取不到仍不构建）。
          TRAE_SHA256=""
          TRAE_SHA_ERR=""
          for _try in 1 2 3; do
            # 同上：curl 失败不能直接进命令替换赋值，否则 set -e 当场终止。
            curl -fsSL "https://github.com/jarvanh/trae2api/releases/download/${TRAE_REL}/SHA256SUMS" \
              >/tmp/trae-sums.out 2>/tmp/trae-sums.err && _curl_rc=0 || _curl_rc=$?
            TRAE_SHA256="$(awk '$2 == "./trae2api-linux-amd64" {print $1}' /tmp/trae-sums.out 2>/dev/null || true)"
            TRAE_SHA_ERR="$(cat /tmp/trae-sums.err 2>/dev/null || true)"
            [ "$_curl_rc" -ne 0 ] && [ -z "$TRAE_SHA_ERR" ] && TRAE_SHA_ERR="curl exit=$_curl_rc"
            if [ -n "$TRAE_SHA256" ]; then
              [ "$_try" -gt 1 ] && echo "   （第 ${_try} 次尝试成功）"
              break
            fi
            echo "   ⚠️ 第 ${_try}/3 次获取 SHA256SUMS 失败，5 秒后重试" >&2
            [ "$_try" -lt 3 ] && sleep 5
          done
          rm -f /tmp/trae-sums.out /tmp/trae-sums.err
          if [ -z "$TRAE_SHA256" ]; then
            echo "❌ 未能提取 sha256，拒绝构建（已重试 3 次）" >&2
            trae_notify "❌ trae2api 部署失败" "SHA256SUMS 未取到校验值" "$TRAE_VER" "" \
              "Release 资产缺失或连续 3 次下载失败" "${TRAE_SHA_ERR}" 0
            exit 1
          fi
          echo "   sha256  : $TRAE_SHA256"

          echo "2. Bootstrap data files (idempotent, Dropbox 为准)..."
          if [ ! -f "$TRAE_DATA/.env" ]; then
            printf 'TW2A_API_KEY=%s\n' "$(openssl rand -hex 24)" > "$TRAE_DATA/.env"
          fi
          if [ ! -f "$TRAE_DATA/config.json" ]; then
            curl -fsSL "https://raw.githubusercontent.com/jarvanh/trae2api/${TRAE_REL}/config.example.json" \
              -o "$TRAE_DATA/config.json"
          fi

          echo "3. Fetch Dockerfile + compose from fork Release..."
          # 构建定义从 fork 对应 Release tag 的 raw 拉取（不再克隆源码、不再内联 heredoc）：
          # fork 的 Dockerfile 是「alpine + 下载 Release 二进制 + sha256 校验」单阶段构建，
          # compose 透传版本/Release/sha256 三个 build arg。本机无需源码、无需 Go 工具链。
          rm -rf "$TRAE_SRC"
          mkdir -p "$TRAE_SRC"
          curl -fsSL "https://raw.githubusercontent.com/jarvanh/trae2api/${TRAE_REL}/Dockerfile" \
            -o "$TRAE_SRC/Dockerfile"
          curl -fsSL "https://raw.githubusercontent.com/jarvanh/trae2api/${TRAE_REL}/docker-compose.yml" \
            -o "$TRAE_SRC/docker-compose.yml"

          echo "3.5 防御校验：compose 必须固化 Dropbox 挂载..."
          # 挂载在 jarvanh/trae2api eccfc2e 固化为 /dropbox/self-hosted/trae2api/... 绝对路径，
          # 不再由本 workflow 内联生成（此前两套 compose 并存，部署半途中断时会残留旧版）。
          # 取回来的 compose 若被回退成相对路径版，显式失败而不是让容器静默崩。
          if ! grep -q '/dropbox/self-hosted/trae2api' "$TRAE_SRC/docker-compose.yml"; then
            echo "::error::仓库 compose 未固化 Dropbox 挂载（可能被回退），拒绝部署" >&2
            exit 1
          fi

          echo "4. Remove stale container & build & start..."
          # 幂等接管：清理同名旧容器（可能来自手工部署或旧 project），再由本 compose 接管
          docker rm -f trae2api >/dev/null 2>&1 || true
          TRAE2API_IMAGE_VERSION="$TRAE_REL" \
          TRAE2API_RELEASE_TAG="$TRAE_REL" \
          TRAE2API_SHA256="$TRAE_SHA256" \
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          docker compose --env-file "$TRAE_DATA/.env" \
            -f "$TRAE_SRC/docker-compose.yml" \
            --project-directory "$TRAE_SRC" up -d --build

          echo "5. Health check..."
          _code=""
          for i in $(seq 1 60); do
            _code=$(curl -s --connect-timeout 2 -o /dev/null -w "%{http_code}" http://127.0.0.1:7864/healthz || true)
            if [ "$_code" = "200" ]; then
              echo "✅ [trae2api] 7864 已就绪 (HTTP 200)"
              break
            fi
            echo "⏳ [trae2api] 等待中... ${i}/60"
            sleep 2
          done
          if [ "${_code:-}" != "200" ]; then
            echo "❌ trae2api 未在 120 秒内就绪" >&2
            # 失败也通知（对齐 workbuddy：成功/失败都有声）。接口行不展示（第 7 参 0）：
            # 服务已不在，展示一个指向已停进程的地址会误导读者（wb_notify 同口径）。
            trae_notify "❌ trae2api 启动失败" \
              "未就绪 · 120 秒健康检查超时" \
              "$TRAE_VER" "" "构建或启动失败（详见运行日志）" \
              "$(docker logs --tail 60 trae2api 2>&1 || true)" 0
            exit 1
          fi

          echo "6. Converge tunnel..."
          # 公网隧道已撤（2026-09-29 主人要求）：trae2api 管理后台改走 Tailscale
          # ts.net 内网，不再暴露公网。tunnels.conf 里 trae2api 一行已删除，
          # ensure 对清单外名字是静默空操作；这里保留注释说明，避免后人误加回公网。

          echo "7. Bulk check-in all accounts (cooldown-aware)..."
          # 签到/积分工具随 fork 维护（jarvanh/trae2api cmd/checkin、cmd/credit）。
          # 冷却策略（工具内实现，状态落 Dropbox）：失败 30m 起步指数递增
          # （30m→60m→120m 封顶），当日已签直接跳过 —— 避免上游 9074
          # 「参与用户太多」限流下每 5 分钟空转重试。
          # CHECKIN_JSONL / CHECKIN_ERR / PACKS_JSON 已在 step 顶部定义（trae_notify 数据源）。
          # 工具二进制同样取自本轮 Release（fork 的 release.yml 一并构建），
          # 不再 go build —— 本机无源码、也无需 Go 工具链。
          curl -fsSL "https://github.com/jarvanh/trae2api/releases/download/${TRAE_REL}/trae2api-checkin-linux-amd64" \
            -o /tmp/trae2api-checkin && chmod +x /tmp/trae2api-checkin
          curl -fsSL "https://github.com/jarvanh/trae2api/releases/download/${TRAE_REL}/trae2api-credit-linux-amd64" \
            -o /tmp/trae2api-credit && chmod +x /tmp/trae2api-credit
          # 启动式错峰签到（主人 09-25 定）：停用 cron 连打，每次 VM 启动只跑一轮。
          #   - /tmp 标记随 VM 重启清空 → 天然「每次启动一次」
          #   - 后台进程存活（pid 探活）→ 上一 run 拉起的错峰仍在 30-60 分钟账号间隔中，跳过
          #   - 首个真实账号立即发起；already/cooldown 分支零请求秒回；
          #     后续真实请求随机间隔 30-60 分钟（工具内 -stagger-min/-stagger-max）
          #   - 不提供 -force：风控期禁止绕过冷却强打
          CK_RUNNING=0
          _ckp="$(cat /tmp/trae2api-checkin.pid 2>/dev/null || true)"
          if [ -n "$_ckp" ] && kill -0 "$_ckp" 2>/dev/null; then
            CK_RUNNING=1
          fi
          if [ "$CK_RUNNING" = 1 ]; then
            echo "   后台错峰签到进行中（pid $_ckp），跳过重复拉起"
          elif [ -f /tmp/trae2api-checkin.round ]; then
            echo "   本次 VM 启动已完成一轮错峰签到（标记存在），跳过"
          elif ! /tmp/trae2api-checkin -h 2>&1 | grep -q 'stagger-min'; then
            echo "   ⚠️ 签到工具不支持错峰参数（Release 未更新），本轮跳过签到"
          else
            : > "$CHECKIN_JSONL"; : > "$CHECKIN_ERR"
            nohup /tmp/trae2api-checkin -dir "$TRAE_DATA/auths" -state "$TRAE_DATA/data/state.json" \
              -stagger-min 30 -stagger-max 60 \
              > "$CHECKIN_JSONL" 2>>"$CHECKIN_ERR" &
            echo $! > /tmp/trae2api-checkin.pid
            touch /tmp/trae2api-checkin.round
            echo "   已后台拉起错峰签到（pid $(cat /tmp/trae2api-checkin.pid)），真实请求随机间隔 30-60 分钟"
          fi
          # 等首批落盘：跳过类分支秒回；首个真实账号数秒～数十秒
          for _i in 1 2 3 4 5 6 7 8 9; do
            sleep 10
            [ -s "$CHECKIN_JSONL" ] && break || true
          done
          /tmp/trae2api-credit -dir "$TRAE_DATA/auths" -packs -json > "$PACKS_JSON" 2>/dev/null || true
          cat "$CHECKIN_JSONL" 2>/dev/null || true
          _ckp="$(cat /tmp/trae2api-checkin.pid 2>/dev/null || true)"
          if [ -n "$_ckp" ] && kill -0 "$_ckp" 2>/dev/null; then
            echo "   （错峰签到后台进行中，剩余账号按 30-60 分钟间隔陆续落盘）"
          fi

          echo "7.5 Fetch model consumption rates (from live /v1/models)..."
          # 数据源：本机 trae2api /v1/models 的 consumption_rate 字段（jarvanh/trae2api
          # 91cb7a5 起提供，与 TRAE 客户端显示的倍率一致）。鉴权用 Dropbox .env 的
          # TW2A_API_KEY。取数失败/服务未就绪时 RATES_TXT 为空，通知里整段跳过。
          RATES_TXT=""
          RATES_N=""
          _tw2a_key="$(grep -m1 '^TW2A_API_KEY=' "$TRAE_DATA/.env" 2>/dev/null | cut -d= -f2-)"
          if [ -n "$_tw2a_key" ] && curl -sf -m 10 \
              -H "Authorization: Bearer ${_tw2a_key}" \
              "http://127.0.0.1:${TRAE_PORT}/v1/models" -o /tmp/trae2api-models.json 2>/dev/null \
              && jq -e '.data | length > 0' /tmp/trae2api-models.json >/dev/null 2>&1; then
            # 过滤内部功能模型（subagent/summary 等），只留用户可用的对话模型。
            # 仅统计 consumption_rate > 0 的条目：上游 client.go:270 定义
            # 「Rate 0 = 未知」，且 handler.go 只在 Rate > 0 时才输出该字段 ——
            # 故 rate 缺失 ≠ 免费，不能渲染成「免费」或 0.00x（那是编造）。
            # 已排除 custom_model_* 占位（14）与内部功能模型（4）；
            # 倍率未知的也列出并标「未知」（主人 07:12 定）。
            # 标题「模型数量N」= 列出的模型数（有倍率 + 未知），不是接口返回总数。
            RATES_N="$(jq -r '[.data[]
                | select(.id != "file_search_agent" and .id != "explore_sub_agent_v2"
                    and .id != "browser_use_subagent" and .id != "summary")
                | select((.id | startswith("custom_model")) | not)] | length' /tmp/trae2api-models.json)"
            # 倍率升序（价格低的排上面）、等宽表格（模型左对齐 + 倍率两位小数右对齐），
            # 通知里走 <pre> 渲染。版式与 workbuddy 段统一：
            #   行首两空格缩进 + 模型 %-26s 左对齐 + 倍率 %6.2fx 右对齐
            #   不列 model/rate 表头（workbuddy 以「国内站/国际站」分组，同样无表头）
            # 倍率未知（rate 缺失/0）也列出，排在最末并标「未知」——不冒充免费或 0.00x。
            # 排序键：有倍率用其值，未知用 9999 保证沉底。
            RATES_TXT="$(jq -r '.data[]
                | select(.id != "file_search_agent" and .id != "explore_sub_agent_v2"
                    and .id != "browser_use_subagent" and .id != "summary")
                | select((.id | startswith("custom_model")) | not)
                | if (.consumption_rate // 0) > 0
                  then "\(.consumption_rate)\t\(.id)"
                  else "9999\t\(.id)" end' /tmp/trae2api-models.json \
                | sort -k1,1 -n \
              | awk -F'\t' '{if ($1 == "9999") printf "  %-26s %6s\n", $2, "未知"; else printf "  %-26s %6.2fx\n", $2, $1}')"
          fi

          echo "8. Telegram notification (workbuddy-format)..."
          # 版式与调用形态对齐 wb_notify（workbuddy 段）：状态 emoji 标题 + 结论/版本/
          # 更新/接口/鉴权 + 凭据 + 账号池 + 数据目录 + 原始输出（版式真源在 trae_notify）。
          # 「更新」判定：TRAE_VER（本轮克隆 hash）与 Dropbox 数据目录记录的上轮 hash
          # 对比（语义对齐 wb_notify 的 WB_VER/WB_UPDATE）。记录写在服务健康通过之后 ——
          # 未就绪的轮次不落账，下轮仍报「更新」。
          TRAE_VER_FILE="$TRAE_DATA/data/.built-commit"
          TRAE_LOCAL_VER="$(head -n 1 "$TRAE_VER_FILE" 2>/dev/null || true)"
          if [ -n "$TRAE_LOCAL_VER" ] && [ "$TRAE_LOCAL_VER" = "$TRAE_VER" ]; then
            TRAE_UPDATE="已在最新版 ${TRAE_VER} · 镜像复用缓存"
          elif [ -n "$TRAE_LOCAL_VER" ]; then
            TRAE_UPDATE="从 ${TRAE_LOCAL_VER} 更新到 ${TRAE_VER}"
          else
            TRAE_UPDATE="首次构建 ${TRAE_VER}"
          fi
          if [ -n "$TRAE_VER" ]; then
            printf '%s\n' "$TRAE_VER" > "$TRAE_VER_FILE"
          fi

          # 标题/结论随签到结果走：无输出 = 签到工具自身异常（⚠️ 中间态，对齐 workbuddy
          # 的「已启动 · 无可用账号」调用点），服务本身仍就绪 → 接口行照常展示（第 7 参 1）。
          _title="🟢 trae2api 已就绪"
          _conclusion="已就绪 · 签到工具无输出（详见原始输出）"
          # 必须先初始化：本 step 顶部是 set -euo pipefail（带 -u），而下面的 else 分支
          # 不赋值 _raw_out，trae_notify 第 6 参展开它会 unbound variable 直接退出整 step。
          _raw_out=""
          if [ -s "$CHECKIN_JSONL" ]; then
            # 两行制（排程行+结果行）：按 uid 取末行再分类，避免重复计数；
            # 排程/冷却中的账号计入「待签」，结论里也能看到本轮还剩几个没轮到
            _total=$(jq -sr 'group_by(.uid) | length' "$CHECKIN_JSONL")
            _ok=$(jq -sr 'group_by(.uid) | map(last) | [.[] | select((.err // "") == "" and ((.claimed // false) == true or (.checked_in // false) == true or (.skipped // "") == "already"))] | length' "$CHECKIN_JSONL")
            _wait=$(jq -sr 'group_by(.uid) | map(last) | [.[] | select((.err // "") == "" and (.claimed // false) != true and (.checked_in // false) != true and ((.skipped // "") == "scheduled" or (.skipped // "") == "cooldown"))] | length' "$CHECKIN_JSONL")
            _fail=$(jq -sr 'group_by(.uid) | map(last) | [.[] | select((.err // "") != "")] | length' "$CHECKIN_JSONL")
            # 计数只列非零项（telegram-notify 规范 2.5 / 5.4）：
            # 「待签 0 · 失败 0」这类零计数与 🟢 已就绪的标题自相矛盾，且把常态噪音
            # 顶到结论行最显眼的位置。共 N 是分母、始终保留（读者需要知道池子多大）。
            _parts="已就绪"
            [ "${_ok:-0}" -gt 0 ] && _parts="${_parts} · 已签 ${_ok}"
            [ "${_wait:-0}" -gt 0 ] && _parts="${_parts} · 待签 ${_wait}"
            [ "${_fail:-0}" -gt 0 ] && _parts="${_parts} · 失败 ${_fail}"
            _conclusion="${_parts}（共 ${_total}）"
            # 错峰后台进行中 → 结论追加标记（剩余账号尚未落盘）
            _ckp="$(cat /tmp/trae2api-checkin.pid 2>/dev/null || true)"
            if [ -n "$_ckp" ] && kill -0 "$_ckp" 2>/dev/null; then
              _conclusion="${_conclusion} · 错峰进行中"
            fi
            # 原始输出：全签轮次的 stderr 尾行是「checkin done: 0/N ok」，分子 0 是
            # 「本轮真实领取次数」（已签账号幂等跳过不计入），不是失败数 —— 与结论的
            # 「已签 N」正面冲突，读者会以为签到全挂了。
            # 处理：无失败时滤掉该行。结论行已写明已签数，这是重复信息，没必要换句
            # 术语再解释一遍；滤完为空则「原始输出」整段跳过（规范 · 空清单整段跳过）。
            # 有失败时原样保留 —— 失败细节必须可见，不能被这层过滤盖掉。
            _raw_out="$(cat "$CHECKIN_ERR" 2>/dev/null || true)"
            if [ "${_fail:-0}" -eq 0 ]; then
              _raw_out="$(printf '%s' "$_raw_out" | grep -vE 'checkin done:[[:space:]]*0/' || true)"
            fi
          else
            _title="⚠️ trae2api 已就绪 · 签到无输出"
          fi
          trae_notify "$_title" \
            "$_conclusion" \
            "$TRAE_VER" "$TRAE_UPDATE" "" \
            "${_raw_out}" 1

      # zcode2api：GLM 反代网关（Anthropic + OpenAI 双协议，端口 8319）。
      # 代码取 jarvanh/zcode2api fork（在 dengyie 上游之上补了 ZCODE_GATEWAY_KEY
      # 环境变量生效与 credential_sync.py；本机 clone 为权威源，改动后 git push fork）。
      # .env 与账号池（data/，SQLite WAL 不能跑在 rclone 挂载点上）是本机部署快照，
      # 持久化在 Dropbox self-hosted/zcode2api-data.tar.gz，每轮还原到本地盘运行目录
      # —— 与 workbuddy-gateway「运行目录落本地盘」同口径。收尾归档 4c 会把运行
      # 目录的 .env + data 回传快照（凭据闭环）；仅本机结构性变更（增删账号、
      # 改 .env）才需手动重传覆盖。
      # 必须在 Notify Tailscale SSH entry 之前起来（该步骤会读 AI 网关状态）。
      # 收尾停止见 Stop OpenClaw and Final Archive 的 3c 步（在 workbuddy 的 3b 之后）。
      # quota-board：三网关额度聚合看板（TG 置顶消息原地编辑 + Mini App HTTP :8321）。
      # unit 真源已统一进 services.sh（2026-10-04，与四个网关同口径）：
      # 原先这里从 Dropbox 静态副本 cp unit，与 write_unit 双轨并存、改配置易漏改。
      # 现由 ensure 生成并每轮重启一次；/dropbox 下那份副本已无权威性（不再读取）。
      # 看板本体 board.py 仍在 /dropbox/self-hosted/quota-board/（持久化目录，非 unit）。
      # 隧道 qb（qb.derrick.eu.org → 127.0.0.1:8321）
      # 凭证随 /dropbox/self-hosted/.cloudflared 恢复，由 tunnels.conf 纳管。
      # QUOTA_BOARD_TOKEN 持久化在 ~/.openclaw/.env（随 openclaw.tar.gz 归档每轮恢复），
      # unit 的 EnvironmentFile 指向该文件，本 step 只负责拉起服务。
      # qoder2api-hub：Qoder（阿里）双区反代网关（国际 qoder.com / 国内 qoder.com.cn），
      # OpenAI 兼容 API + Responses API + Web 看板，与 workbuddy-gateway / zcode2api /
      # trae2api 同为 AI 网关形态服务（2026-10-19 主人要求接入）。
      # 部署方式：官方预构建 GHCR 多架构镜像（ghcr.io/shuishuipingan/qoder2api-hub），
      # 与 trae2api 同为容器形态（restart: unless-stopped 覆盖崩溃自愈，不纳入 systemd --user，
      # Stop 段也不显式停——容器随 VM 生命周期存续，下一轮 docker rm -f 幂等接管）。
      # 端口 8790（上游默认，绑 0.0.0.0 —— OmniRoute 经 host.docker.internal:8790
      # 以 runner-qoder 节点接入本网关，127.0.0.1 绑定对 docker 网桥不可达；
      # ⚠️ 必须挂 --network omniroute_default：该 provider_node 的 base_url 是
      #    http://qoder2api:8790/v1（容器名 DNS 解析），而 qoder2api 出厂只在 bridge。
      #    2026-10-19 实测裸名 qwen3.8-flash 报 502 ENOTFOUND qoder2api ——
      #    combo（free）与模型本身都没问题，纯粹是跨网络不可达。挂上后即可用
      #    qwen3.8-flash 直连，runner-qoder/Qwen3.8-Flash 前缀名也一起通。
      # 仍保留 -p 端口映射，宿主机 curl / 看板访问不受影响。
      # 与 trae2api 18080 同款形态）；看板走 Tailscale serve 8084（见 Tailscale 段）。
      # 数据直写 Dropbox fuse：/dropbox/self-hosted/qoder2api/{accounts,usage}——
      # 账号池/用量/调度状态全是 JSON/JSONL（无 SQLite），fuse 挂载点无锁兼容问题，
      # 无需本地盘中转；持久化白名单内（A 类），周期归档/收尾归档均无需登记（对齐 trae2api）。
      # 凭据引导（幂等，仅 settings.json 缺失时）：launcher API Key（qd- 前缀）与看板
      # 面板密码随机生成，PBKDF2-SHA256 摘要预写 settings.json（与 qoder_settings.py
      # _digest 逐字段对齐：salt 16B hex + 120000 轮），首启即免默认面板密码 admin 裸奔。
      # ⚠️ 运行时绝不传 --panel-password：该参数每次启动都会重置密码（set_panel_password
      # 无条件覆盖），会把预写凭据冲掉。容器 CMD 用镜像默认（--lan：强制鉴权 + 0.0.0.0）。
      # 版本标记用浮动 tag 1.5 + 镜像 digest（1.5 恒指最新 1.5.x，2026-10-19 实测 digest
      # 与 1.5.2 一致；digest 入账 .installed-version，浮动 tag 下仍可识别真实更新）。
      # continue-on-error：新网关故障不得级联跳过后续 quota-board / zcode2api / Run OpenClaw
      # （对齐 autoclaw/qingyan 的保护口径；可见性由 step 内 TG 告警保证）。
      - name: Run qoder2api-hub container (Qoder 双区 OpenAI 兼容网关)
        # 2026-10-22 步骤重排后位于 Run OpenClaw 之后：本步失败不得级联跳过
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # 通知真源在 step 顶层 source 一次（对齐 trae2api 段注释）
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"
          # TS_FQDN 由 Tailscale 步骤写入 ts.env，step 间不共享 env，需显式加载
          # （对齐 autoclaw 段写法）；缺失时看板入口两行整体跳过，不影响网关本身。
          [ -f "$HOME/ts.env" ] && . "$HOME/ts.env" || true

          QODER_DATA=/dropbox/self-hosted/qoder2api
          QODER_PORT="8790"
          QODER_IMAGE="ghcr.io/shuishuipingan/qoder2api-hub:1.6"
          QODER_TAG="1.6"

          # 通知版式对齐 trae_notify / wb_notify：标题 + 结论/版本/更新/接口/鉴权 +
          # 数据目录 + 原始输出。用法: qoder_notify <标题> <结论> <版本> <更新> <原因> <原始输出> <就绪态>
          # 第 7 参 = 服务就绪态，取 "1" 才补「接口 / 看板 / API Key」三行（失败时服务
          # 已不在，展示指向已停进程的地址会误导读者，与 wb_notify 同口径）。
          qoder_notify() {
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              local _msg=""
              tg_add_title _msg "$1"
              tg_add_kv _msg "结论" "$2"
              tg_add_path _msg "数据目录" "$QODER_DATA"
              [ -n "$3" ] && tg_add_path _msg "版本" "$3"
              [ -n "$4" ] && tg_add_kv _msg "更新" "$4"
              if [ "${7:-0}" = "1" ]; then
                tg_add_path _msg "接口" "http://127.0.0.1:${QODER_PORT}/v1"
                # 看板入口 + 面板密码（tailscale serve 8084）：ts.env 由 Tailscale 步骤
                # 在本 step 之前写出；缺失时两行整体跳过（tg_add_path 不留空行）。
                if [ -n "${TS_FQDN:-}" ]; then
                  tg_add_path _msg "看板" "http://${TS_FQDN}:8084/"
                  local _qp="$(cat "$QODER_DATA/.panel-password" 2>/dev/null || true)"
                  tg_add_path _msg "看板密码" "${_qp:-未取到}"
                fi
                # 明文 API Key（对齐 wb/trae 展示口径）
                tg_add_path _msg "API Key" "$(read_qoder_key | grep . || echo 未取到)"
              fi
              [ -n "$5" ] && tg_add_kv _msg "原因" "$5"
              if [ -n "$6" ]; then
                tg_add_pre _msg "$(printf '%s' "$6" | tail -c 1200)"
              fi
              tg_add_footer _msg
              send_tg "$_msg" alert || echo "::warning::TG 通知发送失败（不影响任务）"
            else
              echo "⚠️ Telegram secrets missing, skip qoder2api notification."
            fi
          }

          # 明文 API Key 读取 helper（面板管理 Key 优先、回落 launcher Key —— 与
          # 网关侧 api_key_override 取值顺序一致）；多调用点共用，避免两处写歪。
          read_qoder_key() {
            python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d.get("api_key") if d.get("api_key_set") else d.get("launcher_key",""))' "$QODER_DATA/accounts/settings.json" 2>/dev/null || true
          }

          echo "1. Bootstrap credentials (idempotent, Dropbox 为准)..."
          mkdir -p "$QODER_DATA/accounts" "$QODER_DATA/usage"
          if [ ! -s "$QODER_DATA/accounts/settings.json" ]; then
            # 首启凭据：launcher Key（qd- 前缀，同上游 ensure_launcher_key 形态）+
            # 面板密码随机生成；PBKDF2 摘要预写 settings.json（120000 轮与上游一致）。
            # 单行 python3 -c：YAML 块标量内多行 heredoc 体必须顶格才合法，会破坏
            # 块缩进（omniroute 的 heredoc+sed 先例是给数据文件用的）；凭据生成逻辑
            # 短小，一行写完最稳，且与 qoder_settings.py _digest 逐字段对齐。
            QODER_KEY="qd-$(openssl rand -hex 24)"
            QODER_PANEL_PW="$(openssl rand -base64 18)"
            python3 -c 'import json,sys,secrets,hashlib,pathlib; p,k,w=sys.argv[1],sys.argv[2],sys.argv[3]; s=secrets.token_hex(16); d=hashlib.pbkdf2_hmac("sha256",w.encode(),bytes.fromhex(s),120000).hex(); pathlib.Path(p).write_text(json.dumps({"launcher_key":k,"panel_password_salt":s,"panel_password_rounds":120000,"panel_password_hash":d,"panel_password_default":False},indent=2),encoding="utf-8")' \
              "$QODER_DATA/accounts/settings.json" "$QODER_KEY" "$QODER_PANEL_PW"
            # 面板密码明文单独落一份（fuse 权限位恒 666，边界在 Dropbox 账号侧；
            # 仅首次生成时写，便于从数据目录找回；看板内改密后此文件即过期）
            printf '%s\n' "$QODER_PANEL_PW" > "$QODER_DATA/.panel-password"
            echo "   凭据已生成（launcher Key qd-… + 面板密码 → .panel-password）"
          fi

          echo "2. Pull image & start container..."
          # 拉取失败不硬退：沿用本地旧镜像先保住服务可用性（digest 仍如实入账；
          # inspect 也兜 || true —— set -e 下命令替换失败会直接终止整 step）
          docker pull -q "$QODER_IMAGE" || echo "⚠️ 镜像拉取失败，沿用本地镜像"
          QODER_IMG_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "$QODER_IMAGE" 2>/dev/null | awk -F'@' '{print substr($2,1,19)}' || true)"
          QODER_VERSION="${QODER_TAG} @ ${QODER_IMG_DIGEST:-digest未知}"
          # 幂等接管：清掉同名旧容器（可能来自上一轮或手工部署），再由本轮接管。
          # 启动失败必须出声（continue-on-error 会吞掉非零退出，TG 是唯一可见通道）。
          docker rm -f qoder2api >/dev/null 2>&1 || true
          if ! docker run -d --name qoder2api \
            --restart unless-stopped \
            --network omniroute_default \
            -p ${QODER_PORT}:8790 \
            -e HOST=0.0.0.0 -e PORT=8790 -e TZ=Asia/Shanghai \
            -v "$QODER_DATA/accounts:/app/accounts" \
            -v "$QODER_DATA/usage:/app/usage" \
            "$QODER_IMAGE"; then
            qoder_notify "❌ qoder2api-hub 启动失败" "docker run 失败" \
              "$QODER_VERSION" "" "镜像缺失或端口/挂载冲突（详见运行日志）" \
              "$(docker logs --tail 40 qoder2api 2>&1 || true)" 0
            exit 1
          fi

          echo "3. Health check..."
          _code=""
          for i in $(seq 1 60); do
            _code=$(curl -s --connect-timeout 2 -o /dev/null -w "%{http_code}" "http://127.0.0.1:${QODER_PORT}/ping" || true)
            if [ "$_code" = "200" ]; then
              echo "✅ [qoder2api] ${QODER_PORT} 已就绪 (HTTP 200)"
              break
            fi
            echo "⏳ [qoder2api] 等待中... ${i}/60"
            sleep 2
          done
          if [ "${_code:-}" != "200" ]; then
            echo "❌ qoder2api 未在 120 秒内就绪" >&2
            qoder_notify "❌ qoder2api-hub 启动失败" \
              "未就绪 · 120 秒健康检查超时" \
              "$QODER_VERSION" "" "镜像拉取或启动失败（详见运行日志）" \
              "$(docker logs --tail 60 qoder2api 2>&1 || true)" 0
            exit 1
          fi

          echo "4. Auth self-check..."
          _qk="$(read_qoder_key)"
          _mk="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${_qk}" "http://127.0.0.1:${QODER_PORT}/v1/models" || true)"
          _mn="$(curl -s -H "Authorization: Bearer ${_qk}" "http://127.0.0.1:${QODER_PORT}/v1/models" 2>/dev/null | jq -r '(.data | length) // 0' 2>/dev/null || echo 0)"
          echo "   /v1/models 带鉴权: HTTP ${_mk} · 官方模型 ${_mn} 个（双区动态清单）"

          echo "5. Account pool snapshot..."
          # 账号池即 accounts/ 下除 settings.json / active_realm.json 外的 *.json
          # （与网关 AccountPool.load() 的过滤口径一致）
          _accs="$(find "$QODER_DATA/accounts" -maxdepth 1 -name '*.json' ! -name 'settings.json' ! -name 'active_realm.json' 2>/dev/null | wc -l | tr -d ' ')"

          echo "6. Version ledger & notification..."
          # 更新判定用镜像 digest（浮动 tag 1.6 下 tag 恒定，digest 才是真实版本指纹）。
          # 记录写在健康通过之后 —— 未就绪的轮次不落账，下轮仍报「更新」（对齐 trae2api）。
          QODER_VER_FILE="$QODER_DATA/.installed-version"
          QODER_LOCAL_VER="$(head -n 1 "$QODER_VER_FILE" 2>/dev/null || true)"
          if [ -n "$QODER_LOCAL_VER" ] && [ "$QODER_LOCAL_VER" = "$QODER_IMG_DIGEST" ]; then
            QODER_UPDATE="已在 ${QODER_VERSION} · 镜像层缓存复用"
          elif [ -n "$QODER_LOCAL_VER" ]; then
            QODER_UPDATE="从 ${QODER_LOCAL_VER} 更新到 ${QODER_IMG_DIGEST}"
          else
            QODER_UPDATE="首次部署 ${QODER_VERSION}"
          fi
          printf '%s\n' "$QODER_IMG_DIGEST" > "$QODER_VER_FILE"

          _title="🟢 qoder2api-hub 已就绪"
          _conclusion="已就绪 · 官方模型 ${_mn} 个"
          [ "${_accs:-0}" -gt 0 ] && _conclusion="${_conclusion} · 账号 ${_accs}（看板 OAuth 可添加）"
          [ "${_accs:-0}" -eq 0 ] && _conclusion="${_conclusion} · 账号池空（看板「+ 添加账号 (OAuth)」入池）"
          qoder_notify "$_title" "$_conclusion" "$QODER_VERSION" "$QODER_UPDATE" "" "" 1

      - name: Run quota-board (TG 额度看板 + Mini App)
        # 2026-10-22 步骤重排后位于 Run OpenClaw 之后：本步失败不得级联跳过
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # psutil：看板「🖥 系统」段的数据源（2026-10-07 合并系统看板进主看板）。
          # --user 安装落在 ~，runner 重置即丢，故每轮幂等补装（已装则秒过）。
          python3 -c "import psutil" 2>/dev/null || pip3 install --user --quiet psutil || true
          if [ -f "$GITHUB_WORKSPACE/.github/scripts/services/services.sh" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/services/services.sh" ensure quota-board || true
          else
            # 兜底：services.sh 缺失（仓库未 checkout）时退回旧路径，避免看板静默不起
            echo "⚠️ services.sh 缺失，退回 Dropbox 副本安装 unit"
            QB_DIR=/dropbox/self-hosted/quota-board
            [ -f "$QB_DIR/quota-board.service" ] || { echo "quota-board unit 缺失，跳过"; exit 0; }
            mkdir -p ~/.config/systemd/user
            cp "$QB_DIR/quota-board.service" ~/.config/systemd/user/
            systemctl --user daemon-reload || true
            systemctl --user enable quota-board >/dev/null 2>&1 || true
            systemctl --user restart quota-board
          fi
          sleep 3
          systemctl --user is-active quota-board || true
          # 隧道纳入统一管理器（幂等）
          if [ -f "$GITHUB_WORKSPACE/.github/scripts/tunnels/tunnels.sh" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/tunnels/tunnels.sh" ensure qb || true
          else
            nohup cloudflared tunnel run --url http://127.0.0.1:8321 qb \
              > ~/.openclaw/logs/cloudflared_qb.log 2>&1 &
          fi
          # Mini App 入口（TG 菜单按钮 web_app）—— 2026-10-19 迁到 @openclaw_sb_bot。
          # 按钮本体在 Telegram 服务端，不在任何本地持久化载体里（实测 2026-10-09
          # 丢过一次、靠人工重设），故每轮幂等重建：目标 bot 挂 web_app + 旧 bot
          # @sbsbsbsbsb_openclaw_bot 清成 commands，避免留下双入口。
          # ⚠️ 2026-10-22 修复：脚本本体此前从未入库（commit 1e30239 只有这 9 行调用，
          # workspace 副本丢失后安全网空转 3 天）。真源改为本仓库 .github/scripts/telegram/，
          # 与 tg_notify.sh 同级；workspace 路径仅作过渡期兜底。
          if [ -f "$GITHUB_WORKSPACE/.github/scripts/telegram/ensure-miniapp-menu.sh" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/telegram/ensure-miniapp-menu.sh" || true
          elif [ -f "$HOME/.openclaw/workspace/scripts/ensure-miniapp-menu.sh" ]; then
            bash "$HOME/.openclaw/workspace/scripts/ensure-miniapp-menu.sh" || true
          else
            echo "⚠️ ensure-miniapp-menu.sh 缺失（仓库与 workspace 均无），跳过 Mini App 入口重建"
          fi

      - name: Run zcode2api (GLM gateway)
        id: run_zcode2api
        # 2026-10-02：trae2api 步骤硬失败时本步骤被默认语义级联跳过（continue-on-error
        # 只影响自身失败标记，不改变「前置失败则跳过」），与 Run OpenClaw 同款修复。
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          # send_tg 发送闸 + 收尾区接线（缺任一则本步骤通知静默跳过）
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 网关鉴权：zcode2api 专属 secret（与 accounts.db meta 表 gateway_key 同值）。
          # 勿改回 AI_GATEWAY_API_KEY——那是 workbuddy-gateway 的 key，两者已分家；
          # DB meta 优先级高于 env，env 注错不影响服务，但自检会拿它报「API Key 无效」
          # （2026-09-25 误报实录）。环境变量优先于 .env（python-dotenv 默认不覆盖
          # 已存在的环境变量），无需改数据快照里的 .env 即与仓库 Secrets 对齐。
          ZCODE_GATEWAY_KEY: ${{ secrets.ZCODE_GATEWAY_API_KEY }}
        run: |
          set -uo pipefail
          # 通知真源在 step 顶层 source 一次（勿挪进函数体，理由见 workbuddy 步骤同名注释 / 规范 4.4）
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"

          Z2A_REPO="https://github.com/jarvanh/zcode2api.git"
          Z2A_DATA_ARCHIVE="dropbox:self-hosted/zcode2api-data.tar.gz"
          Z2A_RUN_DIR="/tmp/local_zcode2api"
          Z2A_PORT="8319"
          Z2A_LOG="/dropbox/self-hosted/zcode2api/logs/zcode2api.log"

          Z2A_OK=0
          Z2A_REASON=""
          Z2A_SELFTEST_MODEL=""
          Z2A_SELFTEST_OUT=""
          Z2A_PLAN_BAD=0

          # 端口存活判定：/v1 带鉴权，未带 key 会拿 401，不能 curl -f；
          # 拿到任意 HTTP 码（非 000）即视为有进程在监听，链路可用性交给自检。
          z2a_alive() {
            local code
            code="$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' "http://127.0.0.1:${Z2A_PORT}/v1/models" 2>/dev/null || true)"
            [ -n "$code" ] && [ "$code" != "000" ]
          }

          # 端到端自检：无论进程是新起的还是复用的残留实例，都要真发消息验证。
          # 判据是「上游返回了助手内容块」——healthz/模型列表通不代表上游链路可用
          # （旧反代实测漏过「进程活着但上游 429」）。注意 GLM 是思考模型，
          # max_tokens 给小了会只产出 thinking 块，故判据不限定 text 类型。
          # 主探 glm-5.3-flash（Plan 通道）：要过无痕验证码。2026-09-29 起
          # 求解器已切 bun + vendored 上游 captcha-happy（实测 6/6 成功），
          # 连败已罕见，验证码类错误重试 3 轮仅作兜底；全败再退探
          # bigmodel/GLM-5.3（API Key 通道，免验证码）——能通说明服务
          # 本体健康、仅 Plan 通道降级，通知里如实分开报（Z2A_PLAN_BAD）。
          z2a_probe() {
            curl -sS --max-time 120 -X POST "http://127.0.0.1:${Z2A_PORT}/v1/messages" \
              -H "Authorization: Bearer ${ZCODE_GATEWAY_KEY}" \
              -H 'content-type: application/json' \
              -d "$1" 2>&1
          }
          z2a_body_ok() {
            echo "$1" | jq -e '(.content // [] | length) > 0' >/dev/null 2>&1
          }
          # 失败分诊：自检不通不等于服务没起来。上游额度耗尽时网关照样回 HTTP 200，
          # 只是没有 content 块（实测 {"code":1005,"msg":"exceed quota limit"}），
          # 与「进程没起来 / 端口没人听」是完全两种事，不该共用红色「启动失败」告警。
          # 返回：quota=上游额度/余额类（服务本体健康）· channel=回退通道被关 ·
          # captcha=验证码 · auth=鉴权 ·
          #       unavailable=网关 503/请求级死线（账号池全冷却/耗尽，服务本体健康）·
          #       unknown=其他（按真失败处理）
          z2a_fail_class() {
            printf '%s' "$1" | jq -e '.code == 1005 or ((.msg // "") | test("quota|余额|insufficient|1113"; "i"))' >/dev/null 2>&1 && { echo quota; return; }
            printf '%s' "$1" | jq -e '.error.type == "channel_disabled"' >/dev/null 2>&1 && { echo channel; return; }
            printf '%s' "$1" | jq -e '.error.type == "captcha_error"' >/dev/null 2>&1 && { echo captcha; return; }
            printf '%s' "$1" | jq -e '.error.type == "no_available_account"' >/dev/null 2>&1 && { echo unavailable; return; }
            printf '%s' "$1" | jq -e '.error.type | test("auth|invalid_request|unauthorized"; "i")' >/dev/null 2>&1 && { echo auth; return; }
            echo unknown
          }
          z2a_selftest() {
            Z2A_SELFTEST_OUT=""
            Z2A_SELFTEST_MODEL=""
            Z2A_PLAN_BAD=0
            Z2A_FAIL_CLASS=""
            Z2A_MAIN_CLASS=""
            for _ in 1 2 3; do
              Z2A_SELFTEST_OUT="$(z2a_probe '{"model":"glm-5.3-flash","max_tokens":16,"messages":[{"role":"user","content":"回复 ok 即可"}]}')"
              if z2a_body_ok "$Z2A_SELFTEST_OUT"; then
                Z2A_SELFTEST_MODEL="$(printf '%s' "$Z2A_SELFTEST_OUT" | jq -r '.model // "未知"' 2>/dev/null || true)"
                return 0
              fi
              # 只有验证码类错误值得重试（额控/鉴权重试也是同样结果）
              echo "$Z2A_SELFTEST_OUT" | jq -e '.error.type == "captcha_error"' >/dev/null 2>&1 || break
              sleep 5
            done
            # 主通道失败原因先落袋：兜底探会覆盖 Z2A_SELFTEST_OUT，若只在最后
            # 分诊，主通道的额度耗尽会被兜底的 channel_disabled 顶掉 —— 于是通知
            # 让人去开回退通道，而该通道实测上游同样欠费（429 code 1113），白折腾。
            Z2A_MAIN_CLASS="$(z2a_fail_class "$Z2A_SELFTEST_OUT")"
            # 请求级死线形态：主通道被 429 梯拖满 600s，curl 拿不到任何字节
            # （自检输出恰为 "curl: (28) Operation timed out ..."，非 JSON）。
            # 这不是服务挂了，是账号池在冷却期。
            if [ "$Z2A_MAIN_CLASS" = "unknown" ] && \
               printf '%s' "$Z2A_SELFTEST_OUT" | grep -q 'curl: (28)'; then
              Z2A_MAIN_CLASS="unavailable"
            fi
            # 兜底探 bigmodel/GLM-5.3（Key 通道，免验证码）。该通道是**独立**的
            # bigmodel 账号池：Plan 池耗尽/冷却时它仍可能出内容，故「主通道 503/超时
            # + 兜底通」应报「Plan 通道降级」，不该报启动失败。
            # 但主通道已确认是额度/无可用账号时不必再等：兜底探在 Key 池同样 429 时
            # 会被 curl 拖满 120s（零输出），直接判「服务正常 · 无可用额度」更快更准。
            Z2A_PLAN_BAD=1
            case "$Z2A_MAIN_CLASS" in
              quota|unavailable)
                Z2A_SELFTEST_OUT=""
                Z2A_FAIL_CLASS="$Z2A_MAIN_CLASS"
                return 1
                ;;
            esac
            Z2A_SELFTEST_OUT="$(z2a_probe '{"model":"bigmodel/GLM-5.3","max_tokens":16,"messages":[{"role":"user","content":"回复 ok 即可"}]}')"
            if z2a_body_ok "$Z2A_SELFTEST_OUT"; then
              Z2A_SELFTEST_MODEL="$(printf '%s' "$Z2A_SELFTEST_OUT" | jq -r '.model // "未知"' 2>/dev/null || true)"
              return 0
            fi
            # 两条通道都没出内容：以主通道原因为准（它才是服务设计上该走的通道），
            # 主通道归因不明时才退回兜底原因，供通知层区分「降级」与「真挂了」
            if [ -n "$Z2A_MAIN_CLASS" ] && [ "$Z2A_MAIN_CLASS" != unknown ]; then
              Z2A_FAIL_CLASS="$Z2A_MAIN_CLASS"
            else
              Z2A_FAIL_CLASS="$(z2a_fail_class "$Z2A_SELFTEST_OUT")"
            fi
            return 1
          }
          # 账号池采集：admin API 脱敏视图拼「💳 账号池」分节（对齐 wb_notify 的
          # 账号池口径：条目行 = 名称 · 通道 · 状态；子行 = 额度/套餐 + 最近错误）。
          # 只在服务已监听时可采；采集失败只影响通知信息量，不改变结论。
          # 注意：子行换行用 $'\n' 单行拼接 —— YAML 块标量里裸换行续行会破坏缩进。
          # 后台密码真值在 accounts.db 的 meta.admin_key：.env 的 ZCODE_ADMIN_KEY
          # 只在首次初始化时播种一次（store.py 是 INSERT OR IGNORE），后台「设置」页
          # 改过密码后 db 永久优先、.env 变成历史残留 —— 拿 .env 的值调 admin API
          # 会 401，账号池分节静默消失（2026-09-30 实测）。故优先读 db，读不到才回退 .env。
          z2a_admin_key() {
            local k=""
            if [ -f "$Z2A_RUN_DIR/data/accounts.db" ]; then
              k="$(Z2A_DB="$Z2A_RUN_DIR/data/accounts.db" python3 -c 'import os,sqlite3;db=sqlite3.connect("file:"+os.environ["Z2A_DB"]+"?mode=ro",uri=True,timeout=5);r=db.execute("select value from meta where key=?",("admin_key",)).fetchone();print(r[0] if r and r[0] else "")' 2>/dev/null || true)"
            fi
            [ -n "$k" ] || k="$(grep -m1 '^ZCODE_ADMIN_KEY=' "$Z2A_RUN_DIR/.env" 2>/dev/null | cut -d= -f2-)"
            printf '%s' "$k"
          }
          Z2A_POOL_TITLE=""
          Z2A_POOL_TEXT=""
          z2a_collect_pool() {
            local ak json n=0 total=0
            ak="$(z2a_admin_key)"
            [ -n "$ak" ] || return 0
            json="$(curl -sS --max-time 10 -H "Authorization: Bearer ${ak}" \
              "http://127.0.0.1:${Z2A_PORT}/admin/api/accounts" 2>/dev/null)" || return 0
            printf '%s' "$json" | jq -e '.accounts' >/dev/null 2>&1 || return 0
            # 无额度账号不展示（主人 2026-09-30 要求）。判据与 quota-board 的
            # zc_apikeys 一致：**quota 为空即无额度可展示**，不按 mode 硬编码隐藏 ——
            # Key 通道（bigmodel/apiKey）设计上不打 billing 全家桶，quota 恒空，
            # 将来上游若给它补了额度会自动出现，不用回来改代码。
            local pool_rows shown_total shown_active hidden_total
            pool_rows="$(printf '%s' "$json" | jq -r '.accounts[] | select((.quota // {} | length) > 0) | [.name, .provider, .mode, .status, (.plan.name // "-"), (.last_error // "-"), (.quota // {} | tostring)] | @tsv' 2>/dev/null || true)"
            shown_total="$(printf '%s' "$pool_rows" | grep -c . || true)"
            shown_active="$(printf '%s' "$pool_rows" | awk -F'\t' '$4=="active"' | grep -c . || true)"
            hidden_total="$(printf '%s' "$json" | jq -r '[.accounts[] | select((.quota // {} | length) == 0)] | length' 2>/dev/null || true)"
            # 标题计数用**已展示**的条目，避免「账号池 10」却只列 1 条的口径打架；
            # 被略去的条数单独标出，主人仍知道池子里还有多少无额度账号。
            Z2A_POOL_TITLE="💳 账号池 · ${shown_total}（active ${shown_active}）"
            if [ "${hidden_total:-0}" -gt 0 ] 2>/dev/null; then
              Z2A_POOL_TITLE="${Z2A_POOL_TITLE} · 略 ${hidden_total} 无额度"
            fi
            local rows="" prefix subpre
            while IFS=$'\t' read -r name prov mode st plan_name err quota_json; do
              n=$((n + 1))
              if [ "$n" -eq "${shown_total}" ]; then
                prefix='<code>  └─ </code>'; subpre="$(tree_sub 1)"
              else
                prefix='<code>  ├─ </code>'; subpre="$(tree_sub 0)"
              fi
              local chan st_cn
              case "$prov/$mode" in
                zai/jwt)         chan="Plan 通道" ;;
                bigmodel/apiKey) chan="Key 通道" ;;
                *)               chan="$prov/$mode" ;;
              esac
              case "$st" in
                active)    st_cn="正常" ;;
                exhausted) st_cn="额度用完" ;;
                cooling)   st_cn="冷却中" ;;
                invalid)   st_cn="鉴权失效" ;;
                disabled)  st_cn="已停用" ;;
                *)         st_cn="$st" ;;
              esac
              local line="$prefix<code>$(escape_html "$name")</code> · $chan · $st_cn"
              local sub=""
              if [ -n "$quota_json" ] && [ "$quota_json" != "{}" ]; then
                local q
                q="$(printf '%s' "$quota_json" | jq -r 'to_entries | map("\(.key) 剩 \(((.value.remaining / 100000) | floor) / 10)M / \(((.value.total / 100000) | floor) / 10)M") | join(" · ")' 2>/dev/null)"
                local exp
                # 精确到时刻并强制北京时区（jq todate 是 GMT 且只取日期会丢时刻；
                # strftime 两参数写法在本机 jq 会崩，故 bash 侧 date 换算）
                exp="$(printf '%s' "$quota_json" | jq -r '[.[] | .expires_at // empty] | unique | .[]' 2>/dev/null \
                  | while read -r ts; do TZ=Asia/Shanghai date -d @"$ts" '+%Y-%m-%d %H:%M'; done | paste -sd' · ' -)"
                [ -n "$exp" ] && q="${q} · 有效期 ${exp}"
                [ -n "$q" ] && sub="额度 $(escape_html "$q")"
              fi
              [ -n "$plan_name" ] && [ "$plan_name" != "-" ] && sub="${sub:+$sub · }套餐 $(escape_html "$plan_name")"
              [ -n "$err" ] && [ "$err" != "-" ] && sub="${sub:+$sub · }最近错误 $(escape_html "$err")"
              [ -n "$sub" ] && line="${line}"$'\n'"${subpre}${sub}"
              rows+="$line"$'\n'
            done < <(printf '%s\n' "$pool_rows")
            Z2A_POOL_TEXT="$(printf '%s' "$rows" | sed '/^$/d')"
          }

          z2a_ok_reason() {
            if [ "$Z2A_PLAN_BAD" = "1" ]; then
              echo "已就绪（Plan 通道降级）· glm-5.3-flash 自检 3 轮未过，bigmodel Key 通道可用（model=${Z2A_SELFTEST_MODEL:-未知}）"
            else
              echo "已就绪 · 自检消息已收到回答（model=${Z2A_SELFTEST_MODEL:-未知}）"
            fi
          }

          # 自检前先强制刷新一次额度 —— 修「有额度却报额度耗尽」的误报
          # （2026-10-06 实测：启动通知报 4 个账号全「额度用完」，实际刷新后
          # 4 个全部 active、合计剩 2.76 亿 token）。
          # 成因是时序竞争：服务重启后账号状态从 accounts.db 恢复，带着上次
          # 运行留下的 EXHAUSTED；后台 monitor 的额度刷新还没跑完，自检探针就
          # 打进来拿 503，通知便据此判「全部通道额度耗尽」。服务没病，是健康
          # 检查抢跑。故先刷一次让状态追上真实额度，再自检 —— 刷新后仍 503
          # 才是真的无额度，此时报警才准。
          # 失败不阻断：刷新只用于纠正状态，刷不动时自检结果本身仍然可信。
          # （端点只跳过 cooling / 非 Plan 通道账号，EXHAUSTED 会被刷到，
          #  quota.py 的「额度恢复 → 重新激活」逻辑会把有余量的账号救回 active）
          z2a_refresh_quota() {
            local ak
            ak="$(z2a_admin_key)"
            [ -n "$ak" ] || return 0
            curl -sS --max-time 180 -X POST \
              "http://127.0.0.1:${Z2A_PORT}/admin/api/accounts/refresh" \
              -H "Authorization: Bearer ${ak}" \
              -H 'content-type: application/json' \
              -d '{"all":true}' >/dev/null 2>&1 || true
          }

          if z2a_alive; then
            # 端口已有实例在响应：多为上一轮接力残留，直接复用，不重复起。
            # 但复用不等于可用 —— 仍要跑自检确认上游链路。
            # 复用实例同理先刷额度：残留实例可能已跑很久，状态未必跟上。
            z2a_refresh_quota
            if z2a_selftest; then
              Z2A_OK=1
              Z2A_REASON="已就绪 · 复用 ${Z2A_PORT} 上的实例（$(z2a_ok_reason)）"
            else
              Z2A_REASON="复用 ${Z2A_PORT} 上的实例，但自检未通过（输出见下方原始输出）"
            fi
          else
            echo "Cloning zcode2api and restoring data snapshot..."
            # Bun 运行时：验证码求解主路径 = bun + vendored 上游 captcha-happy
            # （fork 641c193 起）。缺 bun 时 settings.py 自动回退旧 node solver.js，
            # 该移植版在上游轮换 pe 版本后失速率 >70%（表现为连环 500「多次重试
            # 无结果」），故此处 best-effort 补装；安装失败不阻断本轮（有回退路
            # 径），但自检大概率 Plan 降级。runner 重置会清 ~/.bun，每轮幂等检查。
            if [ ! -x "$HOME/.bun/bin/bun" ]; then
              echo "Installing Bun for zcode2api captcha solver..."
              if curl -fsSL https://bun.sh/install | bash; then
                echo "✅ [zcode2api] Bun 已安装（$HOME/.bun/bin/bun）"
              else
                echo "⚠️ [zcode2api] Bun 安装失败（回退 node solver.js，验证码可能连环 500）"
              fi
            fi
            rm -rf "$Z2A_RUN_DIR"
            # 先 clone（目标必须为空目录），logs 目录随后补建
            if ! git clone --quiet --depth 1 "$Z2A_REPO" "$Z2A_RUN_DIR"; then
              Z2A_REASON="代码克隆失败：$Z2A_REPO"
            else
              mkdir -p "$Z2A_RUN_DIR/logs"
              if ! { rclone copyto "$Z2A_DATA_ARCHIVE" /tmp/zcode2api-data.tar.gz 2>/dev/null \
                   && [ -s /tmp/zcode2api-data.tar.gz ] \
                   && tar -xzf /tmp/zcode2api-data.tar.gz -C "$Z2A_RUN_DIR"; }; then
                Z2A_REASON="数据快照缺失或损坏：$Z2A_DATA_ARCHIVE（先在本机重新打包上传）"
              elif ! { python3 -m venv "$Z2A_RUN_DIR/.venv" \
                   && "$Z2A_RUN_DIR/.venv/bin/pip" install --quiet --disable-pip-version-check \
                        -r "$Z2A_RUN_DIR/requirements.txt" 2>"$Z2A_RUN_DIR/logs/pip.log" \
                   && (cd "$Z2A_RUN_DIR/captcha_node" && npm ci --silent 2>"$Z2A_RUN_DIR/logs/npm.log"); }; then
                Z2A_REASON="依赖安装失败（见 logs/pip.log / logs/npm.log）"
              else
                echo "Starting zcode2api on ${Z2A_PORT} (systemd --user 托管)..."
                # 托管交给 services.sh（systemd --user + Restart=always）：窗口期内
                # 进程崩溃由 systemd 秒级拉起，不再依赖下一轮 run。ZCODE_GATEWAY_KEY
                # 由 step env 注入、单元 Environment 落盘（600），优先级高于 .env。
                # 停止必须走 systemctl（见收尾 3c 注释），pkill 会被 Restart 抢回来。
                bash "$GITHUB_WORKSPACE/.github/scripts/services/services.sh" ensure zcode2api || true
                Z2A_UP=0
                for _ in $(seq 1 60); do
                  if z2a_alive; then Z2A_UP=1; break; fi
                  sleep 1
                done
                if [ "$Z2A_UP" != "1" ]; then
                  Z2A_REASON="服务未在 60 秒内监听 ${Z2A_PORT}（见日志尾部）"
                else
                  # 凭据自动跟随：credentials.json 每轮随 zcode.tar.gz 还原（比快照里的
                  # 账号池新），解密出的 JWT / bigmodel API Key 对齐进账号池；
                  # 脚本幂等（一致即 SKIP），失败不阻断，沿用快照凭据继续服务
                  if (cd "$Z2A_RUN_DIR" && .venv/bin/python credential_sync.py >> "$Z2A_LOG" 2>&1); then
                    echo "✅ [zcode2api] credential sync 完成"
                  else
                    echo "⚠️ [zcode2api] credential sync 失败（沿用快照账号池凭据）"
                  fi
                  # 凭据自动跟随 cron：runner 重置会清掉手工 crontab，故每轮幂等重装。
                  # run 间隔最长 ~5.75h，期间 zcode 客户端滚动刷新 credentials.json，
                  # 账号池靠这条 cron 每 10 分钟跟上（脚本幂等，一致即 SKIP）。
                  mkdir -p "$HOME/.openclaw/logs"
                  CRON_LINE="*/10 * * * * flock -n /tmp/zcode2api-cred-sync.lock $Z2A_RUN_DIR/.venv/bin/python $Z2A_RUN_DIR/credential_sync.py >> $HOME/.openclaw/logs/zcode2api-cred-sync.log 2>&1"
                  if { crontab -l 2>/dev/null | grep -vF 'zcode2api-cred-sync.lock'; echo "$CRON_LINE"; } | crontab -; then
                    echo "✅ [zcode2api] credential sync cron 已就位"
                  else
                    echo "⚠️ [zcode2api] credential sync cron 安装失败（不影响本轮服务）"
                  fi
                  # 新起实例：自检前先刷额度，避免账号从 accounts.db 带着上轮的
                  # EXHAUSTED 恢复、后台刷新尚未跑完就被自检判「额度耗尽」
                  # （2026-10-06 误报实例，详见 z2a_refresh_quota 处注释）
                  z2a_refresh_quota
                  if z2a_selftest; then
                    Z2A_OK=1
                    Z2A_REASON="$(z2a_ok_reason)"
                  else
                    Z2A_REASON="服务已监听但自检未通过（输出见下方原始输出）"
                  fi
                fi
              fi
            fi
          fi

          # 通知前采集账号池（服务已监听才有数据；失败不阻断，通知里少一节）
          z2a_alive && z2a_collect_pool

          # 通知口径：与 workbuddy-gateway 一致，成功也推「已就绪」。
          # 接力轮每轮都会跑本步骤，为免逐轮刷屏，用本步骤自己的标记文件区分：
          # 文件在 → 上一轮已启动过 = 接力轮，不重复推「已就绪」。按未标记处理
          # （多发一条好过漏发）。Plan 降级不算接力静默条件：降级必须每轮报。
          Z2A_RUN_TAG_FILE="/tmp/zcode2api-serve-run-tag"
          Z2A_RELAUNCH=0
          Z2A_PREV_TAG=""
          if [ -s "$Z2A_RUN_TAG_FILE" ] && [ "$Z2A_PLAN_BAD" != "1" ]; then
            Z2A_RELAUNCH=1
            Z2A_PREV_TAG="$(head -n 1 "$Z2A_RUN_TAG_FILE" 2>/dev/null || true)"
          fi

          if [ "$Z2A_OK" != "1" ]; then
            Z2A_TAIL="$(tail -n 15 "$Z2A_LOG" 2>/dev/null || true)"
            echo "--- zcode2api.log tail ---"
            printf '%s\n' "${Z2A_TAIL:-<empty>}"
            echo "--- end zcode2api.log tail ---"
            _m=""
            # 失败分诊：服务已监听但自检不出内容时，先分清是「上游额度/通道问题」
            # 还是「服务真没起来」。前者服务本体健康（/v1/models 带 key 回 200），
            # 只是无额度可用 —— 用黄色「已就绪（额度耗尽）」，不用红色「启动失败」：
            # 红色会让人去查进程/端口，实际该做的是等额度重置或换账号，方向完全不同。
            case "$Z2A_FAIL_CLASS" in
              # unavailable = 网关 503 no_available_account / 请求级死线：账号池全冷却
              # 或额度耗尽，服务本体在监听且能回 /v1/models —— 与 quota 同为黄色降级，
              # 不能掉进红色「启动失败」（2026-09-30 误报实例：额度耗尽报成了启动失败）
              quota|unavailable)
                tg_add_title _m "🟡 zcode2api 已就绪 · 全部通道额度耗尽"
                tg_add_kv _m "结论" "服务正常，上游无可用额度/账号池冷却中（非启动故障）"
                tg_add_kv _m "说明" "冷却到期自动回轮询，无需人工介入；额度周期刷新后自动恢复"
                ;;
              channel)
                tg_add_title _m "🟡 zcode2api 已就绪 · 回退通道已关闭"
                tg_add_kv _m "结论" "服务正常，bigmodel 回退通道被关（后台「设置」可开）"
                ;;
              auth)
                tg_add_title _m "🟠 zcode2api 鉴权失败"
                tg_add_kv _m "结论" "网关 Key / 上游鉴权不符，需人工介入"
                ;;
              *)
                tg_add_title _m "❌ zcode2api 启动失败"
                tg_add_kv _m "结论" "未就绪"
                ;;
            esac
            tg_add_path _m "端口" "$Z2A_PORT"
            tg_add_kv _m "原因" "$Z2A_REASON"
            tg_add_path _m "代码" "$Z2A_REPO"
            tg_add_path _m "数据快照" "$Z2A_DATA_ARCHIVE"
            if [ -n "$Z2A_SELFTEST_OUT" ]; then
              tg_add_section _m "🧾 自检输出"
              tg_add_pre _m "$Z2A_SELFTEST_OUT"
            fi
            if [ -n "$Z2A_POOL_TEXT" ]; then
              tg_add_section _m "$Z2A_POOL_TITLE"
              tg_add_block _m "$Z2A_POOL_TEXT"
            fi
            if [ -n "$Z2A_TAIL" ]; then
              tg_add_section _m "🧾 服务日志尾部"
              tg_add_pre _m "$Z2A_TAIL"
            fi
            tg_add_footer _m
            send_tg "$_m" alert || echo "::warning::TG 通知发送失败（不影响任务）"
          else
            echo "✅ [zcode2api] ${Z2A_PORT} 已就绪（${Z2A_REASON}）"
            printf '%s\n' "${GITHUB_RUN_ID:-manual}" > "$Z2A_RUN_TAG_FILE"
            if [ "$Z2A_RELAUNCH" = "1" ]; then
              echo "ℹ️ [zcode2api] 接力轮（上一 run ${Z2A_PREV_TAG} 已启动），跳过重复的就绪通知"
            else
              # 版式对齐 wb_notify 的就绪态分支：结论 → 接口/鉴权/模型 → 代码来源。
              # 「模型」是机器值（模型名），按规范 · 取值行口径走 <code>。
              _m=""
              if [ "$Z2A_PLAN_BAD" = "1" ]; then
                tg_add_title _m "🟡 zcode2api 已就绪（Plan 通道降级）"
              else
                tg_add_title _m "🟢 zcode2api 已就绪"
              fi
              tg_add_kv _m "结论" "$Z2A_REASON"
              tg_add_path _m "接口" "http://127.0.0.1:${Z2A_PORT}/v1"
              # 数据目录（对齐 wb_notify 头部定位口径，主人 2026-10-11 要求信息层面统一）
              tg_add_path _m "数据目录" "/tmp/local_zcode2api/data"
              # 标签「API Key」+ tg_add_path：对齐 wb_notify 同款 —— 值走 <code> 等宽，
              # 客户端点一下即可整块复制（tg_add_kv 是纯文本，只能手选）
              tg_add_path _m "API Key" "${ZCODE_GATEWAY_KEY:-未取到}"
              [ -n "${Z2A_SELFTEST_MODEL:-}" ] && tg_add_path _m "模型" "$Z2A_SELFTEST_MODEL"
              if [ -n "$Z2A_POOL_TEXT" ]; then
                tg_add_section _m "$Z2A_POOL_TITLE"
                tg_add_block _m "$Z2A_POOL_TEXT"
                _m+=$'\n'
              fi
              tg_add_path _m "代码" "$Z2A_REPO"
              # 用量 + 流水（看板独有，2026-10-05 补进 zcode 通知，与 wb/trae 同口径）：
              # 只渲染 zcode 自己的，调 board.py CLI 与看板共用渲染代码与数据源。
              _z2a_ul_block="$(python3 /dropbox/self-hosted/quota-board/board.py usage-ledger zcode 12 2>/dev/null || true)"
              # 2026-10-11 修复：此处变量是 _m（本分支消息变量），曾误写 _msg ——
              # _msg 在本 step 未定义，tg_append 的 ${!1} 间接展开撞 set -u 直接崩整 step
              # （run 38141881455 实锤：tg_notify.sh line 89: !1: unbound variable），
              # zcode2api 的「已就绪」通知自 2026-10-06 (a873e07) 起从未发出过。
              [ -n "$_z2a_ul_block" ] && tg_append _m "$_z2a_ul_block"
              tg_add_footer _m
              send_tg "$_m" alert || echo "::warning::TG 通知发送失败（不影响任务）"
            fi
          fi

      - name: Run autoclaw-proxy (AutoClaw 积分反代 · 多账号池)
        id: run_autoclaw
        # 2026-10-11 新增。qingyan-proxy 同款骨架：Dropbox 快照做票仓真源 → 无头刷新
        # → 起反代 → 端到端自检 → tailscale serve → TG 通知。与 qingyan 一样
        # continue-on-error + if:!cancelled()（避开前置失败级联跳过，见 Run OpenClaw 注释）。
        #
        # 来源模型（2026-10-12 起，主人拍板「代码走 GitHub、Dropbox 只存数据」）：
        #   - 代码真源 = github.com/jarvanh/autoclaw-proxy（私有仓库，M1–M6 整合版），
        #     git clone --depth 1 拉取（zcode2api 同款先例；runner 已 gh auth setup-git，
        #     私有仓可克隆，token 不落 remote）
        #   - Dropbox 只保留**数据**：auth-snapshot.json（票仓真源）+
        #     lifetime_stats.json（累计用量，唯一不可再生数据）。app/ 目录已下线。
        #
        # 凭据模型（与 qingyan 的轮换票同构）：
        #   - 账号票（access JWT 24h + refresh JWT 29d 可复用）由本机
        #     autoclaw_auth.py bootstrap 生成，快照存
        #     dropbox:self-hosted/autoclaw-proxy/auth-snapshot.json
        #   - runner 每轮 pull 快照 → refresh（剩余>6h 自动跳过）→ 新票**回推 Dropbox**
        #     （refresh token 未轮换时可复用，推送幂等；一旦上游开始轮换，推送就是
        #     持久化动作，漏推即丢票）—— 多实例并跑时以「最后写者胜」为准，openclaw
        #     singleton 并发组已保证同轮不重叠
        #   - 无快照 = 无凭据 → 本步骤跳过并告警（不起假服务）
        #
        # 契约要点（2026-10-11 实测定位的 406 闸门，全部已在 proxy.py 内对齐；
        # 2026-10-12 起 2.x 契约由 PROXY_CONTRACT=2x 开关提供，默认 1x 不变）：
        #   body 只发 max_completion_tokens(满额 307200)+store:false+reasoning_effort:high，
        #   max_tokens 字段出现即 406；system 必须精确等于官方 banner（1x）/ persona（2x）。
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 网关鉴权：autoclaw-proxy 专属 key（与 qingyan 同规：每反代独立 key，
          # 不共用 AI_GATEWAY_API_KEY；监听 127.0.0.1 + tailscale serve，key 为第二道边界）
          AUTOCLAW_GATEWAY_KEY: ${{ secrets.AUTOCLAW_GATEWAY_KEY }}
          # 代码真源（GitHub，私有仓库；zcode2api 同款 clone 先例）
          AUTOCLAW_REPO: https://github.com/jarvanh/autoclaw-proxy.git
          # 票仓与累计统计（Dropbox，只存数据不存代码）
          AUTOCLAW_SNAPSHOT_REMOTE: dropbox:self-hosted/autoclaw-proxy/auth-snapshot.json
          # 累计用量统计（唯一不可再生的运行数据，2026-10-12 主人拍板入 Dropbox）：
          # 启动时拉回续计，job 收尾回推；/tmp 清理不再丢
          AUTOCLAW_STATS_REMOTE: dropbox:self-hosted/autoclaw-proxy/lifetime_stats.json
          # 2026-10-11：8321 归 quota-board（qb 隧道源站），autoclaw 反代挪 8322
          AUTOCLAW_PORT: "8322"
        run: |
          set -uo pipefail
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"

          RUN_DIR="/tmp/local_autoclaw-proxy"
          AC_OK=0
          AC_REASON=""
          AC_ACCOUNTS=""
          AC_MODEL=""
          AC_SCORE=""

          # 0. 拉代码（GitHub，clone 到干净目录）+ 票仓快照（快照缺失 = 未导入凭据，直接跳过）
          rm -rf "$RUN_DIR"
          if ! git clone --quiet --depth 1 "$AUTOCLAW_REPO" "$RUN_DIR" || [ ! -f "$RUN_DIR/app/proxy.py" ]; then
            echo "::warning::[autoclaw] 代码克隆失败（$AUTOCLAW_REPO）"
            AC_REASON="代码克隆失败"
          elif ! rclone copyto "$AUTOCLAW_SNAPSHOT_REMOTE" "$RUN_DIR/snapshot.json" 2>/dev/null || [ ! -s "$RUN_DIR/snapshot.json" ]; then
            echo "::warning::[autoclaw] 无凭据快照（先在本机跑 autoclaw_auth.py bootstrap）"
            AC_REASON="未配置凭据快照"
          else
            AC_COMMIT="$(git -C "$RUN_DIR" rev-parse --short HEAD)"
            echo "代码: $AUTOCLAW_REPO @ $AC_COMMIT"
            # 累计统计拉回续计：Dropbox 有则覆盖本地（/tmp 重建后为空），无则从零起计
            rclone copyto "$AUTOCLAW_STATS_REMOTE" "$RUN_DIR/app/lifetime_stats.json" 2>/dev/null \
              && echo "lifetime_stats: 已从 Dropbox 拉回续计" \
              || echo "lifetime_stats: 无云端存档，从零起计"
            SNAP_ACCOUNTS="$(python3 -c "import json;print(len(json.load(open('$RUN_DIR/snapshot.json')).get('accounts',[])))" 2>/dev/null || echo 0)"
            if [ "${SNAP_ACCOUNTS:-0}" -eq 0 ]; then
              echo "::warning::[autoclaw] 快照为空（0 账号）"
              AC_REASON="快照无账号"
            else
              echo "快照账号数: $SNAP_ACCOUNTS"

              # 1. 无头刷新：剩余>6h 自动跳过；失败再 -f 强刷一次（406/网络抖动兜底）
              #    新票回写 snapshot 后立即回推 Dropbox（票持久化，见上方凭据模型）
              #
              #    ⚠️ AUTOCLAW_AUTH_EMIT_REFRESH=1（2026-10-12）：同时产出
              #    accounts.json.refresh（0600，含 refresh_token/device_id），
              #    这是 proxy 内 M3「现刷新票」的唯一原料。缺它时 M3 恒空转——
              #    一旦上游启用 access token「铸造时间」分钟级校验（switch 在
              #    2.0.2 网关实测过），静态票会 401 且**没有第二个号可换**时
              #    整个池子全 401（今天 07:02–07:53 就是这么熔断的）。
              if AUTOCLAW_AUTH_EMIT_REFRESH=1 python3 "$RUN_DIR/app/autoclaw_auth.py" refresh \
                   --snapshot "$RUN_DIR/snapshot.json" \
                   --accounts-out "$RUN_DIR/accounts.json"; then
                echo "refresh: 直刷通过"
              else
                echo "refresh: 直刷失败，尝试 -f 强刷"
                AUTOCLAW_AUTH_EMIT_REFRESH=1 python3 "$RUN_DIR/app/autoclaw_auth.py" refresh -f \
                  --snapshot "$RUN_DIR/snapshot.json" \
                  --accounts-out "$RUN_DIR/accounts.json" || true
              fi
              rclone copyto "$RUN_DIR/snapshot.json" "$AUTOCLAW_SNAPSHOT_REMOTE" \
                || echo "::warning::[autoclaw] 快照回推失败（票仍是可复用长票时无害；一旦上游轮换即丢票，需重新 bootstrap）"

              # 1.5 每日签到（daily_signin，+200 积分/账号/天；2026-10-11 新增）：
              #     复用 refresh 出的热票打 task 网关；幂等三重保障——本地状态当日
              #     跳过、上游 already_completed 不重复加分、-f 只在状态丢失时兜底。
              #     签到失败不影响反代启动（结果只进通知）。
              AC_CHECKIN=""
              # 脚本在 stdout 末尾打 "--- summary ---" 单行摘要（多账号明细同行），
              # awk 取分隔行之后的内容作为通知摘要；签到 rc=1（有账号失败）不阻断反代。
              CHECKIN_OUT="$(python3 "$RUN_DIR/app/autoclaw_auth.py" checkin \
                   --snapshot "$RUN_DIR/snapshot.json" \
                   --results-out "$RUN_DIR/checkin-results.json" 2>&1 || true)"
              AC_CHECKIN="$(printf '%s\n' "$CHECKIN_OUT" | awk 'f{print} /^--- summary ---$/{f=1}' | tail -n 1)"
              echo "签到: ${AC_CHECKIN:-（无摘要输出）}"

              # 1.6 积分收割（claim 全家桶：签到+灵感中心+新人任务+活动奖励；2026-10-12 新增）：
              #     签到之外的可领积分（灵感中心每日 200 为主）也要自动收干净。
              #     调度收敛到每日两个窗口：CST 9 点后首轮 + 21 点后首轮 —— 同时覆盖
              #     「UTC 零点重置（=08:00 CST）」与「CN 零点重置」两种上游口径。
              #     GitHub cron 常迟到/偶发跳轮，所以按「小时开窗 + 标记去重」而非
              #     精确分钟匹配；标记文件在 STATE_DIR（/tmp 之外），跨轮持久，
              #     VM 销毁后自动重新开窗。窗口内脚本硬崩（无 summary 行）不落标记，
              #     下轮自动重试；claim 幂等（上游 already/560118 不重复加分）。
              AC_CLAIM=""
              AC_CLAIM_TODAY="$(TZ=Asia/Shanghai date +%F)"
              AC_CLAIM_HOUR="$(TZ=Asia/Shanghai date +%H)"
              AC_CLAIM_MARK="$HOME/.config/autoclaw-auth/claim-marker.json"
              if [ "$AC_CLAIM_HOUR" -ge 9 ] 2>/dev/null || [ "$AC_CLAIM_HOUR" -le 3 ] 2>/dev/null; then
                AC_CLAIM_SLOT="am"
              fi
              if [ "$AC_CLAIM_HOUR" -ge 21 ] 2>/dev/null; then
                AC_CLAIM_SLOT="pm"
              fi
              if [ -n "${AC_CLAIM_SLOT:-}" ]; then
                # 单行 python -c（run: | 块内多行内嵌会破坏 YAML 块标量缩进）
                AC_CLAIM_DONE="$(python3 -c "import json,os;print(json.load(open('$AC_CLAIM_MARK')).get('$AC_CLAIM_SLOT','') if os.path.exists('$AC_CLAIM_MARK') else '')" 2>/dev/null)"
                if [ "$AC_CLAIM_DONE" != "$AC_CLAIM_TODAY" ]; then
                  CLAIM_OUT="$(python3 "$RUN_DIR/app/autoclaw_auth.py" claim \
                       --snapshot "$RUN_DIR/snapshot.json" 2>&1 || true)"
                  AC_CLAIM="$(printf '%s\n' "$CLAIM_OUT" | awk 'f{print} /^--- summary ---$/{f=1}' | tail -n 1)"
                  if [ -n "$AC_CLAIM" ]; then
                    python3 -c "import json,os,time;os.makedirs(os.path.dirname('$AC_CLAIM_MARK'),exist_ok=True);m=(json.load(open('$AC_CLAIM_MARK')) if os.path.exists('$AC_CLAIM_MARK') else {});m['$AC_CLAIM_SLOT']='$AC_CLAIM_TODAY';m['updated_at']=int(time.time());json.dump(m,open('$AC_CLAIM_MARK','w'))"
                  else
                    AC_CLAIM="已到收割窗口但未取到摘要（脚本报错？详见本轮 action 日志）"
                  fi
                  echo "claim: $AC_CLAIM"
                fi
              fi

              # 2. 托管起反代（2026-10-12 起 systemd --user，取代原 nohup 裸跑）
              #    旧方案：nohup 起的进程 PPID=1，~/.config/systemd/user 下无单元，
              #    本机重启/被收编即断连且无自愈（窗口期崩溃要等下一轮 run）。
              #    新方案与其他四网关同口径：services.sh ensure → 写单元(幂等)+restart，
              #    Restart=always 把崩溃自愈收敛到秒级。
              #
              #    与 qingyan 的差异：autoclaw 代码在 /tmp（每轮 clone 自 GitHub，真源不在
              #    本机），故 write_unit 用 AUTOCLAW_RUN_DIR 定位，且每轮 ensure 的 restart
              #    语义与原 nohup 的「每轮 pkill + 重启」完全一致。
              #
              #    绑定地址/鉴权 fail-closed 已移入单元：无 AUTOCLAW_GATEWAY_KEY 时
              #    write_unit 直接拒绝生成单元（比原来的「运行期降级回环」更严，不起假服务）。
              mkdir -p "$HOME/.openclaw-autoclaw"
              [ -f "$HOME/.openclaw-autoclaw/openclaw.json" ] \
                || cp "$RUN_DIR/app/openclaw.json" "$HOME/.openclaw-autoclaw/openclaw.json"
              AC_SERVICES="${GITHUB_WORKSPACE}/.github/scripts/services/services.sh"
              if [ -f "$AC_SERVICES" ]; then
                AUTOCLAW_RUN_DIR="$RUN_DIR" bash "$AC_SERVICES" ensure autoclaw || \
                  echo "::warning::[autoclaw] systemd 托管失败（见 services 日志），自检将判定未就绪"
              else
                echo "::error::[autoclaw] services.sh 缺失，无法托管"
              fi
              # 就绪等待：systemd active ≠ 端口已监听（绑定失败会 active 后秒退），故仍以端口为准。
              for _ in $(seq 1 30); do
                code="$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' "http://127.0.0.1:${AUTOCLAW_PORT}/v1/models" 2>/dev/null || true)"
                [ -n "$code" ] && [ "$code" != "000" ] && break
                sleep 2
              done

              # 3. 端到端自检：真发消息（healthz 通≠上游通，zcode2api 同款原则）。
              #    失败分诊：quota=上游限流（服务本体健康）· auth=票无效 · unavailable=其他
              AC_PROBE="$(curl -sS --max-time 120 -X POST "http://127.0.0.1:${AUTOCLAW_PORT}/v1/chat/completions" \
                -H "Authorization: Bearer ${AUTOCLAW_GATEWAY_KEY}" \
                -H 'content-type: application/json' \
                -d '{"model":"zai_glm-5.3-flash","messages":[{"role":"user","content":"只回复两个字：正常"}],"max_tokens":256}' 2>&1 || true)"
              if printf '%s' "$AC_PROBE" | jq -e '(.choices // [] | length) > 0' >/dev/null 2>&1; then
                AC_OK=1
                AC_REASON="端到端自检通过"
                AC_MODEL="zai_auto · zai_glm-5.3-flash · zaicoding_glm-5.3"
                # ⚠️ 2026-10-12 修正：积分/钱包字段**只在 /v1/health**，/healthz 的
                # 响应体顶层根本没有 wallet/subscription 键（实测对比两端口字段：
                # healthz=[ok,uptime,upstream,token,models,...]，v1/health=[...,wallet,
                # subscription,...]）。此前这里打 /healthz 取 .wallet，jq 恒落空 →
                # AC_SCORE 永远为空 → 通知的账号池子行没有积分包信息（主人反馈）。
                AC_HEALTH="$(curl -s --max-time 5 -H "Authorization: Bearer ${AUTOCLAW_GATEWAY_KEY}" \
                  "http://127.0.0.1:${AUTOCLAW_PORT}/v1/health" 2>/dev/null || true)"
                AC_ACCOUNTS="$(printf '%s' "$AC_HEALTH" | jq -r '.accounts.count // "?"' 2>/dev/null || echo '?')"
                # 积分包：总余额 + 即将到期（有账号级明细时一并带上，与 qingyan 的
                # 「💳 积分」同口径：真有才显示，取不到就整段省略不谎报 0）。
                AC_SCORE="$(printf '%s' "$AC_HEALTH" | jq -r '.wallet | select(.available) \
                  | "总余额 \(.total_balance) · 即将到期 \(.expiring.points // 0)"' 2>/dev/null || true)"
                # 钱包取不到时**必须留痕**（主人 2026-10-12 反馈「没有积分包过期时间」）：
                # 可用性判定落在 .wallet.available，上游返回 410000「用户未登录」时
                # 该值为 false —— 此时若不展示原因，通知里这一行就是凭空消失，
                # 读者无法区分「没配这个字段」和「上游没给数据」。
                if [ -z "${AC_SCORE:-}" ]; then
                  AC_SCORE="$(printf '%s' "$AC_HEALTH" | jq -r '.wallet | select(.available == false) \
                    | "积分包未取到 · \(.error // "原因未知")"' 2>/dev/null || true)"
                fi
                # 票有效期：credential.expired 为 true 时不显示剩余秒数（负值无意义）
                AC_TOKEN_EXP="$(printf '%s' "$AC_HEALTH" | jq -r '.credential \
                  | select(.present) | if .expired then "票已过期" \
                    else "票有效 · 剩余 \((.expires_in_seconds // 0) / 3600 | floor) 小时" end' 2>/dev/null || true)"
              elif printf '%s' "$AC_PROBE" | grep -qE '401|authentication'; then
                AC_REASON="自检失败：账号凭据无效（401）—— 票已过期且 refresh 失败，需本机重新 bootstrap"
              elif printf '%s' "$AC_PROBE" | grep -qE '406|upstream_throttled|繁忙'; then
                AC_REASON="自检失败：上游限流/限载（406/503）—— 服务本体健康，下轮重试"
              else
                AC_REASON="自检失败：$(printf '%s' "$AC_PROBE" | head -c 120)"
              fi
            fi
          fi

          # 4. tailscale serve（复用「HTTP 明文 + WireGuard 隧道」既有口径；serve 态
          #    随内存 state 逐轮清零，幂等重建）
          # ⚠️ 2026-10-19 修死链：面板路由原来整段挂在 $AC_OK 上，而 AC_OK 是
          # **端到端自检**结论 —— 上游限流/限载（406/503）会让自检失败，但服务本身
          # 健康、端口在听。此时 8083 不建，看板 admin_entries 第 4 项就成了死链
          # （实测 HTTP 000，主人 2026-10-19 反馈）。故面板与 API 入口拆开：
          # 面板/API serve 只看**端口是否在听**，与自检结论解耦。
          if [ -n "${TS_FQDN:-}" ] && curl -s --max-time 3 -o /dev/null "http://127.0.0.1:${AUTOCLAW_PORT}/v1/models" 2>/dev/null; then
            sudo tailscale serve --bg --http=8321 "http://127.0.0.1:${AUTOCLAW_PORT}" 2>/dev/null \
              && echo "autoclaw 反代: http://${TS_FQDN}:8321/v1"
            # 内置状态面板（/dashboard | / | /ui 均同一页）：2026-10-13 补。
            # 端口 8083 —— 延续后台端口段（trae 8080 / zcode 8081 / wb 8082），
            # 看板 admin_entries 第 4 项指的就是这个地址，两者必须一致。
            # 该面板免鉴权（实测无 key 即 200），收敛靠 tailscale 内网；
            # 主人 2026-10-13 明确「不要密码」，故不加 key 参数。
            sudo tailscale serve --bg --http=8083 "http://127.0.0.1:${AUTOCLAW_PORT}" 2>/dev/null \
              && echo "autoclaw 控制台: http://${TS_FQDN}:8083/"
          elif [ -z "${TS_FQDN:-}" ]; then
            echo "⚠️ autoclaw serve 跳过：TS_FQDN 为空"
          else
            echo "⚠️ autoclaw 端口 ${AUTOCLAW_PORT} 未监听，跳过 serve（面板将不可达）"
          fi

          # 5. TG 通知（版式对齐 qingyan/zcode2api：失败走 alert 档）
          _m=""
          if [ "$AC_OK" != "1" ]; then
            tg_add_title _m "❌ autoclaw-proxy 启动失败"
            tg_add_kv _m "结论" "未就绪"
            tg_add_kv _m "原因" "$AC_REASON"
            tg_add_kv _m "处理" "本机 clone jarvanh/autoclaw-proxy 后跑 python3 app/autoclaw_auth.py bootstrap（桌面端加 --inspect=9229）"
            tg_add_footer _m
            send_tg "$_m" alert || echo "::warning::TG 通知发送失败（不影响任务）"
          else
            # 2026-10-11 标题对齐全库网关就绪约定：🟢（对齐 workbuddy/zcode2api/trae/Runner，见 docs/telegram-notify.md）；原 ✅ 是照抄 qingyan 骨架带进来的游离用法
            tg_add_title _m "🟢 autoclaw-proxy 已就绪"
            tg_add_kv _m "结论" "$AC_REASON"
            tg_add_path _m "数据目录" "/tmp/local_autoclaw-proxy"
            tg_add_path _m "代码" "$AUTOCLAW_REPO @ $AC_COMMIT"
            tg_add_path _m "接口" "http://127.0.0.1:${AUTOCLAW_PORT}/v1"
            tg_add_path _m "API Key" "${AUTOCLAW_GATEWAY_KEY:-未取到}"
            # 信息层面对齐 wb_notify（主人 2026-10-11 要求）：数据目录 + 代码来源。
            # 数据目录是「这条通知说的是哪台机/哪份数据」的定位信息（主人 10-06 定的
            # 头部定位口径）；代码真源已迁 GitHub（2026-10-12，Dropbox 只存数据）。
            if [ -n "$AC_ACCOUNTS" ] && [ "$AC_ACCOUNTS" != "?" ]; then
              tg_add_section _m "💳 账号池 · 1"
              _ac_rows="$(tree_conn 1)$(tg_entry "账号数 ${AC_ACCOUNTS}" "负载均衡 · 401/406 冷却回退 · 快过期积分优先")"$'\n'
              # 积分包信息（主人 2026-10-12 要求：对齐 workbuddy 的「积分有效期」口径）
              [ -n "${AC_SCORE:-}" ] && _ac_rows+="$(tree_sub 1)$(escape_html "$AC_SCORE")"$'\n'
              [ -n "${AC_TOKEN_EXP:-}" ] && _ac_rows+="$(tree_sub 1)$(escape_html "$AC_TOKEN_EXP")"$'\n'
              tg_add_block _m "${_ac_rows%$'\n'}"
            fi
            # 每日签到结果（独立分节；含 +积分 明细）
            if [ -n "${AC_CHECKIN:-}" ]; then
              tg_add_section _m "📅 每日签到 · 1"
              tg_add_block _m "$(tree_lines "结果：<code>$(escape_html "$AC_CHECKIN")</code>")"
            else
              # 签到段缺席必须留痕（主人 2026-10-12 反馈「没有签到信息」）：
              # 此前 checkin 因传入不支持的 --accounts-out 参数直接 argparse exit 2，
              # 摘要恒为空 → 整段静默消失，看通知的人无从判断是「没跑」还是「跑了没输出」。
              tg_add_section _m "📅 每日签到 · 1"
              tg_add_block _m "$(tree_lines "结果：<code>未取到签到摘要（本轮未执行或脚本报错）</code>")"
            fi
            # 积分收割（claim 全家桶）：只在收割窗口轮展示（每日两轮，见 1.6 注释）；
            # 非窗口轮不渲染此节，避免每 5 分钟通知重复「全部已领」的噪音。
            if [ -n "${AC_CLAIM:-}" ]; then
              tg_add_section _m "🌾 积分收割 · 1"
              tg_add_block _m "$(tree_lines "结果：<code>$(escape_html "$AC_CLAIM")</code>")"
            fi
            # 用量 + 流水（信息层面对齐 wb/zcode 通知，主人 2026-10-11 要求）：
            # 调 board.py CLI 与看板共用渲染代码；autoclaw 走 lifetime 累计特例，
            # 无数据时输出空串静默跳过（与 wb/zcode 同口径）。
            _ac_ul_block="$(python3 /dropbox/self-hosted/quota-board/board.py usage-ledger autoclaw 12 2>/dev/null || true)"
            [ -n "$_ac_ul_block" ] && tg_append _m "$_ac_ul_block"
            tg_add_footer _m
            send_tg "$_m" alert || echo "::warning::TG 通知发送失败（不影响任务）"
          fi
          exit 0

      - name: Run qingyan-proxy (ChatGLM 清言反代)
        id: run_qingyan
        # 2026-10-22 步骤重排后位于 Run OpenClaw 之后：本步失败不得级联跳过
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          # send_tg 发送闸 + 收尾区接线（缺任一则本步骤通知静默跳过）
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 凭据：清言账号的 chatglm_refresh_token。只从 Secrets 注入环境变量，
          # 不落仓库、不回显；部署脚本写进运行目录 env.sh（600）供服务读取。
          # 上游 refresh 是轮换式（旧票立即作废），本值只作首轮种子，之后以
          # 数据目录里轮换出的新票为准 —— 故 data/ 必须随 Dropbox 跨轮持久化。
          QINGYAN_REFRESH_TOKEN: ${{ secrets.GLM_REFRESH_TOKEN }}
          # 网关鉴权：本网关专属 key（不共用 AI_GATEWAY_API_KEY —— 每个反代各有
          # 自己的 key，避免一把泄露波及全部）。监听已改 0.0.0.0，这是唯一的
          # 安全边界；部署脚本写进 env.sh 的 PROXY_API_KEY，缺值直接拒绝启动。
          QINGYAN_GATEWAY_KEY: ${{ secrets.GLM2API_GATEWAY_KEY }}
          QINGYAN_PORT: "8320"
          # 代码源（Dropbox 侧）：项目在本机 ~/AI/qingyan-proxy（非 git 仓库），
          # 经 rclone 存到该远端，每轮 prepare 校验真源在位。
          QINGYAN_APP_REMOTE: dropbox:self-hosted/qingyan-proxy/app
          # 持久化（2026-10-06 起）：qingyan 全面直写 Dropbox（代码/数据/凭据/日志），
          # DATA_DIR 同时是积分快照落点（STATE_DIR 指向它），不再有 pull/push 往返。
          QINGYAN_DATA_DIR: /dropbox/self-hosted/qingyan-proxy/data
          QINGYAN_STATE_DIR: /dropbox/self-hosted/qingyan-proxy/data
          QINGYAN_ENV_FILE: /dropbox/self-hosted/qingyan-proxy/env.sh
          # 注：不再有 QINGYAN_RUN_DIR —— 2026-10-06 起 qingyan 全面直跑
          # Dropbox 真源（代码/数据/凭据/日志），不存在 /tmp 运行副本。
        run: |
          set -uo pipefail
          # 通知真源在 step 顶层 source 一次（勿挪进函数体，理由见 workbuddy 步骤同名注释 / 规范 4.4）
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"

          DEPLOY="${GITHUB_WORKSPACE}/.github/scripts/services/qingyan_deploy.sh"
          SERVICES="${GITHUB_WORKSPACE}/.github/scripts/services/services.sh"
          QUOTA="${GITHUB_WORKSPACE}/.github/scripts/services/qingyan_quota.sh"
          GL_OK=0
          GL_REASON=""

          # 凭据缺失直接跳过本步骤（不部署无凭据服务）：拿不到账号积分，
          # 且限流严重，起了也是假象。判空不判内容——内容有效性交给后面的自检。
          if [ -z "${QINGYAN_REFRESH_TOKEN:-}" ]; then
            echo "::warning::[qingyan] 未配置 Secret GLM_REFRESH_TOKEN，跳过部署"
            GL_REASON="未配置 Secret GLM_REFRESH_TOKEN"
            _m=""
            tg_add_title _m "⏭️ qingyan-proxy 已跳过"
            tg_add_kv _m "结论" "未部署"
            tg_add_kv _m "原因" "$GL_REASON"
            tg_add_kv _m "如何配置" "仓库 Settings → Secrets → 新增 GLM_REFRESH_TOKEN（取法见脚本 login 指引）"
            tg_add_footer _m
            send_tg "$_m" || echo "::warning::TG 通知发送失败（不影响任务）"
            exit 0
          fi

          # 1. 准备运行目录（校验 Dropbox 真源在位 + 写 env.sh）
          if bash "$DEPLOY" prepare; then
            # 2. 托管：systemd --user + Restart=always（窗口期崩溃秒级自愈，见 services.sh 文件头）
            bash "$SERVICES" ensure qingyan || true
            GL_UP=0
            for _ in $(seq 1 60); do
              if bash "$DEPLOY" status >/dev/null 2>&1; then GL_UP=1; break; fi
              sleep 1
            done
            if [ "$GL_UP" != "1" ]; then
              GL_REASON="服务未在 60 秒内监听 ${QINGYAN_PORT}（见日志尾部）"
            else
              # 3. 端到端自检：两个模型各发一条，都返回助手内容才算就绪
              # 2026-10-22 限时（下线优化）：实测该自检曾在 glm-5.3 通过后静默 203s
              # 才等到 glm-5.3-flash（上游慢/重试），把启动链整段拖住。自检只是
              # 「就绪度播报」，不参与服务可用性判定 → 90s 封顶，超时按未通过记录。
              if timeout 90 bash "$DEPLOY" selftest; then
                GL_OK=1
                GL_REASON="GLM-5.3 与 GLM-5.3-Flash 自检均通过"
              else
                GL_REASON="服务已监听但自检未通过（见日志尾部）"
              fi
            fi
          else
            GL_REASON="运行目录准备失败（见日志尾部）"
          fi

          # 积分采集（供「💳 积分」分节）：放在自检之后——上游结算有几秒延迟，
          # 紧贴调用前后读会读到「没变」。采集失败只让通知少一节，不改变就绪结论。
          GL_SCORE=""
          GL_SCORE_RULE=""
          GL_ROUND_DELTA=""
          GL_DAY_TOTAL=""
          GL_SOONEST=""
          GL_SOONEST_AMT=""
          GL_SOON_EXPIRE=""
          if [ "$GL_OK" = "1" ]; then
            # 快照由 QUOTA delta 直接写进 QINGYAN_STATE_DIR（= Dropbox 数据目录，
            # 直写真源）。缺失即首轮，delta 会自动按 0 起算。
            if GLQ="$(bash "$QUOTA" fetch)"; then
              GL_SCORE="$(printf '%s' "$GLQ" | cut -f1)"
              GL_SCORE_RULE="$(printf '%s' "$GLQ" | cut -f2)"
              GL_SOONEST="$(printf '%s' "$GLQ" | cut -f3)"
              GL_SOONEST_AMT="$(printf '%s' "$GLQ" | cut -f4)"
              GL_SOON_EXPIRE="$(printf '%s' "$GLQ" | cut -f5)"
              # 第 2/3 参（2026-10-09 加）：把 fetch 拿到的「最近到期 / 24h 将过期」
              # 一并交给 delta 落进快照 —— 此前快照只存 date/score/day_total，
              # quota-board 想显示「即将过期」根本没有数据源。
              # 快照直写 QINGYAN_STATE_DIR（Dropbox 真源），无需回推。
              if GLD="$(bash "$QUOTA" delta "$GL_SCORE" "$GL_SOONEST" "$GL_SOON_EXPIRE")"; then
                GL_ROUND_DELTA="$(printf '%s' "$GLD" | cut -f1)"
                GL_DAY_TOTAL="$(printf '%s' "$GLD" | cut -f2)"
              fi
            else
              echo "::warning::[qingyan] 积分采集失败，通知将省略积分分节"
            fi
          fi

          if [ "$GL_OK" != "1" ]; then
            _m=""
            tg_add_title _m "❌ qingyan-proxy 启动失败"
            tg_add_kv _m "结论" "未就绪"
            tg_add_path _m "端口" "$QINGYAN_PORT"
            tg_add_kv _m "原因" "$GL_REASON"
            tg_add_path _m "运行目录" "/dropbox/self-hosted/qingyan-proxy/app"
            tg_add_path _m "日志" "/dropbox/self-hosted/qingyan-proxy/logs/qingyan.log"
            tg_add_footer _m
            send_tg "$_m" alert || echo "::warning::TG 通知发送失败（不影响任务）"
          else
            _m=""
            # 2026-10-11 标题对齐全库网关就绪约定：🟢（对齐 workbuddy/zcode2api/trae/Runner，见 docs/telegram-notify.md）
            tg_add_title _m "🟢 qingyan-proxy 已就绪"
            tg_add_kv _m "结论" "$GL_REASON"
            tg_add_path _m "运行目录" "/dropbox/self-hosted/qingyan-proxy/app"
            tg_add_path _m "日志" "/dropbox/self-hosted/qingyan-proxy/logs/qingyan.log"
            tg_add_path _m "代码" "dropbox:self-hosted/qingyan-proxy/app"
            tg_add_path _m "接口" "http://127.0.0.1:${QINGYAN_PORT}/v1"
            # 标签「API Key」+ tg_add_path：对齐 zcode2api 就绪通知同款 —— 值走
            # <code> 等宽，客户端点一下即可整块复制。监听已改 0.0.0.0，key 是唯一
            # 安全边界，通知里给主人一份便于配置客户端（与 8319 的处理一致）。
            tg_add_path _m "API Key" "${QINGYAN_GATEWAY_KEY:-未取到}"
            tg_add_path _m "模型" "glm-5.3 · glm-5.3-flash"
            tg_add_kv _m "计费" "默认通道不扣积分；-agent 后缀走 AgentMore 才扣"
            # 信息层面对齐 wb_notify（主人 2026-10-11 要求）：运行目录 + 日志 + 代码来源。
            # 与下方失败分支同口径；代码真源在 Dropbox（qingyan_deploy.sh 每轮 pull）。

            # 💳 积分分节（版式对齐 zcode2api 的「💳 账号池」：条目行 = 主值 + 状态，
            # 子行 = 明细）。只在采集成功时出现——接口失败时什么都不说，
            # 不把「没取到」谎报成「余额 0」。
            if [ -n "${GL_SCORE:-}" ]; then
              tg_add_section _m "💳 积分 · 1"
              # 单条目结构：条目行手拼 tree_conn、子行手拼 tree_sub。
              # 不能用 tree_lines —— 它把每行都当兄弟条目，子行会被渲染成 ├─/└─
              # 与条目平级（规范 · 二层列表要求子行与条目正文同列）。
              _gl_rows=""
              _gl_rows+="$(tree_conn 1)$(tg_entry "$(printf '%s' "$GL_SCORE")" "今日已消耗 $(printf '%s' "$GL_DAY_TOTAL")")"$'\n'
              [ -n "${GL_ROUND_DELTA:-}" ] && _gl_rows+="$(tree_sub 1)$(escape_html "本轮消耗 ${GL_ROUND_DELTA}（自检产生）")"$'\n'
              # 到期：最近一批 + 7 天内将过期的总额。「-」表示没有带有效期的入账，
              # 此时整行省略——不把「没取到」渲染成「00-00 到期」。
              if [ -n "${GL_SOONEST:-}" ] && [ "$GL_SOONEST" != "-" ]; then
                if [ -n "${GL_SOON_EXPIRE:-}" ] && [ "$GL_SOON_EXPIRE" != "0" ]; then
                  _gl_rows+="$(tree_sub 1)$(escape_html "最近到期 ${GL_SOONEST}（该批 ${GL_SOONEST_AMT}）· 7 天内将过期 ${GL_SOON_EXPIRE}")"$'\n'
                else
                  _gl_rows+="$(tree_sub 1)$(escape_html "最近到期 ${GL_SOONEST}（该批 ${GL_SOONEST_AMT}）")"$'\n'
                fi
              fi
              [ -n "${GL_SCORE_RULE:-}" ] && _gl_rows+="$(tree_sub 1)$(escape_html "${GL_SCORE_RULE}")"$'\n'
              tg_add_block _m "${_gl_rows%$'\n'}"
            fi
            # 用量 + 流水（信息层面对齐 wb/zcode 通知，主人 2026-10-11 要求）：
            # 调 board.py CLI 与看板共用渲染代码；qingyan 走访问日志+快照特例，
            # 无数据时输出空串静默跳过（与 wb/zcode 同口径）。
            _qy_ul_block="$(python3 /dropbox/self-hosted/quota-board/board.py usage-ledger qingyan 12 2>/dev/null || true)"
            [ -n "$_qy_ul_block" ] && tg_append _m "$_qy_ul_block"
            tg_add_footer _m
            send_tg "$_m" alert || echo "::warning::TG 通知发送失败（不影响任务）"
          fi

      - name: Notify Tailscale SSH entry
        if: ${{ always() && steps.ts_ssh.outcome == 'success' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 收尾区接线由 env 注入（此前是写进 ts.env 再由脚本前缀传参）
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # runner 就绪后推送 SSH 入口 + 当前生效 AI 网关；通知失败不影响主流程
          # 注：本步骤位于 AI 网关启动步骤之后，以便读取 /tmp/active-ai-backend.env
          . "$HOME/ts.env"

          # 获取 runner 出口 IP 信息（IP/ISP/ASN/ASN 组织/位置）；失败不影响主流程
          IP_INFO="$(curl -fsS --max-time 10 'https://ipwho.is/' 2>/dev/null || true)"
          [ -z "${IP_INFO}" ] && IP_INFO='{}'
          PUB_IP="$(printf '%s' "${IP_INFO}" | jq -r '.ip // ""')"
          IP_ISP="$(printf '%s' "${IP_INFO}" | jq -r '.connection.isp // ""')"
          IP_ASN="$(printf '%s' "${IP_INFO}" | jq -r '.connection.asn // ""')"
          IP_ORG="$(printf '%s' "${IP_INFO}" | jq -r '.connection.org // ""')"
          IP_LOC="$(printf '%s' "${IP_INFO}" | jq -r '[.city, .region, (.country_code // .country)] | map(select(. != null and . != "")) | join(", ")')"
          PUB_IP="${PUB_IP:-未知}"; IP_ISP="${IP_ISP:-未知}"; IP_ASN="${IP_ASN:-}"; IP_ORG="${IP_ORG:-未知}"; IP_LOC="${IP_LOC:-未知}"

          # 当前生效 AI 网关 + 回退原因（状态文件由 AI 网关启动步骤写入）
          AI_BACKEND="omniroute"
          AI_FALLBACK_REASON=""
          if [ -f /tmp/active-ai-backend.env ]; then
            AI_BACKEND=$(grep '^ACTIVE_BACKEND=' /tmp/active-ai-backend.env | tail -n 1 | cut -d= -f2- || true)
            AI_FALLBACK_REASON=$(grep '^FALLBACK_REASON=' /tmp/active-ai-backend.env | tail -n 1 | cut -d= -f2- || true)
          fi
          AI_BACKEND="${AI_BACKEND:-omniroute}"

          # 恢复来源（2026-10-23）：主包正常时不必提示；用了历史 revision 必须
          # 告知是哪个版本、创建于何时 —— 否则「悄悄回退」看起来像正常启动。
          RESTORE_SOURCE=""
          RESTORE_REV=""
          RESTORE_REV_TIME=""
          RESTORE_REV_TIME_LOCAL=""
          RESTORE_REV_TIME_UTC=""
          if [ -f /tmp/openclaw-restore-meta.env ]; then
            RESTORE_SOURCE=$(grep '^OPENCLAW_RESTORE_SOURCE=' /tmp/openclaw-restore-meta.env | tail -n 1 | cut -d= -f2- || true)
            RESTORE_REV=$(grep '^OPENCLAW_RESTORE_REV=' /tmp/openclaw-restore-meta.env | tail -n 1 | cut -d= -f2- || true)
            RESTORE_REV_TIME=$(grep '^OPENCLAW_RESTORE_REV_TIME=' /tmp/openclaw-restore-meta.env | tail -n 1 | cut -d= -f2- || true)
          fi
          if [ -n "$RESTORE_REV_TIME" ]; then
            RESTORE_REV_TIME_LOCAL=$(TZ=Asia/Shanghai date -d "$RESTORE_REV_TIME" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || true)
            RESTORE_REV_TIME_UTC=$(TZ=UTC date -d "$RESTORE_REV_TIME" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || true)
          fi

          # 统一 HTML 通知 + 统一收尾区（tg_notify.sh，checkout 后可用）。
          # TG_RUN_URL 由本 step 的 env 注入，tg_add_footer 直接读取；时长走开机时刻兜底。
          # 版式与 tailscale-windows.yml "🟢 Windows runner 已就绪" 同款：
          # 按套分节（规范 · 凭据与入口：多套同类信息各占一分节）+ 组内树形条目，凭据/网络/出口/AI 网关
          # 各归其节，避免一级平铺 10 行 kv 混排
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"
          msg=""
          tg_add_title msg "🟢 OpenClaw Runner 已就绪"

          _entries="命令：<code>ssh runner@$(escape_html "${TS_HOST}")</code>"
          _entries+=$'\n'"备用 IP：<code>$(escape_html "${TS_IP}")</code>"
          _entries+=$'\n'"文件管理：<code>sftp://runner@$(escape_html "${TS_HOST}")/</code>"
          # 列表分节带计数（与 tailscale-windows / AI 网关同款；此前四节形态不一）
          tg_add_section msg "🔐 SSH · $(printf '%s' "$_entries" | grep -c .)"
          tg_add_block msg "$(tree_lines "$_entries")"

          if [ -n "${TS_FQDN:-}" ]; then
            tg_add_section msg "🖥️ RustDesk · 1"
            tg_add_block msg "$(tree_lines "直连：<code>$(escape_html "${TS_FQDN}"):21118</code>")"
          fi

          # 取值行口径（规范 · 取值行口径）：一次 ipwho.is 返回的 IP/ISP/ASN/位置 都是机器返回值，
          # 整节同为 <code>；按「值不值得复制」逐个判断会产出等宽/正体交错的斑马纹
          _entries="出口 IP：<code>$(escape_html "${PUB_IP}")</code>"
          _entries+=$'\n'"ISP：<code>$(escape_html "${IP_ISP}")</code>"
          _entries+=$'\n'"ASN：<code>$(escape_html "AS${IP_ASN} · ${IP_ORG}")</code>"
          _entries+=$'\n'"位置：<code>$(escape_html "${IP_LOC}")</code>"
          tg_add_section msg "🌐 出口网络 · $(printf '%s' "$_entries" | grep -c .)"
          tg_add_block msg "$(tree_lines "$_entries")"

          _entries="管理页批准：<code>admin/machines → openclaw → Edit routes → 勾选 Exit Node</code>"
          _entries+=$'\n'"ACL 免批准（推荐）：<code>routes 0.0.0.0/0,::/0 → tag:ci</code> · 免每次批准"
          _entries+=$'\n'"API：<code>POST /api/v2/device/{device_id}/routes</code>"
          tg_add_section msg "🛰️ 出口节点 · $(printf '%s' "$_entries" | grep -c .)"
          tg_add_block msg "$(tree_lines "$_entries")"
          # 「状态」是自然语言结论 → 说明段，留在取值行里会变成 code/裸交错（规范 · 取值行口径）
          tg_add_note msg "状态：已广播 · 可作为出口节点"

          # 三后端显示映射（2026-10-11 恢复自动降级）：主用 omniroute，降级链 clirelay/cliproxyapi
          case "$AI_BACKEND" in
            omniroute)   _ai_backend="OmniRoute";    _ai_state="主用" ;;
            clirelay)    _ai_backend="CliRelay";     _ai_state="⚠️ 已降级 · 回退后端" ;;
            cliproxyapi) _ai_backend="CLIProxyAPI";  _ai_state="⚠️ 已降级 · 末级回退" ;;
            *)           _ai_backend="$AI_BACKEND";  _ai_state="状态未知" ;;
          esac
          # 后端**标识**是机器值 → <code>；「主用」是自然语言结论 → 裸文本。
          # 此前二者拼成一个串整段套 <code>，等于让自然语言冒充机器值（规范 · 取值行口径）
          tg_add_section msg "🤖 AI 网关 · 1"
          tg_add_block msg "$(tree_lines "后端：<code>$(escape_html "${_ai_backend}")</code> · $(escape_html "${_ai_state}")")"
          if [ -n "$AI_FALLBACK_REASON" ]; then
            tg_add_note msg "回退原因：${AI_FALLBACK_REASON}"
          fi
          # 用了历史 revision 才提示（主包正常时不制造噪音）；同时给出 UTC+8 与 UTC，
          # 方便对照 run 时间与 Dropbox 版本时间。
          if [ "$RESTORE_SOURCE" = "revision" ]; then
            _rev_time_display="${RESTORE_REV_TIME:-未知}"
            if [ -n "$RESTORE_REV_TIME_LOCAL" ] && [ -n "$RESTORE_REV_TIME_UTC" ]; then
              _rev_time_display="${RESTORE_REV_TIME_LOCAL}（UTC+8） · ${RESTORE_REV_TIME_UTC} UTC"
            fi
            _entries="来源：<code>历史 revision $(escape_html "${RESTORE_REV:-未知}")</code>"
            _entries+=$'\n'"创建时间：<code>$(escape_html "${_rev_time_display}")</code>"
            tg_add_section msg "📦 状态恢复 · 2"
            tg_add_block msg "$(tree_lines "$_entries")"
            tg_add_note msg "说明：云端主包本轮不可用，已回退到历史版本。"
          fi
          # footer 读 TG_RUN_URL（由本 step 的 env 注入），时长走开机时刻兜底
          tg_add_footer msg
          # 走发送层而非 curl 直发：429 重试已内建，HTML 解析失败直接报错（规范 · 发送层），
          # 429 限流按 retry_after 等待重试，disable_web_page_preview 内置
          send_tg "$msg" alert || true
          echo "已推送 SSH 入口通知: ssh runner@${TS_HOST}（AI 网关: ${AI_BACKEND}）"


      - name: Notify Tailscale entry failure
        # 2026-10-23：Tailscale 链任一环节失败都要出声。此前只有成功通知，
        # run 39858698391 的 Setup Tailscale 失败后完全静默。
        if: ${{ always() && (steps.ts_daemon.outcome == 'failure' || steps.ts.outcome == 'failure' || steps.ts_ssh.outcome == 'failure') }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"
            msg=""
            tg_add_title msg "⚠️ Tailscale SSH 入口设置失败"
            tg_add_path msg "Run ID" "${{ github.run_id }}"
            tg_add_kv msg "影响" "本轮无 SSH 调试入口；OpenClaw 主流程不受影响"
            tg_add_note msg "排查：查看 Actions 日志中「Tailscale daemon 纳管」与「Setup Tailscale」两步。"
            tg_add_footer msg
            send_tg "$msg" alert || true
          fi


      - name: Start background archive loop
        env:
          # send_telegram_alert 以这两个变量为发送闸，缺任一即静默跳过
          # （2026-09-05 复审发现：此前本 step 未注入，约 5 处归档告警从未发出）
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 收尾区接线（规范 · 收尾区）：只需注入 TG_RUN_URL，缺了收尾区就没有日志入口；
          # 时长由 tg_add_footer 内的 runner 开机时刻兜底
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # 预检失败（Dropbox 配额不足）时不启动归档循环：对满额远端每 20 分钟
        # 打一轮失败告警纯属噪音，等空间腾出后的下一轮再正常托管。
        if: ${{ always() && steps.dropbox_preflight.conclusion != 'failure' }}
        run: |
          echo "Starting background archive tasks: archive ~/.openclaw every 20 minutes; OmniRoute data is archived periodically and at final shutdown..."
          cat > /tmp/create-openclaw-archive.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          OUTPUT_TAR="${1:-}"
          if [ -z "$OUTPUT_TAR" ]; then
            echo "Usage: $0 /path/to/output.tar.gz" >&2
            exit 2
          fi

          # 2026-10-23 流式污染修复：OUTPUT_TAR="-" 时 stdout 是**数据通道**，
          # 任何日志行混进去都会让云端包变成「明文头 + gzip 流」的坏包 ——
          # run 39894704352 的 revision 65e74a9 首行正是 openclaw_archive_timing…，
          # 恢复侧解包必失败。把原始 stdout 挪到 fd 3，其余输出统一走 stderr，
          # tar 流只写 fd 3（见下方流式分支）。
          if [ "$OUTPUT_TAR" = "-" ]; then
            exec 3>&1 1>&2
          fi

          # 2026-10-02 二次事故：5KB 下限形同虚设（98KB 空壳轻松过线并覆盖云端主包）。
          # 真实主包 GB 级；50MB 绝对下限不与历史包比较（2026-09-12 的教训：比较式
          # 体积门会被主动瘦身永久卡死），只拦「数量级不对」的包。
          MIN_SIZE=$((50 * 1024 * 1024))
          SRC_DIR="/home/runner/.openclaw"
          STAGE_DIR=""
          KEEP_DIR=""

          cleanup() {
            if [ -n "${STAGE_DIR:-}" ] && [ -d "$STAGE_DIR" ]; then
              rm -rf "$STAGE_DIR"
            fi
            if [ -n "${KEEP_DIR:-}" ] && [ -d "$KEEP_DIR" ]; then
              rm -rf "$KEEP_DIR"
            fi
          }
          trap cleanup EXIT

          # 关键文件必须是「可解析的完整 JSON」：0 字节（截断写入途中）与半截
          # 写入（写了一半被扫到）都要判否，只有 -s 是不够的。jq 不可用则回退
          # python3，都没有才退化成只看非空（最弱判据，但优于不判）。
          json_ok() {
            if command -v jq >/dev/null 2>&1; then
              jq empty "$1" >/dev/null 2>&1
            elif command -v python3 >/dev/null 2>&1; then
              python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$1" >/dev/null 2>&1
            else
              [ -s "$1" ]
            fi
          }

          # 2026-10-06：.env 是 KEY=VALUE 纯文本，不是 JSON，套 json_ok 会恒判否
          # （正是此前 .env 进不了隔离快照名单的原因之一）。判据取「非空 +
          # 至少一行合法 KEY=」：只判 -s 会把写了一半的文件当好副本收下、回填后
          # 完整性校验照样过 —— 所以补进名单时必须先把判据做对。
          env_ok() {
            [ -s "$1" ] || return 1
            grep -q '^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*=' "$1" 2>/dev/null
          }

          # 按文件类型分派完好性判据：JSON 必须可解析，.env 走文本判据，其余退回非空。
          file_ok() {
            local path="$1" base
            base="${path##*/}"
            case "$base" in
              *.json)     json_ok "$path" ;;
              .env|*.env) env_ok "$path" ;;
              *)          [ -s "$path" ] ;;
            esac
          }

          rm -f "$OUTPUT_TAR"

          if [ ! -d "$SRC_DIR" ]; then
            echo "openclaw_dir_missing"
            exit 1
          fi

          # 2026-10-22 分段计时（测量埋点）：rsync 与 pigz 压缩占了脚本耗时大头，
          # 各段秒数打进行内日志，供逐轮归档日志直接对比（下线窗口优化用）。
          ARCH_T0=$(date +%s)
          STAGE_DIR=$(mktemp -d /tmp/openclaw-archive-stage.XXXXXX)
          mkdir -p "$STAGE_DIR/.openclaw"

          # ── 关键文件隔离快照（2026-10-02 事故修复）──────────────────────
          # 根因：openclaw.json 被网关持续重写（mtime 每轮都变），而 rsync 扫完
          # 6.5G 要数分钟。若 rsync 恰好在网关「截断写入 / 原子替换」那一瞬扫到
          # 该文件，staging 里就是缺失或 0 字节 —— 完整性校验判 missing →
          # 退出码 4 → 主包冻结、每 20 分钟重复告警（run 36963030965 即此形态）。
          # 原逻辑容忍 rsync rc=24（file has vanished），恰恰放过了这种情形：
          # 文件没「消失」，是被重写了，rc 仍是 0。
          # 对策：rsync 前先把关键文件拷到隔离位，校验为完整 JSON 才收，重试
          # 直到拿到好副本；rsync 后再用该副本兜底回填，让瞬时竞态自愈，
          # 而不是整轮判失败、冻结主包。
          # 2026-10-06：.env 补进隔离快照名单 —— 此前只有 openclaw.json 享受「抓副本
          # → 校验 → 回填」的自愈待遇，.env 全靠 rsync 那一趟扫到；6.9G 的 rsync 一旦
          # 漏扫，就直接落到 exit 4（run 37396503543 即此形态：日志第一行还在回填
          # openclaw.json，第二行已经报 missing= .env）。补进名单后漏扫也能用副本补齐。
          CRITICAL_FILES="openclaw.json .env"
          KEEP_DIR="$(mktemp -d /tmp/openclaw-archive-keep.XXXXXX)"
          keep_ok=1
          for f in $CRITICAL_FILES; do
            got=0
            for attempt in 1 2 3 4 5; do
              if cp "$SRC_DIR/$f" "$KEEP_DIR/$f" 2>/dev/null && file_ok "$KEEP_DIR/$f"; then
                got=1
                break
              fi
              sleep 1
            done
            if [ "$got" -ne 1 ]; then
              # 连抓 5 次都拿不到完整副本 = 源本身有问题，不是竞态。
              # 不回填，交给下方完整性校验按真实故障处理（退出码 4）。
              echo "openclaw_critical_snapshot_failed file=$f (源不可用，非竞态)" >&2
              keep_ok=0
            fi
          done

          # 派生副本 7 天自动清理（2026-10-21）：状态库迁移与 doctor 会在原地留下同名
          # *.bak（单个 agent 库 0.5–0.8GB），skills 又往 backups/ 堆时间戳快照 —— 这两类
          # 都会被打进主包、下一轮原样还原回来，只增不减（实测 4.69GB + 1.55GB，约占包体
          # 四成，且每轮 doctor 还在往上加）。剪在打包之前，云端主包才会跟着一起瘦下来。
          # 判龄只认 mtime 不认名字：backups/ 下命名格式不止一种（YYYYMMDD-HHMM、
          # YYYYMMDD-HHMM-tag、YYMM-DDHHMM），解析名字必漏。
          # 清理失败不拦归档：剪不动大不了本轮还是大包，正事是打包本身。
          PRUNE_DAYS="${OPENCLAW_PRUNE_DAYS:-7}"
          prune_victims="/tmp/openclaw-prune-victims.$$"
          {
            find "$SRC_DIR/backups" -mindepth 1 -maxdepth 1 -mtime +"$PRUNE_DAYS" -print0 2>/dev/null
            find "$SRC_DIR" -name '*.bak' -type f -mtime +"$PRUNE_DAYS" -print0 2>/dev/null
          } > "$prune_victims" || true
          prune_bytes=0
          prune_count=0
          while IFS= read -r -d '' victim; do
            [ -e "$victim" ] || continue
            vsz=$(du -sb "$victim" 2>/dev/null | awk '{print $1+0}')
            rm -rf -- "$victim" 2>/dev/null || continue
            prune_bytes=$(( prune_bytes + ${vsz:-0} ))
            prune_count=$(( prune_count + 1 ))
          done < "$prune_victims"
          rm -f "$prune_victims"
          if [ "$prune_count" -gt 0 ]; then
            echo "openclaw_pruned_derived_copies count=$prune_count bytes=$prune_bytes days=$PRUNE_DAYS"
          fi

          # Copy a stable snapshot first. rsync may return 24 when live files vanish
          # during copy; that is expected for active OpenClaw session/lock files, so
          # accept 24 and still validate the final tarball.
          set +e
          rsync -a --delete \
            --exclude 'logs/**' \
            --exclude 'cache/**' \
            --exclude 'browser/*/Crashpad/**' \
            --exclude 'browser/*/GPUCache/**' \
            --exclude 'browser/*/Code Cache/**' \
            --exclude 'browser/*/GrShaderCache/**' \
            --exclude 'browser/*/GraphiteDawnCache/**' \
            --exclude 'SingletonLock' \
            --exclude 'SingletonSocket' \
            --exclude 'SingletonCookie' \
            --exclude '*.lock' \
            --exclude '*.pid' \
            --exclude '*.jsonl.lock' \
            "$SRC_DIR"/ "$STAGE_DIR/.openclaw"/
          rsync_rc=$?
          set -e
          echo "openclaw_archive_timing rsync_sec=$(( $(date +%s) - ARCH_T0 )) rc=${rsync_rc}"

          if [ "$rsync_rc" -ne 0 ] && [ "$rsync_rc" -ne 24 ]; then
            echo "openclaw_snapshot_failed rc=$rsync_rc" >&2
            exit "$rsync_rc"
          fi

          if [ "$rsync_rc" -eq 24 ]; then
            echo "openclaw_snapshot_partial_live_changes"
          fi

          # 竞态兜底回填：rsync 期间关键文件若被网关重写而扫成缺失 / 0 字节 /
          # 半截写入，用 rsync 前抓到的稳定副本补齐。副本本身不可用时
          #（keep_ok=0）不回填 —— 那是源真坏了，必须让校验拦下。
          if [ "$keep_ok" -eq 1 ]; then
            for f in $CRITICAL_FILES; do
              if ! file_ok "$STAGE_DIR/.openclaw/$f"; then
                cp "$KEEP_DIR/$f" "$STAGE_DIR/.openclaw/$f"
                echo "openclaw_archive_race_repaired file=$f (rsync 竞态，已用稳定副本回填)" >&2
              fi
            done
          fi

          # 完整性校验：关键文件必须存在且非空 —— 这才是「状态全不全」的判据。
          # 取代原先「新包不足云端现有包 60% 则拒绝覆盖」的体积基准：体积会被主动
          # 瘦身（排除缓存/调试转储）、日志轮转永久改变，拿上一次归档当基准会把
          # 正常瘦身判成状态丢失，且主包就此冻结、每轮重复告警（2026-09-12）。
          # 退出码 4 = 状态不全，调用方按归档失败处理，不覆盖云端。
          # 2026-10-02：.env 加入关键文件 —— 凭据全在里面（GH/Gemini/通道 token 等），
          # 缺 .env 是「doctor 现造空壳」的标志性特征：合法但全空，config validate 照样
          # 通过。缺失即 exit 4，主包不覆盖。
          missing=""
          for f in openclaw.json .env; do
            if [ ! -s "$STAGE_DIR/.openclaw/$f" ]; then
              missing="$missing $f"
            fi
          done
          if [ -n "$missing" ]; then
            echo "openclaw_archive_incomplete missing=$missing" >&2
            exit 4
          fi

          # 配置可用性校验：包内 openclaw.json 必须是**当前版本能接受**的配置。
          # 为什么必须卡在这里：网关的「健康」只反映**运行中的进程**，不反映**磁盘上的配置**。
          # 配置被改坏后热重载会拒绝它、继续用内存里的旧配置服务，/health 照常 200，
          # 于是本脚本会把磁盘上那份坏配置打进包、顶着「健康」标签覆盖云端主包；
          # 下轮启动读到的就是坏配置，同一故障自我复现。
          # （2026-09-18 事故即此形态：heartbeat 写了无效键 enabled。）
          # 退出码 5 = 配置不可用，调用方按归档失败处理：不覆盖云端。
          if command -v openclaw >/dev/null 2>&1; then
            if ! OPENCLAW_CONFIG_PATH="$STAGE_DIR/.openclaw/openclaw.json" openclaw config validate >/dev/null 2>&1; then
              echo "openclaw_archive_config_invalid path=openclaw.json" >&2
              exit 5
            fi
          else
            # 校验器不可得时不拦（拦了会让主包永久冻结、风险更大），但明确留痕
            echo "openclaw_archive_config_check_skipped (openclaw not on PATH)" >&2
          fi

          # 2026-10-22 流式模式（下线优化）：OUTPUT_TAR="-" 时把 gzip 流直接写 stdout，
          # 供调用方 `rclone rcat` 边压边传 —— 把「打包 318s → 上传 380s」的串行改成
          # max(打包, 上传)。元信息走 stderr，不污染数据流；完整性由调用方按
          # 「流退出码 + 远端体积 ≥ 源 30% + gzip 魔数」三道门把关（失败不覆盖云端）。
          if [ "$OUTPUT_TAR" = "-" ]; then
            # 只把 gzip 流写到 fd 3（原始 stdout），日志走 stderr。
            if command -v pigz >/dev/null 2>&1; then
              tar -C "$STAGE_DIR" -cf - .openclaw | pigz -p "$(nproc)" -6 >&3
            else
              tar -C "$STAGE_DIR" -cf - .openclaw | gzip -6 >&3
            fi
            echo "archive_stream_ready" >&2
            exit 0
          fi

          # 优化（2026-10-01）：单线程 gzip → pigz 并行压缩（本机 4 核，实测
          # 300MB 样本 6.33s → 2.57s，快 2.5 倍）。产物仍是标准 gzip 流，
          # 已实测可用现有 `tar -xzf` 正常解开，恢复侧无需任何改动。
          # pigz 不可用时自动回退 gzip，保证归档不中断。
          ARCH_T1=$(date +%s)
          if command -v pigz >/dev/null 2>&1; then
            tar -C "$STAGE_DIR" -cf - .openclaw | pigz -p "$(nproc)" -6 > "$OUTPUT_TAR"
          else
            echo "pigz unavailable, fallback to gzip" >&2
            tar -C "$STAGE_DIR" -czf "$OUTPUT_TAR" .openclaw
          fi
          echo "openclaw_archive_timing compress_sec=$(( $(date +%s) - ARCH_T1 )) total_sec=$(( $(date +%s) - ARCH_T0 ))"

          actual_size=$(stat -c%s "$OUTPUT_TAR" 2>/dev/null || echo 0)
          if [ ! -s "$OUTPUT_TAR" ]; then
            echo "openclaw_archive_empty output=$OUTPUT_TAR"
            exit 1
          elif [ "$actual_size" -lt "$MIN_SIZE" ]; then
            echo "openclaw_archive_too_small size=${actual_size} min=${MIN_SIZE} output=$OUTPUT_TAR"
            exit 1
          elif ! tar -tzf "$OUTPUT_TAR" >/dev/null 2>&1; then
            echo "openclaw_archive_tar_validation_failed output=$OUTPUT_TAR"
            exit 1
          else
            echo "archive_ready size=${actual_size} output=$OUTPUT_TAR"
          fi
          EOF
          chmod +x /tmp/create-openclaw-archive.sh

          cat > /tmp/create-zcode-archive.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          OUTPUT_TAR="${1:-}"
          if [ -z "$OUTPUT_TAR" ]; then
            echo "Usage: $0 /path/to/output.tar.gz" >&2
            exit 2
          fi

          MIN_SIZE=$((5 * 1024))
          SRC_ROOT="/home/runner/.zcode"
          STAGE_DIR=""

          cleanup() {
            if [ -n "${STAGE_DIR:-}" ] && [ -d "$STAGE_DIR" ]; then
              rm -rf "$STAGE_DIR"
            fi
          }
          trap cleanup EXIT

          rm -f "$OUTPUT_TAR"

          if [ ! -d "$SRC_ROOT/cli" ] && [ ! -d "$SRC_ROOT/v2" ] && [ ! -d "$SRC_ROOT/server" ]; then
            echo "zcode_dir_missing"
            exit 3
          fi

          STAGE_DIR=$(mktemp -d /tmp/zcode-archive-stage.XXXXXX)
          mkdir -p "$STAGE_DIR/.zcode"

          # 快照 cli/ + v2/ + server/ 三棵子树，只排除真正的垃圾：
          #   - cli/log/**：运行日志（zcode-*.jsonl，纯遥测，可再生）
          #   - server/asset-cache/staging：下载暂存目录，恒空
          #   - *.lock / *.pid：进程锁与 pid 文件，跨机还原无意义
          # 不排除 cli/plugins/cache —— 名字像缓存，实为插件的**运行位置**（skill/命令/脚本
          # 都从那里加载），ZCode 自己的存储分类表也把 cli/plugins 归 runtimes（不可清理）。
          # 同理不再排除 rollout/exec：早先当「调试转储」排除等于切掉会话内容
          # （2026-09-18 排查「备份不齐全、会话仍丢」的根因之一）。宁可包大，不可少数据。
          # rsync 返回 24 表示活动会话文件复制中消失，属预期，仍校验最终包。
          # 用 helper 收口：24 视为成功（只记一行），其余非零才是真失败。
          snapshot_tree() {
            local src="$1" dst="$2"
            shift 2
            [ -d "$src" ] || return 0
            local rc=0
            rsync -a --delete "$@" "$src/" "$dst/" || rc=$?
            if [ "$rc" -eq 24 ]; then
              echo "zcode_snapshot_partial_live_changes src=$src"
              return 0
            fi
            return "$rc"
          }

          set +e
          snapshot_tree "$SRC_ROOT/cli" "$STAGE_DIR/.zcode/cli/" \
            --exclude 'log/**' \
            --exclude '*.lock' \
            --exclude '*.pid'
          cli_rc=$?
          snapshot_tree "$SRC_ROOT/server" "$STAGE_DIR/.zcode/server/" \
            --exclude 'asset-cache/staging' \
            --exclude '*.lock' \
            --exclude '*.pid'
          server_rc=$?
          set -e

          if [ "$cli_rc" -ne 0 ] || [ "$server_rc" -ne 0 ]; then
            echo "zcode_snapshot_failed cli=$cli_rc server=$server_rc" >&2
            exit 1
          fi

          # v2/ 整棵入包：tasks-index.sqlite 是侧栏会话列表（标题/置顶/归档/未读/删除），
          # certs + telemetry-state.json 是 server 设备身份（见还原步骤注释），
          # setting.json / provider_config.json / credentials.json 是客户端配置与凭据。
          # 注意 provider_config.json 内含明文 apiKey —— 本包落在用户自建 Dropbox，
          # 与主包（~/.openclaw 内含 openclaw.json 凭据）同级敏感，不要外发。
          if [ -d "$SRC_ROOT/v2" ]; then
            rsync -a --delete \
              --exclude '*.lock' \
              --exclude '*.pid' \
              "$SRC_ROOT/v2/" "$STAGE_DIR/.zcode/v2/"
          fi

          # SQLite 一致性快照：WAL 模式下数据可能在 -wal 里，主文件单独拿出来是空的
          # （实测 tasks-index.sqlite 主文件仅 4KB、连 tasks 表都没有，全部 3 行在 -wal 中）。
          # 这里用 .backup 从活库导出自包含单文件，再丢掉 -wal/-shm —— 还原侧拿到即完整。
          # 从活库而非 staging 副本导出：staging 是 rsync 的逐文件拷贝，可能跨越写入时刻。
          # sqlite3 不可用时保留 rsync 副本（三文件一起复制，本身也是可用快照）。
          if command -v sqlite3 >/dev/null 2>&1; then
            while IFS= read -r live_db; do
              [ -n "$live_db" ] || continue
              rel="${live_db#"$SRC_ROOT"/}"
              staged="$STAGE_DIR/.zcode/$rel"
              # 只处理 rsync 真的收进包里的库，避免为被排除目录（如 plugins/cache）白做工
              [ -f "$staged" ] || continue
              if sqlite3 "$live_db" ".backup '$staged.tmp'" 2>/dev/null && [ -s "$staged.tmp" ]; then
                mv -f "$staged.tmp" "$staged"
                rm -f "$staged-wal" "$staged-shm" 2>/dev/null || true
                echo "sqlite_snapshot ok $rel"
              else
                rm -f "$staged.tmp" 2>/dev/null || true
                echo "sqlite_snapshot_fallback $rel (kept rsync copy)"
              fi
            done < <(find "$SRC_ROOT/cli" "$SRC_ROOT/v2" "$SRC_ROOT/server" -name '*.sqlite' -type f 2>/dev/null)
          else
            echo "sqlite_snapshot_skipped (sqlite3 not found; using rsync copies)"
          fi

          # 完整性校验（取代体积基准）：三项都是「没有就说明状态不全」的判据 ——
          # db.sqlite 是会话正文与消息树，tasks-index.sqlite 是侧栏列表，
          # server/zcode-server.cjs 是服务端 bundle（缺它就得整包重下）。
          # 缺任一项即以退出码 4 中止、不覆盖云端。
          missing=""
          for f in cli/db/db.sqlite v2/tasks-index.sqlite server/zcode-server.cjs; do
            if [ ! -s "$STAGE_DIR/.zcode/$f" ]; then
              missing="$missing $f"
            fi
          done
          if [ -n "$missing" ]; then
            echo "zcode_archive_incomplete missing=$missing" >&2
            exit 4
          fi

          tar -C "$STAGE_DIR" -czf "$OUTPUT_TAR" .zcode

          actual_size=$(stat -c%s "$OUTPUT_TAR" 2>/dev/null || echo 0)
          if [ ! -s "$OUTPUT_TAR" ]; then
            echo "zcode_archive_empty output=$OUTPUT_TAR"
            exit 1
          elif [ "$actual_size" -lt "$MIN_SIZE" ]; then
            echo "zcode_archive_too_small size=${actual_size} min=${MIN_SIZE} output=$OUTPUT_TAR"
            exit 1
          elif ! tar -tzf "$OUTPUT_TAR" >/dev/null 2>&1; then
            echo "zcode_archive_tar_validation_failed output=$OUTPUT_TAR"
            exit 1
          else
            echo "archive_ready size=${actual_size} output=$OUTPUT_TAR"
          fi
          EOF
          chmod +x /tmp/create-zcode-archive.sh

          cat > /tmp/create-omniroute-archive.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          OUTPUT_TAR="${1:-}"
