          # 两侧互相 restores 无差异
          tar -C "$STAGE_DIR" -czf "$OUTPUT_TAR" .env data

          actual_size=$(stat -c%s "$OUTPUT_TAR" 2>/dev/null || echo 0)
          if [ ! -s "$OUTPUT_TAR" ]; then
          echo "zcode2api_archive_empty output=$OUTPUT_TAR"
          exit 1
          elif [ "$actual_size" -lt "$MIN_SIZE" ]; then
          echo "zcode2api_archive_too_small size=${actual_size} min=${MIN_SIZE} output=$OUTPUT_TAR"
          exit 1
          elif ! tar -tzf "$OUTPUT_TAR" >/dev/null 2>&1; then
          echo "zcode2api_archive_tar_validation_failed output=$OUTPUT_TAR"
          exit 1
          else
          echo "archive_ready size=${actual_size} output=$OUTPUT_TAR"
          fi
          EOF
          chmod +x /tmp/create-zcode2api-data-archive.sh

          # workbuddy-cred-sync 已于 2026-10-06 停用移除，不再生成该同步脚本。
          # （原逻辑：每 300s 把 Dropbox 凭据 sync 进 /tmp 运行目录；现 workbuddy 的
          #   WorkingDirectory 已直指 Dropbox，凭据由网关自己直写，该同步彻底空转。）

          cat > /tmp/openclaw-archive-loop.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          # 2026-10-02：loop 由 nohup 起在极简 PATH 下，而 openclaw 装在 setup-node 的
          # hostedtoolcache 里 —— 找不到它时 create-openclaw-archive.sh 的 config validate
          # 一直被静默跳过（日志 openclaw_archive_config_check_skipped），「坏配置不进包」
          # 的防线形同虚设。启动循环前把 openclaw 所在 bin 前置进 PATH，随 nohup 一并继承。
          # 实测布局是 node/<版本>/x64/bin 两层目录（node/*/bin 从未匹配上，此前的
          # 「修复」只在 job step 里靠继承 PATH 碰巧生效）；两种 glob 都试，防布局变动。
          for _nd in /opt/hostedtoolcache/node/*/*/bin /opt/hostedtoolcache/node/*/bin; do
            if [ -x "$_nd/openclaw" ]; then
              PATH="$_nd:$PATH"
              export PATH
              break
            fi
          done

          # 2026-10-06：单实例守卫 —— 必须放在 cleanup_archive_outputs **之前**。
          # systemd 单元（enabled 后随 user session 自启）与 nohup 拉起的实例会并存，
          # 重复实例一启动就执行 cleanup_archive_outputs，把 /tmp/*.tar.gz 与
          # staging 目录全部抹掉 —— 健康实例刚打好的包被直接删除，rclone 随即报
          # "no such file or directory"；而 copyto 已先删远端目标，云端包跟着消失。
          # 归档循环崩溃 121 次、zcode.tar.gz 云端一度查不到，根因都在这层互相抹除。
          # 用 flock 而不是 pgrep -f：pgrep 按命令行全文匹配，会把**排查命令自身**
          #（如 `pgrep -af "openclaw-archive-loop.sh"`）也算成另一个实例，
          # 结果两个实例互相否决、谁都不干活（2026-10-06 实测踩到）。
          # flock 只看锁文件持有者，与命令行文本无关，且退出即自动释放。
          LOOP_LOCK="/tmp/openclaw-archive-loop.instance.lock"
          exec 9>"$LOOP_LOCK"
          if ! flock -n 9; then
            echo "[$(date '+%F %T')] ⏭️ another archive loop already running (lock=$LOOP_LOCK), exit without cleanup"
            exit 0
          fi

          TMP_OPENCLAW_TAR="/tmp/openclaw.tar.gz"
          TMP_OMNIROUTE_TAR="/tmp/OmniRoute.tar.gz"
          # 2026-10-11 恢复自动降级：回退后端归档恢复刷新（生效后端的数据才进对应包）
          TMP_CLIRELAY_TAR="/tmp/CliRelay.tar.gz"
          TMP_CLIPROXYAPI_TAR="/tmp/CLIProxyAPI.tar.gz"
          TMP_ZCODE_TAR="/tmp/zcode.tar.gz"
          # 2026-10-06 新增：rsstt / zcode2api-data 原先只在 job 收尾打一次，
          # cancel 或 360m 强杀时那一步没机会跑，实测云端落后本地 5-8.5 小时。
          # 纳入本 20 分钟周期循环后，回滚窗口从「一轮 job ≈6h」压到 20 分钟。
          # 产物用 -periodic 后缀，与 Final Archive 的同名包区分，互不覆盖。
          TMP_RSSTT_TAR="/tmp/rsstt-periodic.tar.gz"
          TMP_Z2A_DATA_TAR="/tmp/zcode2api-data-periodic.tar.gz"
          # 2026-10-22 对象级锁改造（与 Final Archive 同口径）：互斥粒度从一把大锁
          # 改为按对象分锁 —— 循环内各项本就串行执行，分锁只为与收尾的并行旁路
          # 归档精确互斥（收尾在归档主包时，小项不必等主包的锁，反之亦然）。
          LOCK_OPENCLAW="/tmp/openclaw-archive.lock.openclaw"
          LOCK_AIGW="/tmp/openclaw-archive.lock.aigateway"
          LOCK_ZCODE="/tmp/openclaw-archive.lock.zcode"
          LOCK_RSSTT="/tmp/openclaw-archive.lock.rsstt"
          LOCK_Z2A="/tmp/openclaw-archive.lock.zcode2api"

          cleanup_archive_outputs() {
            # 产物文件（非 staging 目录）照常清理
            rm -f "$TMP_OPENCLAW_TAR" 2>/dev/null || true
            rm -f "$TMP_OMNIROUTE_TAR" 2>/dev/null || true
            rm -f "$TMP_CLIRELAY_TAR" 2>/dev/null || true
            sudo rm -f "$TMP_CLIPROXYAPI_TAR" 2>/dev/null || true
            rm -f "$TMP_ZCODE_TAR" 2>/dev/null || true
            sudo rm -f "$TMP_RSSTT_TAR" 2>/dev/null || true
            rm -f "$TMP_Z2A_DATA_TAR" 2>/dev/null || true
            # ── 2026-10-07 rc=23 根治：staging 目录绝不能在别人持锁写入时被抹 ──
            # 形态（run 37577681547）：最终归档持 /tmp/openclaw-archive.lock 跑 rsync
            # 期间，被 systemd(Restart=always) 拉回的循环新实例执行本函数，通配
            # rm -rf 把 staging 整棵抹掉 → rsync **目标侧** mkstemp / recv_generator:
            # mkdir 全量 ENOENT（917 条）→ rc=23 → 主包不覆盖、每轮重复告警。
            # 判据：报错全部落在目标侧（源侧无长路径、无悬空链接、读取正常），
            # 即「父目录被抹」而非「源文件消失」—— 后者才是 rc=24 的语义。
            # 对策：清理 staging 前先**非阻塞**抢同一把归档锁；抢不到说明有人正在
            # 写，跳过清理（残留目录由持有方自己的 trap cleanup 回收，不会泄漏）。
            # ── 2026-10-07 rc=23 根治 + 2026-10-22 对象级锁改造 ──
            # staging 清理按对象分锁：锁被持有 = 该对象正在打包，只跳过该对象的
            # staging（残留由持有方自己的 trap cleanup 回收）；其余对象照常清理。
            (
              flock -n 9 || exit 1
              rm -rf /tmp/openclaw-archive-stage.* 2>/dev/null || true
            ) 9>>"$LOCK_OPENCLAW" 2>/dev/null || echo "⚠️ 主包归档锁被持有，跳过其 staging 清理" >&2
            (
              flock -n 9 || exit 1
              rm -rf /tmp/omniroute-archive-stage.* /tmp/clirelay-archive-stage.* 2>/dev/null || true
              sudo rm -rf /tmp/cliproxyapi-archive-stage.* 2>/dev/null || true
            ) 9>>"$LOCK_AIGW" 2>/dev/null || echo "⚠️ AI 网关归档锁被持有，跳过其 staging 清理" >&2
            (
              flock -n 9 || exit 1
              rm -rf /tmp/zcode-archive-stage.* 2>/dev/null || true
            ) 9>>"$LOCK_ZCODE" 2>/dev/null || echo "⚠️ zcode 归档锁被持有，跳过其 staging 清理" >&2
            (
              flock -n 9 || exit 1
              sudo rm -rf /tmp/rsstt-archive-stage.* 2>/dev/null || true
            ) 9>>"$LOCK_RSSTT" 2>/dev/null || echo "⚠️ rsstt 归档锁被持有，跳过其 staging 清理" >&2
            (
              flock -n 9 || exit 1
              rm -rf /tmp/zcode2api-data-archive-stage.* 2>/dev/null || true
            ) 9>>"$LOCK_Z2A" 2>/dev/null || echo "⚠️ zcode2api 归档锁被持有，跳过其 staging 清理" >&2
          }
          cleanup_archive_outputs
          PID_FILE="/tmp/openclaw-archive.pid"

