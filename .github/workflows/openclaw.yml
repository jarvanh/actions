          # 产物用 -periodic 后缀，与 Final Archive 的同名包区分，互不覆盖。
          TMP_RSSTT_TAR="/tmp/rsstt-periodic.tar.gz"
          TMP_Z2A_DATA_TAR="/tmp/zcode2api-data-periodic.tar.gz"
          # 2026-10-22 对象级锁改造（与 Final Archive 同口径）：互斥粒度从一把大锁
          # 改为按对象分锁 —— 循环内各项本就串行执行，分锁只为与收尾的并行旁路
          # 归档精确互斥（收尾在归档主包时，小项不必等主包的锁，反之亦然）。
          LOCK_OPENCLAW="/tmp/openclaw-archive.lock.openclaw"
          LOCK_AIGW="/tmp/openclaw-archive.lock.aigateway"
          LOCK_ZCODE="/tmp/openclaw-archive.lock.zcode"
          LOCK_RSSTT="/tmp/openclaw-archive.lock.rsstt"
          LOCK_Z2A="/tmp/openclaw-archive.lock.zcode2api"

          cleanup_archive_outputs() {
            # 产物文件（非 staging 目录）照常清理
            rm -f "$TMP_OPENCLAW_TAR" 2>/dev/null || true
            rm -f "$TMP_OMNIROUTE_TAR" 2>/dev/null || true
            rm -f "$TMP_CLIRELAY_TAR" 2>/dev/null || true
            sudo rm -f "$TMP_CLIPROXYAPI_TAR" 2>/dev/null || true
            rm -f "$TMP_ZCODE_TAR" 2>/dev/null || true
            sudo rm -f "$TMP_RSSTT_TAR" 2>/dev/null || true
            rm -f "$TMP_Z2A_DATA_TAR" 2>/dev/null || true
            # ── 2026-10-07 rc=23 根治：staging 目录绝不能在别人持锁写入时被抹 ──
            # 形态（run 37577681547）：最终归档持 /tmp/openclaw-archive.lock 跑 rsync
            # 期间，被 systemd(Restart=always) 拉回的循环新实例执行本函数，通配
            # rm -rf 把 staging 整棵抹掉 → rsync **目标侧** mkstemp / recv_generator:
            # mkdir 全量 ENOENT（917 条）→ rc=23 → 主包不覆盖、每轮重复告警。
            # 判据：报错全部落在目标侧（源侧无长路径、无悬空链接、读取正常），
            # 即「父目录被抹」而非「源文件消失」—— 后者才是 rc=24 的语义。
            # 对策：清理 staging 前先**非阻塞**抢同一把归档锁；抢不到说明有人正在
            # 写，跳过清理（残留目录由持有方自己的 trap cleanup 回收，不会泄漏）。
            # ── 2026-10-07 rc=23 根治 + 2026-10-22 对象级锁改造 ──
            # staging 清理按对象分锁：锁被持有 = 该对象正在打包，只跳过该对象的
            # staging（残留由持有方自己的 trap cleanup 回收）；其余对象照常清理。
            (
              flock -n 9 || exit 1
              rm -rf /tmp/openclaw-archive-stage.* 2>/dev/null || true
            ) 9>>"$LOCK_OPENCLAW" 2>/dev/null || echo "⚠️ 主包归档锁被持有，跳过其 staging 清理" >&2
            (
              flock -n 9 || exit 1
              rm -rf /tmp/omniroute-archive-stage.* /tmp/clirelay-archive-stage.* 2>/dev/null || true
              sudo rm -rf /tmp/cliproxyapi-archive-stage.* 2>/dev/null || true
            ) 9>>"$LOCK_AIGW" 2>/dev/null || echo "⚠️ AI 网关归档锁被持有，跳过其 staging 清理" >&2
            (
              flock -n 9 || exit 1
              rm -rf /tmp/zcode-archive-stage.* 2>/dev/null || true
            ) 9>>"$LOCK_ZCODE" 2>/dev/null || echo "⚠️ zcode 归档锁被持有，跳过其 staging 清理" >&2
            (
              flock -n 9 || exit 1
              sudo rm -rf /tmp/rsstt-archive-stage.* 2>/dev/null || true
            ) 9>>"$LOCK_RSSTT" 2>/dev/null || echo "⚠️ rsstt 归档锁被持有，跳过其 staging 清理" >&2
            (
              flock -n 9 || exit 1
              rm -rf /tmp/zcode2api-data-archive-stage.* 2>/dev/null || true
            ) 9>>"$LOCK_Z2A" 2>/dev/null || echo "⚠️ zcode2api 归档锁被持有，跳过其 staging 清理" >&2
          }
          cleanup_archive_outputs
          PID_FILE="/tmp/openclaw-archive.pid"

          # 真源只在 step 顶层 source 一次（规范 4.4）：本 step 的归档循环会 fork
          # 子进程调用 send_telegram_alert，函数体内再 source 不会改父 shell 的
          # 函数表，调用点若对 send_tg 做本地覆写会被静默还原成真发。
          # 2026-10-06：systemd 单元不继承 GitHub Actions 的环境，GITHUB_WORKSPACE
          # 为空 → set -u 下 source 直接报错退出 → Restart=always 变崩溃循环
          #（实测 NRestarts=121，每 30s 一轮，每轮还顺手 cleanup 一次）。
          # 真源仓库检出路径固定，缺失时回落到该路径；文件不存在则只降级告警能力，
          # 绝不能因此让整个归档循环退出。
          WS_DIR="${GITHUB_WORKSPACE:-/home/runner/work/actions/actions}"
          if [ -f "$WS_DIR/.github/scripts/telegram/tg_notify.sh" ]; then
            source "$WS_DIR/.github/scripts/telegram/tg_notify.sh"
          else
            echo "[$(date '+%F %T')] ⚠️ tg_notify.sh not found at $WS_DIR; alerts degraded to log-only"
            send_tg() { echo "[send_tg degraded] $1" >&2; return 0; }
            tg_add_title() { :; }
            tg_add_path() { :; }
            tg_add_kv() { :; }
            tg_add_section() { :; }
            tg_add_pre() { :; }
            tg_add_footer() { :; }
          fi

          # 用法: send_telegram_alert <对象> <结论> <原因> [原始输出]
          # 版式（docs/telegram-notify.md 2.3 / 4.3 / 规范 · 多行块）：对象是机器返回的包名 → <code>；
          # 结论与原因是人写的自然语言 → 裸文本 kv；rclone/tar 的原始输出 → <pre>。
          # 此前四者拼成一整串塞进单个 <pre>，自然语言被一并等宽化，与全库
          # 「kv 区 + 明细分节」形态不一致。
          # 对象 → 标题短名：五类归档曾共用「OpenClaw 归档告警」这一个标题，读者无法
          # 从标题判断是哪个包出问题（看到标题会以为是主包，实际可能是 ZCode）。
          obj_label() {
            case "$1" in
              openclaw.tar.gz)                  echo "OpenClaw 主包" ;;
              zcode.tar.gz)                     echo "ZCode" ;;
              OmniRoute|OmniRoute.tar.gz)       echo "OmniRoute" ;;
              rsstt|rsstt.tar.gz)               echo "rss-to-telegram" ;;
              zcode2api-data.tar.gz)            echo "zcode2api 数据" ;;
              *)                                echo "$1" ;;
            esac
          }
          send_telegram_alert() {
            local obj="$1" verdict="$2" reason="${3:-}" detail="${4:-}"
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              local run_id="${GITHUB_RUN_ID:-manual}"
              # 统一 HTML 版式 + 统一收尾区（tg_add_* 内置转义，值原样传入即可；
              # 二次 escape_html 会把 & 变成 &amp;amp; 字面量直出）。真源已在 step
              # 顶层 source（规范 4.4），函数体只用助手、不再重复 source。
              local full_msg=""
              tg_add_title full_msg "⚠️ 归档告警 · $(obj_label "$obj")"
              tg_add_path full_msg "对象" "$obj"
              tg_add_kv full_msg "结论" "$verdict"
              if [ -n "$reason" ]; then
                tg_add_kv full_msg "原因" "$reason"
              fi
              # Run ID 属机器值 → <code>（规范 · 机器值）；排在 kv 区末行，
              # 让 <pre> 原始输出成为正文最后一块（其后只跟收尾区）
              tg_add_path full_msg "Run ID" "${run_id}"
              if [ -n "$detail" ]; then
                # 多行原始输出 → <pre>（规范 · 多行块）；取尾部 1200 字节（与 file_split.sh
                # 日志摘要同口径）：超长输出会让 <pre> 跨 4000 字符分片，标签断开即破版
                tg_add_section full_msg "🧾 原始输出"
                tg_add_pre full_msg "$(tg_tail_safe "$detail" 1200)"
              fi
              tg_add_footer full_msg
              # 走发送层而非 curl 直发：429 重试已内建，HTML 解析失败直接报错（规范 · 发送层），
              # 429 限流按 retry_after 等待重试，disable_web_page_preview 内置
              send_tg "$full_msg" alert || true
            fi
          }

          echo $$ > "$PID_FILE"
          trap 'rm -f "$PID_FILE"' EXIT

          ARCHIVE_DEST="dropbox:self-hosted/openclaw.tar.gz"
          # 2026-10-02 加固：meta 文件**不存在**（启动链没跑到 Run OpenClaw 就断了）同样是
          # 不健康 —— 原判据只认「文件存在但缺版本行」，启动链整体被跳过时这里会放行，
          # 把故障状态照样指向主包（当轮靠 rc=4 完整性校验兜住，属运气不是设计）。
          # 2026-10-11 失败现场包退役（主人拍板，省配额）：不健康运行**不归档不上传**，
          # 主包保持最后健康状态；故障状态只留在本地 ~/.openclaw（job 结束即回收）。
          UNHEALTHY_RUN=0
          if ! grep -q '^RECORDED_SUCCESSFUL_OPENCLAW_VERSION=' /tmp/run-openclaw-meta.env 2>/dev/null; then
            UNHEALTHY_RUN=1
            echo "ℹ️ Unhealthy run detected: background archive SKIPS the openclaw package (main package keeps the last healthy state)."
          fi

          while true; do
            # 2026-10-11 失败现场包退役：不健康运行直接跳过 openclaw 包的归档/上传
            # （本轮状态本来就坏，没有保存价值；其余 rsstt/网关等数据包照常归档）。
            if [ "$UNHEALTHY_RUN" = "1" ]; then
              echo "[$(date '+%F %T')] ⏭️ unhealthy run, skip openclaw package archive (main package keeps last healthy state)"
            # 2026-10-02：归档全程套 timeout —— 循环曾在一个悬挂的归档/上传迭代里卡死
            # 8 小时（无 timeout 的 rclone/网络调用），期间不归档、不告警、整条归档链静音。
            # timeout 杀掉后 flock 随之释放、rc=124 走失败分支照常告警，循环得以自愈。
            elif openclaw_archive_output=$(flock -E 200 -n "$LOCK_OPENCLAW" timeout 40m bash /tmp/create-openclaw-archive.sh "$TMP_OPENCLAW_TAR" 2>&1); then
              echo "[$(date '+%F %T')] openclaw archive ok, uploading... ${openclaw_archive_output}"
              # 2026-10-22：为「体积骤降只记录不拦截」而做的 rclone ls 已移除 ——
              # 该信息不参与任何判定，却给每轮循环加一次最长 5m 的远端往返；
              # 完整性由归档脚本的关键文件校验把关（体积本就不是「状态全不全」
              # 的判据，2026-09-12 起「缩水」即不再拦截）。
              openclaw_upload_output=""
              if openclaw_upload_output=$(timeout 30m rclone copyto "$TMP_OPENCLAW_TAR" "$ARCHIVE_DEST" --dropbox-chunk-size 128M 2>&1); then
                echo "[$(date '+%F %T')] openclaw upload ok"
                rm -f "$TMP_OPENCLAW_TAR"
              else
                rc=$?
                echo "[$(date '+%F %T')] ⚠️ openclaw.tar.gz upload failed (rc=$rc): ${openclaw_upload_output}"
                send_telegram_alert "openclaw.tar.gz" "上传失败 · 退出码 $rc" "rclone 上传失败" "${openclaw_upload_output:-无输出}"
              fi
            else
              rc=$?
              if [ "$rc" -eq 200 ]; then
                echo "[$(date '+%F %T')] ⏭️ previous archive still running, skip this round"
                sleep 1200
                continue
              else
                echo "[$(date '+%F %T')] ⚠️ openclaw.tar.gz archive failed in periodic archive (rc=$rc): ${openclaw_archive_output}"
                send_telegram_alert "openclaw.tar.gz" "归档失败 · 退出码 $rc" "归档脚本执行失败，详见原始输出" "${openclaw_archive_output:-归档脚本无输出}"
              fi
            fi

            # AI 网关归档三选一（2026-10-11 恢复自动降级）：按当前生效后端选择归档脚本
            # omni→OmniRoute.tar.gz；clirelay→CliRelay.tar.gz；cliproxyapi→CLIProxyAPI.tar.gz
            # 只刷生效后端的包：降级态下 OmniRoute 卷可能是空库，绝不能盖掉云端好包；
            # 主用态下回退后端没有活数据，刷了也是把陈旧状态当新鲜的上传。
            ACTIVE_BACKEND="omniroute"
            if [ -f /tmp/active-ai-backend.env ]; then
              ACTIVE_BACKEND=$(grep '^ACTIVE_BACKEND=' /tmp/active-ai-backend.env | tail -n 1 | cut -d= -f2- || true)
            fi
            ACTIVE_BACKEND="${ACTIVE_BACKEND:-omniroute}"

            case "$ACTIVE_BACKEND" in
              clirelay)
                AI_ARCHIVE_TAR="$TMP_CLIRELAY_TAR"
                AI_ARCHIVE_DEST="dropbox:self-hosted/CliRelay.tar.gz"
                AI_ARCHIVE_SCRIPT="/tmp/create-clirelay-archive.sh"
                AI_LABEL="CliRelay"
                AI_SUDO_RM="no"
                ;;
              cliproxyapi)
                AI_ARCHIVE_TAR="$TMP_CLIPROXYAPI_TAR"
                AI_ARCHIVE_DEST="dropbox:self-hosted/CLIProxyAPI.tar.gz"
                AI_ARCHIVE_SCRIPT="/tmp/create-cliproxyapi-archive.sh"
                AI_LABEL="CLIProxyAPI"
                AI_SUDO_RM="yes"
                ;;
              *)
                AI_ARCHIVE_TAR="$TMP_OMNIROUTE_TAR"
                AI_ARCHIVE_DEST="dropbox:self-hosted/OmniRoute.tar.gz"
                AI_ARCHIVE_SCRIPT="/tmp/create-omniroute-archive.sh"
                AI_LABEL="OmniRoute"
                AI_SUDO_RM="no"
                ;;
            esac

            ai_archive_output=""
            if ai_archive_output=$(flock -E 200 -n "$LOCK_AIGW" timeout 40m bash "$AI_ARCHIVE_SCRIPT" "$AI_ARCHIVE_TAR" 2>&1); then
              echo "[$(date '+%F %T')] ${AI_LABEL} archive ok, uploading... ${ai_archive_output}"
              ai_upload_output=""
              if ai_upload_output=$(timeout 30m rclone copyto "$AI_ARCHIVE_TAR" "$AI_ARCHIVE_DEST" 2>&1); then
                echo "[$(date '+%F %T')] ${AI_LABEL} upload ok"
                if [ "$AI_SUDO_RM" = "yes" ]; then sudo rm -f "$AI_ARCHIVE_TAR"; else rm -f "$AI_ARCHIVE_TAR"; fi
              else
                rc=$?
                echo "[$(date '+%F %T')] ⚠️ ${AI_LABEL}.tar.gz upload failed (rc=$rc): ${ai_upload_output}"
                send_telegram_alert "${AI_LABEL}.tar.gz" "上传失败 · 退出码 $rc" "rclone 上传失败" "${ai_upload_output:-无输出}"
              fi
            else
              rc=$?
              if [ "$rc" -eq 200 ]; then
                echo "[$(date '+%F %T')] ⏭️ previous archive still running, skip ${AI_LABEL} archive"
              elif [ "$rc" -eq 3 ]; then
                echo "[$(date '+%F %T')] ⚠️ ${AI_LABEL} archive skipped because deployment/data directory is missing (rc=$rc): ${ai_archive_output}"
                send_telegram_alert "$AI_LABEL" "归档跳过 · 退出码 $rc" "本地部署/数据目录缺失 · 通常表示网关容器启动步骤被跳过或失败" "${ai_archive_output:-AI 本地部署/数据目录缺失}"
              else
                echo "[$(date '+%F %T')] ⚠️ ${AI_LABEL} archive failed in periodic archive (rc=$rc): ${ai_archive_output}"
                send_telegram_alert "${AI_LABEL}.tar.gz" "归档失败 · 退出码 $rc" "归档脚本执行失败，详见原始输出" "${ai_archive_output:-归档脚本无输出}"
              fi
            fi

            # ZCode 个人数据归档：~/.zcode 的 cli/ + v2/ → dropbox:self-hosted/zcode.tar.gz（带完整性校验）
            if [ -d "$HOME/.zcode/cli" ] || [ -d "$HOME/.zcode/v2" ] || [ -d "$HOME/.zcode/server" ]; then
              zcode_archive_output=""
              if zcode_archive_output=$(flock -E 200 -n "$LOCK_ZCODE" timeout 40m bash /tmp/create-zcode-archive.sh "$TMP_ZCODE_TAR" 2>&1); then
                echo "[$(date '+%F %T')] zcode archive ok, uploading... ${zcode_archive_output}"
                # 2026-10-22：rclone ls 体积对照已移除（口径同主包，不参与判定纯成本）
                zcode_upload_output=""
                if zcode_upload_output=$(timeout 30m rclone copyto "$TMP_ZCODE_TAR" "dropbox:self-hosted/zcode.tar.gz" 2>&1); then
                  echo "[$(date '+%F %T')] zcode upload ok"
                  rm -f "$TMP_ZCODE_TAR"
                else
                  rc=$?
                  echo "[$(date '+%F %T')] ⚠️ zcode.tar.gz upload failed (rc=$rc): ${zcode_upload_output}"
                  send_telegram_alert "zcode.tar.gz" "上传失败 · 退出码 $rc" "rclone 上传失败" "${zcode_upload_output:-无输出}"
                fi
              else
                rc=$?
                if [ "$rc" -eq 200 ]; then
                  echo "[$(date '+%F %T')] ⏭️ previous archive still running, skip zcode archive"
                elif [ "$rc" -eq 3 ]; then
                  echo "[$(date '+%F %T')] ⏭️ zcode data dir missing, skip zcode archive (rc=3)"
                else
                  echo "[$(date '+%F %T')] ⚠️ zcode.tar.gz archive failed in periodic archive (rc=$rc): ${zcode_archive_output}"
                  send_telegram_alert "zcode.tar.gz" "归档失败 · 退出码 $rc" "归档脚本执行失败，详见原始输出" "${zcode_archive_output:-归档脚本无输出}"
                fi
              fi
            else
              echo "[$(date '+%F %T')] ℹ️ ~/.zcode/{cli,v2,server} 均不存在，跳过 zcode 归档"
            fi

          # ===== rss-to-telegram 数据归档（2026-10-06 新增）=====
          # 原先只在 job 收尾打一次，cancel / 360m 强杀时那一步没机会跑 ——
          # 实测云端 rsstt.tar.gz 曾落后本地 8.5 小时（回滚丢订阅列表与推送游标）。
          # 纳入周期循环后，回滚窗口从「一轮 job ≈6h」压到 20 分钟。
          rsstt_archive_output=""
          if rsstt_archive_output=$(flock -E 200 -n "$LOCK_RSSTT" timeout 20m bash /tmp/create-rsstt-archive.sh "$TMP_RSSTT_TAR" 2>&1); then
            echo "[$(date '+%F %T')] rsstt archive ok, uploading... ${rsstt_archive_output}"
            rsstt_upload_output=""
            if rsstt_upload_output=$(timeout 20m rclone copyto "$TMP_RSSTT_TAR" "dropbox:self-hosted/rsstt.tar.gz" 2>&1); then
              echo "[$(date '+%F %T')] rsstt upload ok"
              sudo rm -f "$TMP_RSSTT_TAR"
            else
              rc=$?
              echo "[$(date '+%F %T')] ⚠️ rsstt.tar.gz upload failed (rc=$rc): ${rsstt_upload_output}"
              send_telegram_alert "rsstt.tar.gz" "上传失败 · 退出码 $rc" "rclone 上传失败" "${rsstt_upload_output:-无输出}"
            fi
          else
            rc=$?
            if [ "$rc" -eq 200 ]; then
              echo "[$(date '+%F %T')] ⏭️ previous archive still running, skip rsstt archive"
            elif [ "$rc" -eq 3 ]; then
              # 目录不存在或只剩占位 .keep（容器没起来）：不打空包覆盖云端好包
              echo "[$(date '+%F %T')] ⏭️ rsstt data dir missing or empty, skip (rc=3)"
            else
              echo "[$(date '+%F %T')] ⚠️ rsstt.tar.gz archive failed in periodic archive (rc=$rc): ${rsstt_archive_output}"
              send_telegram_alert "rsstt.tar.gz" "归档失败 · 退出码 $rc" "归档脚本执行失败，详见原始输出" "${rsstt_archive_output:-归档脚本无输出}"
            fi
          fi

          # ===== zcode2api 数据快照归档（2026-10-06 新增）=====
          # 同上：原先单点收尾，实测云端落后本地约 5 小时（accounts.db md5 已分叉，
          # 本地 captchalog 当天日志云端包里没有）。承载账号池、用量与请求流水。
          z2a_archive_output=""
          if z2a_archive_output=$(flock -E 200 -n "$LOCK_Z2A" timeout 20m bash /tmp/create-zcode2api-data-archive.sh "$TMP_Z2A_DATA_TAR" 2>&1); then
            echo "[$(date '+%F %T')] zcode2api-data archive ok, uploading... ${z2a_archive_output}"
            z2a_upload_output=""
            if z2a_upload_output=$(timeout 20m rclone copyto "$TMP_Z2A_DATA_TAR" "dropbox:self-hosted/zcode2api-data.tar.gz" 2>&1); then
              echo "[$(date '+%F %T')] zcode2api-data upload ok"
              rm -f "$TMP_Z2A_DATA_TAR"
            else
              rc=$?
              echo "[$(date '+%F %T')] ⚠️ zcode2api-data.tar.gz upload failed (rc=$rc): ${z2a_upload_output}"
              send_telegram_alert "zcode2api-data.tar.gz" "上传失败 · 退出码 $rc" "rclone 上传失败" "${z2a_upload_output:-无输出}"
            fi
          else
            rc=$?
            if [ "$rc" -eq 200 ]; then
              echo "[$(date '+%F %T')] ⏭️ previous archive still running, skip zcode2api-data archive"
            elif [ "$rc" -eq 3 ]; then
              # 本轮 zcode2api 未部署（无 .env 也无 data/），跳过
              echo "[$(date '+%F %T')] ⏭️ zcode2api run dir missing, skip (rc=3)"
            else
              echo "[$(date '+%F %T')] ⚠️ zcode2api-data.tar.gz archive failed in periodic archive (rc=$rc): ${z2a_archive_output}"
              send_telegram_alert "zcode2api-data.tar.gz" "归档失败 · 退出码 $rc" "归档脚本执行失败，详见原始输出" "${z2a_archive_output:-归档脚本无输出}"
            fi
          fi

            sleep 1200
          done
          EOF
          chmod +x /tmp/openclaw-archive-loop.sh
          # 长驻服务一律 systemd 托管（2026-10-05 主人拍板）：归档循环崩溃后由
          # Restart=always 自愈，不再只能等下一轮 run。管理器缺失时退回原 nohup。
          # ⚠️ 这里必须用 ensure 而不是 restart：若已有裸跑实例，systemd 再起一个
          #    会造成**双份归档**同时上传同一 tar.gz（flock 抢锁、云端反复覆盖）。
          #    ensure 检测到裸跑就跳过，新 VM 上则由单元接管。
          if [ -f "$GITHUB_WORKSPACE/.github/scripts/services/services.sh" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/services/services.sh" ensure archive-loop || true
          fi
          if ! pgrep -f "openclaw-archive-loop.sh" >/dev/null 2>&1; then
            nohup bash /tmp/openclaw-archive-loop.sh > /tmp/openclaw-archive-loop.log 2>&1 &
            echo $! > /tmp/openclaw-archive-loop.launcher.pid
          fi

          # 凭据同步循环（每 5 分钟）：让运行期在 Dropbox 新增/删除/替换的 workbuddy*.json
          # 在几分钟内反映到 serve（它每 5 秒扫 cwd 热加载），而不是等下一轮。
          #
          # 2026-09-29 改 systemd --user 托管单入口（原为 nohup 起 + 写 pid 文件）：
          #   1) 本机约定「长驻服务一律 systemd 托管」：nohup 起的进程会被 exec 会话清理
          #      连坐杀掉，runner 重置后也无人拉起；systemd 自带 Restart=always 自愈。
          #   2) 收尾停止必须用 systemctl stop —— unit 是 Restart=always，pkill 会被
          #      systemd 在 RestartSec=10 秒后抢回来，表现为「停了又活」。
          # 2026-10-04 unit 真源统一进 services.sh：原先这里用 printf 内联写单元，
          #   与另外三个网关的 write_unit 双轨并存，改配置极易漏改一处。现与它们
          #   同口径，由 ensure 生成（含 TimeoutStopSec=180）并每轮重启一次。

      - name: Keep alive
        id: keepalive
        # 2026-10-23：失败轮也按正常轮的死线保活（主人要求）；Trigger next 仍只在
        # 成功轮触发，避免自动拉起下一轮顶掉调试窗口。
        if: ${{ !cancelled() && steps.dropbox_preflight.conclusion != 'failure' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # —— 动态保活（2026-10-01）：按 job 截止时刻算睡眠，不再写死 340 分钟 ——
          # 账目：GitHub 单 job 硬上限 360m；准备相 8-14m + 写死 340m + 最终归档
          # 11-15m = 359-369m，准备相稍长就被平台强杀（conclusion=cancelled）：
          # 最终归档被砍、「Trigger next」不跑、tailscale post-logout 不跑 → 僵尸占名。
          # 现改为死线 = 360 - 归档预算 20 - 安全余量 8 = 332 分钟（job 起点起算），
          # 已耗多少睡多少；job 起点由 rclone-install 步骤写 /tmp/job-start-epoch。
          HARD_LIMIT_MINUTES=360
          FINAL_ARCHIVE_BUDGET_MINUTES=20
          SAFETY_MARGIN_MINUTES=8
          DEADLINE_MINUTES=$((HARD_LIMIT_MINUTES - FINAL_ARCHIVE_BUDGET_MINUTES - SAFETY_MARGIN_MINUTES))
          # tr -dc '0-9'：文件存在但为空/含杂字符时兜底为 0，避免算术表达式炸掉步骤
          JOB_START_EPOCH="$(cat /tmp/job-start-epoch 2>/dev/null | tr -dc '0-9' || true)"
          [ -n "${JOB_START_EPOCH}" ] || JOB_START_EPOCH=0
          NOW_EPOCH="$(date +%s)"
          if [ "${JOB_START_EPOCH}" -le 0 ]; then
            # 时间戳缺失（理论兜底）：按已耗 32 分钟计，睡到死线，宁可少保活不越线
            JOB_START_EPOCH=$((NOW_EPOCH - 32*60))
          fi
          ELAPSED_SECONDS=$((NOW_EPOCH - JOB_START_EPOCH))
          SLEEP_SECONDS=$((DEADLINE_MINUTES*60 - ELAPSED_SECONDS))
          if [ "${SLEEP_SECONDS}" -lt 60 ]; then SLEEP_SECONDS=60; fi
          echo "Keep alive: job 已运行 $((ELAPSED_SECONDS/60))m$((ELAPSED_SECONDS%60))s，睡 $((SLEEP_SECONDS/60))m$((SLEEP_SECONDS%60))s 后进入最终归档（死线=job 起 ${DEADLINE_MINUTES}m）"
          FINAL_ARCHIVE_WARNING_BEFORE_MINUTES=15
          WARNING_DELAY_SECONDS=$((SLEEP_SECONDS - FINAL_ARCHIVE_WARNING_BEFORE_MINUTES*60))
          if [ "${WARNING_DELAY_SECONDS}" -lt 0 ]; then WARNING_DELAY_SECONDS=0; fi

          # 真源只在 step 顶层 source 一次（规范 4.4）：本函数会以 `&` 后台执行，
          # 函数体内再 source 只改子 shell 的函数表——调用点若对 send_tg 做本地
          # 覆写会被静默还原成真发，且子 shell 里看不出任何异常。
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"

          send_final_archive_warning() {
            sleep "${WARNING_DELAY_SECONDS}"
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              # 统一 HTML 版式 + 统一收尾区（真源已在 step 顶层 source，规范 4.4）
              msg=""
              tg_add_title msg "⚠️ OpenClaw 即将进入最终归档"
              # 值只写时长，"后执行"由标签「预计」表达（值不重复标签语义）
              tg_add_kv msg "预计" "约 ${FINAL_ARCHIVE_WARNING_BEFORE_MINUTES} 分钟"
              # kv 区集中连排；英文 token 不直出通知（规范 · 失败与异常）：步骤名写中文
              # 2026-10-29（A1/A1b）：归档期间网关与渠道均在线；渠道随批2先关，网关最后停
              tg_add_kv msg "随后执行" "最终归档（渠道在线）→ 停 AI 网关与上游 → 停 OpenClaw"
              # 说明段只装说明，且作末段（规范 · 说明段）：此前它插在两个 kv 之间
              tg_add_note msg "请及时保存状态或完成当前操作。"
              tg_add_footer msg
              # 统一走发送层（退化/429 重试内置）
              send_tg "$msg" alert || true
            else
              echo "⚠️ Telegram secrets missing, skip final archive warning."
            fi
          }

          send_final_archive_warning &
          echo $! > /tmp/openclaw-final-archive-warning.pid

          sleep "${SLEEP_SECONDS}"

      - name: Notify AI gateway usage report
        # 归档前发一份五网关用量汇总。插在 Keep alive 之后、最终归档之前：
        # 此时所有网关仍在运行（归档步骤里才开始逐个 stop），读到的是最新用量；
        # 放进归档步骤内部则会读到服务已停、数据不再更新的旧值。
        # 预检失败（Dropbox 配额不足）时网关从未部署，无用量可报。
        if: ${{ !cancelled() && steps.dropbox_preflight.conclusion != 'failure' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # 刻意不用 set -e：本报告是附加信息，任何一处失败都不该影响最终归档。
          # 凭据缺失时静默跳过（与全库其他通知同口径）。
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "⚠️ Telegram secrets missing, skip AI gateway usage report."
            exit 0
          fi
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"

          BOARD="/dropbox/self-hosted/quota-board/board.py"
          if [ ! -s "$BOARD" ]; then
            echo "⚠️ quota-board 缺失，跳过用量报告"
            exit 0
          fi

          # 渲染走 board.py CLI：与看板共用同一份采集与版式代码，
          # 不在 workflow 里另写一套（避免两边口径漂移）。
          # ⚠️ 2026-10-12 修：此前是 `2>/dev/null || true`，把 CLI 崩溃整个吞掉 ——
          #   实测 board.py usage-report 抛 NameError（render_usage_report 体内
          #   引用裸名 data，CLI 形态无上层作用域必崩），紧接着的 `-z "$REPORT"`
          #   判空走「渲染为空跳过发送」，既不报错也不告警，报告从未发出。
          #   改为：stderr 单独捕获，失败时退出码 + stderr 尾部都留痕
          #   （::warning:: 进 GH 注解），下次再炸立刻可见。
          _rp_err="$(mktemp)"
          REPORT="$(timeout 90 python3 "$BOARD" usage-report 2>"$_rp_err")"
          _rp_rc=$?
          if [ "$_rp_rc" -ne 0 ]; then
            echo "::warning::AI 网关用量报告渲染失败（不影响任务）: exit=${_rp_rc} stderr=$(tail -c 300 "$_rp_err" | tr '\n' ' ')"
            rm -f "$_rp_err"
            exit 0
          fi
          # 渲染成功但产出为空也留痕（可能是真的无数据，也可能是空输出 bug）
          if [ -z "$REPORT" ]; then
            echo "::warning::AI 网关用量报告渲染为空（退出码 0 但无输出），跳过发送"
            rm -f "$_rp_err"
            exit 0
          fi
          rm -f "$_rp_err"

          # 收尾区由 tg_notify.sh 统一追加（运行日志链接只有 workflow 侧知道）
          tg_add_footer REPORT
          send_tg "$REPORT" || echo "::warning::AI 网关用量报告发送失败（不影响任务）"

      - name: Stop OpenClaw and Final Archive
        id: final_archive
        # 2026-10-29 下线提速（A1/A2/A1b）：阶段顺序为「停归档循环 → 批1停服（仅 rsstt，
        # 非聊天路径）→ 阶段A归档（主包流式 ∥ zcode ∥ OmniRoute ∥ rsstt；渠道上游全在线）
        # → 批2：停 OmniRoute → 并行停上游网关 → z2a-data 归档 → 最后停网关（A1，段尾「7.」）」。
        # 网关硬下线压到 ~9s + 汇合后停机段；渠道不可用窗口从归档期全停的 ~12min 压到批2 的 ~30s。
        # OmniRoute 在上游之后启动、之前停止（主人拍板），避免「代理在线、渠道已死」的半开状态。
        # 阶段标签沿用历史编号（1 空缺，停网关为 7），避免跨轮日志 grep 断裂。
        # 兜底超时：动态死线 332m + 本步 24m + 通知/接力 ~2m = 358m < 360m 硬上限，
        # 卡死时走本超时干净失败（post 步骤仍会跑），而不是被平台 6h 强杀
        timeout-minutes: 24
        env:
          # send_archive_alert 同上：未注入时约 15 处最终归档告警静默不发
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # autoclaw 累计用量回推目标（2026-10-12 补）：本 step 是 set -euo pipefail，
          # 而 3b-1 的 rclone copyto 引用了 $AUTOCLAW_STATS_REMOTE —— 此前该变量**只在
          # run_autoclaw step 的 env 里定义**，本 step 取不到 → unbound variable 直接崩，
          # 3b-1 之后的 zcode2api/qingyan 停服与 Final Archive 全部不执行。
          # 与 run_autoclaw 的值保持一致（改需两处同改）。
          AUTOCLAW_STATS_REMOTE: dropbox:self-hosted/autoclaw-proxy/lifetime_stats.json
        # 预检失败（Dropbox 配额不足）时本轮没部署任何服务，归档会对着空环境
        # 发连环失败告警 —— 跳过，等空间腾出后的下一轮正常收尾。
        if: ${{ always() && steps.dropbox_preflight.conclusion != 'failure' }}
        run: |
          set -euo pipefail
          # 通知真源在 step 顶层 source 一次（勿挪进下面的函数体，理由见启动步骤同名注释 / 规范 4.4）
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"
          # 2026-10-22 对象级锁（值须与 Start background archive loop 侧保持一致，
          # 改需两处同改）：互斥粒度按对象分 —— 主包流式归档与四个小对象归档
          # 并行执行，各自只锁自己的对象，循环侧同理。
          LOCK_OPENCLAW="/tmp/openclaw-archive.lock.openclaw"
          LOCK_AIGW="/tmp/openclaw-archive.lock.aigateway"
          LOCK_ZCODE="/tmp/openclaw-archive.lock.zcode"
          LOCK_RSSTT="/tmp/openclaw-archive.lock.rsstt"
          LOCK_Z2A="/tmp/openclaw-archive.lock.zcode2api"
          echo "2. Killing background archive process..."
          if [ -f /tmp/openclaw-archive-loop.launcher.pid ]; then
            kill "$(cat /tmp/openclaw-archive-loop.launcher.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/openclaw-archive.pid ]; then
            kill "$(cat /tmp/openclaw-archive.pid)" 2>/dev/null || true
          fi
          # 2026-10-06 rc=23 根治：归档循环已由 systemd 托管（archive-loop.service，
          # Restart=always / RestartSec=30）。上面只 kill pid 的话，30s 后会被原样拉回，
          # 新实例启动即执行 cleanup_archive_outputs，rm -rf /tmp/openclaw-archive-stage.*
          # 恰好抹掉最终归档正在写入的 staging 目录 → rsync 全量 mkdir ENOENT → rc=23
          # （run 37396503543 即此形态：staging 43tN0K 06:33:29 建立、06:33:50 全量报错）。
          # 必须走 systemctl stop 并等 unit 退出 —— 与下方 cred-sync 的教训同一模式。
          if systemctl --user is-active --quiet archive-loop.service 2>/dev/null; then
            systemctl --user stop archive-loop.service 2>/dev/null || true
          fi
          for _i in $(seq 1 30); do
            if [ "$(systemctl --user is-active archive-loop.service 2>/dev/null || echo inactive)" != "active" ]; then
              break
            fi
            sleep 1
          done
          # 兜底：nohup 历史实例（无 unit 托管）或 stop 失败的残留进程，统一补杀
          pkill -f "bash /tmp/openclaw-archive-loop.sh" 2>/dev/null || true
          # 凭据同步循环：先停它再停 serve，避免它在本轮收尾期间又拉进新凭据
          # ⚠️ 2026-09-29：cred-sync 已改 systemd 托管，unit 是 Restart=always，
          #    pkill 会被 systemd 在 RestartSec=10 秒后抢回来（「停了又活」），
          #    必须走 systemctl stop。旧 pid 文件方式同步退役。

          # ── 2026-10-29 下线提速（A2/A1b）：停服分两批 ──
          # 批 1（此处）：仅 rss-to-telegram（非聊天路径），其数据归档在阶段A随行；
          # 批 2（见下方「6.」）：OmniRoute 先停 → 上游网关并行停（A1b，主人拍板）。
          # 渠道上游在主包流式归档（~10min）期间保持在线，聊天路径不中断。
          # 分支正文与串行版逐行一致（systemd stop / pkill 兜底 / 优雅等待 / 端口复测 /
          # TG 通知语义不变）；分支内 set +e，失败只留日志不掀收尾（2026-10-13 口径）。
          _stop_pids=""

          # ── A2 并行分支：3. rss-to-telegram 容器 ──
          (
            set +e
          echo "3. Stopping rss-to-telegram container (批1：非聊天路径；渠道上游保持在线)..."
          docker stop rss-to-telegram 2>/dev/null || echo "rss-to-telegram already stopped or missing."
          # OmniRoute 的显式 stop 在批次2（A1b：先于上游网关停止），此处不动它 ——
          # 阶段A的 sqlite 在线一致性备份依赖容器在跑。旧 CliRelay/CLIProxyAPI 容器已随迁移退役。

          ) & _stop_pids="$_stop_pids $!"

          # A2 汇合：等齐批1停服分支（分支失败只告警，不阻断后续归档/停机）
          for _sp in $_stop_pids; do
            wait "$_sp" || echo "⚠️ 停服并行分支 $_sp 非零退出（明细见上方分支日志）"
          done

          # 用法与版式同 send_telegram_alert（<对象> <结论> <原因> [原始输出]）；
          # 两个函数分处不同 step、无法共享定义，改版式时两处要一起改
          # （此前一个用 <i> 说明段、一个用 <b> kv，同一标题两种形态）
          # 对象 → 标题短名（与周期归档的 obj_label 同口径，两处脚本各自独立故各存一份）
          obj_label() {
            case "$1" in
              openclaw.tar.gz)                  echo "OpenClaw 主包" ;;
              zcode.tar.gz)                     echo "ZCode" ;;
              OmniRoute|OmniRoute.tar.gz)       echo "OmniRoute" ;;
              rsstt|rsstt.tar.gz)               echo "rss-to-telegram" ;;
              zcode2api-data.tar.gz)            echo "zcode2api 数据" ;;
              *)                                echo "$1" ;;
            esac
          }
          send_archive_alert() {
            local obj="$1" verdict="$2" reason="${3:-}" detail="${4:-}"
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              local run_id="${GITHUB_RUN_ID:-manual}"
              # 真源已在 step 顶层 source（规范 4.4）：本函数被收尾 step 在主 shell 里直接调用，
              # 函数体内再 source 一次会覆盖调用点的本地覆写（此前靠 source 幂等侥幸无碍）
              local full_msg=""
              # 标题区分阶段：周期归档与最终归档走两个函数，此前标题完全相同，
              # 读者分不清告警来自哪一轮（调用点里的 "final" 前缀已由本标题承担）
              tg_add_title full_msg "⚠️ 最终归档告警 · $(obj_label "$obj")"
              tg_add_path full_msg "对象" "$obj"
              tg_add_kv full_msg "结论" "$verdict"
              if [ -n "$reason" ]; then
                tg_add_kv full_msg "原因" "$reason"
              fi
              tg_add_path full_msg "Run ID" "$run_id"
              if [ -n "$detail" ]; then
                tg_add_section full_msg "🧾 原始输出"
                tg_add_pre full_msg "$(tg_tail_safe "$detail" 1200)"
              fi
              tg_add_footer full_msg
              send_tg "$full_msg" alert || true
            fi
          }

          # 归档结果累积（供收尾的「最终归档结果」通知读取）：对象 \t 结论 \t 字节 \t 备注
          # 结论由各归档分支当场判定（ok / fail / skip）——临时包成功上传后即被删除，
          # 事后无法再测大小，所以只能边归档边记，不能等收尾时反推。
          # 单独落文件而不是靠步骤内变量：通知在下一个 step，两者不共享 shell 作用域。
          FINAL_ARCHIVE_RESULTS="/tmp/openclaw-final-archive-results.tsv"
          : > "$FINAL_ARCHIVE_RESULTS"
          # 记录失败不得影响归档本身：本步骤是 set -e，写结果只是旁路副作用，
          # 磁盘写不进去时留一行日志继续（归档成功与否不该被一条统计记录左右）
          record_archive_result() {
            printf '%s\t%s\t%s\t%s\n' "$1" "$2" "${3:-0}" "${4:-}" >> "$FINAL_ARCHIVE_RESULTS" 2>/dev/null \
              || echo "⚠️ 归档结果记录失败（不影响归档）: $1 $2" >&2
          }
          # ── 通用：最终归档的「体积校验 → 上传 → 记结果 → 告警 → 清理」 ──
          # 2026-10-06 第三层归档统一：原先 zcode / zcode2api-data / CliRelay /
          # CLIProxyAPI / rsstt 各自写一遍这段，仅对象名与路径不同，行为完全一致。
          # 各家**打包**方式仍保留差异（脚本 vs 裸 tar、sudo vs 普通、flock 与否），
          # 只统一打包之后的收尾，避免误改打包语义。
          # 用法: upload_final_archive <对象名> <本地包路径> <远端目标> [最小字节]
          upload_final_archive() {
            local obj="$1" tar_path="$2" remote="$3" min_size="${4:-0}"
            local size out="" rc=0
            size=$(stat -c%s "$tar_path" 2>/dev/null || echo 0)
            if [ "${size:-0}" -lt "${min_size:-0}" ]; then
              echo "⚠️ ${obj} 压缩包小于最小阈值，放弃覆盖云端数据: size=${size} min=${min_size}"
              record_archive_result "$obj" fail 0 "压缩包小于最小阈值"
              send_archive_alert "$obj" "归档失败" "压缩包小于最小阈值 · 放弃覆盖云端数据" "size=$size min=$min_size output=$tar_path"
              return 1
            fi
            if out=$(rclone copyto "$tar_path" "$remote" -v --dropbox-chunk-size 128M 2>&1); then
              echo "final ${obj} archive/upload ok (${size} bytes)"
              record_archive_result "$obj" ok "$size"
              # 包可能由 root 产出（rsstt / CLIProxyAPI 用 sudo tar），普通 rm 会失败
              rm -f "$tar_path" 2>/dev/null || sudo rm -f "$tar_path" 2>/dev/null || true
              return 0
            else
              rc=$?
              echo "⚠️ final ${obj} upload failed (rc=$rc): ${out}"
              record_archive_result "$obj" fail 0 "上传失败 · 退出码 $rc"
              send_archive_alert "$obj" "上传失败 · 退出码 $rc" "rclone 上传失败" "${out:-无输出}"
              return 1
            fi
          }

          echo "4. Performing final archive to Dropbox (阶段A：主包∥zcode∥OmniRoute∥rsstt；渠道上游全在线)..."
          cleanup_archive_outputs() {
            rm -f /tmp/openclaw-final.tar.gz /tmp/rsstt.tar.gz /tmp/zcode-final.tar.gz 2>/dev/null || true
            # -final 后缀产物（2026-10-06）：与周期归档同名解耦后，清理也要跟着改名
            rm -f /tmp/OmniRoute-final.tar.gz /tmp/CliRelay-final.tar.gz 2>/dev/null || true
            sudo rm -f /tmp/CLIProxyAPI-final.tar.gz 2>/dev/null || true
            # 周期归档的同名产物仍照常清理（它可能残留自被 systemd 拉回的循环实例）
            rm -f /tmp/OmniRoute.tar.gz /tmp/CliRelay.tar.gz 2>/dev/null || true
            sudo rm -f /tmp/CLIProxyAPI.tar.gz 2>/dev/null || true
            # ── 2026-10-07 rc=23 根治：同上，staging 清理必须先抢到归档锁 ──
            # 本 step 自己在下方才 flock 持锁，此处若裸删通配 stage，会抹掉仍在
            # 写入的目录（循环实例 / 上一轮残留）。抢不到锁即跳过，由持有方回收。
            # 2026-10-22 对象级锁改造（与周期归档循环同口径）：staging 清理按对象
            # 分锁，锁被持有 = 该对象正在打包（收尾自己的并行分支或循环残留实例），
            # 只跳过该对象的 staging；其余对象照常清理。
            (
              flock -n 9 || exit 1
              rm -rf /tmp/openclaw-archive-stage.* 2>/dev/null || true
            ) 9>>"$LOCK_OPENCLAW" 2>/dev/null || echo "⚠️ 主包归档锁被持有，跳过其 staging 清理" >&2
            (
              flock -n 9 || exit 1
              rm -rf /tmp/omniroute-archive-stage.* /tmp/clirelay-archive-stage.* 2>/dev/null || true
              sudo rm -rf /tmp/cliproxyapi-archive-stage.* 2>/dev/null || true
            ) 9>>"$LOCK_AIGW" 2>/dev/null || echo "⚠️ AI 网关归档锁被持有，跳过其 staging 清理" >&2
            (
              flock -n 9 || exit 1
              rm -rf /tmp/zcode-archive-stage.* 2>/dev/null || true
            ) 9>>"$LOCK_ZCODE" 2>/dev/null || echo "⚠️ zcode 归档锁被持有，跳过其 staging 清理" >&2
            (
              flock -n 9 || exit 1
              sudo rm -rf /tmp/rsstt-archive-stage.* 2>/dev/null || true
            ) 9>>"$LOCK_RSSTT" 2>/dev/null || echo "⚠️ rsstt 归档锁被持有，跳过其 staging 清理" >&2
            (
              flock -n 9 || exit 1
              rm -rf /tmp/zcode2api-data-archive-stage.* 2>/dev/null || true
            ) 9>>"$LOCK_Z2A" 2>/dev/null || echo "⚠️ zcode2api 归档锁被持有，跳过其 staging 清理" >&2
          }
          free_kb() { df -Pk "${1:-/tmp}" | awk 'NR==2 {print $4}'; }
          require_free_kb() {
            local path="$1" min_kb="$2" label="$3"
            local avail
            avail=$(free_kb "$path")
            if [ "${avail:-0}" -lt "$min_kb" ]; then
              echo "❌ ${label}: insufficient free space at ${path}. available=${avail}KB required=${min_kb}KB" >&2
              # 2026-10-13 禁 exit（主人「一个打包出错不应该影响之后的打包」）：
              # 这里是容量预检，写 return 1 由调用方判定是否中止本归档项，
              # 不再用 exit 掀掉整个 set -e shell。
              return 1
            fi
            echo "✅ ${label}: free space ok at ${path}. available=${avail}KB required=${min_kb}KB"
            return 0
          }
          # 目录体积预估（KB）。第二参数传 sudo 则以 root 统计。
          # ⚠️ 2026-10-06 修：du 遇到不可读条目会往 stderr 报 "cannot access" 并以非 0
          #   退出；在 `set -euo pipefail` 下 pipefail 会把该非 0 透出，赋值语句失败
          #   即触发 set -e，整个最终归档步骤当场 exit 1（实测：backups/ 下一个
          #   600 权限的畸形路径就让本轮归档全部中止，云端主包停在上一轮）。
          #   体积只是容量预检，个别条目读不到不该掀桌：只记录 stderr，取到数字就继续。
          #   注：本函数仍可能因 set -u / set -o pipefail 透出非 0，调用点一律加 '|| true'
          #   兜底（2026-10-13 故障隔离改造，见主包/rsstt 两处调用点）。
          du_sk() {
            local target="$1" prefix="${2:-}" out=""
            out=$(${prefix} du -sk "$target" 2>/tmp/du-sk.err) || true
            if [ -s /tmp/du-sk.err ]; then
              echo "⚠️ du_sk: ${target} 部分条目不可读（已忽略，仅影响容量预估）：$(head -3 /tmp/du-sk.err | tr '\n' ' ')" >&2
              : > /tmp/du-sk.err
            fi
            awk 'NF{print $1; exit}' <<<"${out}"
          }
          cleanup_archive_outputs
          TMP_OPENCLAW_TAR="/tmp/openclaw-final.tar.gz"

          # 2026-10-13 故障隔离（主人「一个打包出错不应该影响之后的打包」）：
          # 预检失败只放弃 **openclaw 主包这一项** —— 记结果 + 告警 + 跳过打包主体，
          # 不再用 exit 1 掀掉整个归档 step（否则后面 zcode / zcode2api-data /
          # AI gateway / rsstt 全部陪葬，而这次事故正是被 autoclaw 回推一个
          # 非关键操作连带 disintegrate 的）。
          openclaw_src_kb=$(du_sk "$HOME/.openclaw" || true)
          # 2026-10-22 主包成分测量（瘦身决策用）：一级子目录体积 Top10 打进归档日志，
          # 纯观测，不影响任何分支。du -k 不可读条目照例忽略（同 du_sk 口径）。
          echo "=== openclaw main package composition (top-level, KB) ==="
          du -sk "$HOME/.openclaw"/* 2>/dev/null | sort -nr | head -10 || true
          # HEALTHY_RUN / PKG_BG_PID 必须先于 MAINPKG 分支定义：主包预检失败时
          # 下方 else 分支不执行、两个变量都不赋值，而汇合处（回退判定 + wait）
          # 都会读它们 —— set -u 下未定义变量会掀掉整个收尾 step。
          HEALTHY_RUN=0
          PKG_BG_PID=""
          MAINPKG_SKIP=""
          if [ -z "${openclaw_src_kb:-}" ] || [ "$openclaw_src_kb" -le 0 ]; then
            echo "❌ final openclaw archive preflight: unable to calculate source size" >&2
            MAINPKG_SKIP="源目录体积计算失败"
          elif ! require_free_kb /tmp $((openclaw_src_kb + 1024 * 1024)) "final openclaw archive preflight"; then
            MAINPKG_SKIP="/tmp 可用空间不足"
          else
            echo "OpenClaw 待归档目录大小: ${openclaw_src_kb}KB"
          fi
          if [ -n "$MAINPKG_SKIP" ]; then
            # 预检不过 = 本项失败，但归档 step 继续
            record_archive_result "openclaw.tar.gz" fail 0 "$MAINPKG_SKIP"
            send_archive_alert "openclaw.tar.gz" "归档失败" "$MAINPKG_SKIP · 放弃本轮主包归档" "预检未通过，云端主包保持上一轮状态；其余归档项继续执行"
          else
          openclaw_final_output=""
          ARCHIVE_DEST="dropbox:self-hosted/openclaw.tar.gz"
          STREAM_DEST="dropbox:self-hosted/.openclaw-streaming.tar.gz"
          HEALTHY_RUN=0
          if [ -f /tmp/run-openclaw-meta.env ] && grep -q '^RECORDED_SUCCESSFUL_OPENCLAW_VERSION=' /tmp/run-openclaw-meta.env; then
            HEALTHY_RUN=1
          else
            echo "ℹ️ Unhealthy run: main package will NOT be overwritten; failed state NOT uploaded."
          fi

          # 2026-10-22 流水线化（下线优化）：打包与上传并行。
          # 旧路径 = 打包 318s → 上传 380s（串行 698s，占收尾 77%）；
          # 新路径 = tar|pigz 直接管道给 `rclone rcat`，耗时压到 max(打包, 上传)。
          # 安全口径：先写临时对象，只有「流成功 + 远端体积 ≥ 源 30% + 本轮健康」
          # 才原子改名覆盖主包；任一环不满足都删临时对象并放弃覆盖（兜底 = 周期
          # 归档循环，≤20 分钟前刚上传过周期包；各失败分支均记结果 + 告警），
          # 云端主包在任何情况下都不会被半截包覆盖。
          # 2026-10-22 并行化（下线优化）：主包流式归档后台执行，四个小对象归档
          # 与它同时开跑 —— 收尾墙钟从「主包 + 小项之和」变成 ≈ max(主包, 小项)。
          PKG_BG_PID=""
          if [ "$HEALTHY_RUN" = "1" ]; then
            (
              # rc 文件最后定稿（0 仅在 moveto 成功后写）：汇合处的回退判定读它，
              # 先写 1 占位防读到空/陈旧值
              echo 1 > /tmp/openclaw-stream.rc
              echo "4a. Streaming main package (tar|pigz → rclone rcat)..."
              rclone deletefile "$STREAM_DEST" >/dev/null 2>&1 || true
              STREAM_BEGIN_TS=$(date +%s)
              # 2026-10-24 上传调优（本机 512MB A/B 实测）：dropbox 分片 48M→128M
              # 把上传从 21-26MB/s 提到 31-34MB/s（+30~40%）；--buffer-size 64M 对
              # rcat 无影响（单变量对照），故不保留。效果看归档日志 "streamed XB in Ys"。
              if flock -w 600 -E 200 "$LOCK_OPENCLAW" timeout 40m bash /tmp/create-openclaw-archive.sh - 2>/tmp/openclaw-stream.err | rclone rcat --dropbox-chunk-size 128M "$STREAM_DEST" 2>/tmp/openclaw-stream-upload.err; then
                stream_bytes=$(rclone size --json "$STREAM_DEST" 2>/dev/null | jq -r '.bytes // 0' 2>/dev/null || echo 0)
                case "${stream_bytes:-0}" in ''|*[!0-9]*) stream_bytes=0 ;; esac
                if [ "$stream_bytes" -ge $(( openclaw_src_kb * 1024 * 30 / 100 )) ]; then
                  # 2026-10-23 新增：体积门挡不住「明文日志头 + gzip 流」的坏包
                  # （run 39894704352 即此形态，恢复侧解包失败）。改名覆盖主包前
                  # 花 2 字节确认 gzip 魔数，坏流绝不落到 openclaw.tar.gz。
                  stream_magic=$(rclone cat --head 2 "$STREAM_DEST" 2>/dev/null | od -An -tx1 | tr -d ' \n')
                  if [ "$stream_magic" != "1f8b" ]; then
                    echo "⚠️ 流式包头部不是 gzip 魔数（${stream_magic:-empty}），放弃覆盖云端主包"
                  elif rclone moveto "$STREAM_DEST" "$ARCHIVE_DEST" >/tmp/openclaw-stream-move.log 2>&1; then
                    echo "final openclaw archive/upload ok (streamed ${stream_bytes}B in $(( $(date +%s) - STREAM_BEGIN_TS ))s) → $ARCHIVE_DEST"
                    record_archive_result "openclaw.tar.gz" ok "$stream_bytes" "流式覆盖主包"
                    echo 0 > /tmp/openclaw-stream.rc
                  else
                    echo "⚠️ 流式上传完成但原子改名失败：$(tail -n 3 /tmp/openclaw-stream-move.log 2>/dev/null)"
                  fi
                else
                  echo "⚠️ 流式包体积异常（${stream_bytes}B < 源 30%），放弃覆盖云端主包"
                fi
              else
                echo "⚠️ 流式打包/上传失败。stderr 尾部："
                tail -n 5 /tmp/openclaw-stream.err /tmp/openclaw-stream-upload.err 2>/dev/null || true
              fi
              rclone deletefile "$STREAM_DEST" >/dev/null 2>&1 || true
            ) &
            PKG_BG_PID=$!
            echo "🚀 主包流式归档已后台开跑（pid ${PKG_BG_PID}）"
          else
            # 2026-10-11 失败现场包退役（主人拍板，省配额）：不健康运行不上传，
            # 主包保持最后健康状态；本地故障状态随 runner 回收，失败通知已含诊断。
            echo "⏭️ unhealthy run, skip openclaw package upload (main package keeps last healthy state)"
          fi
          fi

          MIN_SIZE=$((5 * 1024))

          # ── 2026-10-22 并行化：四个小对象最终归档（原 4b/4c/5/6 串行段整体迁入
          # 本函数后台执行）。互斥口径与周期循环对齐（对象级锁，定义见循环侧）；
          # 失败由各分支当场 record + 告警，汇合处只等齐不打断（沿用 2026-10-13
          # 故障隔离口径：一个归档出错不影响其他归档与收尾通知）。
          run_small_archives() {
            # 4b. ZCode 个人数据（~/.zcode cli/ + v2/）
            if [ -d "$HOME/.zcode/cli" ] || [ -d "$HOME/.zcode/v2" ] || [ -d "$HOME/.zcode/server" ]; then
              TMP_ZCODE_FINAL_TAR="/tmp/zcode-final.tar.gz"
              if zcode_final_output=$(flock -w 600 -E 200 "$LOCK_ZCODE" timeout 40m bash /tmp/create-zcode-archive.sh "$TMP_ZCODE_FINAL_TAR" 2>&1); then
                # 体积骤降「只记录不拦截」且为做记录而跑的 rclone ls 已随并行化移除：
                # 它不参与任何判定，却给小对象归档串行加一次远端往返。
                upload_final_archive "zcode.tar.gz" "$TMP_ZCODE_FINAL_TAR" "dropbox:self-hosted/zcode.tar.gz" || true
              else
                rc=$?
                echo "⚠️ final zcode.tar.gz archive failed (rc=$rc): ${zcode_final_output}"
                record_archive_result "zcode.tar.gz" fail 0 "归档失败 · 退出码 $rc"
                send_archive_alert "zcode.tar.gz" "归档失败 · 退出码 $rc" "归档脚本执行失败，详见原始输出" "${zcode_final_output:-归档脚本无输出}"
              fi
            else
              echo "ℹ️ ~/.zcode/{cli,v2,server} 均不存在（本机从未部署 ZCode），跳过 ZCode 最终归档"
              record_archive_result "zcode.tar.gz" skip 0 "本机未部署 ZCode"
            fi

            # 5. AI 网关持久数据（backend-aware，三选一，口径同周期归档）
            ACTIVE_BACKEND="omniroute"
            if [ -f /tmp/active-ai-backend.env ]; then
              ACTIVE_BACKEND=$(grep '^ACTIVE_BACKEND=' /tmp/active-ai-backend.env | tail -n 1 | cut -d= -f2- || true)
            fi
            ACTIVE_BACKEND="${ACTIVE_BACKEND:-omniroute}"
            case "$ACTIVE_BACKEND" in
              clirelay)
                echo "生效后端: CliRelay → Final 归档 CliRelay.tar.gz"
                if [ -f "${CLIRELAY_DIR:-/tmp/local_CliRelay}/docker-compose.yml" ] || [ -f /tmp/local_CliRelay/docker-compose.yml ]; then
                  CLIRELAY_FINAL_TAR="/tmp/CliRelay-final.tar.gz"
                  if clirelay_final_output=$(flock -w 600 -E 200 "$LOCK_AIGW" timeout 40m bash /tmp/create-clirelay-archive.sh "$CLIRELAY_FINAL_TAR" 2>&1); then
                    upload_final_archive "CliRelay.tar.gz" "$CLIRELAY_FINAL_TAR" "dropbox:self-hosted/CliRelay.tar.gz" "$MIN_SIZE" || true
                  else
                    rc=$?
                    echo "⚠️ final CliRelay.tar.gz archive failed (rc=$rc): ${clirelay_final_output}"
                    record_archive_result "CliRelay.tar.gz" fail 0 "归档失败 · 退出码 $rc"
                    send_archive_alert "CliRelay.tar.gz" "归档失败 · 退出码 $rc" "归档脚本执行失败，详见原始输出" "${clirelay_final_output:-归档脚本无输出}"
                  fi
                else
                  echo "⚠️ /tmp/local_CliRelay 不存在，跳过 CliRelay 归档"
                  record_archive_result "CliRelay.tar.gz" fail 0 "部署目录未初始化"
                  send_archive_alert "CliRelay.tar.gz" "归档失败 · 退出码 3" "CliRelay 本地部署目录未初始化 · 通常表示回退路径未执行" "clirelay_dir_missing"
                fi
                ;;
              cliproxyapi)
                echo "生效后端: CLIProxyAPI → Final 归档 CLIProxyAPI.tar.gz"
                if [ -d /tmp/local_CLIPProxyAPI ]; then
                  CLIPROXYAPI_FINAL_TAR="/tmp/CLIProxyAPI-final.tar.gz"
                  if cliproxyapi_final_output=$(flock -w 600 -E 200 "$LOCK_AIGW" timeout 40m bash /tmp/create-cliproxyapi-archive.sh "$CLIPROXYAPI_FINAL_TAR" 2>&1); then
                    upload_final_archive "CLIProxyAPI.tar.gz" "$CLIPROXYAPI_FINAL_TAR" "dropbox:self-hosted/CLIProxyAPI.tar.gz" "$MIN_SIZE" || true
                  else
                    rc=$?
                    echo "⚠️ final CLIProxyAPI.tar.gz archive failed (rc=$rc): ${cliproxyapi_final_output}"
                    record_archive_result "CLIProxyAPI.tar.gz" fail 0 "归档失败 · 退出码 $rc"
                    send_archive_alert "CLIProxyAPI.tar.gz" "归档失败 · 退出码 $rc" "归档脚本执行失败，详见原始输出" "${cliproxyapi_final_output:-归档脚本无输出}"
                  fi
                else
                  echo "⚠️ /tmp/local_CLIPProxyAPI 不存在，跳过 CLIProxyAPI 归档"
                  record_archive_result "CLIProxyAPI.tar.gz" fail 0 "数据目录未初始化"
                  send_archive_alert "CLIProxyAPI.tar.gz" "归档失败 · 退出码 3" "CLIProxyAPI 本地数据目录未初始化 · 通常表示回退路径未执行" "cliproxyapi_dir_missing"
                fi
                ;;
              *)
                echo "生效后端: OmniRoute → Final 归档 OmniRoute.tar.gz"
                if [ -f /home/runner/omniroute/docker-compose.yml ]; then
                  OMNIROUTE_FINAL_TAR="/tmp/OmniRoute-final.tar.gz"
                  if omniroute_final_output=$(flock -w 600 -E 200 "$LOCK_AIGW" timeout 40m bash /tmp/create-omniroute-archive.sh "$OMNIROUTE_FINAL_TAR" 2>&1); then
                    upload_final_archive "OmniRoute.tar.gz" "$OMNIROUTE_FINAL_TAR" "dropbox:self-hosted/OmniRoute.tar.gz" "$MIN_SIZE" || true
                  else
                    rc=$?
                    echo "⚠️ final OmniRoute.tar.gz archive failed (rc=$rc): ${omniroute_final_output}"
                    record_archive_result "OmniRoute.tar.gz" fail 0 "归档失败 · 退出码 $rc"
                    send_archive_alert "OmniRoute.tar.gz" "归档失败 · 退出码 $rc" "归档脚本执行失败，详见原始输出" "${omniroute_final_output:-归档脚本无输出}"
                  fi
                else
                  echo "⚠️ /home/runner/omniroute 不存在，跳过 OmniRoute 归档"
                  record_archive_result "OmniRoute.tar.gz" fail 0 "部署目录未初始化"
                  send_archive_alert "OmniRoute.tar.gz" "归档失败 · 退出码 3" "OmniRoute 本地部署目录未初始化 · /home/runner/omniroute 不存在 · 通常表示 OmniRoute 启动步骤被跳过或失败" "omniroute_dir_missing"
                fi
                ;;
            esac

            # 6. rss-to-telegram 数据
            if [ -d /tmp/local_rsstt ]; then
              rsstt_src_kb=$(du_sk /tmp/local_rsstt sudo || true)
              RSSTT_SKIP=0
              if [ -z "${rsstt_src_kb:-}" ] || [ "$rsstt_src_kb" -le 0 ]; then
                echo "❌ final rsstt archive preflight: unable to calculate source size" >&2
                RSSTT_SKIP=1
              elif ! require_free_kb /tmp $((rsstt_src_kb + 512 * 1024)) "final rsstt archive preflight"; then
                RSSTT_SKIP=1
              else
                echo "rsstt 待归档目录大小: ${rsstt_src_kb}KB"
              fi
              if [ "$RSSTT_SKIP" = "1" ]; then
                record_archive_result "rsstt.tar.gz" fail 0 "预检未通过（体积计算或 /tmp 空间）"
                send_archive_alert "rsstt.tar.gz" "归档失败" "预检未通过 · 放弃本轮 rsstt 归档" "云端 rsstt.tar.gz 保持上一轮状态；其余归档项已执行"
              else
                sudo rm -f /tmp/rsstt.tar.gz
                # 目录里只剩占位 .keep = 本轮容器没起来（凭据缺失/启动失败）：
                # 此时打包上传只会用空包覆盖云端 rsstt.tar.gz，直接跳过并说明原因
                rsstt_data_files=$(sudo find /tmp/local_rsstt -type f ! -name '.keep' 2>/dev/null | wc -l || true)
                if [ "$((rsstt_data_files + 0))" -lt 1 ]; then
                  echo "⚠️ rss-to-telegram 本轮没有产生数据文件，跳过归档，云端 rsstt.tar.gz 保持原状"
                  record_archive_result "rsstt.tar.gz" skip 0 "本轮未产生数据"
                  send_archive_alert "rsstt.tar.gz" "归档跳过" "本轮 rss-to-telegram 未产生数据 · 云端归档保持原状未覆盖" "data_files=0 dir=/tmp/local_rsstt"
                elif rsstt_tar_output=$(sudo tar -czf /tmp/rsstt.tar.gz -C /tmp/local_rsstt . 2>&1); then
                  # root 产出的包由 runner 身份的 rclone 上传，显式放开读权限
                  sudo chmod 644 /tmp/rsstt.tar.gz 2>/dev/null || true
                  if rsstt_validate_output=$(sudo tar -tzf /tmp/rsstt.tar.gz 2>&1); then
                    upload_final_archive "rsstt.tar.gz" "/tmp/rsstt.tar.gz" "dropbox:self-hosted/rsstt.tar.gz" "$MIN_SIZE" || true
                  else
                    rc=$?
                    echo "⚠️ final rsstt.tar.gz validation failed (rc=$rc): ${rsstt_validate_output}"
                    record_archive_result "rsstt.tar.gz" fail 0 "归档校验失败 · 退出码 $rc"
                    send_archive_alert "rsstt.tar.gz" "归档校验失败 · 退出码 $rc" "tar 列表校验失败" "${rsstt_validate_output:-无输出}"
                  fi
                else
                  rc=$?
                  echo "⚠️ final rsstt.tar.gz archive failed (rc=$rc): ${rsstt_tar_output}"
                  record_archive_result "rsstt.tar.gz" fail 0 "归档失败 · 退出码 $rc"
                  send_archive_alert "rsstt.tar.gz" "归档失败 · 退出码 $rc" "tar 创建失败" "${rsstt_tar_output:-无输出}"
                fi
              fi
            else
              echo "⚠️ /tmp/local_rsstt 不存在，跳过 rss-to-telegram 归档"
              record_archive_result "rsstt.tar.gz" fail 0 "数据目录未初始化"
              send_archive_alert "rsstt.tar.gz" "归档失败 · 退出码 3" "rss-to-telegram 本地数据目录未初始化 · /tmp/local_rsstt 不存在 · 通常表示 rss-to-telegram 容器启动步骤被跳过或失败" "rsstt_dir_missing"
            fi
          }
          run_small_archives &
          SMALL_ARCHIVES_PID=$!
          echo "🚀 小对象归档（zcode / zcode2api / AI 网关 / rsstt）已后台并行开跑（pid ${SMALL_ARCHIVES_PID}）"

          # 汇合两路后台归档（子 shell 内失败已各自记结果 + 告警，这里只等齐）。
          # wait 的非零退出在 set -e 下以 || 兜住：单路失败不影响本 step 继续收尾。
          if [ -n "$PKG_BG_PID" ]; then
            wait "$PKG_BG_PID" || echo "⚠️ 主包归档后台任务退出码非零（明细见上方分支日志）"
          fi

          # ── 主包回退旧路径（ee6a3d5 保留的兜底，并行化后语义不变）：仅当本轮
          # 健康且流式未成功（打包/上传失败、体积门不过、改名失败）时执行。
          # 此时小对象归档仍在后台跑，互斥由对象级锁保证；回退期间不再阻塞它们。
          if [ "$HEALTHY_RUN" = "1" ] && [ "$(cat /tmp/openclaw-stream.rc 2>/dev/null || echo 1)" != "0" ]; then
            echo "4a-fallback. 流式未成功，回退旧路径（本地打包 → 校验 → 上传）..."
            if openclaw_final_output=$(flock -w 600 -E 200 "$LOCK_OPENCLAW" timeout 40m bash /tmp/create-openclaw-archive.sh "$TMP_OPENCLAW_TAR" 2>&1); then
              if openclaw_final_upload_output=$(rclone copyto "$TMP_OPENCLAW_TAR" "$ARCHIVE_DEST" -v --dropbox-chunk-size 128M 2>&1); then
                # 大小必须在 rm 之前取——成功上传后临时包即被删除，事后测不到
                openclaw_final_size=$(stat -c%s "$TMP_OPENCLAW_TAR" 2>/dev/null || echo 0)
                echo "final openclaw archive/upload ok (fallback) → $ARCHIVE_DEST: ${openclaw_final_output}"
                record_archive_result "openclaw.tar.gz" ok "$openclaw_final_size" "回退路径覆盖主包"
                rm -f "$TMP_OPENCLAW_TAR"
              else
                rc=$?
                echo "⚠️ final openclaw.tar.gz upload failed (rc=$rc): ${openclaw_final_upload_output}"
                record_archive_result "openclaw.tar.gz" fail 0 "上传失败 · 退出码 $rc"
                send_archive_alert "openclaw.tar.gz" "上传失败 · 退出码 $rc" "rclone 上传失败" "${openclaw_final_upload_output:-无输出}"
              fi
            else
              rc=$?
              echo "⚠️ final openclaw.tar.gz archive failed (rc=$rc): ${openclaw_final_output}"
              record_archive_result "openclaw.tar.gz" fail 0 "归档失败 · 退出码 $rc"
              send_archive_alert "openclaw.tar.gz" "归档失败 · 退出码 $rc" "归档脚本执行失败，详见原始输出" "${openclaw_final_output:-归档脚本无输出}"
            fi
          fi

          wait "$SMALL_ARCHIVES_PID" || echo "⚠️ 小对象归档后台任务退出码非零（明细见上方分支日志）"
          echo "✅ 阶段A归档汇合完成（主包+zcode+OmniRoute+rsstt；渠道上游仍在线）"
          # ── 2026-10-29 A1b（主人拍板）：渠道停止收口 —— OmniRoute 先停，上游网关随后 ──
          # 阶段A期间渠道上游全在线，聊天不中断；此处 OmniRoute 一停聊天路径立刻干净
          # 关闭，上游并行排空、不再接收「代理在线、渠道已死」的失败流量（避免 circuit
          # breaker 污染），全部停妥后才进入「7.」停网关。
          echo "6. Stopping AI stack (A1b: OmniRoute 先停 → 上游网关并行停)..."
          docker stop omniroute 2>/dev/null || echo "omniroute already stopped or missing."
          _stop_pids=""

          # ── A2 并行分支：3b. workbuddy-gateway ──
          (
            set +e
          # workbuddy-gateway 是宿主进程（非容器），必须显式停：它不会随 job 结束自动退出，
          # 留在后台会继续持凭据轮询上游。运行目录在本地盘，停止后需回推 Dropbox 才算落盘。
          # 服务已 systemd --user 化，必须走 systemctl stop —— pkill 会被单元的
          # Restart=always 在 5 秒内拉回，「等待退出」循环会误判进程残留。
          # pkill 兜底只针对过渡期残留的非托管实例（旧版 nohup 起的进程不在单元里）。
          echo "3b. Stopping workbuddy-gateway..."
          WB_DIR="/dropbox/self-hosted/workbuddy-gateway"
          WB_BIN="/tmp/local_workbuddy/workbuddy-gateway"
          bash "$GITHUB_WORKSPACE/.github/scripts/services/services.sh" stop workbuddy || true
          if systemctl --user is-failed --quiet workbuddy-gateway.service 2>/dev/null; then
            systemctl --user reset-failed workbuddy-gateway.service 2>/dev/null || true
          fi
          pkill -f "$WB_BIN serve" 2>/dev/null || true
          # 给进程 30 秒优雅退出（写完状态快照），仍在则强杀
          WB_STOPPED=0
          for _ in $(seq 1 30); do
            if ! pgrep -f "$WB_BIN serve" >/dev/null 2>&1; then
              WB_STOPPED=1
              break
            fi
            sleep 1
          done
          if [ "$WB_STOPPED" != "1" ]; then
            echo "⚠️ workbuddy-gateway 未在 30 秒内退出，强制结束"
            pkill -9 -f "$WB_BIN serve" 2>/dev/null || true
          fi
          WB_STILL_RUNNING=0
          # 末尾 || true：本步骤是 set -e，pgrep 无匹配返回 1 会让整段提前退出、通知发不出去
          pgrep -f "$WB_BIN serve" >/dev/null 2>&1 && WB_STILL_RUNNING=1 || true
          # workbuddy 进程已停 → 回推运行目录（含 serve 写出的 workbuddy-status.json 与 logs/）。
          # 只 copy 不 sync：远端的历史日志不该被本轮删掉。失败不阻塞收尾通知。
          # 周期回推循环（每 5 分钟）此时已被 kill，这里做的是最终兜底 + 让 logs/ 也落盘。
          echo "3b-1. Syncing workbuddy data back to Dropbox..."
          # 排除版本化二进制：运行目录里每个历史版本都留下 workbuddy-gateway-<ver>
          # （含 -current / -darwin-arm64），回推时无 exclude 会整批推上 Dropbox，
          # 实测堆积 17 个共 155MB。二进制由本步骤每轮从 GitHub Releases 重拉，
          # 不需要持久化；只回推凭据/状态/用量等真数据。
          # ⚠️ 2026-10-06：workbuddy 的 WorkingDirectory 已改为 Dropbox（数据直写），
          # 故本回推**不再是主路径**，只作兜底（例如 cwd 曾被回退到 /tmp 的旧轮次）。
          # 必须加 --ignore-existing：否则 /tmp 里可能残留比 Dropbox 更旧的副本
          # （rclone copy 默认按大小/时间覆盖），会把直写的新数据倒退回旧版本。
          # 只补远端没有的文件，绝不覆盖已存在的。
          # 兜底回推已退役（2026-10-07）：WorkingDirectory 直指 Dropbox 后数据全程直写，无需回推
          echo "ℹ️ workbuddy 数据直写 Dropbox，跳过兜底回推"
          WB_VER="$(head -n 1 "$WB_DIR/.installed-version" 2>/dev/null || true)"
          # 顺带核对凭据是否已进运行目录（运行期新上传的凭据应出现在这里）
          ls -la "$WB_DIR"/workbuddy*.json 2>/dev/null | head -10 || true

          wb_stop_notify() {
            # 收尾停止通知。版式与运行步骤里的 wb_notify 同源（docs/telegram-notify.md
            # 2.5 workbuddy 段）——两者分处不同 step、shell 不共享，只能各存一份副本，
            # 改版式必须两处一起改，这是这类双份实现最容易「改一处漏一处」的地方。
            # 收尾没有 WB_CREDS / WB_POOL（那是启动步骤的局部变量），本函数只出
            # 结论 + 版本 + 数据目录：网关已停，再列账号池会让人以为服务还在跑。
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              local _msg=""
              tg_add_title _msg "$1"
              tg_add_kv _msg "结论" "$2"
              [ -n "${WB_VER:-}" ] && tg_add_path _msg "版本" "$WB_VER"
              tg_add_path _msg "数据目录" "$WB_DIR"
              tg_add_footer _msg
              send_tg "$_msg" alert || echo "::warning::TG 通知发送失败（不影响任务）"
            else
              echo "⚠️ Telegram secrets missing, skip workbuddy-gateway stop notification."
            fi
          }
          # 2026-10-22 下线提速：停止通知后台发送（send_tg 内置 429 重试，慢发
          # 不该占收尾关键路径）；子 shell 内解除 set -e，失败只留日志不掀桌
          (
            set +e
            if [ "$WB_STILL_RUNNING" = "1" ]; then
              wb_stop_notify "⚠️ workbuddy-gateway 已停止 · 进程残留" "强制结束后仍有进程残留"
            else
              wb_stop_notify "⛔ workbuddy-gateway 已停止" "服务已退出 · 数据目录保持原状"
            fi
          ) &

          ) & _stop_pids="$_stop_pids $!"

          # ── A2 并行分支：3b-1. autoclaw-proxy ──
          (
            set +e
          # 3b-1. autoclaw-proxy：宿主进程（2026-10-12 起 systemd --user 托管，
          #     原 nohup 裸跑已废 —— pkill 会被 Restart=always 拉回，必须走 systemctl）。
          #     lifetime_stats.json 是唯一不可再生的运行数据（累计用量统计），2026-10-12
          #     主人拍板入 Dropbox：启动时拉回续计，此处回推最终值。回推在停进程**之前**
          #     执行 —— proxy 运行中该文件会被周期改写，停止前的最后一次读取即终值，
          #     停后再读反而可能与退出写竞态。
          echo "3b-1. Pushing autoclaw-proxy lifetime stats & stopping..."
          if [ -f /tmp/local_autoclaw-proxy/app/lifetime_stats.json ]; then
            if rclone copyto /tmp/local_autoclaw-proxy/app/lifetime_stats.json "$AUTOCLAW_STATS_REMOTE" 2>/dev/null; then
              echo "✅ autoclaw lifetime_stats 回推 Dropbox 完成"
            else
              echo "::warning::[autoclaw] lifetime_stats 回推失败（下轮启动会以本地残留续计，VM 销毁才丢）"
            fi
          fi
          # 停止必须走 services.sh stop（systemctl stop，非 pkill）：Restart=always 会把
          # pkill 杀掉的进程 5 秒内拉回来，「等待退出」循环误判进程残留（zcode2api 同款教训）。
          bash "$GITHUB_WORKSPACE/.github/scripts/services/services.sh" stop autoclaw || true
          if systemctl --user is-failed --quiet autoclaw.service 2>/dev/null; then
            systemctl --user reset-failed autoclaw.service 2>/dev/null || true
          fi
          AC_STILL_RUNNING=0
          if (exec 3<> /dev/tcp/127.0.0.1/8322) 2>/dev/null; then
            AC_STILL_RUNNING=1
            echo "⚠️ autoclaw-proxy 仍在监听 8322"
          else
            echo "✅ autoclaw-proxy 已停止"
          fi

          # 停服通知（口径对齐 zcode2api/qingyan/workbuddy 的 3b/3c/3d）：
          # 每轮收尾都发，与下一轮的「已就绪」配对，肉眼可确认服务生命周期闭环。
          # 2026-10-19 补 —— 此前四个本地网关里只有 autoclaw 只 echo 不发通知，
          # 服务被停这件事在主对话里无人知晓（仅剩启动步骤的失败告警可见）。
          # 2026-10-22 下线提速：停止通知后台发送（send_tg 内置 429 重试）；
          # 子 shell 内解除 set -e，失败只留日志
          (
            set +e
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              _m=""
              if [ "$AC_STILL_RUNNING" = "1" ]; then
                tg_add_title _m "⚠️ autoclaw-proxy 已停止 · 进程残留"
                tg_add_kv _m "结论" "强制结束后仍有进程残留"
              else
                tg_add_title _m "⛔ autoclaw-proxy 已停止"
                tg_add_kv _m "结论" "服务已退出 · 数据目录保持原状"
              fi
              tg_add_path _m "端口" "8322"
              tg_add_footer _m
              send_tg "$_m" alert || true
            fi
          ) &

          ) & _stop_pids="$_stop_pids $!"

          # ── A2 并行分支：3c. zcode2api ──
          (
            set +e
          # 3c. zcode2api：同为宿主进程（非容器），不会随 job 结束自动退出，
          # 必须显式停，否则残留进程会一直持有 8319 并继续转发请求。
          # 顺序在 workbuddy（3b）之后：两者互不依赖，但 3c 之后就是容器归档，
          # 宿主进程清理集中放在 3b/3c 两段便于对照。
          echo "3c. Stopping zcode2api..."
          # 服务已 systemd --user 化，必须走 systemctl stop（pkill 会被
          # Restart=always 拉回，见 3b 注释）。pkill 兜底只针对过渡期残留的
          # 非托管实例；先 SIGTERM 优雅退出（uvicorn 收尾 in-flight 请求）。
          bash "$GITHUB_WORKSPACE/.github/scripts/services/services.sh" stop zcode2api || true
          if systemctl --user is-failed --quiet zcode2api.service 2>/dev/null; then
            systemctl --user reset-failed zcode2api.service 2>/dev/null || true
          fi
          pkill -f "local_zcode2api.*cli\.py serve" 2>/dev/null || true
          sleep 2
          pkill -9 -f "local_zcode2api.*cli\.py serve" 2>/dev/null || true
          Z2A_STILL_RUNNING=0
          if (exec 3<> /dev/tcp/127.0.0.1/8319) 2>/dev/null; then
            Z2A_STILL_RUNNING=1
            echo "⚠️ zcode2api 仍在监听 8319"
          else
            echo "✅ zcode2api 已停止"
          fi

          # 停止通知（口径对齐 workbuddy 的 3b 停止通知）：每轮收尾都发，
          # 与下一轮的「已就绪」配对，肉眼可确认服务生命周期闭环。
          # 2026-10-22 下线提速：停止通知后台发送（send_tg 内置 429 重试）；
          # 子 shell 内解除 set -e，失败只留日志
          (
            set +e
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              _m=""
              if [ "$Z2A_STILL_RUNNING" = "1" ]; then
                tg_add_title _m "⚠️ zcode2api 已停止 · 进程残留"
                tg_add_kv _m "结论" "强制结束后仍有进程残留"
              else
                tg_add_title _m "⛔ zcode2api 已停止"
                tg_add_kv _m "结论" "服务已退出 · 数据目录保持原状"
              fi
              tg_add_path _m "端口" "8319"
              tg_add_footer _m
              send_tg "$_m" alert || true
            fi
          ) &

          ) & _stop_pids="$_stop_pids $!"

          # ── A2 并行分支：3d. qingyan-proxy ──
          (
            set +e
          # 3d. qingyan-proxy：同为宿主进程（非容器），随 job 结束不会自动退出，
          # 必须显式停，否则残留进程会一直持有 8320 并继续消耗清言积分。
          echo "3d. Stopping qingyan-proxy..."
          bash "$GITHUB_WORKSPACE/.github/scripts/services/services.sh" stop qingyan || true
          if systemctl --user is-failed --quiet qingyan.service 2>/dev/null; then
            systemctl --user reset-failed qingyan.service 2>/dev/null || true
          fi
          # 注：此处原有按旧运行目录匹配进程的 pkill，进程实际跑在 Dropbox 路径
          # （/usr/bin/python3 /dropbox/.../app/proxy.py），该匹配已永远命中不了，
          # 作为死代码删除；停服由上面的 services.sh stop 覆盖。

          # 3d-1 回推已移除（2026-10-06）：qingyan 全面直写 Dropbox（代码/数据/凭据/日志），
          # 原本的「停进程 → 回推 data 到 Dropbox」已无意义（DATA_DIR 与 DATA_REMOTE
          # 指向同一目录，是「自己同步自己」的 no-op），故不再调用 deploy.sh push。
          echo "3d-1. qingyan 数据直写 Dropbox，无需回推"

          GL_STILL_RUNNING=0
          if (exec 3<> /dev/tcp/127.0.0.1/8320) 2>/dev/null; then
            GL_STILL_RUNNING=1
            echo "⚠️ qingyan-proxy 仍在监听 8320"
          else
            echo "✅ qingyan-proxy 已停止"
          fi
          # 2026-10-22 下线提速：停止通知后台发送（send_tg 内置 429 重试）；
          # 子 shell 内解除 set -e，失败只留日志
          (
            set +e
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              _m=""
              if [ "$GL_STILL_RUNNING" = "1" ]; then
                tg_add_title _m "⚠️ qingyan-proxy 已停止 · 进程残留"
                tg_add_kv _m "结论" "强制结束后仍有进程残留"
              else
                tg_add_title _m "⛔ qingyan-proxy 已停止"
                tg_add_kv _m "结论" "服务已退出 · 运行目录保持原状"
              fi
              tg_add_path _m "端口" "8320"
              tg_add_footer _m
              send_tg "$_m" alert || true
            fi
          ) &

          ) & _stop_pids="$_stop_pids $!"

          # A2 汇合：等齐全部停服分支（分支失败只告警，不阻断后续归档/停机）
          for _sp in $_stop_pids; do
            wait "$_sp" || echo "⚠️ 停服并行分支 $_sp 非零退出（明细见上方分支日志）"
          done

          # 6a. zcode2api 数据快照（.env + data/；A1b 移至批次2 —— zcode2api 已停，accounts.db 静默）
          Z2A_RUN_DIR="/tmp/local_zcode2api"
          if [ -f "$Z2A_RUN_DIR/.env" ] && [ -f "$Z2A_RUN_DIR/data/accounts.db" ]; then
            TMP_Z2A_FINAL_TAR="/tmp/zcode2api-data-final.tar.gz"
            rm -f "$TMP_Z2A_FINAL_TAR"
            if z2a_final_output=$(tar -czf "$TMP_Z2A_FINAL_TAR" -C "$Z2A_RUN_DIR" .env data 2>&1) \
              && [ -s "$TMP_Z2A_FINAL_TAR" ]; then
              upload_final_archive "zcode2api-data.tar.gz" "$TMP_Z2A_FINAL_TAR" "dropbox:self-hosted/zcode2api-data.tar.gz" || true
            else
              rc=$?
              echo "⚠️ final zcode2api-data.tar.gz archive failed (rc=$rc): ${z2a_final_output}"
              record_archive_result "zcode2api-data.tar.gz" fail 0 "打包失败 · 退出码 $rc"
              send_archive_alert "zcode2api-data.tar.gz" "归档失败 · 退出码 $rc" "打包失败" "${z2a_final_output:-无输出}"
            fi
          else
            echo "ℹ️ $Z2A_RUN_DIR 缺 .env 或 data/accounts.db（本轮 zcode2api 未部署），跳过其数据归档"
            record_archive_result "zcode2api-data.tar.gz" skip 0 "本轮未部署"
          fi


          # ── 2026-10-29 下线提速（A1）：网关停止从收尾第一步后置到最后一步 ──
          # 原顺序 = 停网关 → 停服/归档，网关下线窗口 = 整个收尾（实测 647s）。
          # 主包归档脚本（create-openclaw-archive.sh）本就是周期归档循环每 20 分钟对
          # 活树执行的那份（关键文件隔离快照/keep-dir 回填/体积门等防线同源），最终
          # 归档复用同口径在网关运行中打包。一致性口径：与周期归档一致（本就接受
          # ≤20 分钟回滚窗口），最终包内容 = 归档启动时刻的快照，距实际停机差归档耗时。
          echo "7. Stopping OpenClaw gateway (A1: 最后停机 — 归档全部汇合后再停)..."
          # 2026-10-21 修复（run 39515245551 日志实证）：`openclaw gateway stop` 在非交互
          # shell 下**拒绝执行**——05:00:44 打出 "…or re-run with --force if you really mean
          # it."，紧接着 `|| echo "already stopped or command failed"` 把这条失败吃成静默，
          # 于是这条停止命令从来没生效过：60s 轮询干等到 05:01:45（整 60s 白花），最终归档
          # 全程对着**仍在写盘的 ~/.openclaw** 打包（state sqlite 连 -wal 都是活体快照）。
          # --force 就是给这种场景的显式确认（`stop --help`: "Allow stop from a non-interactive
          # shell"），语义正确；timeout 60 防 CLI 自身卡死；本步骤是 set -e，用 if 包裹，
          # 停止失败只降级告警、不打断收尾（还有 6 个归档要做）。
          GW_STOP_LOG=/tmp/openclaw-gateway-stop.log
          if timeout 60 openclaw gateway stop --force >"$GW_STOP_LOG" 2>&1; then
            echo "openclaw gateway stop --force 已执行"
          else
            echo "⚠️ openclaw gateway stop --force 失败（rc=$?），日志尾部："
            tail -n 20 "$GW_STOP_LOG" 2>/dev/null || true
          fi
          # 优化（2026-10-01）：原为无条件 sleep 1m（纯等待 60s）。改为轮询网关
          # 真退出即继续，通常数秒完成；超时 60s 兜底，语义与原来等价。
          # ⚠️ 判定必须用 systemctl（2026-10-01 二修）：首版写的是
          #   pgrep -f "openclaw-gateway"，但 "openclaw-gateway" 只是 **unit 名**，
          #   **不在进程 cmdline 里**（真实 cmdline 为 `node ... dist/index.js
          #   gateway --port 18789`）。该 pgrep 恒不匹配 → 循环第 1 次就 break、
          #   等 0s，等于把等待直接删掉，保护形同虚设；反之若将来有进程 cmdline
          #   含该串，又会反常地等满 60s。改用 unit 的 active 状态才是真判定。
          # 2026-10-21 补升级链：旧写法无论等没等到都往下走，"已退出"根本没被断言过
          # （实测恒假 —— 因为 stop 从没执行）。现在把结果落成 GW_DOWN，等不到就升级，
          # 全链失败则在日志里留 ::warning::，让「对着活树打包」这件事可见。
          GW_DOWN=0
          gw_is_active() {
            [ "$(systemctl --user is-active openclaw-gateway.service 2>/dev/null || echo inactive)" = "active" ]
          }
          for _i in $(seq 1 60); do
            if ! gw_is_active; then
              echo "✅ OpenClaw gateway 已退出（等待 $((_i - 1))s）"
              GW_DOWN=1
              break
            fi
            sleep 1
          done
          # 升级走 systemd 自己的 stop 作业：单元 Restart=always，直接 kill 进程会在
          # RestartSec=5 后被拉回来；显式 stop 作业内的一律不重启（restart 只看崩溃）。
          # --no-block + 自带轮询：单元 TimeoutStopSec=330，同步等等于把下线时长交给
          # 最坏情况，这里只给它 120s（优雅停机的大头在前几十秒）。
          if [ "$GW_DOWN" != "1" ]; then
            echo "⚠️ 60s 内 unit 仍 active，改用 systemctl --user stop 兜底..."
            systemctl --user stop --no-block openclaw-gateway.service 2>/dev/null || true
            for _i in $(seq 1 120); do
              if ! gw_is_active; then
                echo "✅ OpenClaw gateway 已退出（systemctl stop 再等 ${_i}s）"
                GW_DOWN=1
                break
              fi
              sleep 1
            done
          fi
          if [ "$GW_DOWN" != "1" ]; then
            echo "⚠️ systemctl stop 作业 120s 未完成，发送 SIGKILL"
            systemctl --user kill -s KILL openclaw-gateway.service 2>/dev/null || true
            for _i in $(seq 1 10); do
              if ! gw_is_active; then
                GW_DOWN=1
                break
              fi
              sleep 1
            done
          fi
          if [ "$GW_DOWN" != "1" ]; then
            echo "::warning::OpenClaw gateway 未能停止（unit 仍 active），本轮最终归档是在网关写盘状态下打的包"
            echo "⚠️ 网关未能停止，最终归档将对着活动状态打包"
          fi



      # 最终归档结果汇总（规范 · 结果通知）：归档步骤边归档边把结果写进 /tmp 的结果文件，
      # 这里统一渲染成一条通知。单独成 step 而不是并进归档步骤——归档步骤多处 exit 1
      # （预检失败 / 磁盘不足），写在步骤末尾的通知会随之被跳过；always() + 结果文件
      # 让「没产出明细」也能有交代（那类失败在归档步骤内不产生任何通知）。
      - name: Notify OpenClaw final archive result
        # 预检失败时归档步骤被闸门跳过（skipped），归档结果通知无意义。
        # 注意用 conclusion == 'failure' 只闸预检失败：skipped 本身是
        # 「结果文件为空」通知的正常输入之一，不能把整步跳掉。
        if: ${{ always() && steps.dropbox_preflight.conclusion != 'failure' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARCHIVE_STEP_CONCLUSION: ${{ steps.final_archive.conclusion }}
        run: |
          # 刻意不用 set -e：本步骤的任务是把已归档的结果送出去，任何一处判断失误都不该
          # 变成「静默不发」；发送失败由末尾的 || echo ::warning:: 留痕（规范 · 发送层）
          set -uo pipefail
          # 凭据校验在 source 之前（规范 · 接线）
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "⚠️ Telegram secrets missing, skip final archive result notification."
            exit 0
          fi
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"

          RESULTS_FILE="/tmp/openclaw-final-archive-results.tsv"

          msg=""
          # 归档步骤在记录任何结果前就结束了（预检 exit 1 / 运行被取消）：降级为「未完成」
          if [ ! -s "$RESULTS_FILE" ]; then
            case "${ARCHIVE_STEP_CONCLUSION:-}" in
              success)   _verdict="归档步骤已结束，但未产出归档明细" ;;
              failure)   _verdict="归档步骤执行失败" ;;
              cancelled) _verdict="运行已被取消" ;;
              skipped)   _verdict="归档步骤被跳过" ;;
              *)         _verdict="归档步骤未执行" ;;
            esac
            tg_add_title msg "⚠️ OpenClaw 最终归档未完成"
            tg_add_kv msg "结论" "$_verdict"
            tg_add_note msg "本轮没有产出归档明细，云端归档保持上一轮状态。"
            tg_add_footer msg
            send_tg "$msg" alert || echo "::warning::TG 通知发送失败（不影响任务）"
            exit 0
          fi

          # 逐条读结果并计数；条目边读边构建。明细是固定几项的结构性清单（最多 5 项），
          # 全量展示不折叠（规范 · 折叠规则）——折掉任何一项都会让读者误判归档是否完整。
          ok_n=0; fail_n=0; skip_n=0; total_bytes=0
          entries=""
          # read 的退出码兜底（|| [ -n "$_obj" ]）：末行缺尾换行时 read 返回非 0 但变量已赋值，
          # 只看退出码会静默丢掉最后一个归档对象——而「少一项」正是这条通知要防的误判。
          while IFS=$'\t' read -r _obj _verdict _bytes _note || [ -n "${_obj:-}" ]; do
            [ -z "$_obj" ] && continue
            case "$_bytes" in ''|*[!0-9]*) _bytes=0 ;; esac
            case "$_verdict" in
              ok)
                ok_n=$((ok_n + 1))
                total_bytes=$((total_bytes + _bytes))
                tg_add_entry entries "$_obj" "✅ $(format_bytes "$_bytes")" "$_note"
                ;;
              skip)
                skip_n=$((skip_n + 1))
                tg_add_entry entries "$_obj" "⏭️ 跳过" "$_note"
                ;;
              *)
                fail_n=$((fail_n + 1))
                tg_add_entry entries "$_obj" "❌ ${_note:-失败}"
                ;;
            esac
          done < "$RESULTS_FILE"

          # 标题按严重度降级（规范 · 状态图标）：全败 ❌ > 有失败 ⚠️ > 全成 ✅
          if [ "$fail_n" -gt 0 ] && [ "$ok_n" -eq 0 ]; then
            tg_add_title msg "❌ OpenClaw 最终归档失败"
          elif [ "$fail_n" -gt 0 ]; then
            tg_add_title msg "⚠️ OpenClaw 最终归档完成 · 部分失败"
          else
            tg_add_title msg "✅ OpenClaw 最终归档完成"
          fi

          # 计数只列非零项，避免「失败 0」这种与标题自相矛盾的写法（规范 · 计数与量化）
          result_parts=""
          if [ "$ok_n" -gt 0 ]; then result_parts="成功 $ok_n"; fi
          if [ "$fail_n" -gt 0 ]; then result_parts="${result_parts:+${result_parts} · }失败 $fail_n"; fi
          if [ "$skip_n" -gt 0 ]; then result_parts="${result_parts:+${result_parts} · }跳过 $skip_n"; fi
          tg_add_kv msg "结果" "$result_parts"
          if [ "$ok_n" -gt 0 ]; then
            tg_add_kv msg "大小" "合计 $(format_bytes "$total_bytes")"
          fi

          tg_add_section msg "📦 归档明细 · $((ok_n + fail_n + skip_n))"
          tg_add_block msg "$(tree_lines "$entries")"
          tg_add_footer msg
          # 全败走 alert 档：同轮内每个对象都另有 send_archive_alert（alert 档）单发，
          # 这条汇总量级最大、最能说明「本轮归档整体失败」，降级成普通档会让读者
          # 在一般通知流里漏掉它（2026-10-19 对齐 send_archive_alert 的档位口径）。
          if [ "$fail_n" -gt 0 ] && [ "$ok_n" -eq 0 ]; then
            send_tg "$msg" alert || echo "::warning::TG 通知发送失败（不影响任务）"
          else
            send_tg "$msg" || echo "::warning::TG 通知发送失败（不影响任务）"
          fi

      - name: Trigger next OpenClaw run
        if: ${{ always() && steps.keepalive.conclusion == 'success' && steps.install_openclaw.outcome == 'success' && steps.run_openclaw.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Triggering next openclaw.yml run. GitHub Actions concurrency will keep it singleton."
          gh workflow run openclaw.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"

      # - name: Sync ~/.openclaw to Dropbox
      #   if: always()
      #   run: |
      #     echo "Syncing ~/.openclaw to Dropbox..."
      #     rclone sync ~/.openclaw dropbox:self-hosted/openclaw \
      #       --exclude "logs/**" \
      #       --exclude "cache/**" \
      #       --exclude "browser/**/Crashpad/**" \
      #       --exclude "browser/**/GPUCache/**" \
      #       --exclude "browser/**/Code Cache/**" \
      #       --exclude "browser/**/GrShaderCache/**" \
      #       --exclude "browser/**/GraphiteDawnCache/**" \
      #       --exclude "**/*.lock" \
      #       --exclude "**/*.pid" \
      #       --exclude "**/*.jsonl.lock" \
      #       -v
