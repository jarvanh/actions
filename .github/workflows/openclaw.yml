          data_files=$(sudo find "$SRC_ROOT" -type f ! -name '.keep' 2>/dev/null | wc -l)
          if [ "$((data_files + 0))" -lt 1 ]; then
          echo "rsstt_no_data_files"
          exit 3
          fi

