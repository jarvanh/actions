            exit 1
          elif [ "$actual_size" -lt "$MIN_SIZE" ]; then
            echo "omniroute_archive_too_small size=${actual_size} min=${MIN_SIZE} output=$OUTPUT_TAR"
            exit 1
          elif ! tar -tzf "$OUTPUT_TAR" >/dev/null 2>&1; then
            echo "omniroute_archive_tar_validation_failed output=$OUTPUT_TAR"
            exit 1
