          # + 数据卷快照（storage.sqlite 渠道/入站 key/combo + server.env 加密根钥）。
          # 卷快照走 helper 容器（主容器没起也能打）；sqlite 先做在线一致性备份，
          # 恢复侧优先用 storage-backup.sqlite（活库文件可能撕裂，只作兜底）。
          MIN_SIZE=$((1024 * 1024))
          SRC_DIR="/home/runner/omniroute"
          VOLUME="omniroute_omniroute-data"
          IMAGE="diegosouzapw/omniroute:3.8.51"
