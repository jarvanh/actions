          snap_ok=0
          for attempt in 1 2 3 4; do
            if docker run --rm --user root -v "$VOLUME:/data:ro" -v "$STAGE_DIR:/stage" \
              "$IMAGE" tar czf /stage/data.tar.gz -C /data . 2>/tmp/omniroute-snap.err; [ $? -le 1 ]; then
              snap_ok=1
              break
