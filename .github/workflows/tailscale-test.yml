name: tailscale-test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Enable Tailscale SSH
        run: |
          sudo tailscale set --ssh --hostname=ts-test-${{ github.run_id }}
          {
            printf 'TS_HOST=%s\n' "ts-test-${{ github.run_id }}"
            printf 'TS_IP=%s\n' "$(tailscale ip -4)"
            printf 'RUN_URL=%s\n' "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$HOME/ts.env"

      - name: Notify SSH entry
        if: ${{ always() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          . "$HOME/ts.env"
          msg="🧪 临时调试机已就绪（5 分钟后自动回收）"
          msg+=$'\n\n'
          msg+="SSH: ssh runner@${TS_HOST}"
          msg+=$'\n'
          msg+="IP: ssh runner@${TS_IP}"
          msg+=$'\n'
          msg+="Run: ${RUN_URL}"
          payload=$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$msg" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')
          curl -fsS --retry 3 --retry-delay 2 --max-time 20 \
            -X POST -H 'Content-Type: application/json' \
            -d "$payload" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" > /dev/null
          echo "已推送 SSH 入口通知: ssh runner@${TS_HOST}"

      - name: Stay online for verification
        run: sleep 300
