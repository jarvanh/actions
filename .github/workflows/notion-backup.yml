name: Notion Backup

on:
  schedule:
    # 03:00 Asia/Shanghai (19:00 UTC previous day)
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: notion-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Export Notion to OneDrive
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install rclone
        run: bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install

      - name: Configure rclone
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run Notion backup
        run: |
          set -euo pipefail
          rclone copyto \
            "dropbox:self-hosted/notion-backup/notion-cookies.json" \
            /tmp/notion-cookies.json
          python "$GITHUB_WORKSPACE/.github/scripts/notion/backup_notion.py" \
            --cookies /tmp/notion-cookies.json \
            --remote onedrive:notion-backups

      - name: Clean up cookies
        if: always()
        run: rm -f /tmp/notion-cookies.json

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 告警档凭据（tier=alert 直达告警 bot @SaberFuckBot，无回落）
          TELEGRAM_BOT_TOKEN_ALERT: ${{ secrets.TELEGRAM_BOT_TOKEN_ALERT }}
          TELEGRAM_CHAT_ID_ALERT: ${{ secrets.TELEGRAM_CHAT_ID_ALERT }}
          JOB_STATUS: ${{ job.status }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if { [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; } && { [ -z "$TELEGRAM_BOT_TOKEN_ALERT" ] || [ -z "$TELEGRAM_CHAT_ID_ALERT" ]; } then
            echo "Telegram 凭证未配置，跳过发送通知。"
            exit 0
          fi
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"

          msg=""
          if [ "${JOB_STATUS}" = "cancelled" ]; then
            tg_add_title msg "⛔ Notion 备份已中断"
            tg_add_note msg "任务被取消，数据未受影响；如需继续请重新运行。"
            tg_add_footer msg
            send_tg "$msg" alert || echo "::warning::TG 通知发送失败（不影响任务结果）"
            exit 0
          fi
          if [ "${JOB_STATUS}" = "success" ]; then
            tg_add_title msg "✅ Notion 备份成功"
            tg_add_kv msg "日期" "$(TZ=Asia/Shanghai date +'%Y-%m-%d')"
            tg_add_kv msg "状态" "完成"
          else
            _tier="alert"     # ❌ 备份失败 = 告警档
            tg_add_title msg "❌ Notion 备份失败"
            tg_add_kv msg "日期" "$(TZ=Asia/Shanghai date +'%Y-%m-%d')"
            tg_add_kv msg "状态" "失败"
            tg_add_note msg "请前往 GitHub Actions 查看日志详情。"
          fi
          tg_add_footer msg
          send_tg "$msg" "${_tier:-}" || echo "::warning::TG 通知发送失败（不影响任务结果）"
