name: Notion Backup

on:
  schedule:
    # 03:00 Asia/Shanghai (19:00 UTC previous day)
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: notion-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Export Notion to OneDrive
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install rclone
        run: bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install

      - name: Configure rclone
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run Notion backup
        run: |
          set -euo pipefail
          rclone copyto \
            "dropbox:self-hosted/notion-backup/notion-cookies.json" \
            /tmp/notion-cookies.json
          python "$GITHUB_WORKSPACE/.github/scripts/notion/backup_notion.py" \
            --cookies /tmp/notion-cookies.json \
            --remote onedrive:notion-backups

      - name: Clean up cookies
        if: always()
        run: rm -f /tmp/notion-cookies.json

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "${JOB_STATUS}" = "success" ]; then
            ICON="✅"; TITLE="Notion 备份成功"
          elif [ "${JOB_STATUS}" = "cancelled" ]; then
            ICON="⚪"; TITLE="Notion 备份被取消"
          else
            ICON="❌"; TITLE="Notion 备份失败"
          fi
          TEXT="${ICON} ${TITLE}
          时间: $(date -u '+%Y-%m-%d %H:%M UTC')
          运行: ${RUN_URL}"
          curl -fsS --retry 3 --retry-delay 5 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null
