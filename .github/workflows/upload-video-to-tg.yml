name: upload video to tg

concurrency:
  group: video-processing
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      clean_tg_uploaded_videos:
        description: '清空 Telegram 频道所有消息并删除 uploaded_videos.json，会重新上传全部视频到 Telegram 频道'
        type: boolean
        default: false
        required: false
      auto_delete_duplicates:
        description: '对哈希一致的重复视频执行实际删除（文件名相同或不同均处理），保留最大/最新文件。关闭时仅标记"待删除"不实际删除'
        type: boolean
        default: false
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 统一收尾区（tg_add_footer）: 运行日志链接 + 已运行时长（所有通知 step 继承）
      TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # OneDrive 远程路径：rclone 配置中的远端 + 路径
      SOURCE_REMOTE: "onedrive:1/1024j/视频/91"
      # 91 频道 ID（硬编码，与 ph-dl 使用 secret 不同）
      TG_CHANNEL_ID: "-1004369945681"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ============ 环境准备：rclone 安装与挂载 ============
      - name: rclone-install
        run: |
          set -e
          # 安装 rclone：GitHub Releases 直下 .deb，并用同 Release 的 SHA256SUMS 校验（取不到校验和即失败）
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          # 写配置 + 持久化：secret 起步 → 掩码 → Dropbox 恢复优先 → 有效性检查 → 同步回 Dropbox
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config
      - name: rclone-run
        run: |
          # 挂载 OneDrive 到本地目录（后台运行，vfs 全量缓存模式）
          sudo apt-get update
          sudo apt-get install -y fuse3
          mkdir ~/onedrive
          nohup rclone --vfs-cache-mode full mount onedrive: ~/onedrive &
          sleep 3

      # ============ 步骤1：按哈希检测并去重重复视频 ============
      - name: check duplicate videos by hash and dedupe
        # 去重是附加能力：失败不级联跳过上传，通知脚本内部按「发现重复组才发」处理
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_DELETE: ${{ github.event.inputs.auto_delete_duplicates == 'true' }}
          WORKFLOW_LABEL: "91-tg"
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/tg-channel/dedupe_videos_by_hash.sh"

      # ============ 步骤2：清空 Telegram 频道并重置上传记录 ============
      - name: clean telegram channel and reset upload archive
        if: github.event.inputs.clean_tg_uploaded_videos == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/tg-channel/reset_tg_channel.sh" \
            "${TG_CHANNEL_ID}" \
            "91-tg"

      # ============ 步骤3：将 OneDrive 中尚未上传的视频补传到 Telegram 频道 ============
      - name: send videos to telegram
        id: sync
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          PYTHONUNBUFFERED: "1"
        run: |
          sudo apt-get install -y ffmpeg
          pip3 install telethon
          bash "${GITHUB_WORKSPACE}/.github/scripts/tg-channel/sync_to_tg.sh" \
            "$SOURCE_REMOTE" \
            "${TG_CHANNEL_ID}" \
            "91"

      # 崩溃/被取消时脚本走不到汇总通知（它在末尾才发），这里按 always() 兜底。
      # 已发过汇总（marker 存在）或步骤正常成功则不补发，避免双条。
      - name: notify channel sync abnormal exit
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYNC_RESULT: ${{ steps.sync.outcome }}
        run: |
          set -uo pipefail
          [ "${SYNC_RESULT:-}" = "success" ] && exit 0
          [ -f "${RUNNER_TEMP:-/tmp}/tg-channel-summary-sent" ] && exit 0
          source "${GITHUB_WORKSPACE}/.github/scripts/telegram/tg_notify.sh"
          msg=""
          tg_add_title msg "❌ 频道同步异常退出"
          tg_add_kv msg "结果" "同步脚本未产出汇总通知（退出状态 ${SYNC_RESULT:-unknown}）"
          tg_add_footer msg
          send_tg_chunked "$msg" || echo "::warning::TG 兜底通知发送失败（不影响任务）"
