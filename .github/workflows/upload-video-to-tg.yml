name: upload video to tg

concurrency:
  group: video-processing
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      clean_tg_uploaded_videos:
        description: '清空 Telegram 频道所有消息并删除 uploaded_videos.json，会重新上传全部视频到 Telegram 频道'
        type: boolean
        default: false
        required: false
      auto_delete_duplicates:
        description: '对哈希一致的重复视频执行实际删除（文件名相同或不同均处理），保留最大/最新文件。关闭时仅标记"待删除"不实际删除'
        type: boolean
        default: false
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # OneDrive 远程路径：rclone 配置中的远端 + 路径
      SOURCE_REMOTE: "onedrive:1/1024j/视频/91"
      # 91 频道 ID（硬编码，与 ph-dl 使用 secret 不同）
      TG_CHANNEL_ID: "-1004369945681"
    steps:
      - uses: actions/checkout@v7

      # ============ 环境准备：rclone 安装与挂载 ============
      - name: rclone-install
        run: |
          # 安装 rclone 命令行工具
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          cd rclone-*-linux-amd64
          sudo mv rclone /usr/bin
          sudo chmod +x /usr/bin/rclone
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          # 写入 rclone 配置文件（来自 GitHub secrets）
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG
          EOF
      - name: rclone-run
        run: |
          # 挂载 OneDrive 到本地目录（后台运行，vfs 全量缓存模式）
          sudo apt-get update
          sudo apt-get install -y fuse3
          mkdir ~/onedrive
          nohup rclone --vfs-cache-mode full mount onedrive: ~/onedrive &
          sleep 3

      # ============ 步骤1：按哈希检测并去重重复视频 ============
      - name: check duplicate videos by hash and dedupe
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_DELETE: ${{ github.event.inputs.auto_delete_duplicates == 'true' }}
          WORKFLOW_LABEL: "91-tg"
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/telegram/dedupe_videos_by_hash.sh"

      # ============ 步骤2：清空 Telegram 频道并重置上传记录 ============
      - name: clean telegram channel and reset upload archive
        if: github.event.inputs.clean_tg_uploaded_videos == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/telegram/reset_tg_channel.sh" \
            "${TG_CHANNEL_ID}" \
            "91-tg"

      # ============ 步骤3：将 OneDrive 中尚未上传的视频补传到 Telegram 频道 ============
      - name: send videos to telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION }}
          PYTHONUNBUFFERED: "1"
        run: |
          sudo apt-get install -y ffmpeg
          pip3 install telethon
          bash "${GITHUB_WORKSPACE}/.github/scripts/telegram/sync_to_tg.sh" \
            "$SOURCE_REMOTE" \
            "${TG_CHANNEL_ID}" \
            "91"
