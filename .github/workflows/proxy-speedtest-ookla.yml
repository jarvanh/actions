name: proxy-speedtest-ookla

# 订阅节点 Speedtest 测速：逐个节点用 Ookla 官方 speedtest CLI 测「节点 → Speedtest 官方
# 测速点」的延迟与上下行，结果推送 Telegram。
#
# 与 proxy-speedtest 系列同族（同一订阅源 PROXY_SPEEDTEST_SUB_URLS、同一 mihomo 内核），
# 只是测速引擎换成 Ookla 官方 CLI：口径是 Speedtest 官方自适应多连接测量。
#
# 测速点怎么选（**按目标地区检索并锁定**，不要写死老编号）：
#   1. CLI 自己的列表（-L / 自动选点）由 Ookla 按**请求方出口 IP** 生成，境外出口节点
#      拿到的整张列表都是境外点（实测出口在新加坡时 10 条全是新加坡、CN=0）——想测
#      「节点 → 大陆」就不能走这条路；
#   2. 但 --server-id **不受该列表限制**：从境外出口指定不在就近列表里的新加坡 12687 /
#      上海 24447 / 苏州 16204 都能测通。报 NoServersException 是**编号被 Ookla 下线**，
#      不是地理不可见（2026-09-11 实测：旧表里 15 个国内编号只剩 24447 活着，
#      26678「广州联通」早在其中）；
#   3. 所以默认走 OOKLA_TARGET_POINTS（经纬度锚点，默认广州→上海→北京）向 Ookla 服务器
#      列表 API 检索候选点（与请求方出口无关），按 运营商 → 距目标距离 排序后锁定，
#      所有节点同口径复用；
#   4. 广州/广东目前 CN 测速点数量为 0（最近的是港澳），全大陆只剩苏州 16204 / 昆山 30852 /
#      上海 24447（唯一联通）——会如实标注「距目标 1211km」，不假装测到了广州；
#   5. 编号失效才顺延下一个候选；节点连不上**不换点**（那就是测量结果）；候选全失效才
#      退回按节点出口就近，并在通知里标注，绝不静默换口径。
#
# 链路说明：Ookla CLI 没有 --proxy 参数，只能走 mihomo TUN 透明接管该进程流量：
#   rules: [PROCESS-NAME,speedtest,AUTO, MATCH,DIRECT]
# 即只有测速进程走节点、其余流量（含 runner 心跳/日志）直连；再用「测速出口 IP
# 是否等于 runner 直连出口 IP」校验规则真的生效（TUN 起不来会静默直连、结果失真）。
# 开 TUN 需要 CAP_NET_ADMIN，脚本会在非 root 时自动加 sudo。
on:
  schedule:
    # 每 6 小时测一次：UTC 05:00, 11:00, 17:00, 23:00（北京 13:00, 19:00, 01:00, 07:00）
    # 与 gitee（02/08/14/20）、cdn（03/09/15/21）、taier（04/10/16/22）错峰
    - cron: "0 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      server_id:
        description: 'Speedtest 测速点编号（可选，多个逗号分隔；优先级最高。留空 = 按目标地区自动检索并锁定；编号被 Ookla 下线时自动顺延下一个候选）'
        required: false
      target_points:
        description: '目标地区经纬度锚点（空格分隔 "lat,lon"，按序检索。默认 广州→上海→北京；广州附近目前没有 CN 测速点，会逐级扩大并如实标注距离）'
        required: false
      target_isp:
        description: '运营商关键词（逗号分隔，按序优先；默认 unicom,联通。留空 = 只按距目标距离排）'
        required: false
      max_nodes:
        description: '最多测几个节点（0 = 不限）'
        required: false
        default: '0'
      diagnose:
        description: '只跑诊断探针（判断拿不到测速点是「列表空」还是「编号失效」）：不发通知、不写订阅'
        required: false
        type: boolean
        default: false

jobs:
  speedtest:
    concurrency: proxy-speedtest-ookla-singleton
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      # Ookla 官方源安装官方 CLI（二进制名固定为 speedtest，供 TUN 进程规则匹配）。
      # 不用官方 script.deb.sh：它按 runner 发行版选 dist，而 Ookla 的 packagecloud 源
      # 只发布到 jammy（最后更新 2022-08），ubuntu-24.04（noble）没有对应发行线，
      # 会报「Unable to locate package speedtest」→ 这里显式钉住 jammy 借用；
      # apt 仍失败时回退官方 tarball。
      # 也不要用 Debian/Ubuntu 的 speedtest-cli 包（第三方实现，输出结构与口径都不同）
      - name: Install Ookla Speedtest CLI
        run: |
          curl -fsSL https://packagecloud.io/ookla/speedtest-cli/gpgkey \
            | sudo gpg --dearmor -o /usr/share/keyrings/ookla-speedtest-cli.gpg
          echo "deb [signed-by=/usr/share/keyrings/ookla-speedtest-cli.gpg] https://packagecloud.io/ookla/speedtest-cli/ubuntu jammy main" \
            | sudo tee /etc/apt/sources.list.d/ookla-speedtest-cli.list
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/ookla-speedtest-cli.list" \
            -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          if ! sudo apt-get install -y speedtest; then
            echo "::warning::apt 安装失败，回退官方 tarball"
            curl -fsSL https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-linux-x86_64.tgz \
              -o /tmp/speedtest.tgz
            sudo tar -xzf /tmp/speedtest.tgz -C /usr/local/bin speedtest
            sudo chmod +x /usr/local/bin/speedtest
          fi
          speedtest --version

      - name: Run ookla speedtest
        env:
          # 订阅源（与其他测速工作流同一个 secret）
          PROXY_SPEEDTEST_SUB_URLS: ${{ secrets.PROXY_SPEEDTEST_SUB_URLS }}
          # 测速点与测速参数（workflow_dispatch 可覆盖；定时运行走默认值）。
          # 定时运行 inputs 为空，必须兜底成空串让脚本走「按目标地区检索」——
          # 兜底写死编号才是「整轮空跑却报 success」的历史事故根源（老编号几乎全被下线）
          OOKLA_SERVER_ID: ${{ github.event.inputs.server_id || '' }}
          # 目标地区锚点 / 运营商偏好 / 国家码（留空走脚本默认：广州→上海→北京、unicom、CN）
          OOKLA_TARGET_POINTS: ${{ github.event.inputs.target_points || '' }}
          OOKLA_TARGET_ISP: ${{ github.event.inputs.target_isp || '' }}
          OOKLA_MAX_NODES: ${{ github.event.inputs.max_nodes || '0' }}
          # 诊断模式：只看探针结论（step 日志 [diag] 行），不发通知、不写订阅
          OOKLA_DIAGNOSE: ${{ github.event.inputs.diagnose || 'false' }}
          # 订阅导出策略（四套共用；可在仓库 Settings → Secrets and variables → Actions
          # → Variables 里覆盖，留空走脚本默认值）：
          #   PROXY_SPEEDTEST_MIN_MEGABIT  达标阈值（兆，默认 10）
          #   PROXY_SPEEDTEST_SPEED_METRIC 判定指标 upload|download（默认 upload 按上行判定；
          #                                达标数 < 最少节点数时自动改用另一指标，反之亦然）
          #   PROXY_SPEEDTEST_MIN_NODES    上传订阅的最少节点数（默认 1，不足则不上传）
          PROXY_SPEEDTEST_MIN_MEGABIT: ${{ vars.PROXY_SPEEDTEST_MIN_MEGABIT || '10' }}
          PROXY_SPEEDTEST_SPEED_METRIC: ${{ vars.PROXY_SPEEDTEST_SPEED_METRIC || 'upload' }}
          PROXY_SPEEDTEST_MIN_NODES: ${{ vars.PROXY_SPEEDTEST_MIN_NODES || '1' }}
          # GitHub API 匿名调用在共享出口 IP 上 60 次/h 限流时的认证回退
          GH_TOKEN: ${{ secrets.PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 订阅导出：本工作流专属 Gist（四个测速工作流各用各的，互不覆盖）。
          # 留空则首次运行自动新建，TG 通知会给链接；拿到 id 后回填此 secret 避免每轮新建
          PROXY_SPEEDTEST_GIST_ID: ${{ secrets.PROXY_SPEEDTEST_OOKLA_GIST_ID }}
          PROXY_SPEEDTEST_GIST_FILENAME: proxy_speedtest_ookla_subscription.yaml
          PROXY_SPEEDTEST_GIST_DESCRIPTION: 'proxy speedtest subscription (ookla 按目标地区锁定测速点)'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 统一收尾区（footer）: 运行日志链接 + 已运行时长
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_RUN_STARTED_AT: ${{ github.run_started_at }}
        run: python .github/scripts/proxy-speedtest/speedtest_ookla.py

      # 兜底收尾：mihomo TUN 的 auto-route 会接管整机出向路由，内核不撤掉的话
      # runner 无法把日志/状态回传 GitHub（表现为所有 step 已完成但 run 卡在
      # in_progress、连取消都执行不了）。脚本正常路径会自己关，这里防异常/超时。
      - name: Cleanup mihomo TUN
        if: ${{ always() }}
        run: |
          sudo -n pkill -f "mihomo -d" || true
          sleep 2
          echo "mihomo 残留进程：$(pgrep -cf 'mihomo -d' || true)"
