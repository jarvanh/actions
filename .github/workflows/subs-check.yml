name: subs-check

on:
  schedule:
    # - cron: "0 2,8,14,20 * * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:
  watch:
    # types: started

jobs:
  build:
    # 安全守卫（2026-09-08）：公开仓库任何人 star 都会触发 watch 事件——仅放行仓库本人，
    # schedule / workflow_dispatch 等其余触发方式不受影响
    if: github.event_name != 'watch' || github.actor == 'jarvanh'
    concurrency: subs-check-singleton
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: rclone-install
        run: |
          set -e
          # 安装 rclone：GitHub Releases 直下 .deb，失败回退 rclone.org 安装脚本
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install
      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          # 写配置 + 持久化：secret 起步 → 掩码 → Dropbox 恢复优先 → 有效性检查 → 同步回 Dropbox
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config
      - name: rclone-run
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo mkdir -p /dropbox /mnt/vfs/dropbox /opt/logs
          sudo chown runner:runner /dropbox /mnt/vfs/dropbox /opt/logs
          # 挂载改用 runner 用户（与 emby.yml 一致）：root 身份挂载时 rclone 刷新 token 会把
          # rclone.conf 回写成 root:600，之后非 root 的 rclone（含下面的 lsf）读取即 EACCES
          grep -q '^user_allow_other' /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf >/dev/null
          # 参数按"配置 / Docker 数据卷"画像：config 与 output 都是小文件随机读写。
          #   --cache-dir        默认 ~/.cache/rclone 会落进根分区（≈14GB），必须指向 /mnt
          #   --attr-timeout 1m  原 10m：容器内文件频繁增删改，属性缓存 10 分钟有陈旧风险
          #   --poll-interval 0  run 期间远端目录不会自己变，关轮询省 API 配额
          #   --buffer-size 16M  原 100M：每个打开的文件常驻一份，小文件场景用不到
          #   删除 --vfs-read-chunk-size-limit 10G：会让单个 Range 请求一路翻倍到 10GB
          nohup rclone mount dropbox: /dropbox \
            --config /home/runner/.config/rclone/rclone.conf \
            --cache-dir /mnt/vfs/dropbox \
            --allow-other --umask 000 --no-gzip-encoding \
            --attr-timeout 1m \
            --dir-cache-time 72h --poll-interval 0 \
            --vfs-cache-mode full \
            --vfs-cache-max-size 2G --vfs-cache-max-age 1h \
            --vfs-cache-min-free-space 2G \
            --vfs-cache-poll-interval 30s \
            --buffer-size 16M \
            --log-file /opt/logs/rclone-dropbox.log --log-level INFO &
          # 等挂载就绪：docker 紧接着要挂 /dropbox/self-hosted/subs-check/{config,output}
          for i in {1..30}; do
            mount | grep -q " on /dropbox " && break
            sleep 2
          done
          echo "==========onedrive==========="
          rclone lsf onedrive:
          echo "==========dropbox==========="
          rclone lsf dropbox:
      - name: Check if the tunnel is running
        env:
          TUNNEL_NAME: "subs-check" # cloudflared 隧道名
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          sudo mkdir -p ~/.cloudflared/
          sudo chown -R runner:runner ~/.cloudflared
          # rclone 以 runner 身份运行（与挂载步骤同）：root 运行会在 token 刷新时回写 rclone.conf 属主
          rclone copy dropbox:self-hosted/.cloudflared ~/.cloudflared -vv
          
          cloudflared tunnel list
          # 获取隧道列表
          OUTPUT=$(cloudflared tunnel list)      
          # 查找目标隧道的行
          TUNNEL_LINE=$(echo "$OUTPUT" | grep -w "$TUNNEL_NAME")
          if [ -z "$TUNNEL_LINE" ]; then
            echo "The tunnel '$TUNNEL_NAME' does not exist. Proceeding."
            exit 0
          fi
  
          # 提取 CONNECTIONS 列并检查是否为空
          CONNECTIONS=$(echo "$TUNNEL_LINE" | awk '{if (NF>=4) print $4; else print "-"}')
          if [ "$CONNECTIONS" == "-" ]; then
            echo "The tunnel '$TUNNEL_NAME' exists but has no active connections. Proceeding."
          else
            echo "The tunnel '$TUNNEL_NAME' is running with connections: $CONNECTIONS. Stopping actions."
            exit 0 
          fi
      # 顺序关键：必须先起容器，再起隧道。
      # 原因（2026-09-27 修）：原先 cloudflared 步骤排在容器之前，tunnels.sh 做端口预检时
      # 8199 还没监听，直接打印「跳过 subs-check：源站未监听」就退出，隧道永远起不来 ——
      # 表现为访问 subs-check 域名一直 1033/530。现改为：容器后台启动 → 等端口就绪 → ensure。
      - name: Run docker container
        run: |
          # -d 后台运行：前台阻塞会让后续隧道步骤永远不执行（旧版就是这样死的）
          docker run -d --name subs-check -p 8199:8199 -v /dropbox/self-hosted/subs-check/config:/app/config -v /dropbox/self-hosted/subs-check/output:/app/output --restart always ghcr.io/beck-8/subs-check:latest
      - name: Wait for port 8199
        run: |
          # 只判端口监听，不判 HTTP 内容：首轮检测未产出时 /all.yaml 可能还不存在，
          # 用 curl 判活会误判失败；tunnels.sh 内部也是按端口预检，口径一致
          for i in {1..60}; do
            if ss -tln | awk '{print $4}' | grep -qE '[:.]8199$'; then
              echo "源站 8199 已监听（第 ${i} 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "源站 8199 在 120s 内未监听，打印容器日志后退出"
          docker logs --tail 50 subs-check || true
          exit 1
      - name: run cloudflared
        run: |
          cloudflared tunnel route dns subs-check subs-check.'${{ secrets.VD }}'.eu.org
          if [ -f "$GITHUB_WORKSPACE/.github/scripts/tunnels/tunnels.sh" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/tunnels/tunnels.sh" ensure subs-check || true
          else
            nohup cloudflared tunnel run --url http://127.0.0.1:8199 subs-check &
          fi
      # 隧道已收敛，容器在后台跑检测；这里休眠保活直到 run 时间上限，与 sub-store 一致
      - name: sleep
        run: |
          sleep 350m

