name: windows-tailscale

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  windows-tailscale:
    # singleton 并发：固定主机名下不会撞名（与 openclaw.yml 一致）
    concurrency: windows-tailscale-singleton
    # GitHub 托管 runner 单任务上限 360 分钟（6 小时）
    timeout-minutes: 360
    runs-on: windows-latest
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tailscale (SSH 调试入口)
        id: ts
        if: ${{ always() && env.TS_OAUTH_CLIENT_ID != '' && env.TS_OAUTH_CLIENT_SECRET != '' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          # 注册时就带上固定主机名，MagicDNS 名稳定为 gh-win.<tailnet>.ts.net
          hostname: gh-win

      - name: Enable SSH over Tailscale
        id: ts_ssh
        if: ${{ always() && steps.ts.outcome == 'success' }}
        shell: pwsh
        env:
          # runneradmin 的系统登录密码，SSH 与 RDP 共用同一个
          RUNNER_PASSWORD: ${{ secrets.RUNNER_PASSWORD || 'P@ssw0rd!' }}
        run: |
          # Tailscale SSH 服务端仅支持 Linux，Windows 上改为启用内置 OpenSSH Server
          $cap = Get-WindowsCapability -Online | Where-Object Name -like 'OpenSSH.Server*'
          if ($cap -and $cap.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $cap.Name
          }
          Start-Service sshd
          Set-Service -Name sshd -StartupType Automatic
          Enable-NetFirewallRule -Name "OpenSSH-Server-In-TCP"

          # 设置 runneradmin 密码，供 SSH / RDP 密码登录
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText $Env:RUNNER_PASSWORD -Force)

          # 固定主机名（singleton 并发下不会撞名）；节点为 ephemeral，job 结束自动移除
          # 兜底：action 已用 hostname 注册，这里再 set 一次并轮询等待控制面收敛
          # 每轮都重试 set：若 tailnet 残留同名旧节点导致本节点被加后缀（gh-win-1），
          # 旧节点释放后改名即可生效，保证域名跨 run 稳定为 gh-win.<tailnet>.ts.net
          $tsDns = $null
          for ($i = 0; $i -lt 20; $i++) {
            tailscale set --hostname=gh-win
            $status = tailscale status --json | ConvertFrom-Json
            $dns = ($status.Self.DNSName.TrimEnd('.'))
            if ($dns -and ($dns -split '\.')[0] -eq 'gh-win') { $tsDns = $dns; break }
            Start-Sleep -Seconds 3
          }
          if (-not $tsDns) { $tsDns = ((tailscale status --json | ConvertFrom-Json).Self.DNSName).TrimEnd('.') }
          $tsHost = ($tsDns -split '\.')[0]
          $tsIp = (tailscale ip -4 | Select-Object -First 1)

          Add-Content $Env:GITHUB_ENV "TS_HOST=$tsHost"
          Add-Content $Env:GITHUB_ENV "TS_DNS=$tsDns"
          Add-Content $Env:GITHUB_ENV "TS_IP=$tsIp"
          Add-Content $Env:GITHUB_ENV "TS_USER=runneradmin"
          Add-Content $Env:GITHUB_ENV "RUN_URL=https://github.com/$Env:GITHUB_REPOSITORY/actions/runs/$Env:GITHUB_RUN_ID"

          echo "SSH 入口: ssh runneradmin@$tsDns （或 ssh runneradmin@$tsIp）"

      - name: Enable RDP (Windows 自带远程桌面)
        id: rdp
        if: ${{ always() && steps.ts.outcome == 'success' }}
        shell: pwsh
        run: |
          # 启用远程桌面 + 网络级身份验证（NLA），与 rdp.yml 一致
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # 确认 runneradmin 在 Remote Desktop Users 组内（管理员账户默认可登录）
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue
          Get-LocalGroupMember -Group "Remote Desktop Users" | Format-Table

          # 注意：必须写成 $($Env:TS_IP):3389。直接写 $Env:TS_IP:3389 时 PowerShell 会把
          # ":3389" 一起吞进变量名（drive-qualified 变量名贪婪匹配冒号），展开结果为空
          echo "RDP 入口: $($Env:TS_DNS):3389 （或 $($Env:TS_IP):3389，用户 runneradmin，走 Tailscale 网络）"
          Add-Content $Env:GITHUB_ENV "RDP_ENABLED=1"

      - name: Tailscale secrets missing
        if: ${{ always() && env.TS_OAUTH_CLIENT_ID == '' && env.TS_OAUTH_CLIENT_SECRET == '' }}
        shell: pwsh
        run: echo "⚠️ 未配置 TS_OAUTH_CLIENT_ID / TS_OAUTH_CLIENT_SECRET，跳过 Tailscale SSH 调试入口"

      - name: Notify Tailscale SSH entry
        if: ${{ always() && steps.ts_ssh.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 与 Enable SSH 步骤同一取值，密码明文只出现在 Telegram 通知里（不打印到 Actions 日志）
          RUNNER_PASSWORD: ${{ secrets.RUNNER_PASSWORD || 'P@ssw0rd!' }}
          TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          # 每次 runner 就绪都推送 SSH/RDP 入口；通知失败不影响主流程
          # 排版助手 + 发送层真源（pwsh 版，与 bash tg_notify.sh 同语义: 429 重试、解析失败抛出）
          . "$env:GITHUB_WORKSPACE\.github\scripts\telegram\tg_notify.ps1"
          # 自检: 本 step 带 continue-on-error，dot-source 失败会静默无通知，显式抛出留痕
          if (-not (Get-Command Send-TgMessage -ErrorAction SilentlyContinue)) { throw "tg_notify.ps1 加载失败" }
          # 按入口分组（SSH / RDP 两套凭据），每组树形列出；
          # 取值行只放标签+值，说明性文字（固定不变/每次会变/密码共用）
          # 集中到底部 ℹ️ 备注行（tg_add_note 形态），不与取值粘在同一行
          # 紧跟标题的首个分节不补段前空行（与 bash tg_add_section 同规则：分隔线后不空行）
          $msg = "🟢 <b>Windows runner 已就绪</b>`n$TG_SEP`n" +
            "🔐 <b>SSH</b>`n" +
            "  ├─ 命令：<code>ssh $(Esc-Html $Env:TS_USER)@$(Esc-Html $Env:TS_HOST)</code>`n" +
            "  ├─ 域名：<code>$(Esc-Html $Env:TS_DNS)</code>`n" +
            "  └─ 备用 IP：<code>$(Esc-Html $Env:TS_IP)</code>"
          $notes = "域名固定不变 · IP 每次运行会变，仅作备用"
          # RDP 启用成功时附上远程桌面入口（域名固定不变，IP 每次会变，优先给域名）
          if ($Env:RDP_ENABLED -eq '1') {
            $msg += "`n`n🖥️ <b>RDP</b>`n" +
              "  ├─ 地址：<code>$(Esc-Html $Env:TS_DNS):3389</code>`n" +
              "  ├─ 用户：<code>$(Esc-Html $Env:TS_USER)</code>`n" +
              "  └─ 密码：<code>$(Esc-Html $Env:RUNNER_PASSWORD)</code>"
            $notes += " · 密码 SSH/RDP 共用"
          }
          # 出口网络信息（IP/ISP/ASN/位置，与 openclaw.yml SSH 入口通知同源同款）；
          # ipwho.is 拉取失败不阻塞通知，逐项降级"未知"
          $pubIp = "未知"; $isp = "未知"; $asnLine = "未知"; $loc = "未知"
          try {
            $geo = Invoke-RestMethod -Uri 'https://ipwho.is/' -TimeoutSec 10
            if ($geo.ip) { $pubIp = [string]$geo.ip }
            if ($geo.connection.isp) { $isp = [string]$geo.connection.isp }
            if ($geo.connection.asn) { $asnLine = "AS$($geo.connection.asn) · $($geo.connection.org)" }
            $locParts = @($geo.city, $geo.region, $geo.country_code) | Where-Object { $_ }
            if ($locParts) { $loc = $locParts -join ", " }
          } catch { }
          # 条目非文件值：可复制的（IP/ASN）→ <code>，其余 → <b>（禁裸文本）
          $msg += "`n`n🌐 <b>出口网络</b>`n" +
            "  ├─ 出口 IP：<code>$(Esc-Html $pubIp)</code>`n" +
            "  ├─ ISP：<b>$(Esc-Html $isp)</b>`n" +
            "  ├─ ASN：<code>$(Esc-Html $asnLine)</code>`n" +
            "  └─ 位置：<b>$(Esc-Html $loc)</b>"
          $msg += "`n`nℹ️ <i>$notes</i>`n" +
            "有效期：<b>约 6 小时 · 超时自动结束</b>"
          $footer = Get-TgFooter
          if ($footer) { $msg += "`n`n$footer" }
          Send-TgMessage $msg
          echo "已推送入口通知: ssh $Env:TS_USER@$Env:TS_HOST"

      - name: Keep alive (6h)
        shell: pwsh
        run: Start-Sleep -Seconds 21000
