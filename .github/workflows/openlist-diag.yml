# OpenList 后端可写性诊断（独立于主同步管线）
#
# 为什么单独一个 workflow:
#   主 run 单轮 5.5h、且被 concurrency 单例串行化，任何"换个探针再跑一次"的
#   验证都要排到几小时后；更要命的是主 run 日志里后端写失败只有包装后的
#   "405 Method Not Allowed"，容器日志里的原始 rsp_code/rep_desc 从不落进
#   run 日志 —— 于是「登录令牌失效」与「路径/名长被拒」在日志里长得一模一样。
#   本 workflow 只做最小 setup（不装 cloudflared、不接管隧道、不回传数据库），
#   单次约 4 分钟，专门用来把这几类失败形态分开。
#
# 与主 workflow 的隔离:
#   - concurrency 用独立组名 openlist-diag，绝不与 openlist-singleton 互等；
#   - 不安装 cloudflared、不碰隧道 → 不会把正在服务的实例挤下线；
#   - 诊断用的 data.db 是从 dropbox 拉的一次性副本，全程不回传。
name: openlist-diag

on:
  workflow_dispatch:
    inputs:
      target:
        description: "诊断目标路径（openlist: 前缀，默认 wopan176Crypt/2）"
        required: false
        type: string
        default: "openlist:wopan176Crypt/2"
      container:
        description: "OpenList 容器名"
        required: false
        type: string
        default: "openlist"
      probe_gap:
        description: "探针间隔秒数（后端限流时调大）"
        required: false
        type: string
        default: "2"
      burst_n:
        description: "持续写入探针的文件数（复现生产的「量/时长」维度；0=跳过）"
        required: false
        type: string
        default: "150"
      target2:
        description: "第二个后端（可选）: 填了就做「跨后端并发」测试——两个挂载同时各跑一条（档位由 xback_transfers 控制），判断两边带宽上限是否独立（决定 pair_parallel 是否有效；2026-09-15 判定为独立 ≈1.9×）"
        required: false
        type: string
        default: ""
      big_mb:
        description: "大文件落盘阶梯（MiB，空格分隔；默认 16 64 256）。原用于定位「重传但未落盘」（该长尾已于 2026-09-15 收口）: 生产里 ~166MB 的文件 rclone 报 Copied 但重启容器后消失（假成功）"
        required: false
        type: string
        default: "16 64 256"
      big_transfers:
        description: "大文件阶梯的 transfers（默认 1）。设 6 可对比「并发是否推高假成功率」"
        required: false
        type: string
        default: "1"
      thru_mb:
        # 载荷太小会让噪声盖过信号: 6 MiB 在 1 MiB/s 下只有 6 秒，连接建立占比过大 ——
        # 实测给出"4× 并发只 1.67×"，而同期的真实轮次是 4.15×，对不上就是载荷太小的锅。
        # 64 MiB（64 个 1 MiB 文件，贴近生产小文件混合形态）≈ 每档 1 分钟。
        description: "吞吐阶梯载荷（MiB，默认 64 = 64 个 1MiB 文件）。太小噪声盖信号，太大耗时"
        required: false
        type: string
        default: "64"
      xback_transfers:
        description: "跨后端测试每条流的 transfers（默认 4）。用于判别「账号级天花板」: 两侧各抬到 12 流，若合计不再涨即为账号级共享上限"
        required: false
        type: string
        default: "4"
      reject_name_mode:
        description: "改名组命名形态: ts=中性时间戳名（默认，证明改名可绕）；shorthash=<md5前8位>，与生产方法2 copyto_shorthash 完全同形态，用于判决「方法2 的确切名字能否落盘」"
        required: false
        type: string
        default: "ts"
      thru_levels:
        description: "吞吐阶梯档位（空格分隔的 transfers 值，默认 1 4 8；用来找拐点——拐点处再提并发无益）"
        required: false
        type: string
        default: "1 4 8"
      reject_src:
        description: "拒收归因专项: 换行分隔的源端文件路径（如 onedrive:0/xx/file.mp4，必须换行分隔）。填了就走专项（跳过常规 13 组探针）——同内容改名 + 随机对照三组直传，重启取真值，区分「按内容拒收」vs「按文件名/状态拒收」（2026-09-16 V3 复验后的定向诊断，见计划文档 §12.13.4）"
        required: false
        type: string
        default: ""
      reject_max:
        description: "专项最多取前 N 个源文件（默认 1；每个源上传两份 ≈ 2×大小，控时长）"
        required: false
        type: string
        default: "1"
      reject_wait:
        description: "专项上传完成后、重启前的等待秒数（默认 120；观察「延迟落盘」，立即重启会把异步推送未完成误判成拒收）"
        required: false
        type: string
        default: "120"
      diag_409:
        description: "409 语义验证 + 短名改回原名实验（2026-09-17，方案 B 验证环）。填 1 走本专项（跳过常规 13 组与拒收专项）——做两件事: E1 对「已存在/不存在」目录分别 mkdir，判决 409 是否等于「已存在」（决定 commit 2bf7836 的修复是否成立）；E2 把短名产物改名回原名，重启取真值看是否蒸发（回答「改回原名会消失吗」）"
        required: false
        type: string
        default: "0"
      diag_409_src:
        description: "【已废弃】旧设计里 E2 的源端路径。现 E2 改用本地自造中性载荷（规避生产敏感文件名 + 日志路径截断），无需提供；保留仅为兼容旧调用"
        required: false
        type: string
        default: ""
      diag_409_skip_e2:
        description: "1=只做 E1（纯读+建目录，最快）；0=两组都做（E1 判决性 + E2 改名实验）"
        required: false
        type: string
        default: "0"
      diag_writeprobe:
        description: "目录可写性判据验证（2026-09-17，run 35239780581 驱动）。填 1 走本专项。回答「探针写失败 == 目录不可写吗」：在真实故障目录上做 W1 复现（lsd 判存在 + mkdir 409 + copyto 探针 409）→ W2 显式 API mkdir 后再写 → W3 用 --no-check-dest 绕开隐式 mkParentDir 直写；W3 成功而 W1 失败 ⇒ 预检是假阴性，须把「存在性」与「可写性」拆成两个判据"
        required: false
        type: string
        default: "0"
      diag_wp_dir:
        description: "W1-W3 用的**真实故障目录**（挂载根下的相对路径，如 5/1024j-视频-pornhub-channel/aeon-marks）。不给则只做隔离目录机制自测（结论弱）"
        required: false
        type: string
        default: ""
      diag_wp_bytes:
        description: "W3 写入载荷字节数（默认 1048576 = 1 MiB；够触发真实落盘又够快）"
        required: false
        type: string
        default: "1048576"

concurrency: openlist-diag

jobs:
  diag:
    runs-on: ubuntu-latest
    # 最小 setup ≈ 6 分钟 + 探针 ≈ 4 分钟；给足余量但不占用主轮预算
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENLIST_ADMIN_PASSWORD: ${{ secrets.OPENLIST_ADMIN_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: rclone-install
        run: |
          set -e
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" install

      - name: rclone-config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE }}
        run: |
          set -e
          # 与主 workflow 同一套配置来源: 本步骤会把远端写回 dropbox，
          # 是幂等的（配置一致时无变更），且主 run 每轮都在做同一件事。
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone/setup_rclone.sh" config

      - name: 验证远端连通
        run: |
          rclone lsf dropbox: | head -5

      - name: 拉起 OpenList 容器（诊断副本）
        env:
          # inputs 一律经 env 传入（README「注入面」: 不做 ${{ }} 直接内插 bash）
          OL_CONTAINER: ${{ inputs.container }}
        run: |
          set -e
          docker rm -f "$OL_CONTAINER" 2>/dev/null || true
          sudo mkdir -p /opt/openlist-data
          sudo chmod 0777 /opt/openlist-data
          # 与主 workflow 完全相同的拉库口径（含排除项），保证诊断对象就是生产
          # 实际加载的那份配置 —— 用不同的库诊断等于测了个别的东西。
          rclone copy dropbox:self-hosted/openlist/data /opt/openlist-data \
            --exclude "data.db-wal" --exclude "data.db-shm" --exclude "data.db-journal" \
            --exclude "log/**" --exclude "temp/**"
          echo "拉取完成: $(ls -la /opt/openlist-data/ | tail -n +2 | wc -l) 个条目"
          docker run -d --restart=no -v /opt/openlist-data:/opt/openlist/data \
            -p 5244:5244 -e PUID=0 -e PGID=0 -e UMASK=022 \
            --name="$OL_CONTAINER" openlistteam/openlist:latest

      - name: 校验 OpenList 容器运行状态
        run: |
          set -e
          source "$GITHUB_WORKSPACE/.github/scripts/openlist/load_all.sh"
          echo "等待 OpenList 就绪..."
          if wait_openlist_ready; then
            echo "✅ OpenList 容器及 HTTP 服务正常就绪"
          else
            echo "❌ OpenList 容器未能就绪"
            exit 1
          fi

      - name: 运行后端诊断探针
        env:
          DIAG_REPORT: /tmp/ol_diag/report.txt
          DIAG_PROBE_GAP: ${{ inputs.probe_gap }}
          DIAG_BURST_N: ${{ inputs.burst_n }}
          DIAG_TARGET: ${{ inputs.target }}
          DIAG_TARGET2: ${{ inputs.target2 }}
          DIAG_THRU_MB: ${{ inputs.thru_mb }}
          DIAG_BIG_MB: ${{ inputs.big_mb }}
          DIAG_BIG_TRANSFERS: ${{ inputs.big_transfers }}
          DIAG_THRU_LEVELS: ${{ inputs.thru_levels }}
          DIAG_XBACK_TRANSFERS: ${{ inputs.xback_transfers }}
          DIAG_REJECT_SRC: ${{ inputs.reject_src }}
          DIAG_REJECT_MAX: ${{ inputs.reject_max }}
          DIAG_REJECT_WAIT: ${{ inputs.reject_wait }}
          DIAG_REJECT_NAME_MODE: ${{ inputs.reject_name_mode }}
          DIAG_409_ENABLE: ${{ inputs.diag_409 }}
          DIAG_409_SRC: ${{ inputs.diag_409_src }}
          DIAG_409_SKIP_E2: ${{ inputs.diag_409_skip_e2 }}
          DIAG_WP_ENABLE: ${{ inputs.diag_writeprobe }}
          DIAG_WP_DIR: ${{ inputs.diag_wp_dir }}
          DIAG_WP_BYTES: ${{ inputs.diag_wp_bytes }}
          OL_CONTAINER: ${{ inputs.container }}
        run: |
          # 恒 exit 0: 诊断结果写在报告里，探针失败不该让 step 变红（否则
          # artifact 上传被跳过，最需要看的那份报告反而拿不到）
          # 优先级: 可写性判据验证 > 409 专项 > 拒收专项 > 常规 13 组（互斥——
          # 专项要的是「单一变量」的干净归因，混跑其它探针的写入会让判读失真）
          if [ "$DIAG_WP_ENABLE" = "1" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/openlist/diag_write_probe.sh" \
              "$DIAG_TARGET" "$OL_CONTAINER" "$DIAG_WP_DIR" || true
            echo ""
            echo "=========== 可写性判据报告尾部 ==========="
            tail -40 /tmp/ol_diag/writeprobe_report.txt 2>/dev/null || echo "(无报告文件)"
          elif [ "$DIAG_409_ENABLE" = "1" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/openlist/diag_409_semantics.sh" \
              "$DIAG_TARGET" "$OL_CONTAINER" || true
            echo ""
            echo "=========== 409 专项报告尾部 ==========="
            tail -40 /tmp/ol_diag/diag409_report.txt 2>/dev/null || echo "(无报告文件)"
          elif [ -n "$DIAG_REJECT_SRC" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/openlist/diag_reject.sh" \
              "$DIAG_TARGET" "$OL_CONTAINER" || true
            echo ""
            echo "=========== 拒收归因报告尾部 ==========="
            tail -40 /tmp/ol_diag/reject_report.txt 2>/dev/null || echo "(无报告文件)"
          else
            bash "$GITHUB_WORKSPACE/.github/scripts/openlist/diag_backend.sh" \
              "$DIAG_TARGET" "$OL_CONTAINER" || true
            echo ""
            echo "=========== 报告尾部 ==========="
            tail -40 /tmp/ol_diag/report.txt 2>/dev/null || echo "(无报告文件)"
          fi

      - name: 上传诊断报告
        if: always()
        # 报告已全量 tee 进 run 日志，artifact 只是方便取用；该 action 不可用时
        # 不该把整次诊断判失败
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ol-diag-report
          path: |
            /tmp/ol_diag/report.txt
            /tmp/ol_diag/reject_report.txt
            /tmp/ol_diag/diag409_report.txt
            /tmp/ol_diag/writeprobe_report.txt
            /tmp/ol_diag/container.log
          if-no-files-found: warn
          retention-days: 7

      - name: 收尾（容器日志兜底 + 打印）
        if: always()
        env:
          OL_CONTAINER: ${{ inputs.container }}
        run: |
          docker logs "$OL_CONTAINER" 2>&1 | tail -60 || true
          docker rm -f "$OL_CONTAINER" 2>/dev/null || true
