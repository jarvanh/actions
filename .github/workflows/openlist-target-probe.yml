# 目标端只读探针: 实测 wopan176Crypt/0 与 onedrive:0 的文件数/字节数
# 用途: 独立于同步运行取证"目标端是否在真实增长"。可与同步并行（不占 openlist-singleton 锁）。
# 注意: 探针容器使用 dropbox 上的 db 快照副本，只读操作+驱动token刷新，不回写 db。
# 结果: job 日志 + onedrive:/logs/verify/probe_*.log 留档 + artifact。
name: openlist-target-probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENLIST_ADMIN_PASSWORD: ${{ secrets.OPENLIST_ADMIN_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: 安装 rclone 与依赖
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          sudo apt-get update -qq || true
          sudo apt-get install -y jq || true

      - name: 写入 rclone 配置（含密钥掩码）
        env:
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE }}
        run: |
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG_SECRET
          EOF
          python3 "$GITHUB_WORKSPACE/.github/scripts/openlist/mask_rclone_config.py"

      - name: 拉起 OpenList 容器（探针专用实例）
        run: |
          sudo docker rm -f openlist 2>/dev/null || true
          sudo mkdir -p /opt/openlist-data
          sudo chmod 0777 /opt/openlist-data
          rclone copy dropbox:self-hosted/openlist/data /opt/openlist-data             --exclude "data.db-wal" --exclude "data.db-shm" --exclude "data.db-journal"
          sudo docker run -d --restart=unless-stopped -v /opt/openlist-data:/opt/openlist/data -p 5244:5244 -e PUID=0 -e PGID=0 -e UMASK=022 --name="openlist" openlistteam/openlist:latest

      - name: 就绪等待与驱动 token 刷新
        run: |
          source "$GITHUB_WORKSPACE/.github/scripts/openlist/load_all.sh"
          if wait_openlist_ready; then
            echo "OpenList 就绪"
          else
            echo "OpenList 未就绪"
            exit 1
          fi
          # 刷新驱动 token（探针 db 为快照副本，token 可能过期）
          _refresh_ol_drivers /tmp/refresh.log || true
          echo "驱动 token 已刷新"

      - name: 目标端实测（只读）
        run: |
          TS=@DS@(date -u +%Y%m%d_%H%M%S)
          REPORT="/tmp/probe_$TS.log"
          {
            echo "=== target probe $TS UTC (run $GITHUB_RUN_ID) ==="
            echo -n "[TARGET_SIZE] "
            rclone size openlist:wopan176Crypt/0 --json 2>&1
            echo -n "[SOURCE_SIZE] "
            rclone size onedrive:0 --json 2>&1
            echo "[TARGET_TOP_N] $(rclone lsf openlist:wopan176Crypt/0 2>/dev/null | wc -l)"
            echo "[TARGET_TOP_SAMPLE]"
            rclone lsf openlist:wopan176Crypt/0 2>/dev/null | head -8
          } | tee "$REPORT"
          rclone copyto "$REPORT" "onedrive:/logs/verify/probe_$TS.log" || true

      - name: 上传报告 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: /tmp/probe_*.log
          retention-days: 30
