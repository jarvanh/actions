# 目标端只读探针: 实测 wopan176Crypt/0 与 onedrive:0 的文件数/字节数
# 独立于同步 run（不占 openlist-singleton 锁）；经自有 OpenList 容器读取。
# 输出 [TARGET_SIZE]/[SOURCE_SIZE] JSON + onedrive:/logs/verify/probe_run_$GITHUB_RUN_ID.log + artifact。
name: openlist-target-probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENLIST_ADMIN_PASSWORD: ${{ secrets.OPENLIST_ADMIN_PASSWORD }}
      OPENLIST_PROBE_TIMEOUT: "15"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: 安装 rclone（GitHub Releases 直下）
        run: |
          set -e
          RVER=v1.71.2
          curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 300 \
            -o /tmp/rclone.deb \
            "https://github.com/rclone/rclone/releases/download/v1.71.2/rclone-v1.71.2-linux-amd64.deb"
          sudo dpkg -i /tmp/rclone.deb
          rclone version | head -2
          sudo apt-get update -qq || true
          sudo apt-get install -y jq fuse3 || true

      - name: 写入 rclone 配置（含密钥掩码）
        env:
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE }}
        run: |
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG_SECRET
          EOF
          python3 "$GITHUB_WORKSPACE/.github/scripts/openlist/mask_rclone_config.py"

      - name: 验证远端连通并挂载 Dropbox
        run: |
          rclone lsf onedrive: | head -3
          sudo mkdir -p /dropbox
          sudo nohup rclone mount dropbox: /dropbox --no-gzip-encoding --umask 000 --allow-other --attr-timeout 10m --vfs-cache-mode full --vfs-cache-max-age 5m --vfs-read-chunk-size-limit 10G --buffer-size 100M --vfs-cache-max-size 10G &

      - name: 拉起 OpenList 容器（探针实例）
        run: |
          sudo docker rm -f openlist 2>/dev/null || true
          sudo mkdir -p /opt/openlist-data
          sudo chmod 0777 /opt/openlist-data
          rclone copy dropbox:self-hosted/openlist/data /opt/openlist-data \
            --exclude "data.db-wal" --exclude "data.db-shm" --exclude "data.db-journal"
          sudo docker run -d --restart=unless-stopped -v /opt/openlist-data:/opt/openlist/data -p 5244:5244 -e PUID=0 -e PGID=0 -e UMASK=022 --name="openlist" openlistteam/openlist:latest

      - name: 就绪等待与驱动 token 刷新
        run: |
          source "$GITHUB_WORKSPACE/.github/scripts/openlist/load_all.sh"
          if wait_openlist_ready; then
            echo "OpenList 就绪"
          else
            echo "OpenList 未就绪"
            exit 1
          fi
          _refresh_ol_drivers /tmp/refresh.log || true
          echo "驱动 token 已刷新"

      - name: 目标端实测（只读）
        run: |
          REPORT="/tmp/probe_report.log"
          {
            echo "=== target probe run $GITHUB_RUN_ID ==="
            date -u
            echo -n "[TARGET_SIZE] "
            rclone size openlist:wopan176Crypt/0 --json 2>&1
            echo -n "[SOURCE_SIZE] "
            rclone size onedrive:0 --json 2>&1
            echo -n "[TARGET_TOP_N] "
            rclone lsf openlist:wopan176Crypt/0 2>/dev/null | wc -l
            echo "[TARGET_TOP_SAMPLE]"
            rclone lsf openlist:wopan176Crypt/0 2>/dev/null | head -5
          } | tee "$REPORT"
          rclone copyto "$REPORT" "onedrive:/logs/verify/probe_run_$GITHUB_RUN_ID.log" || true
          echo "probe done"

      - name: "Persist: openlist 数据库回传"
        if: ${{ always() }}
        run: |
          sudo docker stop openlist 2>/dev/null || true
          CUR_MD5=$(md5sum /opt/openlist-data/data.db 2>/dev/null | awk '{print $1}')
          CUR_MD5="${CUR_MD5:-none}"
          if [ "$CUR_MD5" != "${OPENLIST_DB_MD5_PULL:-none}" ] && [ -f /opt/openlist-data/data.db ]; then
            rclone sync /opt/openlist-data dropbox:self-hosted/openlist/data \
              --exclude "data.db-wal" --exclude "data.db-shm" --exclude "data.db-journal" || true
            echo "db 回传完成（如有变化）"
          else
            echo "db 未变化或不存在，跳过回传"
          fi

      - name: 上传报告 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: /tmp/probe_report.log
          retention-days: 30
