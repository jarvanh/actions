# 目标端只读探针: 实测 wopan176Crypt/0 的文件数与字节数
# 用途: 独立于同步运行，实时取证"目标端是否真有文件/是否在增长"。
# 设计: 不加 openlist-singleton 并发锁（可与同步并行）；只做 size/lsf 读操作；
#       不启动 OpenList 容器、不碰 wopan token（经现有 OpenList 服务读取）。
# 结果: 输出到 run artifact + onedrive:/logs/verify/ 留档（探针只读，可与同步并行）。
name: openlist-target-probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: 安装 rclone（GitHub Releases 直下）
        run: |
          set -e
          RVER=v1.71.2
          curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 300 \
            -o /tmp/rclone.deb \
            "https://github.com/rclone/rclone/releases/download/${RVER}/rclone-${RVER}-linux-amd64.deb"
          sudo dpkg -i /tmp/rclone.deb
          rclone version | head -2

      - name: 写入 rclone 配置（含密钥掩码）
        env:
          RCLONE_CONFIG_SECRET: *** secrets.RCLONE }}
        run: |
          mkdir -p ~/.config/rclone/
          cat << EOF > ~/.config/rclone/rclone.conf
          $RCLONE_CONFIG_SECRET
          EOF
          python3 "$GITHUB_WORKSPACE/.github/scripts/openlist/mask_rclone_config.py"

      - name: 目标端实测（只读）
        run: |
          TS=$(date -u +%Y%m%d_%H%M%S)
          REPORT="/tmp/probe_$TS.log"
          {
            echo "=== 目标端探针 $TS (UTC) ==="
            echo "run: $GITHUB_RUN_ID"
            echo ""
            echo "--- [目标] openlist:wopan176Crypt/0 rclone size ---"
            rclone size openlist:wopan176Crypt/0 --json 2>&1
            echo ""
            echo "--- [源端参照] onedrive:0 rclone size ---"
            rclone size onedrive:0 --json 2>&1
            echo ""
            echo "--- [目标] 顶层条目数 ---"
            rclone lsf openlist:wopan176Crypt/0 2>/dev/null | wc -l
            echo "--- [目标] 顶层条目样例(前10) ---"
            rclone lsf openlist:wopan176Crypt/0 2>/dev/null | head -10
          } | tee "$REPORT"
          # 留档到 onedrive:/logs/verify/（与 sync_state 不同子树，不干扰同步）
          rclone copyto "$REPORT" "onedrive:/logs/verify/$(basename "$REPORT")" || true

      - name: 上传报告 artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: /tmp/probe_*.log
          retention-days: 30
