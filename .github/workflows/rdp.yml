name: RDP

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '30 16 * * *'
  # watch:
  #   types: started

jobs:
  rdp:
    runs-on: windows-latest
    # GitHub 托管 runner 单任务上限 360 分钟（6 小时）
    timeout-minutes: 360
    # 防止并发运行（ngrok 免费版只允许 1 条在线隧道）
    concurrency:
      group: rdp-singleton
      cancel-in-progress: true

    steps:
    - name: Download ngrok
      run: Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip

    - name: Extract ngrok
      run: Expand-Archive ngrok.zip

    - name: Auth ngrok
      run: .\ngrok\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Set password
      run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText $Env:RDP_PASSWORD -Force)
      env:
        RDP_PASSWORD: "P@ssw0rd!"

    - name: Create Tunnel (background)
      run: Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389 --region in --log stdout --log-format term --log ngrok.log" -WindowStyle Hidden

    - name: Send RDP info to Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        RDP_PASSWORD: "P@ssw0rd!"
        TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        TG_RUN_STARTED_AT: ${{ github.run_started_at }}
      run: |
        $raw = ""
        $address = $null
        # 轮询 ngrok 本地 API（最多 2 分钟），tunnels 为空时也要 sleep 等隧道建立
        for ($i = 0; $i -lt 40; $i++) {
          Start-Sleep -Seconds 3
          try {
            $raw = Invoke-WebRequest -Uri "http://127.0.0.1:4040/api/tunnels" -UseBasicParsing -TimeoutSec 5
            $tunnels = ($raw.Content | ConvertFrom-Json).tunnels
            foreach ($t in @($tunnels)) {
              if ($t.public_url -like "tcp*") { $address = $t.public_url -replace "tcp://", "" }
            }
            if ($address) { break }
          } catch { }
        }
        # API 拿不到时，从 ngrok 日志兜底解析
        if (-not $address -and (Test-Path .\ngrok.log)) {
          $m = Select-String -Path .\ngrok.log -Pattern "url=tcp://(\S+)" | Select-Object -Last 1
          if ($m) { $address = $m.Matches[0].Groups[1].Value }
        }
        if (-not $address) {
          Write-Host "===== ngrok API 原始响应 ====="
          Write-Host $raw.Content
          Write-Host "===== ngrok.log ====="
          Get-Content .\ngrok.log -ErrorAction SilentlyContinue
          Write-Host "===== ngrok 进程 ====="
          Get-Process ngrok -ErrorAction SilentlyContinue | Format-List
          throw "无法获取 ngrok 隧道地址"
        }
        # 统一 HTML 版式 + 统一收尾区（修复 here-string 前导缩进问题，改用 `n 拼接）
        function Esc-Html([string]$s) {
          if (-not $s) { return $s }
          return ($s -replace '&','&amp;' -replace '<','&lt;' -replace '>','&gt;')
        }
        $sep = [string][char]0x2501 * 18
        $dur = "不足 1 分钟"
        try {
          $started = [DateTime]::Parse($Env:TG_RUN_STARTED_AT, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::RoundtripKind)
          $elapsed = [int]((Get-Date).ToUniversalTime() - $started.ToUniversalTime()).TotalMinutes
          if ($elapsed -ge 60) { $dur = "{0} 小时 {1} 分" -f [int][math]::Floor($elapsed / 60), ($elapsed % 60) }
          elseif ($elapsed -gt 0) { $dur = "$elapsed 分钟" }
        } catch { }
        $msg = "🖥️ <b>Windows RDP 已就绪</b>`n$sep`n" +
          "地址：<code>$(Esc-Html $address)</code>`n" +
          "用户名：<code>runneradmin</code>`n" +
          "密码：<code>$(Esc-Html $Env:RDP_PASSWORD)</code>`n" +
          "有效期：<i>约 6 小时（超时自动关机）</i>`n" +
          "连接方式：<i>Microsoft Remote Desktop / 任何 RDP 客户端，地址填上面这一行</i>`n" +
          "`n⏱ 已运行 <b>$dur</b> · 🔗 <a href=""$Env:TG_RUN_URL"">运行日志</a>"
        Invoke-RestMethod -Uri "https://api.telegram.org/bot$Env:TELEGRAM_BOT_TOKEN/sendMessage" `
          -Method Post -Body @{ chat_id = $Env:TELEGRAM_CHAT_ID; text = $msg; parse_mode = 'HTML'; disable_web_page_preview = 'true' }

    - name: Keep alive (6h)
      run: Start-Sleep -Seconds 21000
