name: RDP

on:
  # 默认关闭：只允许手动触发，且必须显式勾选 enable_rdp。
  # 该工作流会把 3389 经 ngrok 暴露到公网，禁止任何定时/事件自动拉起。
  workflow_dispatch:
    inputs:
      enable_rdp:
        description: "确认开启公网 RDP（ngrok tcp 3389，约 6 小时）。仅在确有需要时勾选。"
        required: true
        type: boolean
        default: false
  # schedule:
  #   - cron: '30 16 * * *'
  # watch:
  #   types: started

jobs:
  rdp:
    # 二次开关：未显式确认则整个 job 不运行（默认公网暴露 = 关闭）
    if: ${{ inputs.enable_rdp == true }}
    runs-on: windows-latest
    # GitHub 托管 runner 单任务上限 360 分钟（6 小时）
    timeout-minutes: 360
    # 防止并发运行（ngrok 免费版只允许 1 条在线隧道）
    concurrency:
      group: rdp-singleton
      cancel-in-progress: true

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Download ngrok
      run: Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip

    - name: Extract ngrok
      run: Expand-Archive ngrok.zip

    - name: Auth ngrok
      run: .\ngrok\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Validate strong RDP password
      # 强认证闸：公网 3389 只靠密码，弱口令等于把 runner 交给扫描器。
      # 至少 16 位且覆盖大小写/数字/符号中的 3 类，否则拒绝开启隧道。
      shell: pwsh
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      run: |
        $pw = $Env:RDP_PASSWORD
        if ([string]::IsNullOrEmpty($pw) -or $pw.Length -lt 16) {
          throw "RDP_PASSWORD 未配置或长度 < 16，拒绝开启公网 RDP"
        }
        $classes = 0
        if ($pw -cmatch '[a-z]') { $classes++ }
        if ($pw -cmatch '[A-Z]') { $classes++ }
        if ($pw -match '[0-9]') { $classes++ }
        if ($pw -match '[^A-Za-z0-9]') { $classes++ }
        if ($classes -lt 3) {
          throw "RDP_PASSWORD 复杂度不足（需覆盖大小写/数字/符号中至少 3 类），拒绝开启公网 RDP"
        }
        Write-Host "RDP 密码强度校验通过（长度 $($pw.Length)，字符类别 $classes/4）"

    - name: Set password
      run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText $Env:RDP_PASSWORD -Force)
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    - name: Create Tunnel (background)
      run: Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389 --region in --log stdout --log-format term --log ngrok.log" -WindowStyle Hidden

    - name: Send RDP info to Telegram
      # 隧道步骤失败也要把已拿到的 RDP 入口发出去；缺 always() 时入口信息会整段静默。
      if: ${{ always() }}
      shell: pwsh
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 重要档凭据（RDP 入口通知 tier=alert 直达 @SaberFuckBot，无回落）
        TELEGRAM_BOT_TOKEN_ALERT: ${{ secrets.TELEGRAM_BOT_TOKEN_ALERT }}
        TELEGRAM_CHAT_ID_ALERT: ${{ secrets.TELEGRAM_CHAT_ID_ALERT }}
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        TG_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        $raw = ""
        $address = $null
        # 轮询 ngrok 本地 API（最多 2 分钟），tunnels 为空时也要 sleep 等隧道建立
        for ($i = 0; $i -lt 40; $i++) {
          Start-Sleep -Seconds 3
          try {
            $raw = Invoke-WebRequest -Uri "http://127.0.0.1:4040/api/tunnels" -UseBasicParsing -TimeoutSec 5
            $tunnels = ($raw.Content | ConvertFrom-Json).tunnels
            foreach ($t in @($tunnels)) {
              if ($t.public_url -like "tcp*") { $address = $t.public_url -replace "tcp://", "" }
            }
            if ($address) { break }
          } catch { }
        }
        # API 拿不到时，从 ngrok 日志兜底解析
        if (-not $address -and (Test-Path .\ngrok.log)) {
          $m = Select-String -Path .\ngrok.log -Pattern "url=tcp://(\S+)" | Select-Object -Last 1
          if ($m) { $address = $m.Matches[0].Groups[1].Value }
        }
        if (-not $address) {
          Write-Host "===== ngrok API 原始响应 ====="
          Write-Host $raw.Content
          Write-Host "===== ngrok.log ====="
          Get-Content .\ngrok.log -ErrorAction SilentlyContinue
          Write-Host "===== ngrok 进程 ====="
          Get-Process ngrok -ErrorAction SilentlyContinue | Format-List
          throw "无法获取 ngrok 隧道地址"
        }
        # 排版助手 + 发送层真源（pwsh 版，与 bash tg_notify.sh 同语义: 429 重试、解析失败抛出）
        . "$env:GITHUB_WORKSPACE\.github\scripts\telegram\tg_notify.ps1"
        # 自检: dot-source 失败会让后续调用未定义函数而静默无通知，显式暴露
        if (-not (Get-Command Send-TgMessage -ErrorAction SilentlyContinue)) { throw "tg_notify.ps1 加载失败" }
        # 版式与 tailscale-windows.yml 入口通知同款：分节 · N + 树形条目 + 说明段
        # （规范 · 分节、条目与树形）
        $msg = "🖥️ Windows RDP 已就绪`n$TG_SEP`n" +
          # 分节 emoji 不与标题重复（标题已是 🖥️），否则首行与分节视觉粘连
          "🔐 RDP · 3`n" +
          "<code>  ├─ </code>地址：<code>$(Esc-Html $address)</code>`n" +
          "<code>  ├─ </code>用户名：<code>runneradmin</code>`n" +
          "<code>  └─ </code>密码：<code>$(Esc-Html $Env:RDP_PASSWORD)</code>`n" +
          # 措辞与 tailscale-windows.yml 同款（同为 6h 上限）：runner 是被取消而非关机
          "`n有效期：约 6 小时 · 超时自动结束"
        $msg += "`n`nℹ️ 连接方式：Microsoft Remote Desktop / 任何 RDP 客户端，地址填上面这一行"
        $footer = Get-TgFooter
        if ($footer) { $msg += "`n`n$footer" }
        Send-TgMessage $msg "alert"

    - name: Keep alive (6h)
      run: Start-Sleep -Seconds 21000
