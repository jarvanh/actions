name: cfip-pool

# 为什么要有它（2026-10-26）：proxyip.881288.xyz 的 D1 免费额度超限时会把错误文本
# 混进列表，订阅侧拿到非 IP 行就整段解析失败（10-21 因此被禁用，可用节点随之变少）。
# 这里每 6 小时重建一次优选 IP 池：镜像 881288 六地区 + 公共源 + 自扫（CloudflareSpeedTest），
# 逐行校验后发布到 secret gist，供订阅侧直接引用。

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency: cfip-pool

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 抓取并校验 IP 源
        run: python3 .github/scripts/cfip/build_pool.py --out out

      # 为什么走 exit node（2026-10-26）：Azure runner 在弗吉尼亚，测出来的「速度」只代表
      # 机房到 CF 的回源速度，跟实际使用地（国内）无关。autoclaw 是 tailnet 里已批准
      # 的 exit node（tag:ci，AllowedIPs 含 0.0.0.0/0），把自扫流量从它出去更接近真实链路。
      # 失败不影响主流程：拿不到 exit node 就退回本机直连自扫。
      - name: 加入 Tailscale（可选，exit node = autoclaw）
        id: ts
        continue-on-error: true
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          args: --exit-node=100.90.2.41 --exit-node-allow-lan-access

      - name: 确认出口 IP
        if: ${{ steps.ts.outcome == 'success' }}
        run: |
          tailscale status | head -3 || true
          echo "出口 IP: $(curl -sS -m 10 https://ipinfo.io/ip || echo 获取失败)"

      - name: 自扫（CloudflareSpeedTest）
        run: |
          set -e
          curl -sSL --retry 3 -o cfst.tar.gz \
            https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz
          tar -xzf cfst.tar.gz
          # 压缩包里是 cfst_linux_amd64/cfst，不能直接 ./cfst
          BIN=$(find . -maxdepth 2 -type f -name cfst | head -1)
          chmod +x "$BIN"
          # 自扫只用 IP（端口固定 443），限 200 个，控制运行时长
          awk -F: '{print $1}' out/cfip-all.txt | sort -u | head -200 > candidates.txt
          wc -l candidates.txt
          # 必须显式指定测速地址：CFST 默认值 https://cf.xiu2.xyz/url 在 Azure runner 上不可用，
          # 不传的话下载测速会全部归零（2026-10-26 实测）；单次 10MB 足够且不会被 CF 拒。
          "$BIN" -f candidates.txt -o cfst.csv -p 443 -t 20 -n 20 \
            -url 'https://speed.cloudflare.com/__down?bytes=10000000' || true
          if [ -f cfst.csv ]; then head -3 cfst.csv; else echo "cfst 未产出结果，跳过自扫合并"; fi

      - name: 恢复直连（清 exit node）
        if: always()
        run: sudo tailscale set --exit-node= 2>/dev/null || true

      - name: 合并并上传 Gist
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          GIST_ID: ${{ vars.CFIP_GIST_ID }}
        run: |
          set -e
          python3 .github/scripts/cfip/build_pool.py --out out --cfst cfst.csv
          test "$(wc -l < out/cfip-all.txt)" -ge 20 || { echo "::error::池子条目过少"; exit 1; }
          for f in out/cfip-*.txt; do
            name=$(basename "$f")
            if [ ! -s "$f" ]; then echo "空文件跳过 $name"; continue; fi
            cur=$(gh api "gists/$GIST_ID" --jq ".files[\"$name\"].content" 2>/dev/null || true)
            if [ "$cur" = "$(cat "$f")" ]; then
              echo "未变化 $name"
              continue
            fi
            jq -n --arg n "$name" --arg c "$(cat "$f")" '{files:{($n):{content:$c}}}' > payload.json
            gh api -X PATCH "gists/$GIST_ID" --input payload.json >/dev/null
            echo "已更新 $name"
          done
