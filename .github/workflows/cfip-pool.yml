name: cfip-pool

# 为什么要有它（2026-10-26）：proxyip.881288.xyz 的 D1 免费额度超限时会把错误文本
# 混进列表，订阅侧拿到非 IP 行就整段解析失败（10-21 因此被禁用，可用节点随之变少）。
# 这里每 6 小时重建一次优选 IP 池：镜像 881288 六地区 + 公共源 + 自扫（CloudflareSpeedTest），
# 逐行校验后发布到 secret gist，供订阅侧直接引用。
#
# 自扫跑在哪（2026-10-26）：优先 SSH 到 tailnet 里的 autoclaw（阿里云北京），测出来是
# 国内真实链路；SSH 不可用时退回 runner 本机直连（弗吉尼亚机房，只代表回源速度）。

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency: cfip-pool

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 抓取并校验 IP 源
        run: python3 .github/scripts/cfip/build_pool.py --out out

      - name: 加入 Tailscale（用于 SSH 到 autoclaw）
        id: ts
        continue-on-error: true
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: 在 autoclaw 上自扫（国内真实链路）
        if: ${{ steps.ts.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -e
          python3 .github/scripts/cfip/gen_candidates.py > candidates.txt
          wc -l candidates.txt
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -q candidates.txt root@100.90.2.41:/tmp/candidates.txt
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@100.90.2.41 '
            set -e
            cd /tmp
            if [ ! -x cfst ]; then
              # autoclaw 在国内，GitHub 直连慢，走镜像；只用一次，后续复用
              curl -sSL --max-time 180 -o cfst.tar.gz \
                https://ghfast.top/https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz
              tar -xzf cfst.tar.gz
            fi
            cd /tmp/cfst_linux_amd64
            chmod +x cfst
            # 40 个固定 CF 段候选 + 只测前 10 个下载，整轮 2-3 分钟
            ./cfst -f /tmp/candidates.txt -o /tmp/out.csv -p 443 -t 20 -n 10 -tl 800 \
              -url "https://speed.cloudflare.com/__down?bytes=10000000" || true
          '
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -q root@100.90.2.41:/tmp/out.csv cfst.csv
          echo "CFST_LABEL=cfst-aliyun" >> "$GITHUB_ENV"
          head -3 cfst.csv

      - name: 本机自扫（autoclaw 不可用时的兜底）
        if: ${{ !hashFiles('cfst.csv') }}
        run: |
          set -e
          curl -sSL --retry 3 -o cfst.tar.gz \
            https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz
          tar -xzf cfst.tar.gz
          BIN=$(find . -maxdepth 2 -type f -name cfst | head -1)
          chmod +x "$BIN"
          python3 .github/scripts/cfip/gen_candidates.py > candidates.txt
          "$BIN" -f candidates.txt -o cfst.csv -p 443 -t 20 -n 10 -tl 800 \
            -url 'https://speed.cloudflare.com/__down?bytes=10000000' || true
          echo "CFST_LABEL=cfst-azure" >> "$GITHUB_ENV"
          if [ -f cfst.csv ]; then head -3 cfst.csv; else echo "cfst 未产出结果，跳过自扫合并"; fi

      - name: 合并并上传 Gist
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          GIST_ID: ${{ vars.CFIP_GIST_ID }}
        run: |
          set -e
          python3 .github/scripts/cfip/build_pool.py --out out --cfst cfst.csv --cfst-label "${CFST_LABEL:-cfst-local}"
          test "$(wc -l < out/cfip-all.txt)" -ge 20 || { echo "::error::池子条目过少"; exit 1; }
          for f in out/cfip-*.txt; do
            name=$(basename "$f")
            if [ ! -s "$f" ]; then echo "空文件跳过 $name"; continue; fi
            cur=$(gh api "gists/$GIST_ID" --jq ".files[\"$name\"].content" 2>/dev/null || true)
            if [ "$cur" = "$(cat "$f")" ]; then
              echo "未变化 $name"
              continue
            fi
            jq -n --arg n "$name" --arg c "$(cat "$f")" '{files:{($n):{content:$c}}}' > payload.json
            gh api -X PATCH "gists/$GIST_ID" --input payload.json >/dev/null
            echo "已更新 $name"
          done
