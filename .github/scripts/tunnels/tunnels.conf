# 统一隧道清单（由 .github/scripts/tunnels/tunnels.sh 读取）
# 格式: 名字|cloudflared 参数|源站端口(用于就绪判断，留空则不判断)
#
# 名字必须用 workflow 里 `cloudflared tunnel route dns` 注册的**真实隧道名**，
# 否则 cloudflared 会去连一个不存在的隧道 ID。
#
# === openclaw runner ===
# oc 不做端口预检（第三字段留空）：workflow 中它的收敛步骤在 OpenClaw 启动前执行，
# 此时 18789 必然未监听，预检会导致隧道被跳过、永远起不来。cloudflared 对源站
# 未就绪本身会自动重试，与原 nohup 行为一致。
ai-api|--protocol http2 --url http://127.0.0.1:8317 ai-api|8317
oc|--url http://127.0.0.1:18789 oc|
syncthing|--url http://127.0.0.1:8384 syncthing|8384
#
# === 其他 workflow runner（源站就绪后自动纳管）===
sub-store|--url http://127.0.0.1:3001 sub-store|3001
ql|--url http://127.0.0.1:5700 ql|5700
subs-check|--url http://127.0.0.1:8199 subs-check|8199
home|--url http://127.0.0.1:8123 home|8123
openlist|--url http://127.0.0.1:5244 openlist|5244
j|--url http://127.0.0.1:8096 j|8096
t|--url http://127.0.0.1:5900 t|5900
p|--url http://127.0.0.1:5600 p|5600
#
# 注：emby(e) 为 8095/8096 双端口，且其 watchdog 会主动 pkill 做 302→direct
#     回退，与 Restart=always 语义冲突，暂不纳管。
